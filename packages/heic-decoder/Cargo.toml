[package]
name = "stella-heic-decoder"
version = "0.0.1"
edition = "2024"
description = "Bounded HEIC/HEIF preview decoder"
license = "Apache-2.0"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[lints.clippy]
all = { level = "warn", priority = -1 }
cast_lossless = "warn"
dbg_macro = "deny"
implicit_clone = "warn"
print_stdout = "warn"
print_stderr = "warn"
uninlined_format_args = "warn"
unwrap_used = "deny"

[lints.rust]
unsafe_code = "forbid"

[lints.rustdoc]
bare_urls = "deny"
broken_intra_doc_links = "deny"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
incremental = false

[dependencies]
# Decoding only: the encoder feature is off.
heifer = { version = "=0.5.1", default-features = false }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "=0.2.130"

[dev-dependencies]
# Tests build their inputs with the same crate's encoder, so no third-party
# photo is ever committed.
heifer = { version = "=0.5.1", default-features = true }
