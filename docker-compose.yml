x-quickwit09-index-root-uri: &quickwit09-index-root-uri s3://stella-quickwit-09/indexes

services:
  postgres:
    profiles: [dev]
    # Keep dev aligned with infra. Postgres 18 expects the volume
    # mounted at /var/lib/postgresql, not /var/lib/postgresql/data.
    # After switching from the old layout, recreate local pgdata with
    # `bun run --cwd apps/api docker:reset-dev`.
    image: postgres:18.6@sha256:4ef4dbc939d61acea57712655ddb4b4ab27419c913f94cca0cd57cb3ea3c2280
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: stella
    ports:
      - "${STELLA_PG_HOST_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      # Exec directly: if Docker times out a shell health check, its orphaned
      # child can be reaped by the Postgres PID 1 as a failed server process.
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  rustfs:
    profiles: [dev]
    image: rustfs/rustfs:1.0.0-rc.5@sha256:c36b3efea3d1e503f1a2581abd0e7611e0e5820dd30e1850a52384b3fc52bda4
    command: /data
    environment:
      RUSTFS_ACCESS_KEY: stella-rustfs-dev
      RUSTFS_SECRET_KEY: stella-rustfs-dev-secret
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_ADDRESS: ":9000"
      RUSTFS_CONSOLE_ADDRESS: ":9001"
      # Presigned browser requests carry authorization in the URL, not cookies.
      # This service is loopback-only; production must allow exact web origins.
      RUSTFS_CORS_ALLOWED_ORIGINS: "*"
      RUSTFS_OBS_LOGGER_LEVEL: error
    ports:
      - "127.0.0.1:${STELLA_RUSTFS_HOST_PORT:-9000}:9000"
      - "127.0.0.1:${STELLA_RUSTFS_CONSOLE_PORT:-9001}:9001"
    volumes:
      # Never mount the former MinIO volume: the on-disk layouts differ.
      - rustfsdata:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/health"]
      interval: 5s
      timeout: 5s
      retries: 5

  rustfs-setup:
    profiles: [dev]
    # One-shot bucket bootstrap over RustFS's S3 API. The AWS CLI is the
    # maintained generic client; the MinIO client it replaces is no longer
    # published.
    image: amazon/aws-cli:2.36.44@sha256:e8467f2c319f9bc9a1471808a69949a76915e9c95eaf4a09ece9f9e85fd32747
    depends_on:
      rustfs:
        condition: service_healthy
    environment:
      AWS_ACCESS_KEY_ID: stella-rustfs-dev
      AWS_SECRET_ACCESS_KEY: stella-rustfs-dev-secret
      AWS_DEFAULT_REGION: us-east-1
      AWS_ENDPOINT_URL: http://rustfs:9000
      QUICKWIT09_INDEX_ROOT_URI: *quickwit09-index-root-uri
    entrypoint: >
      /bin/sh -c "
      quickwit09_bucket=$${QUICKWIT09_INDEX_ROOT_URI#s3://} &&
      quickwit09_bucket=$${quickwit09_bucket%%/*} &&
      for bucket in stella stella-legal-corpus $${quickwit09_bucket}; do
      aws s3api head-bucket --bucket $${bucket} 2>/dev/null ||
      aws s3 mb s3://$${bucket} || exit 1;
      done
      "

  valkey:
    profiles: [dev]
    image: valkey/valkey:9.1.1-alpine@sha256:ee91f7a174ac4d6a6b0685b3a60e321f0a9dbbb691f9b0e285be2ba1d1be8328
    ports:
      - "${STELLA_VALKEY_HOST_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  gotenberg:
    profiles: [dev]
    image: gotenberg/gotenberg:8.36.0@sha256:87c16b9f364279d321bc9772d31fa58aa6abe036423c270698bd636c3a8e9466
    # If you see "context deadline exceeded" or multi-threading errors, add
    # command: ["gotenberg", "--libreoffice-restart-after=1"]. See
    # https://github.com/gotenberg/gotenberg/issues/1452.
    ports:
      - "${STELLA_GOTENBERG_HOST_PORT:-3003}:3000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Search engine for the legal corpus. Opt-in:
  #   docker compose --profile dev --profile quickwit09 up
  # Point mutations at http://127.0.0.1:7290 through
  # CORPUS_INDEX_Q09_ENDPOINT.
  #
  # The tag tracks the deployed engine version: an index created locally has to
  # be one a deployed node can open, and doc-mapping features differ between
  # minor releases.
  quickwit09-postgres-setup:
    profiles: [quickwit09]
    image: postgres:18.6@sha256:4ef4dbc939d61acea57712655ddb4b4ab27419c913f94cca0cd57cb3ea3c2280
    environment:
      PGPASSWORD: postgres
    depends_on:
      postgres:
        condition: service_healthy
    entrypoint:
      - /bin/sh
      - -ec
      - |
        if ! psql -h postgres -U postgres -d postgres -tAc \
          "SELECT 1 FROM pg_database WHERE datname = 'stella_quickwit_09'" | grep -qx 1; then
          createdb -h postgres -U postgres stella_quickwit_09
        fi

  quickwit09:
    profiles: [quickwit09]
    image: quickwit/quickwit:0.9.0@sha256:1e6169bf4e98a489fca397105f1698c1d80a0f9779f3cf652973bac8a0c3b2bd
    command: run
    environment:
      QW_CLUSTER_ID: stella-local-q09
      QW_METASTORE_URI: postgres://postgres:postgres@postgres:5432/stella_quickwit_09
      QW_DEFAULT_INDEX_ROOT_URI: *quickwit09-index-root-uri
      AWS_ACCESS_KEY_ID: stella-rustfs-dev
      AWS_SECRET_ACCESS_KEY: stella-rustfs-dev-secret
      AWS_REGION: us-east-1
      QW_S3_ENDPOINT: http://rustfs:9000
      QW_S3_FORCE_PATH_STYLE_ACCESS: "true"
    ports:
      - "127.0.0.1:${STELLA_QUICKWIT_Q09_REST_PORT:-7290}:7280"
      - "127.0.0.1:${STELLA_QUICKWIT_Q09_GRPC_PORT:-7291}:7281"
    depends_on:
      quickwit09-postgres-setup:
        condition: service_completed_successfully
      rustfs-setup:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7280/health/livez"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
  rustfsdata:
