<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title data-message="uploadDocumentTitle"></title>
  </head>
  <body>
    <div id="app">
      <h1 data-message="uploadTitle" id="title"></h1>
      <p data-message="connecting" id="target"></p>
      <label class="picker">
        <span data-message="file"></span>
        <input id="file" type="file" />
      </label>
      <button
        data-message="uploadVersion"
        id="upload"
        type="button"
        disabled
      ></button>
      <p id="status" role="status" aria-live="polite"></p>
    </div>
    <script type="module" src="./app.ts"></script>
  </body>
</html>
