<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Compare two files</title>
  </head>
  <body>
    <main id="app" aria-labelledby="title">
      <h1 id="title">Compare two files</h1>
      <p class="note">
        Both files stay temporary: they never become a document or matter
        content.
      </p>
      <label class="picker">
        <span>Original</span>
        <input id="base" type="file" accept=".docx" />
      </label>
      <label class="picker">
        <span>Revised</span>
        <input id="target" type="file" accept=".docx" />
      </label>
      <button id="upload" type="button" disabled>Upload for redline</button>
      <p id="status" role="status" aria-live="polite"></p>
    </main>
    <script type="module" src="./app.ts"></script>
  </body>
</html>
