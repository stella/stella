<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title data-message="comparisonTitle"></title>
  </head>
  <body>
    <div id="app">
      <h1 data-message="comparisonTitle" id="title"></h1>
      <p class="note" data-message="comparisonNote"></p>
      <label class="picker">
        <span data-message="original"></span>
        <input id="base" type="file" accept=".docx" />
      </label>
      <label class="picker">
        <span data-message="revised"></span>
        <input id="target" type="file" accept=".docx" />
      </label>
      <button
        data-message="uploadForRedline"
        id="upload"
        type="button"
        disabled
      ></button>
      <p id="status" role="status" aria-live="polite"></p>
    </div>
    <script type="module" src="./app.ts"></script>
  </body>
</html>
