[advisories]
unused-ignored-advisory = "deny"
ignore = [
  # Pulled through the GTK3 macro stack; no safe upgrade is available in the
  # current Tauri graph.
  "RUSTSEC-2024-0370",
  # chrono is marked unmaintained with no successor release. It reaches the
  # graph through tauri-utils (serde_with) as well as the app's own date
  # handling, so replacing the app's use alone would not remove it.
  # Review by 2026-11-24.
  "RUSTSEC-2026-0543",
  # zbus_names, zvariant and zvariant_derive were folded into zbus 6. The graph
  # still reaches zbus 5 through tauri-plugin-opener, single-instance,
  # notify-rust and the keyring store, none of which accept zbus 6 yet.
  # Review by 2026-11-16; remove once those owners move to zbus 6.
  "RUSTSEC-2026-0370",
  "RUSTSEC-2026-0371",
  "RUSTSEC-2026-0372",
]

[licenses]
allow = [
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "BSL-1.0",
  "CDLA-Permissive-2.0",
  "CC0-1.0",
  "ISC",
  "MIT",
  "MPL-2.0",
  "Unicode-3.0",
  "Zlib",
]
confidence-threshold = 0.8

[bans]
wildcards = "deny"
multiple-versions = "warn"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
