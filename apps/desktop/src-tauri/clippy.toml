# Ban the types too: Default::default() and imported aliases must not create
# an anonymous client around the constructor guard. Only http_client allows them.
disallowed-types = [
  { path = "reqwest::Client", reason = "use http_client::DesktopHttpClient" },
  { path = "reqwest::ClientBuilder", reason = "configure http_client::HttpClientOptions" },
  { path = "tauri::tray::TrayIcon", reason = "native tray handles stay in the main-thread tray owner" },
  { path = "tauri::tray::TrayIconBuilder", reason = "native tray construction stays in the main-thread tray owner" },
]
