# Webview windows have one owner, `app_window`, which pins them to the app
# origin; the raw constructors are banned elsewhere.
#
# Screen selection has one owner: `window_placement`. The raw placement APIs
# are banned everywhere else so a second "which screen" rule cannot appear;
# the owner carries the only `allow`.
disallowed-methods = [
  { path = "tauri::webview::WebviewWindowBuilder::new", reason = "use app_window::builder so every window stays on the app origin" },
  { path = "tauri::webview::WebviewWindowBuilder::from_config", reason = "use app_window::builder so every window stays on the app origin" },
  { path = "tauri::webview::WebviewBuilder::new", reason = "use app_window::builder so every window stays on the app origin" },
  { path = "tauri::webview::WebviewBuilder::from_config", reason = "use app_window::builder so every window stays on the app origin" },
  { path = "reqwest::Client::new", reason = "use http_client::DesktopHttpClient so desktop HTTP identity cannot be omitted" },
  { path = "reqwest::Client::builder", reason = "use http_client::DesktopHttpClient so desktop HTTP identity cannot be omitted" },
  { path = "reqwest::ClientBuilder::new", reason = "use http_client::DesktopHttpClient so desktop HTTP identity cannot be omitted" },
  { path = "reqwest::get", reason = "use http_client::DesktopHttpClient so desktop HTTP identity cannot be omitted" },
  { path = "tauri::webview::WebviewWindowBuilder::center", reason = "use window_placement::centered_on_target_screen" },
  { path = "tauri::webview::WebviewWindow::center", reason = "position from window_placement::target_work_area" },
  { path = "tauri::window::WindowBuilder::center", reason = "use window_placement::centered_on_target_screen" },
  { path = "tauri::window::Window::center", reason = "position from window_placement::target_work_area" },
  { path = "tauri::App::cursor_position", reason = "screen selection lives in window_placement" },
  { path = "tauri::App::monitor_from_point", reason = "screen selection lives in window_placement" },
  { path = "tauri::App::primary_monitor", reason = "screen selection lives in window_placement" },
