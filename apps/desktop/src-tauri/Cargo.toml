[package]
name = "stella-desktop"
version = "0.0.1"
edition = "2024"
description = "stella desktop — managed Office file editing for stella"
license = "Apache-2.0"

[lib]
name = "stella_desktop_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[[bin]]
name = "stella-desktop"
path = "src/main.rs"

[lints.clippy]
all = { level = "warn", priority = -1 }
cast_lossless = "warn"
dbg_macro = "deny"
doc_link_with_quotes = "warn"
filter_map_next = "warn"
flat_map_option = "warn"
implicit_clone = "warn"
inefficient_to_string = "warn"
manual_is_variant_and = "warn"
manual_let_else = "warn"
match_wildcard_for_single_variants = "warn"
needless_continue = "warn"
needless_pass_by_ref_mut = "warn"
needless_raw_string_hashes = "deny"
ptr_as_ptr = "warn"
print_stdout = "warn"
print_stderr = "warn"
uninlined_format_args = "warn"
unnecessary_wraps = "warn"
unused_async = "warn"
unused_self = "warn"
used_underscore_binding = "warn"

[lints.rust]
unsafe_code = "forbid"

# The raw AppKit/WebKit calls this crate cannot express without `unsafe` live
# in the workspace member below, behind a safe API.
[workspace]
members = ["crates/macos-park"]

[lints.rustdoc]
bare_urls = "deny"
broken_intra_doc_links = "deny"

[profile.release]
panic = "unwind"
lto = true
codegen-units = 1
opt-level = "s"
strip = true
incremental = false

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [
  "macos-private-api",
  "tray-icon",
  "webview-data-url",
] }
tauri-plugin-autostart = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-deep-link = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-notification = "2"
tauri-plugin-opener = "2"
tauri-plugin-process = "2"
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }
tauri-plugin-updater = "2"
axum = "0.8"
aes-gcm = "0.11"
ammonia = "4"
base64 = "0.23"
chrono = { version = "0.4", features = ["serde"] }
clipboard-rs = { version = "0.3.5", default-features = false, features = [
  "image",
] }
csscolorparser = "=0.8.4"
dirs = "6"
futures-util = "0.3"
hex = "0.4"
image = { version = "0.25", default-features = false, features = [
  "ico",
  "png",
  "tiff",
] }
keyring-core = "1"
opener = "0.8"
notify = "8"
reqwest = { version = "0.13", features = ["json", "multipart", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sys-locale = "0.3"
sha2 = "0.11"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4"] }
zip = { version = "8.6.0", default-features = false }

[target.'cfg(target_os = "linux")'.dependencies]
zbus-secret-service-keyring-store = { version = "1", features = [
  "crypto-rust",
] }

[target.'cfg(target_os = "macos")'.dependencies]
apple-native-keyring-store = { version = "1", features = ["keychain"] }
icns = { version = "0.4", default-features = false, features = ["pngio"] }
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = [
  "NSApplication",
  "NSEvent",
  "NSPasteboard",
  "NSRunningApplication",
  "NSScreen",
  "NSWorkspace",
  "libc",
] }
objc2-foundation = { version = "0.3", default-features = false, features = [
  "NSData",
  "NSGeometry",
  "NSString",
  "NSURL",
] }
plist = "1.10"
stella-desktop-macos = { path = "crates/macos-park", version = "0.0.1" }

[target.'cfg(target_os = "windows")'.dependencies]
clipboard-win = "5.4.1"
windows-icons = "0.4.0"
windows-native-keyring-store = "1"
winsafe = { version = "0.0.28", features = ["kernel", "user", "version"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
ts-rs = "12.0.1"
