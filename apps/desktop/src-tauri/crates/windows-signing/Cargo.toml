[package]
name = "stella-desktop-windows-signing"
version = "0.0.1"
edition = "2024"
description = "Safe wrappers over the raw CryptoAPI and CNG calls behind PDF signing"
license = "Apache-2.0"
publish = false

[lints.clippy]
all = { level = "warn", priority = -1 }
undocumented_unsafe_blocks = "deny"

[lints.rustdoc]
bare_urls = "deny"
broken_intra_doc_links = "deny"

[dependencies]
stella-desktop-signing-core = { path = "../signing-core", version = "0.0.1" }

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_Security_Cryptography",
] }

[target.'cfg(target_os = "windows")'.dev-dependencies]
ring = "0.17"
