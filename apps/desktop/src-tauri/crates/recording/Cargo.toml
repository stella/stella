[package]
name = "stella-desktop-recording"
version = "0.0.1"
edition = "2024"
description = "Reads a recording into 16 kHz mono pieces a transcription takes: format detection, decoding, resampling and cutting at pauses"
license = "Apache-2.0"
publish = false

[lints.clippy]
all = { level = "warn", priority = -1 }
let_underscore_must_use = "deny"
map_err_ignore = "deny"
await_holding_lock = "deny"
significant_drop_in_scrutinee = "deny"
significant_drop_tightening = "warn"
unused_result_ok = "deny"

[lints.rust]
unsafe_code = "forbid"

[lints.rustdoc]
bare_urls = "deny"
broken_intra_doc_links = "deny"

# Symphonia (MPL-2.0) decodes the containers and codecs below in pure Rust.
# Opus has no Symphonia decoder; `opus-decoder` (MIT OR Apache-2.0) decodes
# the packets Symphonia's Ogg and MKV readers hand out.
[dependencies]
opus-decoder = "=0.1.1"
symphonia = { version = "0.6.1", default-features = false, features = [
  "aac",
  "adpcm",
  "aiff",
  "alac",
  "caf",
  "flac",
  "isomp4",
  "mkv",
  "mp3",
  "ogg",
  "pcm",
  "vorbis",
  "wav",
] }
