[package]
name = "stella-desktop-signing-core"
version = "0.0.1"
edition = "2024"
description = "The platform-independent half of PDF signing: which certificates may sign, and the shape every platform signer shares"
license = "Apache-2.0"
publish = false

[lints.clippy]
all = { level = "warn", priority = -1 }
map_err_ignore = "deny"
await_holding_lock = "deny"
significant_drop_in_scrutinee = "deny"
significant_drop_tightening = "warn"
unused_result_ok = "deny"

[lints.rust]
unsafe_code = "forbid"

[lints.rustdoc]
bare_urls = "deny"
broken_intra_doc_links = "deny"

[dependencies]
hex = "0.4"
sha2 = "0.11"

[dev-dependencies]
ring = "0.17"
