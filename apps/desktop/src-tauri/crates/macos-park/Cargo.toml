[package]
name = "stella-desktop-macos"
version = "0.0.1"
edition = "2024"
description = "Safe wrappers for local desktop window presentation and activity metadata"
license = "Apache-2.0"
publish = false

[lints.clippy]
all = { level = "warn", priority = -1 }
map_err_ignore = "deny"
await_holding_lock = "deny"
significant_drop_in_scrutinee = "deny"
significant_drop_tightening = "warn"
unused_result_ok = "deny"
undocumented_unsafe_blocks = "deny"

[lints.rustdoc]
bare_urls = "deny"
broken_intra_doc_links = "deny"

[dependencies]
tauri = "2"

[[test]]
name = "panel_lifecycle"
harness = false

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6"
core-foundation = "0.10"
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = [
  "NSApplication",
  "NSPanel",
  "NSResponder",
  "NSView",
  "NSWindow",
] }
objc2-core-foundation = { version = "0.3", default-features = false, features = ["CFBase", "CFNumber", "CFPreferences", "CFString", "std"] }
objc2-foundation = { version = "0.3", default-features = false, features = [
  "NSBundle",
  "NSError",
  "NSString",
  "NSURL",
] }
objc2-service-management = { version = "0.3", default-features = false, features = ["SMAppService", "objc2", "objc2-foundation", "std"] }
objc2-user-notifications = { version = "0.3", default-features = false, features = ["UNNotificationSettings", "UNUserNotificationCenter", "block2"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_System_Threading",
  "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(target_os = "macos")'.dev-dependencies]
objc2-foundation = "0.3"
objc2-web-kit = { version = "0.3", default-features = false, features = [
  "WKWebView",
  "WKWebViewConfiguration",
] }
