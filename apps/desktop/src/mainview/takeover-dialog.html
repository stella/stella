<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>stella desktop</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
        background: #1c1c1e;
        color: #f5f5f7;
        display: flex;
        align-items: center;
        justify-content: center;
        height: 100vh;
        -webkit-user-select: none;
        user-select: none;
      }
      .dialog {
        width: 100%;
        max-width: 380px;
        padding: 28px 24px 20px;
        text-align: center;
      }
      .avatar {
        width: 48px;
        height: 48px;
        border-radius: 50%;
        background: #3a3a3c;
        display: flex;
        align-items: center;
        justify-content: center;
        margin: 0 auto 16px;
        font-size: 20px;
        font-weight: 600;
        color: #a1a1a6;
        border: 2px solid #48484a;
      }
      .title {
        font-size: 15px;
        font-weight: 600;
        line-height: 1.4;
        margin-bottom: 6px;
      }
      .requester {
        color: #0a84ff;
      }
      .subtitle {
        font-size: 13px;
        color: #8e8e93;
        line-height: 1.4;
        margin-bottom: 24px;
      }
      .file-name {
        display: inline-flex;
        align-items: center;
        gap: 4px;
        background: #2c2c2e;
        border-radius: 6px;
        padding: 4px 10px;
        font-size: 12px;
        color: #a1a1a6;
        margin-bottom: 24px;
        max-width: 100%;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .actions {
        display: flex;
        gap: 10px;
      }
      button {
        flex: 1;
        padding: 10px 16px;
        border-radius: 8px;
        border: none;
        font-size: 14px;
        font-weight: 500;
        cursor: pointer;
        transition: opacity 0.15s;
      }
      button:hover {
        opacity: 0.85;
      }
      button:active {
        opacity: 0.7;
      }
      .deny {
        background: #2c2c2e;
        color: #f5f5f7;
        border: 1px solid #3a3a3c;
      }
      .allow {
        background: #0a84ff;
        color: #fff;
      }
      @media (prefers-color-scheme: light) {
        body {
          background: #f2f2f7;
          color: #1c1c1e;
        }
        .avatar {
          background: #e5e5ea;
          border-color: #d1d1d6;
          color: #636366;
        }
        .file-name {
          background: #e5e5ea;
          color: #636366;
        }
        .deny {
          background: #e5e5ea;
          color: #1c1c1e;
          border-color: #d1d1d6;
        }
        .subtitle {
          color: #636366;
        }
      }
    </style>
  </head>
  <body>
    <div class="dialog">
      <div class="avatar" id="avatar"></div>
      <div class="title" id="title"></div>
      <div class="subtitle" id="subtitle"></div>
      <div class="file-name" id="fileName"></div>
      <div class="actions">
        <button class="deny" id="denyBtn"></button>
        <button class="allow" id="allowBtn"></button>
      </div>
    </div>
    <script>
      // Params and wording both arrive in the URL hash, set by Rust when it
      // opens the window: the dialog carries no strings of its own, so it
      // speaks whatever language the rest of the app is running in.
      const params = new URLSearchParams(window.location.hash.slice(1));
      const strings = JSON.parse(params.get("strings") || "{}");

      document.documentElement.lang = params.get("lang") || "en";
      document.documentElement.dir = params.get("dir") || "ltr";
      document.title = strings.takeoverWindowTitle || "";

      const requester = params.get("requester") || strings.takeoverRequester;
      const fileName = params.get("fileName") || strings.takeoverFile;
      const initials = requester
        .split(" ")
        .map((w) => w[0])
        .join("")
        .slice(0, 2)
        .toUpperCase();

      document.getElementById("avatar").textContent = initials;
      document.getElementById("subtitle").textContent =
        strings.takeoverSubtitle;
      // Names and file names arrive in whichever script they were written
      // in; isolating them keeps the bidi algorithm from reordering their
      // punctuation into the surrounding sentence.
      const fileNameElement = document.getElementById("fileName");
      fileNameElement.textContent = fileName;
      fileNameElement.dir = "auto";
      document.getElementById("denyBtn").textContent = strings.deny;
      document.getElementById("allowBtn").textContent = strings.allow;

      // The name is highlighted inside the sentence, and languages put it in
      // different places, so the translated sentence is split at its
      // placeholder rather than assembled from fragments here.
      const title = document.getElementById("title");
      const parts = (strings.takeoverTitle || "{requester}").split(
        "{requester}",
      );
      const highlighted = document.createElement("bdi");
      highlighted.className = "requester";
      highlighted.textContent = requester;
      title.append(parts[0] || "", highlighted, parts[1] || "");

      function respond(approved) {
        if (window.__TAURI_INTERNALS__) {
          window.__TAURI_INTERNALS__.invoke("takeover_dialog_respond", {
            approved: approved,
          });
        }
      }

      document.getElementById("denyBtn").addEventListener("click", function () {
        respond(false);
      });
      document
        .getElementById("allowBtn")
        .addEventListener("click", function () {
          respond(true);
        });
    </script>
  </body>
</html>
