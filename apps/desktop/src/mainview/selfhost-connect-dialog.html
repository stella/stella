<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>stella desktop</title>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        background: #1c1c1e;
        color: #f5f5f7;
        display: flex;
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
        overflow: hidden;
        justify-content: center;
        -webkit-user-select: none;
        user-select: none;
      }
      .dialog {
        flex-shrink: 0;
        padding: 56px 24px 20px;
        width: 100%;
      }
      .mark {
        align-items: center;
        background: #2c2c2e;
        border: 1px solid #48484a;
        border-radius: 12px;
        color: #f5f5f7;
        display: flex;
        font-size: 20px;
        font-weight: 600;
        height: 48px;
        justify-content: center;
        margin: 0 auto 18px;
        width: 48px;
      }
      .mark svg {
        height: 25px;
        width: 24px;
      }
      .title {
        font-size: 16px;
        font-weight: 600;
        line-height: 1.35;
        margin-bottom: 8px;
        text-align: center;
      }
      .subtitle {
        color: #a1a1a6;
        font-size: 13px;
        line-height: 1.45;
        margin-bottom: 18px;
        text-align: center;
      }
      [hidden] {
        display: none !important;
      }
      .details {
        background: #2c2c2e;
        border: 1px solid #3a3a3c;
        border-radius: 8px;
        display: grid;
        gap: 10px;
        margin-bottom: 20px;
        padding: 12px;
      }
      .label {
        color: #8e8e93;
        display: block;
        font-size: 11px;
        font-weight: 600;
        letter-spacing: 0.02em;
        margin-bottom: 3px;
        text-transform: uppercase;
      }
      .value {
        color: #f5f5f7;
        display: block;
        font-size: 12px;
        line-height: 1.4;
        overflow-wrap: anywhere;
        -webkit-user-select: text;
        user-select: text;
      }
      .actions {
        display: flex;
        gap: 10px;
      }
      button {
        border: none;
        border-radius: 8px;
        cursor: pointer;
        flex: 1;
        font-size: 14px;
        font-weight: 500;
        padding: 10px 16px;
        transition: opacity 0.15s;
      }
      button:hover {
        opacity: 0.86;
      }
      button:active {
        opacity: 0.72;
      }
      .cancel {
        background: #2c2c2e;
        border: 1px solid #3a3a3c;
        color: #f5f5f7;
      }
      .connect {
        background: #0a84ff;
        color: #fff;
      }
      @media (prefers-color-scheme: light) {
        body {
          background: #f2f2f7;
          color: #1c1c1e;
        }
        .mark,
        .details,
        .cancel {
          background: #fff;
          border-color: #d1d1d6;
          color: #1c1c1e;
        }
        .subtitle,
        .label {
          color: #636366;
        }
        .value {
          color: #1c1c1e;
        }
      }
    </style>
  </head>
  <body>
    <main class="dialog">
      <div class="mark">
        <svg
          aria-hidden="true"
          fill="currentColor"
          viewBox="0 0 40 41"
          xmlns="http://www.w3.org/2000/svg"
        >
          <path
            d="M6.58 11.3 16.69 5.05a5.9 5.9 0 0 1 6.62.01l14.68 9.07V9.26L25.52 1.55A11.8 11.8 0 0 0 20 0c-1.97 0-3.88.54-5.53 1.56L4.37 7.81A9.3 9.3 0 0 0 0 15.61a9.3 9.3 0 0 0 4.37 7.8l3.26 2.02-.01.01 11.15 6.9c.14.09.27.16.39.2.68.26 1.42.19 2.03-.19l9.59-5.93.1-.07 2.07-1.28-2.82-1.72-1.1-.69-9.02 5.56-.41-.24-13.01-8.05a5.57 5.57 0 0 1-2.41-4.31c0-1.79.88-3.36 2.41-4.3Z"
          />
          <path
            d="M33.34 29.25 23.24 35.5a5.9 5.9 0 0 1-6.63-.01L1.94 26.43v4.86l12.47 7.71a11.8 11.8 0 0 0 5.52 1.55c1.97 0 3.88-.54 5.53-1.56l10.1-6.25a9.3 9.3 0 0 0 4.37-7.8 9.3 9.3 0 0 0-4.37-7.8l-3.26-2.02.01-.01-11.15-6.9a1.6 1.6 0 0 0-.39-.2 1.64 1.64 0 0 0-2.03.19l-9.59 5.93-.1.07-2.07 1.28 2.82 1.72 1.1.69 9.02-5.56.41.24 13.01 8.05a5.57 5.57 0 0 1 2.41 4.31c0 1.79-.88 3.36-2.41 4.3Z"
          />
        </svg>
      </div>
      <h1 class="title" id="title"></h1>
      <p class="subtitle" id="subtitle"></p>
      <div class="details">
        <p>
          <span class="label" id="webOriginLabel"></span>
          <span class="value" id="webOrigin"></span>
        </p>
        <p>
          <span class="label" id="apiBaseUrlLabel"></span>
          <span class="value" id="apiBaseUrl"></span>
        </p>
      </div>
      <div class="actions">
        <button class="cancel" id="cancelBtn"></button>
        <button class="connect" id="connectBtn"></button>
      </div>
    </main>
    <script type="module">
      import { fitStaticDialog } from "./static-dialog-fit.js";
      // Origins and wording both arrive in the URL hash, set by Rust when it
      // opens the window: the dialog carries no strings of its own, so it
      // speaks whatever language the rest of the app is running in.
      const params = new URLSearchParams(window.location.hash.slice(1));
      const strings = JSON.parse(params.get("strings") || "{}");
      const webOrigin = params.get("webOrigin") || "";
      const apiBaseUrl = params.get("apiBaseUrl") || "";
      const handoffMode = params.get("mode") === "handoff";
      const accountMode = params.get("mode") === "account";

      document.documentElement.lang = params.get("lang") || "en";
      document.documentElement.dir = params.get("dir") || "ltr";
      document.title = accountMode
        ? strings.accountWindowTitle
        : strings.selfHostWindowTitle;

      document.getElementById("title").textContent = accountMode
        ? strings.accountTitle
        : strings.selfHostTitle;
      document.getElementById("subtitle").textContent = accountMode
        ? strings.accountSubtitle
        : strings.selfHostSubtitle;
      document.getElementById("webOriginLabel").textContent = accountMode
        ? strings.accountEmail
        : strings.webOrigin;
      document.getElementById("apiBaseUrlLabel").textContent = accountMode
        ? strings.organizationName
        : strings.apiUrl;
      document.getElementById("cancelBtn").textContent = strings.cancel;
      document.getElementById("connectBtn").textContent = strings.connect;

      // The origins stay left-to-right whichever way the dialog reads: a URL
      // reordered by the bidi algorithm is a different URL to the eye.
      document.getElementById("webOrigin").dir = "ltr";
      document.getElementById("apiBaseUrl").dir = accountMode ? "auto" : "ltr";
      document.getElementById("webOrigin").textContent = accountMode
        ? params.get("accountEmail")
        : webOrigin;
      document.getElementById("apiBaseUrl").textContent = accountMode
        ? params.get("organizationName")
        : apiBaseUrl;

      if (handoffMode) {
        document.title = strings.handoffWindowTitle;
        document.getElementById("title").textContent = params.get("message");
        document.getElementById("subtitle").textContent = params.get("detail");
        document.querySelector(".details").hidden = true;
        document.getElementById("cancelBtn").textContent = strings.close;
        const action = params.get("action");
        document.getElementById("connectBtn").hidden = !action;
        document.getElementById("connectBtn").textContent = action;
      }

      function respond(approved) {
        if (window.__TAURI_INTERNALS__) {
          window.__TAURI_INTERNALS__.invoke(
            "self_host_connect_dialog_respond",
            { approved: approved },
          );
        }
      }

      document
        .getElementById("cancelBtn")
        .addEventListener("click", function () {
          respond(false);
        });
      document
        .getElementById("connectBtn")
        .addEventListener("click", function () {
          respond(true);
        });
      fitStaticDialog((size) =>
        window.__TAURI_INTERNALS__
          ? window.__TAURI_INTERNALS__.invoke("fit_static_dialog", size)
          : Promise.resolve(null),
      );
    </script>
  </body>
</html>
