[install]
# Fail on a missing import instead of installing it at run time.
auto = "disable"

[test]
preload = [
  # Kills a test process whose event loop stops turning.
  "../../packages/scripts/src/test-event-loop-watchdog.ts",
  # Fails a test whose React tree renders in a loop.
  "../../packages/render-probe/src/dom-test-preload.ts",
  # Tests run components with the same memoization as the Vite build.
  "../../packages/scripts/src/react-compiler-test-preload.ts",
]
