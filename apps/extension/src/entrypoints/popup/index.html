<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title></title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <main>
      <div class="title-row">
        <img class="mark" src="/icon/128.png" alt="" width="32" height="32" />
        <h1 id="title"></h1>
      </div>
      <p id="purpose"></p>
      <p id="notice" role="status" hidden></p>
      <ul class="lines">
        <li class="line">
          <span id="website-name" class="line-name"></span>
          <button
            id="website-connect"
            type="button"
            aria-labelledby="website-connect website-name"
            hidden
          ></button>
          <span id="website-status" class="line-status" role="status" hidden>
            <span class="status-marker" aria-hidden="true"></span>
            <span id="website-status-text"></span>
            <span id="website-origin" class="visually-hidden"></span>
          </span>
        </li>
        <li class="line">
          <span id="desktop-name" class="line-name"></span>
          <button
            id="desktop-connect"
            type="button"
            aria-labelledby="desktop-connect desktop-name"
            hidden
          ></button>
          <span id="desktop-status" class="line-status" role="status" hidden>
            <span class="status-marker" aria-hidden="true"></span>
            <span id="desktop-status-text"></span>
          </span>
        </li>
      </ul>
      <div id="contained-tabs" class="contained-tabs" hidden>
        <span id="contained-tabs-label"></span>
        <ul id="contained-tab-list"></ul>
      </div>
      <button id="adopt" class="secondary" type="button" hidden></button>
      <div id="footer" class="footer"></div>
    </main>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
