<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title></title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <main>
      <div class="title-row">
        <div class="mark" aria-hidden="true">
          <img src="/brand/stella-symbol.svg" alt="" width="20" height="21" />
        </div>
        <h1 id="title"></h1>
        <p id="status" class="status" role="status">
          <span class="status-marker" aria-hidden="true"></span>
          <span id="status-text"></span>
          <span id="status-origin" class="visually-hidden"></span>
        </p>
      </div>
      <p id="purpose" hidden></p>
      <p id="notice" role="status" hidden></p>
      <div id="contained-tabs" class="contained-tabs" hidden>
        <span id="contained-tabs-label"></span>
        <ul id="contained-tab-list"></ul>
      </div>
      <div class="actions">
        <button id="primary" type="button" hidden></button>
        <div id="secondary-actions" class="secondary-actions"></div>
      </div>
    </main>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
