<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <!-- Synchronous (non-module) script so it runs before the SPA
         bundle and prevents a white flash for dark-mode users.
         Lives in /public so the strict frontend CSP doesn't need
         'unsafe-inline' or a hash. -->
    <script src="/prepaint-init.js"></script>
    <!-- Tiny separate module graph: starts the session/role prefetch while
         the main application graph is still downloading. Must stay ahead of
         /src/main.tsx so it executes first. -->
    <script type="module" src="/src/boot-prefetch.ts"></script>
    <script type="module">
      import { getStorageKey } from "/src/consts.ts";

      if (import.meta.env.DEV) {
        try {
          const raw = localStorage.getItem(getStorageKey("dev"));
          const enabled = raw
            ? JSON.parse(raw).state?.reactGrab === true
            : false;
          if (enabled) {
            window.addEventListener(
              "react-grab:init",
              () => {
                window.__REACT_GRAB__?.setEnabled(true);
              },
              { once: true },
            );
            import("react-grab").catch(() => {
              // react-grab failed to load; stays unloaded
            });
          }
        } catch {
          // react-grab stays unloaded
        }
      }
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
