[mcp_servers.stella-docs]
# Codex launches MCP servers with the active thread cwd, which may be apps/*.
args = ["-c", "repo=$(git rev-parse --show-toplevel) || exit 1; cd \"$repo\" || exit 1; exec bun run .claude/mcp/stella-docs.ts"]
command = "sh"

[shell_environment_policy]
inherit = "core"

[shell_environment_policy.set]
ENABLE_LSP_TOOL = "1"
