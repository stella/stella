# Generated by `bun run selfhost:generate`; edit scripts/selfhost-contract.ts instead.
services:
  api:
    image: ${STELLA_API_IMAGE:?set STELLA_API_IMAGE to a digest-qualified image}
    env_file:
      - ${STELLA_API_ENV_FILE:-deploy/selfhost/.env}
    environment:
      NODE_ENV: production
      STELLA_SIGNUP_RATE_LIMIT_IP_SOURCE: ${STELLA_SIGNUP_RATE_LIMIT_IP_SOURCE:-direct}
    ports:
      - "${STELLA_API_HOST_PORT:-3001}:3001"
    depends_on:
      gotenberg:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - bun
        - -e
        - "const response = await fetch('http://127.0.0.1:3001/ready', { signal: AbortSignal.timeout(4000) }); if (!response.ok) process.exit(1);"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: ${STELLA_API_PIDS_LIMIT:-512}
    mem_limit: ${STELLA_API_MEM_LIMIT:-2g}
    cpus: ${STELLA_API_CPUS:-2.0}

  document-processing-worker:
    image: ${STELLA_API_IMAGE:?set STELLA_API_IMAGE to a digest-qualified image}
    env_file:
      - ${STELLA_API_ENV_FILE:-deploy/selfhost/.env}
    environment:
      NODE_ENV: production
    command:
      - bun
      - /app/document-processing-worker.js
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - bun
        - -e
        - "const response = await fetch('http://api:3001/ready', { signal: AbortSignal.timeout(4000) }); if (!response.ok) process.exit(1);"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: ${STELLA_DOCUMENT_PROCESSING_WORKER_PIDS_LIMIT:-256}
    mem_limit: ${STELLA_DOCUMENT_PROCESSING_WORKER_MEM_LIMIT:-1g}
    cpus: ${STELLA_DOCUMENT_PROCESSING_WORKER_CPUS:-1.0}

  gotenberg:
    image: gotenberg/gotenberg:8.36.0@sha256:87c16b9f364279d321bc9772d31fa58aa6abe036423c270698bd636c3a8e9466
    environment:
      API_ENABLE_BASIC_AUTH: "true"
      GOTENBERG_API_BASIC_AUTH_USERNAME: ${GOTENBERG_USERNAME:?set GOTENBERG_USERNAME in deploy/selfhost/.env}
      GOTENBERG_API_BASIC_AUTH_PASSWORD: ${GOTENBERG_PASSWORD:?set GOTENBERG_PASSWORD in deploy/selfhost/.env}
    healthcheck:
      test:
        - CMD-SHELL
        - 'curl -fsS -H "Authorization: Basic $$(printf "%s" "$${GOTENBERG_API_BASIC_AUTH_USERNAME}:$${GOTENBERG_API_BASIC_AUTH_PASSWORD}" | base64 | tr -d "\n")" http://localhost:3000/health'
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    pids_limit: ${STELLA_GOTENBERG_PIDS_LIMIT:-1024}
    mem_limit: ${STELLA_GOTENBERG_MEM_LIMIT:-1g}
    cpus: ${STELLA_GOTENBERG_CPUS:-1.0}
