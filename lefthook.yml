# Opt-in pre-commit hooks.
# To activate: bun run hooks:install
# To deactivate: bun run hooks:uninstall
#
# These hooks are NOT auto-installed. Each developer
# chooses whether to use them.

no_auto_install: true

pre-commit:
  parallel: false
  commands:
    secrets:
      run: bun run secrets:check:staged
    lint:
      glob: "**/*.{ts,tsx,js,jsx}"
      run: bun --bun oxlint -c oxlint.config.ts --threads=2 --deny-warnings --no-error-on-unmatched-pattern --fix {staged_files}
      stage_fixed: true
    format:
      glob: "**/*.{ts,tsx,js,jsx,json,css}"
      run: bun run format:guard && bun --bun oxfmt -c .oxfmtrc.json --no-error-on-unmatched-pattern {staged_files}
      stage_fixed: true
    i18n:
      glob: "apps/web/src/i18n/langs/*.{json,ts}"
      run: bun run i18n:sync
      stage_fixed: true
    ai-skills:
      glob: "{.agents/skills,.ai/local-skills,.ai/shared/skills,.claude/commands}/**"
      run: bash scripts/check-ai-skill-sources.sh

pre-push:
  parallel: false
  commands:
    # Runs before the slow checks (lefthook orders commands by name): CI
    # rejects a release-gated change with no changeset, and learning that from
    # a finished workflow costs a full round trip. Same rule, same pathspecs
    # (scripts/changeset-policy.json), two git diffs. Skips silently on a
    # branch that touches no released package, and with LEFTHOOK=0.
    changeset:
      run: bun scripts/changeset-guard.ts --base origin/main
    code-check:
      # Turbo caches lint and typecheck per affected workspace, including
      # reverse dependants. Global inputs fall back to the full repo.
      run: bun run code-check:affected -- --base origin/main
    format:
      run: bun run format --concurrency=2 -- --check
    i18n:
      run: bun run i18n:check
    ai-skills:
      run: bash scripts/check-ai-skill-sources.sh
