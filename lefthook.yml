# Opt-in pre-commit hooks.
# To activate: bun run hooks:install
# To deactivate: bun run hooks:uninstall
#
# These hooks are NOT auto-installed. Each developer
# chooses whether to use them.

no_auto_install: true

pre-commit:
  parallel: false
  commands:
    secrets:
      run: bun run secrets:check:staged
    lint:
      glob: "**/*.{ts,tsx,js,jsx}"
      run: bun --bun oxlint -c oxlint.config.ts --threads=2 --deny-warnings --no-error-on-unmatched-pattern --fix {staged_files}
      stage_fixed: true
    format:
      glob: "**/*.{ts,tsx,js,jsx,json,css}"
      run: bun run format:guard && bun --bun oxfmt -c .oxfmtrc.json --no-error-on-unmatched-pattern {staged_files}
      stage_fixed: true
    i18n:
      glob: "apps/web/src/i18n/langs/*.{json,ts}"
      run: bun run i18n:sync
      stage_fixed: true
    ai-skills:
      glob: "{.agents/skills,.ai/local-skills,.ai/shared/skills,.claude/skills}/**"
      run: bash scripts/check-ai-skill-sources.sh

# Pre-push keeps only checks that finish in about a second and whose failure
# would cost a full CI round trip. Lint, typecheck, format, i18n, and the
# query-cache type check run in CI only (pre-commit already formats staged
# files and syncs i18n); run `bun run verify` locally when you want them
# earlier.
pre-push:
  parallel: false
  commands:
    # Same rule and pathspecs as CI (scripts/changeset-policy.json), two git
    # diffs. Skips silently on a branch that touches no released package.
    changeset:
      run: bun scripts/changeset-guard.ts --base origin/main
    secrets:
      run: bun run secrets:check:pushed
    ai-skills:
      run: bash scripts/check-ai-skill-sources.sh
