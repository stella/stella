version: 2

updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "03:00"
      timezone: "Europe/Prague"
    # Match minimumReleaseAge (5 days) in bunfig.toml
    cooldown:
      default-days: 5
    groups:
      stella-shared:
        # Reusable workflows are named stella/.github/.github/workflows/<file>,
        # so they need their own pattern to land in this one grouped update.
        # These are pinned by commit SHA, so an update has no semver type and
        # an update-types filter would leave every one of them ungrouped.
        patterns:
          - "stella/.github/*"
          - "stella/.github/.github/workflows/*"
      minor-and-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    labels:
      - "📦 dependencies"
    commit-message:
      prefix: "chore"
    reviewers:
      - "jan-kubica"
      - "nnad3N"

  - package-ecosystem: "docker"
    directory: "/apps/api"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "03:00"
      timezone: "Europe/Prague"
    cooldown:
      default-days: 5
    labels:
      - "📦 dependencies"
    commit-message:
      prefix: "chore"
    reviewers:
      - "jan-kubica"
    groups:
      minor-and-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "docker"
    directory: "/apps/web"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "03:00"
      timezone: "Europe/Prague"
    cooldown:
      default-days: 5
    labels:
      - "📦 dependencies"
    commit-message:
      prefix: "chore"
    reviewers:
      - "jan-kubica"
    groups:
      minor-and-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "docker"
    directory: "/apps/legal-atlas-runner"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "03:00"
      timezone: "Europe/Prague"
    cooldown:
      default-days: 5
    labels:
      - "📦 dependencies"
    commit-message:
      prefix: "chore"
    reviewers:
      - "jan-kubica"
    groups:
      minor-and-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "docker"
    directory: "/packages/agent-engine/docker"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "03:00"
      timezone: "Europe/Prague"
    cooldown:
      default-days: 5
    labels:
      - "📦 dependencies"
    commit-message:
      prefix: "chore"
    reviewers:
      - "jan-kubica"
    groups:
      minor-and-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "03:00"
      timezone: "Europe/Prague"
    cooldown:
      default-days: 5
    labels:
      - "📦 dependencies"
    commit-message:
      prefix: "chore"
    reviewers:
      - "jan-kubica"
    groups:
      minor-and-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "cargo"
    directory: "/apps/desktop/src-tauri"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "03:00"
      timezone: "Europe/Prague"
    # Match minimumReleaseAge (5 days) in bunfig.toml
    cooldown:
      default-days: 5
    open-pull-requests-limit: 10
    groups:
      # Tauri crates release with the npm @tauri-apps packages, so they share
      # the Bun entry's tauri group shape instead of riding minor-and-patch.
      minor-and-patch:
        patterns:
          - "*"
        exclude-patterns:
          - "tauri"
          - "tauri-*"
        update-types:
          - "minor"
          - "patch"
      tauri:
        patterns:
          - "tauri"
          - "tauri-*"
        update-types:
          - "major"
          - "minor"
          - "patch"
      async-runtime:
        patterns:
          - "tokio"
          - "futures-*"
        update-types:
          - "major"
      serialization:
        patterns:
          - "serde"
          - "serde_*"
        update-types:
          - "major"
      http:
        patterns:
          - "axum"
          - "reqwest"
          - "tower-*"
        update-types:
          - "major"
    labels:
      - "📦 dependencies"
    commit-message:
      prefix: "chore"
    reviewers:
      - "jan-kubica"

  - package-ecosystem: "bun"
    # The monorepo resolves from the root lockfile. .claude/mcp keeps its own
    # lockfile outside the workspace; CI's code-quality job installs it, so
    # its bumps are validated like the root's, and they need the same cooldown
    # (scripts/check-standalone-lockfiles.ts).
    directories:
      - "/"
      - "/.claude/mcp"
    labels:
      - "📦 dependencies"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "03:00"
      timezone: "Europe/Prague"
    # Match minimumReleaseAge (5 days) in bunfig.toml
    cooldown:
      default-days: 5
    open-pull-requests-limit: 10
    # Group related updates so they validate together; unmatched updates receive
    # standalone PRs.
    groups:
      # Executable installs derive this exact root version at build time.
      minor-and-patch:
        patterns:
          - "*"
        exclude-patterns:
          - "@tauri-apps/*"
        update-types:
          - "minor"
          - "patch"
      tauri:
        patterns:
          - "@tauri-apps/*"
        update-types:
          - "major"
          - "minor"
          - "patch"
      turbo:
        patterns:
          - "turbo"
        update-types:
          - "major"
      tanstack:
        patterns:
          - "@tanstack/*"
        update-types:
          - "major"
      astro:
        patterns:
          - "astro"
          - "@astrojs/*"
        update-types:
          - "major"
      expo:
        patterns:
          - "expo"
          - "expo-*"
          - "@expo/*"
        update-types:
          - "major"
      tailwind:
        patterns:
          - "tailwindcss"
          - "@tailwindcss/*"
        update-types:
          - "major"
      vite:
        patterns:
          - "vite"
          - "@vitejs/*"
        update-types:
          - "major"
      react:
        patterns:
          - "react"
          - "react-dom"
          - "@types/react"
          - "@types/react-dom"
        update-types:
          - "major"
      oxc:
        patterns:
          - "oxlint"
          - "oxlint-tsgolint"
          - "oxfmt"
        update-types:
          - "major"
      ai:
        patterns:
          - "ai"
          - "@ai-sdk/*"
        update-types:
          - "major"
      convex:
        patterns:
          - "convex"
          - "@convex-dev/*"
        update-types:
          - "major"
      posthog:
        patterns:
          - "posthog*"
          - "@posthog*"
        update-types:
          - "major"
      tiptap:
        patterns:
          - "@tiptap/*"
        update-types:
          - "major"
      hocuspocus:
        patterns:
          - "@hocuspocus/*"
        update-types:
          - "major"
      atlaskit:
        patterns:
          - "@atlaskit/*"
        update-types:
          - "major"
      drizzle:
        patterns:
          - "drizzle-orm"
          - "drizzle-kit"
        update-types:
          - "major"
      rivetkit:
        patterns:
          - "rivetkit"
          - "@rivetkit/*"
        update-types:
          - "major"
      streamdown:
        patterns:
          - "streamdown*"
          - "@streamdown/*"
        update-types:
          - "major"
      aws-sdk:
        patterns:
          - "@aws-sdk/*"
        update-types:
          - "major"
    versioning-strategy: increase
    ignore:
      # Remove when the streamdown math renderer and markdown editor move to KaTeX 0.17+.
      - dependency-name: "katex"
        versions:
          - ">=0.17"
      # Remove when intl-messageformat moves past 3.5.18.
      - dependency-name: "@formatjs/icu-messageformat-parser"
        versions:
          - ">3.5.18"
      # Expo packages ship as one SDK-coordinated major. Upgrade the complete
      # SDK intentionally instead of mixing majors through partial PRs.
      - dependency-name: "expo"
        update-types:
          - "version-update:semver-major"
      - dependency-name: "expo-*"
        update-types:
          - "version-update:semver-major"
      - dependency-name: "@expo/*"
        update-types:
          - "version-update:semver-major"
      # Expo SDK 58 requires react-native-screens ~4.30.0. Remove this guard
      # when Expo's supported range advances to 4.31 or newer.
      - dependency-name: "react-native-screens"
        update-types:
          - "version-update:semver-minor"
      # Expo SDK 58 requires react-native 0.88.x (`expo doctor` fails on
      # 0.89). Remove this guard when the SDK upgrade moves react-native.
      - dependency-name: "react-native"
        update-types:
          - "version-update:semver-minor"
      # Expo SDK 58 requires react-native-svg 15.16.0 exactly (`expo doctor`
      # fails on 15.16.1). Remove this guard when the SDK upgrade moves it.
      - dependency-name: "react-native-svg"
        versions:
          - ">15.16.0"
      # lucide-static feeds the mobile bar glyphs, which are native assets: a
      # bump rewrites them and changes the native fingerprint, so it needs a
      # TestFlight build. Remove this when the next store build bumps it.
      - dependency-name: "lucide-static"
        versions:
          - ">1.70.0"
      # oxlint 1.93 makes the root-script type-aware lint in
      # scripts/code-check-affected.test.ts about 3x slower (7-11 s to 28-30 s
      # on CI). oxlint, @oxlint/plugins and oxlint-tsgolint stay on the
      # versions that pair with oxlint 1.90 until that is fixed.
      - dependency-name: "oxlint"
        versions:
          - ">1.90.0"
      - dependency-name: "@oxlint/plugins"
        versions:
          - ">1.90.0"
      - dependency-name: "oxlint-tsgolint"
        versions:
          - ">7.0.2005"
      # patches/ carries local fixes to @better-auth/cimd and
      # @better-auth/oauth-provider 1.7.20 that do not apply to 1.7.23. The
      # better-auth packages share one version and stay on 1.7.20 until the
      # patches are ported in their own change; remove these with that port.
      - dependency-name: "better-auth"
        versions:
          - ">1.7.20"
      - dependency-name: "@better-auth/api-key"
        versions:
          - ">1.7.20"
      - dependency-name: "@better-auth/cimd"
        versions:
          - ">1.7.20"
      - dependency-name: "@better-auth/core"
        versions:
          - ">1.7.20"
      - dependency-name: "@better-auth/oauth-provider"
        versions:
          - ">1.7.20"
      # prosemirror-inputrules 1.6.0 imports prosemirror-model without
      # declaring it, which the isolated linker cannot resolve. Remove this
      # when a release declares the dependency.
      - dependency-name: "prosemirror-inputrules"
        versions:
          - "1.6.0"
    commit-message:
      prefix: "chore"
    reviewers:
      - "nnad3N"
