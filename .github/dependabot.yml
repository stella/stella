version: 2

updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "daily"
      time: "07:00"
      timezone: "Europe/Prague"
    # Match minimumReleaseAge (5 days) in bunfig.toml
    cooldown:
      default-days: 5
    groups:
      actions:
        patterns:
          - "*"
    labels:
      - "📦 dependencies"
    commit-message:
      prefix: "chore"
    reviewers:
      - "jan-kubica"
      - "nnad3N"

  - package-ecosystem: "docker"
    directory: "/apps/api"
    schedule:
      interval: "daily"
      time: "07:00"
      timezone: "Europe/Prague"
    cooldown:
      default-days: 5
    labels:
      - "📦 dependencies"
    commit-message:
      prefix: "chore"
    reviewers:
      - "jan-kubica"

  - package-ecosystem: "docker"
    directory: "/apps/web"
    schedule:
      interval: "daily"
      time: "07:00"
      timezone: "Europe/Prague"
    cooldown:
      default-days: 5
    labels:
      - "📦 dependencies"
    commit-message:
      prefix: "chore"
    reviewers:
      - "jan-kubica"

  - package-ecosystem: "docker"
    directory: "/apps/legal-atlas-runner"
    schedule:
      interval: "daily"
      time: "07:00"
      timezone: "Europe/Prague"
    cooldown:
      default-days: 5
    labels:
      - "📦 dependencies"
    commit-message:
      prefix: "chore"
    reviewers:
      - "jan-kubica"

  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "daily"
      time: "07:00"
      timezone: "Europe/Prague"
    cooldown:
      default-days: 5
    labels:
      - "📦 dependencies"
    commit-message:
      prefix: "chore"
    reviewers:
      - "jan-kubica"

  - package-ecosystem: "cargo"
    directory: "/apps/desktop/src-tauri"
    schedule:
      interval: "daily"
      time: "07:00"
      timezone: "Europe/Prague"
    # Match minimumReleaseAge (5 days) in bunfig.toml
    cooldown:
      default-days: 5
    open-pull-requests-limit: 10
    groups:
      tauri:
        patterns:
          - "tauri"
          - "tauri-*"
      async-runtime:
        patterns:
          - "tokio"
          - "futures-*"
      serialization:
        patterns:
          - "serde"
          - "serde_*"
      http:
        patterns:
          - "axum"
          - "reqwest"
          - "tower-*"
    labels:
      - "📦 dependencies"
    commit-message:
      prefix: "chore"
    reviewers:
      - "jan-kubica"

  - package-ecosystem: "bun"
    # given that we use monorepo setup, Dependabot should only point to the root
    directories:
      - "/"
    labels:
      - "📦 dependencies"
    schedule:
      interval: "daily"
      time: "07:00"
      timezone: "Europe/Prague"
    # Match minimumReleaseAge (5 days) in bunfig.toml
    cooldown:
      default-days: 5
    open-pull-requests-limit: 10
    # Group related updates so they validate together; unmatched updates receive
    # standalone PRs.
    groups:
      # Executable installs derive this exact root version at build time.
      turbo:
        patterns:
          - "turbo"
      tanstack:
        patterns:
          - "@tanstack/*"
        exclude-patterns:
          - "@tanstack/react-query*"
      astro:
        patterns:
          - "astro"
          - "@astrojs/*"
      expo:
        patterns:
          - "expo"
          - "expo-*"
          - "@expo/*"
      tailwind:
        patterns:
          - "tailwindcss"
          - "@tailwindcss/*"
      vite:
        patterns:
          - "vite"
          - "@vitejs/*"
      react:
        patterns:
          - "react"
          - "react-dom"
          - "@types/react"
          - "@types/react-dom"
      oxc:
        patterns:
          - "oxlint"
          - "oxlint-tsgolint"
          - "oxfmt"
      ai:
        patterns:
          - "ai"
          - "@ai-sdk/*"
      convex:
        patterns:
          - "convex"
          - "@convex-dev/*"
      posthog:
        patterns:
          - "posthog*"
          - "@posthog*"
      tiptap:
        patterns:
          - "@tiptap/*"
      atlaskit:
        patterns:
          - "@atlaskit/*"
      drizzle:
        patterns:
          - "drizzle-orm"
          - "drizzle-kit"
      elysia:
        patterns:
          - "elysia"
          - "@elysia/*"
          - "@elysiajs/*"
      react-email:
        patterns:
          - "react-email"
          - "@react-email/*"
      rivetkit:
        patterns:
          - "rivetkit"
          - "@rivetkit/*"
      streamdown:
        patterns:
          - "streamdown*"
          - "@streamdown/*"
      aws-sdk:
        patterns:
          - "@aws-sdk/*"
    versioning-strategy: increase
    # v5 requires Elysia 2. Remove this guard when Elysia 2 reaches stable and
    # the API migrates rate-limit scoping from `scoped` to `plugin`.
    ignore:
      - dependency-name: "elysia-rate-limit"
        update-types:
          - "version-update:semver-major"
    commit-message:
      prefix: "chore"
    reviewers:
      - "nnad3N"
