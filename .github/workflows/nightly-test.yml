name: Nightly Full Test

on:
  schedule:
    # 04:17 UTC daily, after nightly typecheck.
    - cron: "17 4 * * *"
  workflow_dispatch:
    inputs:
      dry-run-issue:
        description: Exercise migration failure reporting without writing an issue
        type: boolean
        default: true

permissions: {}

env:
  # Disposable non-RDS databases: online index builds in migrate must not wait
  # on EBS metrics or a wall-clock busy window.
  DB_LOAD_GATE_EBS_SIGNAL: disabled
  DB_LOAD_GATE_BUSY_WINDOWS: "[]"

jobs:
  workspace-replay:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: stella/.github/actions/setup-bun-cached@167fb396c6c0f4e07296ad2cd72e6ef15367c776
        with:
          save: ${{ github.ref == 'refs/heads/main' }}
          bun-version-file: "package.json"

      - name: Install dependencies
        run: bash scripts/retry.sh bun ci --ignore-scripts
        env:
          NPM_TOKEN: ""

      - name: Prepare environment
        run: |
          cp apps/api/.env.example apps/api/.env
          cp apps/web/.env.example apps/web/.env

      - name: Build production web
        env:
          VITE_FEATURE_INBOX: "true"
          VITE_PUBLIC_LAW_ENABLED: "true"
          VITE_PUBLIC_TOOLS_ENABLED: "true"
          VITE_WORKFLOWS_ENABLED: "true"
        run: bun --filter @stll/web build

      - name: Start docker stack and API server
        id: e2e-stack
        uses: ./.github/actions/setup-e2e-stack
        with:
          dockerhub-username: ${{ secrets.DOCKERHUB_USERNAME }}
          dockerhub-token: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Install Playwright Chromium
        if: steps.e2e-stack.outputs.status == 'ready'
        uses: ./.github/actions/setup-playwright

      - name: Start production web server
        if: steps.e2e-stack.outputs.status == 'ready'
        run: |
          cd apps/web
          NODE_ENV=production PORT=3000 nohup bun dist/runtime.js > /tmp/web-workspace-replay.log 2>&1 &
          echo $! > /tmp/web-workspace-replay.pid

      - name: Wait for production web server
        if: steps.e2e-stack.outputs.status == 'ready'
        run: |
          for i in {1..60}; do
            if curl --connect-timeout 2 --max-time 5 -sf http://localhost:3000/health > /dev/null 2>&1; then
              echo "Production web up after ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "::error::Production web never came up"
          tail -200 /tmp/web-workspace-replay.log || true
          exit 1

      - name: Explore workspace interactions
        if: steps.e2e-stack.outputs.status == 'ready'
        env:
          E2E_SOAK_SEED: ${{ github.run_id }}
          E2E_SOAK_STEPS: "200"
        run: bash "$GITHUB_WORKSPACE/.github/actions/setup-playwright/run-in-image.sh" bun --filter @stll/web test:e2e:soak

      - name: Add replay instructions
        if: failure() && steps.e2e-stack.outputs.status == 'ready'
        run: |
          {
            echo "## Workspace replay failure"
            echo
            echo "Download the workspace replay artifact, then run:"
            echo
            echo "\`E2E_SOAK_REPLAY=/absolute/path/to/workspace-replay.json bun --filter @stll/web test:e2e:soak\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload replay diagnostics
        if: failure() && steps.e2e-stack.outputs.status == 'ready'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nightly-workspace-replay-${{ github.run_id }}
          path: apps/web/e2e/test-results/workspace-soak/
          if-no-files-found: warn
          retention-days: 14

      - name: Upload server logs
        if: failure() && steps.e2e-stack.outputs.status == 'ready'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nightly-workspace-replay-server-logs-${{ github.run_id }}
          path: |
            /tmp/api.log
            /tmp/web-workspace-replay.log
          if-no-files-found: warn
          retention-days: 14

  full-test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: true

      - name: Setup Bun
        uses: stella/.github/actions/setup-bun-cached@167fb396c6c0f4e07296ad2cd72e6ef15367c776
        with:
          save: ${{ github.ref == 'refs/heads/main' }}
          bun-version-file: "package.json"

      - name: Install dependencies
        run: bash scripts/retry.sh bun ci --ignore-scripts
        env:
          # .npmrc references NPM_TOKEN, but this workflow can be manually
          # dispatched on a branch ref. Do not expose the real token to
          # branch-controlled install scripts.
          NPM_TOKEN: ""

      - name: Prepare environment
        run: |
          cd ./apps/api
          cp .env.example .env
          cd ../web
          cp .env.example .env

      - name: Full test suite
        run: bun run test -- --concurrency=2
        env:
          TURBO_FORCE: "true"

  # The production client build is the remaining browser-CI setup hotspot.
  # Profile it nightly rather than taxing every PR; retain TanStack Start's
  # import-protection boundary and collect evidence for upgrades or upstream
  # performance fixes.
  web-build-profile:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: stella/.github/actions/setup-bun-cached@167fb396c6c0f4e07296ad2cd72e6ef15367c776
        with:
          save: ${{ github.ref == 'refs/heads/main' }}
          bun-version-file: "package.json"

      - name: Install dependencies
        run: bash scripts/retry.sh bun ci --ignore-scripts
        env:
          NPM_TOKEN: ""

      - name: Prepare environment
        run: cp apps/web/.env.example apps/web/.env

      - name: Profile production web build
        env:
          TSR_IMPORT_PROTECTION_PERF: "1"
          TSR_IMPORT_PROTECTION_PERF_FILE: ${{ github.workspace }}/web-build-profile/import-protection.json
        run: |
          set -o pipefail
          profile_dir=web-build-profile
          mkdir -p "$profile_dir"
          started_at=$SECONDS
          set +e
          bun --filter @stll/web build 2>&1 | tee "$profile_dir/vite.log"
          build_status=${PIPESTATUS[0]}
          set -e
          build_seconds=$((SECONDS - started_at))
          {
            echo "## Nightly web build profile"
            echo
            echo "| Metric | Value |"
            echo "| --- | ---: |"
            echo "| Build wall time | ${build_seconds}s |"
            if [[ -f "$profile_dir/import-protection.json" ]]; then
              jq -r '
                "| Import-protection resolve calls | \(.counters["resolveId.calls"] // 0) |",
                "| Import-protection transforms | \(.counters["transform.calls"] // 0) |",
                "| Internal resolver calls | \(.counters["thisResolve.calls"] // 0) |",
                "| Slowest internal resolve | \(.timings.thisResolve.maxMs // 0)ms |"
              ' "$profile_dir/import-protection.json"
            fi
          } | tee "$profile_dir/summary.md" >> "$GITHUB_STEP_SUMMARY"
          exit "$build_status"

      - name: Upload build profile
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nightly-web-build-profile
          path: web-build-profile/
          if-no-files-found: error
          retention-days: 30

  # Marketing captures run on PRs that touch the captured surfaces too; this
  # nightly pass additionally covers what a per-file allowlist cannot see
  # (dependency upgrades, seed drift) against the whole default-branch runtime.
  marketing-screenshots:
    uses: ./.github/workflows/marketing-screenshots.yml
    permissions:
      # The check job polls the calling run's artifacts; a caller that grants
      # less than the callee requests fails at startup, before any job runs.
      actions: read
      contents: read
    with:
      mode: check
    # Explicit, not `inherit`: a check run never pushes, so it has no business
    # receiving the release App key.
    secrets:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}

  # Postgres-backed API suites that gate on STELLA_RUN_POSTGRES_TESTS=true and a
  # real DATABASE_URL. The plain `bun run test` above skips them (they no-op in
  # the skip branch); the shared runner executes them here and in required PR
  # CI against a service Postgres with migrations applied. Failures are real
  # regressions (pool isolation, JSONB persistence), so this job is kept
  # separate from the network smoke canary below whose failures mean "upstream
  # changed", not "we broke something".
  postgres-suites:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read

    services:
      postgres:
        image: postgres:18.6@sha256:4ef4dbc939d61acea57712655ddb4b4ab27419c913f94cca0cd57cb3ea3c2280
        env:
          POSTGRES_USER: stella_owner
          POSTGRES_PASSWORD: stella
          POSTGRES_DB: stella
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U stella_owner -d stella"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: true

      - name: Setup Bun
        uses: stella/.github/actions/setup-bun-cached@167fb396c6c0f4e07296ad2cd72e6ef15367c776
        with:
          save: ${{ github.ref == 'refs/heads/main' }}
          bun-version-file: "package.json"

      - name: Install dependencies
        run: bash scripts/retry.sh bun ci --ignore-scripts
        env:
          NPM_TOKEN: ""

      - name: Apply migrations to service Postgres
        working-directory: apps/api
        env:
          DATABASE_URL: postgres://stella_owner:stella@127.0.0.1:5432/stella
        # Exercises the shipped migrate entrypoint (Bun SQL + drizzle migrator),
        # so the JSONB persistence suite runs against the real schema, including
        # the case-law ingestion role/policy migrations.
        run: bun run src/db/migrate.ts

      - name: Run Postgres-gated API suites
        working-directory: apps/api
        env:
          DATABASE_URL: postgres://stella_owner:stella@127.0.0.1:5432/stella
        # Includes the full 20k/10k sanctions volume benchmark; required service
        # CI selects its bounded correctness slice through the same runner.
        run: bun run test:postgres

  # BullMQ-backed API suites that gate on STELLA_RUN_VALKEY_TESTS=true and a
  # real REDIS_URL, run against the Valkey image the local stack pins.
  valkey-suites:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    services:
      valkey:
        image: valkey/valkey:9.1.1-alpine@sha256:ee91f7a174ac4d6a6b0685b3a60e321f0a9dbbb691f9b0e285be2ba1d1be8328
        ports:
          - 6379:6379
        options: >-
          --health-cmd "valkey-cli ping"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: true

      - name: Setup Bun
        uses: stella/.github/actions/setup-bun-cached@167fb396c6c0f4e07296ad2cd72e6ef15367c776
        with:
          save: ${{ github.ref == 'refs/heads/main' }}
          bun-version-file: "package.json"

      - name: Install dependencies
        run: bash scripts/retry.sh bun ci --ignore-scripts
        env:
          NPM_TOKEN: ""

      - name: Run Valkey-gated API suites
        working-directory: apps/api
        env:
          REDIS_URL: redis://127.0.0.1:6379
        run: bun run test:valkey

  # Upstream-API drift canary for the CJEU adapter. Hits live Cellar SPARQL +
  # EUR-Lex endpoints, so a failure most often means an upstream schema/endpoint
  # changed, not a regression in our code. Isolated from the Postgres suites so
  # a flaky external endpoint cannot mask a real DB regression, and vice versa.
  smoke-suite:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: true

      - name: Setup Bun
        uses: stella/.github/actions/setup-bun-cached@167fb396c6c0f4e07296ad2cd72e6ef15367c776
        with:
          save: ${{ github.ref == 'refs/heads/main' }}
          bun-version-file: "package.json"

      - name: Install dependencies
        run: bash scripts/retry.sh bun ci --ignore-scripts
        env:
          NPM_TOKEN: ""

      - name: Run live CJEU smoke suite
        working-directory: apps/api
        env:
          SMOKE_TEST: "1"
        run: >-
          bun test --preload ./src/tests/setup-env.ts
          src/handlers/case-law/ingestion/adapters/eu-ecj.smoke.test.ts

  migration-exact-base-upgrade:
    # Scheduled workflows run on main; dispatches rehearse main too.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:18.6@sha256:4ef4dbc939d61acea57712655ddb4b4ab27419c913f94cca0cd57cb3ea3c2280
        env:
          POSTGRES_USER: stella_owner
          POSTGRES_PASSWORD: stella
          POSTGRES_DB: stella
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U stella_owner -d stella"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      postgres-clean:
        image: postgres:18.6@sha256:4ef4dbc939d61acea57712655ddb4b4ab27419c913f94cca0cd57cb3ea3c2280
        env:
          POSTGRES_USER: stella_owner
          POSTGRES_PASSWORD: stella
          POSTGRES_DB: stella
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U stella_owner -d stella"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve previous main state
        id: base
        run: |
          git fetch --no-tags origin refs/heads/main
          git checkout --detach FETCH_HEAD
          base=$(git rev-list -1 --first-parent --before="$(date -u -d '24 hours ago' +%FT%TZ)" HEAD)
          [[ "$base" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::No main commit exists before the nightly window"; exit 1; }
          echo "sha=$base" >> "$GITHUB_OUTPUT"
          echo "candidate=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Setup Bun
        uses: stella/.github/actions/setup-bun-cached@167fb396c6c0f4e07296ad2cd72e6ef15367c776
        with:
          save: ${{ github.ref == 'refs/heads/main' }}

      - name: Install candidate dependencies
        run: bash scripts/retry.sh bun ci --ignore-scripts
        env:
          NPM_TOKEN: ""

      - name: Test exact-base rehearsal contracts
        run: bun test scripts/migration-catalog.test.ts scripts/rehearse-exact-base-upgrade.test.ts

      - name: Rehearse exact-base migration upgrade
        id: rehearsal
        env:
          BASE_SHA: ${{ steps.base.outputs.sha }}
          DATABASE_URL: postgres://stella_owner:stella@127.0.0.1:5432/stella
          CLEAN_DATABASE_URL: postgres://stella_owner:stella@127.0.0.1:5433/stella
        run: bash scripts/rehearse-exact-base-upgrade.sh

      - name: Report unavailable rehearsal
        if: always() && steps.rehearsal.outcome == 'skipped'
        env:
          BASE_SHA: ${{ steps.base.outputs.sha }}
          CANDIDATE_SHA: ${{ steps.base.outputs.candidate }}
        run: |
          {
            echo "### Exact-base migration upgrade"
            echo
            echo "Verdict: infra failure (rehearsal could not start)."
            echo "Base: $BASE_SHA; candidate: $CANDIDATE_SHA."
            echo "Phase durations and rehearsal total: not run."
          } >> "$GITHUB_STEP_SUMMARY"

  report-failure:
    needs: migration-exact-base-upgrade
    if: >-
      always() && (needs.migration-exact-base-upgrade.result == 'failure'
      || (github.event_name == 'schedule' && needs.migration-exact-base-upgrade.result == 'cancelled')
      || (github.event_name == 'workflow_dispatch' && inputs.dry-run-issue))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Serialize issue discovery and creation to avoid duplicate open issues.
    concurrency:
      group: nightly-exact-base-failure-issue
      cancel-in-progress: false
    permissions:
      contents: read
      # Files or updates the routine failure issue, without publishing logs.
      issues: write
    steps:
      - name: Checkout report script
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: File or update the routine failure issue
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          # Manual branch dispatches may exercise reporting but never write.
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && (inputs.dry-run-issue || github.ref != 'refs/heads/main') }}
        run: bash scripts/report-exact-base-failure.sh
