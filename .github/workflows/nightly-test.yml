name: Nightly Full Test

on:
  schedule:
    # 04:17 UTC daily, after nightly typecheck.
    - cron: "17 4 * * *"
  workflow_dispatch:

permissions: {}

jobs:
  full-test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: true

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: "package.json"

      - name: Install dependencies
        run: bash scripts/bun-ci-retry.sh --ignore-scripts
        env:
          # .npmrc references NPM_TOKEN, but this workflow can be manually
          # dispatched on a branch ref. Do not expose the real token to
          # branch-controlled install scripts.
          NPM_TOKEN: ""

      - name: Prepare environment
        run: |
          cd ./apps/api
          cp .env.example .env
          cd ../web
          cp .env.example .env

      - name: Full test suite
        run: bun run test -- --concurrency=2
        env:
          TURBO_FORCE: "true"

  # The production client build is the remaining browser-CI setup hotspot.
  # Profile it nightly rather than taxing every PR; retain TanStack Start's
  # import-protection boundary and collect evidence for upgrades or upstream
  # performance fixes.
  web-build-profile:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: "package.json"

      - name: Install dependencies
        run: bash scripts/bun-ci-retry.sh --ignore-scripts
        env:
          NPM_TOKEN: ""

      - name: Prepare environment
        run: cp apps/web/.env.example apps/web/.env

      - name: Profile production web build
        env:
          TSR_IMPORT_PROTECTION_PERF: "1"
          TSR_IMPORT_PROTECTION_PERF_FILE: ${{ github.workspace }}/web-build-profile/import-protection.json
        run: |
          set -o pipefail
          profile_dir=web-build-profile
          mkdir -p "$profile_dir"
          started_at=$SECONDS
          set +e
          bun --filter @stll/web build 2>&1 | tee "$profile_dir/vite.log"
          build_status=${PIPESTATUS[0]}
          set -e
          build_seconds=$((SECONDS - started_at))
          {
            echo "## Nightly web build profile"
            echo
            echo "| Metric | Value |"
            echo "| --- | ---: |"
            echo "| Build wall time | ${build_seconds}s |"
            if [[ -f "$profile_dir/import-protection.json" ]]; then
              jq -r '
                "| Import-protection resolve calls | \(.counters["resolveId.calls"] // 0) |",
                "| Import-protection transforms | \(.counters["transform.calls"] // 0) |",
                "| Internal resolver calls | \(.counters["thisResolve.calls"] // 0) |",
                "| Slowest internal resolve | \(.timings.thisResolve.maxMs // 0)ms |"
              ' "$profile_dir/import-protection.json"
            fi
          } | tee "$profile_dir/summary.md" >> "$GITHUB_STEP_SUMMARY"
          exit "$build_status"

      - name: Upload build profile
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nightly-web-build-profile
          path: web-build-profile/
          if-no-files-found: error
          retention-days: 30

  # Marketing captures are intentionally nightly, not part of the PR critical
  # path. They exercise seeded product scenes against the complete default-
  # branch runtime, so dependency changes need no fragile per-file allowlist.
  marketing-screenshots:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: true

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: "package.json"

      - name: Install dependencies
        run: bash scripts/bun-ci-retry.sh --ignore-scripts
        env:
          NPM_TOKEN: ""

      - name: Prepare environment
        run: |
          cd ./apps/api
          cp .env.example .env
          cd ../web
          cp .env.example .env

      - name: Check Docker Hub credentials
        id: dockerhub
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [[ -n "$DOCKERHUB_USERNAME" && -n "$DOCKERHUB_TOKEN" ]]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "available=false" >> "$GITHUB_OUTPUT"

      - name: Log in to Docker Hub
        if: steps.dockerhub.outputs.available == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Start docker stack
        run: |
          for attempt in 1 2 3; do
            if docker compose --profile dev up -d --wait postgres rustfs valkey gotenberg \
              && docker compose --profile dev run --rm --no-deps rustfs-setup; then
              exit 0
            fi
            echo "::warning::docker stack start failed (attempt ${attempt}/3); tearing down and retrying"
            docker compose --profile dev down --volumes --remove-orphans || true
            sleep "$((attempt * 20))"
          done
          echo "::error::docker stack failed to start after 3 attempts"
          exit 1

      - name: Log out of Docker Hub
        if: always() && steps.dockerhub.outputs.available == 'true'
        run: docker logout

      - name: Run database migrations
        run: bun --filter @stll/api db:migrate

      - name: Seed test user
        run: bun --filter @stll/api db:seed-test-user

      - name: Start API server
        run: |
          cd apps/api
          NODE_ENV=development E2E_DISABLE_AUTH_RATE_LIMIT=true nohup bun --port 3001 --preload ./src/dev/register-mock-ai.ts src/server.ts > /tmp/api.log 2>&1 &
          echo $! > /tmp/api.pid

      - name: Wait for API
        run: |
          for i in {1..60}; do
            if curl --connect-timeout 2 --max-time 5 -sf http://localhost:3001/live > /dev/null 2>&1; then
              echo "API up after ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "::error::API never came up"
          tail -200 /tmp/api.log || true
          exit 1

      - name: Start web dev server
        run: |
          cd apps/web
          nohup bun --bun vite --port 3000 > /tmp/web.log 2>&1 &
          echo $! > /tmp/web.pid

      - name: Wait for web dev server
        run: |
          for i in {1..60}; do
            if curl --connect-timeout 2 --max-time 5 -sf http://localhost:3000 > /dev/null 2>&1; then
              echo "Web up after ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "::error::Web never came up"
          tail -200 /tmp/web.log || true
          exit 1

      - name: Install Playwright browsers
        uses: ./.github/actions/setup-playwright
        with:
          dependency-mode: full

      - name: Seed deterministic marketing content
        run: bun --filter @stll/api db:seed-dev

      - name: Check marketing screenshots
        run: bun --filter @stll/web test:e2e:marketing

      - name: Guard against mid-test Vite re-optimize
        if: always()
        run: |
          if grep -q "optimized dependencies changed. reloading" /tmp/web.log; then
            echo "::error::Vite re-optimized dependencies mid-session and forced a reload. Add the lazy/runtime dependency named below to optimizeDeps.include in apps/web/vite.config.ts."
            grep -nE "new dependencies optimized|optimized dependencies changed" /tmp/web.log || true
            exit 1
          fi
          echo "No mid-session dep re-optimize detected."

      - name: Stop web dev server
        if: always()
        run: |
          kill "$(cat /tmp/web.pid)" || true
          rm -f /tmp/web.pid

      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nightly-marketing-screenshot-diagnostics
          path: |
            /tmp/api.log
            /tmp/web.log
            apps/web/test-results/
          if-no-files-found: ignore
          retention-days: 7

  # Postgres-backed API suites that gate on STELLA_RUN_POSTGRES_TESTS=true and a
  # real DATABASE_URL. The plain `bun run test` above skips them (they no-op in
  # the skip branch); the shared runner executes them here and in required PR
  # CI against a service Postgres with migrations applied. Failures are real
  # regressions (pool isolation, JSONB persistence), so this job is kept
  # separate from the network smoke canary below whose failures mean "upstream
  # changed", not "we broke something".
  postgres-suites:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read

    services:
      postgres:
        image: postgres:18.4@sha256:a02db8cac496f15b094798a38254f14d6e00741f709360e5e00bb6668ea31636
        env:
          POSTGRES_USER: stella_owner
          POSTGRES_PASSWORD: stella
          POSTGRES_DB: stella
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U stella_owner -d stella"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: true

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: "package.json"

      - name: Install dependencies
        run: bash scripts/bun-ci-retry.sh --ignore-scripts
        env:
          NPM_TOKEN: ""

      - name: Apply migrations to service Postgres
        working-directory: apps/api
        env:
          DATABASE_URL: postgres://stella_owner:stella@127.0.0.1:5432/stella
        # Exercises the shipped migrate entrypoint (Bun SQL + drizzle migrator),
        # so the JSONB persistence suite runs against the real schema, including
        # the case-law ingestion role/policy migrations.
        run: bun run src/db/migrate.ts

      - name: Run Postgres-gated API suites
        working-directory: apps/api
        env:
          DATABASE_URL: postgres://stella_owner:stella@127.0.0.1:5432/stella
        # The runner discovers every suite that declares the Postgres gate, so
        # adding a gated test cannot silently omit it from this workflow.
        run: bun run test:postgres

  # Upstream-API drift canary for the CJEU adapter. Hits live Cellar SPARQL +
  # EUR-Lex endpoints, so a failure most often means an upstream schema/endpoint
  # changed, not a regression in our code. Isolated from the Postgres suites so
  # a flaky external endpoint cannot mask a real DB regression, and vice versa.
  smoke-suite:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: true

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: "package.json"

      - name: Install dependencies
        run: bash scripts/bun-ci-retry.sh --ignore-scripts
        env:
          NPM_TOKEN: ""

      - name: Run live CJEU smoke suite
        working-directory: apps/api
        env:
          SMOKE_TEST: "1"
        run: >-
          bun test --preload ./src/tests/setup-env.ts
          src/handlers/case-law/ingestion/adapters/eu-ecj.smoke.test.ts
