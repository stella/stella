name: Release Artifacts

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_ref:
        description: "Git tag to publish, for example v1.2.3 or v1.2.3-rc.1"
        required: true
        type: string

# Every job declares its own least-privilege block.
permissions: {}

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && inputs.release_ref || github.ref_name }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/stella-api
  WEB_IMAGE_NAME: ${{ github.repository_owner }}/stella-web
  WEB_PUBLICATION_PREDICATE: https://stll.app/attestations/release-image-publication/v1

jobs:
  resolve:
    name: Resolve trusted release
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      release_ref: ${{ steps.release.outputs.ref }}
      release_sha: ${{ steps.release.outputs.sha }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - name: Resolve release tag
        id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          RELEASE_INPUT: ${{ github.event_name == 'workflow_dispatch' && inputs.release_ref || github.ref_name }}
        run: |
          release_ref="$RELEASE_INPUT"
          # Pattern must stay aligned with scripts/release-channel.sh
          # and .github/workflows/release-desktop.yml — all three gate
          # on the same shape so a tag accepted by one is accepted by
          # all. The prerelease channel is whitelisted to
          # rc|beta|alpha so a `v1.2.3-prod.1` mistag can't overwrite
          # the stable manifest in S3.
          if [[ ! "$release_ref" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-(rc|beta|alpha)\.[0-9]+)?$ ]]; then
            echo "::error::Release ref must look like v1.2.3, v1.2.3-rc.1, v1.2.3-beta.1, or v1.2.3-alpha.1"
            exit 1
          fi

          tag_ref_json=$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${release_ref}" 2>/dev/null) || {
            echo "::error::Tag ${release_ref} does not exist"
            exit 1
          }
          tag_object_type=$(echo "$tag_ref_json" | jq -r '.object.type')
          tag_object_sha=$(echo "$tag_ref_json" | jq -r '.object.sha')
          if [[ "$tag_object_type" == "tag" ]]; then
            release_sha=$(gh api "repos/${GITHUB_REPOSITORY}/git/tags/${tag_object_sha}" --jq '.object.sha')
          else
            release_sha="$tag_object_sha"
          fi
          if [[ ! "$release_sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Could not resolve $release_ref to a commit SHA"
            exit 1
          fi

          {
            echo "ref=$release_ref"
            echo "sha=$release_sha"
            echo "version=${release_ref#v}"
          } >> "$GITHUB_OUTPUT"

      - name: Checkout resolved commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.release.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify release source
        env:
          RELEASE_REF: ${{ steps.release.outputs.ref }}
          RELEASE_SHA: ${{ steps.release.outputs.sha }}
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          git fetch --no-tags origin main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor "$RELEASE_SHA" origin/main; then
            echo "::error::Release tag $RELEASE_REF is not reachable from protected main"
            exit 1
          fi

          file_version="$(tr -d '[:space:]' < VERSION)"
          if [[ "$file_version" != "$VERSION" ]]; then
            echo "::error::VERSION ($file_version) does not match $RELEASE_REF"
            exit 1
          fi

      - name: Write trusted release receipt
        env:
          RELEASE_REF: ${{ steps.release.outputs.ref }}
          RELEASE_SHA: ${{ steps.release.outputs.sha }}
        run: |
          jq -n \
            --arg release_ref "$RELEASE_REF" \
            --arg release_sha "$RELEASE_SHA" \
            '{release_ref: $release_ref, release_sha: $release_sha}' \
            > release-source-receipt.json

      - name: Upload trusted release receipt
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-source-receipt
          path: release-source-receipt.json
          retention-days: 1
          if-no-files-found: error

  smoke:
    name: Smoke test API image
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    needs: [resolve, build]
    permissions:
      contents: read
      packages: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve.outputs.release_sha }}
          persist-credentials: false

      - name: Login to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Smoke the artifact that was actually pushed (with its release build
      # args baked in), not a local rebuild that could drift from it.
      - name: Pull pushed image by digest
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          IMAGE_DIGEST: ${{ needs.build.outputs.digest-arm64 }}
        run: |
          set -euo pipefail
          if [[ ! "$IMAGE_DIGEST" =~ ^sha256:[a-f0-9]{64}$ ]]; then
            echo "::error::arm64 image digest was not resolved from the build job."
            exit 1
          fi
          docker pull "${IMAGE}@${IMAGE_DIGEST}"
          docker tag "${IMAGE}@${IMAGE_DIGEST}" stella-api:smoke

      # CI rehearses this same runtime contract before a VERSION bump merges.
      - name: Smoke release artifact
        run: bash scripts/smoke-api-image.sh stella-api:smoke

  build:
    name: Build API image (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    needs: resolve
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
      artifact-metadata: write

    strategy:
      # A failed arch must not cancel its sibling: both digests are needed to
      # diagnose a broken release, and the manifest job gates on both anyway.
      fail-fast: false
      matrix:
        include:
          # Release tags are cut from main, so the staging build cache
          # (refreshed by every deploy-staging run) is warm for arm64.
          # Read-only here: release builds must not mutate the staging ref.
          - runner: ubuntu-24.04-arm
            platform: linux/arm64
            cache_from_tag: buildcache-staging
            cache_to_tag: ""
          # No continuous amd64 build exists, so releases keep their own
          # cache scope warm across tags.
          - runner: ubuntu-latest
            platform: linux/amd64
            cache_from_tag: buildcache-release-amd64
            cache_to_tag: buildcache-release-amd64

    # A matrix job exposes one shared output map, so each arch writes its own
    # key; the expression is empty on the other leg, and empty values do not
    # overwrite. Consumers validate the digest shape before use.
    outputs:
      digest-arm64: ${{ matrix.platform == 'linux/arm64' && steps.build.outputs.digest || '' }}
      digest-amd64: ${{ matrix.platform == 'linux/amd64' && steps.build.outputs.digest || '' }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve.outputs.release_sha }}
          persist-credentials: false
          # The API image ships the bundled template-pack content.
          submodules: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Login to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: apps/api/Dockerfile
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ matrix.cache_from_tag }}
          cache-to: ${{ matrix.cache_to_tag != '' && format('type=registry,ref={0}/{1}:{2},mode=max', env.REGISTRY, env.IMAGE_NAME, matrix.cache_to_tag) || '' }}
          build-args: |
            STELLA_VERSION=${{ needs.resolve.outputs.version }}
            STELLA_COMMIT_SHA=${{ needs.resolve.outputs.release_sha }}

      - name: Attest image provenance
        uses: ./.github/actions/provenance
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.build.outputs.digest }}

  prepare-web-image:
    name: Build and publish web image
    runs-on: ubuntu-latest
    timeout-minutes: 55
    needs: resolve
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
      artifact-metadata: write
    outputs:
      digest: ${{ steps.result.outputs.digest }}
      target-environment: ${{ steps.target.outputs.environment }}

    steps:
      - name: Resolve web build target
        id: target
        env:
          RELEASE_REF: ${{ needs.resolve.outputs.release_ref }}
        run: |
          target_environment=production
          if [[ "$RELEASE_REF" == *-* ]]; then
            target_environment=staging
          fi
          echo "environment=${target_environment}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Login to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Reuse an existing release receipt
        id: existing
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE: ${{ env.REGISTRY }}/${{ env.WEB_IMAGE_NAME }}
          PREDICATE_TYPE: ${{ env.WEB_PUBLICATION_PREDICATE }}
          RELEASE_REF: ${{ needs.resolve.outputs.release_ref }}
          RELEASE_SHA: ${{ needs.resolve.outputs.release_sha }}
          TARGET_ENV: ${{ steps.target.outputs.environment }}
        run: |
          set -euo pipefail
          mkdir -p existing-release
          receipt_digest=""
          if gh release download "$RELEASE_REF" \
            --pattern release-manifest.json \
            --dir existing-release 2>/dev/null; then
            receipt_digest="$(jq -r '.webImage.digest // empty' existing-release/release-manifest.json)"
            target_environment="$(jq -r '.webImage.targetEnvironment // empty' existing-release/release-manifest.json)"
            if [[ -n "$receipt_digest" && "$target_environment" != "$TARGET_ENV" ]]; then
              echo "::error::Existing web image receipt targets a different environment."
              exit 1
            fi
          fi

          if ! tagged_digest="$(docker buildx imagetools inspect "${IMAGE}:${RELEASE_REF}" --format '{{.Manifest.Digest}}' 2>/dev/null)"; then
            if [[ -n "$receipt_digest" ]]; then
              echo "::error::Existing web image receipt has no matching registry tag."
              exit 1
            fi
            echo "reused=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ ! "$tagged_digest" =~ ^sha256:[a-f0-9]{64}$ ]]; then
            echo "::error::Existing web image tag has an invalid digest."
            exit 1
          fi
          if [[ -n "$receipt_digest" && "$tagged_digest" != "$receipt_digest" ]]; then
            echo "::error::Existing web image tag does not match its release receipt."
            exit 1
          fi

          # Pin the certificate identity (SAN) to this workflow at a ref that
          # legitimately produces release attestations: the release tag itself
          # (tag push) or main (workflow_dispatch runs from the default
          # branch). A same-path workflow on any other ref must not pass.
          identity_pattern="^https://github\\.com/${GITHUB_REPOSITORY//./\\.}/\\.github/workflows/release\\.yml@(refs/tags/${RELEASE_REF//./\\.}|refs/heads/main)\$"
          verification="$(gh attestation verify "oci://${IMAGE}@${tagged_digest}" \
            --repo "${GITHUB_REPOSITORY}" \
            --cert-identity-regex "$identity_pattern" \
            --predicate-type "$PREDICATE_TYPE" \
            --deny-self-hosted-runners \
            --format json)"
          jq -e \
            --arg release_ref "$RELEASE_REF" \
            --arg release_sha "$RELEASE_SHA" \
            --arg target_environment "$TARGET_ENV" \
            'any(.[].verificationResult.statement.predicate;
              .releaseRef == $release_ref
              and .releaseSha == $release_sha
              and .targetEnvironment == $target_environment)' \
            <<<"$verification" >/dev/null
          {
            echo "digest=${tagged_digest}"
            echo "reused=true"
          } >> "$GITHUB_OUTPUT"

      # Keep current workflow tooling separate from the selected release source.
      # The action code comes from the workflow revision; the browser build
      # contract remains bound to the release source and fails closed when absent.
      - name: Checkout workflow tooling
        if: steps.existing.outputs.reused != 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          path: .workflow-source
          persist-credentials: false

      - name: Checkout release source
        if: steps.existing.outputs.reused != 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve.outputs.release_sha }}
          path: .release-source
          persist-credentials: false

      - name: Build and publish web image publicly
        if: steps.existing.outputs.reused != 'true'
        id: publish
        uses: ./.workflow-source/.github/actions/build-web-image
        with:
          release-ref: ${{ needs.resolve.outputs.release_ref }}
          release-sha: ${{ needs.resolve.outputs.release_sha }}
          target-environment: ${{ steps.target.outputs.environment }}
          posthog-key: ${{ secrets.VITE_POSTHOG_KEY }}
          posthog-cli-api-key: ${{ secrets.POSTHOG_CLI_API_KEY }}
          posthog-project-id: ${{ vars.POSTHOG_PROJECT_ID }}
          source-path: .release-source
          tooling-path: .workflow-source

      - name: Write web image publication predicate
        if: steps.existing.outputs.reused != 'true'
        env:
          RELEASE_REF: ${{ needs.resolve.outputs.release_ref }}
          RELEASE_SHA: ${{ needs.resolve.outputs.release_sha }}
          TARGET_ENV: ${{ steps.target.outputs.environment }}
        run: |
          jq -n \
            --arg release_ref "$RELEASE_REF" \
            --arg release_sha "$RELEASE_SHA" \
            --arg target_environment "$TARGET_ENV" \
            '{releaseRef: $release_ref, releaseSha: $release_sha, targetEnvironment: $target_environment}' \
            > web-image-publication.json

      # The registry refused this upload on v0.6.22 with a 403 on the first
      # blob, then accepted the identical digest 13 minutes later with nothing
      # changed. The image is already published by this point, so a refusal
      # that outlives a couple of attempts is the only one worth failing on.
      # The backoff is longer than ./.github/actions/provenance's single 10s
      # retry because 10s would not have covered the one refusal we have seen.
      - name: Attest web image publication
        id: attest-web
        if: steps.existing.outputs.reused != 'true'
        continue-on-error: true
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.WEB_IMAGE_NAME }}
          subject-digest: ${{ steps.publish.outputs.digest }}
          predicate-type: ${{ env.WEB_PUBLICATION_PREDICATE }}
          predicate-path: web-image-publication.json
          push-to-registry: true

      - name: Wait before first retry
        if: steps.attest-web.outcome == 'failure'
        run: sleep 30

      - name: Attest web image publication (retry)
        id: attest-web-retry
        if: steps.attest-web.outcome == 'failure'
        continue-on-error: true
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.WEB_IMAGE_NAME }}
          subject-digest: ${{ steps.publish.outputs.digest }}
          predicate-type: ${{ env.WEB_PUBLICATION_PREDICATE }}
          predicate-path: web-image-publication.json
          push-to-registry: true

      - name: Wait before final retry
        if: steps.attest-web-retry.outcome == 'failure'
        run: sleep 90

      # No continue-on-error: a third refusal fails the release, because a
      # published image without an attestation is not a releasable artifact.
      - name: Attest web image publication (final retry)
        if: steps.attest-web-retry.outcome == 'failure'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.WEB_IMAGE_NAME }}
          subject-digest: ${{ steps.publish.outputs.digest }}
          predicate-type: ${{ env.WEB_PUBLICATION_PREDICATE }}
          predicate-path: web-image-publication.json
          push-to-registry: true

      - name: Resolve web image digest
        id: result
        env:
          EXISTING_DIGEST: ${{ steps.existing.outputs.digest }}
          PUBLISHED_DIGEST: ${{ steps.publish.outputs.digest }}
        run: |
          digest="${EXISTING_DIGEST:-$PUBLISHED_DIGEST}"
          if [[ ! "$digest" =~ ^sha256:[a-f0-9]{64}$ ]]; then
            echo "::error::Web image digest was not resolved."
            exit 1
          fi
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"

  manifest:
    name: Assemble multi-arch manifest and GitHub release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [resolve, build, prepare-web-image, smoke]
    outputs:
      api-image-digest: ${{ steps.manifest.outputs.digest }}
    permissions:
      contents: write
      packages: write
      id-token: write
      attestations: write
      artifact-metadata: write

    steps:
      - name: Checkout release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve.outputs.release_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Checkout workflow source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: .workflow-source
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Login to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create multi-arch manifest list
        id: manifest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          RELEASE_REF: ${{ needs.resolve.outputs.release_ref }}
          ARM64_DIGEST: ${{ needs.build.outputs.digest-arm64 }}
          AMD64_DIGEST: ${{ needs.build.outputs.digest-amd64 }}
          SHA: ${{ needs.resolve.outputs.release_sha }}
        run: |
          set -euo pipefail
          mkdir -p existing-api-release
          receipt_digest=""
          if gh release download "$RELEASE_REF" \
            --pattern release-manifest.json \
            --dir existing-api-release 2>/dev/null; then
            receipt_digest="$(jq -r '.image.digest // empty' existing-api-release/release-manifest.json)"
          fi

          if tagged_digest="$(docker buildx imagetools inspect "${IMAGE}:${RELEASE_REF}" --format '{{.Manifest.Digest}}' 2>/dev/null)"; then
            if [[ ! "$tagged_digest" =~ ^sha256:[a-f0-9]{64}$ ]]; then
              echo "::error::Existing API image tag has an invalid digest."
              exit 1
            fi
            if [[ -n "$receipt_digest" && "$tagged_digest" != "$receipt_digest" ]]; then
              echo "::error::Existing API image tag does not match its release receipt."
              exit 1
            fi
            # Same ref pinning as the web image receipt: release
            # attestations come from this workflow at the release tag
            # (tag push) or main (workflow_dispatch).
            identity_pattern="^https://github\\.com/${GITHUB_REPOSITORY//./\\.}/\\.github/workflows/release\\.yml@(refs/tags/${RELEASE_REF//./\\.}|refs/heads/main)\$"
            gh attestation verify "oci://${IMAGE}@${tagged_digest}" \
              --repo "$GITHUB_REPOSITORY" \
              --cert-identity-regex "$identity_pattern" \
              --deny-self-hosted-runners >/dev/null
            docker pull --platform linux/arm64 "${IMAGE}@${tagged_digest}" >/dev/null
            image_env="$(docker image inspect "${IMAGE}@${tagged_digest}" --format '{{json .Config.Env}}')"
            jq -e \
              --arg commit "$SHA" \
              --arg version "${RELEASE_REF#v}" \
              'index("STELLA_COMMIT_SHA=" + $commit) != null
                and index("STELLA_VERSION=" + $version) != null' \
              <<<"$image_env" >/dev/null
            {
              echo "created=false"
              echo "digest=${tagged_digest}"
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ -n "$receipt_digest" ]]; then
            echo "::error::Existing API image receipt has no matching registry tag."
            exit 1
          fi

          for arch_digest in "$ARM64_DIGEST" "$AMD64_DIGEST"; do
            if [[ ! "$arch_digest" =~ ^sha256:[a-f0-9]{64}$ ]]; then
              echo "::error::A per-arch image digest was not resolved from the build job."
              exit 1
            fi
          done

          candidate_tag="candidate-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          docker buildx imagetools create --tag "${IMAGE}:${candidate_tag}" \
            "${IMAGE}@${ARM64_DIGEST}" \
            "${IMAGE}@${AMD64_DIGEST}"

          digest="$(docker buildx imagetools inspect "${IMAGE}:${candidate_tag}" --format '{{.Manifest.Digest}}')"
          {
            echo "created=true"
            echo "digest=${digest}"
          } >> "$GITHUB_OUTPUT"

      - name: Attest release image index provenance
        if: steps.manifest.outputs.created == 'true'
        uses: ./.workflow-source/.github/actions/provenance
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.manifest.outputs.digest }}

      - name: Publish immutable release image tags
        env:
          API_IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          API_IMAGE_DIGEST: ${{ steps.manifest.outputs.digest }}
          RELEASE_REF: ${{ needs.resolve.outputs.release_ref }}
          SHA: ${{ needs.resolve.outputs.release_sha }}
          WEB_IMAGE: ${{ env.REGISTRY }}/${{ env.WEB_IMAGE_NAME }}
          WEB_IMAGE_DIGEST: ${{ needs.prepare-web-image.outputs.digest }}
        run: |
          set -euo pipefail
          publish_tag() {
            local image="$1"
            local tag="$2"
            local digest="$3"
            local existing_digest
            if existing_digest="$(docker buildx imagetools inspect "${image}:${tag}" --format '{{.Manifest.Digest}}' 2>/dev/null)"; then
              if [[ "$existing_digest" != "$digest" ]]; then
                echo "::error::Immutable image tag ${image}:${tag} points to a different digest."
                exit 1
              fi
              return
            fi
            docker buildx imagetools create \
              --tag "${image}:${tag}" \
              "${image}@${digest}"
          }

          publish_tag "$API_IMAGE" "$RELEASE_REF" "$API_IMAGE_DIGEST"
          publish_tag "$API_IMAGE" "sha-${SHA:0:7}" "$API_IMAGE_DIGEST"
          publish_tag "$WEB_IMAGE" "$RELEASE_REF" "$WEB_IMAGE_DIGEST"

      - name: Create release manifest
        env:
          IMAGE_DIGEST: ${{ steps.manifest.outputs.digest }}
          IMAGE_NAME: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          WEB_IMAGE_DIGEST: ${{ needs.prepare-web-image.outputs.digest }}
          WEB_IMAGE_NAME: ${{ env.REGISTRY }}/${{ env.WEB_IMAGE_NAME }}
          WEB_TARGET_ENVIRONMENT: ${{ needs.prepare-web-image.outputs.target-environment }}
          RELEASE_REF: ${{ needs.resolve.outputs.release_ref }}
        run: |
          bash .workflow-source/scripts/create-release-manifest.sh \
            "$RELEASE_REF" \
            "$IMAGE_NAME" \
            "$IMAGE_DIGEST" \
            "$WEB_IMAGE_NAME" \
            "$WEB_IMAGE_DIGEST" \
            "$WEB_TARGET_ENVIRONMENT" \
            > release-manifest.json

      - name: Upload manifest artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-manifest-${{ needs.resolve.outputs.release_ref }}
          path: release-manifest.json
          retention-days: 90

      - name: Resolve release notes range
        id: release-notes-range
        env:
          RELEASE_REF: ${{ needs.resolve.outputs.release_ref }}
        run: |
          if [[ "$RELEASE_REF" == *-* ]]; then
            echo "args=--latest --strip header" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          previous_stable="$(
            git tag --list 'v[0-9]*.[0-9]*.[0-9]*' \
              --merged "$RELEASE_REF" \
              --sort=-v:refname \
              | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' \
              | grep -v -x "$RELEASE_REF" \
              | head -n 1
          )"

          if [[ -z "$previous_stable" ]]; then
            first_commit="$(git rev-list --max-parents=0 "$RELEASE_REF" | tail -n 1)"
            echo "args=--tag ${RELEASE_REF} --strip header ${first_commit}..${RELEASE_REF}" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "args=--tag ${RELEASE_REF} --strip header ${previous_stable}..${RELEASE_REF}" >> "$GITHUB_OUTPUT"

      - name: Generate release notes from Conventional Commits
        uses: orhun/git-cliff-action@3d96a18cc4ec17e9dc69ddcc424ccafaf1f78ce2 # v4.9.0
        with:
          config: cliff.toml
          args: ${{ steps.release-notes-range.outputs.args }}
        env:
          OUTPUT: NOTES.md

      - name: Prepend manual release description
        env:
          RELEASE_REF: ${{ needs.resolve.outputs.release_ref }}
        run: |
          manual_notes="docs/changelog/${RELEASE_REF}.md"
          if [[ -L "$manual_notes" ]]; then
            echo "Manual release description must be a regular file: ${manual_notes}" >&2
            exit 1
          fi

          if [[ ! -e "$manual_notes" ]]; then
            exit 0
          fi

          if [[ ! -f "$manual_notes" ]]; then
            echo "Manual release description must be a regular file: ${manual_notes}" >&2
            exit 1
          fi

          {
            cat "$manual_notes"
            printf '\n\n## Changes\n\n'
            cat NOTES.md
          } > NOTES.with-manual.md
          mv NOTES.with-manual.md NOTES.md

      - name: Create draft GitHub release with the manifest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_REF: ${{ needs.resolve.outputs.release_ref }}
        run: |
          # A draft: absent from /releases, the public API and
          # /releases/latest until the promote job for its channel has
          # verified that the environment serves this commit and publishes
          # it. A failed promotion therefore leaves an immutable tag,
          # immutable images and a draft, and the previous release stays
          # what users see. `gh` resolves a draft by its tag, so a rerun
          # reuses the object; a release already published by an earlier
          # run is left as it is. Beta and alpha tags promote nowhere, so
          # nothing would publish their draft: they are published here.
          if ! gh release view "$RELEASE_REF" >/dev/null 2>&1; then
            extra_args=()
            case "$RELEASE_REF" in
              *-rc.*) extra_args+=(--draft --prerelease) ;;
              *-*) extra_args+=(--prerelease) ;;
              *) extra_args+=(--draft) ;;
            esac
            gh release create "$RELEASE_REF" \
              --title "$RELEASE_REF" \
              --notes-file NOTES.md \
              --verify-tag \
              "${extra_args[@]}"
          fi
          gh release upload "$RELEASE_REF" release-manifest.json --clobber

  promote:
    # Auto-promote stable releases (vX.Y.Z) to production. Any tag
    # carrying a prerelease label (vX.Y.Z-anything) publishes the
    # artifact and is handled by `promote-staging` below.
    runs-on: ubuntu-latest
    # The infra workflow waits for online migrations to reach their real
    # terminal state. Match GitHub's full hosted-job window so this caller
    # cannot time out first and lose observation of an active promotion.
    timeout-minutes: 360
    needs: [resolve, manifest, prepare-web-image, smoke]
    if: ${{ !contains(needs.resolve.outputs.release_ref, '-') }}
    permissions:
      contents: write # publish the draft release
      packages: write # advance the mutable image aliases
    # Release App key lives in this environment (main and v* tags only).
    environment: release-app
    steps:
      # The dispatch runs from a local composite action, so the workspace has
      # to hold the workflow's own revision rather than the release's. This
      # job can be dispatched manually against any existing tag, including one
      # cut before the action existed: checking out that release first would
      # leave `uses: ./...` unresolvable and fail before dispatching.
      - name: Checkout workflow source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Promote to production
        uses: ./.github/actions/promote-dispatch
        with:
          app-client-id: ${{ vars.STELLA_RELEASE_APP_CLIENT_ID }}
          app-private-key: ${{ secrets.STELLA_RELEASE_APP_PRIVATE_KEY }}
          infra-repo: ${{ github.repository_owner }}/stella-infra
          release-ref: ${{ needs.resolve.outputs.release_ref }}
          target-environment: production
          web-image-digest: ${{ needs.prepare-web-image.outputs.digest }}

      # Swap the workspace to the release being promoted: the verification
      # script must come from that revision, not from the workflow's.
      - name: Checkout release verification script
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve.outputs.release_sha }}
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: "package.json"
          no-cache: true

      - name: Verify production serves the release commit
        env:
          API_DEPLOYMENT_EXPECTED_COMMIT: ${{ needs.resolve.outputs.release_sha }}
          API_DEPLOYMENT_PROBE_PATH: ready
          API_DEPLOYMENT_URL: https://api.stll.app
        run: bun scripts/check-api-deployment.ts

      # Same commit gate as the staging web smoke: the web origin's
      # version marker must stably report the released commit. Read-only
      # GET probes against the production frontend.
      - name: Verify production web serves the release commit
        env:
          API_DEPLOYMENT_EXPECTED_COMMIT: ${{ needs.resolve.outputs.release_sha }}
          API_DEPLOYMENT_PROBE_PATH: version.json
          API_DEPLOYMENT_URL: https://my.stll.app
        run: bun scripts/check-api-deployment.ts

      # Everything below is the publication: it runs only once production
      # verifiably serves the release, so nothing users can reach moves on a
      # failed promotion. Each step is idempotent for a rerun.
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_REF: ${{ needs.resolve.outputs.release_ref }}
        run: |
          # Only a draft is published here. A rerun against a release that
          # an earlier run already published (and that release-desktop.yml
          # may since have made Latest) must leave it exactly as it is:
          # `--latest=false` on a published release would clear Latest.
          # Not "latest" at publication: release-desktop.yml flips that in
          # its final step, after the signed installers are attached, so
          # /releases/latest/download/Stella-* never 404s in between, and
          # publishing a draft would otherwise make it Latest by default.
          is_draft="$(gh release view "$RELEASE_REF" --json isDraft --jq '.isDraft')"
          if [[ "$is_draft" != "true" ]]; then
            echo "Release $RELEASE_REF is already published; leaving it unchanged."
            exit 0
          fi
          gh release edit "$RELEASE_REF" --draft=false --latest=false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Login to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Advance stable image tags
        env:
          API_IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          API_IMAGE_DIGEST: ${{ needs.manifest.outputs.api-image-digest }}
          WEB_IMAGE: ${{ env.REGISTRY }}/${{ env.WEB_IMAGE_NAME }}
          WEB_IMAGE_DIGEST: ${{ needs.prepare-web-image.outputs.digest }}
        run: |
          set -euo pipefail
          for digest in "$API_IMAGE_DIGEST" "$WEB_IMAGE_DIGEST"; do
            if [[ ! "$digest" =~ ^sha256:[a-f0-9]{64}$ ]]; then
              echo "::error::A release image digest was not resolved from the manifest jobs."
              exit 1
            fi
          done
          docker buildx imagetools create \
            --tag "${API_IMAGE}:latest" \
            "${API_IMAGE}@${API_IMAGE_DIGEST}"
          docker buildx imagetools create \
            --tag "${WEB_IMAGE}:latest" \
            "${WEB_IMAGE}@${WEB_IMAGE_DIGEST}"

  promote-staging:
    # Auto-promote release-candidate tags (vX.Y.Z-rc.N) to staging.
    # Same dispatch pattern as `promote` above; the infra workflow
    # reads target_environment to resolve the staging-scoped vars
    # and apply role.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [resolve, manifest, prepare-web-image, smoke]
    if: ${{ contains(needs.resolve.outputs.release_ref, '-rc.') }}
    permissions:
      contents: write # publish the draft prerelease
    environment: release-app
    steps:
      # The workflow's own revision, not the release's: this job can be
      # dispatched manually against a tag cut before the composite action
      # existed, and only the workflow revision is guaranteed to contain it.
      # Nothing here reads the release source, so it is never checked out.
      - name: Checkout workflow source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Promote to staging
        uses: ./.github/actions/promote-dispatch
        with:
          app-client-id: ${{ vars.STELLA_RELEASE_APP_CLIENT_ID }}
          app-private-key: ${{ secrets.STELLA_RELEASE_APP_PRIVATE_KEY }}
          infra-repo: ${{ github.repository_owner }}/stella-infra
          release-ref: ${{ needs.resolve.outputs.release_ref }}
          target-environment: staging
          web-image-digest: ${{ needs.prepare-web-image.outputs.digest }}

      - name: Publish GitHub prerelease
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_REF: ${{ needs.resolve.outputs.release_ref }}
        run: |
          # Same rerun rule as the production publish: only a draft changes.
          is_draft="$(gh release view "$RELEASE_REF" --json isDraft --jq '.isDraft')"
          if [[ "$is_draft" != "true" ]]; then
            echo "Release $RELEASE_REF is already published; leaving it unchanged."
            exit 0
          fi
          gh release edit "$RELEASE_REF" --draft=false --prerelease
