name: Release Artifacts
# The run name carries the tag for a tag push and a dispatch alike: a
# dispatched run's head branch is main. Release Desktop App and the desktop
# release canary find a tag's runs by this name.
run-name: Release Artifacts ${{ github.event_name == 'workflow_dispatch' && inputs.release_ref || github.ref_name }}

# release-chain-alert
defaults:
  run:
    shell: bash

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_ref:
        description: "Git tag to publish, for example v1.2.3 or v1.2.3-rc.1"
        required: true
        type: string
      acknowledge_unhealthy_release:
        description: >-
          Promote even though this previous release (for example v1.2.2) is
          unhealthy, inconclusive or inside its post-release window
        required: false
        default: ""
        type: string

# Every job declares its own least-privilege block.
permissions: {}

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && inputs.release_ref || github.ref_name }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/stella-api
  WEB_IMAGE_NAME: ${{ github.repository_owner }}/stella-web
  WEB_PUBLICATION_PREDICATE: https://stll.app/attestations/release-image-publication/v1

jobs:
  resolve:
    name: Resolve trusted release
    if: >-
      github.event_name != 'workflow_dispatch'
      || github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      release_ref: ${{ steps.release.outputs.ref }}
      release_sha: ${{ steps.release.outputs.sha }}
      version: ${{ steps.source.outputs.version }}
      rc_ref: ${{ steps.source.outputs.rc_ref }}
      channel: ${{ steps.release.outputs.channel }}
    steps:
      - name: Checkout GitHub API tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.repository }}
          ref: ${{ github.workflow_sha }}
          path: .gh-retry
          persist-credentials: false
          sparse-checkout: |
            scripts/gh-retry.sh
            scripts/retry.sh
            scripts/check-release-main-health.sh
            scripts/check-release-open-incidents.sh
            scripts/check-release-receipt-coverage.sh
            scripts/check-release-queue-history.ts
            scripts/verify-release-tree-proof.sh
            scripts/check-release-candidate.sh
            scripts/verify-release-candidate-tree.mjs
          sparse-checkout-cone-mode: false

      - name: Preserve GitHub API tooling across source checkouts
        run: |
          cp "$GITHUB_WORKSPACE/.gh-retry/scripts/gh-retry.sh" "$RUNNER_TEMP/gh-retry.sh"
          echo "GH_RETRY_SCRIPT=$RUNNER_TEMP/gh-retry.sh" >> "$GITHUB_ENV"

      - name: Preserve release verification tooling across source checkouts
        run: |
          cp "$GITHUB_WORKSPACE/.gh-retry/scripts/"* "$RUNNER_TEMP/"

      - name: Preserve release candidate verifier across source checkouts
        run: |
          cp "$GITHUB_WORKSPACE/.gh-retry/scripts/retry.sh" "$RUNNER_TEMP/retry.sh"
          echo "NETWORK_RETRY_SCRIPT=$RUNNER_TEMP/retry.sh" >> "$GITHUB_ENV"
          cp "$GITHUB_WORKSPACE/.gh-retry/scripts/check-release-candidate.sh" "$RUNNER_TEMP/check-release-candidate.sh"
          echo "RELEASE_CANDIDATE_CHECKER=$RUNNER_TEMP/check-release-candidate.sh" >> "$GITHUB_ENV"
          cp "$GITHUB_WORKSPACE/.gh-retry/scripts/verify-release-candidate-tree.mjs" "$RUNNER_TEMP/verify-release-candidate-tree.mjs"
          echo "RELEASE_CANDIDATE_TREE_VERIFIER=$RUNNER_TEMP/verify-release-candidate-tree.mjs" >> "$GITHUB_ENV"

      - name: Resolve release tag
        id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          RELEASE_INPUT: ${{ github.event_name == 'workflow_dispatch' && inputs.release_ref || github.ref_name }}
        run: |
          release_ref="$RELEASE_INPUT"
          # Pattern must stay aligned with scripts/release-channel.sh
          # and .github/workflows/release-desktop.yml — all three gate
          # on the same shape so a tag accepted by one is accepted by
          # all. The prerelease channel is whitelisted to
          # rc|beta|alpha so a `v1.2.3-prod.1` mistag can't overwrite
          # the stable manifest in S3.
          if [[ ! "$release_ref" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-(rc|beta|alpha)\.[0-9]+)?$ ]]; then
            echo "::error::Release ref must look like v1.2.3, v1.2.3-rc.1, v1.2.3-beta.1, or v1.2.3-alpha.1"
            exit 1
          fi

          tag_ref_json=$(bash "$GH_RETRY_SCRIPT" api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${release_ref}") || {
            echo "::error::Tag ${release_ref} does not exist"
            exit 1
          }
          tag_object_type=$(echo "$tag_ref_json" | jq -r '.object.type')
          tag_object_sha=$(echo "$tag_ref_json" | jq -r '.object.sha')
          if [[ "$tag_object_type" == "tag" ]]; then
            release_sha=$(bash "$GH_RETRY_SCRIPT" api "repos/${GITHUB_REPOSITORY}/git/tags/${tag_object_sha}" --jq '.object.sha')
          else
            release_sha="$tag_object_sha"
          fi
          if [[ ! "$release_sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Could not resolve $release_ref to a commit SHA"
            exit 1
          fi

          {
            echo "ref=$release_ref"
            echo "sha=$release_sha"
            version="${release_ref#v}"
            echo "version=${version%%-rc.*}"
            if [[ "$release_ref" == *-rc.* ]]; then echo "channel=rc"; else echo "channel=final"; fi
          } >> "$GITHUB_OUTPUT"

      - name: Checkout resolved commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.release.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify release source
        id: source
        timeout-minutes: 4
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_REF: ${{ steps.release.outputs.ref }}
          RELEASE_SHA: ${{ steps.release.outputs.sha }}
        run: |
          set -euo pipefail
          file_version="$(tr -d '[:space:]' < VERSION)"
          echo "version=$file_version" >> "$GITHUB_OUTPUT"
          [[ "${RELEASE_REF%%-rc.*}" == "v$file_version" ]]
          if [[ "$RELEASE_REF" == *-rc.* ]]; then
            pulls="$(bash "$GH_RETRY_SCRIPT" api --paginate --slurp "repos/$GITHUB_REPOSITORY/pulls?state=open&base=main&per_page=100")"
            jq -e --arg sha "$RELEASE_SHA" --arg repo "$GITHUB_REPOSITORY" --arg title "chore: release v$file_version" \
              'any(.[][]; .head.sha == $sha and .head.repo.full_name == $repo and .title == $title)' <<< "$pulls" >/dev/null
            release_base="$(git merge-base "$RELEASE_SHA" origin/main)"
            node "$RELEASE_CANDIDATE_TREE_VERIFIER" "$release_base" "$RELEASE_SHA" "$GITHUB_REPOSITORY"
            echo "rc_ref=$RELEASE_REF" >> "$GITHUB_OUTPUT"
          else
            rc_tags="$(git tag --points-at "$RELEASE_SHA" --list "v${file_version}-rc.*" --sort=-v:refname)"
            rc_ref="$(grep -E -m 1 "^v${file_version//./\.}-rc\.[0-9]+$" <<<"$rc_tags" || true)"
            [[ -n "$rc_ref" ]] || { echo '::error::No RC tag on the final SHA'; exit 1; }
            bash "$RUNNER_TEMP/check-release-main-health.sh" "$GITHUB_REPOSITORY" "$RELEASE_SHA" "$RELEASE_SHA"
            echo "rc_ref=$rc_ref" >> "$GITHUB_OUTPUT"
          fi

      - name: Write trusted release receipt
        env:
          RELEASE_REF: ${{ steps.release.outputs.ref }}
          RELEASE_SHA: ${{ steps.release.outputs.sha }}
        run: |
          jq -n \
            --arg release_ref "$RELEASE_REF" \
            --arg release_sha "$RELEASE_SHA" \
            '{release_ref: $release_ref, release_sha: $release_sha}' \
            > release-source-receipt.json

      - name: Upload trusted release receipt
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-source-receipt
          path: release-source-receipt.json
          retention-days: 1
          if-no-files-found: error

  smoke:
    name: Smoke test API image
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    needs: [resolve, build]
    # Runs only when every job it needs succeeded, so it skips with
    # resolve outside the protected ref.
    if: ${{ success() && needs.resolve.outputs.channel == 'rc' }}
    permissions:
      contents: read
      packages: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve.outputs.release_sha }}
          persist-credentials: false

      - name: Login to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: package.json
          no-cache: true

      # The release source may predate the workflow tooling.
      - name: Checkout workflow tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          path: .workflow-tooling
          persist-credentials: false
          sparse-checkout: |
            scripts/retry.sh
            scripts/ci-install.ts
            scripts/ci-install-store.ts
            packages/sha256/src/bun.ts
            packages/sha256/src/types.ts
            scripts/ci-service-images.ts
            scripts/ci-service-images.json
            packages/scripts/src/child-exit-status.ts
            packages/portable-path/src/index.ts
          sparse-checkout-cone-mode: false

      - name: Install smoke dependencies
        run: bun .workflow-tooling/scripts/ci-install.ts "$RUNNER_TEMP/bun-install/smoke.log" --frozen-lockfile --ignore-scripts --filter @stll/scripts
        env:
          NPM_TOKEN: ""

      - name: Upload failed Bun install logs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bun-install-${{ github.job }}
          path: ${{ runner.temp }}/bun-install/*.log
          retention-days: 7
          if-no-files-found: ignore

      # Smoke the artifact that was actually pushed (with its release build
      # args baked in), not a local rebuild that could drift from it.
      - name: Pull pushed image by digest
        timeout-minutes: 3
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          IMAGE_DIGEST: ${{ needs.build.outputs.digest-arm64 }}
        run: |
          set -euo pipefail
          if [[ ! "$IMAGE_DIGEST" =~ ^sha256:[a-f0-9]{64}$ ]]; then
            echo "::error::arm64 image digest was not resolved from the build job."
            exit 1
          fi
          bash .workflow-tooling/scripts/retry.sh docker pull "${IMAGE}@${IMAGE_DIGEST}"
          docker tag "${IMAGE}@${IMAGE_DIGEST}" stella-api:smoke

      - name: Pull smoke service images
        timeout-minutes: 2
        env:
          CI_IMAGE_MIRROR_ENABLED: ${{ github.event.pull_request.head.repo.fork != true && github.token != '' }}
        run: |
          set -euo pipefail
          POSTGRES_IMAGE="$(bun .workflow-tooling/scripts/ci-service-images.ts --image docker.io/library/postgres:18.6@sha256:74935e72241653ca55e0414067e6d8763aceb8a810eb51b452253ec3dcfc4336)"
          REDIS_IMAGE="$(bun .workflow-tooling/scripts/ci-service-images.ts --image docker.io/library/redis:8@sha256:298e5b3bc566bade82f46ad5511777a4a07a294097ce16ada2f6a42be5239df5)"
          bash .workflow-tooling/scripts/retry.sh docker pull "$POSTGRES_IMAGE"
          bash .workflow-tooling/scripts/retry.sh docker pull "$REDIS_IMAGE"
          printf 'POSTGRES_IMAGE=%s\nREDIS_IMAGE=%s\n' "$POSTGRES_IMAGE" "$REDIS_IMAGE" >> "$GITHUB_ENV"

      - name: Log out of GitHub Container Registry
        if: always()
        run: docker logout ghcr.io

      # CI rehearses this same runtime contract before a VERSION bump merges.
      - name: Smoke release artifact
        timeout-minutes: 2
        run: bash scripts/smoke-api-image.sh stella-api:smoke

  build:
    name: Build API image (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    needs: resolve
    # Runs only when every job it needs succeeded, so it skips with
    # resolve outside the protected ref.
    if: ${{ success() && needs.resolve.outputs.channel == 'rc' }}
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
      artifact-metadata: write

    strategy:
      # A failed arch must not cancel its sibling: both digests are needed to
      # diagnose a broken release, and the manifest job gates on both anyway.
      fail-fast: false
      matrix:
        include:
          # Staging deploys only on demand, so its build cache can be stale.
          # Releases keep their own cache scope warm across tags, and still
          # read the staging cache (never write it) when a recent staging
          # deploy refreshed it.
          - runner: ubuntu-24.04-arm
            platform: linux/arm64
            cache_from_tag: buildcache-release-arm64
            cache_to_tag: buildcache-release-arm64
          - runner: ubuntu-24.04
            platform: linux/amd64
            cache_from_tag: buildcache-release-amd64
            cache_to_tag: buildcache-release-amd64

    # A matrix job exposes one shared output map, so each arch writes its own
    # key; the expression is empty on the other leg, and empty values do not
    # overwrite. Consumers validate the digest shape before use.
    outputs:
      digest-arm64: ${{ matrix.platform == 'linux/arm64' && steps.build.outputs.digest || '' }}
      digest-amd64: ${{ matrix.platform == 'linux/amd64' && steps.build.outputs.digest || '' }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve.outputs.release_sha }}
          persist-credentials: false
          # The API image ships the bundled template-pack content.
          submodules: true

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: package.json
          no-cache: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Login to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The selected source may predate the pull script, so it runs from the
      # workflow revision; the copy is removed before it can enter the build
      # context.
      - name: Checkout workflow tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          path: .workflow-tooling
          persist-credentials: false
          sparse-checkout: |
            scripts/ci-service-images.ts
            scripts/ci-service-images.json
            packages/scripts/src/child-exit-status.ts
            packages/portable-path/src/index.ts
            scripts/retry.sh
          sparse-checkout-cone-mode: false

      - name: Resolve API base images
        id: base-contexts
        env:
          CI_IMAGE_MIRROR_ENABLED: ${{ github.event.pull_request.head.repo.fork != true && github.token != '' }}
        run: |
          echo 'contexts<<CI_IMAGE_CONTEXTS' >> "$GITHUB_OUTPUT"
          bun .workflow-tooling/scripts/ci-service-images.ts --pull apps/api/Dockerfile
          bun .workflow-tooling/scripts/ci-service-images.ts --build-contexts apps/api/Dockerfile >> "$GITHUB_OUTPUT"
          echo 'CI_IMAGE_CONTEXTS' >> "$GITHUB_OUTPUT"
          rm -rf .workflow-tooling

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: apps/api/Dockerfile
          build-contexts: ${{ steps.base-contexts.outputs.contexts }}
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }},push-by-digest=true,name-canonical=true,push=true
          cache-from: |
            type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ matrix.cache_from_tag }}
            ${{ matrix.platform == 'linux/arm64' && format('type=registry,ref={0}/{1}:buildcache-staging', env.REGISTRY, env.IMAGE_NAME) || '' }}
          cache-to: ${{ matrix.cache_to_tag != '' && format('type=registry,ref={0}/{1}:{2},mode=max', env.REGISTRY, env.IMAGE_NAME, matrix.cache_to_tag) || '' }}
          build-args: |
            STELLA_VERSION=${{ needs.resolve.outputs.version }}
            STELLA_COMMIT_SHA=${{ needs.resolve.outputs.release_sha }}

      - name: Attest image provenance
        uses: ./.github/actions/provenance
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.build.outputs.digest }}

      - name: Log out of GitHub Container Registry
        if: always()
        run: docker logout ghcr.io

  prepare-web-image:
    name: Build and publish web image
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    needs: resolve
    # Runs only when every job it needs succeeded, so it skips with
    # resolve outside the protected ref.
    if: ${{ success() && needs.resolve.outputs.channel == 'rc' }}
    permissions:
      contents: write # a rerun reads this release's draft receipt
      packages: write
      id-token: write
      attestations: write
      artifact-metadata: write
    outputs:
      digest: ${{ steps.result.outputs.digest }}
      target-environment: ${{ steps.target.outputs.environment }}

    steps:
      - name: Checkout GitHub API tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.repository }}
          ref: ${{ github.workflow_sha }}
          path: .gh-retry
          persist-credentials: false
          sparse-checkout: scripts/gh-retry.sh
          sparse-checkout-cone-mode: false

      - name: Preserve GitHub API tooling across source checkouts
        run: |
          cp "$GITHUB_WORKSPACE/.gh-retry/scripts/gh-retry.sh" "$RUNNER_TEMP/gh-retry.sh"
          echo "GH_RETRY_SCRIPT=$RUNNER_TEMP/gh-retry.sh" >> "$GITHUB_ENV"

      - name: Resolve web build target
        id: target
        env:
          RELEASE_REF: ${{ needs.resolve.outputs.release_ref }}
        run: |
          target_environment=production
          if [[ "$RELEASE_REF" == *-* ]]; then
            target_environment=staging
          fi
          echo "environment=${target_environment}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Login to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Reuse an existing release receipt
        id: existing
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE: ${{ env.REGISTRY }}/${{ env.WEB_IMAGE_NAME }}
          PREDICATE_TYPE: ${{ env.WEB_PUBLICATION_PREDICATE }}
          RELEASE_REF: ${{ needs.resolve.outputs.release_ref }}
          RELEASE_SHA: ${{ needs.resolve.outputs.release_sha }}
          TARGET_ENV: ${{ steps.target.outputs.environment }}
        run: |
          set -euo pipefail
          mkdir -p existing-release
          receipt_digest=""
          if bash "$GH_RETRY_SCRIPT" release download "$RELEASE_REF" \
            --pattern release-manifest.json \
            --dir existing-release; then
            receipt_digest="$(jq -r '.webImage.digest // empty' existing-release/release-manifest.json)"
            target_environment="$(jq -r '.webImage.targetEnvironment // empty' existing-release/release-manifest.json)"
            if [[ -n "$receipt_digest" && "$target_environment" != "$TARGET_ENV" ]]; then
              echo "::error::Existing web image receipt targets a different environment."
              exit 1
            fi
          fi

          if ! tagged_digest="$(docker buildx imagetools inspect "${IMAGE}:${RELEASE_REF}" --format '{{.Manifest.Digest}}' 2>/dev/null)"; then
            if [[ -n "$receipt_digest" ]]; then
              echo "::error::Existing web image receipt has no matching registry tag."
              exit 1
            fi
            echo "reused=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ ! "$tagged_digest" =~ ^sha256:[a-f0-9]{64}$ ]]; then
            echo "::error::Existing web image tag has an invalid digest."
            exit 1
          fi
          if [[ -n "$receipt_digest" && "$tagged_digest" != "$receipt_digest" ]]; then
            echo "::error::Existing web image tag does not match its release receipt."
            exit 1
          fi

          # Pin the certificate identity (SAN) to this workflow at a ref that
          # legitimately produces release attestations: the release tag itself
          # (tag push) or main (workflow_dispatch runs from the default
          # branch). A same-path workflow on any other ref must not pass.
          identity_pattern="^https://github\\.com/${GITHUB_REPOSITORY//./\\.}/\\.github/workflows/release\\.yml@(refs/tags/${RELEASE_REF//./\\.}|refs/heads/main)\$"
          verification="$(gh attestation verify "oci://${IMAGE}@${tagged_digest}" \
            --repo "${GITHUB_REPOSITORY}" \
            --cert-identity-regex "$identity_pattern" \
            --predicate-type "$PREDICATE_TYPE" \
            --deny-self-hosted-runners \
            --format json)"
          jq -e \
            --arg release_ref "$RELEASE_REF" \
            --arg release_sha "$RELEASE_SHA" \
            --arg target_environment "$TARGET_ENV" \
            'any(.[].verificationResult.statement.predicate;
              .releaseRef == $release_ref
              and .releaseSha == $release_sha
              and .targetEnvironment == $target_environment)' \
            <<<"$verification" >/dev/null
          {
            echo "digest=${tagged_digest}"
            echo "reused=true"
          } >> "$GITHUB_OUTPUT"

      # Keep current workflow tooling separate from the selected release source.
      # The action code comes from the workflow revision; the browser build
      # contract remains bound to the release source and fails closed when absent.
      - name: Log out of GitHub Container Registry
        if: always()
        run: docker logout ghcr.io

      - name: Checkout workflow tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          path: .workflow-source
          persist-credentials: false

      - name: Checkout release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve.outputs.release_sha }}
          path: .release-source
          persist-credentials: false

      - name: Build and publish web image publicly
        if: steps.existing.outputs.reused != 'true'
        id: publish
        timeout-minutes: 45
        uses: ./.workflow-source/.github/actions/build-web-image
        with:
          release-ref: ${{ needs.resolve.outputs.release_ref }}
          release-sha: ${{ needs.resolve.outputs.release_sha }}
          target-environment: ${{ steps.target.outputs.environment }}
          posthog-key: ${{ secrets.VITE_POSTHOG_KEY }}
          posthog-cli-api-key: ${{ secrets.POSTHOG_CLI_API_KEY }}
          posthog-project-id: ${{ vars.POSTHOG_PROJECT_ID }}
          source-path: .release-source
          tooling-path: .workflow-source

      - name: Write web image publication predicate
        if: steps.existing.outputs.reused != 'true'
        env:
          RELEASE_REF: ${{ needs.resolve.outputs.release_ref }}
          RELEASE_SHA: ${{ needs.resolve.outputs.release_sha }}
          TARGET_ENV: ${{ steps.target.outputs.environment }}
        run: |
          jq -n \
            --arg release_ref "$RELEASE_REF" \
            --arg release_sha "$RELEASE_SHA" \
            --arg target_environment "$TARGET_ENV" \
            '{releaseRef: $release_ref, releaseSha: $release_sha, targetEnvironment: $target_environment}' \
            > web-image-publication.json

      # The registry refused this upload on v0.6.22 with a 403 on the first
      # blob, then accepted the identical digest 13 minutes later with nothing
      # changed. The image is already published by this point, so a refusal
      # that outlives a couple of attempts is the only one worth failing on.
      # The backoff is longer than ./.github/actions/provenance's single 10s
      # retry because 10s would not have covered the one refusal we have seen.
      - name: Attest web image publication
        id: attest-web
        if: steps.existing.outputs.reused != 'true'
        continue-on-error: true
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.WEB_IMAGE_NAME }}
          subject-digest: ${{ steps.publish.outputs.digest }}
          predicate-type: ${{ env.WEB_PUBLICATION_PREDICATE }}
          predicate-path: web-image-publication.json
          push-to-registry: true

      - name: Wait before first retry
        if: steps.attest-web.outcome == 'failure'
        run: sleep 30

      - name: Attest web image publication (retry)
        id: attest-web-retry
        if: steps.attest-web.outcome == 'failure'
        continue-on-error: true
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.WEB_IMAGE_NAME }}
          subject-digest: ${{ steps.publish.outputs.digest }}
          predicate-type: ${{ env.WEB_PUBLICATION_PREDICATE }}
          predicate-path: web-image-publication.json
          push-to-registry: true

      - name: Wait before final retry
        if: steps.attest-web-retry.outcome == 'failure'
        run: sleep 90

      # No continue-on-error: a third refusal fails the release, because a
      # published image without an attestation is not a releasable artifact.
      - name: Attest web image publication (final retry)
        if: steps.attest-web-retry.outcome == 'failure'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.WEB_IMAGE_NAME }}
          subject-digest: ${{ steps.publish.outputs.digest }}
          predicate-type: ${{ env.WEB_PUBLICATION_PREDICATE }}
          predicate-path: web-image-publication.json
          push-to-registry: true

      - name: Resolve web image digest
        id: result
        env:
          EXISTING_DIGEST: ${{ steps.existing.outputs.digest }}
          PUBLISHED_DIGEST: ${{ steps.publish.outputs.digest }}
        run: |
          digest="${EXISTING_DIGEST:-$PUBLISHED_DIGEST}"
          if [[ ! "$digest" =~ ^sha256:[a-f0-9]{64}$ ]]; then
            echo "::error::Web image digest was not resolved."
            exit 1
          fi
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"

      - name: Log out of GitHub Container Registry
        if: always()
        run: docker logout ghcr.io

  prepare-production-web-image:
    name: Build and prove production web image
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    needs: resolve
    # Runs only when every job it needs succeeded, so it skips with
    # resolve outside the protected ref.
    if: ${{ success() && needs.resolve.outputs.channel == 'rc' }}
    permissions:
      contents: write # a rerun reads this release's draft receipt
      packages: write
      id-token: write
      attestations: write
      artifact-metadata: write
    outputs:
      digest: ${{ steps.result.outputs.digest }}
      target-environment: ${{ steps.target.outputs.environment }}

    steps:
      - name: Checkout GitHub API tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.repository }}
          ref: ${{ github.workflow_sha }}
          path: .gh-retry
          persist-credentials: false
          sparse-checkout: scripts/gh-retry.sh
          sparse-checkout-cone-mode: false

      - name: Preserve GitHub API tooling across source checkouts
        run: |
          cp "$GITHUB_WORKSPACE/.gh-retry/scripts/gh-retry.sh" "$RUNNER_TEMP/gh-retry.sh"
          echo "GH_RETRY_SCRIPT=$RUNNER_TEMP/gh-retry.sh" >> "$GITHUB_ENV"

      - name: Resolve web build target
        id: target
        env:
          RELEASE_REF: ${{ needs.resolve.outputs.release_ref }}
        run: |
          target_environment=production
          echo "environment=${target_environment}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Login to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Reuse an existing release receipt
        timeout-minutes: 5
        id: existing
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE: ${{ env.REGISTRY }}/${{ env.WEB_IMAGE_NAME }}
          PREDICATE_TYPE: ${{ env.WEB_PUBLICATION_PREDICATE }}
          RELEASE_REF: ${{ needs.resolve.outputs.release_ref }}
          RELEASE_SHA: ${{ needs.resolve.outputs.release_sha }}
          TARGET_ENV: ${{ steps.target.outputs.environment }}
        run: |
          set -euo pipefail
          mkdir -p existing-release
          receipt_digest=""
          if bash "$GH_RETRY_SCRIPT" release download "$RELEASE_REF" \
            --pattern release-manifest.json \
            --dir existing-release; then
            receipt_digest="$(jq -r '.productionWebImage.digest // empty' existing-release/release-manifest.json)"
            target_environment="$(jq -r '.productionWebImage.targetEnvironment // empty' existing-release/release-manifest.json)"
            if [[ -n "$receipt_digest" && "$target_environment" != "$TARGET_ENV" ]]; then
              echo "::error::Existing web image receipt targets a different environment."
              exit 1
            fi
          fi

          if ! tagged_digest="$(docker buildx imagetools inspect "${IMAGE}:${RELEASE_REF}-production" --format '{{.Manifest.Digest}}' 2>/dev/null)"; then
            if [[ -n "$receipt_digest" ]]; then
              echo "::error::Existing web image receipt has no matching registry tag."
              exit 1
            fi
            echo "reused=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ ! "$tagged_digest" =~ ^sha256:[a-f0-9]{64}$ ]]; then
            echo "::error::Existing web image tag has an invalid digest."
            exit 1
          fi
          if [[ -n "$receipt_digest" && "$tagged_digest" != "$receipt_digest" ]]; then
            echo "::error::Existing web image tag does not match its release receipt."
            exit 1
          fi

          # Pin the certificate identity (SAN) to this workflow at a ref that
          # legitimately produces release attestations: the release tag itself
          # (tag push) or main (workflow_dispatch runs from the default
          # branch). A same-path workflow on any other ref must not pass.
          identity_pattern="^https://github\\.com/${GITHUB_REPOSITORY//./\\.}/\\.github/workflows/release\\.yml@(refs/tags/${RELEASE_REF//./\\.}|refs/heads/main)\$"
          verification="$(gh attestation verify "oci://${IMAGE}@${tagged_digest}" \
            --repo "${GITHUB_REPOSITORY}" \
            --cert-identity-regex "$identity_pattern" \
            --predicate-type "$PREDICATE_TYPE" \
            --deny-self-hosted-runners \
            --format json)"
          jq -e \
            --arg release_ref "$RELEASE_REF" \
            --arg release_sha "$RELEASE_SHA" \
            --arg target_environment "$TARGET_ENV" \
            'any(.[].verificationResult.statement.predicate;
              .releaseRef == $release_ref
              and .releaseSha == $release_sha
              and .targetEnvironment == $target_environment)' \
            <<<"$verification" >/dev/null
          {
            echo "digest=${tagged_digest}"
            echo "reused=true"
          } >> "$GITHUB_OUTPUT"

      # Keep current workflow tooling separate from the selected release source.
      # The action code comes from the workflow revision; the browser build
      # contract remains bound to the release source and fails closed when absent.
      - name: Log out of GitHub Container Registry
        if: always()
        run: docker logout ghcr.io

      - name: Checkout workflow tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          path: .workflow-source
          persist-credentials: false

      - name: Checkout release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve.outputs.release_sha }}
          path: .release-source
          persist-credentials: false

      - name: Build and publish web image publicly
        if: steps.existing.outputs.reused != 'true'
        id: publish
        timeout-minutes: 45
        uses: ./.workflow-source/.github/actions/build-web-image
        with:
          release-ref: ${{ needs.resolve.outputs.release_ref }}
          release-sha: ${{ needs.resolve.outputs.release_sha }}
          target-environment: ${{ steps.target.outputs.environment }}
          posthog-key: ${{ secrets.VITE_POSTHOG_KEY }}
          posthog-cli-api-key: ${{ secrets.POSTHOG_CLI_API_KEY }}
          posthog-project-id: ${{ vars.POSTHOG_PROJECT_ID }}
          source-path: .release-source
          tooling-path: .workflow-source

      - name: Write web image publication predicate
        if: steps.existing.outputs.reused != 'true'
        env:
          RELEASE_REF: ${{ needs.resolve.outputs.release_ref }}
          RELEASE_SHA: ${{ needs.resolve.outputs.release_sha }}
          TARGET_ENV: ${{ steps.target.outputs.environment }}
        run: |
          jq -n \
            --arg release_ref "$RELEASE_REF" \
            --arg release_sha "$RELEASE_SHA" \
            --arg target_environment "$TARGET_ENV" \
            '{releaseRef: $release_ref, releaseSha: $release_sha, targetEnvironment: $target_environment}' \
            > web-image-publication.json

      # Registry refusals of an attestation upload can be transient. The image
      # is already published by this point, so only a refusal that outlives
      # the retries below fails the job; the backoff is deliberately longer
      # than ./.github/actions/provenance's single short retry.
      - name: Attest web image publication
        id: attest-web
        if: steps.existing.outputs.reused != 'true'
        continue-on-error: true
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.WEB_IMAGE_NAME }}
          subject-digest: ${{ steps.publish.outputs.digest }}
          predicate-type: ${{ env.WEB_PUBLICATION_PREDICATE }}
          predicate-path: web-image-publication.json
          push-to-registry: true

      - name: Wait before first retry
        if: steps.attest-web.outcome == 'failure'
        run: sleep 30

      - name: Attest web image publication (retry)
        id: attest-web-retry
        if: steps.attest-web.outcome == 'failure'
        continue-on-error: true
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.WEB_IMAGE_NAME }}
          subject-digest: ${{ steps.publish.outputs.digest }}
          predicate-type: ${{ env.WEB_PUBLICATION_PREDICATE }}
          predicate-path: web-image-publication.json
          push-to-registry: true

      - name: Wait before final retry
        if: steps.attest-web-retry.outcome == 'failure'
        run: sleep 90

      # No continue-on-error: a third refusal fails the release, because a
      # published image without an attestation is not a releasable artifact.
      - name: Attest web image publication (final retry)
        if: steps.attest-web-retry.outcome == 'failure'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.WEB_IMAGE_NAME }}
          subject-digest: ${{ steps.publish.outputs.digest }}
          predicate-type: ${{ env.WEB_PUBLICATION_PREDICATE }}
          predicate-path: web-image-publication.json
          push-to-registry: true

      - name: Resolve web image digest
        id: result
        env:
          EXISTING_DIGEST: ${{ steps.existing.outputs.digest }}
          PUBLISHED_DIGEST: ${{ steps.publish.outputs.digest }}
        run: |
          digest="${EXISTING_DIGEST:-$PUBLISHED_DIGEST}"
          if [[ ! "$digest" =~ ^sha256:[a-f0-9]{64}$ ]]; then
            echo "::error::Web image digest was not resolved."
            exit 1
          fi
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"

      - name: Log out of GitHub Container Registry
        if: always()
        run: docker logout ghcr.io

  prove-production-web-image:
    name: Prove both web image configurations and production assets
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 5
    needs: [resolve, prepare-web-image, prepare-production-web-image]
    if: ${{ success() && needs.resolve.outputs.channel == 'rc' }}
    permissions:
      contents: read
      packages: read
    steps:
      - name: Checkout trusted tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - name: Checkout source contract
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve.outputs.release_sha }}
          path: .release-source
          persist-credentials: false
      - name: Login to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Prove production web image without serving traffic
        timeout-minutes: 3
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ env.WEB_IMAGE_NAME }}@${{ needs.prepare-production-web-image.outputs.digest }}
          STAGING_IMAGE: ${{ env.REGISTRY }}/${{ env.WEB_IMAGE_NAME }}@${{ needs.prepare-web-image.outputs.digest }}
        run: bash scripts/prove-production-web-image.sh "$IMAGE" .release-source "$STAGING_IMAGE"
      - name: Log out of GitHub Container Registry
        if: always()
        run: docker logout ghcr.io

  manifest:
    name: Assemble multi-arch manifest and GitHub release
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    needs:
      [
        resolve,
        build,
        prepare-web-image,
        prepare-production-web-image,
        prove-production-web-image,
        smoke,
      ]
    # Runs only when every job it needs succeeded, so it skips with
    # resolve outside the protected ref.
    if: ${{ success() && needs.resolve.outputs.channel == 'rc' }}
    outputs:
      api-image-digest: ${{ steps.manifest.outputs.digest }}
      web-image-digest: ${{ needs.prepare-web-image.outputs.digest }}
      production-web-image-digest: ${{ needs.prepare-production-web-image.outputs.digest }}
    permissions:
      contents: write
      packages: write
      id-token: write
      attestations: write
      artifact-metadata: write

    steps:
      - name: Checkout GitHub API tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.repository }}
          ref: ${{ github.workflow_sha }}
          path: .gh-retry
          persist-credentials: false
          sparse-checkout: scripts/gh-retry.sh
          sparse-checkout-cone-mode: false

      - name: Preserve GitHub API tooling across source checkouts
        run: |
          cp "$GITHUB_WORKSPACE/.gh-retry/scripts/gh-retry.sh" "$RUNNER_TEMP/gh-retry.sh"
          echo "GH_RETRY_SCRIPT=$RUNNER_TEMP/gh-retry.sh" >> "$GITHUB_ENV"

      - name: Checkout release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve.outputs.release_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Checkout workflow source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: .workflow-source
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Login to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create multi-arch manifest list
        id: manifest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          RELEASE_REF: ${{ needs.resolve.outputs.release_ref }}
          ARM64_DIGEST: ${{ needs.build.outputs.digest-arm64 }}
          AMD64_DIGEST: ${{ needs.build.outputs.digest-amd64 }}
          SHA: ${{ needs.resolve.outputs.release_sha }}
        run: |
          set -euo pipefail
          mkdir -p existing-api-release
          receipt_digest=""
          if bash "$GH_RETRY_SCRIPT" release download "$RELEASE_REF" \
            --pattern release-manifest.json \
            --dir existing-api-release; then
            receipt_digest="$(jq -r '.image.digest // empty' existing-api-release/release-manifest.json)"
          fi

          if tagged_digest="$(docker buildx imagetools inspect "${IMAGE}:${RELEASE_REF}" --format '{{.Manifest.Digest}}' 2>/dev/null)"; then
            if [[ ! "$tagged_digest" =~ ^sha256:[a-f0-9]{64}$ ]]; then
              echo "::error::Existing API image tag has an invalid digest."
              exit 1
            fi
            if [[ -n "$receipt_digest" && "$tagged_digest" != "$receipt_digest" ]]; then
              echo "::error::Existing API image tag does not match its release receipt."
              exit 1
            fi
            # Same ref pinning as the web image receipt: release
            # attestations come from this workflow at the release tag
            # (tag push) or main (workflow_dispatch).
            identity_pattern="^https://github\\.com/${GITHUB_REPOSITORY//./\\.}/\\.github/workflows/release\\.yml@(refs/tags/${RELEASE_REF//./\\.}|refs/heads/main)\$"
            gh attestation verify "oci://${IMAGE}@${tagged_digest}" \
              --repo "$GITHUB_REPOSITORY" \
              --cert-identity-regex "$identity_pattern" \
              --deny-self-hosted-runners >/dev/null
            bash .workflow-source/scripts/retry.sh docker pull --platform linux/arm64 "${IMAGE}@${tagged_digest}" >/dev/null
            image_env="$(docker image inspect "${IMAGE}@${tagged_digest}" --format '{{json .Config.Env}}')"
            jq -e \
              --arg commit "$SHA" \
              --arg version "${{ needs.resolve.outputs.version }}" \
              'index("STELLA_COMMIT_SHA=" + $commit) != null
                and index("STELLA_VERSION=" + $version) != null' \
              <<<"$image_env" >/dev/null
            {
              echo "created=false"
              echo "digest=${tagged_digest}"
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ -n "$receipt_digest" ]]; then
            echo "::error::Existing API image receipt has no matching registry tag."
            exit 1
          fi

          for arch_digest in "$ARM64_DIGEST" "$AMD64_DIGEST"; do
            if [[ ! "$arch_digest" =~ ^sha256:[a-f0-9]{64}$ ]]; then
              echo "::error::A per-arch image digest was not resolved from the build job."
              exit 1
            fi
          done

          candidate_tag="candidate-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          docker buildx imagetools create --tag "${IMAGE}:${candidate_tag}" \
            "${IMAGE}@${ARM64_DIGEST}" \
            "${IMAGE}@${AMD64_DIGEST}"

          digest="$(docker buildx imagetools inspect "${IMAGE}:${candidate_tag}" --format '{{.Manifest.Digest}}')"
          {
            echo "created=true"
            echo "digest=${digest}"
          } >> "$GITHUB_OUTPUT"

      - name: Attest release image index provenance
        if: steps.manifest.outputs.created == 'true'
        uses: ./.workflow-source/.github/actions/provenance
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.manifest.outputs.digest }}

      - name: Publish immutable release image tags
        env:
          API_IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          API_IMAGE_DIGEST: ${{ steps.manifest.outputs.digest }}
          RELEASE_REF: ${{ needs.resolve.outputs.release_ref }}
          SHA: ${{ needs.resolve.outputs.release_sha }}
          WEB_IMAGE: ${{ env.REGISTRY }}/${{ env.WEB_IMAGE_NAME }}
          WEB_IMAGE_DIGEST: ${{ needs.prepare-web-image.outputs.digest }}
        run: |
          set -euo pipefail
          publish_tag() {
            local image="$1"
            local tag="$2"
            local digest="$3"
            local existing_digest
            if existing_digest="$(docker buildx imagetools inspect "${image}:${tag}" --format '{{.Manifest.Digest}}' 2>/dev/null)"; then
              if [[ "$existing_digest" != "$digest" ]]; then
                echo "::error::Immutable image tag ${image}:${tag} points to a different digest."
                exit 1
              fi
              return
            fi
            docker buildx imagetools create \
              --tag "${image}:${tag}" \
              "${image}@${digest}"
          }

          publish_tag "$API_IMAGE" "$RELEASE_REF" "$API_IMAGE_DIGEST"
          publish_tag "$API_IMAGE" "sha-${SHA:0:7}" "$API_IMAGE_DIGEST"
          publish_tag "$WEB_IMAGE" "$RELEASE_REF" "$WEB_IMAGE_DIGEST"
          publish_tag "$WEB_IMAGE" "${RELEASE_REF}-production" "${{ needs.prepare-production-web-image.outputs.digest }}"

      - name: Log out of GitHub Container Registry
        if: always()
        run: docker logout ghcr.io

      - name: Create release manifest
        env:
          IMAGE_DIGEST: ${{ steps.manifest.outputs.digest }}
          IMAGE_NAME: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          WEB_IMAGE_DIGEST: ${{ needs.prepare-web-image.outputs.digest }}
          WEB_IMAGE_NAME: ${{ env.REGISTRY }}/${{ env.WEB_IMAGE_NAME }}
          WEB_TARGET_ENVIRONMENT: staging
          PRODUCTION_WEB_IMAGE_DIGEST: ${{ needs.prepare-production-web-image.outputs.digest }}
          RELEASE_REF: ${{ needs.resolve.outputs.release_ref }}
        run: |
          bash .workflow-source/scripts/create-release-manifest.sh \
            "$RELEASE_REF" \
            "$IMAGE_NAME" \
            "$IMAGE_DIGEST" \
            "$WEB_IMAGE_NAME" \
            "$WEB_IMAGE_DIGEST" \
            "$WEB_TARGET_ENVIRONMENT" \
            > release-manifest.json

      - name: Upload manifest artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-manifest-${{ needs.resolve.outputs.release_ref }}
          path: release-manifest.json
          retention-days: 90

      - name: Resolve release notes range
        id: release-notes-range
        env:
          RELEASE_REF: ${{ needs.resolve.outputs.release_ref }}
        run: |
          if [[ "$RELEASE_REF" == *-* ]]; then
            echo "args=--latest --strip header" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Newest by creation, not version: the version line restarted once.
          merged_tags="$(
            git tag --list 'v[0-9]*.[0-9]*.[0-9]*' \
              --merged "$RELEASE_REF" \
              --sort=-creatordate
          )"
          previous_stable="$(
            awk -v release_ref="$RELEASE_REF" \
              '/^v[0-9]+\.[0-9]+\.[0-9]+$/ && $0 != release_ref { print; exit }' \
              <<<"$merged_tags"
          )"

          if [[ -z "$previous_stable" ]]; then
            first_commit="$(git rev-list --max-parents=0 "$RELEASE_REF" | tail -n 1)"
            echo "args=--tag ${RELEASE_REF} --strip header ${first_commit}..${RELEASE_REF}" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "args=--tag ${RELEASE_REF} --strip header ${previous_stable}..${RELEASE_REF}" >> "$GITHUB_OUTPUT"

      - name: Generate release notes from Conventional Commits
        uses: orhun/git-cliff-action@a9a95522b26fe6403f7bb24031f21fb573d0f5ff # v4.9.1
        with:
          config: cliff.toml
          args: ${{ steps.release-notes-range.outputs.args }}
        env:
          OUTPUT: NOTES.md

      - name: Prepend manual release description
        env:
          RELEASE_REF: ${{ needs.resolve.outputs.release_ref }}
        run: |
          manual_notes="docs/changelog/${RELEASE_REF}.md"
          if [[ -L "$manual_notes" ]]; then
            echo "Manual release description must be a regular file: ${manual_notes}" >&2
            exit 1
          fi

          if [[ ! -e "$manual_notes" ]]; then
            exit 0
          fi

          if [[ ! -f "$manual_notes" ]]; then
            echo "Manual release description must be a regular file: ${manual_notes}" >&2
            exit 1
          fi

          {
            cat "$manual_notes"
            printf '\n\n## Changes\n\n'
            cat NOTES.md
          } > NOTES.with-manual.md
          mv NOTES.with-manual.md NOTES.md

      # Stable store packages share this existing standard Linux job. Upload
      # directly to the release; no intermediate Actions artifact is retained.
      - name: Setup Bun for the Chrome extension
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: "package.json"
          no-cache: true

      - name: Build and verify the production Chrome extension ZIP
        id: extension-zip
        timeout-minutes: 20
        env:
          VERSION: ${{ needs.resolve.outputs.version }}
          WXT_STELLA_ORIGINS: ""
          NPM_TOKEN: ""
        run: |
          if [[ ! -f apps/extension/scripts/release-zip.sh ]]; then
            echo "::notice::Release source predates Chrome extension packaging; skipping the ZIP."
            exit 0
          fi
          bash apps/extension/scripts/release-zip.sh
          echo "packaged=true" >> "$GITHUB_OUTPUT"

      - name: Create draft GitHub release with the manifest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_REF: ${{ needs.resolve.outputs.release_ref }}
          VERSION: ${{ needs.resolve.outputs.version }}
          EXTENSION_PACKAGED: ${{ steps.extension-zip.outputs.packaged }}
        run: |
          # A draft: absent from /releases, the public API and
          # /releases/latest until the promote job for its channel has
          # verified that the environment serves this commit and publishes
          # it. A failed promotion therefore leaves an immutable tag,
          # immutable images and a draft, and the previous release stays
          # what users see. `gh` resolves a draft by its tag, so a rerun
          # reuses the object; a release already published by an earlier
          # run is left as it is. Beta and alpha tags promote nowhere, so
          # nothing would publish their draft: they are published here.
          if ! bash "$GH_RETRY_SCRIPT" release view "$RELEASE_REF" >/dev/null; then
            extra_args=()
            case "$RELEASE_REF" in
              *-rc.*) extra_args+=(--draft --prerelease) ;;
              *-*) extra_args+=(--prerelease) ;;
              *) extra_args+=(--draft) ;;
            esac
            bash "$GH_RETRY_SCRIPT" release create "$RELEASE_REF" \
              --title "$RELEASE_REF" \
              --notes-file NOTES.md \
              --verify-tag \
              "${extra_args[@]}"
          fi
          bash "$GH_RETRY_SCRIPT" release upload "$RELEASE_REF" release-manifest.json --clobber
          if [[ "$EXTENSION_PACKAGED" == "true" ]]; then
            bash "$GH_RETRY_SCRIPT" release upload "$RELEASE_REF" "apps/extension/.output/stella-extension-chrome-${VERSION}.zip" --clobber
          fi

  alias-manifest:
    name: Alias the proven RC artifacts
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    needs: resolve
    if: ${{ success() && needs.resolve.outputs.channel == 'final' }}
    permissions:
      contents: write
      packages: write
    outputs:
      api-image-digest: ${{ steps.alias.outputs.api }}
      production-web-image-digest: ${{ steps.alias.outputs.web }}
    steps:
      - name: Checkout GitHub API tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.repository }}
          ref: ${{ github.workflow_sha }}
          path: .gh-retry
          persist-credentials: false
          sparse-checkout: scripts/gh-retry.sh
          sparse-checkout-cone-mode: false
      - name: Preserve GitHub API tooling across source checkouts
        run: |
          cp "$GITHUB_WORKSPACE/.gh-retry/scripts/gh-retry.sh" "$RUNNER_TEMP/gh-retry.sh"
          echo "GH_RETRY_SCRIPT=$RUNNER_TEMP/gh-retry.sh" >> "$GITHUB_ENV"
      - name: Checkout trusted tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Login to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Alias RC digests and release assets
        id: alias
        timeout-minutes: 5
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_REF: ${{ needs.resolve.outputs.release_ref }}
          RELEASE_SHA: ${{ needs.resolve.outputs.release_sha }}
          RC_REF: ${{ needs.resolve.outputs.rc_ref }}
        run: |
          set -euo pipefail
          mkdir rc
          bash "$GH_RETRY_SCRIPT" release download "$RC_REF" --dir rc
          bash scripts/alias-release-manifest.sh rc/release-manifest.json "$RELEASE_REF" "$RELEASE_SHA" > release-manifest.json
          api="$(jq -r '.image.digest' release-manifest.json)"
          # The promotion validates the manifest's webImage, so the dispatched
          # digest is read from that same entry.
          web="$(jq -r '.webImage.digest' release-manifest.json)"
          for kind in image webImage; do
            image="$(jq -r --arg kind "$kind" '.[$kind].name' release-manifest.json)"
            digest="$(jq -r --arg kind "$kind" '.[$kind].digest' release-manifest.json)"
            existing="$(docker buildx imagetools inspect "$image:$RELEASE_REF" --format '{{.Manifest.Digest}}' 2>/dev/null || true)"
            if [[ -n "$existing" && "$existing" != "$digest" ]]; then echo '::error::Stable image tag differs from RC'; exit 1; fi
            if [[ -z "$existing" ]]; then docker buildx imagetools create --tag "$image:$RELEASE_REF" "$image@$digest"; fi
          done
          if ! bash "$GH_RETRY_SCRIPT" release view "$RELEASE_REF" >/dev/null; then
            bash "$GH_RETRY_SCRIPT" release view "$RC_REF" --json body --jq .body > NOTES.md
            bash "$GH_RETRY_SCRIPT" release create "$RELEASE_REF" --draft --verify-tag --title "$RELEASE_REF" --notes-file NOTES.md
          fi
          bash "$GH_RETRY_SCRIPT" release upload "$RELEASE_REF" release-manifest.json --clobber
          for asset in rc/*.zip; do
            [[ -f "$asset" ]] || continue
            bash "$GH_RETRY_SCRIPT" release upload "$RELEASE_REF" "$asset" --clobber
          done
          echo "api=$api" >> "$GITHUB_OUTPUT"
          echo "web=$web" >> "$GITHUB_OUTPUT"
      - name: Log out of GitHub Container Registry
        if: always()
        run: docker logout ghcr.io

  release-health-gate:
    # The previous production release must have passed its post-release
    # window (release-health.yml) before another one replaces it. Runs just
    # before the promotion, so a window that closes during the build counts.
    name: Gate on the previous release's health
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    needs: [resolve, alias-manifest]
    if: ${{ success() && !contains(needs.resolve.outputs.release_ref, '-') }}
    permissions:
      contents: read
    steps:
      - name: Checkout release health tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
          sparse-checkout: |
            package.json
            scripts/gh-retry.sh
            scripts/release-health.ts
            apps/api/src/lib/observability/release-failure-contract.ts
          sparse-checkout-cone-mode: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: package.json
          no-cache: true

      - name: Refuse while the previous release is not healthy
        timeout-minutes: 5
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_REF: ${{ needs.resolve.outputs.release_ref }}
          ACKNOWLEDGED: ${{ github.event_name == 'workflow_dispatch' && inputs.acknowledge_unhealthy_release || '' }}
        run: |
          set -euo pipefail
          bash scripts/gh-retry.sh api "repos/${GITHUB_REPOSITORY}/releases?per_page=100" > "$RUNNER_TEMP/releases.json"
          bun scripts/release-health.ts previous \
            --release "$RELEASE_REF" \
            --releases "$RUNNER_TEMP/releases.json" > "$RUNNER_TEMP/previous.json"
          verdict_args=()
          if [[ "$(jq -r '.verdictAssetId // empty' "$RUNNER_TEMP/previous.json")" != "" ]]; then
            mkdir -p "$RUNNER_TEMP/verdict"
            bash scripts/gh-retry.sh release download "$(jq -r '.tag' "$RUNNER_TEMP/previous.json")" \
              --pattern release-health.json \
              --dir "$RUNNER_TEMP/verdict"
            verdict_args=(--verdict "$RUNNER_TEMP/verdict/release-health.json")
          fi
          bun scripts/release-health.ts gate \
            --previous-release "$RUNNER_TEMP/previous.json" \
            "${verdict_args[@]}" \
            --acknowledged "$ACKNOWLEDGED" \
            --now "$(date -u +%Y-%m-%dT%H:%M:%SZ)"

  promote-production:
    # Auto-promote stable releases (vX.Y.Z) to production. Any tag
    # carrying a prerelease label (vX.Y.Z-anything) publishes the
    # artifact and is handled by `promote-staging` below.
    runs-on: ubuntu-24.04
    # The infra workflow waits for online migrations to reach their real
    # terminal state. Match GitHub's full hosted-job window so this caller
    # cannot time out first and lose observation of an active promotion.
    timeout-minutes: 360
    needs: [resolve, alias-manifest, release-health-gate]
    if: ${{ success() && !contains(needs.resolve.outputs.release_ref, '-') }}
    permissions:
      contents: read # the dispatch uses the release App token
    # Release App key lives in this environment (main and v* tags only).
    environment: release-app
    steps:
      - name: Checkout GitHub API tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.repository }}
          ref: ${{ github.workflow_sha }}
          path: .gh-retry
          persist-credentials: false
          sparse-checkout: |
            scripts/gh-retry.sh
            scripts/check-api-deployment.ts
            scripts/api-health.ts
          sparse-checkout-cone-mode: false

      - name: Preserve GitHub API tooling across source checkouts
        run: |
          cp "$GITHUB_WORKSPACE/.gh-retry/scripts/gh-retry.sh" "$RUNNER_TEMP/gh-retry.sh"
          echo "GH_RETRY_SCRIPT=$RUNNER_TEMP/gh-retry.sh" >> "$GITHUB_ENV"

      # The dispatch runs from a local composite action, so the workspace has
      # to hold the workflow's own revision rather than the release's. This
      # job can be dispatched manually against any existing tag, including one
      # cut before the action existed: checking out that release first would
      # leave `uses: ./...` unresolvable and fail before dispatching.
      - name: Preserve release verification tooling across source checkouts
        run: |
          cp "$GITHUB_WORKSPACE/.gh-retry/scripts/check-api-deployment.ts" "$RUNNER_TEMP/check-api-deployment.ts"
          cp "$GITHUB_WORKSPACE/.gh-retry/scripts/api-health.ts" "$RUNNER_TEMP/api-health.ts"

      - name: Checkout workflow source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Promote to production
        # Waits for the infra promote, online migrations included: only the
        # verification steps after it need the rest of the job's window.
        timeout-minutes: 350
        uses: ./.github/actions/promote-dispatch
        with:
          app-client-id: ${{ vars.STELLA_RELEASE_APP_CLIENT_ID }}
          app-private-key: ${{ secrets.STELLA_RELEASE_APP_PRIVATE_KEY }}
          infra-repo: ${{ github.repository_owner }}/stella-infra
          release-ref: ${{ needs.resolve.outputs.release_ref }}
          expected-sha: ${{ needs.resolve.outputs.release_sha }}
          target-environment: production
          web-image-digest: ${{ needs.alias-manifest.outputs.production-web-image-digest }}

      # Swap the workspace to the release being promoted: the verification
      # script must come from that revision, not from the workflow's.
      - name: Checkout release verification script
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve.outputs.release_sha }}
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: "package.json"
          no-cache: true

      - name: Verify production serves the release commit
        timeout-minutes: 10
        env:
          API_DEPLOYMENT_EXPECTED_COMMIT: ${{ needs.resolve.outputs.release_sha }}
          API_DEPLOYMENT_EXPECTED_ENVIRONMENT: production
          API_DEPLOYMENT_PROBE_PATH: ready
          API_DEPLOYMENT_URL: https://api.stll.app
        run: bun --no-install "$RUNNER_TEMP/check-api-deployment.ts"

      # Same commit gate as the staging web smoke: the web origin's
      # version marker must stably report the released commit. Read-only
      # GET probes against the production frontend.
      - name: Verify production web serves the release commit
        timeout-minutes: 10
        env:
          API_DEPLOYMENT_EXPECTED_COMMIT: ${{ needs.resolve.outputs.release_sha }}
          API_DEPLOYMENT_PROBE_PATH: version.json
          API_DEPLOYMENT_URL: https://my.stll.app
        run: bun --no-install "$RUNNER_TEMP/check-api-deployment.ts"

  publish-release:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    needs: [resolve, alias-manifest, promote-production]
    if: ${{ !cancelled() && needs.resolve.result == 'success' && needs.alias-manifest.result == 'success' && needs.promote-production.result == 'success' }}
    permissions:
      contents: write # publish the draft release
    steps:
      - name: Checkout GitHub API tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.repository }}
          ref: ${{ github.workflow_sha }}
          path: .gh-retry
          persist-credentials: false
          sparse-checkout: scripts/gh-retry.sh
          sparse-checkout-cone-mode: false
      - name: Preserve GitHub API tooling across source checkouts
        run: |
          cp "$GITHUB_WORKSPACE/.gh-retry/scripts/gh-retry.sh" "$RUNNER_TEMP/gh-retry.sh"
          echo "GH_RETRY_SCRIPT=$RUNNER_TEMP/gh-retry.sh" >> "$GITHUB_ENV"
      - name: Checkout trusted tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      # Everything below is the publication: it runs only once production
      # verifiably serves the release, so nothing users can reach moves on a
      # failed promotion. Each step is idempotent for a rerun.
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_REF: ${{ needs.resolve.outputs.release_ref }}
        run: |
          # Only a draft is published here. A rerun against a release that
          # an earlier run already published (and that release-desktop.yml
          # may since have made Latest) must leave it exactly as it is:
          # `--latest=false` on a published release would clear Latest.
          # Not "latest" at publication: release-desktop.yml flips that in
          # its final step, after the signed installers are attached, so
          # /releases/latest/download/Stella-* never 404s in between, and
          # publishing a draft would otherwise make it Latest by default.
          is_draft="$(bash "$GH_RETRY_SCRIPT" release view "$RELEASE_REF" --json isDraft --jq '.isDraft')"
          if [[ "$is_draft" != "true" ]]; then
            echo "Release $RELEASE_REF is already published; leaving it unchanged."
            exit 0
          fi
          bash "$GH_RETRY_SCRIPT" release edit "$RELEASE_REF" --draft=false --latest=false

  publish-latest:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    needs: [resolve, alias-manifest, promote-production]
    if: ${{ !cancelled() && needs.resolve.result == 'success' && needs.alias-manifest.result == 'success' && needs.promote-production.result == 'success' }}
    permissions:
      contents: read
      packages: write # advance the latest image aliases
    steps:
      - name: Checkout trusted tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - name: Locate API retry tooling
        run: echo "GH_RETRY_SCRIPT=$GITHUB_WORKSPACE/scripts/gh-retry.sh" >> "$GITHUB_ENV"
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Login to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Advance stable image tags
        env:
          API_IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          API_IMAGE_DIGEST: ${{ needs.alias-manifest.outputs.api-image-digest }}
          WEB_IMAGE: ${{ env.REGISTRY }}/${{ env.WEB_IMAGE_NAME }}
          WEB_IMAGE_DIGEST: ${{ needs.alias-manifest.outputs.production-web-image-digest }}
        run: |
          set -euo pipefail
          for digest in "$API_IMAGE_DIGEST" "$WEB_IMAGE_DIGEST"; do
            if [[ ! "$digest" =~ ^sha256:[a-f0-9]{64}$ ]]; then
              echo "::error::A release image digest was not resolved from the manifest jobs."
              exit 1
            fi
          done
          for kind in API WEB; do
            image_key="${kind}_IMAGE"
            digest_key="${kind}_IMAGE_DIGEST"
            image="${!image_key}"
            digest="${!digest_key}"
            existing="$(docker buildx imagetools inspect "$image:latest" --format '{{.Manifest.Digest}}' 2>/dev/null || true)"
            if [[ "$existing" != "$digest" ]]; then docker buildx imagetools create --tag "$image:latest" "$image@$digest"; fi
          done

      - name: Log out of GitHub Container Registry
        if: always()
        run: docker logout ghcr.io

  dispatch-release-health:
    # Start the post-release window for the release production now serves.
    name: Start the post-release health window
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    needs: [resolve, promote-production]
    permissions:
      actions: write # dispatch release-health.yml
    steps:
      - name: Checkout GitHub API tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.repository }}
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
          sparse-checkout: scripts/gh-retry.sh
          sparse-checkout-cone-mode: false

      - name: Dispatch release-health.yml
        timeout-minutes: 5
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_REF: ${{ needs.resolve.outputs.release_ref }}
        run: |
          runs="$(bash scripts/gh-retry.sh api --paginate --slurp "repos/$GITHUB_REPOSITORY/actions/workflows/release-health.yml/runs?event=workflow_dispatch&per_page=100")"
          if jq -e --arg title "Release health $RELEASE_REF" 'any(.[].workflow_runs[]; .display_title == $title)' <<< "$runs" >/dev/null; then exit 0; fi
          bash scripts/gh-retry.sh api --method POST \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/release-health.yml/dispatches" \
            -f ref=main \
            -f "inputs[release_ref]=${RELEASE_REF}"

  promote-staging:
    name: Dispatch RC proofs
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    needs: [resolve, manifest]
    if: ${{ success() && needs.resolve.outputs.channel == 'rc' }}
    permissions:
      contents: write
    environment: release-app
    steps:
      - name: Checkout trusted tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - name: Mint proof dispatch token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.STELLA_RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.STELLA_RELEASE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-actions: write
      - name: Dispatch staging and heavy on the candidate SHA
        timeout-minutes: 5
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          SHA: ${{ needs.resolve.outputs.release_sha }}
          RELEASE_REF: ${{ needs.resolve.outputs.release_ref }}
        run: |
          bash scripts/gh-retry.sh api --method POST "repos/$GITHUB_REPOSITORY/actions/workflows/deploy-staging.yml/dispatches" -f ref=main -f "inputs[sha]=$SHA" -f "inputs[release_candidate]=true" -f "inputs[release_ref]=$RELEASE_REF"
          bash scripts/gh-retry.sh api --method POST "repos/$GITHUB_REPOSITORY/actions/workflows/main-heavy.yml/dispatches" -f ref=main -f "inputs[sha]=$SHA" -f "inputs[release_candidate]=true"
          bash scripts/gh-retry.sh api --method POST "repos/$GITHUB_REPOSITORY/actions/workflows/main-pr-depth.yml/dispatches" -f ref=main -f "inputs[sha]=$SHA"

  release-complete:
    name: Reconcile final release receipts
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    needs:
      [
        resolve,
        alias-manifest,
        promote-production,
        publish-release,
        publish-latest,
        dispatch-release-health,
      ]
    if: ${{ always() && needs.resolve.outputs.channel == 'final' }}
    permissions:
      contents: read
      packages: read
      actions: read
    steps:
      - name: Checkout trusted tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Reconcile production publication
        timeout-minutes: 5
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_REF: ${{ needs.resolve.outputs.release_ref }}
          RELEASE_SHA: ${{ needs.resolve.outputs.release_sha }}
          API_DIGEST: ${{ needs.alias-manifest.outputs.api-image-digest }}
          WEB_DIGEST: ${{ needs.alias-manifest.outputs.production-web-image-digest }}
          PROMOTED: ${{ needs.promote-production.result }}
        run: |
          set -euo pipefail
          release=false
          latest=false
          health=false
          production=false
          if [[ "$(bash scripts/gh-retry.sh release view "$RELEASE_REF" --json isDraft --jq '.isDraft == false' || true)" == true ]]; then release=true; fi
          api="$(docker buildx imagetools inspect "${REGISTRY}/${IMAGE_NAME}:latest" --format '{{.Manifest.Digest}}' 2>/dev/null || true)"
          web="$(docker buildx imagetools inspect "${REGISTRY}/${WEB_IMAGE_NAME}:latest" --format '{{.Manifest.Digest}}' 2>/dev/null || true)"
          if [[ -n "$API_DIGEST" && -n "$WEB_DIGEST" && "$api" == "$API_DIGEST" && "$web" == "$WEB_DIGEST" ]]; then latest=true; fi
          runs="$(bash scripts/gh-retry.sh api --paginate --slurp "repos/$GITHUB_REPOSITORY/actions/workflows/release-health.yml/runs?event=workflow_dispatch&per_page=100")"
          if jq -e --arg title "Release health $RELEASE_REF" 'any(.[].workflow_runs[]; .display_title == $title)' <<< "$runs" >/dev/null; then health=true; fi
          if [[ "$PROMOTED" == success ]]; then production=true; fi
          jq -n --argjson release "$release" --argjson latest "$latest" --argjson health "$health" --argjson production "$production" \
            '{release: $release, ":latest": $latest, "health-run": $health, production: $production}' > receipts.json
          bash scripts/release-complete.sh receipts.json
