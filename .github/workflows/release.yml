name: Release

env:
  NPM_VERSION: "11.11.1"
  UV_VERSION: "0.10.1"

on:
  push:
    branches: [main]
    paths:
      - VERSION
      - packages/data/package.json
  workflow_dispatch:
    inputs:
      release_target:
        description: Package set to publish
        required: true
        default: runtime
        type: choice
        options:
          - runtime
          - data
      publish_to_npm:
        description: Publish the current package versions to npm AND PyPI after verification (PyPI releases are immutable)
        required: true
        default: false
        type: boolean

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      dist_tag: ${{ steps.dist-tag.outputs.dist_tag }}
      publish_data: ${{ steps.release-scope.outputs.publish_data }}
      publish_runtime: ${{ steps.release-scope.outputs.publish_runtime }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Classify release scope
        id: release-scope
        env:
          BEFORE_SHA: ${{ github.event.before }}
          EVENT_NAME: ${{ github.event_name }}
          HEAD_SHA: ${{ github.sha }}
          RELEASE_TARGET: ${{ inputs.release_target }}
        run: |
          set -euo pipefail
          publish_data=false
          publish_runtime=false

          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            if [[ "$RELEASE_TARGET" == "data" ]]; then
              publish_data=true
            fi
            if [[ "$RELEASE_TARGET" == "runtime" ]]; then
              publish_runtime=true
            fi
          else
            mapfile -t changed_files < <(git diff --name-only "$BEFORE_SHA" "$HEAD_SHA")
            if printf '%s\n' "${changed_files[@]}" | grep -Fxq 'VERSION'; then
              publish_runtime=true
            fi
            if printf '%s\n' "${changed_files[@]}" | grep -Fxq 'packages/data/package.json'; then
              before_data_version="$(
                git show "${BEFORE_SHA}:packages/data/package.json" |
                  node -e '
                    let input = "";
                    process.stdin.on("data", chunk => { input += chunk; });
                    process.stdin.on("end", () => { process.stdout.write(JSON.parse(input).version); });
                  '
              )"
              head_data_version="$(node -p 'require("./packages/data/package.json").version')"
              if [[ "$before_data_version" != "$head_data_version" ]]; then
                publish_data=true
              fi
            fi
          fi

          if [[ "$publish_data" == true && "$publish_runtime" == true ]]; then
            echo "::error::Data and runtime versions must be released in separate commits"
            exit 1
          fi

          echo "publish_data=$publish_data" >> "$GITHUB_OUTPUT"
          echo "publish_runtime=$publish_runtime" >> "$GITHUB_OUTPUT"

      - name: Derive npm dist-tag from VERSION
        id: dist-tag
        run: |
          set -euo pipefail
          if [[ ! -f VERSION ]]; then
            echo "::error::VERSION file is missing"
            exit 1
          fi

          version="$(tr -d '[:space:]' < VERSION)"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-(rc|beta|alpha)\.[0-9]+)?$ ]]; then
            echo "::error::VERSION must look like 1.2.3, 1.2.3-rc.1, 1.2.3-beta.1, or 1.2.3-alpha.1; got '$version'"
            exit 1
          fi

          # Prereleases publish under their identifier (alpha/beta/rc) so a
          # test build never becomes the npm `latest` tag; stable stays latest.
          dist_tag="latest"
          if [[ "$version" =~ -(rc|beta|alpha)\. ]]; then
            dist_tag="${BASH_REMATCH[1]}"
          fi

          echo "dist_tag=$dist_tag" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: "22"
          registry-url: https://registry.npmjs.org

      - name: Verify Bun workflow pin
        run: node .github/tools/check-bun-workflows.mjs

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: "package.json"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Sync runtime package versions
        run: bun run sync:version -- --release

      - name: Verify native sidecar metadata
        run: node .github/tools/check-native-sidecars.mjs

      - name: Setup browser WebAssembly tools
        uses: ./.github/actions/setup-browser-wasm

      - name: Build
        run: bun run build

      - name: Smoke built native package
        run: bun run --cwd packages/anonymize smoke:dist

      - name: Lint
        run: bun run lint

      - name: Typecheck
        run: bun run typecheck

      - name: Install uv
        run: |
          python3 -m pip install --user "uv==${{ env.UV_VERSION }}"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Python typecheck
        run: bun run python:typecheck

      - name: Python wheel
        run: bun run python:wheel
        env:
          ANONYMIZE_PYTHON_WHEEL_PROFILE: release

      - name: Test
        run: bun run test

      - name: Verify package tarballs
        run: node .github/tools/check-packlist.mjs

  pack-native:
    needs: verify
    if: needs.verify.outputs.publish_runtime == 'true' && (github.event_name == 'push' || inputs.publish_to_npm == true)
    name: Pack ${{ matrix.package }}
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include:
          - package: packages/anonymize-linux-x64-gnu
            runner: ubuntu-24.04
          - package: packages/anonymize-linux-arm64-gnu
            runner: ubuntu-24.04-arm
          - package: packages/anonymize-darwin-x64
            runner: macos-15-intel
          - package: packages/anonymize-darwin-arm64
            runner: macos-15
          - package: packages/anonymize-win32-x64-msvc
            runner: windows-2025
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: "22"
          registry-url: https://registry.npmjs.org

      - name: Install npm for packing
        run: npm install --global "npm@${{ env.NPM_VERSION }}"

      - name: Verify Bun workflow pin
        run: node .github/tools/check-bun-workflows.mjs

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: "package.json"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Sync runtime package versions
        run: bun run sync:version -- --release

      - name: Build
        run: bun run build
        env:
          # Native sidecar packs only need the platform .node binding; skip
          # the wasm32-unknown-unknown build on the platform matrix runners.
          STELLA_ANONYMIZE_SKIP_WASM_BUILD: "1"

      - name: Smoke native binding inside a compiled Bun executable
        run: bun run --cwd packages/anonymize smoke:dist

      - name: Enforce native install footprint
        run: node packages/anonymize/scripts/check-native-install-footprint.mjs "${{ matrix.package }}"

      - name: Read package metadata
        id: package
        working-directory: ${{ matrix.package }}
        run: |
          package_name="$(node -p "require('./package.json').name")"
          # shellcheck disable=SC2016  # ${...} is a JS template literal, not a shell expansion
          artifact_name="$(
            node -e '
              const name = require("./package.json").name;
              console.log(`npm-tarball-${name.replace(/^@/, "").replace(/[\\/]/g, "-")}`);
            '
          )"

          echo "name=${package_name}" >> "$GITHUB_OUTPUT"
          echo "artifact_name=${artifact_name}" >> "$GITHUB_OUTPUT"

      - name: Pack package
        id: pack
        working-directory: ${{ matrix.package }}
        run: |
          set -euo pipefail
          pack_dir="$RUNNER_TEMP/npm-tarballs"
          mkdir -p "$pack_dir"

          pack_json="$(npm pack --json --ignore-scripts --pack-destination "$pack_dir")"
          # shellcheck disable=SC2016  # ${...} is a JS template literal, not a shell expansion
          node -e '
            const pack = JSON.parse(process.argv[1])[0];
            const files = new Set(pack.files.map((file) => file.path));
            for (const required of ["index.cjs", "stella_anonymize_napi.node"]) {
              if (!files.has(required)) {
                console.error(`::error::${pack.name} tarball is missing ${required}`);
                process.exit(1);
              }
            }
          ' "$pack_json"
          filename="$(
            node -e '
              const pack = JSON.parse(process.argv[1]);
              console.log(pack[0].filename);
            ' "$pack_json"
          )"

          echo "tarball=${pack_dir}/${filename}" >> "$GITHUB_OUTPUT"

      - name: Upload package tarball
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v5
        with:
          name: ${{ steps.package.outputs.artifact_name }}
          path: ${{ steps.pack.outputs.tarball }}
          if-no-files-found: error

  publish-native:
    needs: [verify, pack-native]
    if: needs.verify.outputs.publish_runtime == 'true' && (github.event_name == 'push' || inputs.publish_to_npm == true)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        artifact:
          - npm-tarball-stll-anonymize-linux-x64-gnu
          - npm-tarball-stll-anonymize-linux-arm64-gnu
          - npm-tarball-stll-anonymize-darwin-x64
          - npm-tarball-stll-anonymize-darwin-arm64
          - npm-tarball-stll-anonymize-win32-x64-msvc
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: ${{ matrix.artifact }}
          path: native-tarball

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: "22"
          registry-url: https://registry.npmjs.org

      - name: Install npm for trusted publishing
        run: npm install --global "npm@${{ env.NPM_VERSION }}"

      - name: Find package tarball
        id: tarball
        run: |
          set -euo pipefail
          shopt -s nullglob
          tarballs=(native-tarball/*.tgz)
          if [[ "${#tarballs[@]}" -ne 1 ]]; then
            echo "::error::Expected one native tarball for ${{ matrix.artifact }}, found ${#tarballs[@]}"
            exit 1
          fi
          echo "path=${tarballs[0]}" >> "$GITHUB_OUTPUT"

      - name: Publish package
        uses: stella/.github/.github/actions/npm-publish-hardened@48aacae31829ce15216a6b766b03a92fd2e84da3
        with:
          tarball: ${{ steps.tarball.outputs.path }}
          tag: ${{ needs.verify.outputs.dist_tag }}

  publish:
    needs: [verify, publish-native]
    if: needs.verify.outputs.publish_runtime == 'true' && (github.event_name == 'push' || inputs.publish_to_npm == true)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        package:
          - packages/anonymize
          - packages/anonymize/wasm
          - packages/cli
          - packages/document-docx
          - packages/document-pdf
          - packages/mcp
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: "22"
          registry-url: https://registry.npmjs.org

      - name: Install npm for trusted publishing
        run: npm install --global "npm@${{ env.NPM_VERSION }}"

      - name: Verify Bun workflow pin
        run: node .github/tools/check-bun-workflows.mjs

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: "package.json"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Sync runtime package versions
        run: bun run sync:version -- --release

      - name: Setup browser WebAssembly tools
        if: matrix.package == 'packages/anonymize/wasm'
        uses: ./.github/actions/setup-browser-wasm

      - name: Build
        run: bun run build
        env:
          # Only the browser package needs generated WebAssembly assets. Other
          # release matrix legs still build their own package normally.
          STELLA_ANONYMIZE_SKIP_WASM_BUILD: ${{ matrix.package == 'packages/anonymize/wasm' && '0' || '1' }}

      - name: Read package metadata
        id: package
        working-directory: ${{ matrix.package }}
        run: |
          package_name="$(node -p "require('./package.json').name")"
          # shellcheck disable=SC2016  # ${...} is a JS template literal, not a shell expansion
          artifact_name="$(
            node -e '
              const name = require("./package.json").name;
              console.log(`npm-tarball-${name.replace(/^@/, "").replace(/[\\/]/g, "-")}`);
            '
          )"

          echo "name=${package_name}" >> "$GITHUB_OUTPUT"
          echo "artifact_name=${artifact_name}" >> "$GITHUB_OUTPUT"

      - name: Pack package
        id: pack
        working-directory: ${{ matrix.package }}
        run: |
          set -euo pipefail
          pack_dir="$RUNNER_TEMP/npm-tarballs"
          mkdir -p "$pack_dir"

          pack_json="$(npm pack --json --ignore-scripts --pack-destination "$pack_dir")"
          filename="$(
            node -e '
              const pack = JSON.parse(process.argv[1]);
              console.log(pack[0].filename);
            ' "$pack_json"
          )"

          echo "tarball=${pack_dir}/${filename}" >> "$GITHUB_OUTPUT"

      - name: Upload package tarball
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v5
        with:
          name: ${{ steps.package.outputs.artifact_name }}
          path: ${{ steps.pack.outputs.tarball }}
          if-no-files-found: error

      - name: Publish package
        uses: stella/.github/.github/actions/npm-publish-hardened@48aacae31829ce15216a6b766b03a92fd2e84da3
        with:
          tarball: ${{ steps.pack.outputs.tarball }}
          tag: ${{ needs.verify.outputs.dist_tag }}

  pack-data:
    needs: verify
    if: needs.verify.outputs.publish_data == 'true' && (github.event_name == 'push' || inputs.publish_to_npm == true)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      dist_tag: ${{ steps.data-version.outputs.dist_tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: "22"

      - name: Install npm for packing
        run: npm install --global --ignore-scripts "npm@${{ env.NPM_VERSION }}"

      - name: Verify Bun workflow pin
        run: node .github/tools/check-bun-workflows.mjs

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: "package.json"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build data package
        run: bun run --filter @stll/anonymize-data build

      - name: Validate data package
        run: |
          bun run --filter @stll/anonymize-data lint
          bun run --filter @stll/anonymize-data typecheck
          node .github/tools/check-packlist.mjs --package packages/data

      - name: Derive data package dist-tag
        id: data-version
        working-directory: packages/data
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-(rc|beta|alpha)\.[0-9]+)?$ ]]; then
            echo "::error::Data package version is invalid: $version"
            exit 1
          fi
          dist_tag=latest
          if [[ "$version" =~ -(rc|beta|alpha)\. ]]; then
            dist_tag="${BASH_REMATCH[1]}"
          fi
          echo "dist_tag=$dist_tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Pack data package
        id: pack
        working-directory: packages/data
        env:
          EXPECTED_VERSION: ${{ steps.data-version.outputs.version }}
        run: |
          set -euo pipefail
          pack_dir="$RUNNER_TEMP/npm-tarballs"
          mkdir -p "$pack_dir"
          pack_json="$(npm pack --json --ignore-scripts --pack-destination "$pack_dir")"
          # shellcheck disable=SC2016  # ${...} is a JS template literal, not a shell expansion
          filename="$(node -e '
            const pack = JSON.parse(process.argv[1]);
            if (pack.length !== 1) throw new Error(`Expected one packed package, got ${pack.length}`);
            if (pack[0].name !== "@stll/anonymize-data") {
              throw new Error(`Unexpected package name: ${pack[0].name}`);
            }
            if (pack[0].version !== process.env.EXPECTED_VERSION) {
              throw new Error(`Unexpected package version: ${pack[0].version}`);
            }
            console.log(pack[0].filename);
          ' "$pack_json")"
          tarball="${pack_dir}/${filename}"
          (cd "$pack_dir" && sha256sum "$filename" > "${filename}.sha256")
          echo "tarball=$tarball" >> "$GITHUB_OUTPUT"

      - name: Upload data package tarball
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v5
        with:
          name: data-package-stll-anonymize-data
          path: |
            ${{ steps.pack.outputs.tarball }}
            ${{ steps.pack.outputs.tarball }}.sha256
          if-no-files-found: error

  publish-data:
    needs: [verify, pack-data]
    if: needs.verify.outputs.publish_data == 'true' && needs.pack-data.result == 'success' && (github.event_name == 'push' || inputs.publish_to_npm == true)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: data-package-stll-anonymize-data
          path: data-tarball

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: "22"
          registry-url: https://registry.npmjs.org

      - name: Install npm for trusted publishing
        run: npm install --global --ignore-scripts "npm@${{ env.NPM_VERSION }}"

      - name: Find data package tarball
        id: tarball
        run: |
          set -euo pipefail
          shopt -s nullglob
          tarballs=(data-tarball/*.tgz)
          checksums=(data-tarball/*.tgz.sha256)
          if [[ "${#tarballs[@]}" -ne 1 || "${#checksums[@]}" -ne 1 ]]; then
            echo "::error::Expected one data tarball and checksum"
            exit 1
          fi
          (cd data-tarball && sha256sum --check "$(basename "${checksums[0]}")")
          echo "path=${tarballs[0]}" >> "$GITHUB_OUTPUT"

      - name: Publish data package
        uses: stella/.github/.github/actions/npm-publish-hardened@48aacae31829ce15216a6b766b03a92fd2e84da3
        with:
          tarball: ${{ steps.tarball.outputs.path }}
          tag: ${{ needs.pack-data.outputs.dist_tag }}

  build-wheels:
    needs: verify
    if: needs.verify.outputs.publish_runtime == 'true' && (github.event_name == 'push' || inputs.publish_to_npm == true)
    name: Build wheel ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-24.04
            manylinux: auto
            # abi3 wheels are Python-agnostic (cp311-abi3), so verifying one
            # matrix wheel exercises the packlist + smoke test for all of them.
            check_wheel: true
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-24.04-arm
            manylinux: auto
          - target: x86_64-apple-darwin
            runner: macos-15-intel
          - target: aarch64-apple-darwin
            runner: macos-15
          - target: x86_64-pc-windows-msvc
            runner: windows-2025
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: "22"

      - name: Verify Bun workflow pin
        run: node .github/tools/check-bun-workflows.mjs

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: "package.json"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Sync runtime package versions
        run: bun run sync:version -- --release

      - name: Build native pipeline packages
        run: bun run build
        env:
          # The wheel only needs the generated .stlanonpkg native pipeline
          # packages; skip the wasm32-unknown-unknown build like pack-native.
          STELLA_ANONYMIZE_SKIP_WASM_BUILD: "1"

      - name: Bundle native pipeline packages into the wheel source
        run: |
          set -euo pipefail
          source_dir="packages/anonymize"
          target_dir="crates/anonymize-py/python/stella_anonymize/native_packages"
          if [[ ! -f "${source_dir}/native-pipeline.stlanonpkg" ]]; then
            echo "::error::native-pipeline.stlanonpkg missing from ${source_dir}; bun run build did not emit it"
            exit 1
          fi
          if [[ ! -f "${source_dir}/default-pipeline-input.json.gz" ]]; then
            echo "::error::default-pipeline-input.json.gz missing from ${source_dir}; bun run build did not emit it"
            exit 1
          fi
          mkdir -p "${target_dir}"
          shopt -s nullglob
          for package in "${source_dir}"/native-pipeline*.stlanonpkg; do
            cp "${package}" "${target_dir}/"
          done
          cp "${source_dir}/default-pipeline-input.json.gz" "${target_dir}/"

      - name: Remove host cargo artifacts before the container build
        # "Build native pipeline packages" compiles the workspace against the
        # runner's glibc. The manylinux container shares the workspace target
        # directory and would try to execute those host-built build scripts,
        # failing with GLIBC version errors. The .stlanonpkg outputs are
        # already bundled into the wheel source, so a clean target is safe.
        if: runner.os == 'Linux'
        run: rm -rf target

      - name: Build wheel
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          target: ${{ matrix.target }}
          # Ignored on macOS/Windows; drives the manylinux container on Linux.
          manylinux: ${{ matrix.manylinux || 'auto' }}
          rust-toolchain: "1.96.0"
          args: >-
            --release
            --locked
            --manifest-path crates/anonymize-py/Cargo.toml
            --out dist
        env:
          # Non-container builds honour this directly; Linux wheels are already
          # guarded by the bundle step above.
          STELLA_ANONYMIZE_REQUIRE_NATIVE_PACKAGES: "1"

      - name: Install uv
        if: matrix.check_wheel
        run: |
          python3 -m pip install --user "uv==${{ env.UV_VERSION }}"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Verify wheel packlist and smoke test
        if: matrix.check_wheel
        run: |
          set -euo pipefail
          shopt -s nullglob
          wheels=(dist/*.whl)
          if [[ "${#wheels[@]}" -ne 1 ]]; then
            echo "::error::Expected one wheel for ${{ matrix.target }}, found ${#wheels[@]}"
            exit 1
          fi
          ANONYMIZE_PYTHON_WHEEL_PATH="${wheels[0]}" bun run python:wheel

      - name: Upload wheel artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v5
        with:
          name: python-wheel-${{ matrix.target }}
          path: dist/*.whl
          if-no-files-found: error

  publish-pypi:
    needs: [verify, build-wheels]
    if: needs.verify.outputs.publish_runtime == 'true' && (github.event_name == 'push' || inputs.publish_to_npm == true)
    runs-on: ubuntu-latest
    permissions:
      # Trusted Publishing (OIDC): no PyPI API token is stored in the repo.
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: python-wheel-*
          path: dist
          merge-multiple: true

      - name: Check wheels are present
        run: |
          set -euo pipefail
          shopt -s nullglob
          wheels=(dist/*.whl)
          if [[ "${#wheels[@]}" -eq 0 ]]; then
            echo "::error::No wheels found to publish to PyPI"
            exit 1
          fi
          printf 'Publishing %d wheel(s):\n' "${#wheels[@]}"
          printf '  %s\n' "${wheels[@]}"

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: dist

  github-release:
    name: Finalize release
    needs: [verify, publish-native, publish, publish-pypi]
    if: needs.verify.outputs.publish_runtime == 'true' && needs.publish-native.result == 'success' && needs.publish.result == 'success' && needs.publish-pypi.result == 'success' && (github.event_name == 'push' || inputs.publish_to_npm == true)
    uses: stella/.github/.github/workflows/npm-version-finalize.yml@7198083e27bdd963cacc0b7d70ca54fe3ec83393
    with:
      package-files: |
        packages/anonymize/package.json
        packages/anonymize/wasm/package.json
        packages/cli/package.json
        packages/document-docx/package.json
        packages/document-pdf/package.json
        packages/mcp/package.json
        packages/anonymize-linux-x64-gnu/package.json
        packages/anonymize-linux-arm64-gnu/package.json
        packages/anonymize-darwin-x64/package.json
        packages/anonymize-win32-x64-msvc/package.json
      artifact-pattern: npm-tarball-*
      publish-to-npm: true
      update-changelog: false
    permissions:
      contents: write
      id-token: write
    secrets: inherit
