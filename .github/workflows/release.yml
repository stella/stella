name: Release

env:
  NPM_VERSION: "11.11.1"
  UV_VERSION: "0.10.1"

on:
  push:
    branches: [main]
    paths:
      - VERSION
      - packages/data/package.json
  workflow_dispatch:
    inputs:
      release_target:
        description: Package set to publish
        required: true
        default: runtime
        type: choice
        options:
          - runtime
          - data
      publish_to_npm:
        description: Publish the current package versions to npm AND PyPI after verification (PyPI releases are immutable)
        required: true
        default: false
        type: boolean

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions: {}

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      dist_tag: ${{ steps.dist-tag.outputs.dist_tag }}
      publish_data: ${{ steps.release-scope.outputs.publish_data }}
      publish_runtime: ${{ steps.release-scope.outputs.publish_runtime }}
      version: ${{ steps.dist-tag.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Classify release scope
        id: release-scope
        env:
          BEFORE_SHA: ${{ github.event.before }}
          EVENT_NAME: ${{ github.event_name }}
          HEAD_SHA: ${{ github.sha }}
          RELEASE_TARGET: ${{ inputs.release_target }}
        run: |
          set -euo pipefail
          publish_data=false
          publish_runtime=false

          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            if [[ "$RELEASE_TARGET" == "data" ]]; then
              publish_data=true
            fi
            if [[ "$RELEASE_TARGET" == "runtime" ]]; then
              publish_runtime=true
            fi
          else
            mapfile -t changed_files < <(git diff --name-only "$BEFORE_SHA" "$HEAD_SHA")
            if printf '%s\n' "${changed_files[@]}" | grep -Fxq 'VERSION'; then
              publish_runtime=true
            fi
            if printf '%s\n' "${changed_files[@]}" | grep -Fxq 'packages/data/package.json'; then
              before_data_version="$(
                git show "${BEFORE_SHA}:packages/data/package.json" |
                  node -e '
                    let input = "";
                    process.stdin.on("data", chunk => { input += chunk; });
                    process.stdin.on("end", () => { process.stdout.write(JSON.parse(input).version); });
                  '
              )"
              head_data_version="$(node -p 'require("./packages/data/package.json").version')"
              if [[ "$before_data_version" != "$head_data_version" ]]; then
                publish_data=true
              fi
            fi
          fi

          if [[ "$publish_data" == true && "$publish_runtime" == true ]]; then
            echo "::error::Data and runtime versions must be released in separate commits"
            exit 1
          fi

          echo "publish_data=$publish_data" >> "$GITHUB_OUTPUT"
          echo "publish_runtime=$publish_runtime" >> "$GITHUB_OUTPUT"

      - name: Derive npm dist-tag from VERSION
        id: dist-tag
        run: |
          set -euo pipefail
          if [[ ! -f VERSION ]]; then
            echo "::error::VERSION file is missing"
            exit 1
          fi

          version="$(tr -d '[:space:]' < VERSION)"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-(rc|beta|alpha)\.[0-9]+)?$ ]]; then
            echo "::error::VERSION must look like 1.2.3, 1.2.3-rc.1, 1.2.3-beta.1, or 1.2.3-alpha.1; got '$version'"
            exit 1
          fi

          # Prereleases publish under their identifier (alpha/beta/rc) so a
          # test build never becomes the npm `latest` tag; stable stays latest.
          dist_tag="latest"
          if [[ "$version" =~ -(rc|beta|alpha)\. ]]; then
            dist_tag="${BASH_REMATCH[1]}"
          fi

          echo "dist_tag=$dist_tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: "22"
          registry-url: https://registry.npmjs.org

      - name: Verify Bun workflow pin
        run: node .github/tools/check-bun-workflows.mjs

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: "package.json"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Sync runtime package versions
        run: bun run sync:version -- --release

      - name: Verify native sidecar metadata
        run: node .github/tools/check-native-sidecars.mjs

      - name: Setup browser WebAssembly tools
        uses: ./.github/actions/setup-browser-wasm

      - name: Build
        run: bun run build

      - name: Smoke built native package
        run: bun run --cwd packages/anonymize smoke:dist

      - name: Lint
        run: bun run lint

      - name: Typecheck
        run: bun run typecheck

      - name: Install uv
        run: |
          python3 -m pip install --user "uv==${UV_VERSION}"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Python typecheck
        run: bun run python:typecheck

      - name: Python wheel
        run: bun run python:wheel
        env:
          ANONYMIZE_PYTHON_WHEEL_PROFILE: release

      - name: Test
        run: bun run test

      - name: Verify package tarballs
        run: node .github/tools/check-packlist.mjs

  pack-native:
    needs: verify
    if: needs.verify.outputs.publish_runtime == 'true' && (github.event_name == 'push' || inputs.publish_to_npm == true)
    name: Pack ${{ matrix.package }}
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include:
          - package: packages/anonymize-linux-x64-gnu
            runner: ubuntu-24.04
          - package: packages/anonymize-linux-arm64-gnu
            runner: ubuntu-24.04-arm
          - package: packages/anonymize-darwin-x64
            runner: macos-15-intel
          - package: packages/anonymize-darwin-arm64
            runner: macos-15
          - package: packages/anonymize-win32-x64-msvc
            runner: windows-2025
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: "22"
          registry-url: https://registry.npmjs.org

      - name: Install npm for packing
        # Packing uses this exact CLI with lifecycle scripts disabled and no OIDC.
        # zizmor: ignore[adhoc-packages]
        run: npm install --global --ignore-scripts "npm@${NPM_VERSION}"

      - name: Verify Bun workflow pin
        run: node .github/tools/check-bun-workflows.mjs

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: "package.json"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Sync runtime package versions
        run: bun run sync:version -- --release

      - name: Build
        run: bun run build
        env:
          # Native sidecar packs only need the platform .node binding; skip
          # the wasm32-unknown-unknown build on the platform matrix runners.
          STELLA_ANONYMIZE_SKIP_WASM_BUILD: "1"

      - name: Smoke native binding inside a compiled Bun executable
        run: bun run --cwd packages/anonymize smoke:dist

      - name: Enforce native install footprint
        env:
          NATIVE_PACKAGE: ${{ matrix.package }}
        run: node packages/anonymize/scripts/check-native-install-footprint.mjs "$NATIVE_PACKAGE"

      - name: Read package metadata
        id: package
        working-directory: ${{ matrix.package }}
        run: |
          package_name="$(node -p "require('./package.json').name")"
          # shellcheck disable=SC2016  # ${...} is a JS template literal, not a shell expansion
          artifact_name="$(
            node -e '
              const name = require("./package.json").name;
              console.log(`npm-tarball-${name.replace(/^@/, "").replace(/[\\/]/g, "-")}`);
            '
          )"

          echo "name=${package_name}" >> "$GITHUB_OUTPUT"
          echo "artifact_name=${artifact_name}" >> "$GITHUB_OUTPUT"

      - name: Pack package
        id: pack
        working-directory: ${{ matrix.package }}
        run: |
          set -euo pipefail
          pack_dir="$RUNNER_TEMP/npm-tarballs"
          mkdir -p "$pack_dir"

          pack_json="$(npm pack --json --ignore-scripts --pack-destination "$pack_dir")"
          # shellcheck disable=SC2016  # ${...} is a JS template literal, not a shell expansion
          node -e '
            const pack = JSON.parse(process.argv[1])[0];
            const files = new Set(pack.files.map((file) => file.path));
            for (const required of ["index.cjs", "stella_anonymize_napi.node"]) {
              if (!files.has(required)) {
                console.error(`::error::${pack.name} tarball is missing ${required}`);
                process.exit(1);
              }
            }
          ' "$pack_json"
          filename="$(
            node -e '
              const pack = JSON.parse(process.argv[1]);
              console.log(pack[0].filename);
            ' "$pack_json"
          )"

          echo "tarball=${pack_dir}/${filename}" >> "$GITHUB_OUTPUT"

      - name: Upload package tarball
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v5
        with:
          name: ${{ steps.package.outputs.artifact_name }}
          path: ${{ steps.pack.outputs.tarball }}
          if-no-files-found: error

  pack-runtime:
    name: Pack ${{ matrix.package }}
    needs: verify
    if: needs.verify.outputs.publish_runtime == 'true' && (github.event_name == 'push' || inputs.publish_to_npm == true)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        package:
          - packages/anonymize
          - packages/anonymize/wasm
          - packages/cli
          - packages/document-docx
          - packages/document-pdf
          - packages/mcp
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: "22"
          registry-url: https://registry.npmjs.org

      - name: Install npm for packing
        # Packing uses this exact CLI with lifecycle scripts disabled and no OIDC.
        # zizmor: ignore[adhoc-packages]
        run: npm install --global --ignore-scripts "npm@${NPM_VERSION}"

      - name: Verify Bun workflow pin
        run: node .github/tools/check-bun-workflows.mjs

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: "package.json"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Sync runtime package versions
        run: bun run sync:version -- --release

      - name: Setup browser WebAssembly tools
        if: matrix.package == 'packages/anonymize/wasm'
        uses: ./.github/actions/setup-browser-wasm

      - name: Build
        run: bun run build
        env:
          # Only the browser package needs generated WebAssembly assets. Other
          # release matrix legs still build their own package normally.
          STELLA_ANONYMIZE_SKIP_WASM_BUILD: ${{ matrix.package == 'packages/anonymize/wasm' && '0' || '1' }}

      - name: Read package metadata
        id: package
        working-directory: ${{ matrix.package }}
        run: |
          package_name="$(node -p "require('./package.json').name")"
          # shellcheck disable=SC2016  # ${...} is a JS template literal, not a shell expansion
          artifact_name="$(
            node -e '
              const name = require("./package.json").name;
              console.log(`npm-tarball-${name.replace(/^@/, "").replace(/[\\/]/g, "-")}`);
            '
          )"

          echo "name=${package_name}" >> "$GITHUB_OUTPUT"
          echo "artifact_name=${artifact_name}" >> "$GITHUB_OUTPUT"

      - name: Pack package
        id: pack
        working-directory: ${{ matrix.package }}
        run: |
          set -euo pipefail
          pack_dir="$RUNNER_TEMP/npm-tarballs"
          mkdir -p "$pack_dir"

          pack_json="$(npm pack --json --ignore-scripts --pack-destination "$pack_dir")"
          filename="$(
            node -e '
              const pack = JSON.parse(process.argv[1]);
              console.log(pack[0].filename);
            ' "$pack_json"
          )"

          echo "tarball=${pack_dir}/${filename}" >> "$GITHUB_OUTPUT"

      - name: Upload package tarball
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v5
        with:
          name: ${{ steps.package.outputs.artifact_name }}
          path: ${{ steps.pack.outputs.tarball }}
          if-no-files-found: error

  pack-data:
    name: Pack data package
    needs: verify
    if: needs.verify.outputs.publish_data == 'true' && (github.event_name == 'push' || inputs.publish_to_npm == true)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      dist_tag: ${{ steps.data-version.outputs.dist_tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: "22"

      - name: Install npm for packing
        # Packing uses this exact CLI with lifecycle scripts disabled and no OIDC.
        # zizmor: ignore[adhoc-packages]
        run: npm install --global --ignore-scripts "npm@${NPM_VERSION}"

      - name: Verify Bun workflow pin
        run: node .github/tools/check-bun-workflows.mjs

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: "package.json"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build data package
        run: bun run --filter @stll/anonymize-data build

      - name: Validate data package
        run: |
          bun run --filter @stll/anonymize-data lint
          bun run --filter @stll/anonymize-data typecheck
          node .github/tools/check-packlist.mjs --package packages/data

      - name: Derive data package dist-tag
        id: data-version
        working-directory: packages/data
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-(rc|beta|alpha)\.[0-9]+)?$ ]]; then
            echo "::error::Data package version is invalid: $version"
            exit 1
          fi
          dist_tag=latest
          if [[ "$version" =~ -(rc|beta|alpha)\. ]]; then
            dist_tag="${BASH_REMATCH[1]}"
          fi
          echo "dist_tag=$dist_tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Pack data package
        id: pack
        working-directory: packages/data
        env:
          EXPECTED_VERSION: ${{ steps.data-version.outputs.version }}
        run: |
          set -euo pipefail
          pack_dir="$RUNNER_TEMP/npm-tarballs"
          mkdir -p "$pack_dir"
          pack_json="$(npm pack --json --ignore-scripts --pack-destination "$pack_dir")"
          # shellcheck disable=SC2016  # ${...} is a JS template literal, not a shell expansion
          filename="$(node -e '
            const pack = JSON.parse(process.argv[1]);
            if (pack.length !== 1) throw new Error(`Expected one packed package, got ${pack.length}`);
            if (pack[0].name !== "@stll/anonymize-data") {
              throw new Error(`Unexpected package name: ${pack[0].name}`);
            }
            if (pack[0].version !== process.env.EXPECTED_VERSION) {
              throw new Error(`Unexpected package version: ${pack[0].version}`);
            }
            console.log(pack[0].filename);
          ' "$pack_json")"
          tarball="${pack_dir}/${filename}"
          (cd "$pack_dir" && sha256sum "$filename" > "${filename}.sha256")
          echo "tarball=$tarball" >> "$GITHUB_OUTPUT"

      - name: Upload data package tarball
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v5
        with:
          name: data-package-stll-anonymize-data
          path: |
            ${{ steps.pack.outputs.tarball }}
            ${{ steps.pack.outputs.tarball }}.sha256
          if-no-files-found: error

  publish-data:
    name: Publish data package
    needs: [verify, pack-data]
    if: needs.verify.outputs.publish_data == 'true' && needs.pack-data.result == 'success' && (github.event_name == 'push' || inputs.publish_to_npm == true)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # Required only for npm trusted publishing.
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: data-package-stll-anonymize-data
          path: data-tarball

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: "22"
          registry-url: https://registry.npmjs.org

      - name: Install npm for trusted publishing
        # Trusted publishing needs npm 11.5.1 or newer; lifecycle scripts stay disabled.
        # zizmor: ignore[adhoc-packages]
        run: npm install --global --ignore-scripts "npm@${NPM_VERSION}"

      - name: Find data package tarball
        id: tarball
        run: |
          set -euo pipefail
          shopt -s nullglob
          tarballs=(data-tarball/*.tgz)
          checksums=(data-tarball/*.tgz.sha256)
          if [[ "${#tarballs[@]}" -ne 1 || "${#checksums[@]}" -ne 1 ]]; then
            echo "::error::Expected one data tarball and checksum"
            exit 1
          fi
          (cd data-tarball && sha256sum --check "$(basename "${checksums[0]}")")
          echo "path=${tarballs[0]}" >> "$GITHUB_OUTPUT"

      - name: Publish data package
        uses: stella/.github/.github/actions/npm-publish-hardened@48aacae31829ce15216a6b766b03a92fd2e84da3
        with:
          tarball: ${{ steps.tarball.outputs.path }}
          tag: ${{ needs.pack-data.outputs.dist_tag }}

  build-wheels:
    needs: verify
    if: needs.verify.outputs.publish_runtime == 'true' && (github.event_name == 'push' || inputs.publish_to_npm == true)
    name: Build wheel ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-24.04
            manylinux: auto
            # abi3 wheels are Python-agnostic (cp311-abi3), so verifying one
            # matrix wheel exercises the packlist + smoke test for all of them.
            check_wheel: true
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-24.04-arm
            manylinux: auto
          - target: x86_64-apple-darwin
            runner: macos-15-intel
          - target: aarch64-apple-darwin
            runner: macos-15
          - target: x86_64-pc-windows-msvc
            runner: windows-2025
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: "22"

      - name: Verify Bun workflow pin
        run: node .github/tools/check-bun-workflows.mjs

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: "package.json"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Sync runtime package versions
        run: bun run sync:version -- --release

      - name: Build native pipeline packages
        run: bun run build
        env:
          # The wheel only needs the generated .stlanonpkg native pipeline
          # packages; skip the wasm32-unknown-unknown build like pack-native.
          STELLA_ANONYMIZE_SKIP_WASM_BUILD: "1"

      - name: Bundle native pipeline packages into the wheel source
        run: |
          set -euo pipefail
          source_dir="packages/anonymize"
          target_dir="crates/anonymize-py/python/stella_anonymize/native_packages"
          if [[ ! -f "${source_dir}/native-pipeline.stlanonpkg" ]]; then
            echo "::error::native-pipeline.stlanonpkg missing from ${source_dir}; bun run build did not emit it"
            exit 1
          fi
          if [[ ! -f "${source_dir}/default-pipeline-input.json.gz" ]]; then
            echo "::error::default-pipeline-input.json.gz missing from ${source_dir}; bun run build did not emit it"
            exit 1
          fi
          mkdir -p "${target_dir}"
          shopt -s nullglob
          for package in "${source_dir}"/native-pipeline*.stlanonpkg; do
            cp "${package}" "${target_dir}/"
          done
          cp "${source_dir}/default-pipeline-input.json.gz" "${target_dir}/"

      - name: Remove host cargo artifacts before the container build
        # "Build native pipeline packages" compiles the workspace against the
        # runner's glibc. The manylinux container shares the workspace target
        # directory and would try to execute those host-built build scripts,
        # failing with GLIBC version errors. The .stlanonpkg outputs are
        # already bundled into the wheel source, so a clean target is safe.
        if: runner.os == 'Linux'
        run: rm -rf target

      - name: Build wheel
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          target: ${{ matrix.target }}
          # Ignored on macOS/Windows; drives the manylinux container on Linux.
          manylinux: ${{ matrix.manylinux || 'auto' }}
          rust-toolchain: "1.96.0"
          args: >-
            --release
            --locked
            --manifest-path crates/anonymize-py/Cargo.toml
            --out dist
        env:
          # Non-container builds honour this directly; Linux wheels are already
          # guarded by the bundle step above.
          STELLA_ANONYMIZE_REQUIRE_NATIVE_PACKAGES: "1"

      - name: Install uv
        if: matrix.check_wheel
        run: |
          python3 -m pip install --user "uv==${UV_VERSION}"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Verify wheel packlist and smoke test
        if: matrix.check_wheel
        env:
          WHEEL_TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          wheels=(dist/*.whl)
          if [[ "${#wheels[@]}" -ne 1 ]]; then
            echo "::error::Expected one wheel for ${WHEEL_TARGET}, found ${#wheels[@]}"
            exit 1
          fi
          ANONYMIZE_PYTHON_WHEEL_PATH="${wheels[0]}" bun run python:wheel

      - name: Upload wheel artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v5
        with:
          name: python-wheel-${{ matrix.target }}
          path: dist/*.whl
          if-no-files-found: error

  publish-pypi:
    name: Publish Python wheels
    needs: [verify, build-wheels]
    if: needs.verify.outputs.publish_runtime == 'true' && (github.event_name == 'push' || inputs.publish_to_npm == true)
    runs-on: ubuntu-latest
    permissions:
      # Trusted Publishing (OIDC): no PyPI API token is stored in the repo.
      id-token: write # Required only for PyPI trusted publishing.
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: python-wheel-*
          path: wheel-artifacts

      - name: Validate Python wheel artifacts
        env:
          EXPECTED_VERSION: ${{ needs.verify.outputs.version }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from email.parser import BytesParser
          from email.policy import default
          from pathlib import Path
          from zipfile import ZipFile
          import os
          import re
          import shutil

          project_name = "stella-anonymize-core"
          distribution_name = "stella_anonymize_core"
          version_match = re.fullmatch(
              r"([0-9]+\.[0-9]+\.[0-9]+)(?:-(alpha|beta|rc)\.([0-9]+))?",
              os.environ["EXPECTED_VERSION"],
          )
          if version_match is None:
              raise SystemExit("::error::EXPECTED_VERSION is not a supported release version")

          base_version, prerelease, prerelease_number = version_match.groups()
          prerelease_label = {"alpha": "a", "beta": "b", "rc": "rc"}
          wheel_version = base_version
          if prerelease is not None:
              wheel_version += f"{prerelease_label[prerelease]}{prerelease_number}"

          expected = {
              "python-wheel-x86_64-unknown-linux-gnu": (
                  f"{distribution_name}-{wheel_version}-cp311-abi3-"
                  "manylinux_2_17_x86_64.manylinux2014_x86_64.whl",
                  {
                      "cp311-abi3-manylinux_2_17_x86_64",
                      "cp311-abi3-manylinux2014_x86_64",
                  },
              ),
              "python-wheel-aarch64-unknown-linux-gnu": (
                  f"{distribution_name}-{wheel_version}-cp311-abi3-"
                  "manylinux_2_17_aarch64.manylinux2014_aarch64.whl",
                  {
                      "cp311-abi3-manylinux_2_17_aarch64",
                      "cp311-abi3-manylinux2014_aarch64",
                  },
              ),
              "python-wheel-x86_64-apple-darwin": (
                  f"{distribution_name}-{wheel_version}-cp311-abi3-"
                  "macosx_10_12_x86_64.whl",
                  {"cp311-abi3-macosx_10_12_x86_64"},
              ),
              "python-wheel-aarch64-apple-darwin": (
                  f"{distribution_name}-{wheel_version}-cp311-abi3-"
                  "macosx_11_0_arm64.whl",
                  {"cp311-abi3-macosx_11_0_arm64"},
              ),
              "python-wheel-x86_64-pc-windows-msvc": (
                  f"{distribution_name}-{wheel_version}-cp311-abi3-win_amd64.whl",
                  {"cp311-abi3-win_amd64"},
              ),
          }

          artifact_root = Path("wheel-artifacts")
          actual_artifacts = {path.name for path in artifact_root.iterdir()}
          if actual_artifacts != set(expected):
              raise SystemExit(
                  "::error::Unexpected Python wheel artifact set: "
                  f"{sorted(actual_artifacts)}"
              )

          publish_dir = Path("dist")
          publish_dir.mkdir()
          max_metadata_bytes = 1_048_576

          for artifact_name, (filename, expected_tags) in expected.items():
              artifact_dir = artifact_root / artifact_name
              if not artifact_dir.is_dir() or artifact_dir.is_symlink():
                  raise SystemExit(f"::error::{artifact_dir} must be a directory")
              entries = list(artifact_dir.iterdir())
              if len(entries) != 1 or entries[0].name != filename:
                  raise SystemExit(
                      f"::error::{artifact_name} must contain only {filename}"
                  )

              wheel_path = entries[0]
              if not wheel_path.is_file() or wheel_path.is_symlink():
                  raise SystemExit(f"::error::{wheel_path} must be a regular file")

              dist_info = f"{distribution_name}-{wheel_version}.dist-info"
              metadata_path = f"{dist_info}/METADATA"
              wheel_metadata_path = f"{dist_info}/WHEEL"
              with ZipFile(wheel_path) as wheel:
                  names = wheel.namelist()
                  for member in (metadata_path, wheel_metadata_path):
                      if names.count(member) != 1:
                          raise SystemExit(
                              f"::error::{wheel_path} must contain exactly one {member}"
                          )
                      if wheel.getinfo(member).file_size > max_metadata_bytes:
                          raise SystemExit(f"::error::{wheel_path} metadata is too large")

                  metadata = BytesParser(policy=default).parsebytes(
                      wheel.read(metadata_path)
                  )
                  if metadata["Name"] != project_name:
                      raise SystemExit(
                          f"::error::{wheel_path} has unexpected project name "
                          f"{metadata['Name']}"
                      )
                  if metadata["Version"] != wheel_version:
                      raise SystemExit(
                          f"::error::{wheel_path} has unexpected version "
                          f"{metadata['Version']}"
                      )

                  wheel_metadata = BytesParser(policy=default).parsebytes(
                      wheel.read(wheel_metadata_path)
                  )
                  actual_tags = wheel_metadata.get_all("Tag", [])
                  if (
                      len(actual_tags) != len(expected_tags)
                      or set(actual_tags) != expected_tags
                  ):
                      raise SystemExit(
                          f"::error::{wheel_path} has unexpected wheel tags "
                          f"{sorted(actual_tags)}"
                      )

              shutil.copyfile(wheel_path, publish_dir / filename)

          print(f"Validated {len(expected)} Python wheels for {project_name}@{wheel_version}")
          PY

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: dist
          skip-existing: true

  github-release:
    name: Publish and finalize runtime release
    needs: [verify, pack-native, pack-runtime, publish-pypi]
    if: needs.verify.outputs.publish_runtime == 'true' && needs.pack-native.result == 'success' && needs.pack-runtime.result == 'success' && needs.publish-pypi.result == 'success' && (github.event_name == 'push' || inputs.publish_to_npm == true)
    uses: stella/.github/.github/workflows/npm-version-finalize.yml@1ce0079bbdbf93a4c1917d2857496b89aedcec14
    with:
      package-files: |
        packages/anonymize/package.json
        packages/anonymize/wasm/package.json
        packages/cli/package.json
        packages/document-docx/package.json
        packages/document-pdf/package.json
        packages/mcp/package.json
        packages/anonymize-linux-x64-gnu/package.json
        packages/anonymize-linux-arm64-gnu/package.json
        packages/anonymize-darwin-arm64/package.json
        packages/anonymize-darwin-x64/package.json
        packages/anonymize-win32-x64-msvc/package.json
      artifact-pattern: npm-tarball-*
      publish-to-npm: true
      update-changelog: false
    permissions:
      contents: write # Required to create the runtime tag and GitHub release.
      id-token: write # Required only for npm trusted publishing.
    secrets:
      CHANGELOG_APP_ID: ${{ secrets.CHANGELOG_APP_ID }}
      CHANGELOG_APP_PRIVATE_KEY: ${{ secrets.CHANGELOG_APP_PRIVATE_KEY }}
      RELEASE_APP_ID: ${{ secrets.RELEASE_APP_ID }}
      RELEASE_APP_PRIVATE_KEY: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
