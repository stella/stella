name: Publish npm packages

# release-chain-alert
defaults:
  run:
    shell: bash

# Keep this filename stable: npm trusted publishing authorizes the calling
# repository workflow, even though the privileged release transaction is
# implemented with the pinned stella/.github release tooling.
#
# Shared libraries publish from version bumps on main. The CLI remains gated on
# the exact stable Release Artifacts production job receipt and its RC SHA.
# RC runs publish no npm versions. Build, lifecycle, pack, and canary commands
# run without OIDC; only the reusable release jobs receive id-token and
# contents-write permissions.

env:
  NODE_VERSION: "22"

permissions: {}

on:
  push:
    branches: [main]
    paths:
      # Changesets owns these files, so ordinary manifest maintenance cannot
      # accidentally start a release transaction.
      - packages/auth-model/CHANGELOG.md
      - packages/business-registries/CHANGELOG.md
      - packages/ai-catalog/CHANGELOG.md
      - packages/anonymize-chat/CHANGELOG.md
      - packages/chat/CHANGELOG.md
      - packages/country-codes/CHANGELOG.md
      - packages/conditions/CHANGELOG.md
      - packages/money/CHANGELOG.md
      - packages/calculations/CHANGELOG.md
      - packages/template-conditions/CHANGELOG.md
      - packages/docx-utils/CHANGELOG.md
      - packages/ssr-kit/CHANGELOG.md
      - packages/ssr-testkit/CHANGELOG.md
      - packages/start-runtime/CHANGELOG.md
      - packages/ui/CHANGELOG.md
      - packages/workspace-model/CHANGELOG.md
      - packages/workspace-ui/CHANGELOG.md
      - packages/stable-stringify/CHANGELOG.md
      - packages/text-normalize/CHANGELOG.md
      - packages/agent-input/CHANGELOG.md
      - packages/mcp-kit/CHANGELOG.md
      - packages/fetch/CHANGELOG.md
      - packages/scan-engine/CHANGELOG.md
  workflow_run: # zizmor: ignore[dangerous-triggers] the release tag and SHA are revalidated before the release job receives id-token
    workflows: ["Release Artifacts"]
    types: [completed]
  workflow_dispatch:
    inputs:
      package:
        description: Package(s) to publish (dependency order is resolved centrally)
        type: choice
        options:
          - all
          - auth-model
          - ai-catalog
          - anonymize-chat
          - business-registries
          - chat
          - country-codes
          - conditions
          - money
          - calculations
          - template-conditions
          - docx-utils
          - ssr-kit
          - ssr-testkit
          - start-runtime
          - ui
          - workspace-model
          - workspace-ui
          - stable-stringify
          - text-normalize
          - agent-input
          - mcp-kit
          - fetch
          - scan-engine
          - cli
        default: all
      publish:
        description: Publish to npm (leave unchecked for a build + pack dry run)
        type: boolean
        default: false
      release_ref:
        description: Stable production release tag; required when manually publishing cli
        required: false
        type: string
      source_sha:
        description: Exact commit SHA for recovering one existing immutable package tag
        required: false
        type: string
      artifact_run_id:
        description: Exact prior Publish npm packages run whose packed artifact should be resumed
        required: false
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-trigger:
    name: Resolve release trigger
    # A workflow_run trigger is accepted only from this repository's own
    # release workflow, started by a tag push or a manual dispatch.
    if: >-
      github.event_name != 'workflow_run'
      || (github.event.workflow_run.head_repository.full_name == github.repository
      && github.event.workflow_run.path == '.github/workflows/release.yml'
      && contains(fromJSON('["push", "workflow_dispatch"]'), github.event.workflow_run.event))
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: read # Download the completed release workflow's source receipt.
      contents: read # Resolve the exact release tag and receipt.
    outputs:
      eligible: ${{ steps.source.outputs.eligible }}
      release_ref: ${{ steps.source.outputs.release_ref }}
      release_sha: ${{ steps.source.outputs.release_sha }}
    steps:
      - name: Checkout GitHub API tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.repository }}
          ref: ${{ github.workflow_sha }}
          path: .gh-retry
          persist-credentials: false
          sparse-checkout: |
            scripts/gh-retry.sh
            scripts/check-release-publication-source.sh
          sparse-checkout-cone-mode: false

      - name: Preserve GitHub API tooling across source checkouts
        run: |
          cp "$GITHUB_WORKSPACE/.gh-retry/scripts/gh-retry.sh" "$RUNNER_TEMP/gh-retry.sh"
          echo "GH_RETRY_SCRIPT=$RUNNER_TEMP/gh-retry.sh" >> "$GITHUB_ENV"
      - name: Preserve release publication verification
        run: |
          cp "$GITHUB_WORKSPACE/.gh-retry/scripts/check-release-publication-source.sh" "$RUNNER_TEMP/check-release-publication-source.sh"

      - name: Resolve upstream release receipt
        id: source
        env:
          EVENT_NAME: ${{ github.event_name }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          UPSTREAM_EVENT: ${{ github.event.workflow_run.event || '' }}
          UPSTREAM_HEAD_SHA: ${{ github.event.workflow_run.head_sha || '' }}
          UPSTREAM_RUN_ID: ${{ github.event.workflow_run.id || '' }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" != "workflow_run" ]]; then
            echo "eligible=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          receipt_dir="${RUNNER_TEMP}/release-source-receipt"
          bash "$GH_RETRY_SCRIPT" run download "$UPSTREAM_RUN_ID" \
            --repo "$GITHUB_REPOSITORY" \
            --name release-source-receipt \
            --dir "$receipt_dir"
          receipt="${receipt_dir}/release-source-receipt.json"
          release_ref="$(jq -er '.release_ref | strings' "$receipt")"
          release_sha="$(jq -er '.release_sha | strings' "$receipt")"
          if [[ ! "$release_ref" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-(rc|beta|alpha)\.[0-9]+)?$ ]]; then
            echo "::error::Upstream release receipt has an invalid release_ref: ${release_ref}" >&2
            exit 1
          fi
          if [[ ! "$release_sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Upstream release receipt has an invalid release_sha." >&2
            exit 1
          fi
          eligible=false
          if [[ "$release_ref" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            if bash "$RUNNER_TEMP/check-release-publication-source.sh" "$UPSTREAM_RUN_ID" "$release_ref" "$release_sha"; then
              eligible=true
            fi
          fi
          # The receipt is data. Before a publish, the tag must exist in this
          # repository and point at release_sha; a tag push must also have run
          # on that commit. A release branch is squash-merged later.
          if [[ "$eligible" == "true" ]]; then
            if [[ "$UPSTREAM_EVENT" == "push" ]] \
              && [[ "$UPSTREAM_HEAD_SHA" != "$release_sha" ]]; then
              echo "::error::Upstream tag push does not match the release receipt." >&2
              exit 1
            fi
            tag_object="$(bash "$GH_RETRY_SCRIPT" api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${release_ref}" --jq '.object.type + " " + .object.sha')"
            if [[ "$tag_object" == tag\ * ]]; then
              tag_sha="$(bash "$GH_RETRY_SCRIPT" api "repos/${GITHUB_REPOSITORY}/git/tags/${tag_object#tag }" --jq 'select(.object.type == "commit") | .object.sha')"
            else
              tag_sha="${tag_object#commit }"
            fi
            if [[ "$tag_sha" != "$release_sha" ]]; then
              echo "::error::${release_ref} does not resolve to the receipt's release_sha in ${GITHUB_REPOSITORY}." >&2
              exit 1
            fi
          fi
          {
            echo "eligible=${eligible}"
            echo "release_ref=${release_ref}"
            echo "release_sha=${release_sha}"
          } >> "$GITHUB_OUTPUT"

  pack:
    name: Build and pack
    needs: release-trigger
    if: ${{ needs.release-trigger.outputs.eligible == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read # deliberately NO id-token: untrusted build scripts run here
    outputs:
      package_files: ${{ steps.pack.outputs.package_files }}
      packages: ${{ steps.pack.outputs.packages }}
      source_sha: ${{ steps.pack.outputs.source_sha }}
      cli_release_ref: ${{ steps.release-source.outputs.release_ref }}
    steps:
      - name: Checkout network retry helper
        timeout-minutes: 2
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.repository }}
          ref: ${{ github.workflow_sha }}
          path: .network-retry
          persist-credentials: false
          sparse-checkout: scripts/retry.sh
          sparse-checkout-cone-mode: false

      # The workflow's own helper: the source checks below run before the
      # checked-out release source is validated, so they never run its copy.
      - name: Stage network retry helper
        run: |
          mkdir -p "$RUNNER_TEMP/network-retry"
          cp "$GITHUB_WORKSPACE/.network-retry/scripts/retry.sh" "$RUNNER_TEMP/network-retry/retry.sh"
          echo "NETWORK_RETRY_SCRIPT=$RUNNER_TEMP/network-retry/retry.sh" >> "$GITHUB_ENV"

      - name: Resolve trusted source
        id: source
        env:
          EVENT_NAME: ${{ github.event_name }}
          MANUAL_PACKAGE: ${{ inputs.package || '' }}
          MANUAL_PUBLISH: ${{ inputs.publish || false }}
          MANUAL_RELEASE_REF: ${{ inputs.release_ref || '' }}
          MANUAL_SOURCE_SHA: ${{ inputs.source_sha || '' }}
          RUN_SHA: ${{ github.sha }}
          UPSTREAM_SHA: ${{ needs.release-trigger.outputs.release_sha }}
        run: |
          set -euo pipefail
          source_ref="$RUN_SHA"
          if [[ "$EVENT_NAME" == "workflow_run" ]]; then
            source_ref="$UPSTREAM_SHA"
          elif [[ "$EVENT_NAME" == "workflow_dispatch" && "$MANUAL_PUBLISH" == "true" && ( "$MANUAL_PACKAGE" == "cli" || "$MANUAL_PACKAGE" == "all" ) ]]; then
            if [[ -z "$MANUAL_RELEASE_REF" ]]; then
              echo "::error::release_ref is required to manually publish the CLI." >&2
              exit 1
            fi
            source_ref="$MANUAL_RELEASE_REF"
          elif [[ "$EVENT_NAME" == "workflow_dispatch" && "$MANUAL_PUBLISH" == "true" && -n "$MANUAL_SOURCE_SHA" ]]; then
            if [[ "$MANUAL_PACKAGE" == "all" || "$MANUAL_PACKAGE" == "cli" ]]; then
              echo "::error::source_sha recovery requires one non-CLI package." >&2
              exit 1
            fi
            if [[ ! "$MANUAL_SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
              echo "::error::source_sha must be a full lowercase commit SHA." >&2
              exit 1
            fi
            source_ref="$MANUAL_SOURCE_SHA"
          fi
          echo "ref=${source_ref}" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ steps.source.outputs.ref }}

      # Recovery source can predate the current pack and declaration tools.
      # They resolve their dependencies from the source's locked install.
      - name: Checkout pack tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          path: .pack-tooling
          persist-credentials: false
          sparse-checkout: |
            scripts/pack-reproducibly.sh
            scripts/publish-package-selection.ts
            scripts/publish-packages.ts
            scripts/generate-npm-release-jobs.ts
            scripts/prepare-publish.ts
            scripts/publish-manifest.ts
            scripts/publish-declarations.ts
            scripts/install-packed-cli.sh
            scripts/prepare-packed-cli-consumer.ts
            scripts/retry.sh
          sparse-checkout-cone-mode: false

      - name: Verify manual package recovery source
        timeout-minutes: 5
        if: >-
          github.event_name == 'workflow_dispatch'
          && inputs.publish
          && inputs.source_sha != ''
        env:
          MANUAL_PACKAGE: ${{ inputs.package }}
          MANUAL_SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          set -euo pipefail
          bash "$NETWORK_RETRY_SCRIPT" git fetch --no-tags origin main:refs/remotes/origin/main

          source_sha="$(git rev-parse HEAD)"
          if [[ "$source_sha" != "$MANUAL_SOURCE_SHA" ]]; then
            echo "::error::Checked-out source does not match source_sha." >&2
            exit 1
          fi
          if ! git merge-base --is-ancestor "$source_sha" origin/main; then
            echo "::error::source_sha is not reachable from protected main." >&2
            exit 1
          fi

          manifest="packages/${MANUAL_PACKAGE}/package.json"
          if [[ ! -f "$manifest" ]]; then
            echo "::error::Unknown package '${MANUAL_PACKAGE}'." >&2
            exit 1
          fi
          package_name="$(jq -er '.name | strings' "$manifest")"
          package_version="$(jq -er '.version | strings' "$manifest")"
          tag="${package_name}@${package_version}"
          if ! tag_sha="$(git rev-parse "refs/tags/${tag}^{commit}")"; then
            echo "::error::Recovery requires an existing immutable version tag: ${tag}." >&2
            exit 1
          fi
          if [[ "$tag_sha" != "$source_sha" ]]; then
            echo "::error::${tag} resolves to ${tag_sha}, not source_sha ${source_sha}." >&2
            exit 1
          fi

      # No dependency cache: what this job packs is published, so it installs
      # from the registry against the lockfile instead of restoring a cache
      # that other workflows can write.
      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: "package.json"
          no-cache: true

      # --ignore-scripts: the package builds run tsc/tsdown only and do not
      # depend on install lifecycle scripts; other CI jobs build the same
      # packages from --ignore-scripts installs.
      - run: bash scripts/retry.sh bun ci --ignore-scripts
        timeout-minutes: 5

      - name: Build and pack selected packages
        id: pack
        env:
          EVENT_NAME: ${{ github.event_name }}
          MANUAL_PACKAGE: ${{ inputs.package || 'all' }}
          # A merge-queue push can carry several commits; select from all of
          # them, not only the last one.
          PUSH_BEFORE: ${{ github.event.before || '' }}
        run: |
          set -euo pipefail
          # Historical sources can predate the selector. Use current tooling
          # with source manifests to resolve a named dispatch dependency closure.
          if [[ "$EVENT_NAME" == "workflow_run" ]]; then
            pkgs=(cli)
          elif [[ "$EVENT_NAME" == "workflow_dispatch" && "$MANUAL_PACKAGE" != "all" ]]; then
            selection="$(bun .pack-tooling/scripts/publish-package-selection.ts "$EVENT_NAME" "$MANUAL_PACKAGE" "$GITHUB_WORKSPACE")"
            mapfile -t pkgs <<< "$selection"
          else
            mapfile -t pkgs < <(bun scripts/publish-package-selection.ts "$EVENT_NAME" "$MANUAL_PACKAGE")
          fi
          if [[ "${#pkgs[@]}" -eq 0 ]]; then
            echo "No packages selected for release." >&2
            exit 1
          fi

          for package in "${pkgs[@]}"; do
            echo "::group::Build + pack @stll/${package}"
            PACK_SOURCE_ROOT="$GITHUB_WORKSPACE" bash .pack-tooling/scripts/pack-reproducibly.sh \
              "$package" "$GITHUB_WORKSPACE/release-artifacts/${package}"
            echo "::endgroup::"
          done

          packages="$(printf '%s\n' "${pkgs[@]}" | jq -Rnc '[inputs]')"
          {
            echo "packages=${packages}"
            echo "source_sha=$(git rev-parse HEAD)"
            echo "package_files<<PACKAGE_FILES"
            printf 'packages/%s/package.json\n' "${pkgs[@]}"
            echo "PACKAGE_FILES"
          } >> "$GITHUB_OUTPUT"

      - name: Validate CLI release source
        timeout-minutes: 5
        id: release-source
        if: >-
          contains(fromJSON(steps.pack.outputs.packages), 'cli')
          && (github.event_name == 'workflow_run' || inputs.publish)
        env:
          EVENT_NAME: ${{ github.event_name }}
          MANUAL_RELEASE_REF: ${{ inputs.release_ref || '' }}
          UPSTREAM_RELEASE_REF: ${{ needs.release-trigger.outputs.release_ref }}
        run: |
          set -euo pipefail
          release_ref="$MANUAL_RELEASE_REF"
          if [[ "$EVENT_NAME" == "workflow_run" ]]; then
            release_ref="$UPSTREAM_RELEASE_REF"
          fi
          if [[ ! "$release_ref" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::CLI publication requires a stable vX.Y.Z release; got '${release_ref}'." >&2
            exit 1
          fi

          if RETRY_PASSTHROUGH_EXIT_CODES=2 bash "$NETWORK_RETRY_SCRIPT" git ls-remote --exit-code --heads origin "refs/heads/${release_ref}" >/dev/null 2>&1; then
            echo "::error::A branch named ${release_ref} exists alongside the release tag; refusing ambiguous publication." >&2
            exit 1
          fi
          bash "$NETWORK_RETRY_SCRIPT" git fetch --tags origin "refs/tags/${release_ref}:refs/tags/${release_ref}"

          source_sha="$(git rev-parse HEAD)"
          release_sha="$(git rev-parse "refs/tags/${release_ref}^{commit}")"
          if [[ "$source_sha" != "$release_sha" ]]; then
            echo "::error::Checked-out source ${source_sha} does not match ${release_ref} (${release_sha})." >&2
            exit 1
          fi
          stable_version="${release_ref#v}"
          rc_tags=$(git tag --points-at "$release_sha" --list "v${stable_version}-rc.*" --sort=-v:refname)
          rc_tag="${rc_tags%%$'\n'*}"
          [[ -n "$rc_tag" ]] || { echo 'Final npm source must be the exact RC-proven SHA' >&2; exit 1; }
          [[ "$(git rev-parse "refs/tags/${rc_tag}^{commit}")" == "$source_sha" ]] || exit 1
          if [[ "$(tr -d '[:space:]' < VERSION)" != "$stable_version" ]]; then
            echo "::error::VERSION does not match ${release_ref}." >&2
            exit 1
          fi
          echo "expected_production_commit=${release_sha}" >> "$GITHUB_OUTPUT"
          echo "release_ref=${release_ref}" >> "$GITHUB_OUTPUT"

      - name: Set up Node for the CLI smoke test
        if: contains(fromJSON(steps.pack.outputs.packages), 'cli')
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Smoke-test the packed CLI under plain Node # zizmor: ignore[adhoc-packages] intentionally installs the locally packed artifact as a consumer
        timeout-minutes: 5
        if: contains(fromJSON(steps.pack.outputs.packages), 'cli')
        run: |
          set -euo pipefail
          smoke="$(mktemp -d)"
          bash "$GITHUB_WORKSPACE/.pack-tooling/scripts/install-packed-cli.sh" \
            "$GITHUB_WORKSPACE/release-artifacts" "$smoke" "$GITHUB_WORKSPACE/.pack-tooling/scripts/retry.sh"
          cd "$smoke"
          cli="node_modules/@stll/cli/dist/cli.js"
          node "$cli" --version
          node "$cli" --help

      - name: Wait for the corresponding API release in production
        if: >-
          contains(fromJSON(steps.pack.outputs.packages), 'cli')
          && (github.event_name == 'workflow_run' || inputs.publish)
        env:
          API_DEPLOYMENT_EXPECTED_COMMIT: ${{ steps.release-source.outputs.expected_production_commit }}
          API_DEPLOYMENT_PROBE_PATH: ready
          API_DEPLOYMENT_URL: https://api.stll.app
        run: bun scripts/check-api-deployment.ts

      - name: Canary the exact packed CLI against production # zizmor: ignore[adhoc-packages] the exact local tarball is the canary subject
        timeout-minutes: 5
        if: >-
          contains(fromJSON(steps.pack.outputs.packages), 'cli')
          && (github.event_name == 'workflow_run' || inputs.publish)
        run: |
          set -euo pipefail
          canary="$(mktemp -d)"
          bash "$GITHUB_WORKSPACE/.pack-tooling/scripts/install-packed-cli.sh" \
            "$GITHUB_WORKSPACE/release-artifacts" "$canary" "$GITHUB_WORKSPACE/.pack-tooling/scripts/retry.sh"
          cd "$canary"
          node node_modules/@stll/cli/dist/cli.js compatibility check \
            --server https://api.stll.app

      - name: Upload conditions tarball
        if: contains(fromJSON(steps.pack.outputs.packages), 'conditions')
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: npm-tarball-conditions
          path: release-artifacts/conditions/
          retention-days: 1
          if-no-files-found: error

      - name: Upload auth-model tarball
        if: contains(fromJSON(steps.pack.outputs.packages), 'auth-model')
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: npm-tarball-auth-model
          path: release-artifacts/auth-model/

      - name: Upload ai-catalog tarball
        if: contains(fromJSON(steps.pack.outputs.packages), 'ai-catalog')
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: npm-tarball-ai-catalog
          path: release-artifacts/ai-catalog/
          retention-days: 1
          if-no-files-found: error

      - name: Upload anonymize-chat tarball
        if: contains(fromJSON(steps.pack.outputs.packages), 'anonymize-chat')
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: npm-tarball-anonymize-chat
          path: release-artifacts/anonymize-chat/
          retention-days: 1
          if-no-files-found: error

      - name: Upload business-registries tarball
        if: contains(fromJSON(steps.pack.outputs.packages), 'business-registries')
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: npm-tarball-business-registries
          path: release-artifacts/business-registries/
          retention-days: 1
          if-no-files-found: error

      - name: Upload country-codes tarball
        if: contains(fromJSON(steps.pack.outputs.packages), 'country-codes')
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: npm-tarball-country-codes
          path: release-artifacts/country-codes/
          retention-days: 1
          if-no-files-found: error

      - name: Upload stable-stringify tarball
        if: contains(fromJSON(steps.pack.outputs.packages), 'stable-stringify')
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: npm-tarball-stable-stringify
          path: release-artifacts/stable-stringify/
          retention-days: 1
          if-no-files-found: error

      - name: Upload time tarball
        if: contains(fromJSON(steps.pack.outputs.packages), 'time')
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: npm-tarball-time
          path: release-artifacts/time/
          retention-days: 1
          if-no-files-found: error

      - name: Upload text-normalize tarball
        if: contains(fromJSON(steps.pack.outputs.packages), 'text-normalize')
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: npm-tarball-text-normalize
          path: release-artifacts/text-normalize/
          retention-days: 1
          if-no-files-found: error

      - name: Upload agent-input tarball
        if: contains(fromJSON(steps.pack.outputs.packages), 'agent-input')
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: npm-tarball-agent-input
          path: release-artifacts/agent-input/
          retention-days: 1
          if-no-files-found: error

      - name: Upload mcp-kit tarball
        if: contains(fromJSON(steps.pack.outputs.packages), 'mcp-kit')
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: npm-tarball-mcp-kit
          path: release-artifacts/mcp-kit/
          retention-days: 1
          if-no-files-found: error

      - name: Upload fetch tarball
        if: contains(fromJSON(steps.pack.outputs.packages), 'fetch')
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
