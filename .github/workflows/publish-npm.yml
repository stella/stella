    uses: stella/.github/.github/workflows/npm-independent-release.yml@042baebaf071329b956555c05caf5736504c278d # release job environment input
    with:
      environment: release-app
      artifact-pattern: npm-tarball-fetch
      artifact-run-id: ${{ inputs.artifact_run_id || '' }}
      package-files: packages/fetch/package.json
      source-ref: ${{ needs.pack.outputs.source_sha }}
    secrets:
      RELEASE_APP_ID: ${{ secrets.STELLA_RELEASE_APP_ID }}
      RELEASE_APP_PRIVATE_KEY: ${{ secrets.STELLA_RELEASE_APP_PRIVATE_KEY }}

  release-scan-engine:
    name: Publish @stll/scan-engine
    needs:
      - release-trigger
      - pack
      - release-fetch
    if: >-
      always() && !cancelled()
      && needs.pack.result == 'success'
      && (github.event_name != 'workflow_run'
      || (github.event.workflow_run.head_repository.full_name == github.repository
      && github.event.workflow_run.path == '.github/workflows/release.yml'
      && contains(fromJSON('["push", "workflow_dispatch"]'), github.event.workflow_run.event)))
      && (github.event_name == 'workflow_run'
      || (github.ref == 'refs/heads/main'
      && (github.event_name == 'push' || inputs.publish)))
      && contains(fromJSON(needs.pack.outputs.packages), 'scan-engine')
      && (!contains(fromJSON(needs.pack.outputs.packages), 'fetch') || needs.release-fetch.result == 'success')
    permissions:
      actions: read
      contents: write
      id-token: write
    uses: stella/.github/.github/workflows/npm-independent-release.yml@042baebaf071329b956555c05caf5736504c278d # release job environment input
    with:
      environment: release-app
      artifact-pattern: npm-tarball-scan-engine
      artifact-run-id: ${{ inputs.artifact_run_id || '' }}
      package-files: packages/scan-engine/package.json
      source-ref: ${{ needs.pack.outputs.source_sha }}
    secrets:
      RELEASE_APP_ID: ${{ secrets.STELLA_RELEASE_APP_ID }}
      RELEASE_APP_PRIVATE_KEY: ${{ secrets.STELLA_RELEASE_APP_PRIVATE_KEY }}

  release-cli:
    name: Publish @stll/cli
    needs:
      - release-trigger
      - pack
      - release-stable-stringify
      - release-agent-input
    if: >-
      always() && !cancelled()
      && needs.pack.result == 'success'
      && (github.event_name != 'workflow_run'
      || (github.event.workflow_run.head_repository.full_name == github.repository
      && github.event.workflow_run.path == '.github/workflows/release.yml'
      && contains(fromJSON('["push", "workflow_dispatch"]'), github.event.workflow_run.event)))
      && (github.event_name == 'workflow_run'
      || (github.ref == 'refs/heads/main'
      && (github.event_name == 'push' || inputs.publish)))
      && contains(fromJSON(needs.pack.outputs.packages), 'cli')
      && (!contains(fromJSON(needs.pack.outputs.packages), 'stable-stringify') || needs.release-stable-stringify.result == 'success')
      && (!contains(fromJSON(needs.pack.outputs.packages), 'agent-input') || needs.release-agent-input.result == 'success')
    permissions:
      actions: read
      contents: write
      id-token: write
    uses: stella/.github/.github/workflows/npm-independent-release.yml@042baebaf071329b956555c05caf5736504c278d # release job environment input
    with:
      environment: release-app
      artifact-pattern: npm-tarball-cli
      artifact-run-id: ${{ inputs.artifact_run_id || '' }}
      package-files: packages/cli/package.json
      source-ref: ${{ needs.pack.outputs.source_sha }}
    secrets:
      RELEASE_APP_ID: ${{ secrets.STELLA_RELEASE_APP_ID }}
      RELEASE_APP_PRIVATE_KEY: ${{ secrets.STELLA_RELEASE_APP_PRIVATE_KEY }}

  # npm-release-jobs:end

  release-summary:
    name: Report every npm package result
    # npm-release-summary-needs
    needs:
      - release-trigger
      - pack
      - release-auth-model
      - release-ai-catalog
      - release-text-normalize
      - release-anonymize-chat
      - release-ui
      - release-chat
      - release-country-codes
      - release-business-registries
      - release-conditions
      - release-template-conditions
      - release-docx-utils
      - release-start-runtime
      - release-ssr-kit
      - release-ssr-testkit
      - release-money
      - release-calculations
      - release-workspace-model
      - release-workspace-ui
      - release-stable-stringify
      - release-agent-input
      - release-mcp-kit
      - release-fetch
      - release-scan-engine
      - release-cli
    if: >-
      always()
      && needs.release-trigger.outputs.eligible == 'true'
      && (github.event_name != 'workflow_run'
      || (github.event.workflow_run.head_repository.full_name == github.repository
      && github.event.workflow_run.path == '.github/workflows/release.yml'
      && contains(fromJSON('["push", "workflow_dispatch"]'), github.event.workflow_run.event)))
      && (github.event_name == 'workflow_run'
      || (github.ref == 'refs/heads/main'
      && (github.event_name == 'push' || inputs.publish)))
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: "package.json"
          no-cache: true

      - name: Report published, failed and skipped packages
        env:
          NPM_RELEASE_NEEDS: ${{ toJSON(needs) }}
        run: bun scripts/npm-release-summary.ts

  verify-npm:
    name: Verify npm serves the released versions
    # A release run that fails, or publishes nothing, must not stay a quiet
    # red X: this job fails with a per-package table of what npm lacks.
    needs: [release-trigger, pack, release-summary]
    if: >-
      always()
      && needs.release-trigger.outputs.eligible == 'true'
      && (github.event_name == 'workflow_run'
      || (github.ref == 'refs/heads/main'
      && (github.event_name == 'push' || inputs.publish)))
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      # The guard comes from this workflow's own commit; only the manifests
      # are read at the released source, so a recovery of an old commit still
      # runs the current check.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: "package.json"
          no-cache: true

      # No install: the guard uses only Bun, Node built-ins, git and npm.
      - name: Compare npm latest with the released versions
        env:
          PACKAGES: ${{ needs.pack.outputs.packages || '' }}
          # Registry reads lag a fresh publish; wait only when one happened.
          ATTEMPTS: ${{ needs.release-summary.result == 'success' && '10' || '1' }}
          SOURCE_SHA: ${{ needs.pack.outputs.source_sha || needs.release-trigger.outputs.release_sha || github.sha }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          packages=""
          if [[ -n "$PACKAGES" ]]; then
            packages="$(jq -r 'join(",")' <<< "$PACKAGES")"
          elif [[ "$EVENT_NAME" == "workflow_run" ]]; then
            packages="cli"
          fi
          bun scripts/check-npm-publish-lag.ts \
            --ref "$SOURCE_SHA" \
            --packages "$packages" \
            --attempts "$ATTEMPTS" \
            --interval-seconds 30
