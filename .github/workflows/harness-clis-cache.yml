name: Warm harness CLI cache

defaults:
  run:
    shell: bash

# Saves the pinned agent CLIs on main, where every pull request and merge
# group can restore them (.github/actions/harness-clis).
on:
  push:
    branches: [main]
    paths:
      - apps/desktop/src-tauri/harness/pins.json
      - scripts/ci-harness-clis.ts
      - .github/actions/harness-clis/**
      - .github/workflows/harness-clis-cache.yml
  schedule:
    - cron: "41 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  warm:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: "package.json"

      - name: Install dependencies
        timeout-minutes: 10
        run: bash scripts/retry.sh bun ci --ignore-scripts

      - name: Install pinned harness CLIs
        timeout-minutes: 5
        uses: ./.github/actions/harness-clis
        with:
          save: "true"
