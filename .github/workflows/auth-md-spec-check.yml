name: auth.md Spec Drift Check

defaults:
  run:
    shell: bash

# We implement the auth.md agent-registration protocol against a pinned
# version. It is a fast-moving pre-1.0 open protocol, so this nightly job
# diffs our pin against upstream (workos/auth.md) and fails when the spec
# moves — turning a silent upstream change into a reviewable signal so we
# can reconcile our manifest/discovery/flow handlers before drifting out
# of conformance.

on:
  schedule:
    # 04:47 UTC daily (off-minute; staggered after the model-catalog job)
    - cron: "47 4 * * *"
  workflow_dispatch:

permissions: {}

jobs:
  auth-md-spec-check:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: stella/.github/actions/setup-bun-cached@a6a6cd30646c18321ef71e344bf0af6b8d3634b8
        with:
          save: ${{ github.ref == 'refs/heads/main' }}
          bun-version-file: "package.json"

      - name: Install dependencies
        timeout-minutes: 5
        run: bash scripts/retry.sh bun ci --ignore-scripts
        env:
          # .npmrc references NPM_TOKEN, but installs must not expose
          # the real npm token to dependency lifecycle scripts.
          NPM_TOKEN: ""

      - name: Check auth.md spec for upstream drift
        run: bun run check:auth-md-spec
        env:
          GITHUB_TOKEN: ${{ github.token }}
