name: Tag verified release

# release-chain-alert

on:
  workflow_dispatch:
    inputs:
      sha:
        description: "Commit SHA (blank selects the newest staging/verified success on main)"
        required: false
        type: string
      waive_dependency_audit:
        description: "Tag despite current high/critical dependency advisories"
        required: false
        type: boolean
        default: false
      dependency_audit_waiver_reason:
        description: "Required reviewable reason when waiving the dependency audit"
        required: false
        type: string

permissions:
  contents: read
  statuses: read
  actions: read
  issues: read

concurrency:
  group: release-tag
  cancel-in-progress: false

jobs:
  tag:
    name: Push release tag
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: release-app
    timeout-minutes: 15
    outputs:
      sha: ${{ steps.candidate.outputs.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Select and validate the release commit
        id: candidate
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_SHA: ${{ inputs.sha }}
        run: bash scripts/prepare-release-tag.sh --repo "$GITHUB_REPOSITORY" --sha "$REQUESTED_SHA" >> "$GITHUB_OUTPUT"

      - name: Preserve the trusted release guard
        run: |
          cp scripts/check-release-main-health.sh "$RUNNER_TEMP/check-release-main-health.sh"
          cp scripts/gh-retry.sh "$RUNNER_TEMP/gh-retry.sh"

      - name: Checkout the verified commit
        env:
          RELEASE_SHA: ${{ steps.candidate.outputs.sha }}
        run: git checkout --detach "$RELEASE_SHA"

      - name: Setup Bun
        uses: stella/.github/actions/setup-bun-cached@167fb396c6c0f4e07296ad2cd72e6ef15367c776
        with:
          save: ${{ github.ref == 'refs/heads/main' }}
          bun-version-file: "package.json"

      - name: Install dependencies for the release audit
        run: bash scripts/retry.sh bun ci --ignore-scripts
        env:
          NPM_TOKEN: ""

      - name: Refuse a release with known dependency advisories
        env:
          WAIVE_DEPENDENCY_AUDIT: ${{ inputs.waive_dependency_audit }}
          WAIVER_REASON: ${{ inputs.dependency_audit_waiver_reason }}
        run: bash scripts/check-release-dependency-audit.sh

      - name: Require release changelog file
        env:
          VERSION: ${{ steps.candidate.outputs.value }}
        run: bash scripts/check-release-changelog.sh --version "$VERSION"

      # A release whose npm publish failed or never ran leaves users on an
      # older CLI and libraries while everything else moves on. The previous
      # stable tag's packages must be on npm before the next tag is cut; fix
      # the publish (publish-npm.yml) first. Runs without an install.
      - name: Refuse a tag while the previous release is missing from npm
        run: bun scripts/check-npm-publish-lag.ts --previous-release-of HEAD

      # The API deploys from this tag; the CLI publishes from the same commit
      # only after production serves it. A stable tag is refused while a
      # pending changeset still names the CLI (its coupled version does not
      # exist yet) or while the commit's CLI is behind, or drifted from, the
      # version users install. Runs without an install: the script uses only
      # Bun and Node built-ins plus npm on the runner.
      - name: Refuse a stable tag whose CLI release is not settled
        env:
          VERSION: ${{ steps.candidate.outputs.value }}
        run: bun scripts/check-cli-release-coupling.ts --version "$VERSION"

      - name: Mint App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.STELLA_RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.STELLA_RELEASE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write

      # Re-checks staging/verified, main/heavy and main/pr-depth on the exact commit right
      # before the push, so a status that turned red since selection stops it.
      - name: Push tag
        env:
          RELEASE_HEALTH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.candidate.outputs.tag }}
          RELEASE_SHA: ${{ steps.candidate.outputs.sha }}
          # Injected only for this step: the App token never touches disk via
          # persisted git credentials, so earlier steps (setup-bun, repo
          # scripts) run without it available.
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          GH_TOKEN="$RELEASE_HEALTH_TOKEN" bash "$RUNNER_TEMP/check-release-main-health.sh" "$GITHUB_REPOSITORY" "$RELEASE_SHA"
          git config user.name "stella-release-deployer[bot]"
          git config user.email "stella-release-deployer[bot]@users.noreply.github.com"
          git tag -a "$TAG" "$RELEASE_SHA" -m "$TAG"
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "$TAG"

  # Marketing freshness is content debt, not a release defect: staleness
  # surfaces as a warning and never blocks the tag. The check loads installed
  # packages, so it runs in its own read-only job, away from the tag token.
  # Clear it with `bun run marketing:reshoot` (re-records only stale captures).
  marketing-freshness:
    name: Warn on changed marketing recording provenance
    needs: tag
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout the tagged commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.tag.outputs.sha }}
          persist-credentials: false

      - name: Setup Bun
        uses: stella/.github/actions/setup-bun-cached@167fb396c6c0f4e07296ad2cd72e6ef15367c776
        with:
          save: ${{ github.ref == 'refs/heads/main' }}
          bun-version-file: "package.json"

      - name: Install dependencies
        run: bash scripts/retry.sh bun ci --ignore-scripts
        env:
          NPM_TOKEN: ""

      - name: Warn on changed marketing recording provenance
        run: |
          if ! bun run marketing:provenance --strict; then
            echo "::warning::Changed marketing recording provenance (see step log). Re-record with \`bun run marketing:reshoot\`."
          fi
