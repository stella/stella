name: Tag verified release

# release-chain-alert
defaults:
  run:
    shell: bash

on:
  workflow_run:
    workflows: [Deploy main to staging, Main heavy suites, Main PR-depth checks]
    types: [completed]
  workflow_dispatch:
    inputs:
      mode:
        description: "Create an RC tag for an open release pull request head"
        required: true
        type: choice
        options: [rc]
        default: rc
      sha:
        description: "Exact head SHA of the open release pull request"
        required: false
        type: string
      waive_dependency_audit:
        description: "Tag despite current high/critical dependency advisories"
        required: false
        type: boolean
        default: false
      dependency_audit_waiver_reason:
        description: "Required reviewable reason when waiving the dependency audit"
        required: false
        type: string
      dry_run:
        description: "Evaluate every release gate and report them all without pushing the tag"
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  statuses: read
  checks: read
  actions: read
  issues: read
  pull-requests: read

# Concurrency is per tag-writing job: GitHub keeps only the newest pending run
# of a group, so a workflow-level group would let any completed main run
# supersede a pending candidate tag or finalization.
jobs:
  tag:
    name: Push release candidate tag
    if: github.event_name == 'workflow_dispatch' && inputs.mode == 'rc' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    environment: release-app
    timeout-minutes: 15
    concurrency:
      group: release-candidate-tag
      cancel-in-progress: false
    outputs:
      sha: ${{ steps.candidate.outputs.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # Source gates use Bun; post-build workflow proofs run only in finalize.
      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: "package.json"
          no-cache: true

      - name: Select the release commit
        timeout-minutes: 5
        id: candidate
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_SHA: ${{ inputs.sha }}
        run: bash scripts/prepare-release-tag.sh --repo "$GITHUB_REPOSITORY" --sha "$REQUESTED_SHA" >> "$GITHUB_OUTPUT"

      - name: Preserve the trusted release guard
        timeout-minutes: 5
        run: |
          cp scripts/verify-release-tree-proof.sh "$RUNNER_TEMP/verify-release-tree-proof.sh"
          cp scripts/retry.sh "$RUNNER_TEMP/retry.sh"
          cp scripts/verify-release-candidate-tree.mjs "$RUNNER_TEMP/verify-release-candidate-tree.mjs"
          cp scripts/gh-retry.sh "$RUNNER_TEMP/gh-retry.sh"
          cp scripts/release-gate.sh "$RUNNER_TEMP/release-gate.sh"
          cp scripts/release-rc-number.sh "$RUNNER_TEMP/release-rc-number.sh"
          cp scripts/check-release-rc-source.sh "$RUNNER_TEMP/check-release-rc-source.sh"
          cp scripts/check-release-open-incidents.sh "$RUNNER_TEMP/check-release-open-incidents.sh"

      # Every gate below runs even when an earlier one fails; each records
      # its outcome and the verdict step lists all failures in one run.
      - name: Require RC source identity and incident gates
        timeout-minutes: 5
        id: evidence
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ steps.candidate.outputs.sha }}
        run: bash "$RUNNER_TEMP/release-gate.sh" run release-evidence bash "$RUNNER_TEMP/check-release-rc-source.sh" "$GITHUB_REPOSITORY" "$RELEASE_SHA" >> "$GITHUB_OUTPUT"

      - name: Checkout the verified commit
        env:
          RELEASE_SHA: ${{ steps.candidate.outputs.sha }}
        run: git checkout --detach "$RELEASE_SHA"

      # Only the dependency audit needs the install; a failed install leaves
      # that gate unrun (the verdict reports it) while the others still run.
      - name: Install dependencies for the release audit
        id: install
        continue-on-error: true
        timeout-minutes: 5
        run: bash scripts/retry.sh bun ci --ignore-scripts
        env:
          NPM_TOKEN: ""

      - name: Refuse a release with known dependency advisories
        if: steps.install.outcome == 'success'
        continue-on-error: true
        env:
          WAIVE_DEPENDENCY_AUDIT: ${{ inputs.waive_dependency_audit }}
          WAIVER_REASON: ${{ inputs.dependency_audit_waiver_reason }}
        run: bash "$RUNNER_TEMP/release-gate.sh" run dependency-audit bash scripts/check-release-dependency-audit.sh

      - name: Require release changelog file
        continue-on-error: true
        env:
          VERSION: ${{ steps.candidate.outputs.value }}
        run: bash "$RUNNER_TEMP/release-gate.sh" run changelog bash scripts/check-release-changelog.sh --version "$VERSION"

      # A release whose npm publish failed or never ran leaves users on an
      # older CLI and libraries while everything else moves on. The previous
      # stable tag's packages must be on npm before the next tag is cut; fix
      # the publish (publish-npm.yml) first. Runs without an install.
      - name: Refuse a tag while the previous release is missing from npm
        continue-on-error: true
        run: bash "$RUNNER_TEMP/release-gate.sh" run npm-publish-lag bun scripts/check-npm-publish-lag.ts --previous-release-of HEAD

      - name: Check every package's public npm publishing evidence
        continue-on-error: true
        timeout-minutes: 10
        run: bash "$RUNNER_TEMP/release-gate.sh" run npm-publish-readiness bun scripts/check-npm-publish-readiness.ts

      # The API deploys from this tag; the CLI publishes from the same commit
      # only after production serves it. A stable tag is refused while a
      # pending changeset still names the CLI (its coupled version does not
      # exist yet) or while the commit's CLI is behind, or drifted from, the
      # version users install. Runs without an install: the script uses only
      # Bun and Node built-ins plus npm on the runner.
      - name: Refuse a stable tag whose CLI release is not settled
        continue-on-error: true
        env:
          VERSION: ${{ steps.candidate.outputs.value }}
        run: bash "$RUNNER_TEMP/release-gate.sh" run cli-coupling bun scripts/check-cli-release-coupling.ts --version "$VERSION"

      # The single verdict: lists every gate that failed or never ran. A dry
      # run stops after it, so all gates are evaluated without a tag.
      - name: Report every release gate
        run: bash "$RUNNER_TEMP/release-gate.sh" verdict release-evidence dependency-audit changelog npm-publish-lag npm-publish-readiness cli-coupling

      - name: Mint App token
        if: ${{ !inputs.dry_run }}
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.STELLA_RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.STELLA_RELEASE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write

      - name: Push candidate tag once
        if: ${{ !inputs.dry_run }}
        env:
          RELEASE_SHA: ${{ steps.candidate.outputs.sha }}
          VERSION: ${{ steps.candidate.outputs.value }}
          RELEASE_HEALTH_TOKEN: ${{ github.token }}
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -euo pipefail
          GH_TOKEN="$RELEASE_HEALTH_TOKEN" bash "$RUNNER_TEMP/check-release-rc-source.sh" "$GITHUB_REPOSITORY" "$RELEASE_SHA" >/dev/null
          receipt=$(bash "$RUNNER_TEMP/release-rc-number.sh" "$VERSION" "$RELEASE_SHA")
          if grep -qx 'existing=true' <<< "$receipt"; then exit 0; fi
          tag=$(sed -n 's/^tag=//p' <<< "$receipt")
          git config user.name "stella-release-deployer[bot]"
          git config user.email "stella-release-deployer[bot]@users.noreply.github.com"
          git tag -a "$tag" "$RELEASE_SHA" -m "$tag"
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "$tag"

  # Runs without the release environment. The source facts stay in the job
  # condition; the script names every refusal, including those facts.
  finalize-eligibility:
    name: Decide whether the proof run finalizes a release candidate
    if: >-
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      github.event.workflow_run.event == 'workflow_dispatch' &&
      (github.event.workflow_run.path == '.github/workflows/deploy-staging.yml' ||
       github.event.workflow_run.path == '.github/workflows/main-heavy.yml' ||
       github.event.workflow_run.path == '.github/workflows/main-pr-depth.yml')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      sha: ${{ steps.eligibility.outputs.sha }}
    steps:
      - name: Checkout trusted finalization tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Decide eligibility
        id: eligibility
        run: bash scripts/release-finalize-eligibility.sh "$GITHUB_EVENT_PATH" "$GITHUB_REPOSITORY" >> "$GITHUB_OUTPUT"

  finalize:
    name: Finalize the proven release candidate
    needs: finalize-eligibility
    if: github.event_name == 'workflow_run' && needs.finalize-eligibility.outputs.sha != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: release-app
    concurrency:
      group: release-finalize
      cancel-in-progress: false
    steps:
      - name: Checkout trusted finalization tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Mint App token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.STELLA_RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.STELLA_RELEASE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write

      - name: Move the final tag to the proven RC commit
        timeout-minutes: 5
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          RELEASE_SHA: ${{ needs.finalize-eligibility.outputs.sha }}
          RELEASE_HEALTH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "stella-release-deployer[bot]"
          git config user.email "stella-release-deployer[bot]@users.noreply.github.com"
          bash scripts/finalize-release.sh "$GITHUB_REPOSITORY" "$RELEASE_SHA"

  # Marketing freshness is content debt, not a release defect: staleness
  # surfaces as a warning and never blocks the tag. The check loads installed
  # packages, so it runs in its own read-only job, away from the tag token.
  # Clear it with `bun run marketing:reshoot` (re-records only stale captures).
  marketing-freshness:
    name: Warn on changed marketing recording provenance
    needs: tag
    if: ${{ !inputs.dry_run }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout the tagged commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.tag.outputs.sha }}
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: "package.json"
          no-cache: true

      - name: Install dependencies
        timeout-minutes: 5
        run: bash scripts/retry.sh bun ci --ignore-scripts
        env:
          NPM_TOKEN: ""

      - name: Warn on changed marketing recording provenance
        run: |
          if ! bun run marketing:provenance --strict; then
            echo "::warning::Changed marketing recording provenance (see step log). Re-record with \`bun run marketing:reshoot\`."
          fi
