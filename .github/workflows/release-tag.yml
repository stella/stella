name: Tag verified release

# release-chain-alert
defaults:
  run:
    shell: bash

on:
  workflow_dispatch:
    inputs:
      sha:
        description: "Version commit SHA (blank selects the commit that set VERSION on main)"
        required: false
        type: string
      proof_sha:
        description: "Optional commit carrying tree-identical release evidence"
        required: false
        type: string
      waive_dependency_audit:
        description: "Tag despite current high/critical dependency advisories"
        required: false
        type: boolean
        default: false
      dependency_audit_waiver_reason:
        description: "Required reviewable reason when waiving the dependency audit"
        required: false
        type: string
      dry_run:
        description: "Evaluate every release gate and report them all without pushing the tag"
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  statuses: read
  checks: read
  actions: read
  issues: read
  pull-requests: read

concurrency:
  group: release-tag
  cancel-in-progress: false

jobs:
  tag:
    name: Push release tag
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    environment: release-app
    timeout-minutes: 15
    outputs:
      sha: ${{ steps.candidate.outputs.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # Bun runs the release queue history check that decides whether a
      # merge-group receipt may stand in for the heavy statuses.
      - name: Setup Bun
        uses: stella/.github/actions/setup-bun-cached@a6a6cd30646c18321ef71e344bf0af6b8d3634b8
        with:
          save: ${{ github.ref == 'refs/heads/main' }}
          bun-version-file: "package.json"

      - name: Select the release commit
        id: candidate
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_SHA: ${{ inputs.sha }}
        run: bash scripts/prepare-release-tag.sh --repo "$GITHUB_REPOSITORY" --sha "$REQUESTED_SHA" --candidate-only >> "$GITHUB_OUTPUT"

      - name: Preserve the trusted release guard
        run: |
          cp scripts/check-release-main-health.sh "$RUNNER_TEMP/check-release-main-health.sh"
          cp scripts/verify-release-tree-proof.sh "$RUNNER_TEMP/verify-release-tree-proof.sh"
          cp scripts/check-release-receipt-coverage.sh "$RUNNER_TEMP/check-release-receipt-coverage.sh"
          cp scripts/check-release-queue-history.ts "$RUNNER_TEMP/check-release-queue-history.ts"
          cp scripts/gh-retry.sh "$RUNNER_TEMP/gh-retry.sh"
          cp scripts/release-gate.sh "$RUNNER_TEMP/release-gate.sh"

      # Every gate below runs even when an earlier one fails; each records
      # its outcome and the verdict step lists all failures in one run.
      - name: Require release evidence
        id: evidence
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ steps.candidate.outputs.sha }}
          PROOF_SHA: ${{ inputs.proof_sha }}
        run: bash "$RUNNER_TEMP/release-gate.sh" run release-evidence bash scripts/prepare-release-tag.sh --repo "$GITHUB_REPOSITORY" --sha "$RELEASE_SHA" --proof-sha "$PROOF_SHA" >> "$GITHUB_OUTPUT"

      - name: Checkout the verified commit
        env:
          RELEASE_SHA: ${{ steps.candidate.outputs.sha }}
        run: git checkout --detach "$RELEASE_SHA"

      # Only the dependency audit needs the install; a failed install leaves
      # that gate unrun (the verdict reports it) while the others still run.
      - name: Install dependencies for the release audit
        id: install
        continue-on-error: true
        timeout-minutes: 5
        run: bash scripts/retry.sh bun ci --ignore-scripts
        env:
          NPM_TOKEN: ""

      - name: Refuse a release with known dependency advisories
        if: steps.install.outcome == 'success'
        continue-on-error: true
        env:
          WAIVE_DEPENDENCY_AUDIT: ${{ inputs.waive_dependency_audit }}
          WAIVER_REASON: ${{ inputs.dependency_audit_waiver_reason }}
        run: bash "$RUNNER_TEMP/release-gate.sh" run dependency-audit bash scripts/check-release-dependency-audit.sh

      - name: Require release changelog file
        continue-on-error: true
        env:
          VERSION: ${{ steps.candidate.outputs.value }}
        run: bash "$RUNNER_TEMP/release-gate.sh" run changelog bash scripts/check-release-changelog.sh --version "$VERSION"

      # A release whose npm publish failed or never ran leaves users on an
      # older CLI and libraries while everything else moves on. The previous
      # stable tag's packages must be on npm before the next tag is cut; fix
      # the publish (publish-npm.yml) first. Runs without an install.
      - name: Refuse a tag while the previous release is missing from npm
        continue-on-error: true
        run: bash "$RUNNER_TEMP/release-gate.sh" run npm-publish-lag bun scripts/check-npm-publish-lag.ts --previous-release-of HEAD

      # The API deploys from this tag; the CLI publishes from the same commit
      # only after production serves it. A stable tag is refused while a
      # pending changeset still names the CLI (its coupled version does not
      # exist yet) or while the commit's CLI is behind, or drifted from, the
      # version users install. Runs without an install: the script uses only
      # Bun and Node built-ins plus npm on the runner.
      - name: Refuse a stable tag whose CLI release is not settled
        continue-on-error: true
        env:
          VERSION: ${{ steps.candidate.outputs.value }}
        run: bash "$RUNNER_TEMP/release-gate.sh" run cli-coupling bun scripts/check-cli-release-coupling.ts --version "$VERSION"

      # The single verdict: lists every gate that failed or never ran. A dry
      # run stops after it, so all gates are evaluated without a tag.
      - name: Report every release gate
        run: bash "$RUNNER_TEMP/release-gate.sh" verdict release-evidence dependency-audit changelog npm-publish-lag cli-coupling

      - name: Mint App token
        if: ${{ !inputs.dry_run }}
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.STELLA_RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.STELLA_RELEASE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write

      # Re-checks staging/verified plus the merge-group receipt with validated
      # queue history (or main/heavy and main/pr-depth) on the exact commit
      # right before the push, so evidence that turned red since selection
      # stops it.
      - name: Push tag
        if: ${{ !inputs.dry_run }}
        env:
          RELEASE_TREE_PROOF_VERIFIER: ${{ runner.temp }}/verify-release-tree-proof.sh
          PROOF_SHA: ${{ steps.evidence.outputs.proof-sha }}
          RELEASE_HEALTH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.candidate.outputs.tag }}
          RELEASE_SHA: ${{ steps.candidate.outputs.sha }}
          # Injected only for this step: the App token never touches disk via
          # persisted git credentials, so earlier steps (setup-bun, repo
          # scripts) run without it available.
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          GH_TOKEN="$RELEASE_HEALTH_TOKEN" bash "$RUNNER_TEMP/check-release-main-health.sh" "$GITHUB_REPOSITORY" "$RELEASE_SHA" "$PROOF_SHA"
          git config user.name "stella-release-deployer[bot]"
          git config user.email "stella-release-deployer[bot]@users.noreply.github.com"
          git tag -a "$TAG" "$RELEASE_SHA" -m "$TAG"
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "$TAG"

  # Marketing freshness is content debt, not a release defect: staleness
  # surfaces as a warning and never blocks the tag. The check loads installed
  # packages, so it runs in its own read-only job, away from the tag token.
  # Clear it with `bun run marketing:reshoot` (re-records only stale captures).
  marketing-freshness:
    name: Warn on changed marketing recording provenance
    needs: tag
    if: ${{ !inputs.dry_run }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout the tagged commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.tag.outputs.sha }}
          persist-credentials: false

      - name: Setup Bun
        uses: stella/.github/actions/setup-bun-cached@a6a6cd30646c18321ef71e344bf0af6b8d3634b8
        with:
          save: ${{ github.ref == 'refs/heads/main' }}
          bun-version-file: "package.json"

      - name: Install dependencies
        timeout-minutes: 5
        run: bash scripts/retry.sh bun ci --ignore-scripts
        env:
          NPM_TOKEN: ""

      - name: Warn on changed marketing recording provenance
        run: |
          if ! bun run marketing:provenance --strict; then
            echo "::warning::Changed marketing recording provenance (see step log). Re-record with \`bun run marketing:reshoot\`."
          fi
