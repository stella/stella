name: Main PR-depth checks
run-name: "Main PR-depth checks ${{ inputs.sha || github.sha }}"

on:
  schedule:
    - cron: "47 * * * *"
  workflow_dispatch:
    inputs:
      sha:
        description: Full lowercase commit SHA on main or a same-repository release PR head
        required: true
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'workflow_dispatch' && inputs.sha || github.ref }}
  # A running check is never cancelled: a later request waits and then skips a
  # commit that is already green.
  cancel-in-progress: false

permissions: {}

defaults:
  run:
    shell: bash

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      statuses: read
      checks: read
      pull-requests: read
      issues: read
      actions: read
    outputs:
      sha: ${{ steps.ancestor.outputs.sha }}
      proof: ${{ steps.reuse.outputs.proof }}
      main-base: ${{ steps.ancestor.outputs.main-base }}
      run: ${{ steps.reuse.outputs.run || steps.selection.outputs.run }}
    steps:
      - name: Checkout network retry helper
        timeout-minutes: 2
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.repository }}
          ref: ${{ github.workflow_sha }}
          path: .network-retry
          persist-credentials: false
          sparse-checkout: scripts/retry.sh
          sparse-checkout-cone-mode: false

      # The workflow's own helper: this job fetches before, or without, a
      # checkout of this revision into the workspace.
      - name: Stage network retry helper
        run: |
          mkdir -p "$RUNNER_TEMP/network-retry"
          cp "$GITHUB_WORKSPACE/.network-retry/scripts/retry.sh" "$RUNNER_TEMP/network-retry/retry.sh"
          echo "NETWORK_RETRY_SCRIPT=$RUNNER_TEMP/network-retry/retry.sh" >> "$GITHUB_ENV"

      - name: Checkout trusted release proof tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          path: .release-proof
          fetch-depth: 0
          persist-credentials: false
          sparse-checkout: scripts

      # Bun runs the release queue history check the health gate needs before
      # a merge-group receipt may stand in for the heavy statuses.
      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: .release-proof/package.json
          no-cache: true

      - name: Reuse completed release proof
        timeout-minutes: 5
        id: reuse
        working-directory: .release-proof
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ inputs.sha || github.sha }}
        run: |
          set -euo pipefail
          if proof=$(bash scripts/verify-release-tree-proof.sh --find-proof "$GITHUB_REPOSITORY" "$SHA") && [[ -n "$proof" ]]; then
            if bash scripts/check-release-main-health.sh "$GITHUB_REPOSITORY" "$SHA" "$proof"; then
              echo "proof=$proof" >> "$GITHUB_OUTPUT"
              echo "run=false" >> "$GITHUB_OUTPUT"
            else
              echo "run=true" >> "$GITHUB_OUTPUT"
            fi
          fi

      - name: Select untested PR-depth SHA
        if: steps.reuse.outputs.run != 'false'
        id: selection
        env:
          REUSE_RUN: ${{ steps.reuse.outputs.run }}
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          retries: 0
          script: |
            if (process.env.REUSE_RUN === "true") {
              core.setOutput("run", "true");
              return;
            }
            if (context.eventName !== "schedule") {
              core.setOutput("run", "true");
              return;
            }
            const { data } = await github.rest.repos.listCommitStatusesForRef({
              ...context.repo, ref: context.sha, per_page: 100,
            });
            const latest = data.find(status => status.context === "main/pr-depth");
            const tested = latest?.creator?.login === "github-actions[bot]"
              && latest.state === "success";
            core.setOutput("run", String(!tested));
            await core.summary.addRaw(tested
              ? "Main PR-depth SHA is already green; skipping checks."
              : "Main has an untested PR-depth SHA; running checks.").write();

      - name: Validate SHA format
        if: steps.selection.outputs.run == 'true'
        env:
          SHA: ${{ inputs.sha || github.sha }}
        run: |
          if [[ ! "$SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::SHA must be a full lowercase 40-hex commit."
            exit 1
          fi

      - name: Fetch main history
        timeout-minutes: 5
        if: steps.selection.outputs.run == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          SERVER_URL: ${{ github.server_url }}
        run: |
          directory="$RUNNER_TEMP/main-pr-depth-validation"
          mkdir -p "$directory"
          git -C "$directory" init
          git -C "$directory" remote add origin "$SERVER_URL/$REPOSITORY.git"
          auth=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 | tr -d '\n')
          echo "::add-mask::$auth"
          bash "$NETWORK_RETRY_SCRIPT" git -C "$directory" -c "http.extraheader=AUTHORIZATION: basic $auth" fetch --no-tags origin main:refs/remotes/origin/main
          git -C "$directory" show origin/main:scripts/verify-release-tree-proof.sh > "$RUNNER_TEMP/verify-release-tree-proof.sh"
          git -C "$directory" show origin/main:scripts/retry.sh > "$RUNNER_TEMP/retry.sh"
          git -C "$directory" show origin/main:scripts/verify-release-candidate-tree.mjs > "$RUNNER_TEMP/verify-release-candidate-tree.mjs"
          git -C "$directory" show origin/main:scripts/gh-retry.sh > "$RUNNER_TEMP/gh-retry.sh"

      - name: Verify main ancestry
        if: steps.selection.outputs.run == 'true'
        id: ancestor
        working-directory: ${{ runner.temp }}/main-pr-depth-validation
        env:
          SHA: ${{ inputs.sha || github.sha }}
          GH_TOKEN: ${{ github.token }}
          GH_RETRY_SCRIPT: ${{ runner.temp }}/gh-retry.sh
        run: |
          proof_args=()
          if ! git merge-base --is-ancestor "$SHA" origin/main; then
            proof_args+=(--allow-pr-head)
          fi
          bash "$RUNNER_TEMP/verify-release-tree-proof.sh" "${proof_args[@]}" "$GITHUB_REPOSITORY" "$SHA" "$SHA" >> "$GITHUB_OUTPUT"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"

  suites:
    if: needs.validate.result == 'success' && needs.validate.outputs.run == 'true'
    needs: validate
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read
      actions: write
      checks: read
      pull-requests: read
      packages: read
    with:
      depth: fast
      pr_depth_only: true
      sha: ${{ needs.validate.outputs.sha }}
    secrets:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}

  status:
    if: always() && needs.validate.result != 'skipped' && needs.validate.outputs.run != 'false' && !needs.validate.outputs.proof
    needs: [validate, suites]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: read
      statuses: write
    steps:
      - name: Checkout GitHub API tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.repository }}
          ref: ${{ github.workflow_sha }}
          path: .gh-retry
          persist-credentials: false
          sparse-checkout: |
            scripts/gh-retry.sh
            scripts/main-pr-depth-status.sh
          sparse-checkout-cone-mode: false

      - name: Publish PR-depth conclusion
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          # A scheduled run always publishes, even when validation stops early,
          # because a cancelled earlier run for the same commit defers to it.
          SHA: ${{ needs.validate.outputs.sha || (github.event_name == 'schedule' && github.sha) || '' }}
          RESULTS: ${{ toJSON(needs) }}
          PROOF_MAIN_BASE: ${{ needs.validate.outputs.main-base }}
          RUN_ID: ${{ github.run_id }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: bash "$GITHUB_WORKSPACE/.gh-retry/scripts/main-pr-depth-status.sh"
