name: Request network baseline

on:
  pull_request_target: # zizmor: ignore[dangerous-triggers] label requests dispatch only trusted main, never PR source
    branches: [main]
    types: [labeled]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.label.name == 'baseline:record' && format('pr-{0}', github.event.pull_request.number) || format('event-{0}', github.run_id) }}
  cancel-in-progress: true

permissions: {}

jobs:
  request:
    if: github.event_name == 'pull_request_target' && github.event.label.name == 'baseline:record'
    runs-on: ubuntu-latest
    timeout-minutes: 1
    permissions:
      actions: write
    steps:
      - name: Request main recording
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          retries: 0
          script: |
            await github.rest.actions.createWorkflowDispatch({
              ...context.repo,
              workflow_id: "network-baseline-record.yml",
              ref: "main",
            });
