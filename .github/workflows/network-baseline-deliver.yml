name: Deliver network baseline

# workflow_run loads this definition from main. The recording workflow runs PR
# code without secrets; this job reads its artifact as untrusted data only.
on:
  workflow_run: # zizmor: ignore[dangerous-triggers] trusted main script validates the artifact; no PR code executes in this workflow
    workflows: [Record network baseline]
    types: [completed]

permissions: {}

jobs:
  deliver:
    if: >-
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
      && github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      actions: read
      contents: read
      issues: write
      pull-requests: read
    steps:
      - name: Locate the single recorded baseline artifact
        id: artifact
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          set -euo pipefail
          artifacts=$(gh api "repos/$REPOSITORY/actions/runs/$RUN_ID/artifacts" --paginate)
          mapfile -t names < <(jq -r '.artifacts[] | select(.expired == false and (.name | startswith("network-baseline-record-"))) | .name' <<< "$artifacts")
          if (( ${#names[@]} == 0 )); then
            echo "found=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if (( ${#names[@]} != 1 )); then
            echo "::error::Expected exactly one recorded baseline artifact"
            exit 1
          fi
          name=${names[0]}
          if [[ ! "$name" =~ ^network-baseline-record-([1-9][0-9]*)-([a-f0-9]{40})-([a-f0-9]{40})-(true|false)$ ]]; then
            echo "::error::Invalid baseline artifact identity"
            exit 1
          fi
          {
            echo "found=true"
            echo "name=$name"
            echo "pr=${BASH_REMATCH[1]}"
            echo "head=${BASH_REMATCH[2]}"
            echo "base=${BASH_REMATCH[3]}"
            echo "all=${BASH_REMATCH[4]}"
          } >> "$GITHUB_OUTPUT"

      - name: Verify the current pull request
        if: steps.artifact.outputs.found == 'true'
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ steps.artifact.outputs.pr }}
          RECORDED_HEAD: ${{ steps.artifact.outputs.head }}
          RECORDED_BASE: ${{ steps.artifact.outputs.base }}
          BASE_BRANCH: ${{ github.event.repository.default_branch }}
          RUN_EVENT: ${{ github.event.workflow_run.event }}
          RUN_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          RUN_HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          RUN_HEAD_REPOSITORY: ${{ github.event.workflow_run.head_repository.full_name }}
          RUN_PULL_REQUESTS: ${{ toJSON(github.event.workflow_run.pull_requests) }}
        run: |
          set -euo pipefail
          # Artifact names are recorder-controlled; bind them to the trusted
          # workflow_run identity before selecting a branch for an App commit.
          case "$RUN_EVENT" in
            pull_request)
              if [[ "$RUN_HEAD_SHA" != "$RECORDED_HEAD" ]] \
                || ! jq -e --argjson pr "$PR_NUMBER" 'type == "array" and any(.[]; .number == $pr)' <<< "$RUN_PULL_REQUESTS" > /dev/null; then
                echo "::error::Recorded pull request identity does not match the triggering run"
                exit 1
              fi
              ;;
            workflow_dispatch)
              if [[ "$RUN_HEAD_BRANCH" != "$BASE_BRANCH" ]]; then
                echo "::error::Dispatch must run from the default branch"
                exit 1
              fi
              ;;
            *)
              echo "::error::Unsupported recording event: $RUN_EVENT"
              exit 1
              ;;
          esac
          pr=$(gh api "repos/$REPOSITORY/pulls/$PR_NUMBER")
          if [[ "$(jq -r '.state' <<< "$pr")" != open \
            || "$(jq -r '.base.ref' <<< "$pr")" != "$BASE_BRANCH" \
            || "$(jq -r '.head.sha' <<< "$pr")" != "$RECORDED_HEAD" \
            || "$(jq -r '.base.sha' <<< "$pr")" != "$RECORDED_BASE" ]]; then
            echo "::error::The pull request head or base moved since recording"
            exit 1
          fi
          head_repo=$(jq -r '.head.repo.full_name' <<< "$pr")
          if [[ "$RUN_EVENT" == pull_request && "$head_repo" != "$RUN_HEAD_REPOSITORY" ]]; then
            echo "::error::The pull request repository differs from the triggering run"
            exit 1
          fi
          push_allowed=false
          if [[ "$head_repo" == "$REPOSITORY" && "$RUN_HEAD_REPOSITORY" == "$REPOSITORY" ]]; then
            push_allowed=true
          fi
          {
            echo "pr=$PR_NUMBER"
            echo "branch=$(jq -r '.head.ref' <<< "$pr")"
            echo "push-allowed=$push_allowed"
          } >> "$GITHUB_OUTPUT"

      - name: Download recorded JSON
        if: steps.artifact.outputs.found == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          ARTIFACT_NAME: ${{ steps.artifact.outputs.name }}
        run: |
          mkdir -p "$RUNNER_TEMP/recorded"
          gh run download "$RUN_ID" -R "$REPOSITORY" -n "$ARTIFACT_NAME" -D "$RUNNER_TEMP/recorded"
          mapfile -t files < <(find "$RUNNER_TEMP/recorded" -type f)
          if (( ${#files[@]} != 1 )) || [[ "${files[0]}" != "$RUNNER_TEMP/recorded/network-baseline.json" ]] \
            || [[ -n "$(find "$RUNNER_TEMP/recorded" -type l -print -quit)" ]]; then
            echo "::error::Artifact must contain exactly one regular network-baseline.json"
            exit 1
          fi

      - name: Checkout trusted validator from main
        if: steps.artifact.outputs.found == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false

      - name: Keep trusted validator outside the pull request checkout
        if: steps.artifact.outputs.found == 'true'
        env:
          WORKFLOW_SHA: ${{ github.workflow_sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$WORKFLOW_SHA"
          mkdir -p "$RUNNER_TEMP/trusted-baseline/scripts"
          cp package.json "$RUNNER_TEMP/trusted-baseline/package.json"
          cp scripts/network-baseline-scope.ts "$RUNNER_TEMP/trusted-baseline/scripts/network-baseline-scope.ts"

      - name: Checkout the recorded pull request head
        if: steps.artifact.outputs.found == 'true' && steps.pr.outputs.push-allowed == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.artifact.outputs.head }}
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Bun
        if: steps.artifact.outputs.found == 'true'
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: ${{ runner.temp }}/trusted-baseline/package.json

      - name: Validate recorded JSON schema
        if: steps.artifact.outputs.found == 'true'
        run: |
          cd "$RUNNER_TEMP/trusted-baseline"
          bun --no-install --no-env-file scripts/network-baseline-scope.ts validate "$RUNNER_TEMP/recorded/network-baseline.json"

      - name: Validate recorded data and route scope
        if: steps.pr.outputs.push-allowed == 'true'
        env:
          BASE_SHA: ${{ steps.artifact.outputs.base }}
          HEAD_SHA: ${{ steps.artifact.outputs.head }}
          PR_NUMBER: ${{ steps.artifact.outputs.pr }}
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          ALL_ROUTES: ${{ steps.artifact.outputs.all }}
          RUN_EVENT: ${{ github.event.workflow_run.event }}
          RUN_BRANCH: ${{ github.event.workflow_run.head_branch }}
          BASE_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$HEAD_SHA"
          git fetch --no-tags origin "$BASE_SHA"
          git show "$BASE_SHA:apps/web/e2e/network-baseline.json" > "$RUNNER_TEMP/base-baseline.json"
          git show "$BASE_SHA:apps/web/src/routeTree.gen.ts" > "$RUNNER_TEMP/base-route-tree.gen.ts"
          git diff --name-only --no-renames "$BASE_SHA"..."$HEAD_SHA" -- apps/web/src/routes > "$RUNNER_TEMP/changed-routes"
          recorded="$RUNNER_TEMP/recorded/network-baseline.json"
          cp "$recorded" "$RUNNER_TEMP/scoped-baseline.json"
          args=()
          if [[ "$ALL_ROUTES" == true ]]; then
            if [[ "$RUN_EVENT" != workflow_dispatch || "$RUN_BRANCH" != "$BASE_BRANCH" ]]; then
              echo "::error::Only a dispatch from the default branch may update all routes"
              exit 1
            fi
            args+=(--all)
          fi
          cd "$RUNNER_TEMP/trusted-baseline"
          bun --no-install --no-env-file scripts/network-baseline-scope.ts scope \
            --base "$RUNNER_TEMP/base-baseline.json" \
            --recorded "$RUNNER_TEMP/scoped-baseline.json" \
            --changed "$RUNNER_TEMP/changed-routes" \
            --base-route-tree "$RUNNER_TEMP/base-route-tree.gen.ts" \
            --route-tree "$GITHUB_WORKSPACE/apps/web/src/routeTree.gen.ts" "${args[@]}"
          cmp "$recorded" "$RUNNER_TEMP/scoped-baseline.json"
          cp "$recorded" "$GITHUB_WORKSPACE/apps/web/e2e/network-baseline.json"

      - name: Create CI-triggering app token
        if: steps.pr.outputs.push-allowed == 'true'
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.PROVENANCE_APP_ID }}
          private-key: ${{ secrets.PROVENANCE_APP_PRIVATE_KEY }}
          permission-contents: write

      # The API signs the commit. append checks that the branch still points
      # at the recorded head, so a concurrent push cannot receive stale data.
      - name: Commit baseline to same-repository pull request
        if: steps.pr.outputs.push-allowed == 'true'
        uses: stella/.github/.github/actions/signed-commit@aff5017c264acce5a2bcdf15876da08835e6de70
        with:
          token: ${{ steps.app-token.outputs.token }}
          mode: append
          branch: ${{ steps.pr.outputs.branch }}
          paths: apps/web/e2e/network-baseline.json
          commit-message: "chore(web): record network baseline"

      - name: Remove recording label
        if: always() && steps.pr.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ steps.pr.outputs.pr }}
        run: |
          set -euo pipefail
          if gh api "repos/$REPOSITORY/issues/$PR_NUMBER/labels" --jq '.[].name' | grep -Fxq 'baseline:record'; then
            gh api -X DELETE "repos/$REPOSITORY/issues/$PR_NUMBER/labels/baseline%3Arecord" --silent
          fi

  remove-label-after-failure:
    if: >-
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
      && github.event.workflow_run.conclusion != 'success'
      && github.event.workflow_run.event == 'pull_request'
      && github.event.workflow_run.pull_requests[0].number != null
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      issues: write
    steps:
      - name: Remove recording label
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.workflow_run.pull_requests[0].number }}
        run: |
          set -euo pipefail
          if gh api "repos/$REPOSITORY/issues/$PR_NUMBER/labels" --jq '.[].name' | grep -Fxq 'baseline:record'; then
            gh api -X DELETE "repos/$REPOSITORY/issues/$PR_NUMBER/labels/baseline%3Arecord" --silent
          fi
