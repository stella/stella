name: Deliver network baseline

# Publish a validated, immutable main recording; no branch writes or PR threads.
on:
  workflow_run: # zizmor: ignore[dangerous-triggers] only successful main runs are accepted; artifacts are validated as data with read-only credentials
    workflows: [Record network baseline]
    types: [completed]

permissions: {}

jobs:
  deliver:
    if: >-
      github.event.workflow_run.conclusion == 'success'
      && github.event.workflow_run.head_branch == github.event.repository.default_branch
      && github.event.workflow_run.head_repository.full_name == github.repository
      && github.event.workflow_run.path == '.github/workflows/network-baseline-record.yml'
      && contains(fromJSON('["schedule", "workflow_dispatch"]'), github.event.workflow_run.event)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
    steps:
      - name: Checkout GitHub API tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.repository }}
          ref: ${{ github.workflow_sha }}
          path: .gh-retry
          persist-credentials: false
          sparse-checkout: scripts/gh-retry.sh
          sparse-checkout-cone-mode: false

      - name: Preserve GitHub API tooling across source checkouts
        run: |
          cp "$GITHUB_WORKSPACE/.gh-retry/scripts/gh-retry.sh" "$RUNNER_TEMP/gh-retry.sh"
          echo "GH_RETRY_SCRIPT=$RUNNER_TEMP/gh-retry.sh" >> "$GITHUB_ENV"

      - name: Checkout trusted validator
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: package.json
          no-cache: true

      - name: Download and validate main recording
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          RECORDED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          [[ "$RECORDED_SHA" =~ ^[a-f0-9]{40}$ ]]
          mkdir -p "$RUNNER_TEMP/recorded"
          bash "$GH_RETRY_SCRIPT" run download "$RUN_ID" -R "$REPOSITORY" \
            -n "network-baseline-record-$RECORDED_SHA" -D "$RUNNER_TEMP/recorded"
          mapfile -t files < <(find "$RUNNER_TEMP/recorded" -type f)
          if (( ${#files[@]} != 1 )) || [[ "${files[0]}" != "$RUNNER_TEMP/recorded/network-baseline.json" ]] \
            || [[ -n "$(find "$RUNNER_TEMP/recorded" -type l -print -quit)" ]]; then
            echo "::error::Expected a single regular baseline JSON"
            exit 1
          fi
          bun --no-install --no-env-file scripts/network-baseline-scope.ts validate "$RUNNER_TEMP/recorded/network-baseline.json"
          echo "Published main network recording for $RECORDED_SHA" >> "$GITHUB_STEP_SUMMARY"

      - name: Publish validated main baseline
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: network-baseline-main-${{ github.event.workflow_run.head_sha }}
          path: ${{ runner.temp }}/recorded/network-baseline.json
          if-no-files-found: error
          retention-days: 90
