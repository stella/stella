name: Deliver network baseline

# workflow_run loads this definition from main. The recording workflow runs PR
# code without secrets; this job reads its artifact as untrusted data only.
# The validator is checked out at github.workflow_sha, no PR cache is restored,
# and the App token is created only after validation passes.
#
# The recorded values come from the PR's own code. Validation checks schema
# and which entries change, not the values, so every delivered commit opens a
# review thread that must be resolved before merge. The App pushes only to PR
# branches; main stays protected because the App is not a bypass actor in
# .github/branch-protection/ruleset-main.json.
on:
  workflow_run: # zizmor: ignore[dangerous-triggers] main's script checks the artifact's schema and scope; no PR code executes in this workflow
    workflows: [Record network baseline]
    types: [completed]

permissions: {}

jobs:
  deliver:
    if: >-
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
      && github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      actions: read
      contents: read
      pull-requests: read
    outputs:
      pr: ${{ steps.pr.outputs.pr }}
      head: ${{ steps.artifact.outputs.head }}
      push-allowed: ${{ steps.pr.outputs.push-allowed }}
      committed: ${{ steps.commit.outputs.operation == 'committed' }}
      commit-sha: ${{ steps.commit.outputs.commit-sha }}
      summary: ${{ steps.summary.outputs.summary }}
    steps:
      - name: Locate the single recorded baseline artifact
        id: artifact
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          set -euo pipefail
          artifacts=$(gh api "repos/$REPOSITORY/actions/runs/$RUN_ID/artifacts" --paginate)
          mapfile -t names < <(jq -r '.artifacts[] | select(.expired == false and (.name | startswith("network-baseline-record-"))) | .name' <<< "$artifacts")
          if (( ${#names[@]} == 0 )); then
            echo "found=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if (( ${#names[@]} != 1 )); then
            echo "::error::Expected exactly one recorded baseline artifact"
            exit 1
          fi
          name=${names[0]}
          if [[ ! "$name" =~ ^network-baseline-record-([1-9][0-9]*)-([a-f0-9]{40})-([a-f0-9]{40})-(true|false)$ ]]; then
            echo "::error::Invalid baseline artifact identity"
            exit 1
          fi
          {
            echo "found=true"
            echo "name=$name"
            echo "pr=${BASH_REMATCH[1]}"
            echo "head=${BASH_REMATCH[2]}"
            echo "base=${BASH_REMATCH[3]}"
            echo "all=${BASH_REMATCH[4]}"
          } >> "$GITHUB_OUTPUT"

      - name: Verify the current pull request
        if: steps.artifact.outputs.found == 'true'
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ steps.artifact.outputs.pr }}
          RECORDED_HEAD: ${{ steps.artifact.outputs.head }}
          RECORDED_BASE: ${{ steps.artifact.outputs.base }}
          BASE_BRANCH: ${{ github.event.repository.default_branch }}
          RUN_EVENT: ${{ github.event.workflow_run.event }}
          RUN_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          RUN_HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          RUN_HEAD_REPOSITORY: ${{ github.event.workflow_run.head_repository.full_name }}
          RUN_PULL_REQUESTS: ${{ toJSON(github.event.workflow_run.pull_requests) }}
        run: |
          set -euo pipefail
          # Artifact names are recorder-controlled; bind them to the trusted
          # workflow_run identity before selecting a branch for an App commit.
          case "$RUN_EVENT" in
            pull_request)
              if [[ "$RUN_HEAD_SHA" != "$RECORDED_HEAD" ]] \
                || ! jq -e --argjson pr "$PR_NUMBER" 'type == "array" and any(.[]; .number == $pr)' <<< "$RUN_PULL_REQUESTS" > /dev/null; then
                echo "::error::Recorded pull request identity does not match the triggering run"
                exit 1
              fi
              ;;
            workflow_dispatch)
              if [[ "$RUN_HEAD_BRANCH" != "$BASE_BRANCH" ]]; then
                echo "::error::Dispatch must run from the default branch"
                exit 1
              fi
              ;;
            *)
              echo "::error::Unsupported recording event: $RUN_EVENT"
              exit 1
              ;;
          esac
          pr=$(gh api "repos/$REPOSITORY/pulls/$PR_NUMBER")
          if [[ "$(jq -r '.state' <<< "$pr")" != open \
            || "$(jq -r '.base.ref' <<< "$pr")" != "$BASE_BRANCH" \
            || "$(jq -r '.head.sha' <<< "$pr")" != "$RECORDED_HEAD" \
            || "$(jq -r '.base.sha' <<< "$pr")" != "$RECORDED_BASE" ]]; then
            echo "::error::The pull request head or base moved since recording"
            exit 1
          fi
          head_repo=$(jq -r '.head.repo.full_name' <<< "$pr")
          if [[ "$RUN_EVENT" == pull_request && "$head_repo" != "$RUN_HEAD_REPOSITORY" ]]; then
            echo "::error::The pull request repository differs from the triggering run"
            exit 1
          fi
          push_allowed=false
          if [[ "$head_repo" == "$REPOSITORY" && "$RUN_HEAD_REPOSITORY" == "$REPOSITORY" ]]; then
            push_allowed=true
          fi
          {
            echo "pr=$PR_NUMBER"
            echo "branch=$(jq -r '.head.ref' <<< "$pr")"
            echo "push-allowed=$push_allowed"
          } >> "$GITHUB_OUTPUT"

      - name: Download recorded JSON
        if: steps.artifact.outputs.found == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          ARTIFACT_NAME: ${{ steps.artifact.outputs.name }}
        run: |
          mkdir -p "$RUNNER_TEMP/recorded"
          gh run download "$RUN_ID" -R "$REPOSITORY" -n "$ARTIFACT_NAME" -D "$RUNNER_TEMP/recorded"
          mapfile -t files < <(find "$RUNNER_TEMP/recorded" -type f)
          if (( ${#files[@]} != 1 )) || [[ "${files[0]}" != "$RUNNER_TEMP/recorded/network-baseline.json" ]] \
            || [[ -n "$(find "$RUNNER_TEMP/recorded" -type l -print -quit)" ]]; then
            echo "::error::Artifact must contain exactly one regular network-baseline.json"
            exit 1
          fi

      - name: Checkout trusted validator from main
        if: steps.artifact.outputs.found == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false

      - name: Keep trusted validator outside the pull request checkout
        if: steps.artifact.outputs.found == 'true'
        env:
          WORKFLOW_SHA: ${{ github.workflow_sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$WORKFLOW_SHA"
          mkdir -p "$RUNNER_TEMP/main-validator/scripts"
          cp package.json "$RUNNER_TEMP/main-validator/package.json"
          cp scripts/network-baseline-scope.ts "$RUNNER_TEMP/main-validator/scripts/network-baseline-scope.ts"

      - name: Checkout the recorded pull request head
        if: steps.artifact.outputs.found == 'true' && steps.pr.outputs.push-allowed == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.artifact.outputs.head }}
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Bun
        if: steps.artifact.outputs.found == 'true'
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: ${{ runner.temp }}/main-validator/package.json
          no-cache: true

      - name: Validate recorded JSON schema
        if: steps.artifact.outputs.found == 'true'
        run: |
          cd "$RUNNER_TEMP/main-validator"
          bun --no-install --no-env-file scripts/network-baseline-scope.ts validate "$RUNNER_TEMP/recorded/network-baseline.json"

      - name: Validate recorded data and route scope
        if: steps.pr.outputs.push-allowed == 'true'
        env:
          BASE_SHA: ${{ steps.artifact.outputs.base }}
          HEAD_SHA: ${{ steps.artifact.outputs.head }}
          PR_NUMBER: ${{ steps.artifact.outputs.pr }}
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          ALL_ROUTES: ${{ steps.artifact.outputs.all }}
          RUN_EVENT: ${{ github.event.workflow_run.event }}
          RUN_BRANCH: ${{ github.event.workflow_run.head_branch }}
          BASE_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$HEAD_SHA"
          git fetch --no-tags origin "$BASE_SHA"
          git show "$BASE_SHA:apps/web/e2e/network-baseline.json" > "$RUNNER_TEMP/base-baseline.json"
          git show "$BASE_SHA:apps/web/src/routeTree.gen.ts" > "$RUNNER_TEMP/base-route-tree.gen.ts"
          git diff --name-only --no-renames "$BASE_SHA"..."$HEAD_SHA" -- apps/web/src/routes > "$RUNNER_TEMP/changed-routes"
          recorded="$RUNNER_TEMP/recorded/network-baseline.json"
          cp "$recorded" "$RUNNER_TEMP/scoped-baseline.json"
          args=()
          if [[ "$ALL_ROUTES" == true ]]; then
            if [[ "$RUN_EVENT" != workflow_dispatch || "$RUN_BRANCH" != "$BASE_BRANCH" ]]; then
              echo "::error::Only a dispatch from the default branch may update all routes"
              exit 1
            fi
            args+=(--all)
          fi
          cd "$RUNNER_TEMP/main-validator"
          bun --no-install --no-env-file scripts/network-baseline-scope.ts scope \
            --base "$RUNNER_TEMP/base-baseline.json" \
            --recorded "$RUNNER_TEMP/scoped-baseline.json" \
            --changed "$RUNNER_TEMP/changed-routes" \
            --base-route-tree "$RUNNER_TEMP/base-route-tree.gen.ts" \
            --route-tree "$GITHUB_WORKSPACE/apps/web/src/routeTree.gen.ts" "${args[@]}"
          cmp "$recorded" "$RUNNER_TEMP/scoped-baseline.json"
          cp "$recorded" "$GITHUB_WORKSPACE/apps/web/e2e/network-baseline.json"

      - name: Summarize budget changes for review
        if: steps.pr.outputs.push-allowed == 'true'
        id: summary
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/main-validator"
          bun --no-install --no-env-file scripts/network-baseline-scope.ts summary \
            --base "$RUNNER_TEMP/base-baseline.json" \
            --recorded "$RUNNER_TEMP/recorded/network-baseline.json" > "$RUNNER_TEMP/budget-summary.md"
          delimiter="summary-$(openssl rand -hex 16)"
          {
            echo "summary<<$delimiter"
            cat "$RUNNER_TEMP/budget-summary.md"
            echo "$delimiter"
          } >> "$GITHUB_OUTPUT"

      - name: Create CI-triggering app token
        if: steps.pr.outputs.push-allowed == 'true'
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.PROVENANCE_APP_ID }}
          private-key: ${{ secrets.PROVENANCE_APP_PRIVATE_KEY }}
          permission-contents: write

      # The API signs the commit. append checks that the branch still points
      # at the recorded head, so a concurrent push cannot receive stale data.
      - name: Commit baseline to same-repository pull request
        if: steps.pr.outputs.push-allowed == 'true'
        id: commit
        uses: stella/.github/.github/actions/signed-commit@aff5017c264acce5a2bcdf15876da08835e6de70
        with:
          token: ${{ steps.app-token.outputs.token }}
          mode: append
          branch: ${{ steps.pr.outputs.branch }}
          paths: apps/web/e2e/network-baseline.json
          commit-message: |
            chore(web): record network baseline

            Records the network baseline from this pull request's run. The
            values come from the pull request's own code; review them as a
            budget change.

  # The deliver job has no write access to the pull request. Once the pull
  # request is verified, this job removes the recording label and reports a
  # delivery that never reached the branch (for example, a queued branch that
  # refuses pushes) as a comment and a failing status on the recorded head.
  report-delivery:
    needs: deliver
    if: always() && needs.deliver.outputs.pr != ''
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      issues: write
      pull-requests: write
      statuses: write
    steps:
      - name: Remove recording label
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ needs.deliver.outputs.pr }}
        run: |
          set -euo pipefail
          if gh api "repos/$REPOSITORY/issues/$PR_NUMBER/labels" --jq '.[].name' | grep -Fxq 'baseline:record'; then
            gh api -X DELETE "repos/$REPOSITORY/issues/$PR_NUMBER/labels/baseline%3Arecord" --silent
          fi

      - name: Report the delivery on the recorded head
        if: always() && needs.deliver.outputs.push-allowed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ needs.deliver.outputs.pr }}
          HEAD_SHA: ${{ needs.deliver.outputs.head }}
          DELIVERED: ${{ needs.deliver.result == 'success' || needs.deliver.outputs.committed == 'true' }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          if [[ ! "$HEAD_SHA" =~ ^[a-f0-9]{40}$ ]]; then
            echo "::error::No recorded head to report on for #$PR_NUMBER"
            exit 1
          fi
          if [[ "$DELIVERED" == true ]]; then
            gh api -X POST "repos/$REPOSITORY/statuses/$HEAD_SHA" \
              -f state=success \
              -f context=network-baseline/deliver \
              -f description="The recorded network baseline was delivered" \
              -f target_url="$RUN_URL" --silent
            exit 0
          fi
          gh api -X POST "repos/$REPOSITORY/statuses/$HEAD_SHA" \
            -f state=failure \
            -f context=network-baseline/deliver \
            -f description="The recorded network baseline was not committed" \
            -f target_url="$RUN_URL" --silent
          body=$(printf '%s\n\n%s\n\n%s\n' \
            "The recorded network baseline was not committed to this branch." \
            "A branch in the merge queue cannot be updated. Take the pull request out of the queue, then record the baseline again." \
            "Delivery run: $RUN_URL")
          gh api -X POST "repos/$REPOSITORY/issues/$PR_NUMBER/comments" -f body="$body" --silent

  # This job opens the review thread on a delivered commit. An
  # unresolved review thread blocks merging on main, so the recorded budgets
  # get a fresh review after every delivered commit.
  request-budget-review:
    needs: deliver
    # always(): a later deliver step failing must not skip the thread for a
    # commit that was already pushed.
    if: always() && needs.deliver.outputs.committed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      pull-requests: write
    steps:
      - name: Open a budget review thread on the recorded baseline
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ needs.deliver.outputs.pr }}
          COMMIT_SHA: ${{ needs.deliver.outputs.commit-sha }}
          BODY: ${{ needs.deliver.outputs.summary }}
        run: |
          set -euo pipefail
          if [[ ! "$COMMIT_SHA" =~ ^[a-f0-9]{40}$ || -z "$BODY" ]]; then
            echo "::error::The baseline was pushed to #$PR_NUMBER, but no review thread could be prepared. Review the baseline diff before merging."
            exit 1
          fi
          if ! gh api -X POST "repos/$REPOSITORY/pulls/$PR_NUMBER/comments" \
            -f body="$BODY" \
            -f commit_id="$COMMIT_SHA" \
            -f path=apps/web/e2e/network-baseline.json \
            -f subject_type=file --silent; then
            echo "::error::The baseline was pushed to #$PR_NUMBER, but the review thread was not opened. Review the baseline diff before merging."
            exit 1
          fi

  remove-label-after-failure:
    if: >-
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
      && github.event.workflow_run.conclusion != 'success'
      && github.event.workflow_run.event == 'pull_request'
      && github.event.workflow_run.pull_requests[0].number != null
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      issues: write
      pull-requests: write
    steps:
      - name: Remove recording label
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.workflow_run.pull_requests[0].number }}
        run: |
          set -euo pipefail
          if gh api "repos/$REPOSITORY/issues/$PR_NUMBER/labels" --jq '.[].name' | grep -Fxq 'baseline:record'; then
            gh api -X DELETE "repos/$REPOSITORY/issues/$PR_NUMBER/labels/baseline%3Arecord" --silent
          fi
