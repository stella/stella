name: Update marketing screenshots

defaults:
  run:
    shell: bash

# When a PR fails the `marketing-screenshots` check because its UI change is
# intended, dispatch this workflow on the default branch and name the PR's
# branch:
#
#   gh workflow run marketing-screenshots-update.yml -f branch=<pr-branch>
#
# Running from main is what keeps the release App key on trusted workflow
# code: both job bodies below are resolved from main. The branch's app and
# spec code run in the update job, which holds no release secret and no
# environment; the publish job runs nothing from the branch, validates the
# uploaded PNGs as data, and is the only job that mints the token. The
# capture body (`.github/actions/marketing-capture`) is the one the
# comparison in marketing-screenshots.yml runs, so the two cannot drift. The
# push re-runs the PR's checks
# against the new head. Baselines are never regenerated on a developer
# machine, so the comparison tolerance only has to cover run-to-run noise on
# one runner image.

on:
  workflow_dispatch:
    inputs:
      branch:
        description: The same-repository branch whose baselines to regenerate
        required: true
        type: string

concurrency:
  # Two regenerations of one branch would race on the same push target.
  group: marketing-screenshots-update-${{ inputs.branch }}
  cancel-in-progress: false

permissions: {}

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    outputs:
      sha: ${{ steps.head.outputs.sha }}

    steps:
      - name: Checkout GitHub API tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.repository }}
          ref: ${{ github.workflow_sha }}
          path: .gh-retry
          persist-credentials: false
          sparse-checkout: scripts/gh-retry.sh
          sparse-checkout-cone-mode: false

      - name: Preserve GitHub API tooling across source checkouts
        run: |
          cp "$GITHUB_WORKSPACE/.gh-retry/scripts/gh-retry.sh" "$RUNNER_TEMP/gh-retry.sh"
          echo "GH_RETRY_SCRIPT=$RUNNER_TEMP/gh-retry.sh" >> "$GITHUB_ENV"

      - name: Validate inputs
        env:
          BRANCH: ${{ inputs.branch }}
          WORKFLOW_REF: ${{ github.ref_name }}
        run: |
          # `ref` reaches a checkout and a push refspec, so it has to be a
          # plain branch name and nothing that reads as an option or a path
          # traversal.
          if [[ -n "$BRANCH" ]]; then
            if [[ "$BRANCH" == "main" ]]; then
              echo "::error::main's baselines are regenerated through a pull request, never pushed in place"
              exit 1
            fi
            if [[ ! "$BRANCH" =~ ^[A-Za-z0-9._/-]+$ || "$BRANCH" == *".."* || "$BRANCH" == -* ]]; then
              echo "::error::Not a plain branch name: $BRANCH"
              exit 1
            fi
          fi

          # The release App key must only ever run workflow code from main
          # (the posture of release-tag.yml): running this on a branch would
          # hand the key that branch's job body. Update mode therefore runs
          # on main and is told which branch to regenerate, so only the app
          # and spec code checked out below is branch-owned.
          if [[ "$WORKFLOW_REF" != "main" ]]; then
            echo "::error::Update mode must be dispatched on main, not $WORKFLOW_REF; pass the branch with -f branch=<pr-branch>"
            exit 1
          fi
          if [[ -z "$BRANCH" ]]; then
            echo "::error::Update mode needs the branch whose baselines to regenerate"
            exit 1
          fi

      - name: Verify the branch exists
        # A typo must not reach the capture, and a fork PR's branch does not
        # exist here at all (its baselines travel as the artifact uploaded
        # below).
        env:
          BRANCH: ${{ inputs.branch }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! bash "$GH_RETRY_SCRIPT" api "repos/${GITHUB_REPOSITORY}/branches/${BRANCH}" --silent; then
            echo "::error::Branch ${BRANCH} does not exist in ${GITHUB_REPOSITORY}"
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # This job never holds a push credential: the branch's app and spec
          # code run here, so the push lives in the publish job below.
          persist-credentials: false
          ref: ${{ inputs.branch }}
          submodules: true

      # Recorded before any branch code runs; the publish job builds on
      # exactly this commit, so a later push to the branch fails the push.
      - name: Record the regenerated head
        id: head
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Capture marketing screenshots
        uses: ./.github/actions/marketing-capture
        with:
          mode: update
          dockerhub-username: ${{ secrets.DOCKERHUB_USERNAME }}
          dockerhub-token: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Upload regenerated baselines
        # Published unconditionally: the push below only reaches a branch of
        # this repository, so a pull request from a fork takes them from here.
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: marketing-screenshots-${{ github.run_id }}
          path: apps/landing/public/media/products/*.png
          if-no-files-found: error
          retention-days: 7

      - name: Note the artifact for fork pull requests
        env:
          ARTIFACT: marketing-screenshots-${{ github.run_id }}
        run: |
          {
            echo "### Regenerated PNGs: \`$ARTIFACT\`"
            echo
            echo "The push only reaches a branch of this repository. A pull request from a fork downloads that artifact and commits the PNGs itself."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          # Mode and run keep the nightly, PR, and dispatched artifacts apart.
          name: marketing-screenshots-update-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            /tmp/api.log
            /tmp/web.log
            apps/web/test-results/
          if-no-files-found: ignore
          retention-days: 7

  publish:
    needs: update
    if: needs.update.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      # The push runs on the App token, not GITHUB_TOKEN: a push made with
      # GITHUB_TOKEN does not re-trigger the PR's checks, so the branch would
      # sit on a failed marketing check with the fix already committed.
      contents: read
    # The release App key is a secret of this environment alone (main and
    # v* tags only); no caller passes it in, so only this job can read it.
    environment: release-app

    # Nothing from the branch executes in this job: it checks the branch out
    # only as the parent tree of the commit, and treats the uploaded PNGs as
    # untrusted data until the validation step below accepts them.
    steps:
      - name: Validate inputs
        env:
          BRANCH: ${{ inputs.branch }}
          SHA: ${{ needs.update.outputs.sha }}
          WORKFLOW_REF: ${{ github.ref_name }}
        run: |
          if [[ "$WORKFLOW_REF" != "main" ]]; then
            echo "::error::Regenerated baselines are pushed only by workflow code from main, not $WORKFLOW_REF"
            exit 1
          fi
          if [[ -z "$BRANCH" || "$BRANCH" == "main" || ! "$BRANCH" =~ ^[A-Za-z0-9._/-]+$ || "$BRANCH" == *".."* || "$BRANCH" == -* ]]; then
            echo "::error::Not a pushable branch name: $BRANCH"
            exit 1
          fi
          if [[ ! "$SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::The capture job reported no regenerated head"
            exit 1
          fi

      - name: Checkout the regenerated head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ needs.update.outputs.sha }}

      - name: Download regenerated baselines
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: marketing-screenshots-${{ github.run_id }}
          path: ${{ runner.temp }}/regenerated-baselines

      - name: Stage validated baselines
        env:
          SOURCE: ${{ runner.temp }}/regenerated-baselines
          TARGET: apps/landing/public/media/products
        run: |
          set -euo pipefail
          # Only flat, regular PNG files with plain names cross from the
          # capture job; anything else fails before the token exists.
          count=0
          while IFS= read -r -d '' entry; do
            name="${entry#"$SOURCE"/}"
            if [[ -L "$entry" || ! -f "$entry" ]]; then
              echo "::error::Not a regular file: $name"
              exit 1
            fi
            if [[ ! "$name" =~ ^[A-Za-z0-9][A-Za-z0-9._-]*\.png$ ]]; then
              echo "::error::Unexpected file in the regenerated baselines: $name"
              exit 1
            fi
            if (( $(wc -c < "$entry") > 20000000 )); then
              echo "::error::Baseline is implausibly large: $name"
              exit 1
            fi
            if [[ "$(head -c 8 "$entry" | LC_ALL=C od -An -tx1 | tr -d ' \n')" != "89504e470d0a1a0a" ]]; then
              echo "::error::Not a PNG: $name"
              exit 1
            fi
            count=$((count + 1))
          done < <(find "$SOURCE" -mindepth 1 -print0)
          if (( count == 0 )); then
            echo "::error::The capture job uploaded no baselines"
            exit 1
          fi
          # The branch decides what sits at TARGET; it must resolve to the
          # products directory inside this checkout, not through a symlink.
          if [[ -L "$TARGET" || ! -d "$TARGET" \
            || "$(cd -- "$TARGET" && pwd -P)" != "$(pwd -P)/$TARGET" ]]; then
            echo "::error::$TARGET is not the products directory of this checkout"
            exit 1
          fi
          for entry in "$TARGET"/*.png; do
            if [[ -L "$entry" ]]; then
              echo "::error::$entry is a symlink in the branch"
              exit 1
            fi
          done
          cp -- "$SOURCE"/*.png "$TARGET"/

      - name: Mint App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.STELLA_RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.STELLA_RELEASE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write

      # The commit is created through the API so GitHub signs it; the branch
      # belongs to a person, and a signed-commits rule would otherwise block
      # their pull request on this one commit. Append mode builds on the
      # checked-out head and fails if the branch moved since the capture.
      - name: Push regenerated baselines
        uses: stella/.github/.github/actions/signed-commit@167fb396c6c0f4e07296ad2cd72e6ef15367c776
        with:
          token: ${{ steps.app-token.outputs.token }}
          mode: append
          branch: ${{ inputs.branch }}
          paths: apps/landing/public/media/products/*.png
          commit-message: "chore(landing): regenerate marketing screenshots"
