name: Requeue cancelled merge groups

defaults:
  run:
    shell: bash

# A merge-group CI run cancelled from outside, with no failed step, still
# fails ci-result, and the queue then holds the entry as unmergeable until it
# is dequeued and enqueued again. This does that once per pull request head
# (scripts/merge-group-requeue.mjs). A run with a real failed step, including
# one that cancelled its own group after that failure, is left alone. The
# completed CI run triggers it; the schedule catches anything it missed.
on:
  workflow_run:
    workflows: [CI Checks]
    branches: [gh-readonly-queue/main/**]
    types: [completed]
  schedule:
    - cron: "*/10 * * * *"

concurrency:
  group: requeue-cancelled-merge-groups
  cancel-in-progress: false

permissions: {}

jobs:
  requeue:
    if: >-
      github.repository == 'stella/stella'
      && (github.event_name == 'schedule'
      || (github.event.workflow_run.head_repository.full_name == github.repository
      && github.event.workflow_run.path == '.github/workflows/ci.yml'
      && github.event.workflow_run.event == 'merge_group'
      && github.event.workflow_run.conclusion == 'cancelled'))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
      pull-requests: read
      statuses: write
    steps:
      # workflow_run is privileged: API calls only, with tooling from this
      # workflow's own commit.
      - name: Checkout requeue tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.repository }}
          ref: ${{ github.workflow_sha }}
          path: .requeue
          persist-credentials: false
          sparse-checkout: scripts/merge-group-requeue.mjs
          sparse-checkout-cone-mode: false

      - name: Plan requeues
        id: plan
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            const { pathToFileURL } = require('node:url');
            const { resolve } = require('node:path');
            const { planRequeues } = await import(pathToFileURL(
              resolve('.requeue/scripts/merge-group-requeue.mjs')).href);
            const { plans, failure } = await planRequeues({ github, repo: context.repo });
            if (failure !== null) core.setFailed(failure);
            core.setOutput('plans', JSON.stringify(plans));
            core.setOutput('requeue', String(plans.some(({ action }) => action === 'requeue')));
            core.setOutput('act', String(plans.some(({ action }) => action !== 'skip')));
            core.info(`${plans.length} unmergeable entr${plans.length === 1 ? 'y' : 'ies'}.`);

      # Enqueues made with GITHUB_TOKEN start no workflow runs, so the new
      # merge group would never get its checks; the App's enqueues do.
      - name: Mint queue token
        if: steps.plan.outputs.requeue == 'true' && vars.STELLA_MERGE_HOLD == ''
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.PROVENANCE_APP_ID }}
          private-key: ${{ secrets.PROVENANCE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          permission-pull-requests: write

      - name: Requeue cancelled entries
        if: steps.plan.outputs.act == 'true'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        env:
          PLANS: ${{ steps.plan.outputs.plans }}
          QUEUE_TOKEN: ${{ steps.app-token.outputs.token }}
        with:
          script: |
            const { pathToFileURL } = require('node:url');
            const { resolve } = require('node:path');
            const { applyRequeues } = await import(pathToFileURL(
              resolve('.requeue/scripts/merge-group-requeue.mjs')).href);
            const token = process.env.QUEUE_TOKEN;
            const failed = await applyRequeues({
              github,
              queue: token ? getOctokit(token) : null,
              repo: context.repo,
              plans: JSON.parse(process.env.PLANS),
              runUrl: (runId) => runId === null
                ? `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/queue/main`
                : `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${runId}`,
              log: { info: core.info, warning: core.warning, error: core.error },
            });
            if (failed > 0) core.setFailed(`${failed} requeue(s) failed.`);
