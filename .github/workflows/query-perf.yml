name: Record query measurements

on:
  workflow_call:
    inputs:
      sha:
        type: string
        default: ""
      heavy_only:
        type: boolean
        default: false
  workflow_dispatch:

defaults:
  run:
    shell: bash

permissions: {}

concurrency:
  group: query-perf-${{ github.event_name }}-${{ github.ref }}-${{ inputs.sha || github.sha }}
  cancel-in-progress: false

env:
  DB_LOAD_GATE_EBS_SIGNAL: disabled
  DB_LOAD_GATE_BUSY_WINDOWS: "[]"

jobs:
  query-perf:
    if: >-
      !(github.event_name == 'workflow_dispatch'
      && contains(github.workflow_ref, '/.github/workflows/query-perf.yml@'))
      || github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:18.6@sha256:74935e72241653ca55e0414067e6d8763aceb8a810eb51b452253ec3dcfc4336
        env:
          POSTGRES_USER: stella_owner
          POSTGRES_PASSWORD: stella
          POSTGRES_DB: stella
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U stella_owner -d stella"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout tested revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ inputs.heavy_only == true && inputs.sha || '' }}

      - name: Setup Bun
        uses: stella/.github/actions/setup-bun-cached@a6a6cd30646c18321ef71e344bf0af6b8d3634b8
        with:
          save: ${{ github.ref == 'refs/heads/main' }}

      - name: Install dependencies
        timeout-minutes: 2
        run: bash scripts/retry.sh bun ci --ignore-scripts
        env:
          NPM_TOKEN: ""

      - name: Configure test Postgres parity
        run: |
          bash scripts/configure-test-postgres.sh "${{ job.services.postgres.id }}" stella_owner

      - name: Resolve comparison base
        timeout-minutes: 5
        id: target-base
        uses: ./.github/actions/merge-target-base

      - name: Resolve query performance baseline
        timeout-minutes: 5
        if: ${{ !(github.event_name == 'workflow_dispatch' && contains(github.workflow_ref, '/.github/workflows/query-perf.yml@')) }}
        id: base
        env:
          BASE_SHA: ${{ steps.target-base.outputs.base_sha }}
          HEAVY_ONLY: ${{ inputs.heavy_only }}
          SHA: ${{ inputs.sha }}
        run: |
          set -euo pipefail
          if [[ "$HEAVY_ONLY" == true ]]; then
            tested_sha="$SHA"
            base_sha="$(git rev-parse "$tested_sha^")"
          else
            test -n "$BASE_SHA"
            bash "${GITHUB_WORKSPACE}/scripts/retry.sh" git fetch --no-tags origin "$BASE_SHA"
            tested_sha="$GITHUB_SHA"
            base_sha="$(git merge-base "$BASE_SHA" "$tested_sha")"
          fi
          echo "QUERY_PERF_BASE_REF=$base_sha" >> "$GITHUB_ENV"
          echo "tested_sha=$tested_sha" >> "$GITHUB_OUTPUT"

      - name: Check query performance allowances
        if: ${{ !(github.event_name == 'workflow_dispatch' && contains(github.workflow_ref, '/.github/workflows/query-perf.yml@')) }}
        run: |
          if [[ -f apps/api/src/tests/query-perf/baseline.json ]]; then
            bun scripts/query-perf-baseline.ts "$QUERY_PERF_BASE_REF"
          fi

      - name: Apply database migrations
        run: bun --filter @stll/api db:migrate
        env:
          DATABASE_URL: postgres://stella_owner:stella@127.0.0.1:5432/stella

      - name: Run query performance suite
        id: measurements
        run: bun scripts/run-perf-tests.ts
        working-directory: apps/api
        env:
          DATABASE_URL: postgres://stella_owner:stella@127.0.0.1:5432/stella
          STELLA_RUN_QUERY_PERF_TESTS: "true"
          QUERY_PERF_BASELINE_MODE: ${{ github.event_name == 'workflow_dispatch' && contains(github.workflow_ref, '/.github/workflows/query-perf.yml@') && 'record' || 'compare' }}

      - name: Validate recorded baseline
        id: validation
        if: ${{ !cancelled() && steps.measurements.outputs.baseline_recorded == 'true' }}
        run: bun scripts/query-perf-baseline.ts --validate

      - name: Upload recorded baseline
        if: ${{ !cancelled() && steps.validation.outcome == 'success' && steps.measurements.outputs.baseline_recorded == 'true' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: query-perf-baseline-record-${{ github.sha }}
          path: apps/api/src/tests/query-perf/baseline.json
          if-no-files-found: error
          retention-days: 7
