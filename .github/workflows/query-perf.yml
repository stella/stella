name: Record query measurements

on:
  workflow_call:
    inputs:
      sha:
        type: string
        default: ""
      heavy_only:
        type: boolean
        default: false
  workflow_dispatch:

permissions: {}

concurrency:
  group: query-perf-${{ github.event_name }}-${{ github.ref }}-${{ inputs.sha || github.sha }}
  cancel-in-progress: false

env:
  DB_LOAD_GATE_EBS_SIGNAL: disabled
  DB_LOAD_GATE_BUSY_WINDOWS: "[]"

jobs:
  query-perf:
    if: >-
      !(github.event_name == 'workflow_dispatch'
      && contains(github.workflow_ref, '/.github/workflows/query-perf.yml@'))
      || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:18.6@sha256:4ef4dbc939d61acea57712655ddb4b4ab27419c913f94cca0cd57cb3ea3c2280
        env:
          POSTGRES_USER: stella_owner
          POSTGRES_PASSWORD: stella
          POSTGRES_DB: stella
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U stella_owner -d stella"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout tested revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ inputs.heavy_only == true && inputs.sha || '' }}

      - name: Setup Bun
        uses: stella/.github/actions/setup-bun-cached@167fb396c6c0f4e07296ad2cd72e6ef15367c776
        with:
          save: ${{ github.ref == 'refs/heads/main' }}

      - name: Install dependencies
        run: bash scripts/retry.sh bun ci --ignore-scripts
        env:
          NPM_TOKEN: ""

      - name: Configure PostgreSQL archive clients
        env:
          POSTGRES_SERVICE_ID: ${{ job.services.postgres.id }}
        run: |
          set -euo pipefail
          image=$(docker inspect --format '{{.Config.Image}}' "$POSTGRES_SERVICE_ID")
          client_dir="$RUNNER_TEMP/query-perf-bin"
          mkdir -p "$client_dir"
          for program in psql pg_dump pg_restore; do
            printf '#!/usr/bin/env bash\nset -euo pipefail\nworkspace=%q\nimage=%q\n' "$GITHUB_WORKSPACE" "$image" > "$client_dir/$program"
            cat >> "$client_dir/$program" <<'CLIENT'
          program=${0##*/}
          exec docker run --rm --network host \
            --volume "$workspace:$workspace" --workdir "$PWD" \
            --env PGHOST --env PGPORT --env PGDATABASE --env PGUSER \
            --env PGPASSWORD --env PGSSLMODE --env PGCONNECT_TIMEOUT \
            --entrypoint "$program" "$image" "$@"
          CLIENT
            chmod +x "$client_dir/$program"
          done
          echo "$client_dir" >> "$GITHUB_PATH"

      - name: Compute snapshot keys
        id: snapshot-keys
        run: |
          set -euo pipefail
          for profile in small growth; do
            key=$(bun apps/api/scripts/query-perf-snapshot.ts key \
              --root "$PWD" --profile-id "$profile" --pg-major 18 \
              --seed-entry apps/api/src/tests/query-perf/seed.ts \
              --settings apps/api/src/tests/query-perf/planner-settings.json)
            echo "$profile=$key" >> "$GITHUB_OUTPUT"
          done

      - name: Start small snapshot download clock
        run: echo "QUERY_PERF_DOWNLOAD_SMALL_START=$(date +%s%3N)" >> "$GITHUB_ENV"

      - name: Restore small snapshot cache
        id: snapshot-small
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache/query-perf/small/fixture.dump
          key: ${{ steps.snapshot-keys.outputs.small }}

      - name: Finish small snapshot download clock
        run: echo "QUERY_PERF_DOWNLOAD_SMALL_MS=$(( $(date +%s%3N) - QUERY_PERF_DOWNLOAD_SMALL_START ))" >> "$GITHUB_ENV"

      - name: Start growth snapshot download clock
        run: echo "QUERY_PERF_DOWNLOAD_GROWTH_START=$(date +%s%3N)" >> "$GITHUB_ENV"

      - name: Restore growth snapshot cache
        id: snapshot-growth
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache/query-perf/growth/fixture.dump
          key: ${{ steps.snapshot-keys.outputs.growth }}

      - name: Finish growth snapshot download clock
        run: echo "QUERY_PERF_DOWNLOAD_GROWTH_MS=$(( $(date +%s%3N) - QUERY_PERF_DOWNLOAD_GROWTH_START ))" >> "$GITHUB_ENV"

      - name: Resolve query performance baseline
        if: ${{ !(github.event_name == 'workflow_dispatch' && contains(github.workflow_ref, '/.github/workflows/query-perf.yml@')) }}
        id: base
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || '' }}
          HEAVY_ONLY: ${{ inputs.heavy_only }}
          SHA: ${{ inputs.sha }}
        run: |
          set -euo pipefail
          if [[ "$HEAVY_ONLY" == true ]]; then
            tested_sha="$SHA"
            base_sha="$(git rev-parse "$tested_sha^")"
          else
            test -n "$BASE_SHA"
            git fetch --no-tags origin "$BASE_SHA"
            tested_sha="$GITHUB_SHA"
            base_sha="$(git merge-base "$BASE_SHA" "$tested_sha")"
          fi
          echo "QUERY_PERF_BASE_REF=$base_sha" >> "$GITHUB_ENV"
          echo "tested_sha=$tested_sha" >> "$GITHUB_OUTPUT"

      - name: Check query performance allowances
        if: ${{ !(github.event_name == 'workflow_dispatch' && contains(github.workflow_ref, '/.github/workflows/query-perf.yml@')) }}
        run: |
          if [[ -f apps/api/src/tests/query-perf/baseline.json ]]; then
            bun scripts/query-perf-baseline.ts "$QUERY_PERF_BASE_REF"
          fi

      - name: Apply database migrations
        run: bun --filter @stll/api db:migrate
        env:
          DATABASE_URL: postgres://stella_owner:stella@127.0.0.1:5432/stella

      - name: Run query performance suite
        id: measurements
        run: bun run test:perf
        working-directory: apps/api
        env:
          DATABASE_URL: postgres://stella_owner:stella@127.0.0.1:5432/stella
          QUERY_PERF_CACHE_SMALL_HIT: ${{ steps.snapshot-small.outputs.cache-hit }}
          QUERY_PERF_CACHE_GROWTH_HIT: ${{ steps.snapshot-growth.outputs.cache-hit }}
          QUERY_PERF_SNAPSHOT_DIRECTORY: ${{ github.workspace }}/.cache/query-perf
          QUERY_PERF_RECORD_BASELINE: ${{ github.event_name == 'workflow_dispatch' && contains(github.workflow_ref, '/.github/workflows/query-perf.yml@') && 'true' || 'false' }}

      - name: Validate recorded baseline
        id: validation
        if: ${{ !cancelled() && steps.measurements.outputs.baseline_recorded == 'true' }}
        run: bun scripts/query-perf-baseline.ts --validate

      - name: Upload recorded baseline
        if: ${{ !cancelled() && steps.validation.outcome == 'success' && steps.measurements.outputs.baseline_recorded == 'true' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: query-perf-baseline-record-${{ github.sha }}
          path: apps/api/src/tests/query-perf/baseline.json
          if-no-files-found: error
          retention-days: 7

      - name: Save small snapshot cache
        if: ${{ !cancelled() && steps.snapshot-small.outputs.cache-hit != 'true' && (steps.measurements.outcome == 'success' || (steps.measurements.outputs.baseline_recorded == 'true' && steps.validation.outcome == 'success')) && hashFiles('.cache/query-perf/small/fixture.dump') != '' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache/query-perf/small/fixture.dump
          key: ${{ steps.snapshot-keys.outputs.small }}

      - name: Save growth snapshot cache
        if: ${{ !cancelled() && steps.snapshot-growth.outputs.cache-hit != 'true' && (steps.measurements.outcome == 'success' || (steps.measurements.outputs.baseline_recorded == 'true' && steps.validation.outcome == 'success')) && hashFiles('.cache/query-perf/growth/fixture.dump') != '' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache/query-perf/growth/fixture.dump
          key: ${{ steps.snapshot-keys.outputs.growth }}
