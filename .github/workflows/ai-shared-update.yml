name: AI Shared Update

on:
  schedule:
    # Weekly, Monday 06:00 UTC: propose the current stella/ai-shared revision
    # and its regenerated instructions as a pull request.
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions: {}

jobs:
  update:
    name: Propose ai-shared update
    permissions:
      actions: write
      contents: write
      pull-requests: write
    uses: stella/.github/.github/workflows/ai-shared-update.yml@35506c43f400ed14b8554568d5d9988a49299f0c
    with:
      validation-workflow: ci.yml
    secrets:
      app_id: ${{ secrets.CHANGELOG_APP_ID }}
      app_private_key: ${{ secrets.CHANGELOG_APP_PRIVATE_KEY }}
