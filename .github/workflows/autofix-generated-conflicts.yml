name: Resolve generated-only conflicts

defaults:
  run:
    shell: bash

# When main moves, a same-repository pull request can start to conflict only
# in generated outputs, proven indentation-only source edits or independent
# bun.lock pins. This run only lists such pull requests and dispatches
# one resolve run per pull request on that pull request's own branch
# (generated-conflicts-resolve.yml), so branch code never runs in a
# default-branch context and no two pull requests share a run or an artifact
# namespace. Once a resolve run uploads a resolution, this run starts
# generated-conflicts-publish.yml on main for exactly that run, which pushes
# the validated result, and fails when a publish fails or does not finish in
# time. scripts/generated-conflicts.ts holds the rules.
#
# The publish run is started here instead of following the resolve run
# through `workflow_run`: GitHub creates no workflow_run event for a run
# that GITHUB_TOKEN started.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions: {}

jobs:
  dispatch:
    if: github.repository == 'stella/stella'
    runs-on: ubuntu-24.04
    # Listing takes about a minute; resolve runs are followed for at most 15
    # minutes and publish runs for 20.
    timeout-minutes: 45
    permissions:
      # Starting the per-branch resolve runs and the publish runs, and
      # reading their state and artifacts.
      actions: write
      contents: read
      pull-requests: read
    steps:
      # API calls only; nothing from a pull request runs here.
      - name: Dispatch one resolve run per conflicting pull request
        id: dispatch
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            const { owner, repo } = context.repo;
            const startedAt = Date.now();
            const HEAD_ACTIVE_MINUTES = 15;
            const headActivity = ({ number, committedDate, runStartedAt }) => {
              const committedAt = Date.parse(committedDate ?? '');
              if (!Number.isFinite(committedAt)) return { type: 'eligible' };
              const ageMinutes = Math.max(0, Math.floor((runStartedAt - committedAt) / 60_000));
              if (ageMinutes >= HEAD_ACTIVE_MINUTES) return { type: 'eligible' };
              return {
                type: 'deferred-active',
                line: `deferred #${number}: head-active (${ageMinutes} min < ${HEAD_ACTIVE_MINUTES})`,
              };
            };
            const { data: branch } = await github.rest.repos.getBranch({ owner, repo, branch: 'main' });
            const query = `query($owner: String!, $repo: String!, $cursor: String) {
              repository(owner: $owner, name: $repo) {
                pullRequests(states: OPEN, baseRefName: "main", first: 50, after: $cursor) {
                  pageInfo { hasNextPage endCursor }
                  nodes {
                    number mergeable isCrossRepository headRefName headRefOid updatedAt author { login }
                    commits(last: 1) { nodes { commit { committedDate } } }
                  }
                }
              }
            }`;
            const list = async () => {
              const nodes = [];
              let cursor = null;
              do {
                const page = await github.graphql(query, { owner, repo, cursor });
                const pulls = page.repository.pullRequests;
                nodes.push(...pulls.nodes);
                cursor = pulls.pageInfo.hasNextPage ? pulls.pageInfo.endCursor : null;
              } while (cursor);
              return nodes;
            };
            // Mergeability is computed lazily after main moves; the first
            // listing starts it, and a short wait lets it settle.
            let nodes = await list();
            for (let attempt = 0; attempt < 3 && nodes.some(pull => pull.mergeable === 'UNKNOWN'); attempt += 1) {
              await new Promise(resolve => setTimeout(resolve, 20_000));
              nodes = await list();
            }
            const candidates = nodes.filter(pull => pull.mergeable === 'CONFLICTING'
              && !pull.isCrossRepository
              && pull.author?.login !== 'dependabot[bot]'
              && /^[A-Za-z0-9._/-]+$/u.test(pull.headRefName)
              && !pull.headRefName.includes('..') && !pull.headRefName.startsWith('-')
              && pull.headRefName !== 'main'
              && /^[0-9a-f]{40}$/u.test(pull.headRefOid));
            const deferred = [];
            const eligible = candidates.filter(pull => {
              const activity = headActivity({
                number: pull.number,
                committedDate: pull.commits?.nodes?.[0]?.commit?.committedDate,
                runStartedAt: startedAt,
              });
              if (activity.type === 'eligible') return true;
              deferred.push(activity.line);
              core.info(activity.line);
              return false;
            });
            // A head that already had a resolve run usually conflicts in
            // source files, which a newer main does not clear. Heads not yet
            // planned go first, then the most recently updated, so a few stale
            // pull requests never take every slot from new generated-only
            // conflicts. Planned heads still get a slot when one is free.
            const { data: { workflow_runs: runs } } = await github.rest.actions.listWorkflowRuns({
              owner, repo, workflow_id: 'generated-conflicts-resolve.yml',
              event: 'workflow_dispatch', per_page: 100,
            });
            const planned = new Set(runs.map(run => run.head_sha));
            const updated = pull => Date.parse(pull.updatedAt) || 0;
            const pulls = eligible
              .sort((a, b) => Number(planned.has(a.headRefOid)) - Number(planned.has(b.headRefOid))
                || updated(b) - updated(a));
            // Only an accepted dispatch takes one of the 8 slots: a branch
            // that refuses the dispatch never starts a run, so it would stay
            // unplanned and sort first again on every push.
            // A dispatch names its run only when asked for run details, and even
            // then the answer may omit it. The run is then found by listing: this
            // workflow and branch, dispatched at or after the request, matching the
            // expected title, and not one already claimed. Undefined after the bounded
            // search; the caller decides what a missing run means.
            const dispatchRun = async ({ title, claimed, ...request }) => {
              const since = new Date(Date.now() - 5_000).toISOString();
              const { data } = await github.rest.actions.createWorkflowDispatch({
                owner, repo, ...request, return_run_details: true,
              });
              const named = data?.workflow_run_id;
              if (Number.isSafeInteger(named) && named > 0) return named;
              for (let attempt = 0; attempt < 6; attempt += 1) {
                await new Promise(resolve => setTimeout(resolve, 5_000));
                const { data: { workflow_runs: runs } } = await github.rest.actions.listWorkflowRuns({
                  owner, repo, workflow_id: request.workflow_id, branch: request.ref,
                  event: 'workflow_dispatch', created: `>=${since}`, per_page: 100,
                });
                const found = runs
                  .filter(run => Number.isSafeInteger(run.id) && run.id > 0 && !claimed.has(run.id)
                    && (title === undefined || run.display_title === title))
                  .sort((a, b) => a.id - b.id)[0];
                if (found !== undefined) return found.id;
              }
              return undefined;
            };
            const started = [];
            for (const pull of pulls) {
              if (started.length === 8) break;
              let id;
              try {
                // `ref` is the pull request's branch: the run, its caches and
                // its artifacts belong to that branch alone.
                id = await dispatchRun({
                  workflow_id: 'generated-conflicts-resolve.yml',
                  ref: pull.headRefName,
                  inputs: { head: pull.headRefOid, main: branch.commit.sha },
                  title: `Resolve generated-only conflicts on ${pull.headRefName}`,
                  claimed: new Set(started),
                });
              } catch (error) {
                // 422: a branch that predates the resolve workflow cannot run
                // it. Any other failure (auth, rate limit, server) affects every
                // branch alike, so the run fails instead of walking the list.
                if (error.status !== 422) throw error;
                core.notice(`#${pull.number}: not dispatched (422)`);
                continue;
              }
              // The next step follows exactly these runs. A run that cannot be
              // found is left unfollowed; the next push plans the branch again.
              if (id === undefined) {
                core.warning(`#${pull.number}: the dispatched resolve run was not found`);
                continue;
              }
              started.push(id);
            }
            const summary = [
              ...deferred,
              `resolved: ${started.length}; deferred-active: ${deferred.length}; other-skipped: ${nodes.length - started.length - deferred.length}`,
            ].join('\n');
            core.info(summary.split('\n').at(-1));
            await core.summary.addRaw(`${summary}\n`).write();
            core.setOutput('runs', JSON.stringify(started));

      # A resolve run that ends without a resolution (a plan left to people)
      # or fails on its branch has nothing to publish; its own run shows why.
      - name: Publish each resolution
        if: steps.dispatch.outputs.runs != '' && steps.dispatch.outputs.runs != '[]'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        env:
          RUNS: ${{ steps.dispatch.outputs.runs }}
        with:
          # One failed status read must not end a half-hour follow.
          retries: 2
          script: |
            const { owner, repo } = context.repo;
            const POLL_MS = 20_000;
            const ids = JSON.parse(process.env.RUNS);
            const settle = async (runs, polls) => {
              const done = new Map();
              for (let poll = 0; ; poll += 1) {
                for (const id of runs) {
                  if (done.has(id)) continue;
                  const { data: run } = await github.rest.actions.getWorkflowRun({ owner, repo, run_id: id });
                  if (run.status === 'completed') done.set(id, run);
                }
                if (done.size === runs.length || poll >= polls) return done;
                await new Promise(resolve => setTimeout(resolve, POLL_MS));
              }
            };
            // A dispatch names its run only when asked for run details, and even
            // then the answer may omit it. The run is then found by listing: this
            // workflow and branch, dispatched at or after the request, matching the
            // expected title, and not one already claimed. Undefined after the bounded
            // search; the caller decides what a missing run means.
            const dispatchRun = async ({ title, claimed, ...request }) => {
              const since = new Date(Date.now() - 5_000).toISOString();
              const { data } = await github.rest.actions.createWorkflowDispatch({
                owner, repo, ...request, return_run_details: true,
              });
              const named = data?.workflow_run_id;
              if (Number.isSafeInteger(named) && named > 0) return named;
              for (let attempt = 0; attempt < 6; attempt += 1) {
                await new Promise(resolve => setTimeout(resolve, 5_000));
                const { data: { workflow_runs: runs } } = await github.rest.actions.listWorkflowRuns({
                  owner, repo, workflow_id: request.workflow_id, branch: request.ref,
                  event: 'workflow_dispatch', created: `>=${since}`, per_page: 100,
                });
                const found = runs
                  .filter(run => Number.isSafeInteger(run.id) && run.id > 0 && !claimed.has(run.id)
                    && (title === undefined || run.display_title === title))
                  .sort((a, b) => a.id - b.id)[0];
                if (found !== undefined) return found.id;
              }
              return undefined;
            };
            const failures = [];
            const resolved = await settle(ids, 45);
            const publishes = [];
            for (const id of ids) {
              const run = resolved.get(id);
              if (run === undefined) {
                failures.push(`resolve run ${id} did not finish within 15 minutes`);
                continue;
              }
              if (run.conclusion !== 'success') {
                core.warning(`Resolve run ended ${run.conclusion}: ${run.html_url}`);
                continue;
              }
              const { data: { artifacts } } = await github.rest.actions.listWorkflowRunArtifacts({
                owner, repo, run_id: id, name: 'generated-conflicts',
              });
              if (artifacts.length === 0) continue;
              const publish = await dispatchRun({
                workflow_id: 'generated-conflicts-publish.yml',
                ref: 'main',
                inputs: { resolve_run_id: String(id) },
                title: `Publish generated-only conflict resolution of run ${id}`,
                claimed: new Set(publishes),
              });
              if (publish === undefined) {
                core.warning(`The publish run for resolve run ${id} was not found`);
                continue;
              }
              publishes.push(publish);
            }
            const published = await settle(publishes, 60);
            for (const id of publishes) {
              const run = published.get(id);
              if (run === undefined) {
                failures.push(`publish run ${id} did not finish within 20 minutes`);
              } else if (run.conclusion !== 'success') {
                failures.push(`publish run ended ${run.conclusion}: ${run.html_url}`);
              }
            }
            if (failures.length > 0) core.setFailed(failures.join('\n'));
