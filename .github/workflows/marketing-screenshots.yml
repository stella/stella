name: Marketing screenshots

defaults:
  run:
    shell: bash

# The comparison direction of the marketing screenshot baselines: PR CI and
# the nightly run compare the committed PNGs against a freshly seeded app.
# Regeneration (marketing-screenshots-capture.yml) runs the same capture body
# (`.github/actions/marketing-capture`), so "what CI compares" and "what CI
# regenerates" can never be produced by two drifting definitions.
#
# Both render on the same runner image from a production web build (the
# e2e shards' artifact on PRs, built in place otherwise), which is why the
# baselines can be treated as reproducible artifacts rather than a
# developer's local output.

on:
  workflow_call:
    inputs:
      mode:
        description: Must be check; regeneration runs in marketing-screenshots-capture.yml
        required: true
        type: string
      ref:
        description: Commit the main-heavy caller compares; empty uses the triggering ref
        required: false
        default: ""
        type: string
      web-build-artifact:
        description: Production web build artifact published earlier in the calling run; empty builds the web app in the capture job
        required: false
        default: ""
        type: string
    secrets:
      DOCKERHUB_USERNAME:
        description: Docker Hub username for authenticated infrastructure image pulls
        required: false
      DOCKERHUB_TOKEN:
        description: Docker Hub token for authenticated infrastructure image pulls
        required: false

permissions: {}

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      # Polling the calling run's artifacts for the handed-over web build.
      actions: read
      contents: read

    steps:
      # Unconditional job plus an explicit check, so a wrong mode fails
      # instead of skipping green.
      - name: Require check mode
        env:
          MODE: ${{ inputs.mode }}
        run: |
          if [[ "$MODE" != check ]]; then
            echo "::error::This workflow only compares baselines; regenerate with marketing-screenshots-update.yml"
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: true
          # Only the main-heavy caller forwards its already-validated SHA.
          # Other check callers always test their event's own ref.
          ref: ${{ github.workflow == 'Main heavy suites' && inputs.ref || '' }}

      - name: Capture marketing screenshots
        uses: ./.github/actions/marketing-capture
        with:
          mode: ${{ inputs.mode }}
          web-build-artifact: ${{ inputs.web-build-artifact }}
          dockerhub-username: ${{ secrets.DOCKERHUB_USERNAME }}
          dockerhub-token: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          # Mode and run keep the nightly, PR, and dispatched artifacts apart.
          name: marketing-screenshots-${{ inputs.mode }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            /tmp/api.log
            /tmp/web.log
            apps/web/test-results/
          if-no-files-found: ignore
          retention-days: 7
