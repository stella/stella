name: CodeQL

defaults:
  run:
    shell: bash

on:
  # Scans run nightly on main and on release pull requests. Other pull
  # requests and pushes to main are covered by those two scans.
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "**/*.[tT][sS]"
      - "**/*.[tT][sS][xX]"
      - "**/*.[mM][tT][sS]"
      - "**/*.[cC][tT][sS]"
      - "**/*.[jJ][sS]"
      - "**/*.[jJ][sS][xX]"
      - "**/*.[mM][jJ][sS]"
      - "**/*.[cC][jJ][sS]"
      - "**/*.[eE][sS]"
      - "**/*.[eE][sS]6"
      - "**/*.[xX][sS][jJ][sS]"
      - "**/*.[xX][sS][jJ][sS][lL][iI][bB]"
      - "**/*.[hH][tT][mM][lL]"
      - "**/*.[hH][tT][mM]"
      - "**/*.[xX][hH][tT][mM][lL]"
      - "**/*.[xX][hH][tT][mM]"
      - "**/*.[vV][uU][eE]"
      - "**/*.[eE][jJ][sS]"
      - "**/*.[hH][bB][sS]"
      - "**/*.[nN][jJ][kK]"
      - "**/*.[hH][tT][mM][lL].[eE][rR][bB]"
      - "**/*.[jJ][sS][pP]"
      - "**/*.[hH][tT][mM][lL].[dD][oO][tT]"
      - ".github/codeql/**"
      - ".github/workflows/codeql.yml"
      - "scripts/detect-security-workflow-changes.sh"
  # Nightly full scan on the default branch catches new vulnerability patterns
  schedule:
    - cron: "37 2 * * *"
  workflow_dispatch:

# A newer push to the same pull request supersedes its scan. Pushes to main,
# scheduled scans and manual runs each get a group of their own, so they
# always finish.
concurrency:
  group: ${{ github.workflow }}-${{ (github.event_name == 'pull_request') && format('pr-{0}', github.event.pull_request.number || github.ref) || format('run-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  scope:
    if: >-
      github.event_name != 'pull_request'
      || (github.event.pull_request.draft != true
          && (startsWith(github.event.pull_request.head.ref, 'chore/release-')
              || startsWith(github.event.pull_request.head.ref, 'changeset-release/')))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      required: ${{ steps.changes.outputs.required }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false

      - name: Detect relevant changes
        id: changes
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          required=true
          if detected=$(bash scripts/detect-security-workflow-changes.sh codeql); then
            if [[ "$detected" == "false" ]]; then required=false; fi
          else
            echo "::warning::Change detector failed; running checks"
          fi
          echo "required=$required" >> "$GITHUB_OUTPUT"
          if [[ "$required" == "false" ]]; then
            echo "skipped: no code change" >> "$GITHUB_STEP_SUMMARY"
          fi

  analyze:
    needs: scope
    if: >-
      always()
      && needs.scope.result != 'skipped'
      && (needs.scope.result != 'success' || needs.scope.outputs.required != 'false')
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [javascript]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          languages: ${{ matrix.language }}

      - name: Autobuild
        uses: github/codeql-action/autobuild@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2

      - name: Run CodeQL analysis
        uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          category: "/language:${{ matrix.language }}"
