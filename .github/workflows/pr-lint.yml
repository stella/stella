name: PR Lint

defaults:
  run:
    shell: bash

on:
  pull_request:
    # Run when a PR opens, when its title or body is edited, and when a
    # maintainer requests a rerun with "run-pr-lint". The checks read the
    # title and body only. Fork pull requests get a read-only token, so the
    # reusable workflow's labelling and assignment steps, which never gate,
    # apply to same-repository pull requests only.
    types: [opened, edited, labeled]

concurrency:
  # Keep manual reruns cancellable, but do not let unrelated label
  # events cancel an in-flight `run-pr-lint` execution.
  group: >-
    ${{ github.workflow }}-${{ github.event.pull_request.number }}-${{
      github.event.action == 'labeled' && github.event.label.name || 'opened'
    }}
  cancel-in-progress: true

permissions: {}

jobs:
  pr-body-log-lines:
    if: >-
      github.event.action == 'opened'
      || github.event.action == 'edited'
      || github.event.label.name == 'run-pr-lint'
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Reject tool log lines
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: node scripts/check-pr-body.ts

  pr-lint:
    if: >-
      github.actor != 'dependabot[bot]'
      && github.event.pull_request.user.login != 'dependabot[bot]'
      && (github.event.action == 'opened'
          || github.event.action == 'edited'
          || github.event.label.name == 'run-pr-lint')
    permissions:
      contents: read
      issues: read
      pull-requests: write
    # Reusable workflow only consumes the auto-provided GITHUB_TOKEN.
    # Do not switch to `secrets: inherit` — that widens the blast radius
    # if the reusable ever starts touching named secrets.
    uses: stella/.github/.github/workflows/pr-lint.yml@41fbea3b521bfc57b791003918de97f153d790a7
