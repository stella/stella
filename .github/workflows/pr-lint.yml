name: PR Lint

defaults:
  run:
    shell: bash

on:
  pull_request_target:
    # Run when a PR opens, when its title or body is edited, and when a
    # maintainer requests a rerun with "run-pr-lint". This metadata-only
    # workflow reads the title and body and never checks out or executes PR
    # code, so it is safe to run for forks without approval.
    types: [opened, edited, labeled]

concurrency:
  # Keep manual reruns cancellable, but do not let unrelated label
  # events cancel an in-flight `run-pr-lint` execution.
  group: >-
    ${{ github.workflow }}-${{ github.event.pull_request.number }}-${{
      github.event.action == 'labeled' && github.event.label.name || 'opened'
    }}
  cancel-in-progress: true

permissions:
  contents: read
  issues: read
  pull-requests: write

jobs:
  pr-body-log-lines:
    permissions: {}
    if: >-
      github.event.action == 'opened'
      || github.event.action == 'edited'
      || github.event.label.name == 'run-pr-lint'
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Checkout trusted workflow revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: 24

      - name: Reject tool log lines
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: node scripts/check-pr-body.ts

  pr-lint:
    if: >-
      github.event.pull_request.user.login != 'dependabot[bot]'
      && (github.event.action == 'opened'
          || github.event.action == 'edited'
          || github.event.label.name == 'run-pr-lint')
    # Reusable workflow only consumes the auto-provided GITHUB_TOKEN.
    # Do not switch to `secrets: inherit` — that widens the blast radius
    # if the reusable ever starts touching named secrets.
    uses: stella/.github/.github/workflows/pr-lint.yml@2ba6dc5822df5213c500aa6edb7b6c4bdec56804
