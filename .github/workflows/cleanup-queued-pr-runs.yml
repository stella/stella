name: Clean queued PR runs

defaults:
  run:
    shell: bash

# Pull request runs and merge groups share one hosted runner pool. Every few
# minutes this steward drops queued pull request work that can no longer
# matter (superseded heads, closed or draft pull requests) and, once the merge
# queue has no waiting work, re-runs the pull request runs that deferred to it.
on:
  schedule:
    - cron: "*/5 * * * *"

permissions:
  actions: write
  pull-requests: read
  statuses: write

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Cancel stale or superseded queued PR runs
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            const repo = context.repo;
            const prEvents = new Set(["pull_request", "pull_request_target"]);
            const cutoff = Date.now() - 6 * 60 * 60 * 1000;
            const isNotQueuedRefusal = error => error.status === 409
              && error.message.split(" - https://docs.github.com/rest/actions/workflow-runs#").at(0)
                === "Cannot cancel a workflow run that has not been queued yet.";

            const runs = await github.paginate(github.rest.actions.listWorkflowRunsForRepo, {
              ...repo, status: "queued", per_page: 100,
            });
            const reasonFor = async run => {
              if (run.status !== "queued" || !prEvents.has(run.event)) return null;
              if (Date.parse(run.created_at) < cutoff) return "queued over six hours";
              const associated = run.pull_requests?.length
                ? run.pull_requests
                : context.payload.pull_request ? [context.payload.pull_request] : [];
              if (associated.length === 0) return null;
              for (const pull of associated) {
                // Target runs use the base SHA as head_sha. Only their
                // associated PR snapshot identifies the head they evaluated.
                const recordedHead = pull.head?.sha
                  || (run.event === "pull_request" ? run.head_sha : null);
                if (!pull.number || !recordedHead) return null;
                let current;
                try {
                  ({ data: current } = await github.rest.pulls.get({
                    ...repo, pull_number: pull.number,
                  }));
                } catch (error) {
                  if (error.status !== 403 && error.status !== 404) throw error;
                  core.warning(`Superseded-head cleanup skipped for ${run.id}: PR metadata unavailable`);
                  return null;
                }
                if (current.state !== "open") return "pull request closed";
                if (current.draft) return "draft pull request";
                if (!current.head?.sha || current.head.sha === recordedHead) return null;
              }
              return "superseded head";
            };
            // Re-read both run status and associated PR heads immediately
            // before cancellation; an unresolved association fails closed.
            core.info(`Queued runs: ${runs.length}`);
            let failed = 0;
            for (const selectedRun of runs) {
              if (selectedRun.status !== "queued" || !prEvents.has(selectedRun.event)) continue;
              const args = { ...repo, run_id: selectedRun.id };
              const { data: current } = await github.rest.actions.getWorkflowRun(args);
              const reason = await reasonFor(current);
              if (!reason) {
                core.info(`Skipped ${current.id}: no longer an eligible queued PR run`);
                continue;
              }
              try {
                await github.rest.actions.cancelWorkflowRun(args);
                core.info(`Cancellation requested for ${current.id}: ${reason}`);
                continue;
              } catch (error) {
                if (!isNotQueuedRefusal(error)) {
                  failed += 1;
                  core.error(`Unable to cancel queued PR run ${current.id}: ${error.message}; manual inspection required`);
                  continue;
                }
                core.warning(`Cancel refused for ${current.id}: ${error.message}`);
              }
              // A run may start while cancellation is attempted. Never force-cancel that run.
              const { data: retry } = await github.rest.actions.getWorkflowRun(args);
              const retryReason = await reasonFor(retry);
              if (!retryReason) {
                core.info(`Skipped force-cancel for ${retry.id}: no longer an eligible queued PR run`);
                continue;
              }
              try {
                await github.request("POST /repos/{owner}/{repo}/actions/runs/{run_id}/force-cancel", args);
                core.info(`Force-cancellation requested for ${retry.id}: ${retryReason}`);
              } catch (error) {
                if (isNotQueuedRefusal(error)) {
                  core.info(`Run ${retry.id} (status: ${retry.status}) skipped: not cancellable (GitHub state)`);
                  continue;
                }
                failed += 1;
                core.error(`Unable to cancel queued PR run ${retry.id}: ${error.message}; manual inspection required`);
              }
            }
            if (failed > 0) core.setFailed(`${failed} queued PR run(s) could not be cancelled`);

      - name: Resume pull request runs that deferred to the merge queue
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            const repo = context.repo;
            const YIELD_CONTEXT = "ci/merge-queue-yield";
            // Resume a few at a time so deferred work cannot flood the pool again.
            const RESUMES_PER_TICK = 4;
            const waiting = async () => {
              for (const status of ["queued", "waiting", "pending", "requested"]) {
                const { data } = await github.rest.actions.listWorkflowRunsForRepo({
                  ...repo, event: "merge_group", status, per_page: 1,
                });
                if (data.total_count > 0) return true;
              }
              const { data } = await github.rest.actions.listWorkflowRunsForRepo({
                ...repo, event: "merge_group", status: "in_progress", per_page: 20,
              });
              for (const run of data.workflow_runs) {
                const jobs = await github.paginate(github.rest.actions.listJobsForWorkflowRun, {
                  ...repo, run_id: run.id, filter: "latest", per_page: 100,
                });
                if (jobs.some((job) => job.status === "queued" || job.status === "waiting")) return true;
              }
              return false;
            };
            if (await waiting()) {
              core.info("Merge queue still has waiting work; deferred pull request runs stay deferred.");
              return;
            }
            const since = new Date(Date.now() - 6 * 60 * 60 * 1000).toISOString();
            const { data } = await github.rest.actions.listWorkflowRuns({
              ...repo, workflow_id: "ci.yml", event: "pull_request", status: "cancelled",
              created: `>=${since}`, per_page: 100,
            });
            const seen = new Set();
            let resumed = 0;
            for (const run of data.workflow_runs) {
              if (resumed >= RESUMES_PER_TICK) break;
              if (seen.has(run.head_sha)) continue;
              seen.add(run.head_sha);
              const pull = run.pull_requests?.[0];
              if (!pull?.number) continue;
              const { data: current } = await github.rest.pulls.get({ ...repo, pull_number: pull.number });
              if (current.state !== "open" || current.draft || current.head.sha !== run.head_sha) continue;
              const { data: statuses } = await github.rest.repos.listCommitStatusesForRef({
                ...repo, ref: run.head_sha, per_page: 100,
              });
              const latest = statuses.find((status) => status.context === YIELD_CONTEXT);
              if (latest?.state !== "pending") continue;
              const { data: newer } = await github.rest.actions.listWorkflowRuns({
                ...repo, workflow_id: "ci.yml", head_sha: run.head_sha, per_page: 1,
              });
              if (newer.workflow_runs[0]?.id !== run.id) continue;
              await github.request("POST /repos/{owner}/{repo}/actions/runs/{run_id}/rerun", {
                ...repo, run_id: run.id,
              });
              await github.rest.repos.createCommitStatus({
                ...repo, sha: run.head_sha, state: "success", context: YIELD_CONTEXT,
                description: "Resumed after the merge queue cleared",
                target_url: `${context.serverUrl}/${repo.owner}/${repo.repo}/actions/runs/${run.id}`,
              });
              resumed += 1;
              core.info(`Resumed run ${run.id} for #${pull.number}`);
            }
            core.info(`Resumed ${resumed} deferred pull request run(s).`);
