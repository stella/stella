name: Clean queued PR runs

defaults:
  run:
    shell: bash

# Every few minutes this steward drops queued pull request work that can no
# longer matter (superseded heads, closed or draft pull requests), defers
# pull request runs whose remaining jobs are all still queued while the merge
# queue has waiting work, and, once the merge queue has no waiting work,
# re-runs the pull request runs that deferred to it.
on:
  schedule:
    - cron: "*/5 * * * *"

permissions:
  actions: write
  pull-requests: read
  statuses: write

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Cancel stale or superseded queued PR runs
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            const repo = context.repo;
            const prEvents = new Set(["pull_request", "pull_request_target"]);
            const cutoff = Date.now() - 6 * 60 * 60 * 1000;
            const isNotQueuedRefusal = error => error.status === 409
              && error.message.split(" - https://docs.github.com/rest/actions/workflow-runs#").at(0)
                === "Cannot cancel a workflow run that has not been queued yet.";

            const runs = await github.paginate(github.rest.actions.listWorkflowRunsForRepo, {
              ...repo, status: "queued", per_page: 100,
            });
            const reasonFor = async run => {
              if (run.status !== "queued" || !prEvents.has(run.event)) return null;
              if (Date.parse(run.created_at) < cutoff) return "queued over six hours";
              const associated = run.pull_requests?.length
                ? run.pull_requests
                : context.payload.pull_request ? [context.payload.pull_request] : [];
              if (associated.length === 0) return null;
              for (const pull of associated) {
                // Target runs use the base SHA as head_sha. Only their
                // associated PR snapshot identifies the head they evaluated.
                const recordedHead = pull.head?.sha
                  || (run.event === "pull_request" ? run.head_sha : null);
                if (!pull.number || !recordedHead) return null;
                let current;
                try {
                  ({ data: current } = await github.rest.pulls.get({
                    ...repo, pull_number: pull.number,
                  }));
                } catch (error) {
                  if (error.status !== 403 && error.status !== 404) throw error;
                  core.warning(`Superseded-head cleanup skipped for ${run.id}: PR metadata unavailable`);
                  return null;
                }
                if (current.state !== "open") return "pull request closed";
                if (current.draft) return "draft pull request";
                if (!current.head?.sha || current.head.sha === recordedHead) return null;
              }
              return "superseded head";
            };
            // Re-read both run status and associated PR heads immediately
            // before cancellation; an unresolved association fails closed.
            core.info(`Queued runs: ${runs.length}`);
            let failed = 0;
            for (const selectedRun of runs) {
              if (selectedRun.status !== "queued" || !prEvents.has(selectedRun.event)) continue;
              const args = { ...repo, run_id: selectedRun.id };
              const { data: current } = await github.rest.actions.getWorkflowRun(args);
              const reason = await reasonFor(current);
              if (!reason) {
                core.info(`Skipped ${current.id}: no longer an eligible queued PR run`);
                continue;
              }
              try {
                await github.rest.actions.cancelWorkflowRun(args);
                core.info(`Cancellation requested for ${current.id}: ${reason}`);
                continue;
              } catch (error) {
                if (!isNotQueuedRefusal(error)) {
                  failed += 1;
                  core.error(`Unable to cancel queued PR run ${current.id}: ${error.message}; manual inspection required`);
                  continue;
                }
                core.warning(`Cancel refused for ${current.id}: ${error.message}`);
              }
              // A run may start while cancellation is attempted. Never force-cancel that run.
              const { data: retry } = await github.rest.actions.getWorkflowRun(args);
              const retryReason = await reasonFor(retry);
              if (!retryReason) {
                core.info(`Skipped force-cancel for ${retry.id}: no longer an eligible queued PR run`);
                continue;
              }
              try {
                await github.request("POST /repos/{owner}/{repo}/actions/runs/{run_id}/force-cancel", args);
                core.info(`Force-cancellation requested for ${retry.id}: ${retryReason}`);
              } catch (error) {
                if (isNotQueuedRefusal(error)) {
                  core.info(`Run ${retry.id} (status: ${retry.status}) skipped: not cancellable (GitHub state)`);
                  continue;
                }
                failed += 1;
                core.error(`Unable to cancel queued PR run ${retry.id}: ${error.message}; manual inspection required`);
              }
            }
            if (failed > 0) core.setFailed(`${failed} queued PR run(s) could not be cancelled`);

      - name: Resume pull request runs that deferred to the merge queue
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            const repo = context.repo;
            const YIELD_CONTEXT = "ci/merge-queue-yield";
            // Resume a few at a time so deferred work cannot flood the pool again.
            const RESUMES_PER_TICK = 4;
            const waiting = async () => {
              for (const status of ["queued", "waiting", "pending", "requested"]) {
                const { data } = await github.rest.actions.listWorkflowRunsForRepo({
                  ...repo, event: "merge_group", status, per_page: 1,
                });
                if (data.total_count > 0) return true;
              }
              const { data } = await github.rest.actions.listWorkflowRunsForRepo({
                ...repo, event: "merge_group", status: "in_progress", per_page: 20,
              });
              for (const run of data.workflow_runs) {
                const jobs = await github.paginate(github.rest.actions.listJobsForWorkflowRun, {
                  ...repo, run_id: run.id, filter: "latest", per_page: 100,
                });
                if (jobs.some((job) => job.status === "queued" || job.status === "waiting")) return true;
              }
              return false;
            };
            // A busy queue may never drain, so a deferral is bounded: heads deferred
            // this long resume anyway, and at least one head resumes every tick.
            const MAX_DEFER_MS = 30 * 60 * 1000;
            const busy = await waiting();
            // Open pull requests whose head carries a pending yield status are the
            // durable record of deferred work, however long the queue stayed busy.
            const deferredPulls = [];
            let after = null;
            do {
              const page = await github.graphql(
                `query($owner: String!, $repo: String!, $after: String) {
                  repository(owner: $owner, name: $repo) {
                    pullRequests(states: OPEN, first: 100, after: $after) {
                      pageInfo { hasNextPage endCursor }
                      nodes {
                        number
                        isDraft
                        headRefOid
                        headRepository { nameWithOwner }
                        commits(last: 1) {
                          nodes { commit { status { context(name: "ci/merge-queue-yield") { state createdAt } } } }
                        }
                      }
                    }
                  }
                }`,
                { owner: repo.owner, repo: repo.repo, after },
              );
              const pulls = page.repository.pullRequests;
              for (const pull of pulls.nodes) {
                const yieldStatus = pull.commits.nodes[0]?.commit.status?.context;
                if (yieldStatus?.state === "PENDING" && !pull.isDraft
                    && pull.headRepository?.nameWithOwner === `${repo.owner}/${repo.repo}`) {
                  deferredPulls.push({ ...pull, deferredAt: Date.parse(yieldStatus.createdAt) });
                }
              }
              after = pulls.pageInfo.hasNextPage ? pulls.pageInfo.endCursor : null;
            } while (after);
            deferredPulls.sort((left, right) => left.deferredAt - right.deferredAt);
            const overdue = deferredPulls.filter((pull) => Date.now() - pull.deferredAt >= MAX_DEFER_MS);
            const candidates = busy && overdue.length > 0 ? overdue : deferredPulls;
            const budget = busy && overdue.length === 0 ? 1 : RESUMES_PER_TICK;
            if (busy) {
              core.info(`Merge queue still has waiting work; resuming at most ${budget} deferred run(s), oldest first.`);
            }
            let resumed = 0;
            for (const pull of candidates) {
              if (resumed >= budget) break;
              const { data } = await github.rest.actions.listWorkflowRuns({
                ...repo, workflow_id: "ci.yml", head_sha: pull.headRefOid, per_page: 1,
              });
              const run = data.workflow_runs[0];
              // Only the head's latest run, and only once its cancellation settled.
              if (!run || run.status !== "completed" || run.conclusion !== "cancelled") continue;
              const target_url = `${context.serverUrl}/${repo.owner}/${repo.repo}/actions/runs/${run.id}`;
              // Mark the head resumed before dispatching: if the re-run defers
              // again, its newer pending status lands after this one.
              await github.rest.repos.createCommitStatus({
                ...repo, sha: pull.headRefOid, state: "success", context: YIELD_CONTEXT,
                description: "Resumed after the merge queue cleared", target_url,
              });
              try {
                // Re-run only the cancelled jobs: a run deferred after planning
                // keeps the jobs that already finished.
                await github.request("POST /repos/{owner}/{repo}/actions/runs/{run_id}/rerun-failed-jobs", {
                  ...repo, run_id: run.id,
                });
              } catch (error) {
                await github.rest.repos.createCommitStatus({
                  ...repo, sha: pull.headRefOid, state: "pending", context: YIELD_CONTEXT,
                  description: "Deferred while the merge queue runs; resumes automatically", target_url,
                });
                throw error;
              }
              resumed += 1;
              core.info(`Resumed run ${run.id} for #${pull.number}`);
            }
            core.info(`Resumed ${resumed} deferred pull request run(s).`);

      - name: Defer queued pull request work while the merge queue waits
        if: ${{ !cancelled() }}
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            const repo = context.repo;
            const YIELD_CONTEXT = "ci/merge-queue-yield";
            const waiting = async () => {
              for (const status of ["queued", "waiting", "pending", "requested"]) {
                const { data } = await github.rest.actions.listWorkflowRunsForRepo({
                  ...repo, event: "merge_group", status, per_page: 1,
                });
                if (data.total_count > 0) return true;
              }
              const { data } = await github.rest.actions.listWorkflowRunsForRepo({
                ...repo, event: "merge_group", status: "in_progress", per_page: 20,
              });
              for (const run of data.workflow_runs) {
                const jobs = await github.paginate(github.rest.actions.listJobsForWorkflowRun, {
                  ...repo, run_id: run.id, filter: "latest", per_page: 100,
                });
                if (jobs.some((job) => job.status === "queued" || job.status === "waiting")) return true;
              }
              return false;
            };
            if (!(await waiting())) {
              core.info("Merge queue has no waiting work; nothing to defer.");
              return;
            }
            // Runners are handed out roughly in job creation order, so queued
            // pull request jobs sit ahead of every later merge-group stage. A run
            // with nothing in progress loses no work when it is cancelled; the
            // resume step re-runs its cancelled jobs once the queue clears.
            const runs = await github.paginate(github.rest.actions.listWorkflowRuns, {
              ...repo, workflow_id: "ci.yml", event: "pull_request", status: "in_progress", per_page: 100,
            });
            let deferred = 0;
            for (const run of runs) {
              // A resumed run never defers again, matching the yield step.
              if (run.run_attempt > 1) continue;
              if (run.head_repository?.full_name !== `${repo.owner}/${repo.repo}`) continue;
              if (run.triggering_actor?.login === "dependabot[bot]") continue;
              const jobs = await github.paginate(github.rest.actions.listJobsForWorkflowRun, {
                ...repo, run_id: run.id, filter: "latest", per_page: 100,
              });
              const queued = jobs.some((job) => job.status === "queued" || job.status === "waiting");
              const running = jobs.some((job) => job.status === "in_progress");
              if (!queued || running) continue;
              const target_url = `${context.serverUrl}/${repo.owner}/${repo.repo}/actions/runs/${run.id}`;
              await github.rest.repos.createCommitStatus({
                ...repo, sha: run.head_sha, state: "pending", context: YIELD_CONTEXT,
                description: "Deferred while the merge queue runs; resumes automatically", target_url,
              });
              try {
                await github.rest.actions.cancelWorkflowRun({ ...repo, run_id: run.id });
              } catch (error) {
                // The run was not deferred: clear the record so nothing resumes it.
                await github.rest.repos.createCommitStatus({
                  ...repo, sha: run.head_sha, state: "success", context: YIELD_CONTEXT,
                  description: "Not deferred", target_url,
                });
                core.warning(`Unable to defer run ${run.id}: ${error.message}`);
                continue;
              }
              deferred += 1;
              core.info(`Deferred run ${run.id} (${run.head_sha})`);
            }
            core.info(`Deferred ${deferred} pull request run(s) with only queued jobs left.`);
