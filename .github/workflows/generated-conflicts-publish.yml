name: Publish generated-only conflict resolutions
run-name: "Publish generated-only conflict resolution of run ${{ inputs.resolve_run_id }}"

defaults:
  run:
    shell: bash

# Runs on main for one successful resolve run
# (generated-conflicts-resolve.yml), named by its run id;
# autofix-generated-conflicts.yml starts it for each resolve run it started
# that uploaded a resolution. Nothing from the branch executes here, and no
# branch file is checked out: the branch and main are fetched as git objects
# into a bare repository, the merge is rebuilt there by main's rules, and the
# resolve run's artifact is read as data. Only then is the push token minted.
# The branch moves with a compare-and-swap on the head the resolution was
# built on.

on:
  workflow_dispatch:
    inputs:
      resolve_run_id:
        description: The id of the successful resolve run whose resolution to publish
        required: true
        type: string

concurrency:
  # Serialize the capacity check with publication, including manual dispatches.
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions: {}

jobs:
  publish:
    # Main's copy of this job, never a branch's.
    if: >-
      github.repository == 'stella/stella'
      && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      # Reading the resolve run's artifact and fetching the branch.
      actions: read
      contents: read
      checks: read
      pull-requests: read
    # The push key lives in this environment (main and v* tags only).
    environment: release-app
    steps:
      # API calls only. The pull request is found from the run's own branch,
      # so a run can only ever publish to the branch it ran on.
      - name: Select the pull request
        id: select
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        env:
          RESOLVE_RUN_ID: ${{ inputs.resolve_run_id }}
        with:
          script: |
            const { owner, repo } = context.repo;
            const runId = process.env.RESOLVE_RUN_ID ?? '';
            if (!/^[1-9][0-9]{0,14}$/u.test(runId)) return;
            const { data: run } = await github.rest.actions.getWorkflowRun({
              owner, repo, run_id: Number(runId),
            });
            if (run.status !== 'completed' || run.conclusion !== 'success') return;
            // The path and event filter out unrelated runs; they are not a
            // trust boundary. A branch controls its own copy of the resolve
            // workflow, so its artifact is untrusted data either way, and
            // only the branch-to-pull-request lookup and the rebuild in
            // `apply` decide what is pushed.
            if (run.path !== '.github/workflows/generated-conflicts-resolve.yml'
              || run.event !== 'workflow_dispatch'
              || run.head_repository?.full_name !== `${owner}/${repo}`
              || !/^[A-Za-z0-9._/-]+$/u.test(run.head_branch ?? '')
              || run.head_branch.includes('..') || run.head_branch.startsWith('-')
              || run.head_branch === 'main'
              || !/^[0-9a-f]{40}$/u.test(run.head_sha ?? '')) return;
            const pulls = await github.paginate(github.rest.pulls.list, {
              owner, repo, state: 'open', head: `${owner}:${run.head_branch}`, per_page: 100,
            });
            const candidates = pulls.filter(pull => pull.head.ref === run.head_branch
              && pull.head.repo?.full_name === `${owner}/${repo}`
              && pull.base.ref === 'main');
            if (candidates.length !== 1) return;
            const [pull] = candidates;
            // The branch must still be where the resolve run started.
            if (pull.head.sha !== run.head_sha) return;
            // A plan left to people uploads nothing; there is nothing to publish.
            const { data: { artifacts } } = await github.rest.actions.listWorkflowRunArtifacts({
              owner, repo, run_id: run.id, name: 'generated-conflicts',
            });
            if (artifacts.length !== 1 || artifacts[0].expired) return;
            const query = `query($owner: String!, $repo: String!, $cursor: String) {
              repository(owner: $owner, name: $repo) {
                pullRequests(states: OPEN, baseRefName: "main", first: 50, after: $cursor) {
                  pageInfo { hasNextPage endCursor }
                  nodes { commits(last: 1) { nodes { commit { messageHeadline statusCheckRollup { state } checkSuites(first: 100) { pageInfo { hasNextPage } nodes { status } } } } } }
                }
              }
            }`;
            let active = 0;
            let cursor = null;
            do {
              const page = await github.graphql(query, { owner, repo, cursor });
              const pulls = page.repository.pullRequests;
              active += pulls.nodes.filter(pull => {
                const commit = pull.commits?.nodes?.[0]?.commit;
                return commit?.messageHeadline === 'chore: merge main and regenerate conflicted generated files'
                  && (commit?.checkSuites?.pageInfo?.hasNextPage
                    || !commit?.checkSuites?.nodes?.length
                    || commit.checkSuites.nodes.some(suite => suite.status !== 'COMPLETED'));
              }).length;
              cursor = pulls.pageInfo.hasNextPage ? pulls.pageInfo.endCursor : null;
            } while (cursor);
            if (active >= 3) {
              await core.summary.addRaw(`resolution: deferred-ci-capacity (${active} active)\n`).write();
              return;
            }
            core.setOutput('branch', run.head_branch);
            core.setOutput('head', run.head_sha);
            core.setOutput('run', String(run.id));

      - name: Checkout main's conflict rules
        if: steps.select.outputs.branch != ''
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          path: .trusted
          persist-credentials: false
          sparse-checkout: |
            /scripts/
            /packages/scripts/src/generated-files.ts
            /package.json
          sparse-checkout-cone-mode: false

      # No cache in a job that holds the push key.
      - name: Setup Bun
        if: steps.select.outputs.branch != ''
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: .trusted/package.json
          no-cache: true

      # Objects only: a bare repository has no work tree a branch file could
      # be written to or followed through.
      - name: Fetch the branch and main as objects
        if: steps.select.outputs.branch != ''
        id: fetch
        timeout-minutes: 5
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ steps.select.outputs.head }}
          SERVER_URL: ${{ github.server_url }}
        run: |
          set -euo pipefail
          git init -q --bare "$RUNNER_TEMP/repo.git"
          auth=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 | tr -d '\n')
          echo "::add-mask::$auth"
          bash "$GITHUB_WORKSPACE/.trusted/scripts/retry.sh" git -C "$RUNNER_TEMP/repo.git" -c "http.extraheader=AUTHORIZATION: basic $auth" \
            fetch --no-tags -q "$SERVER_URL/$GITHUB_REPOSITORY.git" \
            "+$HEAD_SHA:refs/resolve/head" "+refs/heads/main:refs/resolve/main"
          echo "main=$(git -C "$RUNNER_TEMP/repo.git" rev-parse refs/resolve/main)" >> "$GITHUB_OUTPUT"

      # Exactly this run's artifact, under the one fixed name a resolve run
      # uploads; no other run's artifacts are visible here.
      - name: Download the resolution
        if: steps.select.outputs.branch != ''
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: generated-conflicts
          run-id: ${{ steps.select.outputs.run }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/resolution

      # Main's rules from main's checkout (its bunfig, no env files, no
      # install). Output goes to a fresh directory only.
      - name: Rebuild and verify the merge
        if: steps.select.outputs.branch != ''
        working-directory: .trusted
        env:
          HEAD_SHA: ${{ steps.select.outputs.head }}
          MAIN_TIP: ${{ steps.fetch.outputs.main }}
        run: |
          bun --no-install --no-env-file scripts/generated-conflicts.ts apply \
            --git-dir "$RUNNER_TEMP/repo.git" --head "$HEAD_SHA" --main-tip "$MAIN_TIP" \
            --collected "$RUNNER_TEMP/resolution" --out "$RUNNER_TEMP/requests"

      - name: Mint App token
        if: steps.select.outputs.branch != ''
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.STELLA_RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.STELLA_RELEASE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write

      # Created through the API without an author, so GitHub signs the merge
      # commit as the App; updateRefs applies only while the branch still
      # points at the resolved head.
      - name: Push the merge commit
        if: steps.select.outputs.branch != ''
        working-directory: .trusted
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          BRANCH: ${{ steps.select.outputs.branch }}
        run: |
          bun --no-install --no-env-file scripts/generated-conflicts.ts push \
            --requests "$RUNNER_TEMP/requests" --repository "$GITHUB_REPOSITORY" --branch "$BRANCH"
