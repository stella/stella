name: Release Desktop App

# release-chain-alert
defaults:
  run:
    shell: bash

# Build, sign, and publish the Tauri desktop app for each release tag.
# Runs after release.yml succeeds so the GitHub Release object already
# exists; this workflow only adds desktop installers + the updater
# manifest to it. Skipped automatically (for STABLE tags as well as
# prereleases) when nothing the desktop actually ships changed since
# the previous same-channel release, so backend-only releases don't
# churn a ~30 MB redownload + restart. See
# scripts/detect-desktop-release-changes.sh for the exact decision.
# On a skipped STABLE release, the carry-forward job below copies the
# previous stable's installers + latest.json onto the new release and
# flips `--latest` only after production is re-verified, so the web app's
# /releases/latest/download deep links never 404 and in-app updaters see no
# spurious update.
#
# Builds Windows + macOS in parallel. Windows uses Azure Trusted
# Signing; macOS uses a Developer ID Application cert + App Store
# Connect API key for notarization.

on:
  workflow_run: # zizmor: ignore[dangerous-triggers] release tag is revalidated before signing jobs receive secrets
    workflows: ["Release Artifacts"]
    types: [completed]
  workflow_dispatch:
    inputs:
      release_ref:
        description: "Existing release tag, e.g. v0.0.1"
        required: true
        type: string

# Default-deny at the workflow level; each job uplifts only what it
# needs. Pattern from lapce/lapce/.github/workflows/release.yml.
permissions: {}

concurrency:
  group: release-desktop-${{ github.event.workflow_run.head_branch || inputs.release_ref }}
  cancel-in-progress: false

jobs:
  resolve:
    # Only a successful Release Artifacts run may trigger the desktop
    # publication path. Release Artifacts publishes the GitHub Release only
    # after production promotion is verified, so a failed run leaves a draft;
    # accepting `failure` here would attach installers to that draft and
    # reach the CDN publication steps below. Manual dispatch remains
    # available for recovery, but its stable path is gated by the post-build
    # production verification job.
    #
    # Skip `cancelled` (a newer release.yml run replaced it; that newer run
    # will trigger us instead) and `skipped` (release.yml never actually ran,
    # so there's nothing for us to release).
    #
    # A workflow_run trigger is accepted only from this repository's own
    # release workflow, started by a tag push or a manual dispatch. Signing
    # builds restore no caches.
    if: >-
      github.event_name == 'workflow_dispatch'
      || (github.event.workflow_run.conclusion == 'success'
      && startsWith(github.event.workflow_run.head_branch, 'v')
      && github.event.workflow_run.head_repository.full_name == github.repository
      && github.event.workflow_run.path == '.github/workflows/release.yml'
      && contains(fromJSON('["push", "workflow_dispatch"]'), github.event.workflow_run.event))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read # read upstream workflow_run artifacts
      contents: read # checkout
    outputs:
      release_ref: ${{ steps.ref.outputs.value }}
      release_sha: ${{ steps.ref.outputs.sha }}
      app_version: ${{ steps.ref.outputs.version }}
      should_build: ${{ steps.diff.outputs.should_build }}
      # Previous same-channel release the skip decision compared
      # against (empty when none). Consumed by carry-forward to copy
      # that release's desktop assets onto a skipped stable release.
      previous_tag: ${{ steps.diff.outputs.previous_tag }}
      # Channel directory name (`prod`, `rc`, `beta`, `alpha`)
      # derived from the tag suffix by scripts/release-channel.sh.
      # Used to route the updater manifest to a channel-specific
      # S3 path and to pin the in-binary updater endpoint, so an rc
      # build never polls or overwrites the production manifest.
      channel: ${{ steps.ref.outputs.channel }}
    steps:
      - name: Checkout GitHub API tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.repository }}
          ref: ${{ github.workflow_sha }}
          path: .gh-retry
          persist-credentials: false
          sparse-checkout: scripts/gh-retry.sh
          sparse-checkout-cone-mode: false

      - name: Preserve GitHub API tooling across source checkouts
        run: bun scripts/desktop-release-step.ts preserve-tooling

      # Lightweight first-pass checkout of the workflow's own ref
      # (not the release tag yet — that resolves below) so the
      # Resolve step can shell out to scripts/release-channel.sh.
      # The pinned-SHA checkout further down then re-checks out
      # the release commit for everything else.
      - name: Checkout workflow scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          sparse-checkout: scripts
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Resolve release ref
        id: ref
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          RELEASE_INPUT: ${{ inputs.release_ref }}
          UPSTREAM_EVENT: ${{ github.event.workflow_run.event }}
          UPSTREAM_RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          if [[ -n "$RELEASE_INPUT" ]]; then
            REF="$RELEASE_INPUT"
          elif [[ "$HEAD_BRANCH" == v* ]]; then
            REF="$HEAD_BRANCH"
          elif [[ "$UPSTREAM_EVENT" == "workflow_dispatch" ]]; then
            manifest_artifact=$(
              bash "$GH_RETRY_SCRIPT" api "repos/${GITHUB_REPOSITORY}/actions/runs/$UPSTREAM_RUN_ID/artifacts" \
                --jq '.artifacts[].name | select(startswith("release-manifest-v"))' \
                | head -n 1
            )
            REF="${manifest_artifact#release-manifest-}"
          else
            REF="$HEAD_BRANCH"
          fi

          # Pattern must stay aligned with scripts/release-channel.sh
          # and .github/workflows/release.yml — all three gate on the
          # same shape so a tag accepted by one is accepted by all.
          # The prerelease channel is whitelisted to rc|beta|alpha:
          # a free `[a-z]+` would let `v1.2.3-prod.1` overwrite the
          # stable manifest in S3.
          if [[ ! "$REF" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-(rc|beta|alpha)\.[0-9]+)?$ ]]; then
            echo "::error::Expected a release tag like v1.2.3, v1.2.3-rc.1, v1.2.3-beta.1, or v1.2.3-alpha.1; got '$REF'"
            exit 1
          fi

          # Refuse to proceed if a branch with the same name as the
          # tag exists. Bare-ref checkouts would otherwise be
          # ambiguous, and this workflow holds Tauri/Apple/Azure
          # signing secrets — checking out attacker-controlled
          # branch code under a release-tag name would mint
          # officially-signed installers.
          if bash "$GH_RETRY_SCRIPT" api "repos/${GITHUB_REPOSITORY}/branches/${REF}" --silent; then
            echo "::error::A branch named '$REF' exists alongside the tag; refusing to build to avoid ref ambiguity"
            exit 1
          fi

          # Resolve the tag to a concrete commit SHA. Every
          # downstream checkout is pinned to this SHA so the build
          # cannot be swapped out by a same-named branch later in
          # the workflow.
          tag_ref_json=$(bash "$GH_RETRY_SCRIPT" api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${REF}") || {
            echo "::error::Tag $REF does not exist in ${GITHUB_REPOSITORY}"
            exit 1
          }
          tag_object_type=$(echo "$tag_ref_json" | jq -r '.object.type')
          tag_object_sha=$(echo "$tag_ref_json" | jq -r '.object.sha')
          if [[ "$tag_object_type" == "tag" ]]; then
            # Annotated tag — dereference to the underlying commit.
            RELEASE_SHA=$(bash "$GH_RETRY_SCRIPT" api "repos/${GITHUB_REPOSITORY}/git/tags/${tag_object_sha}" --jq '.object.sha')
          else
            RELEASE_SHA="$tag_object_sha"
          fi
          if [[ ! "$RELEASE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Could not resolve tag $REF to a commit SHA (got '$RELEASE_SHA')"
            exit 1
          fi

          git fetch --no-tags origin "refs/tags/${REF}:refs/tags/${REF}" main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor "$RELEASE_SHA" origin/main; then
            echo "::error::Release tag $REF is not reachable from protected main"
            exit 1
          fi

          if ! bash "$GH_RETRY_SCRIPT" release view "$REF" >/dev/null; then
            echo "::error::GitHub Release $REF does not exist; refusing to run signing jobs"
            exit 1
          fi

          # Resolve the channel via the shared script so the
          # in-binary updater endpoint, the manifest mirror path,
          # and the CloudFront invalidation key all derive from
          # exactly the same logic. See scripts/release-channel.sh.
          CHANNEL=$(bash scripts/release-channel.sh "$REF")

          {
            echo "value=$REF"
            echo "sha=$RELEASE_SHA"
            echo "version=${REF#v}"
            echo "channel=$CHANNEL"
          } >> "$GITHUB_OUTPUT"

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Pin to the resolved commit SHA to eliminate tag/branch
          # ref ambiguity. The tag name is preserved in
          # `steps.ref.outputs.value` for filenames/release lookups.
          ref: ${{ steps.ref.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Decide whether desktop changed since previous tag
        id: diff
        env:
          CURRENT_TAG: ${{ steps.ref.outputs.value }}
          EVENT_NAME: ${{ github.event_name }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Manual dispatch is the rebuild escape hatch (e.g. re-running
          # a release whose signing job failed), so it never skips.
          # Mirrors ci.yml's dispatch-forces-checks behaviour.
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            echo "Manual dispatch; forcing a desktop build."
            {
              echo "should_build=true"
              echo "previous_tag="
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # All the skip logic (channel-exact comparison, manifest
          # marker, rebuild-trigger paths, and why apps/web + VERSION
          # are excluded) lives in the script so the workflow and its
          # test share one implementation.
          bash scripts/detect-desktop-release-changes.sh "$CURRENT_TAG" >> "$GITHUB_OUTPUT"

  build:
    needs: resolve
    if: ${{ needs.resolve.outputs.should_build == 'true' }}
    name: Build ${{ matrix.os }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    permissions:
      # contents:write is for the per-platform `gh release upload`
      # step that pushes the signed installers + .sig files to the
      # GitHub Release.
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows
            runner: windows-latest
            target: x86_64-pc-windows-msvc
            rust_targets: x86_64-pc-windows-msvc
          - os: macos
            runner: macos-14
            # Tauri builds a universal binary by lipoing the two
            # native-arch outputs together; rustup needs the two real
            # archs as targets, not the synthetic "universal" name.
            target: universal-apple-darwin
            rust_targets: aarch64-apple-darwin,x86_64-apple-darwin

    steps:
      - name: Checkout GitHub API tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.repository }}
          ref: ${{ github.workflow_sha }}
          path: .gh-retry
          persist-credentials: false
          sparse-checkout: scripts/gh-retry.sh
          sparse-checkout-cone-mode: false

      - name: Preserve GitHub API tooling across source checkouts
        run: bun scripts/desktop-release-step.ts preserve-tooling

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Pinned to the SHA resolved by the resolve job; never to
          # the bare tag name. See resolve job for rationale.
          ref: ${{ needs.resolve.outputs.release_sha }}
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: "package.json"
          no-cache: true

      - name: Install dependencies
        run: bun ci --ignore-scripts
        env:
          # Signing-key secrets are loaded into later steps in this job.
          # Keep NPM_TOKEN out of the install-time environment so a
          # compromised transitive dep's lifecycle script cannot
          # exfiltrate it alongside the signing material.
          # Public npm reads work without auth; the token is only used
          # when publishing.
          NPM_TOKEN: ""

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable
          targets: ${{ matrix.rust_targets }}

      # The updater endpoint is baked into the binary per channel so prerelease
      # installations never poll or overwrite the production update feed.
      - name: Stamp desktop release metadata
        env:
          VERSION: ${{ needs.resolve.outputs.app_version }}
          CHANNEL: ${{ needs.resolve.outputs.channel }}
        run: bun scripts/desktop-release-step.ts stamp

      # ─── Windows: Azure Trusted Signing ────────────────────
      # trusted-signing-cli is invoked by Tauri's bundler via
      # bundle.windows.signCommand for every artifact (inner exe,
      # installer, updater archive contents) so the .nsis.zip /
      # .msi.zip the updater downloads wrap signed binaries. The
      # post-build Azure step below stays as a safety net for any
      # loose artifact the bundler doesn't run signCommand against.
      # baptiste0928/cargo-install caches ~/.cargo/bin/<binary>
      # keyed on tool + version + runner image, so subsequent runs
      # short-circuit the ~5 min source compile.
      - name: Build and sign Windows artifacts
        if: matrix.os == 'windows'
        uses: ./.github/actions/desktop-windows-build
        with:
          dry-run: "false"
          target: ${{ matrix.target }}
          release-sha: ${{ needs.resolve.outputs.release_sha }}
          azure-endpoint: ${{ secrets.AZURE_ENDPOINT }}
          azure-account: ${{ secrets.AZURE_CODE_SIGNING_ACCOUNT }}
          azure-profile: ${{ secrets.AZURE_CERT_PROFILE }}
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          VITE_POSTHOG_KEY: ${{ secrets.VITE_POSTHOG_KEY }}

      # ─── macOS: Developer ID + App Store Connect notarization ─
      - name: Import Apple Developer ID certificate into temporary keychain
        if: matrix.os == 'macos'
        uses: apple-actions/import-codesign-certs@5142e029c445c10ffc7149d172e540235a065466 # v7.0.0
        with:
          p12-file-base64: ${{ secrets.APPLE_CERTIFICATE }}
          p12-password: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}

      - name: Build, sign, and notarize (macOS)
        if: matrix.os == 'macos'
        working-directory: apps/desktop
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          # Tauri's bundler uses notarytool with API-key auth when
          # APPLE_API_ISSUER + APPLE_API_KEY + APPLE_API_KEY_PATH are
          # all set. The key file must be on disk; decode the base64
          # secret into runner.temp so it's auto-cleaned up.
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_KEY_PATH: ${{ runner.temp }}/apple-api.p8
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPLE_API_KEY_BASE64: ${{ secrets.APPLE_API_KEY }}
          # SPA origins the shipped distribution build trusts at runtime.
          # Read at compile time by config.rs via option_env!(); builds
          # without this variable default to loopback-only.
          STELLA_DESKTOP_DEFAULT_ORIGINS: "https://my.stll.app,https://app.stll.app"
          # Public browser-ingestion configuration; see the Windows build
          # environment above for the desktop adapter's privacy boundary.
          VITE_POSTHOG_HOST: "https://eu.i.posthog.com"
          VITE_POSTHOG_KEY: ${{ secrets.VITE_POSTHOG_KEY }}
          STELLA_COMMIT_SHA: ${{ needs.resolve.outputs.release_sha }}
        # `--verbose --verbose` surfaces signing/notarization log
        # lines (Tauri otherwise hides them behind log::debug). Same
        # rationale as the Windows build step above.
        #
        # `app` produces the signed .app and its .app.tar.gz updater
        # archive. The human-installable DMG is built in the next
        # step: Tauri styles DMGs through Finder automation, which is
        # unavailable on CI and silently falls back to an uncomposed
        # Finder window (tauri-apps/tauri#1731).
        run: |
          printf '%s' "$APPLE_API_KEY_BASE64" | base64 -d > "$APPLE_API_KEY_PATH"
          bun run build -- --target ${{ matrix.target }} --bundles app --verbose --verbose

      - name: Verify macOS update identity
        if: matrix.os == 'macos'
        working-directory: apps/desktop
        env:
          TARGET: ${{ matrix.target }}
        run: |
          shopt -s nullglob
          app_bundles=(src-tauri/target/"$TARGET"/release/bundle/macos/*.app)
          if (( ${#app_bundles[@]} != 1 )); then
            echo "::error::Expected exactly one signed macOS app bundle, found ${#app_bundles[@]}"
            exit 1
          fi

          # Keychain ACL access survives updates only while the app's designated
          # requirement remains stable. Treat any identity change as a migration.
          expected_requirement='=identifier "legal.stella.desktop" and anchor apple generic and certificate 1[field.1.2.840.113635.100.6.2.6] exists and certificate leaf[field.1.2.840.113635.100.6.1.13] exists and certificate leaf[subject.OU] = "4N3QVH454C"'
          codesign --verify --verbose=2 \
            --test-requirement="$expected_requirement" \
            "${app_bundles[0]}"

      - name: Build styled DMG without Finder automation
        if: matrix.os == 'macos'
        working-directory: apps/desktop
        env:
          TARGET: ${{ matrix.target }}
        run: |
          dmgbuild_env="$RUNNER_TEMP/stella-dmgbuild"
          python3 -m venv "$dmgbuild_env"
          "$dmgbuild_env/bin/python" -m pip install \
            --disable-pip-version-check \
            --only-binary=:all: \
            --require-hashes \
            -r dmg/requirements.txt

          app_bundle=$(find "src-tauri/target/$TARGET/release/bundle/macos" \
            -maxdepth 1 -type d -name '*.app' -print -quit)
          if [[ -z "$app_bundle" ]]; then
            echo "::error::Signed macOS app bundle not found"
            exit 1
          fi

          ../../scripts/build-desktop-dmg.sh \
            "$dmgbuild_env/bin/python" \
            "$app_bundle" \
            "src-tauri/target/$TARGET/release/bundle/dmg/stella-desktop.dmg"

      # Tauri 2's bundler notarizes + staples the inner .app but
      # leaves the DMG wrapper unnotarized (tauri-apps/tauri#7533,
      # PR #15118 still open). Submit the DMG ourselves and staple
      # the resulting ticket so users on a cold network at first
      # mount don't hit Apple's online Gatekeeper check.
      - name: Sign, notarize, and staple DMG
        if: matrix.os == 'macos'
        working-directory: apps/desktop
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_KEY_BASE64: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_PATH: ${{ runner.temp }}/apple-api.p8
        run: |
          printf '%s' "$APPLE_API_KEY_BASE64" | base64 -d > "$APPLE_API_KEY_PATH"
          bundle_dir="src-tauri/target/${{ matrix.target }}/release/bundle"
          for dmg in "$bundle_dir"/dmg/*.dmg; do
            [[ -f "$dmg" ]] || continue
            echo "Signing $dmg"
            codesign --force --sign "$APPLE_SIGNING_IDENTITY" --timestamp "$dmg"
            codesign --verify --strict --verbose=2 "$dmg"
            echo "Notarizing $dmg"
            xcrun notarytool submit "$dmg" \
              --key      "$APPLE_API_KEY_PATH" \
              --key-id   "$APPLE_API_KEY_ID" \
              --issuer   "$APPLE_API_ISSUER" \
              --wait --timeout 30m
            xcrun stapler staple "$dmg"
            xcrun stapler validate "$dmg"
          done

      - name: Rename artifacts to stable, version-less filenames
        # Tauri produces version-stamped names like
        # `Stella_0.0.1_x64-setup.exe`. We collapse them into stable
        # names so the in-app "Download" buttons can use deep links
        # like `https://github.com/<repo>/releases/latest/download/
        # Stella-windows-x64-setup.exe` regardless of the release
        # version. The .sig files for updater archives keep their
        # ordering so latest.json continues to find them.
        run: bash scripts/rename-desktop-artifacts.sh "apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle"

      - name: Upload installers to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_REF: ${{ needs.resolve.outputs.release_ref }}
        run: bun scripts/desktop-release-step.ts upload "apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle"

  verify-production:
    # Build the signed desktop artifacts first, then confirm that production
    # still serves this release immediately before publishing latest.json to
    # the public updater feed. This closes the rollback window between the
    # release workflow's promotion check and desktop publication.
    needs: [resolve, build]
    if: ${{ needs.resolve.outputs.should_build == 'true' && needs.resolve.outputs.channel == 'prod' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout release verification script
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve.outputs.release_sha }}
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: "package.json"
          no-cache: true

      - name: Verify production serves the release commit
        env:
          API_DEPLOYMENT_EXPECTED_COMMIT: ${{ needs.resolve.outputs.release_sha }}
          API_DEPLOYMENT_PROBE_PATH: ready
          API_DEPLOYMENT_URL: https://api.stll.app
        run: bun scripts/check-api-deployment.ts

      - name: Verify production web serves the release commit
        env:
          API_DEPLOYMENT_EXPECTED_COMMIT: ${{ needs.resolve.outputs.release_sha }}
          API_DEPLOYMENT_PROBE_PATH: version.json
          API_DEPLOYMENT_URL: https://my.stll.app
        run: bun scripts/check-api-deployment.ts

  manifest:
    # Build the Tauri updater manifest (latest.json) referencing the
    # signed artifacts on the GitHub Release. Runs once after every
    # platform finishes so a partial matrix doesn't ship a manifest
    # that promises an installer that doesn't exist.
    needs: [resolve, build, verify-production]
    if: ${{ always() && needs.resolve.outputs.should_build == 'true' && needs.build.result == 'success' && (needs.resolve.outputs.channel != 'prod' || needs.verify-production.result == 'success') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write # upload latest.json to GitHub Release
      id-token: write # OIDC for AWS S3 + CloudFront
    steps:
      - name: Checkout GitHub API tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.repository }}
          ref: ${{ github.workflow_sha }}
          path: .gh-retry
          persist-credentials: false
          sparse-checkout: scripts/gh-retry.sh
          sparse-checkout-cone-mode: false

      - name: Preserve GitHub API tooling across source checkouts
        run: bun scripts/desktop-release-step.ts preserve-tooling

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Pinned to the SHA resolved by the resolve job; never to
          # the bare tag name. See resolve job for rationale.
          ref: ${{ needs.resolve.outputs.release_sha }}
          persist-credentials: false

      - name: Build and upload latest.json
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_REF: ${{ needs.resolve.outputs.release_ref }}
          APP_VERSION: ${{ needs.resolve.outputs.app_version }}
          REPO: ${{ github.repository }}
        run: bash scripts/build-updater-manifest.sh > latest.json && bash "$GH_RETRY_SCRIPT" release upload "$RELEASE_REF" latest.json --clobber

      # Mirror the manifest to the downloads CDN so the in-app
      # updater (which polls a stable URL on a domain we control)
      # finds the new release. Binaries themselves stay on the
      # GitHub Release; the manifest references them by URL there.
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN_DEPLOY }}
          aws-region: ${{ vars.AWS_REGION }}

      # Register the bucket and distribution id (and the account id the
      # bucket name embeds) as masked values so they render as *** in the
      # public job log instead of plaintext. These are repo variables, which
      # GitHub does not mask automatically the way it does secrets.
      - name: Mask downloads CDN identifiers in logs
        env:
          BUCKET: ${{ vars.DOWNLOADS_BUCKET }}
          DIST_ID: ${{ vars.DOWNLOADS_DIST_ID }}
        run: |
          echo "::add-mask::$BUCKET"
          echo "::add-mask::$DIST_ID"
          account_id="$(printf '%s' "$BUCKET" | grep -oE '[0-9]{12}' | head -n1 || true)"
          [ -n "$account_id" ] && echo "::add-mask::$account_id"

      - name: Mirror latest.json to downloads CDN
        env:
          BUCKET: ${{ vars.DOWNLOADS_BUCKET }}
          DIST_ID: ${{ vars.DOWNLOADS_DIST_ID }}
          # Empty channel ("") => prod feed at /desktop/prod/.
          # rc/beta/etc. => /desktop/<channel>/. Stable users on the
          # default updater feed never see a prerelease manifest.
          CHANNEL: ${{ needs.resolve.outputs.channel }}
        run: |
          channel_dir="${CHANNEL:-prod}"
          key="desktop/$channel_dir/latest.json"
          echo "Publishing to s3://$BUCKET/$key"
          aws s3 cp --no-progress \
            --content-type application/json \
            --cache-control "public, max-age=60, must-revalidate" \
            latest.json \
            "s3://$BUCKET/$key"
          aws cloudfront create-invalidation \
            --distribution-id "$DIST_ID" \
            --paths "/$key" \
            --no-cli-pager > /dev/null

  promote-latest:
    # GitHub's /releases/latest is the source used by the self-host update
    # banner. Keep this final pointer update separate from artifact and CDN
    # publication so a failed manifest job cannot advertise a partial release.
    needs: [resolve, manifest]
    if: ${{ always() && needs.resolve.outputs.should_build == 'true' && needs.resolve.outputs.channel == 'prod' && needs.manifest.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write # mark the fully assembled desktop release as latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      RELEASE_REF: ${{ needs.resolve.outputs.release_ref }}
    steps:
      - name: Checkout release policy
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Recovery may target a release commit that predates this policy.
          # Run policy code from the trusted revision containing this workflow.
          ref: ${{ github.workflow_sha }}
          persist-credentials: false

      - name: Promote release to latest
        run: bash scripts/promote-desktop-release.sh

  carry-forward:
    # Runs ONLY when a STABLE (prod) release skipped the desktop build.
    # A skipped release has no installers of its own, so:
    #   - flipping it to `--latest` as-is would 404 the web app's
    #     /releases/latest/download/Stella-* deep links, and
    #   - NOT flipping it would strand /releases/latest on the old tag.
    # So copy the previous stable release's desktop assets (installers
    # + latest.json) onto this release, then re-verify production and flip
    # `--latest`. The
    # carried latest.json still advertises the previous desktop version
    # and points at the previous release's download URLs, so in-app
    # updaters see no update: that is exactly the point (no redownload
    # churn). The S3 manifest mirror is intentionally left untouched
    # for the same reason.
    #
    # Prereleases are deliberately excluded: they are never
    # /releases/latest and their release objects aren't deep-linked, so
    # a skipped prerelease needs no carry-forward (today's behaviour).
    needs: resolve
    if: ${{ needs.resolve.outputs.should_build == 'false' && needs.resolve.outputs.channel == 'prod' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write # download from / upload to / edit GitHub Releases
    env:
      # `gh` resolves the repo from GH_REPO, so the checkout below serves the
      # workflow's own scripts only, not the release source.
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      RELEASE_REF: ${{ needs.resolve.outputs.release_ref }}
      PREVIOUS_TAG: ${{ needs.resolve.outputs.previous_tag }}
    steps:
      - name: Checkout GitHub API tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.repository }}
          ref: ${{ github.workflow_sha }}
          path: .gh-retry
          persist-credentials: false
          sparse-checkout: scripts/gh-retry.sh
          sparse-checkout-cone-mode: false

      - name: Preserve GitHub API tooling across source checkouts
        run: bun scripts/desktop-release-step.ts preserve-tooling

      - name: Checkout workflow policy scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Keep recovery policy available for historical release commits.
          # API_DEPLOYMENT_EXPECTED_COMMIT still verifies the release SHA.
          ref: ${{ github.workflow_sha }}
          persist-credentials: false

      - name: Copy previous stable desktop assets forward
        run: |
          # A carry-forward with nothing to carry is a broken invariant:
          # the skip decision only produces should_build=false when it
          # found a previous same-channel release WITH a latest.json, so
          # previous_tag must be non-empty here.
          if [[ -z "$PREVIOUS_TAG" ]]; then
            echo "::error::carry-forward reached with no previous_tag; refusing to promote an asset-less release"
            exit 1
          fi

          # Fail loudly if the previous release has no matching assets:
          # a stable release with no installers to carry means the
          # invariant above is already violated upstream.
          bash "$GH_RETRY_SCRIPT" release download "$PREVIOUS_TAG" \
            --pattern 'Stella-*' \
            --pattern 'latest.json' \
            --dir assets \
            --clobber

          # Attach first, THEN verify production and flip --latest: the deep
          # links must resolve and the release must be deployed before
          # /releases/latest points here.
          bash "$GH_RETRY_SCRIPT" release upload "$RELEASE_REF" assets/* --clobber

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: "package.json"
          no-cache: true

      - name: Verify production serves the release commit
        env:
          API_DEPLOYMENT_EXPECTED_COMMIT: ${{ needs.resolve.outputs.release_sha }}
          API_DEPLOYMENT_PROBE_PATH: ready
          API_DEPLOYMENT_URL: https://api.stll.app
        run: bun scripts/check-api-deployment.ts

      - name: Verify production web serves the release commit
        env:
          API_DEPLOYMENT_EXPECTED_COMMIT: ${{ needs.resolve.outputs.release_sha }}
          API_DEPLOYMENT_PROBE_PATH: version.json
          API_DEPLOYMENT_URL: https://my.stll.app
        run: bun scripts/check-api-deployment.ts

      - name: Promote release to latest
        run: bash scripts/promote-desktop-release.sh
