name: autofix.ci # autofix.ci uses this exact name as a security boundary

# No `paths` filter: each job scopes itself. The Dependabot job runs only on
# dependabot/bun/* heads, which always carry a bun.lock or
# packages/*/package.json change, and the regeneration job reads the whole
# source tree.
on:
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  dependabot-bun-autofix:
    name: Autofix Dependabot Bun update
    if: >-
      github.actor == 'dependabot[bot]'
      && github.event.pull_request.user.login == 'dependabot[bot]'
      && github.event.pull_request.head.repo.full_name == github.repository
      && startsWith(github.event.pull_request.head.ref, 'dependabot/bun/')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      DEPENDABOT_CHANGESET_PATH: .changeset/dependabot-dependencies-${{ github.event.pull_request.number }}.md
      # autofix-ci/action v1.3.4 declares Node 24 support, but its action
      # metadata still names node20 for compatibility with older runners.
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout Dependabot head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: "package.json"

      # No install is needed. --lockfile-only and --ignore-scripts keep the
      # fixer from materializing dependencies or running PR-controlled hooks.
      - name: Dedupe lockfile
        run: bun --no-env-file dedupe --lockfile-only --ignore-scripts

      - name: Verify trusted autofix sources
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: >-
          git diff --quiet "$BASE_SHA" "$HEAD_SHA" --
          scripts/dependabot-changeset.ts
          scripts/changeset-guard.ts
          scripts/changeset-entry.ts
          scripts/changeset-policy.json
          scripts/check-resolution-ranges.ts
          scripts/check-resolutions-only-change.ts
          scripts/fix-resolution-ranges.ts
          scripts/json-text-edit.ts
          scripts/resolution-ranges.ts

      # A bump can move a dependent's declared floor above a root `resolutions`
      # pin. bun applies the pin anyway, so the graph installs and only breaks
      # at build/runtime; the resolution-range guard fails the PR for it. The
      # fixer raises each pin to the lowest version every dependent accepts,
      # re-resolving bun.lock between passes so a floor that only the refreshed
      # lockfile exposes is repaired too, and fails (non-zero) on a conflict no
      # version satisfies or a cascade still unresolved at the pass cap.
      - name: Raise resolutions to their dependents' floors
        run: >-
          bun --no-install --no-env-file scripts/fix-resolution-ranges.ts
          --max-passes 4

      - name: Resolution range guard
        run: bun --no-install --no-env-file scripts/check-resolution-ranges.ts

      # A devDependency-only bump gets an empty changeset. A same-major runtime
      # bump moves the floor consumers install, so it gets a patch changeset
      # naming the dependency. Peer changes, major floor moves and anything
      # the fixer cannot compare stay gated for review.
      - name: Add missing Dependabot changeset
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: >-
          bun --no-install --no-env-file scripts/dependabot-changeset.ts
          --base "$BASE_SHA" --head "$HEAD_SHA" --output "$DEPENDABOT_CHANGESET_PATH"

      - name: Restrict generated changes
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ "$(git rev-parse HEAD)" != "$HEAD_SHA" ]]; then
            echo "::error::Autofix moved HEAD away from $HEAD_SHA."
            exit 1
          fi

          unexpected_tracked="$(git diff --name-only "$HEAD_SHA" -- . ':(exclude)bun.lock' ':(exclude)package.json' ":(exclude)$DEPENDABOT_CHANGESET_PATH")"
          unexpected_untracked="$(git ls-files --others --exclude-standard -- . ":(exclude)$DEPENDABOT_CHANGESET_PATH")"
          if [[ -n "${unexpected_tracked}${unexpected_untracked}" ]]; then
            echo "::error::Autofix changed files outside bun.lock, package.json and $DEPENDABOT_CHANGESET_PATH."
            git status --short
            exit 1
          fi

          # The changeset is re-derived from the trusted decision and must
          # match byte for byte; a symlink or an undue file fails here.
          bun --no-install --no-env-file scripts/dependabot-changeset.ts \
            --base "$BASE_SHA" --head "$HEAD_SHA" --output "$DEPENDABOT_CHANGESET_PATH" --check

          bun --no-install --no-env-file scripts/check-resolutions-only-change.ts --ref "$HEAD_SHA"

          git diff --check -- bun.lock package.json

      - name: Push autofixes
        uses: autofix-ci/action@c5b2d67aa2274e7b5a18224e8171550871fc7e4a # v1.3.4
        with:
          commit-message: "chore: autofix Dependabot Bun update"

  regenerate-scope:
    name: Scope derived-file regeneration
    # Same-repository pull requests only: the generators run the pull
    # request's own code, and the result lands on that pull request's branch,
    # which its author can already push to. Fork and Dependabot pull requests
    # keep the CI drift guards alone.
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository
      && github.event.pull_request.user.login != 'dependabot[bot]'
      && github.actor != 'dependabot[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      run: ${{ steps.scope.outputs.run }}
    steps:
      # The generators read apps/api, the workspace packages whose types reach
      # the API, the web manifest, the formatter config, the dependency graph,
      # their own sources and their own outputs; a pull request
      # touching none of them cannot drift. The files API lists at most 3000
      # files, so a list that long regenerates rather than guessing.
      - name: Match generator inputs
        id: scope
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          files="$(gh api --paginate "repos/$REPOSITORY/pulls/$PR_NUMBER/files" --jq '.[].filename')"
          inputs='^(apps/api/|packages/|apps/web/src/(generated/|routes/|routeTree\.gen\.ts$)|apps/web/(package\.json|vite\.config\.ts|route-tree\.config\.ts|scripts/generate-route-tree\.ts)$|\.oxfmtrc\.json$|scripts/(ownership|design-tokens-doc)\.ts$|DESIGN\.md$|docs/(capability-coverage|module-ownership)\.md$|chatgpt-app-submission\.json$|bun\.lock$|package\.json$)'
          if [[ "$(wc -l <<<"$files")" -ge 3000 ]] || grep -qE "$inputs" <<<"$files"; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "No generator input changed; skipping regeneration."
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

  regenerate-derived-files:
    name: Regenerate derived files
    needs: regenerate-scope
    if: needs.regenerate-scope.outputs.run == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout pull request head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}
          submodules: true

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: "package.json"

      - name: Install dependencies
        run: bash scripts/retry.sh bun ci --ignore-scripts
        env:
          # .npmrc references NPM_TOKEN; pull request installs get none.
          NPM_TOKEN: ""

      - name: Prepare environment
        run: |
          cp apps/api/.env.example apps/api/.env
          cp apps/web/.env.example apps/web/.env

      # Each step writes what a CI drift guard in ci.yml compares, with the
      # command that guard names as its fix. The capability catalog runs
      # before the CLI codegen, which reads it.
      - name: Regenerate the capability catalog
        run: bun apps/api/scripts/export-capability-catalog.ts

      - name: Regenerate the CLI registry projections
        run: (cd packages/cli && bun run codegen)

      - name: Regenerate the MCP App bundles
        run: (cd apps/api && bun run build:mcp-apps)

      - name: Regenerate the web API types
        run: bun --filter @stll/api gen:web-api-types

      - name: Regenerate the route tree
        run: bun --filter @stll/web generate:route-tree

      # --write records exact numbers, so it runs only when a row is past its
      # tolerance; a within-tolerance change stays unrewritten. The drift
      # lands as a reviewable diff on the pull request.
      - name: Rewrite the MCP surface baseline when it drifted
        working-directory: apps/api
        run: |
          if ! bun run mcp:surface-baseline --check; then
            bun run mcp:surface-baseline --write
          fi

      - name: Regenerate the module ownership doc
        run: bun scripts/ownership.ts --write

      - name: Regenerate the design token docs
        run: bun scripts/design-tokens-doc.ts --write

      - name: Restrict regenerated changes
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ "$(git rev-parse HEAD)" != "$HEAD_SHA" ]]; then
            echo "::error::Regeneration moved HEAD away from $HEAD_SHA."
            exit 1
          fi

          generated=(
            DESIGN.md
            apps/api/mcp-surface-baseline.json
            "apps/api/src/mcp/apps/*/generated/app.html.txt"
            apps/api/src/mcp/generated/capability-dispatch.ts
            apps/web/src/generated/api-routes.gen.ts
            apps/web/src/routeTree.gen.ts
            chatgpt-app-submission.json
            docs/capability-coverage.md
            docs/module-ownership.md
            packages/api-contract/src/mcp-chat-tool-policy.gen.ts
            packages/cli/capability-catalog.json
            packages/cli/skills
            packages/cli/src/generated
          )
          excludes=()
          for path in "${generated[@]}"; do
            excludes+=(":(exclude,glob)$path" ":(exclude,glob)$path/**")
          done

          unexpected_tracked="$(git diff --name-only -- . "${excludes[@]}")"
          unexpected_untracked="$(git ls-files --others --exclude-standard -- . "${excludes[@]}")"
          if [[ -n "${unexpected_tracked}${unexpected_untracked}" ]]; then
            echo "::error::Regeneration changed files outside the generated paths."
            git status --short
            exit 1
          fi

          git status --short

      - name: Push regenerated files
        uses: autofix-ci/action@c5b2d67aa2274e7b5a18224e8171550871fc7e4a # v1.3.4
        with:
          commit-message: "chore: regenerate derived files"
