name: autofix.ci # autofix.ci uses this exact name as a security boundary

# No `paths` filter: each job scopes itself. Dependency updates and ordinary
# same-repository PRs share the Tauri alignment fixer and existing App push.
on:
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: ${{ github.workflow }}-${{ (github.event_name == 'pull_request') && format('pr-{0}', github.event.pull_request.number || github.ref) || format('run-{0}', github.run_id) }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  dependabot-bun-autofix:
    name: Autofix Dependabot dependency update
    if: >-
      github.actor != 'autofix-ci[bot]'
      && github.event.pull_request.user.login == 'dependabot[bot]'
      && github.event.pull_request.head.repo.full_name == github.repository
      && (startsWith(github.event.pull_request.head.ref, 'dependabot/bun/')
          || startsWith(github.event.pull_request.head.ref, 'dependabot/cargo/'))
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      DEPENDABOT_CHANGESET_PATH: .changeset/dependabot-dependencies-${{ github.event.pull_request.number }}.md
      # autofix-ci/action v1.3.4 declares Node 24 support, but its action
      # metadata still names node20 for compatibility with older runners.
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      RUSTUP_TOOLCHAIN: stable

    steps:
      - name: Checkout Dependabot head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Setup Bun
        uses: stella/.github/actions/setup-bun-cached@167fb396c6c0f4e07296ad2cd72e6ef15367c776
        with:
          save: ${{ github.ref == 'refs/heads/main' }}
          bun-version-file: "package.json"

      # No install is needed. --lockfile-only and --ignore-scripts keep the
      # fixer from materializing dependencies or running PR-controlled hooks.
      - name: Dedupe lockfile
        run: bun --no-env-file dedupe --lockfile-only --ignore-scripts

      - name: Verify trusted autofix sources
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: >-
          git diff --quiet "$BASE_SHA" "$HEAD_SHA" --
          scripts/dependabot-changeset.ts
          scripts/changeset-guard.ts
          scripts/changeset-entry.ts
          scripts/changeset-policy.json
          scripts/check-resolution-ranges.ts
          scripts/check-resolutions-only-change.ts
          scripts/fix-resolution-ranges.ts
          scripts/json-text-edit.ts
          scripts/resolution-ranges.ts
          scripts/bun-lock-text.ts
          scripts/check-tauri-package-alignment.ts
          scripts/fix-tauri-package-alignment.ts

      - name: Align Tauri counterparts
        id: tauri
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          git diff --name-only "$BASE_SHA" "$HEAD_SHA" > "$RUNNER_TEMP/tauri-paths"
          mapfile -t paths < "$RUNNER_TEMP/tauri-paths"
          required=$(bun --no-install --no-env-file scripts/check-tauri-package-alignment.ts --requires-check "${paths[@]}")
          if [[ "$required" == true ]]; then
            bun --no-install --no-env-file scripts/fix-tauri-package-alignment.ts
          fi

      # A bump can move a dependent's declared floor above a root `resolutions`
      # pin. bun applies the pin anyway, so the graph installs and only breaks
      # at build/runtime; the resolution-range guard fails the PR for it. The
      # fixer raises each pin to the lowest version every dependent accepts,
      # re-resolving bun.lock between passes so a floor that only the refreshed
      # lockfile exposes is repaired too, and fails (non-zero) on a conflict no
      # version satisfies or a cascade still unresolved at the pass cap.
      - name: Raise resolutions to their dependents' floors
        run: >-
          bun --no-install --no-env-file scripts/fix-resolution-ranges.ts
          --max-passes 4

      - name: Resolution range guard
        run: bun --no-install --no-env-file scripts/check-resolution-ranges.ts

      # A devDependency-only bump gets an empty changeset. A same-major runtime
      # bump moves the floor consumers install, so it gets a patch changeset
      # naming the dependency. Peer changes, major floor moves and anything
      # the fixer cannot compare stay gated for review.
      - name: Add missing Dependabot changeset
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: >-
          bun --no-install --no-env-file scripts/dependabot-changeset.ts
          --base "$BASE_SHA" --head "$HEAD_SHA" --output "$DEPENDABOT_CHANGESET_PATH"

      - name: Restrict generated changes
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          TAURI_ALLOWED: ${{ steps.tauri.outputs.allowed }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ "$(git rev-parse HEAD)" != "$HEAD_SHA" ]]; then
            echo "::error::Autofix moved HEAD away from $HEAD_SHA."
            exit 1
          fi

          IFS='|' read -r -a tauri_paths <<< "$TAURI_ALLOWED"
          tauri_excludes=()
          for path in "${tauri_paths[@]}"; do
            [[ -n "$path" ]] || continue
            tauri_excludes+=(":(exclude,literal)$path")
          done
          unexpected_tracked="$(git diff --name-only "$HEAD_SHA" -- . ':(exclude)bun.lock' ':(exclude)package.json' ":(exclude)$DEPENDABOT_CHANGESET_PATH" "${tauri_excludes[@]}")"
          unexpected_untracked="$(git ls-files --others --exclude-standard -- . ":(exclude)$DEPENDABOT_CHANGESET_PATH")"
          if [[ -n "${unexpected_tracked}${unexpected_untracked}" ]]; then
            echo "::error::Autofix changed files outside dependency repair outputs."
            git status --short
            exit 1
          fi

          # The changeset is re-derived from the trusted decision and must
          # match byte for byte; a symlink or an undue file fails here.
          bun --no-install --no-env-file scripts/dependabot-changeset.ts \
            --base "$BASE_SHA" --head "$HEAD_SHA" --output "$DEPENDABOT_CHANGESET_PATH" --check

          bun --no-install --no-env-file scripts/check-resolutions-only-change.ts --ref "$HEAD_SHA"

          git diff --check -- bun.lock package.json

      # The GitHub App writes the commit; its synchronize event is excluded above.
      - name: Push autofixes
        uses: autofix-ci/action@c5b2d67aa2274e7b5a18224e8171550871fc7e4a # v1.3.4
        with:
          commit-message: "chore: autofix dependency update"

  regenerate-scope:
    name: Scope autofixes
    # Same-repository pull requests only: the generators run the pull
    # request's own code, and the result lands on that pull request's branch,
    # which its author can already push to. Dependabot uses the dependency
    # job above; fork pull requests keep the CI drift guards alone.
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository
      && github.event.pull_request.user.login != 'dependabot[bot]'
      && github.actor != 'dependabot[bot]'
      && github.actor != 'autofix-ci[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      ready: ${{ steps.planner.outputs.ready }}
      run: ${{ steps.scope.outputs.run }}
      ids: ${{ steps.scope.outputs.ids }}
      allowed: ${{ steps.scope.outputs.allowed }}
    steps:
      - name: Checkout GitHub API tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.repository }}
          ref: ${{ github.workflow_sha }}
          path: .gh-retry
          persist-credentials: false
          sparse-checkout: scripts/gh-retry.sh
          sparse-checkout-cone-mode: false

      - name: Preserve GitHub API tooling across source checkouts
        run: |
          cp "$GITHUB_WORKSPACE/.gh-retry/scripts/gh-retry.sh" "$RUNNER_TEMP/gh-retry.sh"
          echo "GH_RETRY_SCRIPT=$RUNNER_TEMP/gh-retry.sh" >> "$GITHUB_ENV"

      # Fetch paths before checking out pull request code. Only the planner
      # files are needed in this job; generators run in the later job.
      - name: Fetch changed paths
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          bash "$GH_RETRY_SCRIPT" api --paginate "repos/$REPOSITORY/pulls/$PR_NUMBER/files" --jq '.[].filename' > "$RUNNER_TEMP/changed-paths"

      - name: Checkout pull request head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}
          sparse-checkout: |
            /scripts/
            /packages/scripts/src/generated-files.ts
            /package.json
          sparse-checkout-cone-mode: false

      - name: Setup Bun
        uses: stella/.github/actions/setup-bun-cached@167fb396c6c0f4e07296ad2cd72e6ef15367c776
        with:
          save: ${{ github.ref == 'refs/heads/main' }}
          bun-version-file: "package.json"

      - name: Check planner availability
        id: planner
        shell: bash
        run: |
          set -euo pipefail
          for path in scripts/autofix-plan.ts scripts/autofix-protected-paths.ts scripts/baseline-paths.ts scripts/generated-files.ts packages/scripts/src/generated-files.ts; do
            if [[ -f "$path" ]]; then
              continue
            fi
            if git cat-file -e "HEAD:$path" 2>/dev/null; then
              echo "::error::Sparse checkout omitted $path."
              exit 1
            fi
            echo "::notice::Autofix requires a branch that includes $path."
            echo "ready=false" >> "$GITHUB_OUTPUT"
            exit 0
          done
          echo "ready=true" >> "$GITHUB_OUTPUT"

      # The manifest owns generator inputs and outputs. The files API lists at
      # most 3000 files, so a list that long regenerates rather than guessing.
      - name: Match generator inputs
        id: scope
        if: steps.planner.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$(wc -l < "$RUNNER_TEMP/changed-paths")" -ge 3000 ]]; then
            bun --no-install --no-env-file scripts/autofix-plan.ts plan --all < "$RUNNER_TEMP/changed-paths" >> "$GITHUB_OUTPUT"
          else
            bun --no-install --no-env-file scripts/autofix-plan.ts plan < "$RUNNER_TEMP/changed-paths" >> "$GITHUB_OUTPUT"
          fi

  regenerate-derived-files:
    name: Autofix changed files
    needs: regenerate-scope
    if: >-
      needs.regenerate-scope.result == 'success'
      && needs.regenerate-scope.outputs.ready == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      RUSTUP_TOOLCHAIN: stable

    steps:
      - name: Checkout pull request head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}
          submodules: true

      - name: Record changed paths
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$(git rev-parse HEAD)" != "$HEAD_SHA" ]]; then
            echo "::error::Autofix moved HEAD away from $HEAD_SHA."
            exit 1
          fi
          git diff --name-only -z --diff-filter=ACMR "$BASE_SHA"..."$HEAD_SHA" -- > "$RUNNER_TEMP/autofix-changed-paths"
          git diff --name-only -z --no-renames --diff-filter=A "$BASE_SHA"..."$HEAD_SHA" -- apps/api/ > "$RUNNER_TEMP/autofix-added-paths"

      - name: Setup Bun
        uses: stella/.github/actions/setup-bun-cached@167fb396c6c0f4e07296ad2cd72e6ef15367c776
        with:
          save: ${{ github.ref == 'refs/heads/main' }}
          bun-version-file: "package.json"

      - name: Align Tauri counterparts
        id: tauri
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if git diff --quiet "$BASE_SHA" "$HEAD_SHA" -- \
            scripts/bun-lock-text.ts scripts/check-tauri-package-alignment.ts \
            scripts/fix-tauri-package-alignment.ts scripts/json-text-edit.ts; then
            mapfile -d '' -t paths < "$RUNNER_TEMP/autofix-changed-paths"
            required=$(bun --no-install --no-env-file scripts/check-tauri-package-alignment.ts --requires-check "${paths[@]}")
            if [[ "$required" == true ]]; then
              bun --no-install --no-env-file scripts/fix-tauri-package-alignment.ts
            fi
          else
            echo "::notice::Alignment fixer sources changed; CI enforces alignment without automatic edits."
          fi

      - name: Install dependencies
        run: bash scripts/retry.sh bun ci --ignore-scripts
        env:
          # .npmrc references NPM_TOKEN; pull request installs get none.
          NPM_TOKEN: ""

      - name: Prepare environment
        run: |
          cp apps/api/.env.example apps/api/.env
          cp apps/web/.env.example apps/web/.env

      - name: Regenerate selected files
        if: needs.regenerate-scope.outputs.run == 'true'
        env:
          GENERATOR_IDS: ${{ needs.regenerate-scope.outputs.ids }}
        run: bun scripts/autofix-plan.ts run "$GENERATOR_IDS"

      - name: Fix changed files
        shell: bash
        run: |
          set -euo pipefail
          changed=()
          while IFS= read -r -d '' path; do
            changed+=("$path")
          done < "$RUNNER_TEMP/autofix-changed-paths"
          bun scripts/autofix-protected-paths.ts > "$RUNNER_TEMP/autofix-protected-paths"
          protected=()
          while IFS= read -r pattern; do
            protected+=("$pattern")
          done < "$RUNNER_TEMP/autofix-protected-paths"
          format_paths=()
          lint_paths=()
          for path in "${changed[@]}"; do
            [[ -f "$path" && ! -L "$path" ]] || continue
            # The GitHub App cannot update workflow files.
            if [[ "$path" == .github/workflows/* || "$path" == scripts/ratchet-baseline.json ]]; then
              continue
            fi
            protected_path=false
            for pattern in "${protected[@]}"; do
              if [[ "$path" == $pattern ]]; then
                protected_path=true
                break
              fi
            done
            [[ "$protected_path" == false ]] || continue
            format_paths+=("./$path")
            # Astro's checker owns apps/landing types (astro:* modules); the
            # native compiler cannot build that graph, so it gets no type-aware
            # fixes. CI's lint job still reports its findings.
            if [[ "$path" =~ \.([cm]?[jt]s|[jt]sx)$ && "$path" != apps/landing/* ]]; then
              lint_paths+=("./$path")
            fi
          done

          if (( ${#lint_paths[@]} > 0 )); then
            # Type-aware fixes need the complete generated type graph. set -e
            # aborts on preparation or compiler errors before any fixer runs.
            bun scripts/ci-generated-sources.ts prepare
            bun scripts/typecheck-coverage.ts --autofix "${lint_paths[@]}"
            # --fix applies safe fixes only. CI's lint job reports anything left.
            lint_status=0
            bun --bun oxlint -c oxlint.config.ts --no-error-on-unmatched-pattern --type-aware --fix "${lint_paths[@]}" || lint_status=$?
            if (( lint_status > 1 )); then
              exit "$lint_status"
            fi
          fi
          if (( ${#format_paths[@]} > 0 )); then
            bun run format:guard
            bun --bun oxfmt -c .oxfmtrc.json --no-error-on-unmatched-pattern "${format_paths[@]}"
          fi

      - name: Restrict autofix changes
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          GENERATOR_ALLOWED: ${{ needs.regenerate-scope.outputs.allowed }}
          TAURI_ALLOWED: ${{ steps.tauri.outputs.allowed }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ "$(git rev-parse HEAD)" != "$HEAD_SHA" ]]; then
            echo "::error::Autofix moved HEAD away from $HEAD_SHA."
            exit 1
          fi

          # Check this literal path independently: neither PR changed paths nor
          # the PR planner's output globs can grant a baseline exception.
          if ! git diff --quiet HEAD -- scripts/ratchet-baseline.json || [[ -n "$(git ls-files --others --exclude-standard -- scripts/ratchet-baseline.json)" ]]; then
            echo "::error::Autofix cannot recreate the retired ratchet baseline."
            exit 1
          fi

          # No changed-path or generator grant can authorize decision records.
          bun scripts/autofix-protected-paths.ts > "$RUNNER_TEMP/autofix-protected-paths"
          protected=()
          while IFS= read -r pattern; do
            protected+=("$pattern")
          done < "$RUNNER_TEMP/autofix-protected-paths"
          protected_specs=()
          for pattern in "${protected[@]}"; do
            protected_specs+=(":(glob)$pattern")
          done
          if ! git diff --quiet "$HEAD_SHA" -- "${protected_specs[@]}" || [[ -n "$(git ls-files --others --exclude-standard -- "${protected_specs[@]}")" ]]; then
            echo "::error::Autofix cannot modify baselines, ledgers, waivers, allowances or changesets."
            exit 1
          fi

          changed=()
          while IFS= read -r -d '' path; do
            changed+=("$path")
          done < "$RUNNER_TEMP/autofix-changed-paths"
          IFS='|' read -r -a generated <<< "$GENERATOR_ALLOWED"
          IFS='|' read -r -a tauri_paths <<< "$TAURI_ALLOWED"
          excludes=()
          for path in "${changed[@]}"; do
            if [[ "$path" == .github/workflows/* || "$path" == scripts/ratchet-baseline.json ]]; then
              continue
            fi
            excludes+=(":(exclude,literal)$path")
          done
          for path in "${generated[@]}"; do
            [[ -n "$path" ]] || continue
            excludes+=(":(exclude,glob)$path" ":(exclude,glob)$path/**")
          done
          for path in "${tauri_paths[@]}"; do
            [[ -n "$path" ]] || continue
            excludes+=(":(exclude,literal)$path")
          done

          unexpected_tracked="$(git diff --name-only -- . "${excludes[@]}")"
          unexpected_untracked="$(git ls-files --others --exclude-standard -- . "${excludes[@]}")"
          if [[ -n "${unexpected_tracked}${unexpected_untracked}" ]]; then
            echo "::error::Autofix changed files outside the changed and generated paths."
            git status --short
            exit 1
          fi

          git status --short

      - name: Push autofixes
        uses: autofix-ci/action@c5b2d67aa2274e7b5a18224e8171550871fc7e4a # v1.3.4
        with:
          commit-message: "chore: autofix files"
