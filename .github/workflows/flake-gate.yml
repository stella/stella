name: Changed-test flake report

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
    paths:
      - "**/*.test.ts"
      - "**/*.test.tsx"
      - "**/*.spec.ts"
      - "**/*.spec.tsx"
      - "**/*.rs"
  workflow_call:
    inputs:
      base_ref:
        type: string
        default: origin/main
  workflow_dispatch:
    inputs:
      base_ref:
        description: Base revision for the changed-test diff
        type: string
        default: origin/main

permissions: {}

defaults:
  run:
    shell: bash

concurrency:
  group: >-
    flake-gate-${{ github.event_name == 'pull_request' && inputs.base_ref != ''
    && format('reuse-{0}', github.run_id) || github.event.pull_request.number
    || github.run_id }}-${{
    github.event.action == 'labeled' && github.event.label.name != 'flake-gate'
    && format('label-{0}', github.event.label.name) || 'report' }}
  cancel-in-progress: >-
    ${{ github.event_name == 'pull_request' && inputs.base_ref == ''
    && (github.event.action != 'labeled' || github.event.label.name == 'flake-gate') }}

jobs:
  report:
    if: >-
      github.event_name != 'pull_request'
      || inputs.base_ref != ''
      || (contains(github.event.pull_request.labels.*.name, 'flake-gate')
          && (github.event.action != 'labeled' || github.event.label.name == 'flake-gate'))
    runs-on: ubuntu-latest
    timeout-minutes: 75
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:18.6@sha256:74935e72241653ca55e0414067e6d8763aceb8a810eb51b452253ec3dcfc4336
        env:
          POSTGRES_USER: stella_owner
          POSTGRES_PASSWORD: stella
          POSTGRES_DB: stella
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U stella_owner -d stella"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Bun
        uses: stella/.github/actions/setup-bun-cached@5764ab66e4df84cfd2e642c7d7e4678261e668f8
        with:
          save: ${{ github.ref == 'refs/heads/main' }}

      - name: Install dependencies
        run: bash scripts/retry.sh bun ci --ignore-scripts
        env:
          NPM_TOKEN: ""

      - name: Generate test prerequisites
        run: |
          bun --cwd=packages/cli run codegen:runtime
          bun run generate

      - name: Configure test Postgres parity
        run: bash scripts/configure-test-postgres.sh "${{ job.services.postgres.id }}" stella_owner

      - name: Apply test migrations
        run: bun --filter @stll/api db:migrate
        env:
          DATABASE_URL: postgres://stella_owner:stella@127.0.0.1:5432/stella

      - name: Report changed-test stability
        continue-on-error: true
        env:
          BASE_SHA: ${{ inputs.base_ref || github.event.pull_request.base.sha || 'origin/main' }}
          DATABASE_URL: postgres://stella_owner:stella@127.0.0.1:5432/stella
        run: bun scripts/flake-gate.ts

      - name: Upload flake report
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: flake-gate-report
          path: flake-gate-report.json
          if-no-files-found: warn
          retention-days: 7
