name: Regenerate marketing screenshots

defaults:
  run:
    shell: bash

# When a pull request's `marketing-screenshots` check fails on a pixel diff,
# regenerate the baselines on the runner and push them to the pull request's
# branch, exactly as a manual dispatch of marketing-screenshots-update.yml
# would. workflow_run always runs this file from the default branch, so the
# selection below is trusted code; it only reads the GitHub API and never
# executes anything from the pull request.
#
# Scope:
# - Same-repository branches only. A fork's branch cannot be pushed to; its
#   author takes the PNGs from a manual run's artifact.
# - Only a failure that left the pixel-diff marker artifact; a broken stack
#   or a failing assertion is not a baseline change.
# - At most once per human push: when the branch head already is a
#   regeneration commit, a second diff means capture is not converging, and
#   a person has to look instead of the bot pushing again.

on:
  workflow_run:
    workflows: [CI Checks]
    types: [completed]

permissions: {}

jobs:
  select:
    if: >-
      github.event.workflow_run.conclusion == 'failure'
      && github.event.workflow_run.head_repository.full_name == github.repository
      && github.event.workflow_run.path == '.github/workflows/ci.yml'
      && (github.event.workflow_run.event == 'pull_request'
          || github.event.workflow_run.event == 'merge_group')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
      pull-requests: read
    outputs:
      branch: ${{ steps.select.outputs.branch }}
      sha: ${{ steps.select.outputs.sha }}
    steps:
      # workflow_run is privileged: use API calls only; never execute PR code.
      - name: Select a pull request with a pixel diff
        id: select
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            const { owner, repo } = context.repo;
            const run = context.payload.workflow_run;
            const REGENERATION_HEADLINE = 'chore(landing): regenerate marketing screenshots';
            const artifacts = await github.paginate('GET /repos/{owner}/{repo}/actions/runs/{run_id}/artifacts', {
              owner, repo, run_id: run.id, per_page: 100,
            });
            if (!artifacts.some(artifact => artifact.name === 'marketing-screenshots-pixel-diff' && !artifact.expired)) {
              return;
            }
            let number;
            if (run.event === 'pull_request') {
              const pulls = (run.pull_requests ?? []).filter(pull => pull.head?.sha === run.head_sha);
              if (pulls.length !== 1) return;
              number = pulls[0].number;
            } else {
              const match = /^gh-readonly-queue\/[^/]+\/pr-([0-9]+)-[0-9a-f]{40}$/u.exec(run.head_branch ?? '');
              if (!match) return;
              number = Number(match[1]);
            }
            const { data: pull } = await github.rest.pulls.get({ owner, repo, pull_number: number });
            if (pull.state !== 'open'
              || pull.head.repo?.full_name !== `${owner}/${repo}`
              || pull.base.repo.full_name !== `${owner}/${repo}`
              || pull.head.ref === pull.base.repo.default_branch
              || !/^[A-Za-z0-9._/-]+$/u.test(pull.head.ref)
              || pull.head.ref.includes('..') || pull.head.ref.startsWith('-')
              || !/^[0-9a-f]{40}$/u.test(pull.head.sha)) return;
            // A pull_request run that is no longer the head is superseded by
            // the run for the newer push.
            if (run.event === 'pull_request' && pull.head.sha !== run.head_sha) return;
            const { data: head } = await github.rest.git.getCommit({ owner, repo, commit_sha: pull.head.sha });
            if (head.message.split('\n')[0].trim() === REGENERATION_HEADLINE) {
              core.notice(`#${number} already carries regenerated screenshots and still differs; not regenerating again.`);
              return;
            }
            core.setOutput('branch', pull.head.ref);
            core.setOutput('sha', pull.head.sha);

  regenerate:
    needs: select
    if: needs.select.outputs.branch != '' && needs.select.outputs.sha != ''
    # Shared with manual dispatches of marketing-screenshots-update.yml, so
    # two regenerations of one branch never race on the same push target.
    concurrency:
      group: marketing-screenshots-update-${{ needs.select.outputs.branch }}
      cancel-in-progress: false
    uses: ./.github/workflows/marketing-screenshots.yml
    permissions:
      contents: read
      # The reusable check job's artifact-read permission must be declared even when update mode skips it.
      actions: read
    with:
      mode: update
      ref: ${{ needs.select.outputs.branch }}
      expected-sha: ${{ needs.select.outputs.sha }}
    secrets:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
      STELLA_RELEASE_APP_PRIVATE_KEY: ${{ secrets.STELLA_RELEASE_APP_PRIVATE_KEY }}
