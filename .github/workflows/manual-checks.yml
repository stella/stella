name: Manual checks
run-name: "Manual checks ${{ inputs.check }} ${{ github.sha }}"

defaults:
  run:
    shell: bash

on:
  workflow_dispatch:
    inputs:
      check:
        description: Check to run
        type: choice
        required: true
        options:
          - typecheck-repo
          - typecheck-package
          - typecheck-probe
          - lint
          - test-files
          - verify-affected
          - install-cache-benchmark
          - store-cache-save-benchmark
      target:
        description: Package name or space-separated test paths
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: manual-check-${{ github.ref }}-${{ inputs.check }}
  cancel-in-progress: true

env:
  TURBO_CACHE: local:rw,remote:r

jobs:
  check:
    if: inputs.check != 'install-cache-benchmark' && inputs.check != 'store-cache-save-benchmark'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Refuse protected refs
        env:
          CHECK_REF: ${{ github.ref }}
        run: |
          if [[ "$CHECK_REF" == "refs/heads/main" || "$CHECK_REF" == refs/heads/gh-readonly-queue/* ]]; then
            echo "::error::Manual checks cannot run on protected refs"
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false
          submodules: true

      - name: Setup Bun
        uses: stella/.github/actions/setup-bun-cached@a6a6cd30646c18321ef71e344bf0af6b8d3634b8
        with:
          save: ${{ github.ref == 'refs/heads/main' }}

      # A refused input still produces a result: its exit code and errors are
      # recorded for the result step like a failed check.
      - name: Validate input
        id: validate
        env:
          CHECK_CHECK: ${{ inputs.check }}
          CHECK_TARGET: ${{ inputs.target }}
          CHECK_LOG_FILE: ${{ runner.temp }}/manual-check.log
          CHECK_EXIT_FILE: ${{ runner.temp }}/manual-check.exit
          CHECK_START_FILE: ${{ runner.temp }}/manual-check.start
        run: |
          date +%s > "$CHECK_START_FILE"
          set +e
          bun scripts/manual-check-input.ts 2>&1 | tee "$CHECK_LOG_FILE"
          status="${PIPESTATUS[0]}"
          set -e
          if [[ "$status" -ne 0 ]]; then
            echo "$status" > "$CHECK_EXIT_FILE"
            exit "$status"
          fi

      - name: Turbo remote cache
        uses: rharkor/caching-for-turbo@2238fae6eb9a9936f92356f54cb3660200d105e7 # v2.5.1
        with:
          server-port: "0"

      - name: Install dependencies
        timeout-minutes: 5
        run: bash scripts/retry.sh bun ci --ignore-scripts
        env:
          NPM_TOKEN: ""

      - name: Generate sources
        run: bun run generate

      - name: Run check
        id: run-check
        continue-on-error: true
        env:
          CHECK_CHECK: ${{ inputs.check }}
          CHECK_TARGET: ${{ inputs.target }}
          CHECK_LOG_FILE: ${{ runner.temp }}/manual-check.log
          CHECK_EXIT_FILE: ${{ runner.temp }}/manual-check.exit
          CHECK_START_FILE: ${{ runner.temp }}/manual-check.start
        run: |
          date +%s > "$CHECK_START_FILE"
          set +e
          case "$CHECK_CHECK" in
            typecheck-repo) bun run typecheck --concurrency=1 && bun run typecheck:repo ;;
            typecheck-package) bun --filter "$CHECK_TARGET" typecheck ;;
            typecheck-probe) bash scripts/typecheck-command-probe.sh ;;
            lint) bun run lint ;;
            test-files) bun scripts/run-manual-test-files.ts ;;
            verify-affected) bun run verify ;;
          esac 2>&1 | tee "$CHECK_LOG_FILE"
          echo "${PIPESTATUS[0]}" > "$CHECK_EXIT_FILE"

      - name: Write result
        if: always() && steps.validate.outcome != 'skipped'
        env:
          CHECK_SHA: ${{ github.sha }}
          CHECK_REF: ${{ github.ref }}
          CHECK_CHECK: ${{ inputs.check }}
          CHECK_TARGET: ${{ inputs.target }}
          CHECK_LOG_FILE: ${{ runner.temp }}/manual-check.log
          CHECK_EXIT_FILE: ${{ runner.temp }}/manual-check.exit
          CHECK_START_FILE: ${{ runner.temp }}/manual-check.start
        run: bun scripts/write-manual-check-result.ts

      - name: Upload result
        if: always() && steps.validate.outcome != 'skipped'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: manual-check-result
          path: manual-check-result.json

      - name: Set conclusion
        if: always() && steps.validate.outcome != 'skipped'
        env:
          CHECK_EXIT_FILE: ${{ runner.temp }}/manual-check.exit
        run: |
          # No exit file means a setup step failed before the check ran.
          if [[ ! -s "$CHECK_EXIT_FILE" ]]; then
            exit 1
          fi
          exit "$(cat "$CHECK_EXIT_FILE")"

  install-cache-windows:
    if: inputs.check == 'install-cache-benchmark'
    runs-on: windows-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        global-store: ["0", "1"]
    env:
      BUN_INSTALL_GLOBAL_STORE: "${{ matrix.global-store }}"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Bun binary
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - name: Measure scoped install
        id: install
        uses: $/.github/actions/ci-install
        with:
          cache-write: ${{ matrix.global-store == '1' && 'save' || 'restore' }}
          flags: '["--frozen-lockfile","--ignore-scripts","--filter","@stll/scripts...","--filter","@stll/desktop...","--filter","!stella"]'
      - name: Report measured phases
        if: always()
        env:
          CACHE_HIT: ${{ steps.install.outputs.cache-hit }}
          STORE_KEY: ${{ steps.install.outputs.key }}
          RESTORE_MS: ${{ steps.install.outputs.restore-ms }}
          INSTALL_MS: ${{ steps.install.outputs.install-ms }}
          INSTALL_OUTCOME: ${{ steps.install.outcome }}
        run: |
          bun -e '
            const ms = (value) => value === undefined || value === "" ? null : Number(value);
            const result = {os: process.platform, globalStore: process.env.BUN_INSTALL_GLOBAL_STORE, cacheHit: process.env.CACHE_HIT === "true", key: process.env.STORE_KEY, outcome: process.env.INSTALL_OUTCOME, restoreMs: ms(process.env.RESTORE_MS), installMs: ms(process.env.INSTALL_MS)};
            if ([result.restoreMs, result.installMs].some(value => value !== null && (!Number.isFinite(value) || value < 0))) throw new Error("Invalid phase timing");
            result.totalMs = result.restoreMs === null || result.installMs === null ? null : result.restoreMs + result.installMs;
            console.log(JSON.stringify(result));
            await Bun.write(process.env.RUNNER_TEMP + "/install-measurement.json", JSON.stringify(result, null, 2) + "\n");
            const file = Bun.file(process.env.GITHUB_STEP_SUMMARY);
            await Bun.write(file, JSON.stringify(result, null, 2).split("\n").map(line => "    " + line).join("\n") + "\n");
          '
      - name: Upload measurement
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: install-measurement-install-cache-windows-${{ matrix.global-store }}
          path: ${{ runner.temp }}/install-measurement.json
          if-no-files-found: error
          retention-days: 7

  install-cache-linux:
    if: inputs.check == 'install-cache-benchmark' || inputs.check == 'store-cache-save-benchmark'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      BUN_INSTALL_GLOBAL_STORE: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Bun binary
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - name: Measure scoped install
        id: install
        uses: $/.github/actions/ci-install
        with:
          flags: '["--frozen-lockfile","--ignore-scripts"]'
      - name: Register isolated cache save measurement
        if: inputs.check == 'store-cache-save-benchmark'
        continue-on-error: true
        uses: $/.github/actions/ci-store-save
        with:
          key: install-store-measurement-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.BUN_INSTALL_CACHE_DIR }}
      - name: Report measured phases
        if: always()
        env:
          CACHE_HIT: ${{ steps.install.outputs.cache-hit }}
          STORE_KEY: ${{ steps.install.outputs.key }}
          RESTORE_MS: ${{ steps.install.outputs.restore-ms }}
          INSTALL_MS: ${{ steps.install.outputs.install-ms }}
          INSTALL_OUTCOME: ${{ steps.install.outcome }}
        run: |
          bun -e '
            const ms = (value) => value === undefined || value === "" ? null : Number(value);
            const result = {os: process.platform, globalStore: process.env.BUN_INSTALL_GLOBAL_STORE, cacheHit: process.env.CACHE_HIT === "true", key: process.env.STORE_KEY, outcome: process.env.INSTALL_OUTCOME, restoreMs: ms(process.env.RESTORE_MS), installMs: ms(process.env.INSTALL_MS)};
            if ([result.restoreMs, result.installMs].some(value => value !== null && (!Number.isFinite(value) || value < 0))) throw new Error("Invalid phase timing");
            result.totalMs = result.restoreMs === null || result.installMs === null ? null : result.restoreMs + result.installMs;
            console.log(JSON.stringify(result));
            await Bun.write(process.env.RUNNER_TEMP + "/install-measurement.json", JSON.stringify(result, null, 2) + "\n");
            const file = Bun.file(process.env.GITHUB_STEP_SUMMARY);
            await Bun.write(file, JSON.stringify(result, null, 2).split("\n").map(line => "    " + line).join("\n") + "\n");
          '
      - name: Upload measurement
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: install-measurement-install-cache-linux-1
          path: ${{ runner.temp }}/install-measurement.json
          if-no-files-found: error
          retention-days: 7
