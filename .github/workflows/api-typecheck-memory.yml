name: API Typecheck Memory

on:
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/api-typecheck-memory.yml

permissions: {}

jobs:
  measure:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        memory-limit: [off, 3GiB]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: true
      - name: Setup Bun
        uses: stella/.github/actions/setup-bun-cached@167fb396c6c0f4e07296ad2cd72e6ef15367c776
        with:
          save: false
          bun-version-file: package.json
      - name: Install dependencies
        run: bun ci --ignore-scripts
        env:
          NPM_TOKEN: ""
      - name: Generate types
        run: |
          (cd packages/cli && bun run codegen:runtime)
          bun --filter @stll/api generate:capability-runtime
          bun run generate
          bun run typegen
      - name: Measure cold API programs
        env:
          GOMEMLIMIT: ${{ matrix.memory-limit }}
        run: |
          uname -a
          exec > >(tee api-typecheck-memory.log) 2>&1
          measurement_dir=$(mktemp -d)
          project_paths=$(bun -e 'const { scripts } = await Bun.file("apps/api/package.json").json(); console.log("apps/api/tsconfig.json"); for (const match of scripts.typecheck.matchAll(/-p\s+(\S+)/g)) console.log("apps/api/" + match[1]);')
          while IFS= read -r project; do
            echo "Measuring $project with GOMEMLIMIT=$GOMEMLIMIT"
            started=$SECONDS
            status=0
            /usr/bin/time -v -o "$measurement_dir/time.log" \
              bun packages/scripts/src/tsc-native.ts --noEmit --incremental false \
              --extendedDiagnostics -p "$project" \
              > "$measurement_dir/compiler.log" 2>&1 || status=$?
            elapsed=$((SECONDS - started))
            cat "$measurement_dir/compiler.log" "$measurement_dir/time.log"
            if [ "$status" -ne 0 ]; then
              exit "$status"
            fi
            for counter in Types Instantiations; do
              if ! rg -q "^$counter: +[1-9][0-9]*" "$measurement_dir/compiler.log"; then
                echo "Missing nonzero $counter counter: $project" >&2
                exit 1
              fi
            done
            if [ "$project" = apps/api/tsconfig.json ] && [ "$elapsed" -lt 10 ]; then
              echo "API main check finished in ${elapsed}s; refusing a no-op measurement" >&2
              exit 1
            fi
          done <<< "$project_paths"
      - name: Preserve measurement
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: api-typecheck-memory-${{ matrix.memory-limit }}
          path: api-typecheck-memory.log
          if-no-files-found: error
