name: User journeys

defaults:
  run:
    shell: bash

on:
  # Release-candidate staging runs these journeys itself; staging is off
  # otherwise, so a standing schedule would only fail or wake it.
  workflow_dispatch:
    inputs:
      target:
        description: Journey target
        required: true
        default: scheduled
        type: choice
        options:
          - staging
          - scheduled

permissions: {}

concurrency:
  group: user-journeys
  cancel-in-progress: false

jobs:
  staging-commit:
    name: Resolve the staging commit
    if: github.event_name == 'workflow_dispatch' && inputs.target == 'staging'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    outputs:
      commit: ${{ steps.deployed.outputs.commit }}
    steps:
      - name: Resolve the deployed commit
        id: deployed
        timeout-minutes: 3
        env:
          E2E_API_URL: https://api-staging.stll.app
          E2E_EDGE_HEADER_NAME: x-stella-edge-token
          E2E_EDGE_HEADER_VALUE: ${{ secrets.STAGING_VIEWER_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          body="$(curl --fail --silent --show-error --max-time 20 --retry 3 --retry-all-errors \
            --header "${E2E_EDGE_HEADER_NAME}: ${E2E_EDGE_HEADER_VALUE}" "$E2E_API_URL/health")"
          commit="$(printf '%s' "$body" | jq -r '.commit // empty')"
          if [[ ! "$commit" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Staging did not report its deployed commit on /health."
            exit 1
          fi
          echo "commit=$commit" >> "$GITHUB_OUTPUT"

  staging:
    name: Staging journeys
    needs: staging-commit
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
      packages: read
    env:
      CI_IMAGE_MIRROR_ENABLED: ${{ github.event.pull_request.head.repo.fork != true && github.token != '' }}
    steps:
      - name: Checkout the deployed commit
        id: source-checkout-the-deployed-commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.staging-commit.outputs.commit }}
          persist-credentials: false

      # Journeys run from the target revision, including its dependencies.
      - name: Require target journey harness
        run: |
          for required in .github/actions/user-journeys/action.yml apps/web/e2e/playwright.journeys.config.ts; do
            if [[ ! -f "$required" ]]; then
              echo "::error::The target commit must contain the journey harness: $required"
              exit 1
            fi
          done

      - name: Setup Bun
        uses: stella/.github/actions/setup-bun-cached@ba5f7da76aededf6f22814de93c72a49843fcc8e
        with:
          save: ${{ github.ref == 'refs/heads/main' }}

      - name: Install dependencies
        timeout-minutes: 8
        run: bash scripts/retry.sh bun ci --ignore-scripts
        env:
          NPM_TOKEN: ""

      - name: Login to GitHub Container Registry for browser images
        timeout-minutes: 2
        if: github.event.pull_request.head.repo.fork != true && github.token != ''
        continue-on-error: true
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Run staging journeys
        id: journeys
        timeout-minutes: 20
        uses: ./.github/actions/user-journeys
        with:
          project: deployed
          expected-commit: ${{ needs.staging-commit.outputs.commit }}
          health-url: https://api-staging.stll.app/health
        env:
          E2E_WEB_URL: https://staging.stll.app
          E2E_API_URL: https://api-staging.stll.app
          E2E_EDGE_HEADER_NAME: x-stella-edge-token
          E2E_EDGE_HEADER_VALUE: ${{ secrets.STAGING_VIEWER_ACCESS_TOKEN }}
          JOURNEY_SIGN_IN: smoke-session
          JOURNEY_SMOKE_SESSION_URL: https://api-staging.stll.app/smoke/session
          SMOKE_SESSION_SECRET: ${{ secrets.SMOKE_SESSION_SECRET }}

      - name: Upload Playwright report
        if: ${{ failure() && steps.journeys.outcome == 'failure' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: user-journeys-staging-report
          path: ${{ steps.journeys.outputs.report-paths }}
          retention-days: 7

  local-stack:
    name: Mock-model journeys
    needs: staging-commit
    # The registry token is only available to the protected main workflow.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      packages: read
    env:
      CI_IMAGE_MIRROR_ENABLED: ${{ github.event.pull_request.head.repo.fork != true && github.token != '' }}
    steps:
      - name: Checkout the deployed commit
        id: source-checkout-the-deployed-commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.staging-commit.outputs.commit }}
          persist-credentials: false

      # Journeys run from the target revision, including its dependencies.
      - name: Require target journey harness
        run: |
          for required in .github/actions/user-journeys/action.yml apps/web/e2e/playwright.journeys.config.ts; do
            if [[ ! -f "$required" ]]; then
              echo "::error::The target commit must contain the journey harness: $required"
              exit 1
            fi
          done

      - name: Setup Bun
        uses: stella/.github/actions/setup-bun-cached@ba5f7da76aededf6f22814de93c72a49843fcc8e
        with:
          save: ${{ github.ref == 'refs/heads/main' }}

      - name: Install dependencies
        timeout-minutes: 8
        run: bash scripts/retry.sh bun ci --ignore-scripts
        env:
          NPM_TOKEN: ""

      - name: Run mock-model journeys
        id: journeys
        timeout-minutes: 40
        uses: ./.github/actions/user-journeys
        with:
          project: local-stack
          expected-commit: ${{ needs.staging-commit.outputs.commit }}
          dockerhub-username: ${{ secrets.DOCKERHUB_USERNAME }}
          dockerhub-token: ${{ secrets.DOCKERHUB_TOKEN }}
        env:
          E2E_WEB_URL: http://localhost:3000
          E2E_API_URL: http://localhost:3001
          JOURNEY_SIGN_IN: seeded

      - name: Upload Playwright report
        if: ${{ failure() && steps.journeys.outcome == 'failure' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: user-journeys-local-stack-report
          path: |
            ${{ steps.journeys.outputs.report-paths }}
            /tmp/api.log
            ${{ runner.temp }}/web-user-journeys.log
          retention-days: 7

  scheduled:
    name: Scheduled target journeys
    if: github.event_name == 'workflow_dispatch' && inputs.target == 'scheduled'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
      packages: read
    env:
      CI_IMAGE_MIRROR_ENABLED: ${{ github.event.pull_request.head.repo.fork != true && github.token != '' }}
    steps:
      - name: Resolve the deployed commit
        id: deployed
        timeout-minutes: 3
        env:
          WEB_URL: ${{ vars.USER_JOURNEYS_WEB_URL }}
          API_URL: ${{ vars.USER_JOURNEYS_API_URL }}
        run: |
          set -euo pipefail
          if [[ -z "$WEB_URL" || -z "$API_URL" ]]; then
            echo "::error::Set the USER_JOURNEYS_WEB_URL and USER_JOURNEYS_API_URL repository variables."
            exit 1
          fi
          body="$(curl --fail --silent --show-error --max-time 20 --retry 3 --retry-all-errors "${API_URL%/}/health")"
          commit="$(printf '%s' "$body" | jq -r '.commit // empty')"
          if [[ ! "$commit" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::The scheduled target did not report its deployed commit on /health."
            exit 1
          fi
          {
            echo "commit=$commit"
            echo "web-url=${WEB_URL%/}"
            echo "api-url=${API_URL%/}"
          } >> "$GITHUB_OUTPUT"

      - name: Checkout the deployed commit
        id: source-checkout-the-deployed-commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.deployed.outputs.commit }}
          persist-credentials: false

      # Journeys run from the target revision, including its dependencies.
      - name: Require target journey harness
        run: |
          for required in .github/actions/user-journeys/action.yml apps/web/e2e/playwright.journeys.config.ts; do
            if [[ ! -f "$required" ]]; then
              echo "::error::The target commit must contain the journey harness: $required"
              exit 1
            fi
          done

      - name: Setup Bun
        uses: stella/.github/actions/setup-bun-cached@ba5f7da76aededf6f22814de93c72a49843fcc8e
        with:
          save: ${{ github.ref == 'refs/heads/main' }}

      - name: Install dependencies
        timeout-minutes: 8
        run: bash scripts/retry.sh bun ci --ignore-scripts
        env:
          NPM_TOKEN: ""

      - name: Login to GitHub Container Registry for browser images
        timeout-minutes: 2
        if: github.event.pull_request.head.repo.fork != true && github.token != ''
        continue-on-error: true
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Run scheduled target journeys
        id: journeys
        timeout-minutes: 20
        uses: ./.github/actions/user-journeys
        with:
          project: deployed
          expected-commit: ${{ steps.deployed.outputs.commit }}
          health-url: ${{ steps.deployed.outputs.api-url }}/health
        env:
          E2E_WEB_URL: ${{ steps.deployed.outputs.web-url }}
          E2E_API_URL: ${{ steps.deployed.outputs.api-url }}
          JOURNEY_SIGN_IN: review-account
          APP_REVIEW_ACCOUNT_EMAIL: ${{ vars.APP_REVIEW_ACCOUNT_EMAIL }}
          REVIEW_ACCOUNT_PASSWORD: ${{ secrets.REVIEW_ACCOUNT_PASSWORD }}

      - name: Upload Playwright report
        if: ${{ failure() && steps.journeys.outcome == 'failure' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: user-journeys-scheduled-report
          path: ${{ steps.journeys.outputs.report-paths }}
          retention-days: 7
