name: Deploy main to staging
run-name: ${{ inputs.release_ref != '' && format('Staging release proof {0} {1}', inputs.release_ref, inputs.sha || github.sha) || format('Deploy main to staging {0}', inputs.sha || github.sha) }}

defaults:
  run:
    shell: bash

# Deploys a commit on main into staging on demand: the tip by default, or a
# pinned `sha` on main or a verified same-repository release PR head, so a
# release candidate can be verified while main keeps moving. Evidence reuse requires an identical tree
# and a verified main/PR chain. Tags remain the production path.
#
# Staging is off unless someone starts it, so this runs only when
# dispatched. A release-candidate dispatch starts an off staging itself
# (staging-wake). Any other dispatch while staging is not answering deploys
# nothing and fails with a staging/verified error: start staging first, then dispatch again. To
# deploy a fix to a staging that is up but unhealthy, dispatch with
# deploy_when_unreachable.

on:
  workflow_dispatch:
    inputs:
      release_ref:
        description: "RC release whose manifest supplies the prebuilt staging images"
        required: false
        type: string
      release_candidate:
        description: "Validate the pending release VERSION before running this pinned gate"
        required: false
        type: boolean
        default: false
      sha:
        description: "Commit SHA to deploy (blank deploys main; release_candidate allows a release PR head)"
        required: false
        type: string
      proof_sha:
        description: "Reuse the release gates of a tree-identical commit instead of deploying again"
        required: false
        type: string
      waive_check:
        description: "Named staging check waiver (explicit SHA required)"
        type: choice
        options: [none, corpus-search]
        default: none
      waive_reason:
        description: "Required reason including evidence=<path> (single line, maximum 116 characters)"
        type: string
      deploy_when_unreachable:
        description: "Deploy even when staging does not answer its health probe"
        required: false
        default: false
        type: boolean

env:
  GIT_CONFIG_COUNT: "3"
  GIT_CONFIG_KEY_0: maintenance.auto
  GIT_CONFIG_VALUE_0: "false"
  GIT_CONFIG_KEY_1: gc.auto
  GIT_CONFIG_VALUE_1: "0"
  GIT_CONFIG_KEY_2: gc.autoDetach
  GIT_CONFIG_VALUE_2: "false"
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/stella-api
  WEB_IMAGE_NAME: ${{ github.repository_owner }}/stella-web

jobs:
  # The one commit every later job builds, promotes and verifies. Refusing
  # here fails the run before anything is built.
  resolve:
    name: Resolve the commit to deploy
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      statuses: read
      checks: read
      actions: read
      issues: read
      pull-requests: read
    outputs:
      sha: ${{ steps.resolve.outputs.sha }}
      tip: ${{ steps.resolve.outputs.tip }}
      main-sha: ${{ steps.resolve.outputs.main-sha }}
      reused: ${{ steps.proof.outputs.reused }}
      corpus_search_waived: ${{ steps.waiver.outputs.corpus_search_waived }}

    steps:
      - name: Checkout network retry helper
        timeout-minutes: 2
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.repository }}
          ref: ${{ github.workflow_sha }}
          path: .network-retry
          persist-credentials: false
          sparse-checkout: scripts/retry.sh
          sparse-checkout-cone-mode: false

      # The workflow's own helper: this job fetches before, or without, a
      # checkout of this revision into the workspace. These two steps run
      # only workflow-revision tooling; no candidate code runs before
      # "Check release candidate".
      - name: Stage network retry helper
        run: |
          mkdir -p "$RUNNER_TEMP/network-retry"
          cp "$GITHUB_WORKSPACE/.network-retry/scripts/retry.sh" "$RUNNER_TEMP/network-retry/retry.sh"
          echo "NETWORK_RETRY_SCRIPT=$RUNNER_TEMP/network-retry/retry.sh" >> "$GITHUB_ENV"

      - name: Require an explicit RC proof target
        if: inputs.release_ref != ''
        env:
          REQUESTED_SHA: ${{ inputs.sha }}
          RELEASE_CANDIDATE: ${{ inputs.release_candidate }}
        run: |
          [[ "$REQUESTED_SHA" =~ ^[0-9a-f]{40}$ && "$RELEASE_CANDIDATE" == true ]] || { echo '::error::RC proof requires sha and release_candidate=true'; exit 1; }

      - name: Check release candidate
        timeout-minutes: 5
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.sha != '' && inputs.release_candidate == true }}
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          SERVER_URL: ${{ github.server_url }}
          REQUESTED_SHA: ${{ inputs.sha }}
          RELEASE_PROOF_REPOSITORY: ${{ github.repository }}
          RELEASE_TREE_PROOF_VERIFIER: ${{ runner.temp }}/verify-release-tree-proof.sh
          GH_RETRY_SCRIPT: ${{ runner.temp }}/gh-retry.sh
        run: |
          set -euo pipefail
          directory="$RUNNER_TEMP/release-candidate-validation"
          mkdir -p "$directory"
          git -C "$directory" init
          git -C "$directory" remote add origin "$SERVER_URL/$REPOSITORY.git"
          auth=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 | tr -d '\n')
          echo "::add-mask::$auth"
          bash "$NETWORK_RETRY_SCRIPT" git -C "$directory" -c "http.extraheader=AUTHORIZATION: basic $auth" fetch --tags origin main:refs/remotes/origin/main
          git -C "$directory" show origin/main:scripts/check-release-candidate.sh > "$RUNNER_TEMP/check-release-candidate.sh"
          git -C "$directory" show origin/main:scripts/verify-release-tree-proof.sh > "$RUNNER_TEMP/verify-release-tree-proof.sh"
          git -C "$directory" show origin/main:scripts/retry.sh > "$RUNNER_TEMP/retry.sh"
          git -C "$directory" show origin/main:scripts/verify-release-candidate-tree.mjs > "$RUNNER_TEMP/verify-release-candidate-tree.mjs"
          git -C "$directory" show origin/main:scripts/gh-retry.sh > "$RUNNER_TEMP/gh-retry.sh"
          bash "$NETWORK_RETRY_SCRIPT" git -C "$directory" -c "http.extraheader=AUTHORIZATION: basic $auth" fetch --no-tags origin "$REQUESTED_SHA"
          cd "$directory"
          bash "$RUNNER_TEMP/check-release-candidate.sh" "$REQUESTED_SHA"

      - name: Validate staging waiver
        id: waiver
        env:
          WAIVE_CHECK: ${{ inputs.waive_check || 'none' }}
          WAIVE_REASON: ${{ inputs.waive_reason }}
          REQUESTED_SHA: ${{ inputs.sha }}
        run: |
          set -euo pipefail
          case "$WAIVE_CHECK" in
            none) echo "corpus_search_waived=false" >> "$GITHUB_OUTPUT" ;;
            corpus-search)
              if [[ "$GITHUB_EVENT_NAME" != "workflow_dispatch" || -z "${REQUESTED_SHA//[[:space:]]/}" ]]; then
                echo "::error::The corpus-search waiver requires a manual dispatch with an explicit SHA."
                exit 1
              fi
              if [[ -z "${WAIVE_REASON//[[:space:]]/}" || "$WAIVE_REASON" == *$'\n'* || "$WAIVE_REASON" == *$'\r'* ]] || (( ${#WAIVE_REASON} > 116 )); then
                echo "::error::The corpus-search waiver requires a non-empty single-line reason of at most 116 characters."
                exit 1
              fi
              evidence_path='(^|[[:space:]])evidence=[^[:space:]]*/[^[:space:]]+($|[[:space:]])'
              if [[ ! "$WAIVE_REASON" =~ $evidence_path ]]; then
                echo "::error::The corpus-search waiver reason must include evidence=<path>."
                exit 1
              fi
              echo "corpus_search_waived=true" >> "$GITHUB_OUTPUT"
              ;;
            *) echo "::error::Unknown staging check waiver."; exit 1 ;;
          esac

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # Bun runs the release queue history check the pinned-proof health gate
      # needs before a merge-group receipt may stand in for the heavy statuses.
      - name: Setup Bun
        if: inputs.proof_sha != ''
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: package.json
          no-cache: true

      - name: Resolve the commit to deploy
        timeout-minutes: 5
        id: resolve
        env:
          REQUESTED_SHA: ${{ inputs.sha }}
          GH_TOKEN: ${{ github.token }}
          RELEASE_PR_HEAD: ${{ inputs.release_candidate && inputs.sha != '' }}
          RELEASE_TREE_PROOF_VERIFIER: ${{ github.workspace }}/scripts/verify-release-tree-proof.sh
        run: bash scripts/resolve-staging-deploy-sha.sh --sha "$REQUESTED_SHA" >> "$GITHUB_OUTPUT"

      - name: Verify pinned release proof
        timeout-minutes: 5
        id: proof
        if: inputs.proof_sha != ''
        env:
          GH_TOKEN: ${{ github.token }}
          DEPLOY_SHA: ${{ steps.resolve.outputs.sha }}
          PROOF_SHA: ${{ inputs.proof_sha }}
          WAIVE_CHECK: ${{ inputs.waive_check || 'none' }}
        run: |
          [[ "$WAIVE_CHECK" == none ]] || { echo '::error::Proof reuse cannot add a staging waiver'; exit 1; }
          bash scripts/verify-release-tree-proof.sh "$GITHUB_REPOSITORY" "$DEPLOY_SHA" "$PROOF_SHA" >/dev/null
          bash scripts/check-release-main-health.sh "$GITHUB_REPOSITORY" "$DEPLOY_SHA" "$PROOF_SHA"
          echo "reused=true" >> "$GITHUB_OUTPUT"

  # Tie promotion and its dependent smoke job to the current health of the
  # staging environment.
  staging-health:
    name: Check staging health
    needs: resolve
    if: github.ref == 'refs/heads/main' && needs.resolve.outputs.reused != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      statuses: write
    outputs:
      deploy: ${{ steps.decide.outputs.deploy }}
      wake: ${{ steps.decide.outputs.wake }}

    steps:
      - name: Checkout GitHub API tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.repository }}
          ref: ${{ github.workflow_sha }}
          path: .gh-retry
          persist-credentials: false
          sparse-checkout: |
            scripts/gh-retry.sh
            scripts/post-staging-verification.sh
          sparse-checkout-cone-mode: false

      - name: Preserve GitHub API tooling across source checkouts
        run: |
          cp "$GITHUB_WORKSPACE/.gh-retry/scripts/gh-retry.sh" "$RUNNER_TEMP/gh-retry.sh"
          echo "GH_RETRY_SCRIPT=$RUNNER_TEMP/gh-retry.sh" >> "$GITHUB_ENV"

      - name: Preserve release verification tooling across source checkouts
        run: |
          cp "$GITHUB_WORKSPACE/.gh-retry/scripts/post-staging-verification.sh" "$RUNNER_TEMP/post-staging-verification.sh"
          echo "STAGING_STATUS_WRITER=$RUNNER_TEMP/post-staging-verification.sh" >> "$GITHUB_ENV"

      - name: Probe staging health
        timeout-minutes: 3
        id: probe
        env:
          STAGING_HEALTH_URL: https://api-staging.stll.app/ready
          STAGING_LEGACY_HEALTH_URL: https://api-staging.stll.app/health
          EDGE_HEADER_NAME: x-stella-edge-token
          EDGE_HEADER_VALUE: ${{ secrets.STAGING_VIEWER_ACCESS_TOKEN }}
        run: |
          set -euo pipefail

          # Optional edge access header on the probes; no-op when unset.
          curl_edge_args=()
          if [[ -n "${EDGE_HEADER_NAME:-}" && -n "${EDGE_HEADER_VALUE:-}" ]]; then
            curl_edge_args+=(--header "${EDGE_HEADER_NAME}: ${EDGE_HEADER_VALUE}")
          fi

          readonly READY_STATUS="ready"
          readonly NOT_READY_STATUS="not_ready"
          readonly MAX_ATTEMPTS=3
          readonly RETRY_SECONDS=5

          response_file="$RUNNER_TEMP/staging-health.json"
          status="$NOT_READY_STATUS"
          served_commit=""
          for ((attempt = 1; attempt <= MAX_ATTEMPTS; attempt += 1)); do
            http_status="000"
            if ! http_status="$(
              curl \
                --connect-timeout 5 \
                --max-time 10 \
                --output "$response_file" \
                --silent \
                --show-error \
                --write-out '%{http_code}' \
                ${curl_edge_args[@]+"${curl_edge_args[@]}"} \
                "$STAGING_HEALTH_URL"
            )"; then
              http_status="000"
            fi

            if [[ "$http_status" == "404" ]]; then
              echo "Staging does not expose /ready; checking the legacy /health endpoint."
              if ! http_status="$(
                curl \
                  --connect-timeout 5 \
                  --max-time 10 \
                  --output "$response_file" \
                  --silent \
                  --show-error \
                  --write-out '%{http_code}' \
                  ${curl_edge_args[@]+"${curl_edge_args[@]}"} \
                  "$STAGING_LEGACY_HEALTH_URL"
              )"; then
                http_status="000"
              fi
            fi

            if [[ "$http_status" == "200" ]] &&
              jq -e '.status == "ok"' "$response_file" >/dev/null 2>&1; then
              status="$READY_STATUS"
              served_commit="$(jq -r '.commit // ""' "$response_file")"
              break
            fi

            echo "Staging health probe ${attempt}/${MAX_ATTEMPTS} returned HTTP ${http_status}."
            if (( attempt < MAX_ATTEMPTS )); then
              sleep "$RETRY_SECONDS"
            fi
          done

          echo "status=${status}" >> "$GITHUB_OUTPUT"
          echo "served_commit=${served_commit}" >> "$GITHUB_OUTPUT"

      # Staging that does not answer is normally off. Deploying into it would
      # leave the smoke below measuring an environment that is not running.
      # A release candidate hands an off staging to staging-wake, which
      # starts it; every other dispatch is refused here.
      - name: Decide whether staging can deploy
        id: decide
        env:
          GH_TOKEN: ${{ github.token }}
          DEPLOY_SHA: ${{ needs.resolve.outputs.sha }}
          DEPLOY_WHEN_UNREACHABLE: ${{ inputs.deploy_when_unreachable }}
          RELEASE_CANDIDATE: ${{ inputs.release_candidate == true && inputs.sha != '' }}
          STATUS: ${{ steps.probe.outputs.status }}
        run: |
          set -euo pipefail

          if [[ "$STATUS" == "ready" ]]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [[ "$DEPLOY_WHEN_UNREACHABLE" == "true" ]]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
            echo "::notice::Staging is not answering; deploying anyway as requested."
            exit 0
          fi

          if [[ "${RELEASE_CANDIDATE:-false}" == "true" ]]; then
            echo "deploy=false" >> "$GITHUB_OUTPUT"
            echo "wake=true" >> "$GITHUB_OUTPUT"
            echo "::notice::Staging is not answering; starting it for this release candidate."
            exit 0
          fi

          echo "deploy=false" >> "$GITHUB_OUTPUT"
          {
            echo "### Staging is off"
            echo "Staging is not answering its health probe, so \`${DEPLOY_SHA}\` was not deployed."
            echo "Start staging, then dispatch this workflow again."
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::error::staging off: nothing was deployed. Start staging, then dispatch again."
          bash "$STAGING_STATUS_WRITER" error "staging off"
          exit 1

  # Starts an off staging for a release candidate: staging-power.yml in the
  # infra repository with action=on and a 2 h lease, then waits until /ready
  # answers. A failed or timed-out start refuses like an off staging does.
  # Only this job holds the App key, and only release candidates reach it.
  staging-wake:
    name: Start staging for a release candidate
    needs: [resolve, staging-health]
    if: >-
      github.ref == 'refs/heads/main' &&
      inputs.release_candidate == true &&
      inputs.sha != '' &&
      needs.staging-health.outputs.wake == 'true'
    runs-on: ubuntu-24.04
    # Covers the script's bounds: 15 minutes for the start run and 45 for
    # readiness.
    timeout-minutes: 70
    permissions:
      contents: read
      statuses: write
    # Release App key lives in this environment (main and v* tags only).
    environment: release-app
    outputs:
      deploy: ${{ steps.wake.outputs.deploy }}

    steps:
      - name: Checkout GitHub API tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.repository }}
          ref: ${{ github.workflow_sha }}
          path: .gh-retry
          persist-credentials: false
          sparse-checkout: |
            scripts/gh-retry.sh
            scripts/staging-wake.sh
            scripts/post-staging-verification.sh
          sparse-checkout-cone-mode: false

      - name: Preserve GitHub API tooling across source checkouts
        run: |
          cp "$GITHUB_WORKSPACE/.gh-retry/scripts/gh-retry.sh" "$RUNNER_TEMP/gh-retry.sh"
          echo "GH_RETRY_SCRIPT=$RUNNER_TEMP/gh-retry.sh" >> "$GITHUB_ENV"

      # Scoped to the infra repository with actions: write, as the promote
      # dispatch is. A failed mint leaves the token empty, and the next step
      # still runs to refuse with the staging/verified error.
      - name: Preserve release verification tooling across source checkouts
        run: |
          cp "$GITHUB_WORKSPACE/.gh-retry/scripts/post-staging-verification.sh" "$RUNNER_TEMP/post-staging-verification.sh"
          echo "STAGING_STATUS_WRITER=$RUNNER_TEMP/post-staging-verification.sh" >> "$GITHUB_ENV"

      - name: Mint staging power token
        id: power-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.STELLA_RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.STELLA_RELEASE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ vars.STAGING_DEPLOY_REPOSITORY }}
          permission-actions: write

      - name: Start staging and wait until it is ready
        id: wake
        if: ${{ !cancelled() && steps.power-token.outcome != 'skipped' }}
        timeout-minutes: 65
        env:
          GH_TOKEN: ${{ github.token }}
          STAGING_POWER_TOKEN: ${{ steps.power-token.outputs.token }}
          INFRA_REPO: ${{ github.repository_owner }}/${{ vars.STAGING_DEPLOY_REPOSITORY }}
          DEPLOY_SHA: ${{ needs.resolve.outputs.sha }}
          STAGING_HEALTH_URL: https://api-staging.stll.app/ready
          EDGE_HEADER_NAME: x-stella-edge-token
          EDGE_HEADER_VALUE: ${{ secrets.STAGING_VIEWER_ACCESS_TOKEN }}
        run: bash .gh-retry/scripts/staging-wake.sh

  # `!cancelled()` lets the builds run after a skipped staging-wake; they
  # still build only when one of the two jobs above says deploy.
  build-api:
    name: Build staging API image
    needs: [resolve, staging-health, staging-wake]
    if: >-
      !cancelled() && inputs.release_ref == '' &&
      github.ref == 'refs/heads/main' &&
      (needs.staging-health.outputs.deploy == 'true' ||
      needs.staging-wake.outputs.deploy == 'true')
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
      artifact-metadata: write
    concurrency:
      group: staging-api-build-${{ needs.resolve.outputs.sha }}
      cancel-in-progress: true
    outputs:
      digest: ${{ steps.build.outputs.digest }}
      release-ref: ${{ steps.ref.outputs.release_ref }}

    steps:
      - name: Resolve synthetic ref
        id: ref
        env:
          SHA: ${{ needs.resolve.outputs.sha }}
        run: |
          short="${SHA:0:7}"
          echo "release_ref=main-${short}" >> "$GITHUB_OUTPUT"
          echo "short_sha=${short}" >> "$GITHUB_OUTPUT"

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve.outputs.sha }}
          persist-credentials: false
          # The API image ships the bundled template-pack content.
          submodules: true

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: package.json
          no-cache: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Login to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # A pinned commit may predate the pull script, so it runs from the
      # workflow revision; the copy is removed before it can enter the build
      # context.
      - name: Checkout workflow tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          path: .workflow-tooling
          persist-credentials: false
          sparse-checkout: |
            scripts/ci-service-images.ts
            scripts/ci-service-images.json
            packages/scripts/src/child-exit-status.ts
            packages/portable-path/src/index.ts
            scripts/retry.sh
          sparse-checkout-cone-mode: false

      - name: Resolve API base images
        id: base-contexts
        env:
          CI_IMAGE_MIRROR_ENABLED: ${{ github.event.pull_request.head.repo.fork != true && github.token != '' }}
        run: |
          echo 'contexts<<CI_IMAGE_CONTEXTS' >> "$GITHUB_OUTPUT"
          bun .workflow-tooling/scripts/ci-service-images.ts --pull apps/api/Dockerfile
          bun .workflow-tooling/scripts/ci-service-images.ts --build-contexts apps/api/Dockerfile >> "$GITHUB_OUTPUT"
          echo 'CI_IMAGE_CONTEXTS' >> "$GITHUB_OUTPUT"
          rm -rf .workflow-tooling

      - name: Build and push image
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: apps/api/Dockerfile
          build-contexts: ${{ steps.base-contexts.outputs.contexts }}
          platforms: linux/arm64
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.ref.outputs.release_ref }}
            ${{ needs.resolve.outputs.tip == 'true' && format('{0}/{1}:main-latest', env.REGISTRY, env.IMAGE_NAME) || '' }}
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache-staging
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache-staging,mode=max
          build-args: |
            STELLA_VERSION=${{ steps.ref.outputs.release_ref }}
            STELLA_COMMIT_SHA=${{ needs.resolve.outputs.sha }}

      # Attestation tooling comes from the workflow revision, after building,
      # so it cannot alter the pinned source or its Docker context.
      - name: Checkout attestation tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          path: .workflow-actions
          persist-credentials: false
          sparse-checkout: |
            .github/actions/provenance
            scripts/staging-source-predicate.sh
          sparse-checkout-cone-mode: false

      - name: Attest image provenance
        uses: ./.workflow-actions/.github/actions/provenance
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.build.outputs.digest }}
          source-sha: ${{ needs.resolve.outputs.sha }}
          main-sha: ${{ needs.resolve.outputs.main-sha }}

  build-web:
    name: Build staging web image
    needs: [resolve, staging-health, staging-wake]
    if: >-
      !cancelled() && inputs.release_ref == '' &&
      github.ref == 'refs/heads/main' &&
      (needs.staging-health.outputs.deploy == 'true' ||
      needs.staging-wake.outputs.deploy == 'true')
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
      artifact-metadata: write
    concurrency:
      group: staging-web-build-${{ needs.resolve.outputs.sha }}
      cancel-in-progress: true
    outputs:
      digest: ${{ steps.build.outputs.digest }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve.outputs.sha }}
          persist-credentials: false

      - name: Resolve synthetic ref
        id: ref
        env:
          SHA: ${{ needs.resolve.outputs.sha }}
        run: |
          echo "release-ref=main-${SHA:0:7}" >>"$GITHUB_OUTPUT"

      - name: Build and publish web image
        id: build
        timeout-minutes: 45
        uses: ./.github/actions/build-web-image
        with:
          release-ref: ${{ steps.ref.outputs.release-ref }}
          release-sha: ${{ needs.resolve.outputs.sha }}
          target-environment: staging
          posthog-key: ${{ secrets.VITE_POSTHOG_KEY }}
          posthog-cli-api-key: ${{ secrets.POSTHOG_CLI_API_KEY }}
          posthog-project-id: ${{ vars.POSTHOG_PROJECT_ID }}

      # Attestation tooling comes from the workflow revision, after building,
      # so it cannot alter the pinned source or its Docker context.
      - name: Checkout attestation tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          path: .workflow-actions
          persist-credentials: false
          sparse-checkout: |
            .github/actions/provenance
            scripts/staging-source-predicate.sh
          sparse-checkout-cone-mode: false

      - name: Attest web image provenance
        uses: ./.workflow-actions/.github/actions/provenance
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.WEB_IMAGE_NAME }}
          subject-digest: ${{ steps.build.outputs.digest }}
          source-sha: ${{ needs.resolve.outputs.sha }}
          main-sha: ${{ needs.resolve.outputs.main-sha }}

      - name: Log out of GitHub Container Registry
        if: always()
        run: docker logout ghcr.io

  # The builds run after a skipped wake when staging was already up. A job's
  # default condition skips it when any job it depends on through `needs` was
  # skipped, which promoted nothing yet ended the run green, so promotion
  # names the build results it depends on instead.
  promote-staging:
    name: Promote staging images
    needs: [resolve, staging-health, staging-wake, build-api, build-web]
    if: >-
      !cancelled() && github.ref == 'refs/heads/main' &&
      needs.resolve.result == 'success' &&
      ((inputs.release_ref != '' &&
      (needs.staging-health.outputs.deploy == 'true' || needs.staging-wake.outputs.deploy == 'true')) ||
      (needs.build-api.result == 'success' && needs.build-web.result == 'success'))
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    # Deployment and its smoke verification are one serialized side-effecting
    # unit. Public builds may be cancelled; this job may not be interrupted
    # after it dispatches Terraform work into the private repository.
    concurrency:
      group: ${{ inputs.release_ref != '' && 'deploy-staging-candidate' || 'deploy-staging-ordinary' }}
      cancel-in-progress: false
    permissions:
      contents: read
      packages: read
      deployments: write
      statuses: write
    # Release App key lives in this environment (main and v* tags only).
    environment: release-app
    env:
      CI_IMAGE_MIRROR_ENABLED: ${{ github.event.pull_request.head.repo.fork != true && github.token != '' }}
    steps:
      - name: Checkout GitHub API tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.repository }}
          ref: ${{ github.workflow_sha }}
          path: .gh-retry
          persist-credentials: false
          sparse-checkout: |
            scripts/gh-retry.sh
            scripts/post-staging-verification.sh
            scripts/staging-owner.sh
            scripts/check-api-deployment.ts
            scripts/api-health.ts
          sparse-checkout-cone-mode: false

      - name: Preserve GitHub API tooling across source checkouts
        run: |
          cp "$GITHUB_WORKSPACE/.gh-retry/scripts/gh-retry.sh" "$RUNNER_TEMP/gh-retry.sh"
          echo "GH_RETRY_SCRIPT=$RUNNER_TEMP/gh-retry.sh" >> "$GITHUB_ENV"

      - name: Preserve release verification tooling across source checkouts
        run: |
          cp "$GITHUB_WORKSPACE/.gh-retry/scripts/post-staging-verification.sh" "$RUNNER_TEMP/post-staging-verification.sh"
          echo "STAGING_STATUS_WRITER=$RUNNER_TEMP/post-staging-verification.sh" >> "$GITHUB_ENV"
          cp "$GITHUB_WORKSPACE/.gh-retry/scripts/check-api-deployment.ts" "$RUNNER_TEMP/check-api-deployment.ts"
          cp "$GITHUB_WORKSPACE/.gh-retry/scripts/api-health.ts" "$RUNNER_TEMP/api-health.ts"

      - name: Checkout workflow actions
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false

      - name: Check staging deployment target is configured
        env:
          DEPLOY_REPOSITORY: ${{ github.repository_owner }}/${{ vars.STAGING_DEPLOY_REPOSITORY }}
          DEPLOY_WORKFLOW: ${{ vars.STAGING_DEPLOY_WORKFLOW }}
        run: |
          if [[ -z "${DEPLOY_REPOSITORY#*/}" || -z "$DEPLOY_WORKFLOW" ]]; then
            echo "::error::Staging deployment target is not configured." >&2
            exit 1
          fi

      # Watches the dispatched run to completion: a promote that fails after
      # the dispatch is accepted must fail this job, so verify-staging is
      # skipped by `needs` instead of blocking on a commit that will never
      # be served.
      - name: Resolve RC manifest images
        timeout-minutes: 5
        id: rc-images
        if: inputs.release_ref != ''
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_REF: ${{ inputs.release_ref }}
          DEPLOY_SHA: ${{ needs.resolve.outputs.sha }}
        run: |
          [[ "$RELEASE_REF" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-rc\.[1-9][0-9]*$ ]] || { echo '::error::Expected an RC tag'; exit 1; }
          mkdir -p "$RUNNER_TEMP/rc-manifest"
          bash "$GH_RETRY_SCRIPT" release download "$RELEASE_REF" --pattern release-manifest.json --dir "$RUNNER_TEMP/rc-manifest"
          manifest="$RUNNER_TEMP/rc-manifest/release-manifest.json"
          jq -e --arg sha "$DEPLOY_SHA" --arg ref "$RELEASE_REF" '.commit == $sha and .version == $ref and .webImage.targetEnvironment == "staging"' "$manifest" >/dev/null
          echo "api=$(jq -er '.image.digest' "$manifest")" >> "$GITHUB_OUTPUT"
          echo "web=$(jq -er '.webImage.digest' "$manifest")" >> "$GITHUB_OUTPUT"

      - name: Wait for the current staging owner
        timeout-minutes: 10
        env:
          GH_TOKEN: ${{ github.token }}
          STAGING_OWNER_MODE: ${{ inputs.release_ref != '' && 'candidate' || 'ordinary' }}
        run: bash .gh-retry/scripts/staging-owner.sh

      - name: Deploy to staging
        # Waits for the infra staging promote; the job's other steps keep the rest.
        timeout-minutes: 350
        uses: ./.github/actions/promote-dispatch
        with:
          app-client-id: ${{ vars.STELLA_RELEASE_APP_CLIENT_ID }}
          app-private-key: ${{ secrets.STELLA_RELEASE_APP_PRIVATE_KEY }}
          infra-repo: ${{ github.repository_owner }}/${{ vars.STAGING_DEPLOY_REPOSITORY }}
          workflow-file: ${{ vars.STAGING_DEPLOY_WORKFLOW }}
          release-ref: ${{ inputs.release_ref || needs.build-api.outputs.release-ref }}
          target-environment: staging
          image-digest: ${{ steps.rc-images.outputs.api || needs.build-api.outputs.digest }}
          web-image-digest: ${{ steps.rc-images.outputs.web || needs.build-web.outputs.digest }}
          git-sha: ${{ inputs.release_ref == '' && needs.resolve.outputs.sha || '' }}
          # The infrastructure promote holds its own lease while it runs: the
          # first lease bridges until it starts, the second covers every later
          # step's timeout-minutes (scripts/staging-proof-lease.test.ts).
          staging-lease-before-hours: ${{ inputs.release_ref != '' && '1' || '' }}
          staging-lease-after-hours: ${{ inputs.release_ref != '' && '3' || '' }}
          staging-lease-sha: ${{ inputs.release_ref != '' && needs.resolve.outputs.sha || '' }}

      # The commit staging is running, recorded where it outlives this run.
      - name: Record staging deployment
        timeout-minutes: 2
        id: deployment
        env:
          DEPLOY_ENVIRONMENT: staging
          DEPLOY_SHA: ${{ needs.resolve.outputs.sha }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          deployment_id="$(
            jq -n \
              --arg ref "$DEPLOY_SHA" \
              --arg environment "$DEPLOY_ENVIRONMENT" \
              '{
                ref: $ref,
                environment: $environment,
                auto_merge: false,
                required_contexts: [],
                production_environment: false,
                description: "Deploy of main to staging"
              }' |
              bash "$GH_RETRY_SCRIPT" api "repos/${GITHUB_REPOSITORY}/deployments" \
                --method POST --input - --jq '.id'
          )"

          echo "id=${deployment_id}" >>"$GITHUB_OUTPUT"

          jq -n '{state: "in_progress", environment_url: "https://staging.stll.app"}' |
            bash "$GH_RETRY_SCRIPT" api "repos/${GITHUB_REPOSITORY}/deployments/${deployment_id}/statuses" \
              --method POST --input - >/dev/null

          bash "$STAGING_STATUS_WRITER" pending "Staging smoke pending: run $GITHUB_RUN_ID"

      # Post-deploy verification stays in the serialized promotion job. If it
      # were a separate job, a newer promotion could start while this smoke
      # still measures the previous commit.
      - name: Checkout deployed source
        timeout-minutes: 3
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve.outputs.sha }}
          persist-credentials: false

      # Journeys run from the target revision, including its dependencies.
      - name: Require target journey harness
        timeout-minutes: 2
        run: |
          for required in .github/actions/user-journeys/action.yml apps/web/e2e/playwright.journeys.config.ts; do
            if [[ ! -f "$required" ]]; then
              echo "::error::The target commit must contain the journey harness: $required"
              exit 1
            fi
          done

      - name: Setup Bun
        timeout-minutes: 3
        uses: stella/.github/actions/setup-bun-cached@a6a6cd30646c18321ef71e344bf0af6b8d3634b8
        with:
          save: ${{ github.ref == 'refs/heads/main' }}

      - name: Verify staging serves the release commit and environment
        timeout-minutes: 10
        env:
          API_DEPLOYMENT_EXPECTED_COMMIT: ${{ needs.resolve.outputs.sha }}
          API_DEPLOYMENT_EXPECTED_ENVIRONMENT: staging
          API_DEPLOYMENT_PROBE_PATH: ready
          API_DEPLOYMENT_URL: https://api-staging.stll.app
          EDGE_HEADER_NAME: x-stella-edge-token
          EDGE_HEADER_VALUE: ${{ secrets.STAGING_VIEWER_ACCESS_TOKEN }}
        run: bun --no-install "$RUNNER_TEMP/check-api-deployment.ts"

      - name: Install dependencies
        timeout-minutes: 5
        id: smoke-deps
        run: bash scripts/retry.sh bun ci --ignore-scripts
        env:
          NPM_TOKEN: ""

      - name: Login to GitHub Container Registry for browser images
        if: ${{ !cancelled() && steps.smoke-deps.conclusion == 'success' && github.event.pull_request.head.repo.fork != true && github.token != '' }}
        timeout-minutes: 2
        continue-on-error: true
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify image-provided Chromium
        timeout-minutes: 4
        uses: ./.github/actions/setup-playwright

      - name: Run staging web smoke
        timeout-minutes: 30
        id: web-smoke
        run: bash "$GITHUB_WORKSPACE/.github/actions/setup-playwright/run-in-image.sh" bun --filter @stll/web test:e2e:staging
        env:
          STAGING_STATE: ${{ vars.STAGING_STATE }}
          E2E_WEB_URL: https://staging.stll.app
          E2E_API_URL: https://api-staging.stll.app
          SMOKE_SESSION_SECRET: ${{ secrets.SMOKE_SESSION_SECRET }}
          E2E_EDGE_HEADER_NAME: x-stella-edge-token
          E2E_EDGE_HEADER_VALUE: ${{ secrets.STAGING_VIEWER_ACCESS_TOKEN }}
          # Block the smoke until staging actually serves this commit,
          # so it doesn't race the ECS task rollover.
          EXPECTED_COMMIT: ${{ needs.resolve.outputs.sha }}

      # The declared cache and robots headers of Knowledge responses. Also
      # runs on its own through staging-response-policy.yml. Report-only
      # until it has a record of green runs.
      - name: Run staging response policy checks
        timeout-minutes: 5
        if: ${{ !cancelled() && steps.smoke-deps.conclusion == 'success' }}
        continue-on-error: true
        run: |
          if bun apps/api/src/scripts/post-deploy-response-policy.ts; then
            echo "Staging response policy checks passed." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning title=Staging response policy checks failed (report-only)::See the step log for the failed checks."
            echo "Staging response policy checks FAILED (report-only, promotion not blocked). See the step log." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
        env:
          E2E_WEB_URL: https://staging.stll.app
          E2E_API_URL: https://api-staging.stll.app
          E2E_EDGE_HEADER_NAME: x-stella-edge-token
          E2E_EDGE_HEADER_VALUE: ${{ secrets.STAGING_VIEWER_ACCESS_TOKEN }}

      # `!cancelled()` keeps this signal when the web smoke fails, but it
      # also suppresses the implicit success() gate, so without the explicit
      # deps condition this step ran after a failed deploy with no toolchain
      # installed and died with `bun: command not found`.
      - name: Run staging API chat smoke
        timeout-minutes: 5
        id: api-smoke
        if: ${{ !cancelled() && steps.smoke-deps.conclusion == 'success' }}
        run: bun apps/api/src/scripts/post-deploy-smoke.ts "$E2E_API_URL"
        env:
          E2E_API_URL: https://api-staging.stll.app
          SMOKE_SESSION_SECRET: ${{ secrets.SMOKE_SESSION_SECRET }}
          E2E_EDGE_HEADER_NAME: x-stella-edge-token
          E2E_EDGE_HEADER_VALUE: ${{ secrets.STAGING_VIEWER_ACCESS_TOKEN }}
          EXPECTED_COMMIT: ${{ needs.resolve.outputs.sha }}
          # The real model turn runs in the next step.
          SMOKE_AI_JOURNEY: skip

      # Report-only until reviewed on 2026-10-02: a failure is annotated and
      # summarized but does not fail the promotion. To make it blocking,
      # delete the `continue-on-error: true` line below.
      - name: Run staging API model-turn smoke
        timeout-minutes: 5
        if: ${{ !cancelled() && steps.smoke-deps.conclusion == 'success' }}
        continue-on-error: true
        run: |
          if bun apps/api/src/scripts/post-deploy-smoke.ts "$E2E_API_URL"; then
            echo "Staging model-turn smoke passed." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning title=Staging model-turn smoke failed (report-only)::See the step log for the failed checks."
            echo "Staging model-turn smoke FAILED (report-only, promotion not blocked). See the step log." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
        env:
          E2E_API_URL: https://api-staging.stll.app
          SMOKE_SESSION_SECRET: ${{ secrets.SMOKE_SESSION_SECRET }}
          E2E_EDGE_HEADER_NAME: x-stella-edge-token
          E2E_EDGE_HEADER_VALUE: ${{ secrets.STAGING_VIEWER_ACCESS_TOKEN }}
          EXPECTED_COMMIT: ${{ needs.resolve.outputs.sha }}
          SMOKE_AI_JOURNEY: only
          SMOKE_AI_OPENAI_API_KEY: ${{ secrets.STAGING_SMOKE_OPENAI_API_KEY }}

      - name: Check staging corpus search backend
        id: corpus-preflight
        continue-on-error: ${{ needs.resolve.outputs.corpus_search_waived == 'true' }}
        if: ${{ !cancelled() && steps.smoke-deps.conclusion == 'success' }}
        timeout-minutes: 2
        env:
          E2E_API_URL: https://api-staging.stll.app
          E2E_EDGE_HEADER_NAME: x-stella-edge-token
          E2E_EDGE_HEADER_VALUE: ${{ secrets.STAGING_VIEWER_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          curl_edge_args=()
          if [[ -n "${E2E_EDGE_HEADER_NAME:-}" && -n "${E2E_EDGE_HEADER_VALUE:-}" ]]; then
            curl_edge_args+=(--header "${E2E_EDGE_HEADER_NAME}: ${E2E_EDGE_HEADER_VALUE}")
          fi
          response_file="$RUNNER_TEMP/staging-corpus-search.json"
          http_status="000"
          if ! http_status="$(curl --connect-timeout 5 --max-time 30 \
            --silent --show-error --output "$response_file" --write-out '%{http_code}' \
            --header 'Content-Type: application/json' \
            ${curl_edge_args[@]+"${curl_edge_args[@]}"} \
            --data '{"query":"contract","country":"CZ","limit":1,"strict":true}' \
            "${E2E_API_URL}/v1/case/decisions/search")"; then
            http_status="000"
          fi
          if [[ "$http_status" != "200" ]] || ! jq -e \
            'type == "object" and (.hits | type == "array") and (.queryUsed | type == "string" and length > 0) and has("total") and (has("message") | not)' \
            "$response_file" >/dev/null 2>&1; then
            echo "::error title=corpus index down::Staging case-law search preflight failed (HTTP ${http_status}); MCP smoke cannot verify search without its backend."
            echo "corpus index down: staging case-law search preflight failed (HTTP ${http_status})." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo "Staging corpus search backend answered the preflight." >> "$GITHUB_STEP_SUMMARY"

      - name: Run staging MCP user journeys
        timeout-minutes: 10
        id: mcp-smoke
        if: ${{ !cancelled() && steps.smoke-deps.conclusion == 'success' && steps.corpus-preflight.outcome == 'success' }}
        run: bun run canary:mcp
        env:
          MCP_CANARY_ENVIRONMENT: staging
          MCP_CANARY_BASE_URL: https://api-staging.stll.app
          MCP_CANARY_CONFIGURED_BASE_URL: https://api-staging.stll.app
          MCP_CANARY_FRONTEND_URL: https://staging.stll.app
          MCP_CANARY_MODE: full
          # Release verification requires every journey, including the
          # authenticated probes, rather than accepting partial coverage.
          MCP_CANARY_REQUIRE_CREDENTIALS: "true"
          APP_REVIEW_ACCOUNT_EMAIL: ${{ vars.APP_REVIEW_ACCOUNT_EMAIL || 'review@stll.app' }}
          APP_REVIEW_ORGANIZATION_ID: ${{ vars.STAGING_APP_REVIEW_ORGANIZATION_ID }}
          REVIEW_ACCOUNT_PASSWORD: ${{ secrets.REVIEW_ACCOUNT_PASSWORD }}
          SMOKE_SESSION_SECRET: ${{ secrets.SMOKE_SESSION_SECRET }}
          E2E_EDGE_HEADER_NAME: x-stella-edge-token
          E2E_EDGE_HEADER_VALUE: ${{ secrets.STAGING_VIEWER_ACCESS_TOKEN }}

      - name: Run deployed application journeys
        id: deployed-journeys
        if: ${{ !cancelled() && steps.smoke-deps.conclusion == 'success' }}
        timeout-minutes: 20
        uses: ./.github/actions/user-journeys
        with:
          project: deployed
          expected-commit: ${{ needs.resolve.outputs.sha }}
          health-url: https://api-staging.stll.app/health
        env:
          E2E_WEB_URL: https://staging.stll.app
          E2E_API_URL: https://api-staging.stll.app
          E2E_EDGE_HEADER_NAME: x-stella-edge-token
          E2E_EDGE_HEADER_VALUE: ${{ secrets.STAGING_VIEWER_ACCESS_TOKEN }}
          JOURNEY_SIGN_IN: smoke-session
          JOURNEY_SMOKE_SESSION_URL: https://api-staging.stll.app/smoke/session
          SMOKE_SESSION_SECRET: ${{ secrets.SMOKE_SESSION_SECRET }}

      - name: Run mock-model application journeys
        id: mock-journeys
        if: ${{ !cancelled() && steps.smoke-deps.conclusion == 'success' }}
        timeout-minutes: 40
        uses: ./.github/actions/user-journeys
        with:
          project: local-stack
          expected-commit: ${{ needs.resolve.outputs.sha }}
          dockerhub-username: ${{ secrets.DOCKERHUB_USERNAME }}
          dockerhub-token: ${{ secrets.DOCKERHUB_TOKEN }}
        env:
          E2E_WEB_URL: http://localhost:3000
          E2E_API_URL: http://localhost:3001
          JOURNEY_SIGN_IN: seeded

      - name: Verify candidate staging commit after smokes
        id: candidate-served-after-smokes
        if: ${{ always() && inputs.release_ref != '' && steps.deployment.outputs.id != '' }}
        timeout-minutes: 10
        env:
          API_DEPLOYMENT_EXPECTED_COMMIT: ${{ needs.resolve.outputs.sha }}
          API_DEPLOYMENT_EXPECTED_ENVIRONMENT: staging
          API_DEPLOYMENT_PROBE_PATH: ready
          API_DEPLOYMENT_URL: https://api-staging.stll.app
          EDGE_HEADER_NAME: x-stella-edge-token
          EDGE_HEADER_VALUE: ${{ secrets.STAGING_VIEWER_ACCESS_TOKEN }}
        run: bun --no-install "$RUNNER_TEMP/check-api-deployment.ts"

      - name: Upload Playwright report
        timeout-minutes: 5
        if: ${{ always() && steps.web-smoke.outcome != '' && steps.web-smoke.outcome != 'skipped' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: staging-smoke-report
          path: apps/web/playwright-report/
          retention-days: 7

      - name: Upload failed journey reports
        timeout-minutes: 5
        if: ${{ failure() && (steps.deployed-journeys.outcome == 'failure' || steps.mock-journeys.outcome == 'failure') }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: staging-user-journeys-report
          path: |
            ${{ steps.deployed-journeys.outputs.report-paths }}
            ${{ steps.mock-journeys.outputs.report-paths }}
            /tmp/api.log
            ${{ runner.temp }}/web-user-journeys.log
          retention-days: 7

      - name: Record staging verification
        timeout-minutes: 3
        if: ${{ always() && steps.deployment.outputs.id != '' && (inputs.release_ref == '' || steps.candidate-served-after-smokes.outcome == 'success') }}
        env:
          GH_TOKEN: ${{ github.token }}
          DEPLOYMENT_ID: ${{ steps.deployment.outputs.id }}
          DEPLOY_SHA: ${{ needs.resolve.outputs.sha }}
          WEB_SMOKE: ${{ steps.web-smoke.outcome }}
          API_SMOKE: ${{ steps.api-smoke.outcome }}
          DEPLOYED_JOURNEYS: ${{ steps.deployed-journeys.outcome }}
          MOCK_JOURNEYS: ${{ steps.mock-journeys.outcome }}
          MCP_SMOKE: ${{ steps.mcp-smoke.outcome }}
          CORPUS_PREFLIGHT: ${{ steps.corpus-preflight.outcome }}
          CORPUS_SEARCH_WAIVED: ${{ needs.resolve.outputs.corpus_search_waived }}
          WAIVE_REASON: ${{ inputs.waive_reason }}
          JOB_STATUS: ${{ job.status }}
          PROOF_MAIN_BASE: ${{ needs.resolve.outputs.main-sha }}
        run: |
          set -euo pipefail
          state=failure
          description="Staging smoke failure: run ${GITHUB_RUN_ID}"
          if [[ "$WEB_SMOKE" == "success" && "$API_SMOKE" == "success" && "$DEPLOYED_JOURNEYS" == "success" && "$MOCK_JOURNEYS" == "success" && "$JOB_STATUS" == "success" ]]; then
            if [[ "$CORPUS_PREFLIGHT" == "success" && "$MCP_SMOKE" == "success" ]]; then
              state=success
              description="Staging smoke success: run ${GITHUB_RUN_ID}"
            elif [[ "$CORPUS_SEARCH_WAIVED" == "true" && "$CORPUS_PREFLIGHT" == "failure" && "$MCP_SMOKE" == "skipped" ]]; then
              state=success
              description="waived: corpus-search (${WAIVE_REASON})"
            fi
          fi
          if [[ "$CORPUS_SEARCH_WAIVED" == "true" ]]; then
            {
              echo "### Named staging waiver: corpus-search"
              printf 'Reason: %s\n' "$WAIVE_REASON"
              printf 'Corpus preflight result: %s; dependent MCP smoke result: %s.\n' "$CORPUS_PREFLIGHT" "$MCP_SMOKE"
              if [[ "$CORPUS_PREFLIGHT" == "success" ]]; then
                echo "Waiver unused: the corpus preflight passed."
              else
                printf 'Verification status: %s.\n' "$state"
              fi
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          if [[ -n "${PROOF_MAIN_BASE:-}" ]]; then
            # The full waiver reason remains in the summary; statuses allow 140 characters.
            description="${description:0:93}; main=$PROOF_MAIN_BASE"
          fi
          run_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          bash "$STAGING_STATUS_WRITER" "$state" "$description"
          jq -n --arg state "$state" --arg url "$run_url" \
            '{state: $state, environment_url: "https://staging.stll.app", log_url: $url}' |
            bash "$GH_RETRY_SCRIPT" api "repos/${GITHUB_REPOSITORY}/deployments/${DEPLOYMENT_ID}/statuses" \
              --method POST --input - >/dev/null
