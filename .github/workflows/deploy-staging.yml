name: Deploy main to staging

# Continuous deploy of every push to main into staging. The tagged
# release workflow remains the production path.

on:
  push:
    branches: [main]
  workflow_dispatch:

# Queue rather than cancel: build-and-deploy dispatches a promotion to the
# infra repo and then watches it to completion. A run cancelled mid-dispatch
# would leave that promotion in flight with nothing watching it, racing
# whatever the next run dispatches. A dispatched promotion must always be
# watched, so a newer push waits for the current run instead of preempting it.
concurrency:
  group: deploy-staging
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/stella-api

jobs:
  # Tie promotion and its dependent smoke job to the current health of the
  # staging environment.
  staging-health:
    name: Check staging health
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    permissions: {}
    outputs:
      status: ${{ steps.probe.outputs.status }}

    steps:
      - name: Probe staging health
        id: probe
        env:
          STAGING_HEALTH_URL: https://api-staging.stll.app/health
        run: |
          set -euo pipefail

          readonly READY_STATUS="ready"
          readonly NOT_READY_STATUS="not_ready"
          readonly MAX_ATTEMPTS=3
          readonly RETRY_SECONDS=5

          response_file="$RUNNER_TEMP/staging-health.json"
          status="$NOT_READY_STATUS"
          for ((attempt = 1; attempt <= MAX_ATTEMPTS; attempt += 1)); do
            http_status="000"
            if ! http_status="$(
              curl \
                --connect-timeout 5 \
                --max-time 10 \
                --output "$response_file" \
                --silent \
                --show-error \
                --write-out '%{http_code}' \
                "$STAGING_HEALTH_URL"
            )"; then
              http_status="000"
            fi

            if [[ "$http_status" == "200" ]] &&
              jq -e '.status == "ok"' "$response_file" >/dev/null 2>&1; then
              status="$READY_STATUS"
              break
            fi

            echo "Staging health probe ${attempt}/${MAX_ATTEMPTS} returned HTTP ${http_status}."
            if (( attempt < MAX_ATTEMPTS )); then
              sleep "$RETRY_SECONDS"
            fi
          done

          echo "status=${status}" >> "$GITHUB_OUTPUT"
          if [[ "$status" == "$NOT_READY_STATUS" ]]; then
            if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
              echo "::notice::Staging health gate did not pass; workflow_dispatch bypasses the gate and deploys anyway."
            else
              {
                echo "### Staging health gate failed"
                echo "The staging health probe did not return a ready status after ${MAX_ATTEMPTS} attempts."
                echo "This deployment was skipped. Continuous deploy to staging is stalled until staging health recovers, or until this workflow is re-run with workflow_dispatch to bypass the gate."
              } >> "$GITHUB_STEP_SUMMARY"
              echo "::error::Staging health gate did not pass after ${MAX_ATTEMPTS} attempts; skipping this deployment and failing the run so continuous deploy does not stall silently."
              exit 1
            fi
          fi

  build-and-deploy:
    name: Build + deploy staging
    needs: staging-health
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'workflow_dispatch' ||
      needs.staging-health.outputs.status == 'ready')
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
      artifact-metadata: write

    steps:
      - name: Resolve synthetic ref
        id: ref
        env:
          SHA: ${{ github.sha }}
        run: |
          short="${SHA:0:7}"
          echo "release_ref=main-${short}" >> "$GITHUB_OUTPUT"
          echo "short_sha=${short}" >> "$GITHUB_OUTPUT"

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Login to GHCR
        uses: docker/login-action@371161bbe7024a29a25c5e19bfcbc0804fe9ad2c # v4.5.2
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: apps/api/Dockerfile
          platforms: linux/arm64
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.ref.outputs.release_ref }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:main-latest
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache-staging
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache-staging,mode=max
          build-args: |
            STELLA_VERSION=${{ steps.ref.outputs.release_ref }}
            STELLA_COMMIT_SHA=${{ github.sha }}

      # Best-effort on staging: the provenance action already retries
      # transient Sigstore blips, but a sustained Rekor outage must not
      # wedge continuous deploys (the image is built and pushed; only
      # the transparency-log attestation is unavailable). The step still
      # surfaces as failed in the UI. Production keeps attestation
      # blocking in release.yml.
      - name: Attest image provenance
        continue-on-error: true
        uses: ./.github/actions/provenance
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.build.outputs.digest }}

      - name: Check staging deployment target is configured
        env:
          DEPLOY_REPOSITORY: ${{ github.repository_owner }}/${{ vars.STAGING_DEPLOY_REPOSITORY }}
          DEPLOY_WORKFLOW: ${{ vars.STAGING_DEPLOY_WORKFLOW }}
        run: |
          if [[ -z "${DEPLOY_REPOSITORY#*/}" || -z "$DEPLOY_WORKFLOW" ]]; then
            echo "::error::Staging deployment target is not configured." >&2
            exit 1
          fi

      # Watches the dispatched run to completion: a promote that fails after
      # the dispatch is accepted must fail this job, so verify-staging is
      # skipped by `needs` instead of blocking on a commit that will never
      # be served.
      - name: Deploy to staging
        uses: ./.github/actions/promote-dispatch
        with:
          app-client-id: ${{ vars.STELLA_RELEASE_APP_CLIENT_ID }}
          app-private-key: ${{ secrets.STELLA_RELEASE_APP_PRIVATE_KEY }}
          infra-repo: ${{ github.repository_owner }}/${{ vars.STAGING_DEPLOY_REPOSITORY }}
          workflow-file: ${{ vars.STAGING_DEPLOY_WORKFLOW }}
          release-ref: ${{ steps.ref.outputs.release_ref }}
          target-environment: staging
          image-digest: ${{ steps.build.outputs.digest }}
          git-sha: ${{ github.sha }}

  # Post-deploy verification: authenticate via the secret-guarded
  # /smoke/session endpoint and click through the deployed app so a
  # render-breaking regression turns this workflow red instead of
  # waiting for a human to stumble over it.
  verify-staging:
    name: Verify staging deploy
    needs: build-and-deploy
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: ./.github/actions/setup-bun-cached

      - name: Install dependencies
        run: bash scripts/bun-ci-retry.sh --ignore-scripts
        env:
          NPM_TOKEN: ""

      - name: Install Playwright browser
        run: cd apps/web && bunx playwright install --with-deps chromium

      - name: Run staging web smoke
        run: bun --filter @stll/web test:e2e:staging
        env:
          E2E_WEB_URL: https://staging.stll.app
          E2E_API_URL: https://api-staging.stll.app
          SMOKE_SESSION_SECRET: ${{ secrets.SMOKE_SESSION_SECRET }}
          # Block the smoke until staging actually serves this commit,
          # so it doesn't race the ECS task rollover.
          EXPECTED_COMMIT: ${{ github.sha }}

      - name: Run staging API chat smoke
        if: ${{ !cancelled() }}
        run: bun apps/api/src/scripts/post-deploy-smoke.ts "$E2E_API_URL"
        env:
          E2E_API_URL: https://api-staging.stll.app
          SMOKE_SESSION_SECRET: ${{ secrets.SMOKE_SESSION_SECRET }}
          EXPECTED_COMMIT: ${{ github.sha }}

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: staging-smoke-report
          path: apps/web/playwright-report/
          retention-days: 7
