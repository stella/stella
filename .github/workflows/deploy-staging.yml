name: Deploy main to staging

# Continuous deploy of every push to main into staging. The tagged
# release workflow remains the production path.

on:
  push:
    branches: [main]
  workflow_dispatch:

# A newer push to main supersedes an in-flight staging deploy.
concurrency:
  group: deploy-staging
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/stella-api

jobs:
  build-and-deploy:
    name: Build + deploy staging
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
      artifact-metadata: write

    steps:
      - name: Resolve synthetic ref
        id: ref
        env:
          SHA: ${{ github.sha }}
        run: |
          short="${SHA:0:7}"
          echo "release_ref=main-${short}" >> "$GITHUB_OUTPUT"
          echo "short_sha=${short}" >> "$GITHUB_OUTPUT"

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Login to GHCR
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4.4.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: apps/api/Dockerfile
          platforms: linux/arm64
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.ref.outputs.release_ref }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:main-latest
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache-staging
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache-staging,mode=max
          build-args: |
            STELLA_VERSION=${{ steps.ref.outputs.release_ref }}
            STELLA_COMMIT_SHA=${{ github.sha }}

      # Best-effort on staging: the provenance action already retries
      # transient Sigstore blips, but a sustained Rekor outage must not
      # wedge continuous deploys (the image is built and pushed; only
      # the transparency-log attestation is unavailable). The step still
      # surfaces as failed in the UI. Production keeps attestation
      # blocking in release.yml.
      - name: Attest image provenance
        continue-on-error: true
        uses: ./.github/actions/provenance
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.build.outputs.digest }}

      - name: Mint deployment token
        id: deployment-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.STELLA_RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.STELLA_RELEASE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ vars.STAGING_DEPLOY_REPOSITORY }}
          permission-actions: write

      - name: Request staging deployment
        env:
          GH_TOKEN: ${{ steps.deployment-token.outputs.token }}
          DEPLOY_REPOSITORY: ${{ github.repository_owner }}/${{ vars.STAGING_DEPLOY_REPOSITORY }}
          DEPLOY_WORKFLOW: ${{ vars.STAGING_DEPLOY_WORKFLOW }}
          RELEASE_REF: ${{ steps.ref.outputs.release_ref }}
          GIT_SHA: ${{ github.sha }}
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          if [[ -z "${DEPLOY_REPOSITORY#*/}" || -z "$DEPLOY_WORKFLOW" ]]; then
            echo "::error::Staging deployment target is not configured." >&2
            exit 1
          fi

          gh api --method POST \
            "/repos/${DEPLOY_REPOSITORY}/actions/workflows/${DEPLOY_WORKFLOW}/dispatches" \
            -f "ref=main" \
            -f "inputs[release_ref]=${RELEASE_REF}" \
            -f "inputs[target_environment]=staging" \
            -f "inputs[image_digest]=${IMAGE_DIGEST}" \
            -f "inputs[git_sha]=${GIT_SHA}" \
            -f "inputs[run_migrations]=true" \
            -f "inputs[frontend]=true"

  # Post-deploy verification: authenticate via the secret-guarded
  # /smoke/session endpoint and click through the deployed app so a
  # render-breaking regression turns this workflow red instead of
  # waiting for a human to stumble over it.
  verify-staging:
    name: Verify staging deploy
    needs: build-and-deploy
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: "package.json"

      - name: Install dependencies
        run: bun ci --ignore-scripts
        env:
          NPM_TOKEN: ""

      - name: Install Playwright browser
        run: cd apps/web && bunx playwright install --with-deps chromium

      - name: Run staging web smoke
        run: bun --filter @stll/web test:e2e:staging
        env:
          E2E_WEB_URL: https://staging.stll.app
          E2E_API_URL: https://api-staging.stll.app
          SMOKE_SESSION_SECRET: ${{ secrets.SMOKE_SESSION_SECRET }}
          # Block the smoke until staging actually serves this commit,
          # so it doesn't race the ECS task rollover.
          EXPECTED_COMMIT: ${{ github.sha }}

      - name: Run staging API chat smoke
        if: ${{ !cancelled() }}
        run: bun apps/api/src/scripts/post-deploy-smoke.ts "$E2E_API_URL"
        env:
          E2E_API_URL: https://api-staging.stll.app
          SMOKE_SESSION_SECRET: ${{ secrets.SMOKE_SESSION_SECRET }}
          EXPECTED_COMMIT: ${{ github.sha }}

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: staging-smoke-report
          path: apps/web/playwright-report/
          retention-days: 7
