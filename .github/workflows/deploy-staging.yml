name: Deploy main to staging

# Deploys a commit on main into staging on demand: the tip by default, or a
# pinned `sha` that main already contains, so a release candidate can be
# verified while main keeps moving. A pinned SHA that is not on main fails
# the run. The tagged release workflow remains the production path and does
# not depend on this one.
#
# Staging is off unless someone starts it, so this runs only when
# dispatched. A dispatch while staging is not answering deploys nothing and
# fails with a staging/verified error: start staging first, then dispatch again. To
# deploy a fix to a staging that is up but unhealthy, dispatch with
# deploy_when_unreachable.

on:
  workflow_dispatch:
    inputs:
      release_candidate:
        description: "Validate the pending release VERSION before running this pinned gate"
        required: false
        type: boolean
        default: false
      sha:
        description: "Commit SHA on main to deploy (blank deploys the main tip)"
        required: false
        type: string
      waive_check:
        description: "Named staging check waiver (explicit SHA required)"
        type: choice
        options: [none, corpus-search]
        default: none
      waive_reason:
        description: "Required reason including evidence=<path> (single line, maximum 116 characters)"
        type: string
      deploy_when_unreachable:
        description: "Deploy even when staging does not answer its health probe"
        required: false
        default: false
        type: boolean

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/stella-api
  WEB_IMAGE_NAME: ${{ github.repository_owner }}/stella-web

jobs:
  # The one commit every later job builds, promotes and verifies. Refusing
  # here fails the run before anything is built.
  resolve:
    name: Resolve the commit to deploy
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      sha: ${{ steps.resolve.outputs.sha }}
      tip: ${{ steps.resolve.outputs.tip }}
      main-sha: ${{ steps.resolve.outputs.main-sha }}
      corpus_search_waived: ${{ steps.waiver.outputs.corpus_search_waived }}

    steps:
      - name: Check release candidate
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.sha != '' && inputs.release_candidate == true }}
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          SERVER_URL: ${{ github.server_url }}
          REQUESTED_SHA: ${{ inputs.sha }}
        run: |
          set -euo pipefail
          directory="$RUNNER_TEMP/release-candidate-validation"
          mkdir -p "$directory"
          git -C "$directory" init
          git -C "$directory" remote add origin "$SERVER_URL/$REPOSITORY.git"
          auth=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 | tr -d '\n')
          echo "::add-mask::$auth"
          git -C "$directory" -c "http.extraheader=AUTHORIZATION: basic $auth" fetch --tags origin main:refs/remotes/origin/main
          git -C "$directory" show origin/main:scripts/check-release-candidate.sh > "$RUNNER_TEMP/check-release-candidate.sh"
          cd "$directory"
          bash "$RUNNER_TEMP/check-release-candidate.sh" "$REQUESTED_SHA"

      - name: Validate staging waiver
        id: waiver
        env:
          WAIVE_CHECK: ${{ inputs.waive_check || 'none' }}
          WAIVE_REASON: ${{ inputs.waive_reason }}
          REQUESTED_SHA: ${{ inputs.sha }}
        run: |
          set -euo pipefail
          case "$WAIVE_CHECK" in
            none) echo "corpus_search_waived=false" >> "$GITHUB_OUTPUT" ;;
            corpus-search)
              if [[ "$GITHUB_EVENT_NAME" != "workflow_dispatch" || -z "${REQUESTED_SHA//[[:space:]]/}" ]]; then
                echo "::error::The corpus-search waiver requires a manual dispatch with an explicit SHA."
                exit 1
              fi
              if [[ -z "${WAIVE_REASON//[[:space:]]/}" || "$WAIVE_REASON" == *$'\n'* || "$WAIVE_REASON" == *$'\r'* ]] || (( ${#WAIVE_REASON} > 116 )); then
                echo "::error::The corpus-search waiver requires a non-empty single-line reason of at most 116 characters."
                exit 1
              fi
              evidence_path='(^|[[:space:]])evidence=[^[:space:]]*/[^[:space:]]+($|[[:space:]])'
              if [[ ! "$WAIVE_REASON" =~ $evidence_path ]]; then
                echo "::error::The corpus-search waiver reason must include evidence=<path>."
                exit 1
              fi
              echo "corpus_search_waived=true" >> "$GITHUB_OUTPUT"
              ;;
            *) echo "::error::Unknown staging check waiver."; exit 1 ;;
          esac

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve the commit to deploy
        id: resolve
        env:
          REQUESTED_SHA: ${{ inputs.sha }}
        run: bash scripts/resolve-staging-deploy-sha.sh --sha "$REQUESTED_SHA" >> "$GITHUB_OUTPUT"

  # Tie promotion and its dependent smoke job to the current health of the
  # staging environment.
  staging-health:
    name: Check staging health
    needs: resolve
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      statuses: write
    outputs:
      deploy: ${{ steps.decide.outputs.deploy }}

    steps:
      - name: Probe staging health
        id: probe
        env:
          STAGING_HEALTH_URL: https://api-staging.stll.app/ready
          STAGING_LEGACY_HEALTH_URL: https://api-staging.stll.app/health
          EDGE_HEADER_NAME: x-stella-edge-token
          EDGE_HEADER_VALUE: ${{ secrets.STAGING_VIEWER_ACCESS_TOKEN }}
        run: |
          set -euo pipefail

          # Optional edge access header on the probes; no-op when unset.
          curl_edge_args=()
          if [[ -n "${EDGE_HEADER_NAME:-}" && -n "${EDGE_HEADER_VALUE:-}" ]]; then
            curl_edge_args+=(--header "${EDGE_HEADER_NAME}: ${EDGE_HEADER_VALUE}")
          fi

          readonly READY_STATUS="ready"
          readonly NOT_READY_STATUS="not_ready"
          readonly MAX_ATTEMPTS=3
          readonly RETRY_SECONDS=5

          response_file="$RUNNER_TEMP/staging-health.json"
          status="$NOT_READY_STATUS"
          served_commit=""
          for ((attempt = 1; attempt <= MAX_ATTEMPTS; attempt += 1)); do
            http_status="000"
            if ! http_status="$(
              curl \
                --connect-timeout 5 \
                --max-time 10 \
                --output "$response_file" \
                --silent \
                --show-error \
                --write-out '%{http_code}' \
                ${curl_edge_args[@]+"${curl_edge_args[@]}"} \
                "$STAGING_HEALTH_URL"
            )"; then
              http_status="000"
            fi

            if [[ "$http_status" == "404" ]]; then
              echo "Staging does not expose /ready; checking the legacy /health endpoint."
              if ! http_status="$(
                curl \
                  --connect-timeout 5 \
                  --max-time 10 \
                  --output "$response_file" \
                  --silent \
                  --show-error \
                  --write-out '%{http_code}' \
                  ${curl_edge_args[@]+"${curl_edge_args[@]}"} \
                  "$STAGING_LEGACY_HEALTH_URL"
              )"; then
                http_status="000"
              fi
            fi

            if [[ "$http_status" == "200" ]] &&
              jq -e '.status == "ok"' "$response_file" >/dev/null 2>&1; then
              status="$READY_STATUS"
              served_commit="$(jq -r '.commit // ""' "$response_file")"
              break
            fi

            echo "Staging health probe ${attempt}/${MAX_ATTEMPTS} returned HTTP ${http_status}."
            if (( attempt < MAX_ATTEMPTS )); then
              sleep "$RETRY_SECONDS"
            fi
          done

          echo "status=${status}" >> "$GITHUB_OUTPUT"
          echo "served_commit=${served_commit}" >> "$GITHUB_OUTPUT"

      # Staging that does not answer is normally off. Deploying into it would
      # leave the smoke below measuring an environment that is not running.
      - name: Decide whether staging can deploy
        id: decide
        env:
          GH_TOKEN: ${{ github.token }}
          DEPLOY_SHA: ${{ needs.resolve.outputs.sha }}
          DEPLOY_WHEN_UNREACHABLE: ${{ inputs.deploy_when_unreachable }}
          STATUS: ${{ steps.probe.outputs.status }}
        run: |
          set -euo pipefail

          if [[ "$STATUS" == "ready" ]]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [[ "$DEPLOY_WHEN_UNREACHABLE" == "true" ]]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
            echo "::notice::Staging is not answering; deploying anyway as requested."
            exit 0
          fi

          echo "deploy=false" >> "$GITHUB_OUTPUT"
          {
            echo "### Staging is off"
            echo "Staging is not answering its health probe, so \`${DEPLOY_SHA}\` was not deployed."
            echo "Start staging, then dispatch this workflow again."
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::error::staging off: nothing was deployed. Start staging, then dispatch again."
          run_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          jq -n --arg url "$run_url" \
            '{state: "error", context: "staging/verified", description: "staging off", target_url: $url}' |
            gh api "repos/${GITHUB_REPOSITORY}/statuses/${DEPLOY_SHA}" \
              --method POST --input - >/dev/null
          exit 1

  build-api:
    name: Build staging API image
    needs: [resolve, staging-health]
    if: >-
      github.ref == 'refs/heads/main' &&
      needs.staging-health.outputs.deploy == 'true'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
      artifact-metadata: write
    concurrency:
      group: staging-api-build-${{ needs.resolve.outputs.sha }}
      cancel-in-progress: true
    outputs:
      digest: ${{ steps.build.outputs.digest }}
      release-ref: ${{ steps.ref.outputs.release_ref }}

    steps:
      - name: Resolve synthetic ref
        id: ref
        env:
          SHA: ${{ needs.resolve.outputs.sha }}
        run: |
          short="${SHA:0:7}"
          echo "release_ref=main-${short}" >> "$GITHUB_OUTPUT"
          echo "short_sha=${short}" >> "$GITHUB_OUTPUT"

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve.outputs.sha }}
          persist-credentials: false
          # The API image ships the bundled template-pack content.
          submodules: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Login to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # A pinned commit may predate the pull script, so it runs from the
      # workflow revision; the copy is removed before it can enter the build
      # context.
      - name: Checkout workflow tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          path: .workflow-tooling
          persist-credentials: false
          sparse-checkout: |
            scripts/pull-base-images.sh
            scripts/retry.sh
          sparse-checkout-cone-mode: false

      - name: Pull API base images
        run: |
          bash .workflow-tooling/scripts/pull-base-images.sh --buildx linux/arm64 apps/api/Dockerfile
          rm -rf .workflow-tooling

      - name: Build and push image
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: apps/api/Dockerfile
          platforms: linux/arm64
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.ref.outputs.release_ref }}
            ${{ needs.resolve.outputs.tip == 'true' && format('{0}/{1}:main-latest', env.REGISTRY, env.IMAGE_NAME) || '' }}
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache-staging
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache-staging,mode=max
          build-args: |
            STELLA_VERSION=${{ steps.ref.outputs.release_ref }}
            STELLA_COMMIT_SHA=${{ needs.resolve.outputs.sha }}

      # Attestation tooling comes from the workflow revision, after building,
      # so it cannot alter the pinned source or its Docker context.
      - name: Checkout attestation tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          path: .workflow-actions
          persist-credentials: false
          sparse-checkout: |
            .github/actions/provenance
            scripts/staging-source-predicate.sh
          sparse-checkout-cone-mode: false

      - name: Attest image provenance
        uses: ./.workflow-actions/.github/actions/provenance
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.build.outputs.digest }}
          source-sha: ${{ needs.resolve.outputs.sha }}
          main-sha: ${{ needs.resolve.outputs.main-sha }}

  build-web:
    name: Build staging web image
    needs: [resolve, staging-health]
    if: >-
      github.ref == 'refs/heads/main' &&
      needs.staging-health.outputs.deploy == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
      artifact-metadata: write
    concurrency:
      group: staging-web-build-${{ needs.resolve.outputs.sha }}
      cancel-in-progress: true
    outputs:
      digest: ${{ steps.build.outputs.digest }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve.outputs.sha }}
          persist-credentials: false

      - name: Resolve synthetic ref
        id: ref
        env:
          SHA: ${{ needs.resolve.outputs.sha }}
        run: |
          echo "release-ref=main-${SHA:0:7}" >>"$GITHUB_OUTPUT"

      - name: Build and publish web image
        id: build
        uses: ./.github/actions/build-web-image
        with:
          release-ref: ${{ steps.ref.outputs.release-ref }}
          release-sha: ${{ needs.resolve.outputs.sha }}
          target-environment: staging
          posthog-key: ${{ secrets.VITE_POSTHOG_KEY }}
          posthog-cli-api-key: ${{ secrets.POSTHOG_CLI_API_KEY }}
          posthog-project-id: ${{ vars.POSTHOG_PROJECT_ID }}

      # Attestation tooling comes from the workflow revision, after building,
      # so it cannot alter the pinned source or its Docker context.
      - name: Checkout attestation tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          path: .workflow-actions
          persist-credentials: false
          sparse-checkout: |
            .github/actions/provenance
            scripts/staging-source-predicate.sh
          sparse-checkout-cone-mode: false

      - name: Attest web image provenance
        uses: ./.workflow-actions/.github/actions/provenance
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.WEB_IMAGE_NAME }}
          subject-digest: ${{ steps.build.outputs.digest }}
          source-sha: ${{ needs.resolve.outputs.sha }}
          main-sha: ${{ needs.resolve.outputs.main-sha }}

  promote-staging:
    name: Promote staging images
    needs: [resolve, build-api, build-web]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    # Deployment and its smoke verification are one serialized side-effecting
    # unit. Public builds may be cancelled; this job may not be interrupted
    # after it dispatches Terraform work into the private repository.
    concurrency:
      group: deploy-staging
      cancel-in-progress: false
    permissions:
      contents: read
      deployments: write
      statuses: write
    # Release App key lives in this environment (main and v* tags only).
    environment: release-app
    steps:
      - name: Checkout workflow actions
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false

      - name: Check staging deployment target is configured
        env:
          DEPLOY_REPOSITORY: ${{ github.repository_owner }}/${{ vars.STAGING_DEPLOY_REPOSITORY }}
          DEPLOY_WORKFLOW: ${{ vars.STAGING_DEPLOY_WORKFLOW }}
        run: |
          if [[ -z "${DEPLOY_REPOSITORY#*/}" || -z "$DEPLOY_WORKFLOW" ]]; then
            echo "::error::Staging deployment target is not configured." >&2
            exit 1
          fi

      # Watches the dispatched run to completion: a promote that fails after
      # the dispatch is accepted must fail this job, so verify-staging is
      # skipped by `needs` instead of blocking on a commit that will never
      # be served.
      - name: Deploy to staging
        uses: ./.github/actions/promote-dispatch
        with:
          app-client-id: ${{ vars.STELLA_RELEASE_APP_CLIENT_ID }}
          app-private-key: ${{ secrets.STELLA_RELEASE_APP_PRIVATE_KEY }}
          infra-repo: ${{ github.repository_owner }}/${{ vars.STAGING_DEPLOY_REPOSITORY }}
          workflow-file: ${{ vars.STAGING_DEPLOY_WORKFLOW }}
          release-ref: ${{ needs.build-api.outputs.release-ref }}
          target-environment: staging
          image-digest: ${{ needs.build-api.outputs.digest }}
          web-image-digest: ${{ needs.build-web.outputs.digest }}
          git-sha: ${{ needs.resolve.outputs.sha }}

      # The commit staging is running, recorded where it outlives this run.
      - name: Record staging deployment
        id: deployment
        env:
          DEPLOY_ENVIRONMENT: staging
          DEPLOY_SHA: ${{ needs.resolve.outputs.sha }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          deployment_id="$(
            jq -n \
              --arg ref "$DEPLOY_SHA" \
              --arg environment "$DEPLOY_ENVIRONMENT" \
              '{
                ref: $ref,
                environment: $environment,
                auto_merge: false,
                required_contexts: [],
                production_environment: false,
                description: "Deploy of main to staging"
              }' |
              gh api "repos/${GITHUB_REPOSITORY}/deployments" \
                --method POST --input - --jq '.id'
          )"

          echo "id=${deployment_id}" >>"$GITHUB_OUTPUT"

          jq -n '{state: "in_progress", environment_url: "https://staging.stll.app"}' |
            gh api "repos/${GITHUB_REPOSITORY}/deployments/${deployment_id}/statuses" \
              --method POST --input - >/dev/null

          jq -n --arg run "$GITHUB_RUN_ID" \
            '{state: "pending", context: "staging/verified", description: ("Staging smoke pending: run " + $run)}' |
            gh api "repos/${GITHUB_REPOSITORY}/statuses/${DEPLOY_SHA}" \
              --method POST --input - >/dev/null

      # Post-deploy verification stays in the serialized promotion job. If it
      # were a separate job, a newer promotion could start while this smoke
      # still measures the previous commit.
      - name: Checkout deployed source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve.outputs.sha }}
          persist-credentials: false

      - name: Setup Bun
        uses: stella/.github/actions/setup-bun-cached@167fb396c6c0f4e07296ad2cd72e6ef15367c776
        with:
          save: ${{ github.ref == 'refs/heads/main' }}

      - name: Install dependencies
        id: smoke-deps
        run: bash scripts/retry.sh bun ci --ignore-scripts
        env:
          NPM_TOKEN: ""

      - name: Verify image-provided Chromium
        uses: ./.github/actions/setup-playwright

      - name: Run staging web smoke
        id: web-smoke
        run: bash "$GITHUB_WORKSPACE/.github/actions/setup-playwright/run-in-image.sh" bun --filter @stll/web test:e2e:staging
        env:
          STAGING_STATE: ${{ vars.STAGING_STATE }}
          E2E_WEB_URL: https://staging.stll.app
          E2E_API_URL: https://api-staging.stll.app
          SMOKE_SESSION_SECRET: ${{ secrets.SMOKE_SESSION_SECRET }}
          E2E_EDGE_HEADER_NAME: x-stella-edge-token
          E2E_EDGE_HEADER_VALUE: ${{ secrets.STAGING_VIEWER_ACCESS_TOKEN }}
          # Block the smoke until staging actually serves this commit,
          # so it doesn't race the ECS task rollover.
          EXPECTED_COMMIT: ${{ needs.resolve.outputs.sha }}

      # The declared cache and robots headers of Knowledge responses. Also
      # runs on its own through staging-response-policy.yml. Report-only
      # until it has a record of green runs.
      - name: Run staging response policy checks
        if: ${{ !cancelled() && steps.smoke-deps.conclusion == 'success' }}
        continue-on-error: true
        run: |
          if bun apps/api/src/scripts/post-deploy-response-policy.ts; then
            echo "Staging response policy checks passed." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning title=Staging response policy checks failed (report-only)::See the step log for the failed checks."
            echo "Staging response policy checks FAILED (report-only, promotion not blocked). See the step log." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
        env:
          E2E_WEB_URL: https://staging.stll.app
          E2E_API_URL: https://api-staging.stll.app
          E2E_EDGE_HEADER_NAME: x-stella-edge-token
          E2E_EDGE_HEADER_VALUE: ${{ secrets.STAGING_VIEWER_ACCESS_TOKEN }}

      # `!cancelled()` keeps this signal when the web smoke fails, but it
      # also suppresses the implicit success() gate, so without the explicit
      # deps condition this step ran after a failed deploy with no toolchain
      # installed and died with `bun: command not found`.
      - name: Run staging API chat smoke
        id: api-smoke
        if: ${{ !cancelled() && steps.smoke-deps.conclusion == 'success' }}
        run: bun apps/api/src/scripts/post-deploy-smoke.ts "$E2E_API_URL"
        env:
          E2E_API_URL: https://api-staging.stll.app
          SMOKE_SESSION_SECRET: ${{ secrets.SMOKE_SESSION_SECRET }}
          E2E_EDGE_HEADER_NAME: x-stella-edge-token
          E2E_EDGE_HEADER_VALUE: ${{ secrets.STAGING_VIEWER_ACCESS_TOKEN }}
          EXPECTED_COMMIT: ${{ needs.resolve.outputs.sha }}
          # The real model turn runs in the next step.
          SMOKE_AI_JOURNEY: skip

      # Report-only until reviewed on 2026-10-02: a failure is annotated and
      # summarized but does not fail the promotion. To make it blocking,
      # delete the `continue-on-error: true` line below.
      - name: Run staging API model-turn smoke
        if: ${{ !cancelled() && steps.smoke-deps.conclusion == 'success' }}
        continue-on-error: true
        run: |
          if bun apps/api/src/scripts/post-deploy-smoke.ts "$E2E_API_URL"; then
            echo "Staging model-turn smoke passed." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning title=Staging model-turn smoke failed (report-only)::See the step log for the failed checks."
            echo "Staging model-turn smoke FAILED (report-only, promotion not blocked). See the step log." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
        env:
          E2E_API_URL: https://api-staging.stll.app
          SMOKE_SESSION_SECRET: ${{ secrets.SMOKE_SESSION_SECRET }}
          E2E_EDGE_HEADER_NAME: x-stella-edge-token
          E2E_EDGE_HEADER_VALUE: ${{ secrets.STAGING_VIEWER_ACCESS_TOKEN }}
          EXPECTED_COMMIT: ${{ needs.resolve.outputs.sha }}
          SMOKE_AI_JOURNEY: only
          SMOKE_AI_OPENAI_API_KEY: ${{ secrets.STAGING_SMOKE_OPENAI_API_KEY }}

      - name: Check staging corpus search backend
        id: corpus-preflight
        continue-on-error: ${{ needs.resolve.outputs.corpus_search_waived == 'true' }}
        if: ${{ !cancelled() && steps.smoke-deps.conclusion == 'success' }}
        timeout-minutes: 2
        env:
          E2E_API_URL: https://api-staging.stll.app
          E2E_EDGE_HEADER_NAME: x-stella-edge-token
          E2E_EDGE_HEADER_VALUE: ${{ secrets.STAGING_VIEWER_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          curl_edge_args=()
          if [[ -n "${E2E_EDGE_HEADER_NAME:-}" && -n "${E2E_EDGE_HEADER_VALUE:-}" ]]; then
            curl_edge_args+=(--header "${E2E_EDGE_HEADER_NAME}: ${E2E_EDGE_HEADER_VALUE}")
          fi
          response_file="$RUNNER_TEMP/staging-corpus-search.json"
          http_status="000"
          if ! http_status="$(curl --connect-timeout 5 --max-time 30 \
            --silent --show-error --output "$response_file" --write-out '%{http_code}' \
            --header 'Content-Type: application/json' \
            ${curl_edge_args[@]+"${curl_edge_args[@]}"} \
            --data '{"query":"contract","country":"CZ","limit":1,"strict":true}' \
            "${E2E_API_URL}/v1/case/decisions/search")"; then
            http_status="000"
          fi
          if [[ "$http_status" != "200" ]] || ! jq -e \
            'type == "object" and (.hits | type == "array") and (.queryUsed | type == "string" and length > 0) and has("total") and (has("message") | not)' \
            "$response_file" >/dev/null 2>&1; then
            echo "::error title=corpus index down::Staging case-law search preflight failed (HTTP ${http_status}); MCP smoke cannot verify search without its backend."
            echo "corpus index down: staging case-law search preflight failed (HTTP ${http_status})." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo "Staging corpus search backend answered the preflight." >> "$GITHUB_STEP_SUMMARY"

      - name: Run staging MCP user journeys
        id: mcp-smoke
        if: ${{ !cancelled() && steps.smoke-deps.conclusion == 'success' && steps.corpus-preflight.outcome == 'success' }}
        run: bun run canary:mcp
        env:
          MCP_CANARY_ENVIRONMENT: staging
          MCP_CANARY_BASE_URL: https://api-staging.stll.app
          MCP_CANARY_CONFIGURED_BASE_URL: https://api-staging.stll.app
          MCP_CANARY_FRONTEND_URL: https://staging.stll.app
          MCP_CANARY_MODE: full
          # Release verification requires every journey, including the
          # authenticated probes, rather than accepting partial coverage.
          MCP_CANARY_REQUIRE_CREDENTIALS: "true"
          APP_REVIEW_ACCOUNT_EMAIL: ${{ vars.APP_REVIEW_ACCOUNT_EMAIL || 'review@stll.app' }}
          REVIEW_ACCOUNT_PASSWORD: ${{ secrets.REVIEW_ACCOUNT_PASSWORD }}
          SMOKE_SESSION_SECRET: ${{ secrets.SMOKE_SESSION_SECRET }}
          E2E_EDGE_HEADER_NAME: x-stella-edge-token
          E2E_EDGE_HEADER_VALUE: ${{ secrets.STAGING_VIEWER_ACCESS_TOKEN }}

      - name: Upload Playwright report
        if: ${{ always() && steps.web-smoke.outcome != '' && steps.web-smoke.outcome != 'skipped' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: staging-smoke-report
          path: apps/web/playwright-report/
          retention-days: 7

      - name: Record staging verification
        if: ${{ always() && steps.deployment.outputs.id != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          DEPLOYMENT_ID: ${{ steps.deployment.outputs.id }}
          DEPLOY_SHA: ${{ needs.resolve.outputs.sha }}
          WEB_SMOKE: ${{ steps.web-smoke.outcome }}
          API_SMOKE: ${{ steps.api-smoke.outcome }}
          MCP_SMOKE: ${{ steps.mcp-smoke.outcome }}
          CORPUS_PREFLIGHT: ${{ steps.corpus-preflight.outcome }}
          CORPUS_SEARCH_WAIVED: ${{ needs.resolve.outputs.corpus_search_waived }}
          WAIVE_REASON: ${{ inputs.waive_reason }}
          JOB_STATUS: ${{ job.status }}
        run: |
          set -euo pipefail
          state=failure
          description="Staging smoke failure: run ${GITHUB_RUN_ID}"
          if [[ "$WEB_SMOKE" == "success" && "$API_SMOKE" == "success" && "$JOB_STATUS" == "success" ]]; then
            if [[ "$CORPUS_PREFLIGHT" == "success" && "$MCP_SMOKE" == "success" ]]; then
              state=success
              description="Staging smoke success: run ${GITHUB_RUN_ID}"
            elif [[ "$CORPUS_SEARCH_WAIVED" == "true" && "$CORPUS_PREFLIGHT" == "failure" && "$MCP_SMOKE" == "skipped" ]]; then
              state=success
              description="waived: corpus-search (${WAIVE_REASON})"
            fi
          fi
          if [[ "$CORPUS_SEARCH_WAIVED" == "true" ]]; then
            {
              echo "### Named staging waiver: corpus-search"
              printf 'Reason: %s\n' "$WAIVE_REASON"
              printf 'Corpus preflight result: %s; dependent MCP smoke result: %s.\n' "$CORPUS_PREFLIGHT" "$MCP_SMOKE"
              if [[ "$CORPUS_PREFLIGHT" == "success" ]]; then
                echo "Waiver unused: the corpus preflight passed."
              else
                printf 'Verification status: %s.\n' "$state"
              fi
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          run_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          jq -n --arg state "$state" --arg description "$description" --arg url "$run_url" \
            '{state: $state, context: "staging/verified", description: $description, target_url: $url}' |
            gh api "repos/${GITHUB_REPOSITORY}/statuses/${DEPLOY_SHA}" \
              --method POST --input - >/dev/null
          jq -n --arg state "$state" --arg url "$run_url" \
            '{state: $state, environment_url: "https://staging.stll.app", log_url: $url}' |
            gh api "repos/${GITHUB_REPOSITORY}/deployments/${DEPLOYMENT_ID}/statuses" \
              --method POST --input - >/dev/null
