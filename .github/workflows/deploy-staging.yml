name: Deploy main to staging

# Deploys the tip of main into staging once a day, and on demand. The
# tagged release workflow remains the production path.
#
# The scheduled run deploys only when staging serves a different commit than
# main, so a day without merges deploys nothing. Staging can be unreachable
# for reasons that say nothing about the commit, so an unreachable
# environment defers the deploy instead of failing it, and the next
# scheduled run resumes it once staging answers again. What still fails is a
# commit that cannot reach staging for MAX_DEFERRAL_HOURS: that is a stalled
# delivery rather than a passing interruption.

on:
  schedule:
    # Daily, after the staging environment's own morning start.
    - cron: "0 6 * * *"
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/stella-api
  WEB_IMAGE_NAME: ${{ github.repository_owner }}/stella-web

jobs:
  # Tie promotion and its dependent smoke job to the current health of the
  # staging environment.
  staging-health:
    name: Check staging health
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      deployments: read
    outputs:
      deploy: ${{ steps.decide.outputs.deploy }}

    steps:
      - name: Probe staging health
        id: probe
        env:
          STAGING_HEALTH_URL: https://api-staging.stll.app/ready
          STAGING_LEGACY_HEALTH_URL: https://api-staging.stll.app/health
          EDGE_HEADER_NAME: ${{ secrets.E2E_EDGE_HEADER_NAME }}
          EDGE_HEADER_VALUE: ${{ secrets.E2E_EDGE_HEADER_VALUE }}
        run: |
          set -euo pipefail

          # Optional edge access header on the probes; no-op when unset.
          curl_edge_args=()
          if [[ -n "${EDGE_HEADER_NAME:-}" && -n "${EDGE_HEADER_VALUE:-}" ]]; then
            curl_edge_args+=(--header "${EDGE_HEADER_NAME}: ${EDGE_HEADER_VALUE}")
          fi

          readonly READY_STATUS="ready"
          readonly NOT_READY_STATUS="not_ready"
          readonly MAX_ATTEMPTS=3
          readonly RETRY_SECONDS=5

          response_file="$RUNNER_TEMP/staging-health.json"
          status="$NOT_READY_STATUS"
          served_commit=""
          for ((attempt = 1; attempt <= MAX_ATTEMPTS; attempt += 1)); do
            http_status="000"
            if ! http_status="$(
              curl \
                --connect-timeout 5 \
                --max-time 10 \
                --output "$response_file" \
                --silent \
                --show-error \
                --write-out '%{http_code}' \
                "${curl_edge_args[@]}" \
                "$STAGING_HEALTH_URL"
            )"; then
              http_status="000"
            fi

            if [[ "$http_status" == "404" ]]; then
              echo "Staging does not expose /ready; checking the legacy /health endpoint."
              if ! http_status="$(
                curl \
                  --connect-timeout 5 \
                  --max-time 10 \
                  --output "$response_file" \
                  --silent \
                  --show-error \
                  --write-out '%{http_code}' \
                  "${curl_edge_args[@]}" \
                  "$STAGING_LEGACY_HEALTH_URL"
              )"; then
                http_status="000"
              fi
            fi

            if [[ "$http_status" == "200" ]] &&
              jq -e '.status == "ok"' "$response_file" >/dev/null 2>&1; then
              status="$READY_STATUS"
              served_commit="$(jq -r '.commit // ""' "$response_file")"
              break
            fi

            echo "Staging health probe ${attempt}/${MAX_ATTEMPTS} returned HTTP ${http_status}."
            if (( attempt < MAX_ATTEMPTS )); then
              sleep "$RETRY_SECONDS"
            fi
          done

          echo "status=${status}" >> "$GITHUB_OUTPUT"
          echo "served_commit=${served_commit}" >> "$GITHUB_OUTPUT"

      # Absent staging defers; a commit that stays undeliverable fails.
      - name: Decide deploy, defer, or escalate
        id: decide
        env:
          DEPLOY_ENVIRONMENT: staging
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SERVED_COMMIT: ${{ steps.probe.outputs.served_commit }}
          STATUS: ${{ steps.probe.outputs.status }}
        run: |
          set -euo pipefail

          # A passing interruption resolves well inside this budget; anything
          # longer is a stalled delivery worth waking someone. The gate is
          # sampled once a day, so the budget spans more than one sample: an
          # outage that outlives the first daily run is observed by the next.
          readonly MAX_DEFERRAL_HOURS=36

          if [[ "$STATUS" == "ready" ]]; then
            # A dispatch always deploys what it carries. The schedule only
            # deploys when it can prove staging serves something else, so an
            # unreadable commit stamp leaves staging alone instead of
            # redeploying it on every tick.
            if [[ "$GITHUB_EVENT_NAME" == "schedule" ]]; then
              if [[ ! "$SERVED_COMMIT" =~ ^[0-9a-f]{40}$ ]]; then
                echo "deploy=false" >> "$GITHUB_OUTPUT"
                echo "Staging reported no resolvable commit, so there is nothing to resume." >> "$GITHUB_STEP_SUMMARY"
                exit 0
              fi
              if [[ "$SERVED_COMMIT" == "$GITHUB_SHA" ]]; then
                echo "deploy=false" >> "$GITHUB_OUTPUT"
                echo "Staging already serves \`${GITHUB_SHA}\`; nothing to resume." >> "$GITHUB_STEP_SUMMARY"
                exit 0
              fi
            fi
            echo "deploy=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
            echo "::notice::Staging is not answering; workflow_dispatch bypasses the gate and deploys anyway."
            exit 0
          fi

          echo "deploy=false" >> "$GITHUB_OUTPUT"

          # Only the schedule escalates: a dispatch has just started waiting,
          # and the schedule revisits it against a measured wait, so the
          # decision is made in one place.
          if [[ "$GITHUB_EVENT_NAME" == "schedule" ]]; then
            # The last commit recorded as deployed. Empty before this workflow
            # has recorded one, which reads as "still pending" and so can only
            # escalate, never suppress.
            deployed_sha="$(
              gh api \
                "repos/${GITHUB_REPOSITORY}/deployments?environment=${DEPLOY_ENVIRONMENT}&per_page=1" \
                --jq '.[0].sha // ""'
            )"

            if [[ "$deployed_sha" == "$GITHUB_SHA" ]]; then
              {
                echo "### Staging is not answering"
                echo "Nothing is waiting: staging already has \`${GITHUB_SHA}\`, so this run stays green."
              } >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi

            # How long delivery has been blocked, which is the age of the
            # oldest commit staging has not taken yet. Measuring the tip
            # instead would restart the clock on every push made during one
            # continuous outage, so the alarm would never fire. jq resolves
            # the timestamp so the arithmetic does not depend on GNU date's -d.
            pending_since_epoch=""
            if [[ -n "$deployed_sha" ]]; then
              pending_since_epoch="$(
                gh api \
                  "repos/${GITHUB_REPOSITORY}/compare/${deployed_sha}...${GITHUB_SHA}" \
                  --jq '[.commits[].commit.committer.date | fromdateiso8601] | first // empty' \
                  2>/dev/null || true
              )"
            fi

            # Before the first recorded deployment, and if the recorded commit
            # has since left the history, the tip is all there is to measure.
            if [[ -z "$pending_since_epoch" ]]; then
              pending_since_epoch="$(
                gh api "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}" \
                  --jq '.commit.committer.date | fromdateiso8601'
              )"
            fi

            waited_seconds=$(( $(date -u +%s) - pending_since_epoch ))

            if (( waited_seconds > MAX_DEFERRAL_HOURS * 3600 )); then
              waited_hours=$(( waited_seconds / 3600 ))
              {
                echo "### Staging deploy stalled"
                echo "Staging has not answered its health probe, and has taken no commit for ${waited_hours}h. The tip waiting on it is \`${GITHUB_SHA}\`."
                echo "That is past the ${MAX_DEFERRAL_HOURS}h budget, so staging needs a look."
              } >> "$GITHUB_STEP_SUMMARY"
              echo "::error::Staging has taken no commit for ${waited_hours}h (budget ${MAX_DEFERRAL_HOURS}h); the environment needs attention."
              exit 1
            fi
          fi

          {
            echo "### Staging deploy deferred"
            echo "Staging is not answering its health probe, so \`${GITHUB_SHA}\` was not deployed."
            echo "The scheduled run resumes it automatically once staging is reachable; this run stays green because the commit itself is fine."
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::notice::Staging is not answering; deploy of ${GITHUB_SHA} deferred until it does."

  build-api:
    name: Build staging API image
    needs: staging-health
    if: >-
      github.ref == 'refs/heads/main' &&
      needs.staging-health.outputs.deploy == 'true'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
      artifact-metadata: write
    concurrency:
      group: staging-api-build
      cancel-in-progress: true
    outputs:
      digest: ${{ steps.build.outputs.digest }}
      release-ref: ${{ steps.ref.outputs.release_ref }}

    steps:
      - name: Resolve synthetic ref
        id: ref
        env:
          SHA: ${{ github.sha }}
        run: |
          short="${SHA:0:7}"
          echo "release_ref=main-${short}" >> "$GITHUB_OUTPUT"
          echo "short_sha=${short}" >> "$GITHUB_OUTPUT"

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          # The API image ships the bundled template-pack content.
          submodules: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Login to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: apps/api/Dockerfile
          platforms: linux/arm64
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.ref.outputs.release_ref }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:main-latest
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache-staging
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache-staging,mode=max
          build-args: |
            STELLA_VERSION=${{ steps.ref.outputs.release_ref }}
            STELLA_COMMIT_SHA=${{ github.sha }}

      - name: Attest image provenance
        uses: ./.github/actions/provenance
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.build.outputs.digest }}

  build-web:
    name: Build staging web image
    needs: staging-health
    if: >-
      github.ref == 'refs/heads/main' &&
      needs.staging-health.outputs.deploy == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
      artifact-metadata: write
    concurrency:
      group: staging-web-build
      cancel-in-progress: true
    outputs:
      digest: ${{ steps.build.outputs.digest }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Resolve synthetic ref
        id: ref
        env:
          SHA: ${{ github.sha }}
        run: |
          echo "release-ref=main-${SHA:0:7}" >>"$GITHUB_OUTPUT"

      - name: Build and publish web image
        id: build
        uses: ./.github/actions/build-web-image
        with:
          release-ref: ${{ steps.ref.outputs.release-ref }}
          release-sha: ${{ github.sha }}
          target-environment: staging
          posthog-key: ${{ secrets.VITE_POSTHOG_KEY }}
          posthog-cli-api-key: ${{ secrets.POSTHOG_CLI_API_KEY }}
          posthog-project-id: ${{ vars.POSTHOG_PROJECT_ID }}

      - name: Attest web image provenance
        uses: ./.github/actions/provenance
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.WEB_IMAGE_NAME }}
          subject-digest: ${{ steps.build.outputs.digest }}

  promote-staging:
    name: Promote staging images
    needs: [build-api, build-web]
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    # Deployment and its smoke verification are one serialized side-effecting
    # unit. Public builds may be cancelled; this job may not be interrupted
    # after it dispatches Terraform work into the private repository.
    concurrency:
      group: deploy-staging
      cancel-in-progress: false
    permissions:
      contents: read
      deployments: write
    # Release App key lives in this environment (main and v* tags only).
    environment: release-app
    steps:
      - name: Checkout workflow actions
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false

      # Builds are intentionally free to finish. Only the newest main SHA may
      # cross the private-compute boundary; an obsolete queued build is a
      # successful no-op, and the newer workflow converges staging afterward.
      - name: Confirm this SHA is still main
        id: current
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          current_sha="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq '.object.sha')"
          if [[ "$current_sha" != "$GITHUB_SHA" ]]; then
            echo "promoted=false" >>"$GITHUB_OUTPUT"
            echo "Skipping private promotion of obsolete commit \`${GITHUB_SHA}\`; main is \`${current_sha}\`." >>"$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          echo "promoted=true" >>"$GITHUB_OUTPUT"

      - name: Check staging deployment target is configured
        if: steps.current.outputs.promoted == 'true'
        env:
          DEPLOY_REPOSITORY: ${{ github.repository_owner }}/${{ vars.STAGING_DEPLOY_REPOSITORY }}
          DEPLOY_WORKFLOW: ${{ vars.STAGING_DEPLOY_WORKFLOW }}
        run: |
          if [[ -z "${DEPLOY_REPOSITORY#*/}" || -z "$DEPLOY_WORKFLOW" ]]; then
            echo "::error::Staging deployment target is not configured." >&2
            exit 1
          fi

      # Watches the dispatched run to completion: a promote that fails after
      # the dispatch is accepted must fail this job, so verify-staging is
      # skipped by `needs` instead of blocking on a commit that will never
      # be served.
      - name: Deploy to staging
        if: steps.current.outputs.promoted == 'true'
        uses: ./.github/actions/promote-dispatch
        with:
          app-client-id: ${{ vars.STELLA_RELEASE_APP_CLIENT_ID }}
          app-private-key: ${{ secrets.STELLA_RELEASE_APP_PRIVATE_KEY }}
          infra-repo: ${{ github.repository_owner }}/${{ vars.STAGING_DEPLOY_REPOSITORY }}
          workflow-file: ${{ vars.STAGING_DEPLOY_WORKFLOW }}
          release-ref: ${{ needs.build-api.outputs.release-ref }}
          target-environment: staging
          image-digest: ${{ needs.build-api.outputs.digest }}
          web-image-digest: ${{ needs.build-web.outputs.digest }}
          git-sha: ${{ github.sha }}

      # The commit staging is running, recorded where it outlives this run:
      # the health gate reads it to tell a deploy that is waiting from one
      # that is stuck.
      - name: Record staging deployment
        if: steps.current.outputs.promoted == 'true'
        env:
          DEPLOY_ENVIRONMENT: staging
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          deployment_id="$(
            jq -n \
              --arg ref "$GITHUB_SHA" \
              --arg environment "$DEPLOY_ENVIRONMENT" \
              '{
                ref: $ref,
                environment: $environment,
                auto_merge: false,
                required_contexts: [],
                production_environment: false,
                description: "Continuous deploy of main to staging"
              }' |
              gh api "repos/${GITHUB_REPOSITORY}/deployments" \
                --method POST --input - --jq '.id'
          )"

          jq -n '{state: "success", environment_url: "https://staging.stll.app"}' |
            gh api "repos/${GITHUB_REPOSITORY}/deployments/${deployment_id}/statuses" \
              --method POST --input - >/dev/null

      # Post-deploy verification stays in the serialized promotion job. If it
      # were a separate job, a newer promotion could start while this smoke
      # still measures the previous commit.
      - name: Checkout deployed source
        if: steps.current.outputs.promoted == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Setup Bun
        if: steps.current.outputs.promoted == 'true'
        uses: stella/.github/actions/setup-bun-cached@2703e4d3ed115089e593e4ca5cc749be4a5d8cee

      - name: Install dependencies
        id: smoke-deps
        if: steps.current.outputs.promoted == 'true'
        run: bash scripts/bun-ci-retry.sh --ignore-scripts
        env:
          NPM_TOKEN: ""

      - name: Install Playwright browser
        if: steps.current.outputs.promoted == 'true'
        run: cd apps/web && bunx playwright install --with-deps chromium

      - name: Run staging web smoke
        if: steps.current.outputs.promoted == 'true'
        run: bun --filter @stll/web test:e2e:staging
        env:
          E2E_WEB_URL: https://staging.stll.app
          E2E_API_URL: https://api-staging.stll.app
          SMOKE_SESSION_SECRET: ${{ secrets.SMOKE_SESSION_SECRET }}
          E2E_EDGE_HEADER_NAME: ${{ secrets.E2E_EDGE_HEADER_NAME }}
          E2E_EDGE_HEADER_VALUE: ${{ secrets.E2E_EDGE_HEADER_VALUE }}
          # Block the smoke until staging actually serves this commit,
          # so it doesn't race the ECS task rollover.
          EXPECTED_COMMIT: ${{ github.sha }}

      # `!cancelled()` keeps this signal when the web smoke fails, but it
      # also suppresses the implicit success() gate, so without the explicit
      # deps condition this step ran after a failed deploy with no toolchain
      # installed and died with `bun: command not found`.
      - name: Run staging API chat smoke
        if: ${{ steps.current.outputs.promoted == 'true' && !cancelled() && steps.smoke-deps.conclusion == 'success' }}
        run: bun apps/api/src/scripts/post-deploy-smoke.ts "$E2E_API_URL"
        env:
          E2E_API_URL: https://api-staging.stll.app
          SMOKE_SESSION_SECRET: ${{ secrets.SMOKE_SESSION_SECRET }}
          E2E_EDGE_HEADER_NAME: ${{ secrets.E2E_EDGE_HEADER_NAME }}
          E2E_EDGE_HEADER_VALUE: ${{ secrets.E2E_EDGE_HEADER_VALUE }}
          EXPECTED_COMMIT: ${{ github.sha }}

      - name: Upload Playwright report
        if: ${{ steps.current.outputs.promoted == 'true' && failure() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: staging-smoke-report
          path: apps/web/playwright-report/
          retention-days: 7
