name: API test memory measurements

on:
  schedule:
    - cron: "23 2 * * 0"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: api-test-memory-${{ github.ref }}
  cancel-in-progress: false

jobs:
  measure:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    env:
      API_TEST_SHARD: ${{ matrix.shard }}/4
      API_TEST_LANES: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: true

      - name: Setup Bun
        uses: stella/.github/actions/setup-bun-cached@167fb396c6c0f4e07296ad2cd72e6ef15367c776
        with:
          save: ${{ github.ref == 'refs/heads/main' }}
          bun-version-file: package.json

      - name: Install dependencies
        env:
          NPM_TOKEN: ""
        run: bash scripts/retry.sh bun ci --ignore-scripts

      - name: Prepare environment
        run: |
          cp apps/api/.env.example apps/api/.env
          cp apps/web/.env.example apps/web/.env

      - name: Generate sources
        run: bun run generate

      - name: Measure every test in this shard
        run: |
          bun --filter @stll/api test -- \
            --measure-rss "$GITHUB_WORKSPACE/api-test-rss-${{ matrix.shard }}.json" \
            --measure-rss-image "$ImageOS:$ImageVersion" \
            --measure-rss-source '{"runId":"${{ github.run_id }}","job":"${{ github.job }}-${{ matrix.shard }}"}'

      - name: Upload measurements
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: api-test-rss-${{ matrix.shard }}
          path: api-test-rss-${{ matrix.shard }}.json
          if-no-files-found: error
          retention-days: 30

  # Proposes the measured table as a pull request that changes nothing else.
  # Main only: a dispatch from a feature branch measured that branch's tests.
  refresh:
    name: Propose the refreshed memory profile
    needs: measure
    if: github.repository == 'stella/stella' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      PEAK_RSS_TABLE: apps/api/scripts/test-peak-rss.json
      REFRESH_BRANCH: chore/refresh-api-test-memory
    steps:
      # The refresh branch is rebuilt from the checked-out tip, so it must be
      # main's current tip rather than the measured commit.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.repository.default_branch }}

      - name: Setup Bun
        uses: stella/.github/actions/setup-bun-cached@167fb396c6c0f4e07296ad2cd72e6ef15367c776
        with:
          save: ${{ github.ref == 'refs/heads/main' }}
          bun-version-file: package.json

      - name: Install dependencies
        env:
          NPM_TOKEN: ""
        run: bash scripts/retry.sh bun ci --ignore-scripts

      - name: Download this run's measurements
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: api-test-rss-*
          path: ${{ runner.temp }}/api-test-rss

      - name: Refresh the table
        id: refresh
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          bun apps/api/scripts/refresh-test-peak-rss.ts "$RUNNER_TEMP/api-test-rss" "$PEAK_RSS_TABLE" > "$RUNNER_TEMP/refresh-report.json"
          {
            echo "### API test memory refresh"
            echo
            echo '```json'
            cat "$RUNNER_TEMP/refresh-report.json"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          # The pull request carries the table alone.
          unexpected="$(git status --porcelain --untracked-files=all -- . ":(exclude,literal)$PEAK_RSS_TABLE")"
          if [[ -n "$unexpected" ]]; then
            echo "::error::The refresh changed files other than $PEAK_RSS_TABLE."
            echo "$unexpected"
            exit 1
          fi

          if git diff --quiet -- "$PEAK_RSS_TABLE"; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "changed=true" >> "$GITHUB_OUTPUT"
          {
            echo "pr-body<<PR_BODY_EOF"
            echo "Replaces \`$PEAK_RSS_TABLE\` with the per-file peaks from [the weekly measurement run]($RUN_URL); no other file changes."
            echo
            jq -r '"New files: \(.newFiles | length). Unmeasured files: \(.unmeasuredFiles | length). Removed files: \(.removedFiles | length)."
              + (if .biggestRelativeChange then " Largest relative change: `\(.biggestRelativeChange.file)` from \(.biggestRelativeChange.previousPeakMb) MB to \(.biggestRelativeChange.peakMb) MB." else "" end)' \
              "$RUNNER_TEMP/refresh-report.json"
            echo "PR_BODY_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Mint app token
        if: steps.refresh.outputs.changed == 'true'
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.PROVENANCE_APP_ID }}
          private-key: ${{ secrets.PROVENANCE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          permission-pull-requests: write

      # The commit is created through the API so GitHub signs it. The branch
      # is reserved for this job: each run replaces the open proposal with one
      # computed from current main instead of opening another.
      - name: Open or update the refresh PR
        if: steps.refresh.outputs.changed == 'true'
        uses: stella/.github/.github/actions/signed-commit@167fb396c6c0f4e07296ad2cd72e6ef15367c776
        with:
          token: ${{ steps.app-token.outputs.token }}
          mode: refresh-pr
          branch: ${{ env.REFRESH_BRANCH }}
          base: main
          paths: ${{ env.PEAK_RSS_TABLE }}
          commit-message: "chore(ci): refresh API test memory profile"
          pr-title: "chore(ci): refresh API test memory profile"
          pr-body: ${{ steps.refresh.outputs.pr-body }}
