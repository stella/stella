name: Release PR

on:
  push:
    branches: [main]

concurrency:
  # Queue instead of cancel: this workflow pushes commits to the release PR
  # branch, so a cancelled mid-push run could leave that branch half-updated.
  group: release-pr-${{ github.ref }}
  cancel-in-progress: false

permissions: {}

jobs:
  version:
    name: Maintain Version Packages PR
    permissions:
      contents: read
    # The repository owner publishes this versioned shared contract.
    uses: stella/.github/.github/workflows/changeset-release-pr.yml@v1.5.0 # zizmor: ignore[unpinned-uses]
    with:
      bun-version-file: package.json
    secrets:
      CHANGELOG_APP_ID: ${{ secrets.CHANGELOG_APP_ID }}
      CHANGELOG_APP_PRIVATE_KEY: ${{ secrets.CHANGELOG_APP_PRIVATE_KEY }}
