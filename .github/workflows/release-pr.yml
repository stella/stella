name: Version packages PR

on:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions: {}

jobs:
  # The current VERSION must be tagged before another versioning pass.
  # Open release pull requests also own their pending changesets.
  gate:
    name: Check release versioning state
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      may-version: ${{ steps.release.outputs.may-version }}
    steps:
      - name: Check out the release recognition rule
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: |
            scripts/gh-retry.sh
            scripts/release-pull-requests.sh
            scripts/release-pending.sh
          sparse-checkout-cone-mode: false

      - name: Check pending tags and open release pull requests
        # The title alone is contributor-controlled text, which would make this
        # an unauthenticated switch for suppressing versioning. A release is
        # recognized only as a ready pull request into main whose head branch
        # lives in this repository, which takes write access to push.
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          pending=$(bash scripts/release-pending.sh --repo "$REPOSITORY")
          version_state=$(sed -n 's/^version_state=//p' <<<"$pending")
          if [[ "$version_state" == "pending" ]]; then
            version=$(sed -n 's/^version=//p' <<<"$pending")
            echo "may-version=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Release v$version on main awaits its tag; skipping versioning."
            exit 0
          fi
          open=$(bash scripts/release-pull-requests.sh --repo "$REPOSITORY" \
            | sed -n 's/^open_other=//p')
          if [[ "$open" == "0" ]]; then
            echo "may-version=true" >> "$GITHUB_OUTPUT"
          else
            echo "may-version=false" >> "$GITHUB_OUTPUT"
            echo "::notice::$open open release pull request(s) version the pending changesets; skipping."
          fi

  version:
    needs: gate
    if: needs.gate.outputs.may-version == 'true' && vars.STELLA_MERGE_HOLD == ''
    name: Maintain Version Packages PR
    permissions:
      contents: read
      pull-requests: read
      checks: read
    # The repository owner publishes this versioned shared contract.
    uses: stella/.github/.github/workflows/changeset-release-pr.yml@167fb396c6c0f4e07296ad2cd72e6ef15367c776
    with:
      bun-version-file: package.json
      auto-merge-command: >-
        HEAD_SHA="$(gh pr view "$RELEASE_PR_NUMBER" --repo "$GITHUB_REPOSITORY" --json headRefOid --jq .headRefOid)";
        gh pr merge "$RELEASE_PR_NUMBER" --repo "$GITHUB_REPOSITORY" --auto --squash --match-head-commit "$HEAD_SHA"
    secrets:
      CHANGELOG_APP_ID: ${{ secrets.CHANGELOG_APP_ID }}
      CHANGELOG_APP_PRIVATE_KEY: ${{ secrets.CHANGELOG_APP_PRIVATE_KEY }}
