name: Version packages PR

on:
  push:
    branches: [main]
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

concurrency:
  # Let the active release mutation finish; newer main pushes replace obsolete
  # pending runs, and the shared workflow rejects stale source revisions.
  group: release-pr-${{ github.ref }}
  cancel-in-progress: false

permissions: {}

jobs:
  # An open release pull request already carries the pending changesets:
  # `bun run release:maintenance` applies them in the release commit, so a
  # Version Packages pull request opened beside it would version the same
  # entries a second time. The boundary: while a release is open, the release
  # owns versioning; otherwise this workflow does. `workflow_dispatch` runs
  # regardless, which is the manual path to a package-only publish.
  gate:
    name: Check for an open release
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      may-version: ${{ steps.release.outputs.may-version }}
    steps:
      - name: Check out the release recognition rule
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: scripts/release-pull-requests.sh
          sparse-checkout-cone-mode: false

      - name: Look for an open release pull request
        # The title alone is contributor-controlled text, which would make this
        # an unauthenticated switch for suppressing versioning. A release is
        # recognized only as a ready pull request into main whose head branch
        # lives in this repository, which takes write access to push.
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          MANUAL: ${{ github.event_name == 'workflow_dispatch' }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          open=$(bash scripts/release-pull-requests.sh --repo "$REPOSITORY" \
            | sed -n 's/^open_other=//p')
          if [[ "$MANUAL" == "true" || "$open" == "0" ]]; then
            echo "may-version=true" >> "$GITHUB_OUTPUT"
          else
            echo "may-version=false" >> "$GITHUB_OUTPUT"
            echo "::notice::$open open release pull request(s) version the pending changesets; skipping."
          fi

  version:
    needs: gate
    if: needs.gate.outputs.may-version == 'true'
    name: Maintain Version Packages PR
    permissions:
      contents: read
      pull-requests: read
      checks: read
    # The repository owner publishes this versioned shared contract.
    uses: stella/.github/.github/workflows/changeset-release-pr.yml@aff5017c264acce5a2bcdf15876da08835e6de70
    with:
      bun-version-file: package.json
      auto-merge-command: bun scripts/merge-bar.ts "$RELEASE_PR_NUMBER"
    secrets:
      CHANGELOG_APP_ID: ${{ secrets.CHANGELOG_APP_ID }}
      CHANGELOG_APP_PRIVATE_KEY: ${{ secrets.CHANGELOG_APP_PRIVATE_KEY }}
