name: Visual preview
on:
  pull_request:
    paths:
      - apps/visual-preview/**
      - apps/api/src/handlers/visual-sandbox/**
      - packages/api-contract/src/visual-sandbox.ts
      - packages/api-contract/src/visual-preview.ts
      - bun.lock
      - .github/workflows/visual-preview.yml
  merge_group:
  workflow_dispatch:
env:
  NPM_TOKEN: ""
permissions:
  contents: read
concurrency:
  group: visual-preview-${{ github.ref }}
  cancel-in-progress: true
jobs:
  preview:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Select preview changes
        id: scope
        env:
          BASE_SHA: ${{ github.event.merge_group.base_sha }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ "$EVENT_NAME" != merge_group ]; then
            echo 'required=true' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git fetch --no-tags --depth=1 origin "$BASE_SHA"
          if git diff --name-only "$BASE_SHA" HEAD | rg '^(apps/visual-preview/|apps/api/src/handlers/visual-sandbox/|packages/api-contract/src/visual-sandbox.ts$|packages/api-contract/src/visual-preview|bun.lock$|.github/workflows/visual-preview.yml$)'; then
            echo 'required=true' >> "$GITHUB_OUTPUT"
          else
            echo 'required=false' >> "$GITHUB_OUTPUT"
          fi
      - if: steps.scope.outputs.required == 'true'
        uses: stella/.github/actions/setup-bun-cached@167fb396c6c0f4e07296ad2cd72e6ef15367c776
        with:
          bun-version-file: package.json
      - name: Install renderer dependencies
        if: steps.scope.outputs.required == 'true'
        run: bun install --frozen-lockfile --ignore-scripts --filter @stll/visual-preview
      - name: Test renderer validation
        if: steps.scope.outputs.required == 'true'
        run: bun --filter @stll/visual-preview test
      - name: Test preview in the pinned browser image
        if: steps.scope.outputs.required == 'true'
        run: bash .github/actions/setup-playwright/run-in-image.sh --offline bun --filter @stll/visual-preview test:browser
      - name: Build Lambda image
        if: steps.scope.outputs.required == 'true'
        run: docker build --platform linux/arm64 -f apps/visual-preview/Dockerfile -t visual-preview:test .
      - name: Exercise Lambda image without network
        if: steps.scope.outputs.required == 'true'
        run: |
          docker run --rm --network none -e AWS_EXECUTION_ENV=AWS_Lambda_nodejs22.x --entrypoint /var/lang/bin/node visual-preview:test \
            --input-type=module -e '
              import { handler } from "/var/task/handler.mjs";
              const result = await handler({document: "<body><h1>Example</h1><script>parent.postMessage({kind: \"ready\"}, \"*\")</script>", viewport: {width: 1200}});
              if (!result.readyFired || result.blockedRequests !== 0 || !result.png.startsWith("iVBOR")) throw new Error("Preview smoke failed");
              console.log(JSON.stringify({size: result.size, readyFired: result.readyFired, blockedRequests: result.blockedRequests}));
            '
