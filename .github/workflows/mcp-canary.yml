name: MCP canary

on:
  schedule:
    - cron: "*/10 * * * *"
    # Overnight, offset from the other nightly jobs so a shared runner queue
    # does not delay the probe past its own timeout.
    - cron: "43 2 * * *"
  workflow_dispatch:
    inputs:
      base_url:
        description: API base URL to probe
        required: false
        type: string
      mode:
        description: Probe mode (full also registers an OAuth client)
        required: true
        default: frequent
        type: choice
        options:
          - frequent
          - full

permissions: {}

jobs:
  mcp-canary:
    name: MCP user journeys
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    concurrency:
      group: mcp-canary
      cancel-in-progress: false
    steps:
      # The dispatch input takes any URL, and the token is a bearer credential
      # the probe sends to whatever it is pointed at, so the two are resolved
      # together here: the credential travels only to the configured endpoint,
      # and a run aimed anywhere else gets the public probes alone.
      - name: Resolve the probe target
        id: target
        env:
          CONFIGURED_BASE_URL: ${{ vars.MCP_CANARY_BASE_URL }}
          INPUT_BASE_URL: ${{ inputs.base_url }}
        run: |
          configured="${CONFIGURED_BASE_URL:-https://api.stll.app}"
          target="${INPUT_BASE_URL:-$configured}"
          echo "base_url=$target" >> "$GITHUB_OUTPUT"
          if [ "$target" = "$configured" ]; then
            echo "authenticated=true" >> "$GITHUB_OUTPUT"
          else
            echo "authenticated=false" >> "$GITHUB_OUTPUT"
          fi

      # The probes exercise what the target serves, so they run from the commit
      # the target reports on /health, never from main: a route merged but not
      # yet released would otherwise fail every probe against production.
      - name: Resolve the deployed commit
        id: deployed
        env:
          BASE_URL: ${{ steps.target.outputs.base_url }}
        run: |
          body="$(curl --fail --silent --show-error --max-time 20 --retry 3 --retry-all-errors "${BASE_URL%/}/health")"
          commit="$(printf '%s' "$body" | jq -r '.commit // empty')"
          if ! printf '%s' "$commit" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "::error::${BASE_URL} did not report its deployed commit on /health."
            exit 1
          fi
          echo "commit=$commit" >> "$GITHUB_OUTPUT"

      - name: Checkout the deployed commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.deployed.outputs.commit }}
          persist-credentials: false

      - name: Setup Bun
        uses: stella/.github/actions/setup-bun-cached@167fb396c6c0f4e07296ad2cd72e6ef15367c776
        with:
          save: ${{ github.ref == 'refs/heads/main' }}
          bun-version-file: "package.json"

      - name: Install dependencies
        run: bash scripts/retry.sh bun ci --ignore-scripts
        env:
          NPM_TOKEN: ""

      # The token is optional on purpose: without it the public probes still
      # run and the authenticated ones report as skipped, so a missing secret
      # never masquerades as full coverage.
      - name: Probe MCP user journeys
        env:
          MCP_CANARY_ENVIRONMENT: production
          MCP_CANARY_BASE_URL: ${{ steps.target.outputs.base_url }}
          MCP_CANARY_FRONTEND_URL: ${{ vars.MCP_CANARY_FRONTEND_URL || 'https://my.stll.app' }}
          MCP_CANARY_MODE: ${{ github.event.schedule == '43 2 * * *' && 'full' || inputs.mode || 'frequent' }}
          MCP_CANARY_TOKEN: ${{ steps.target.outputs.authenticated == 'true' && secrets.MCP_CANARY_TOKEN || '' }}
        run: bun run canary:mcp
