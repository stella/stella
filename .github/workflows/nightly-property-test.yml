name: Nightly Property Tests

on:
  schedule:
    # 05:17 UTC daily, after the nightly full test suite.
    - cron: "17 5 * * *"
  workflow_dispatch:
    inputs:
      factor:
        description: "numRuns multiplier (overrides the default nightly factor)"
        required: false
        default: "10"

permissions: {}

jobs:
  property-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: true

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: "package.json"

      - name: Install dependencies
        run: bash scripts/retry.sh bun ci --ignore-scripts
        env:
          # .npmrc references NPM_TOKEN, but this workflow can be manually
          # dispatched on a branch ref. Do not expose the real token to
          # branch-controlled install scripts.
          NPM_TOKEN: ""

      - name: Prepare environment
        run: |
          cd ./apps/api
          cp .env.example .env
          cd ../web
          cp .env.example .env

      # Run only the property tests, in isolation, with a larger per-test
      # budget than PR CI affords. Each package's test:property selects every
      # test file that uses fc.assert (by content, so a file does not have to be
      # named *.property.test.ts to be covered). `propertyConfig` from
      # @stll/property-testing reads PROPERTY_TEST_NUM_RUNS_FACTOR to scale every
      # property's numRuns; verbose reporting is on under CI so a failing run
      # logs the full list of shrunk values plus the replay seed.
      - name: Property test suite
        run: bun run test:property
        env:
          TURBO_FORCE: "true"
          PROPERTY_TEST_NUM_RUNS_FACTOR: ${{ github.event.inputs.factor || '10' }}

  chat-mutation-matrix:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: true

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: "package.json"

      - name: Install dependencies
        run: bash scripts/retry.sh bun ci --ignore-scripts
        env:
          NPM_TOKEN: ""

      - name: Prepare environment
        run: |
          cd ./apps/api
          cp .env.example .env
          cd ../web
          cp .env.example .env

      # Each entry of apps/api/scripts/chat-mutation-matrix.json removes one
      # behaviour of the chat pipeline from the tree and requires its scenario
      # to fail at the oracle the entry names. A survivor, a failure at any
      # other point, or an entry whose mutation no longer applies fails the
      # job. Too slow for PR CI: every entry runs its scenario twice. The
      # --self-test run first proves a stopped runner leaves no mutation behind.
      - name: Chat mutation matrix
        run: |
          bun apps/api/scripts/chat-mutation-matrix.ts --self-test
          bun apps/api/scripts/chat-mutation-matrix.ts

  # We follow TanStack AI's future releases. Against the latest published
  # @tanstack/ai* versions, in this throwaway checkout: does each of our
  # patches still apply, or is it already upstream, and do the provider-wire
  # contract and the chat oracle suites still hold? Report only; it never
  # fails the workflow. Watch in particular for the part-state change in
  # TanStack/ai#1511 (a client tool's final state), which our persistence
  # reads.
  tanstack-drift:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    continue-on-error: true
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: true

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: "package.json"

      - name: Install pinned dependencies
        run: bash scripts/retry.sh bun ci --ignore-scripts
        env:
          NPM_TOKEN: ""

      - name: Move to the latest TanStack AI and check each patch
        id: write-package
        run: bun scripts/tanstack-drift.ts --write-package

      # A latest set that does not install is drift too: the report step
      # still runs and says so.
      - name: Install the latest TanStack AI
        id: install
        continue-on-error: true
        run: bash scripts/retry.sh bun install --ignore-scripts
        env:
          NPM_TOKEN: ""

      - name: Prepare environment
        run: |
          cd ./apps/api
          cp .env.example .env
          cd ../web
          cp .env.example .env

      - name: Report drift
        if: ${{ !cancelled() && steps.write-package.outcome == 'success' }}
        run: bun scripts/tanstack-drift.ts --report
        env:
          TANSTACK_DRIFT_INSTALL_OUTCOME: ${{ steps.install.outcome }}
