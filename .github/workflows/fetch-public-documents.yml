name: Fetch public source documents for verification

defaults:
  run:
    shell: bash

on:
  workflow_dispatch:
    inputs:
      urls:
        description: Newline-separated public HTTPS URLs
        required: true
        type: string

permissions: {}

jobs:
  fetch:
    runs-on: ubuntu-24.04
    timeout-minutes: 110
    steps:
      - name: Checkout network retry helper
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.repository }}
          ref: ${{ github.workflow_sha }}
          path: .network-retry
          persist-credentials: false
          sparse-checkout: scripts/retry.sh
          sparse-checkout-cone-mode: false

      - name: Stage network retry helper
        run: |
          cp "$GITHUB_WORKSPACE/.network-retry/scripts/retry.sh" "$RUNNER_TEMP/retry.sh"
          echo "NETWORK_RETRY_SCRIPT=$RUNNER_TEMP/retry.sh" >> "$GITHUB_ENV"

      - name: Checkout fetch script
        timeout-minutes: 5
        env:
          SOURCE_REPOSITORY: ${{ github.server_url }}/${{ github.repository }}
          SOURCE_REVISION: ${{ github.sha }}
        run: |
          git init .
          git remote add origin "$SOURCE_REPOSITORY"
          git sparse-checkout set --no-cone /package.json /scripts/fetch-public-documents.ts /packages/sha256/src/node.ts /packages/sha256/src/types.ts
          bash "$NETWORK_RETRY_SCRIPT" git -c credential.helper= fetch --depth=1 --filter=blob:none origin "$SOURCE_REVISION"
          git checkout --detach FETCH_HEAD
      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: "package.json"
          no-cache: true
      - name: Install PDF extractor
        run: |
          sudo apt-get update
          # Unpinned: the archive drops superseded versions on every security update.
          sudo apt-get install --no-install-recommends -y poppler-utils
          pdftotext -v
      - name: Fetch public source documents for verification
        timeout-minutes: 100
        env:
          PUBLIC_DOCUMENT_URLS: ${{ inputs.urls }}
        run: bun scripts/fetch-public-documents.ts
      - name: Upload documents
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: public-documents
          path: public-documents/
          retention-days: 1
          if-no-files-found: error
