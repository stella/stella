name: Record network baseline

# Main owns recordings. PR checks never write the shared JSON.
on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: Merge observed budgets or tighten them with a fresh snapshot
        type: choice
        default: write
        options: [write, rewrite]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions: {}

jobs:
  build:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Setup Bun
        uses: stella/.github/actions/setup-bun-cached@167fb396c6c0f4e07296ad2cd72e6ef15367c776
        with:
          save: ${{ github.ref == 'refs/heads/main' }}

      - name: Install dependencies
        run: bash scripts/retry.sh bun ci --ignore-scripts
        env:
          NPM_TOKEN: ""

      - name: Prepare environment
        run: cp apps/web/.env.example apps/web/.env

      - name: Build web with the comparison flags
        uses: ./.github/actions/build-e2e-web

      - name: Upload production web build
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-web-build
          path: apps/web/dist/
          if-no-files-found: error
          retention-days: 1

  record:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: read
      actions: read
    env:
      CI_IMAGE_MIRROR_ENABLED: ${{ github.event.pull_request.head.repo.fork != true && github.token != '' }}
    steps:
      - name: Checkout main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Bun
        uses: stella/.github/actions/setup-bun-cached@167fb396c6c0f4e07296ad2cd72e6ef15367c776
        with:
          save: ${{ github.ref == 'refs/heads/main' }}

      - name: Install dependencies
        run: bash scripts/retry.sh bun ci --ignore-scripts
        env:
          NPM_TOKEN: ""

      # Both comparison and recording use the same action, artifact, seed,
      # browser and production server. The recorder receives no secrets.
      - name: Setup production browser stack
        id: stack
        uses: ./.github/actions/setup-production-e2e
        with:
          expected-sha: ${{ github.sha }}

      - name: Require a ready stack
        if: steps.stack.outputs.status != 'ready'
        run: |
          echo "::error::Network baseline recording needs a ready E2E stack"
          exit 1

      - name: Seed write mode from the latest published recording
        if: (inputs.mode || 'write') == 'write'
        uses: ./.github/actions/prepare-network-baseline
        with:
          base-sha: ${{ github.sha }}
          token: ${{ github.token }}
          purpose: recording

      - name: Login to GitHub Container Registry for browser images
        if: github.event.pull_request.head.repo.fork != true && github.token != ''
        continue-on-error: true
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Record network baseline
        env:
          E2E_EXECUTION_PROFILE: network-baseline
          E2E_EXPECT_DEV_ROUTES: "false"
          E2E_NETWORK_BASELINE: ${{ inputs.mode || 'write' }}
          PLAYWRIGHT_BLOB_OUTPUT_NAME: report-network-baseline.zip
        run: bash "$GITHUB_WORKSPACE/.github/actions/setup-playwright/run-in-image.sh" bun --filter @stll/web test:e2e -- route-smoke.spec.ts

      - name: Validate recorded baseline
        run: bun scripts/network-baseline-scope.ts validate apps/web/e2e/network-baseline.json

      - name: Upload recorded JSON
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: network-baseline-record-${{ github.sha }}
          path: apps/web/e2e/network-baseline.json
          if-no-files-found: error
          retention-days: 7

      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: network-baseline-failure-${{ github.run_id }}
          path: |
            /tmp/api.log
            /tmp/web-production.log
            apps/web/e2e/test-results/
          if-no-files-found: ignore
          retention-days: 7

  deliver:
    needs: record
    if: github.ref == 'refs/heads/main' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
    permissions:
      actions: read
      contents: read
    uses: ./.github/workflows/network-baseline-deliver.yml
