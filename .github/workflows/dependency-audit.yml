name: Dependency Audit

# Gates on NEW high/critical advisories from `bun audit` against a committed,
# annotated baseline (scripts/dependency-audit-baseline.json). Runs on lockfile
# or baseline changes, on a nightly schedule (advisories are disclosed against
# already-resolved versions over time), and on demand. Complements the 5-day
# `minimumReleaseAge` quarantine in bunfig.toml, which blocks freshly published
# versions at install time.
#
# Also rejects a lockfile that Bun can deduplicate and proves that the
# effective lifecycle-script trust set exactly matches package.json.

on:
  pull_request:
    paths:
      - "bun.lock"
      - "bunfig.toml"
      - "package.json"
      - "patches/**"
      - "scripts/dependency-audit*"
      - "scripts/dependency-diff.ts"
      - "scripts/check-trusted-dependencies.ts"
      - ".github/workflows/dependency-audit.yml"
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ (github.event_name == 'pull_request') && format('pr-{0}', github.event.pull_request.number || github.ref) || format('run-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  audit:
    name: bun audit (high/critical)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: stella/.github/actions/setup-bun-cached@167fb396c6c0f4e07296ad2cd72e6ef15367c776
        with:
          save: ${{ github.ref == 'refs/heads/main' }}
          bun-version-file: "package.json"

      # The audit script loads installed packages; lifecycle scripts stay off.
      - name: Install dependencies
        run: bash scripts/retry.sh bun ci --ignore-scripts
        env:
          NPM_TOKEN: ""

      - name: Audit dependencies
        run: bun scripts/dependency-audit.ts --check

      - name: Check lockfile deduplication
        run: bun --no-env-file dedupe --check

      - name: Check trusted lifecycle dependencies
        run: bun --no-env-file scripts/check-trusted-dependencies.ts
