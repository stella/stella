name: Dependency Audit

defaults:
  run:
    shell: bash

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'push' && github.ref || format('run-{0}', github.run_id) }}
  cancel-in-progress: false

jobs:
  audit:
    name: bun audit (high/critical)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    outputs:
      advisory_failure: ${{ steps.full-audit.outputs.advisory_failure || 'false' }}
      stale_acceptance: ${{ steps.full-audit.outputs.stale_acceptance || 'false' }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # Pull requests and merge groups audit their changed resolutions in
      # ci.yml; this workflow audits the whole lockfile on main.
      - name: Setup Bun
        uses: stella/.github/actions/setup-bun-cached@2ba6dc5822df5213c500aa6edb7b6c4bdec56804
        with:
          save: ${{ github.ref == 'refs/heads/main' }}
          bun-version-file: "package.json"

      - name: Install dependencies
        timeout-minutes: 2
        # The audit reads bun.lock; its scripts import root workspace packages only.
        run: bash scripts/retry.sh bun ci --frozen-lockfile --ignore-scripts --filter stella
        env:
          NPM_TOKEN: ""

      - name: Audit full lockfile
        id: full-audit
        continue-on-error: true
        run: bun scripts/dependency-audit.ts --check

      - name: Check lockfile deduplication
        run: bun --no-env-file dedupe --check

      - name: Check trusted lifecycle dependencies
        run: bun --no-env-file scripts/check-trusted-dependencies.ts

      - name: Fail a full audit with findings
        if: steps.full-audit.outcome == 'failure'
        run: exit 1

  cargo-advisories:
    name: cargo deny advisories (desktop)
    # A newly published advisory is not caused by the change under review, so
    # merges never wait on the advisory database; main and the schedule check it.
    runs-on: macos-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install cargo-deny
        timeout-minutes: 10
        uses: ./.github/actions/cargo-deny

      # The cache keeps each fetch incremental; the newest entry is restored and
      # a fresh one saved, so the check still reads a current database.
      - name: Restore advisory database
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/advisory-dbs
            ~/.cargo/registry/index
          key: cargo-advisory-db-${{ github.run_id }}
          restore-keys: cargo-advisory-db-

      # Offline metadata needs every dependency's manifest; the crate archives
      # change only with the lockfile.
      - name: Cache dependency crates
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cargo/registry/cache
          key: cargo-desktop-crates-${{ hashFiles('apps/desktop/src-tauri/Cargo.lock') }}

      - name: Fetch dependencies and advisory database
        timeout-minutes: 10
        env:
          CARGO_NET_RETRY: "5"
        run: bash .github/actions/cargo-deny/fetch.sh apps/desktop/src-tauri/Cargo.toml db index

      - name: Save advisory database
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/advisory-dbs
            ~/.cargo/registry/index
          key: cargo-advisory-db-${{ github.run_id }}

      - name: Desktop advisories
        run: cargo deny --offline --manifest-path apps/desktop/src-tauri/Cargo.toml check --config apps/desktop/src-tauri/deny.toml --hide-inclusion-graph advisories

  remediate:
    name: Open dependency audit remediation
    needs: audit
    if: always() && (needs.audit.outputs.advisory_failure == 'true' || needs.audit.outputs.stale_acceptance == 'true')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    # Audit runs are independent, but remediation shares one branch and pull
    # request: runs queue here so each sees the previous run's pull request.
    concurrency:
      group: dependency-audit-remediation
      cancel-in-progress: false
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: stella/.github/actions/setup-bun-cached@2ba6dc5822df5213c500aa6edb7b6c4bdec56804
        with:
          bun-version-file: "package.json"
          save: ${{ github.ref == 'refs/heads/main' }}

      - name: Install dependencies
        timeout-minutes: 5
        run: bash scripts/retry.sh bun ci --ignore-scripts
        env:
          NPM_TOKEN: ""

      - name: Mint app token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ secrets.PROVENANCE_APP_ID }}
          private-key: ${{ secrets.PROVENANCE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          permission-pull-requests: write

      - name: Prepare remediation
        id: remediation
        timeout-minutes: 10
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          FIX_BRANCH: automation/dependency-audit-fix
        run: bash scripts/remediate-dependency-audit.sh

      - name: Open one remediation
        id: signed-commit
        if: steps.remediation.outputs.changed == 'true'
        uses: stella/.github/.github/actions/signed-commit@2ba6dc5822df5213c500aa6edb7b6c4bdec56804
        with:
          token: ${{ steps.app-token.outputs.token }}
          mode: refresh-pr
          branch: automation/dependency-audit-fix
          base: main
          paths: |
            bun.lock
            bunfig.toml
            scripts/dependency-audit-baseline.json
            :(glob)**/package.json
          commit-message: "chore(deps): update dependency audit state"
          pr-title: "chore(deps): update dependency audit state"
          pr-body: ${{ steps.remediation.outputs.quarantined == 'true' && steps.remediation.outputs.pr_body || 'Pins available patched releases, adds temporary release-age exclusions when a security fix is still quarantined, drafts dated acceptances for remaining upstream blockers, and removes stale acceptances.' }}

      - name: Hold quarantined remediation for publisher review
        if: steps.remediation.outputs.changed == 'true' && steps.remediation.outputs.quarantined == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          PR_NUMBER: ${{ steps.signed-commit.outputs.pull-request-number }}
        run: gh pr edit "$PR_NUMBER" --add-label hold
