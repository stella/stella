name: Typecheck Proofs

on:
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  typecheck-proofs:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        id: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false
          submodules: true

      - name: Setup Bun
        uses: stella/.github/actions/setup-bun-cached@167fb396c6c0f4e07296ad2cd72e6ef15367c776
        with:
          save: ${{ github.ref == 'refs/heads/main' }}
          bun-version-file: "package.json"

      - name: Turbo remote cache
        uses: rharkor/caching-for-turbo@2238fae6eb9a9936f92356f54cb3660200d105e7 # v2.5.1
        with:
          server-port: "0"

      - name: Install dependencies
        id: install
        run: bash scripts/retry.sh bun ci --ignore-scripts
        env:
          # .npmrc references NPM_TOKEN, but installs must not expose
          # the real npm token to dependency lifecycle scripts.
          NPM_TOKEN: ""

      - name: Typecheck parity (all checked projects)
        id: typecheck_parity
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: |
          set -o pipefail
          bun run check:typecheck-parity | tee "$RUNNER_TEMP/typecheck-parity.log"

      - name: Record typecheck parity report
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: |
          {
            cat CLOUD_REPORT.md
            printf '\n## CI parity output\n\n```text\n'
            cat "$RUNNER_TEMP/typecheck-parity.log"
            printf '\n```\n'
          } > "$RUNNER_TEMP/CLOUD_REPORT.md"

      - name: Upload typecheck parity report
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: typecheck-parity-report
          path: ${{ runner.temp }}/CLOUD_REPORT.md

      - name: Typecheck command rejects errors
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: |
          probe=packages/sha256/src/typecheck-command-probe.ts
          trap 'rm -f "$probe"' EXIT
          printf 'export const typecheckCommandProbe: number = "wrong";\n' > "$probe"
          if bun run typecheck --filter=@stll/sha256 --only --force > "$RUNNER_TEMP/typecheck-command-probe.log" 2>&1; then
            cat "$RUNNER_TEMP/typecheck-command-probe.log"
            echo "The typecheck command accepted a seeded type error."
            exit 1
          fi
          cat "$RUNNER_TEMP/typecheck-command-probe.log"
          grep -q 'typecheck-command-probe.ts' "$RUNNER_TEMP/typecheck-command-probe.log"
          grep -q '2322' "$RUNNER_TEMP/typecheck-command-probe.log"
          rm "$probe"
          bun run typecheck --filter=@stll/sha256 --only --force
