name: Nightly Full Typecheck

defaults:
  run:
    shell: bash

# Optional proofs run on demand only: pull requests, pushes and the merge queue
# run the correctness gates in ci.yml.
on:
  workflow_dispatch:
    inputs:
      fresh-web:
        description: Run only the fresh-export web proof
        type: boolean
        default: false

permissions: {}

jobs:
  full-typecheck:
    if: ${{ !inputs.fresh-web }}
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: stella/.github/actions/setup-bun-cached@a6a6cd30646c18321ef71e344bf0af6b8d3634b8
        with:
          save: ${{ github.ref == 'refs/heads/main' }}
          bun-version-file: "package.json"

      - name: Install dependencies
        timeout-minutes: 5
        run: bash scripts/retry.sh bun ci --ignore-scripts
        env:
          # .npmrc references NPM_TOKEN, but installs must not expose
          # the real npm token to dependency lifecycle scripts.
          NPM_TOKEN: ""

      - name: Full typecheck (no --affected, no turbo cache)
        # The API compiler and web contract generator each build the API graph.
        # Keep their peak memory separate, as in the full release check.
        run: bun run typecheck --concurrency=1 && bun run typecheck:repo
        env:
          TURBO_FORCE: "true"

  # A job of its own: three single-threaded project checks do not fit in the
  # full typecheck's timeout.
  cumulative-type-cost:
    if: ${{ !inputs.fresh-web }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: true

      - name: Setup Bun
        uses: stella/.github/actions/setup-bun-cached@a6a6cd30646c18321ef71e344bf0af6b8d3634b8
        with:
          save: ${{ github.ref == 'refs/heads/main' }}
          bun-version-file: "package.json"

      - name: Install dependencies
        timeout-minutes: 5
        run: bash scripts/retry.sh bun ci --ignore-scripts
        env:
          NPM_TOKEN: ""

      - name: Generate types
        # This job calls the compiler directly rather than the Turbo
        # typecheck graph, so materialize its ignored API contract first.
        run: |
          bun --filter @stll/api generate:capability-runtime
          bun run generate
          bun run typegen

      - name: Check cumulative type cost
        run: bun scripts/typecheck-baseline.ts --check

  fresh-web-sources:
    if: ${{ inputs.fresh-web }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Bun
        uses: stella/.github/actions/setup-bun-cached@a6a6cd30646c18321ef71e344bf0af6b8d3634b8
        with:
          save: ${{ github.ref == 'refs/heads/main' }}
          bun-version-file: package.json
      - name: Prove fresh web consumers and generator guards
        timeout-minutes: 40
        run: bash scripts/check-fresh-web-sources.sh
        env:
          NPM_TOKEN: ""
