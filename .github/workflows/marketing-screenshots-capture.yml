name: Capture marketing screenshots
run-name: Capture marketing screenshots ${{ inputs.request }}

defaults:
  run:
    shell: bash

# Dispatched from main's workflow definition. The selected tree is checked
# out only for capture; this job has read permission and uses anonymous pulls.
# Publication validates its artifact as data in a separate workflow.
on:
  workflow_dispatch:
    inputs:
      branch:
        description: Release branch selected for capture
        required: true
        type: string
      sha:
        description: Commit of this branch to capture
        required: true
        type: string
      request:
        description: Dispatching run that waits for this capture
        required: true
        type: string

concurrency:
  # Captures of one branch run one at a time; each is awaited by its caller.
  group: ${{ github.workflow }}-${{ inputs.branch }}
  cancel-in-progress: false

permissions: {}

jobs:
  capture:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - name: Validate the requested commit
        env:
          SHA: ${{ inputs.sha }}
        run: |
          if [[ ! "$SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Capture commit must be a full SHA"
            exit 1
          fi

      - name: Checkout the release tree
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.sha }}
          submodules: true

      - name: Capture marketing screenshots
        uses: ./.github/actions/marketing-capture
        with:
          mode: update

      - name: Upload regenerated baselines
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: marketing-screenshots
          path: apps/landing/public/media/products/*.png
          if-no-files-found: error
          retention-days: 7

      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: marketing-screenshots-diagnostics
          path: |
            /tmp/api.log
            /tmp/web.log
            apps/web/test-results/
          if-no-files-found: ignore
          retention-days: 7
