name: Capture marketing screenshots
run-name: Capture marketing screenshots ${{ inputs.sha }} ${{ inputs.request }}

defaults:
  run:
    shell: bash

# Dispatched on the captured branch's own ref, never on main: the branch's
# code runs only in that branch's Actions cache scope, so it can never write
# a cache that main reads. This job has read permission and uses anonymous
# pulls; publication validates its artifact as data in a separate workflow.
on:
  workflow_dispatch:
    inputs:
      branch:
        description: Release branch selected for capture
        required: true
        type: string
      sha:
        description: Commit of this branch to capture
        required: true
        type: string
      request:
        description: Dispatching run that waits for this capture
        required: true
        type: string

concurrency:
  # Captures of one branch run one at a time; each is awaited by its caller.
  group: ${{ github.workflow }}-${{ inputs.branch }}
  cancel-in-progress: false

permissions: {}

jobs:
  capture:
    if: inputs.branch != 'main' && github.ref == format('refs/heads/{0}', inputs.branch)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - name: Validate the requested commit
        env:
          SHA: ${{ inputs.sha }}
          RUN_SHA: ${{ github.sha }}
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          if [[ ! "$SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Capture commit must be a full SHA"
            exit 1
          fi
          # The commit must be on the dispatched branch: its tip, or an
          # ancestor of it (a publication branch carries baseline commits on
          # top of the captured main commit).
          status=$(gh api "repos/$REPOSITORY/compare/$SHA...$RUN_SHA" --jq .status)
          if [[ "$status" != identical && "$status" != ahead ]]; then
            echo "::error::Capture commit is not on the dispatched branch"
            exit 1
          fi

      - name: Checkout the release tree
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.sha }}
          submodules: true

      - name: Verify the checked-out capture commit
        env:
          SHA: ${{ inputs.sha }}
        run: |
          set -euo pipefail
          if [[ "$(git rev-parse HEAD)" != "$SHA" ]]; then
            echo "::error::Checked-out capture commit differs from the requested SHA"
            exit 1
          fi

      - name: Capture marketing screenshots
        uses: ./.github/actions/marketing-capture
        with:
          mode: update

      - name: Upload regenerated baselines
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: marketing-screenshots
          path: apps/landing/public/media/products/*.png
          if-no-files-found: error
          retention-days: 7

      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: marketing-screenshots-diagnostics
          path: |
            /tmp/api.log
            /tmp/web.log
            apps/web/test-results/
          if-no-files-found: ignore
          retention-days: 7
