name: CI Checks

on:
  pull_request:
    types:
      [
        opened,
        synchronize,
        reopened,
        ready_for_review,
        labeled,
        unlabeled,
        auto_merge_enabled,
        enqueued,
      ]
  # The merge queue builds main plus queued pull requests and merges only if this
  # workflow reports `ci-result` success on that commit, so release-boundary
  # checks must include merge_group and validate the tree that will land.
  merge_group:
    types: [checks_requested]
  workflow_call:
    inputs:
      depth:
        type: string
        default: full
      heavy_only:
        required: false
        type: boolean
        default: false
      sha:
        type: string
        default: ""
    secrets:
      DOCKERHUB_USERNAME:
        required: false
      DOCKERHUB_TOKEN:
        required: false
  workflow_dispatch:
    inputs:
      allow_full:
        description: Explicitly permit a full suite on a feature branch
        type: boolean
        default: false
      depth:
        description: >-
          Suite depth. `fast` runs the guards, lint, typecheck, unit tests
          and builds; `full` adds the heavy suites.
        type: choice
        options: [fast, full]
        default: fast

# PR runs supersede their predecessors. Manual runs supersede only older
# manual runs on the same branch; merge-group runs remain isolated. Main calls
# coalesce under a child group distinct from the caller's group.
concurrency:
  group: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && github.workflow || inputs.heavy_only == true && format('main-heavy-suites-{0}', inputs.sha) || github.workflow }}-${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && 'ci-' || '' }}${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && github.ref || github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number || github.ref) || github.event_name == 'workflow_dispatch' && format('ci-dispatch-{0}', github.ref) || format('run-{0}', github.run_id) }}
  cancel-in-progress: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/main') || (inputs.heavy_only != true && (github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch')) }}

permissions: {}

env:
  # Queue-ref cache entries cannot be reused by other refs.
  TURBO_CACHE: ${{ github.event_name == 'merge_group' && 'local:rw,remote:r' || 'local:rw,remote:rw' }}
  # Disposable non-RDS databases: online index builds in migrate must not wait
  # on EBS metrics or a wall-clock busy window.
  DB_LOAD_GATE_EBS_SIGNAL: disabled
  DB_LOAD_GATE_BUSY_WINDOWS: "[]"

jobs:
  ci-plan:
    # Decide trust before checkout, then compute every changed-file scope in
    # the same runner so downstream work starts after one scheduling wave.
    # Skip draft PRs (CI runs when marked ready for review via `reopened`).
    if: >-
      github.event_name == 'workflow_dispatch'
      || github.event.pull_request.draft != true
    runs-on: ubuntu-latest
    # Bound install attempts and planner execution below this job budget.
    timeout-minutes: 15
    permissions:
      contents: read
      # The merge-group trust check reads the queued pull request's head
      # and the pull_request runs recorded for it.
      pull-requests: read
      actions: write
    outputs:
      trusted: ${{ steps.check.outputs.trusted }}
      ci_tests_matrix: ${{ steps.api-tests.outputs.ci_tests_matrix }}
      api_test_files: ${{ steps.api-tests.outputs.api_test_files }}
      api_test_shards: ${{ steps.api-tests.outputs.api_test_shards }}
      postgres_test_selection: ${{ steps.postgres-test-plan.outputs.postgres_test_selection || '{"mode":"all"}' }}
      postgres_selection_reason: ${{ steps.postgres-test-plan.outputs.postgres_selection_reason || 'Planner unavailable; full suite retained.' }}
      # Absent repository switch is OFF; enabling it requires the service job.
      postgres_pr_required: ${{ github.event_name == 'pull_request' && vars.CI_POSTGRES_PR_SELECTION == 'on' && steps.changed-files.outputs.service_suites_pr_required == 'true' }}
      playwright_image: ${{ steps.browser-image.outputs.image }}
      # Pull requests run lightweight guards, lint and type checks.
      # Test shards retain PR coverage and follow heavy merge-queue depth.
      # Builds, images, browsers and services certify the merge group.
      run_required: ${{ steps.completed-depth.outputs.run_required }}
      completion_marker: ${{ steps.completed-depth.outputs.marker }}
      completed_run_id: ${{ steps.completed-depth.outputs.completed_run_id }}
      queue_validation: ${{ steps.completed-depth.outputs.queue_validation }}
      coverage_profile: ${{ steps.pilot.outputs.coverage_profile }}
      pilot_fast_jobs: ${{ steps.pilot-plan.outputs.fast_jobs }}
      queue_required_jobs: >-
        ${{ github.event_name == 'merge_group' && steps.depth.outputs.queue_depth == 'thin'
        && steps.completed-depth.outputs.normal_completion != 'complete'
        && steps.pilot-queue-plan.outputs.queue_jobs || '[]' }}
      suite_depth: ${{ steps.depth.outputs.suite_depth }}
      queue_depth: ${{ steps.depth.outputs.queue_depth || 'full' }}
      thin_jobs: ${{ steps.heavy-plan.outputs.thin_jobs }}
      heavy_jobs: ${{ steps.heavy-plan.outputs.heavy_jobs }}
      heavy_web_build_required: ${{ inputs.heavy_only == true && 'true' || 'false' }}
      agent_sandbox_docker_required: ${{ steps.changed-files.outputs.agent_sandbox_docker_required }}
      api_image_deps_required: ${{ steps.changed-files.outputs.api_image_deps_required }}
      docker_checks_required: ${{ steps.changed-files.outputs.docker_checks_required }}
      docker_checks_pr_required: ${{ steps.changed-files.outputs.docker_checks_pr_required }}
      # JSON matrix `include` list for api-image-smoke.
      api_image_platforms: ${{ steps.changed-files.outputs.api_image_platforms }}
      api_image_smoke_required: ${{ steps.changed-files.outputs.api_image_smoke_required }}
      collab_redis_required: ${{ steps.changed-files.outputs.collab_redis_required }}
      desktop_rust_checks_required: ${{ steps.changed-files.outputs.desktop_rust_checks_required }}
      e2e_core_required: ${{ steps.changed-files.outputs.e2e_core_required }}
      e2e_production_required: ${{ steps.changed-files.outputs.e2e_production_required }}
      e2e_landing_required: ${{ steps.changed-files.outputs.e2e_landing_required }}
      fix_tests_on_base_required: ${{ steps.changed-files.outputs.fix_tests_on_base_required }}
      landing_build_required: ${{ steps.changed-files.outputs.landing_build_required }}
      desktop_browser_required: ${{ steps.changed-files.outputs.desktop_browser_required }}
      # The job and result gate consume the same event/depth decision.
      ci_browser_required: >-
        ${{ steps.completed-depth.outputs.run_required != 'false'
        && (steps.check.outputs.trusted == 'true' || github.event_name == 'workflow_dispatch')
        && steps.changed-files.outputs.package_checks_required == 'true'
        && ((github.event_name == 'pull_request' && steps.changed-files.outputs.desktop_browser_required == 'true')
        || (github.event_name != 'pull_request' && steps.depth.outputs.queue_depth != 'thin'
        && steps.depth.outputs.suite_depth == 'full')
        || (github.event_name == 'merge_group'
        && steps.completed-depth.outputs.normal_completion != 'complete'
        && contains(fromJSON(steps.pilot-queue-plan.outputs.queue_jobs || '[]'), 'ci-browser')))
        && 'true' || 'false' }}
      legal_atlas_image_required: ${{ steps.changed-files.outputs.legal_atlas_image_required }}
      legal_atlas_image_pr_required: ${{ steps.changed-files.outputs.legal_atlas_image_pr_required }}
      dependency_malware_required: ${{ steps.changed-files.outputs.dependency_malware_required }}
      lockfile_ages_required: ${{ steps.changed-files.outputs.lockfile_ages_required }}
      marketing_screenshots_required: ${{ steps.marketing-release.outputs.required }}
      migration_rehearsal_required: ${{ steps.changed-files.outputs.migration_rehearsal_required }}
      mobile_build_required: ${{ steps.changed-files.outputs.mobile_build_required }}
      model_catalog_drift_required: ${{ steps.changed-files.outputs.model_catalog_drift_required }}
      package_checks_required: ${{ steps.changed-files.outputs.package_checks_required }}
      docs_checks_required: ${{ steps.changed-files.outputs.docs_checks_required }}
      docs_changed_files: ${{ steps.changed-files.outputs.docs_changed_files }}
      postgres_suites_required: ${{ steps.changed-files.outputs.postgres_suites_required }}
      corpus_suites_required: ${{ steps.changed-files.outputs.corpus_suites_required }}
      valkey_suites_required: ${{ steps.changed-files.outputs.valkey_suites_required }}
      collaboration_suite_required: ${{ steps.changed-files.outputs.collaboration_suite_required }}
      service_suites_pr_required: ${{ steps.changed-files.outputs.service_suites_pr_required }}
      service_suites_required: ${{ steps.changed-files.outputs.package_checks_required == 'true' || steps.changed-files.outputs.collab_redis_required == 'true' }}
      published_exports_required: ${{ steps.changed-files.outputs.published_exports_required }}
      release_typecheck_required: ${{ steps.changed-files.outputs.release_typecheck_required }}
      route_smoke_required: ${{ steps.changed-files.outputs.route_smoke_required }}
      route_tree_required: ${{ steps.changed-files.outputs.route_tree_required }}
      stack_redaction_browsers_required: ${{ steps.changed-files.outputs.stack_redaction_browsers_required }}
      web_api_types_required: ${{ steps.changed-files.outputs.web_api_types_required }}
      web_build_required: ${{ steps.changed-files.outputs.web_build_required }}
      web_image_smoke_required: ${{ steps.changed-files.outputs.web_image_smoke_required }}
      windows_scripts_required: ${{ steps.changed-files.outputs.windows_scripts_required }}
    steps:
      - name: Resolve PR coverage pilot
        id: pilot
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        env:
          CI_PR_DEPTH_PILOT: ${{ vars.CI_PR_DEPTH_PILOT }}
        with:
          retries: 0
          script: |
            core.setOutput("coverage_profile", "normal-v1");
            if (process.env.CI_PR_DEPTH_PILOT !== "on" || context.eventName !== "pull_request") return;
            // Uncertified pilot evidence keeps complete PR coverage.
            core.setOutput("coverage_profile", "normal-v1");
            if (!["opened", "synchronize"].includes(context.payload.action)) return;
            const name = "ci-pr-depth-pilot-v1";
            try {
              const { data } = await github.rest.actions.listArtifactsForRepo({
                ...context.repo, name, per_page: 100, request: { timeout: 10000 },
              });
              if (!Array.isArray(data.artifacts)) return;
              const artifact = data.artifacts.filter((item) => item?.name === name
                && item.expired === false && Date.parse(item.expires_at) > Date.now()
                && Number.isSafeInteger(item.workflow_run?.id))
                .sort((a, b) => b.id - a.id)[0];
              if (!artifact) return;
              await new Promise(resolve => setTimeout(resolve, 1100));
              const { data: run } = await github.rest.actions.getWorkflowRun({
                ...context.repo, run_id: artifact.workflow_run.id, request: { timeout: 10000 },
              });
              if (run.path !== ".github/workflows/ci-pr-pilot-metrics.yml"
                  || !["schedule", "workflow_dispatch"].includes(run.event)
                  || run.head_branch !== context.payload.repository.default_branch
                  || run.head_sha !== artifact.workflow_run.head_sha
                  || run.status !== "completed" || run.conclusion !== "success") return;
              await new Promise(resolve => setTimeout(resolve, 1100));
              const { data: zip } = await github.rest.actions.downloadArtifact({
                ...context.repo, artifact_id: artifact.id, archive_format: "zip",
                request: { timeout: 10000 },
              });
              const fs = require("node:fs");
              const path = require("node:path");
              const directory = fs.mkdtempSync(path.join(process.env.RUNNER_TEMP, "ci-pilot-"));
              let report;
              try {
                const filename = path.join(directory, "report.zip");
                fs.writeFileSync(filename, Buffer.from(zip));
                const text = require("node:child_process").execFileSync("unzip",
                  ["-p", filename, "ci-pr-pilot.json"], { maxBuffer: 65536, timeout: 5000 });
                report = JSON.parse(text.toString());
              } finally {
                fs.rmSync(directory, { recursive: true, force: true });
              }
              const start = Date.parse(report.startedAt);
              const generated = Date.parse(report.generatedAt);
              const now = Date.now();
              if (report.profile !== "pilot-v1" || report.complete !== true
                  || report.stopped !== false || !Number.isFinite(start)
                  || !Number.isFinite(generated) || start > generated || generated > now
                  || now - generated > 36 * 60 * 60 * 1000
                  || now - start >= 7 * 24 * 60 * 60 * 1000
                  || !Number.isFinite(report.baselineArmToMergeP50Minutes)
                  || report.baselineArmToMergeP50Minutes < 0
                  || (report.armToMergeP50Minutes !== null
                    && (!Number.isFinite(report.armToMergeP50Minutes)
                      || report.armToMergeP50Minutes < 0
                      || report.armToMergeP50Minutes > report.baselineArmToMergeP50Minutes + 20))) return;
              core.setOutput("coverage_profile", "pilot-fast-v1");
            } catch {
              core.info("Pilot metrics unavailable; retaining complete PR coverage.");
            }

      - name: Fetch GitHub API tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.repository }}
          ref: ${{ github.workflow_sha }}
          path: .workflow-tooling
          persist-credentials: false
          sparse-checkout: |
            scripts/gh-retry.sh
            scripts/retry.sh
          sparse-checkout-cone-mode: false

      - name: Preserve GitHub API tooling across source checkouts
        run: |
          cp "$GITHUB_WORKSPACE/.workflow-tooling/scripts/gh-retry.sh" "$RUNNER_TEMP/gh-retry.sh"
          echo "GH_RETRY_SCRIPT=$RUNNER_TEMP/gh-retry.sh" >> "$GITHUB_ENV"

      - name: Resolve suite depth
        id: depth
        env:
          MERGE_QUEUE_DEPTH: ${{ vars.MERGE_QUEUE_DEPTH }}
          DISPATCH_DEPTH: ${{ inputs.depth }}
          HEAVY_ONLY: ${{ inputs.heavy_only }}
          EVENT_NAME: ${{ github.event_name }}
          DISPATCH_REF: ${{ github.ref }}
          ALLOW_FULL: ${{ inputs.allow_full }}
        run: |
          if [[ "$EVENT_NAME" == workflow_dispatch && "$DISPATCH_DEPTH" == full && "$DISPATCH_REF" != refs/heads/main && "${ALLOW_FULL:-false}" != true ]]; then
            echo "::error::Full dispatch on a feature branch requires allow_full=true."
            exit 1
          fi
          case "${MERGE_QUEUE_DEPTH:-}" in
            ""|full|thin) ;;
            *)
              echo "::error::Unknown MERGE_QUEUE_DEPTH '$MERGE_QUEUE_DEPTH'; choose full or thin (unset means full)."
              exit 1
              ;;
          esac
          if [[ "${HEAVY_ONLY:-false}" == true ]]; then
            if [[ "$DISPATCH_DEPTH" != full ]]; then
              echo "::error::Heavy-only runs require full depth."
              exit 1
            fi
            echo "suite_depth=full" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Merge groups keep full scope planning; queue_depth controls which
          # jobs certify the tree. A pull request continues to plan fast.
          # A manual run takes its `depth` input.
          case "$EVENT_NAME" in
            merge_group)
              if [[ "${MERGE_QUEUE_DEPTH:-full}" == thin ]]; then
                echo "queue_depth=thin" >> "$GITHUB_OUTPUT"
              fi
              echo "suite_depth=full" >> "$GITHUB_OUTPUT"
              exit 0
              ;;
            workflow_dispatch)
              if [[ "$DISPATCH_DEPTH" != "fast" && "$DISPATCH_DEPTH" != "full" ]]; then
                echo "::error::Unknown suite depth '$DISPATCH_DEPTH'; choose fast or full."
                exit 1
              fi
              echo "suite_depth=$DISPATCH_DEPTH" >> "$GITHUB_OUTPUT"
              exit 0
              ;;
            pull_request)
              echo "suite_depth=fast" >> "$GITHUB_OUTPUT"
              exit 0
              ;;
            *)
              echo "::error::No suite depth for event '$EVENT_NAME'."
              exit 1
              ;;
          esac

      - name: Check completed suite depth
        id: completed-depth
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        env:
          SUITE_DEPTH: ${{ steps.depth.outputs.suite_depth }}
          COVERAGE_PROFILE: ${{ steps.pilot.outputs.coverage_profile }}
          QUEUE_DEPTH: ${{ steps.depth.outputs.queue_depth }}
        with:
          retries: 0
          script: |
            core.setOutput("run_required", "true");
            if (context.eventName === "pull_request" && context.payload.action === "enqueued") {
              core.setOutput("run_required", "false");
              core.setOutput("queue_validation", "true");
              return;
            }
            const queue = context.eventName === "merge_group" && process.env.QUEUE_DEPTH === "thin";
            if (queue) core.setOutput("normal_completion", "required");
            let pr = context.payload.pull_request;
            const depth = queue ? "fast" : process.env.SUITE_DEPTH;
            if (queue) {
              const match = /^refs\/heads\/gh-readonly-queue\/[^/]+\/pr-([0-9]+)-[a-f0-9]{40}$/.exec(context.payload.merge_group?.head_ref || "");
              if (!match || !/^[a-f0-9]{40}$/.test(context.payload.merge_group?.head_sha || "")) return;
              try {
                const { data } = await github.rest.pulls.get({
                  ...context.repo, pull_number: Number(match[1]), request: { timeout: 10000 },
                });
                if (data.number !== Number(match[1])) return;
                pr = data;
              } catch {
                core.info("Queued PR evidence unavailable; requiring deferred checks.");
                return;
              }
            }
            if ((!queue && context.eventName !== "pull_request") || !pr
                || !["fast", "full"].includes(depth)
                || typeof pr.title !== "string"
                || (pr.body != null && typeof pr.body !== "string")
                || !Array.isArray(pr.labels)
                || !Number.isSafeInteger(pr.number)
                || !Number.isSafeInteger(pr.head?.repo?.id)
                || !/^[a-f0-9]{40}$/.test(pr.head?.sha || "")
                || !/^[a-f0-9]{40}$/.test(pr.base?.sha || "")) return;
            const proof = Array.isArray(pr.labels)
              && pr.labels.some((label) => label.name === "prove-fix");
            const scope = require("node:crypto").createHash("sha256")
              .update(JSON.stringify([pr.title, pr.body || "", proof])).digest("hex");
            const profile = queue ? "normal-v1" : process.env.COVERAGE_PROFILE || "normal-v1";
            const marker = `ci-completed-v4-${profile}-${pr.number}-${pr.head.repo.id}-${pr.head.sha}-${pr.base.sha}-${depth}-${scope}`;
            if (!queue) core.setOutput("marker", marker);
            if (!queue && !["labeled", "unlabeled", "ready_for_review", "reopened", "auto_merge_enabled", "enqueued"].includes(context.payload.action)) return;
            try {
              if (queue) {
                const { data: comparison } = await github.rest.repos.compareCommits({
                  ...context.repo, base: pr.head.sha, head: context.payload.merge_group.head_sha,
                  request: { timeout: 10000 },
                });
                if (!["ahead", "identical"].includes(comparison.status)
                    || comparison.merge_base_commit?.sha !== pr.head.sha) return;
              }
              const { data } = await github.rest.actions.listArtifactsForRepo({
                ...context.repo, name: marker, per_page: 100,
                request: { timeout: 10000 },
              });
              if (!Array.isArray(data.artifacts)) return;
              const completed = data.artifacts.find((artifact) =>
                typeof artifact?.name === "string"
                && artifact.name === marker
                && artifact.expired === false
                && Date.parse(artifact.expires_at) > Date.now()
                && artifact.workflow_run?.head_sha === pr.head.sha
                && artifact.workflow_run?.head_repository_id === pr.head.repo.id
                && Number.isSafeInteger(artifact.workflow_run?.id)
                && artifact.workflow_run.id > 0
                && artifact.workflow_run.id !== context.runId);
              if (!completed) return;
              const sourceId = completed.workflow_run.id;
              const { data: sourceRun } = await github.rest.actions.getWorkflowRun({
                ...context.repo, run_id: sourceId,
                request: { timeout: 10000 },
              });
              if (sourceRun.id !== sourceId || sourceRun.head_sha !== pr.head.sha
                  || sourceRun.event !== "pull_request"
                  || sourceRun.path !== ".github/workflows/ci.yml"
                  || sourceRun.status !== "completed"
                  || sourceRun.conclusion !== "success") return;
              if (queue) {
                core.setOutput("normal_completion", "complete");
                return;
              }
              core.setOutput("completed_run_id", String(sourceId));
              core.setOutput("run_required", "false");
            } catch {
              core.info("Completed-depth evidence unavailable; running CI.");
            }

      - name: Check if PR is trusted
        id: check
        env:
          EVENT_NAME: ${{ github.event_name }}
          GH_TOKEN: ${{ github.token }}
          BASE_REPO: ${{ github.repository }}
          MERGE_GROUP_HEAD_REF: ${{ github.event.merge_group.head_ref }}
        run: |
          # A pull_request run is trusted once it starts. Same-repo
          # authors have write access to push branches, and a fork
          # run starts only when the pull request author and the
          # pushing actor each have a merged commit or pull request
          # here, or after a maintainer approves that exact push in
          # the Actions UI (repository policy: approval required for
          # first-time contributors).
          #
          # A merge group runs with the base repository's secrets. The
          # group's head ref names the queued pull request as
          # gh-readonly-queue/<base>/pr-<number>-<sha>. A same-repo pull
          # request is trusted outright. A fork pull request is trusted
          # when its head passed a pull_request run of this workflow:
          # that run cleared the fork gate above, GitHub enqueues only
          # after `ci-result` passed on the head and only for a user
          # with write access, and a later push drops the entry. So the
          # group holds exactly the code a maintainer chose to merge
          # after CI passed on it, and the enqueue is the approval to
          # run it with this repository's secrets.
          if [[ "$EVENT_NAME" != "merge_group" ]]; then
            echo "trusted=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ ! "$MERGE_GROUP_HEAD_REF" =~ /pr-([0-9]+)-[0-9a-f]+$ ]]; then
            echo "trusted=false" >> "$GITHUB_OUTPUT"
            echo "::error::Merge group head ref does not name a pull request: $MERGE_GROUP_HEAD_REF"
            exit 0
          fi
          queued_number="${BASH_REMATCH[1]}"
          read -r queued_head_repo queued_head_sha < <(
            bash "$GH_RETRY_SCRIPT" api "repos/$BASE_REPO/pulls/$queued_number" --jq '.head.repo.full_name + " " + .head.sha'
          )
          if [[ "$queued_head_repo" == "$BASE_REPO" ]]; then
            echo "trusted=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          passed_runs=$(
            bash "$GH_RETRY_SCRIPT" api "repos/$BASE_REPO/actions/workflows/ci.yml/runs?event=pull_request&status=success&head_sha=$queued_head_sha" \
              --jq '.total_count'
          )
          if [[ "${passed_runs:-0}" -gt 0 ]]; then
            echo "Fork pull request #$queued_number: head $queued_head_sha passed a pull_request run. Trusted."
            echo "trusted=true" >> "$GITHUB_OUTPUT"
          else
            echo "trusted=false" >> "$GITHUB_OUTPUT"
            echo "::error::Merge group for fork pull request #$queued_number (head $queued_head_repo@$queued_head_sha) with no successful pull_request run on that head. Let CI pass on the pull request, then enqueue it again."
          fi

      - name: Checkout
        if: >-
          steps.completed-depth.outputs.run_required != 'false'
          && (
          steps.check.outputs.trusted == 'true'
          || github.event_name == 'workflow_dispatch'
          )
        # Full history for merge-base diffs, but blobless: commits and trees
        # are enough to list changed paths, and git fetches any other blob a
        # step reads (a `git show <base>:<file>`, say) on first access. Jobs
        # that never look past HEAD keep the default shallow checkout.
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false
          ref: ${{ inputs.heavy_only == true && inputs.sha || '' }}

      - name: Resolve browser image
        id: browser-image
        if: steps.completed-depth.outputs.run_required != 'false' && (steps.check.outputs.trusted == 'true' || github.event_name == 'workflow_dispatch')
        run: echo "image=$(cat .github/actions/setup-playwright/image.txt)" >> "$GITHUB_OUTPUT"

      - name: Setup Bun for heavy job planning
        id: planner-bun
        if: steps.completed-depth.outputs.run_required != 'false' && (inputs.heavy_only == true || (github.event_name == 'merge_group' && steps.depth.outputs.queue_depth == 'thin'))
        uses: stella/.github/actions/setup-bun-cached@167fb396c6c0f4e07296ad2cd72e6ef15367c776
        with:
          save: ${{ github.ref == 'refs/heads/main' }}
          bun-version-file: "package.json"

      - name: Install heavy planner dependencies
        timeout-minutes: 3
        if: steps.completed-depth.outputs.run_required != 'false' && (inputs.heavy_only == true || (github.event_name == 'merge_group' && steps.depth.outputs.queue_depth == 'thin'))
        run: bun scripts/ci-install.ts "$RUNNER_TEMP/bun-install/scripts.log" --frozen-lockfile --ignore-scripts --filter @stll/scripts
        env:
          NPM_TOKEN: ""

      - name: Upload failed Bun install logs
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bun-install-${{ github.job }}
          path: ${{ runner.temp }}/bun-install/*.log
          retention-days: 7
          if-no-files-found: ignore

      # Read the gate from the workflow revision, even when dispatch checks an
      # older main commit that predates this planner.
      - name: Derive heavy jobs
        id: heavy-plan
        if: steps.completed-depth.outputs.run_required != 'false' && (inputs.heavy_only == true || (github.event_name == 'merge_group' && steps.depth.outputs.queue_depth == 'thin'))
        env:
          WORKFLOW_SHA: ${{ github.workflow_sha }}
        run: |
          git show "$WORKFLOW_SHA:.github/workflows/ci.yml" > "$RUNNER_TEMP/main-heavy-ci.yml"
          git show "$WORKFLOW_SHA:scripts/main-heavy-plan.ts" > packages/scripts/.main-heavy-plan.ts
          bun packages/scripts/.main-heavy-plan.ts "$RUNNER_TEMP/main-heavy-ci.yml" >> "$GITHUB_OUTPUT"

      - name: Plan release marketing screenshots
        id: marketing-release
        if: steps.completed-depth.outputs.run_required != 'false' && (steps.check.outputs.trusted == 'true' || github.event_name == 'workflow_dispatch')
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAVY_ONLY: ${{ inputs.heavy_only }}
          MERGE_GROUP_HEAD_REF: ${{ github.event.merge_group.head_ref }}
          REPOSITORY: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ "${HEAVY_ONLY:-false}" == true ]]; then
            required=false
            if ! git diff --quiet HEAD^ HEAD -- VERSION; then
              required=true
            fi
            echo "required=$required" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          required=false
          number="$PR_NUMBER"
          if [[ "$EVENT_NAME" == "merge_group" ]]; then
            if [[ ! "$MERGE_GROUP_HEAD_REF" =~ /pr-([0-9]+)-[0-9a-f]+$ ]]; then
              echo "::error::Merge group ref does not name a pull request" >&2
              exit 1
            fi
            number="${BASH_REMATCH[1]}"
          fi
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            required=true
          elif [[ -n "$number" ]]; then
            state=$(bash scripts/release-pull-requests.sh --repo "$REPOSITORY" --number "$number")
            required=$(sed -n 's/^current_is_release=//p' <<< "$state")
            if [[ "$required" != true && "$required" != false ]]; then
              echo "::error::Release classifier returned no verdict" >&2
              exit 1
            fi
          fi
          echo "required=$required" >> "$GITHUB_OUTPUT"

      - name: Setup Bun for dependency scope
        if: steps.planner-bun.outcome == 'skipped' && steps.completed-depth.outputs.run_required != 'false' && (steps.check.outputs.trusted == 'true' || github.event_name == 'workflow_dispatch')
        uses: stella/.github/actions/setup-bun-cached@167fb396c6c0f4e07296ad2cd72e6ef15367c776
        with:
          save: ${{ github.ref == 'refs/heads/main' }}
          bun-version-file: "package.json"

      - name: Check changed file scope
        if: >-
          steps.completed-depth.outputs.run_required != 'false'
          && (
          steps.check.outputs.trusted == 'true'
          || github.event_name == 'workflow_dispatch'
          )
        id: changed-files
        env:
          BASE_REF: ${{ github.base_ref || 'main' }}
          EVENT_NAME: ${{ github.event_name }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          SUITE_DEPTH: ${{ steps.depth.outputs.suite_depth }}
          HEAVY_ONLY: ${{ inputs.heavy_only }}
        run: |
          changed_files=()
          scope_unknown=false
          if [[ "$EVENT_NAME" != "workflow_dispatch" && "${HEAVY_ONLY:-false}" != true ]]; then
            base_ref="origin/$BASE_REF"
            changed_paths=$(mktemp)
            if git diff --name-only -z --no-renames "$base_ref"...HEAD > "$changed_paths"; then
              while IFS= read -r -d '' file; do
                changed_files+=("$file")
              done < "$changed_paths"
            else
              scope_unknown=true
            fi
            rm -f "$changed_paths"
          fi

          : > "$RUNNER_TEMP/api-test-changed-paths"
          if (( ${#changed_files[@]} > 0 )); then
            printf '%s\0' "${changed_files[@]}" > "$RUNNER_TEMP/api-test-changed-paths"
          fi
          echo "api_scope_unknown=$scope_unknown" >> "$GITHUB_OUTPUT"

          # An unreadable diff must widen every scope rather than skip checks.
          if [[ "$EVENT_NAME" == "workflow_dispatch" || "$scope_unknown" == "true" || "${HEAVY_ONLY:-false}" == true ]]; then
            # e2e-landing runs, and builds the landing site, at full depth only.
            landing_build_required=true
            e2e_production_required=false
            if [[ "$SUITE_DEPTH" == "full" ]]; then
              landing_build_required=false
              e2e_production_required=true
            fi
            release_typecheck_required=false
            if [[ "${HEAVY_ONLY:-false}" == true ]]; then
              # Exercise release compiler memory and timing before VERSION changes.
              if [[ "$EVENT_NAME" == schedule ]] || ! git diff --quiet HEAD^ HEAD -- VERSION; then
                release_typecheck_required=true
              fi
            fi
            route_smoke_required=false
            if [[ "$EVENT_NAME" == "pull_request" || "$EVENT_NAME" == "merge_group" || "${HEAVY_ONLY:-false}" == true ]]; then
              route_smoke_required=true
            fi
            {
              echo "route_smoke_required=$route_smoke_required"
              echo "agent_sandbox_docker_required=true"
              echo "api_image_deps_required=true"
              echo "docker_checks_required=true"
              echo "docker_checks_pr_required=true"
              echo 'api_image_platforms=[{"runner":"ubuntu-24.04-arm","platform":"linux/arm64"},{"runner":"ubuntu-latest","platform":"linux/amd64"}]'
              echo "api_image_smoke_required=true"
              echo "postgres_suites_required=true"
              echo "corpus_suites_required=true"
              echo "valkey_suites_required=true"
              echo "collaboration_suite_required=true"
              echo "service_suites_pr_required=true"
              echo "collab_redis_required=true"
              echo "desktop_rust_checks_required=true"
              echo "desktop_browser_required=true"
              echo "e2e_core_required=true"
              echo "e2e_production_required=$e2e_production_required"
              echo "e2e_landing_required=true"
              echo "fix_tests_on_base_required=false"
              echo "landing_build_required=$landing_build_required"
              echo "legal_atlas_image_required=true"
              echo "legal_atlas_image_pr_required=true"
              echo "dependency_malware_required=true"
              echo "lockfile_ages_required=false"
              echo "migration_rehearsal_required=true"
              echo "mobile_build_required=true"
              echo "model_catalog_drift_required=true"
              echo "package_checks_required=true"
              echo "docs_checks_required=false"
              echo 'docs_changed_files=[]'
              echo "published_exports_required=true"
              echo "release_typecheck_required=$release_typecheck_required"
              echo "route_tree_required=true"
              echo "stack_redaction_browsers_required=true"
              echo "web_api_types_required=true"
              echo "web_build_required=true"
              echo "web_image_smoke_required=true"
              echo "windows_scripts_required=true"
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if (( ${#changed_files[@]} == 0 )); then
            empty_api_suites=false
            if [[ "$SUITE_DEPTH" == full ]]; then
              empty_api_suites=true
            fi
            {
              echo "agent_sandbox_docker_required=false"
              echo "api_image_deps_required=false"
              echo "docker_checks_required=false"
              echo "docker_checks_pr_required=false"
              echo "api_image_platforms=[]"
              echo "api_image_smoke_required=false"
              echo "postgres_suites_required=$empty_api_suites"
              echo "corpus_suites_required=$empty_api_suites"
              echo "valkey_suites_required=$empty_api_suites"
              echo "collaboration_suite_required=false"
              echo "service_suites_pr_required=false"
              echo "collab_redis_required=false"
              echo "desktop_rust_checks_required=false"
              echo "desktop_browser_required=false"
              echo "e2e_core_required=false"
              echo "e2e_production_required=false"
              echo "e2e_landing_required=false"
              echo "fix_tests_on_base_required=false"
              echo "landing_build_required=false"
              echo "legal_atlas_image_required=false"
              echo "legal_atlas_image_pr_required=false"
              echo "dependency_malware_required=false"
              echo "lockfile_ages_required=false"
              echo "migration_rehearsal_required=false"
              echo "mobile_build_required=false"
              echo "model_catalog_drift_required=false"
              echo "package_checks_required=true"
              echo "docs_checks_required=false"
              echo 'docs_changed_files=[]'
              echo "published_exports_required=false"
              echo "release_typecheck_required=false"
              echo "route_smoke_required=false"
              echo "route_tree_required=false"
              echo "stack_redaction_browsers_required=false"
              echo "web_api_types_required=false"
              echo "web_build_required=false"
              echo "web_image_smoke_required=false"
              echo "windows_scripts_required=false"
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi

          desktop_rust_checks_required=$(bash scripts/detect-tauri-rust-changes.sh "${changed_files[@]}")
          e2e_core_required=$(bash scripts/detect-e2e-changes.sh core "${changed_files[@]}")
          e2e_landing_required=$(bash scripts/detect-e2e-changes.sh landing "${changed_files[@]}")
          # Path scopes for the build/smoke jobs, computed here so a job whose
          # scope did not change is skipped entirely instead of scheduling a
          # runner just to decide it has nothing to do.
          package_checks_required=true
          if [[ "$EVENT_NAME" == pull_request || "$EVENT_NAME" == merge_group ]]; then
            package_scope=$(bun scripts/ci-package-scope.ts --package-checks "${changed_files[@]}") || package_scope=true
            if [[ "$package_scope" == false ]]; then
              package_checks_required=false
            fi
          fi

          docs_checks_required=false
          docs_changed_files='[]'
          if [[ "$package_checks_required" == false ]]; then
            docs_changed_files=$(printf '%s\0' "${changed_files[@]}" | jq -Rsc 'split("\u0000")[:-1] | map(select(test("\\.mdx?$")))')
            if [[ "$docs_changed_files" != '[]' ]]; then
              docs_checks_required=true
            fi
          fi

          # A crashed detector cannot certify a plan. Reject its exit status
          # or malformed output before any empty scope can skip a suite.
          if ! service_suite_scopes=$(bun scripts/detect-service-suite-changes.ts --scopes "${changed_files[@]}"); then
            echo "::error::Service-suite scope detector failed."
            exit 1
          fi
          service_scope_pattern='^(true|false) (true|false) (true|false) (true|false)$'
          if [[ ! "$service_suite_scopes" =~ $service_scope_pattern ]]; then
            echo "::error::Service-suite scope detector returned invalid output."
            exit 1
          fi
          read -r postgres_suites_required corpus_suites_required valkey_suites_required collaboration_suite_required <<< "$service_suite_scopes"
          service_suites_pr_required=false
          if [[ "$postgres_suites_required" == true || "$corpus_suites_required" == true || "$valkey_suites_required" == true || "$collaboration_suite_required" == true ]]; then
            service_suites_pr_required=true
          fi
          desktop_browser_required=$(bun scripts/ci-package-scope.ts --desktop-browser "${changed_files[@]}") || desktop_browser_required=true
          if [[ "$desktop_browser_required" != false ]]; then
            desktop_browser_required=true
          fi
          if [[ "$package_checks_required" == false ]]; then
            desktop_browser_required=false
          fi
          dependency_malware_required=$(bun scripts/check-standalone-lockfiles.ts --requires-malware-scan "${changed_files[@]}")
          agent_sandbox_docker_required=false
          api_image_deps_required=false
          api_image_smoke_required=false
          collab_redis_required=false
          landing_build_required=false
          if [[ "$EVENT_NAME" == pull_request ]]; then
            landing_build_required=$(bun scripts/ci-package-scope.ts --landing-build "${changed_files[@]}") || landing_build_required=true
            if [[ "$landing_build_required" != false ]]; then
              landing_build_required=true
            fi
          fi
          legal_atlas_image_required=false
          image_inputs_changed=false
          lockfile_ages_required=false
          migration_rehearsal_required=false
          mobile_build_required=false
          model_catalog_drift_required=false
          published_exports_required=false
          release_typecheck_required=false
          route_smoke_required=false
          if [[ "$EVENT_NAME" == "pull_request" || "$EVENT_NAME" == "merge_group" ]]; then
            route_smoke_required=$(bun scripts/detect-route-smoke-changes.ts "${changed_files[@]}")
          fi
          route_tree_required=false
          stack_redaction_browsers_required=false
          web_api_types_required=false
          web_build_required=false
          web_image_smoke_required=false
          windows_scripts_required=false
          version_changed=false
          # A fix pull request that changes a test the fix-tests-on-base job
          # can run: scripts/fix-tests-on-base.ts decides the rest.
          fix_tests_on_base_required=false
          fix_title_pattern='^fix(\([^)]*\))?!?:[[:space:]]'
          if [[ "$EVENT_NAME" == "pull_request" && "$PR_TITLE" =~ $fix_title_pattern ]]; then
            for file in "${changed_files[@]}"; do
              case "$file" in
                apps/api/src/*.test.ts|apps/api/src/*.test.tsx|apps/api/evals/*.test.ts|apps/api/evals/*.test.tsx|apps/api/scripts/*.test.ts|apps/api/scripts/*.test.tsx)
                  fix_tests_on_base_required=true
                  break
                  ;;
              esac
            done
          fi
          for file in "${changed_files[@]}"; do
            if [[ "$file" == "VERSION" ]]; then
              release_typecheck_required=true
              version_changed=true
            fi
            # Build and smoke the final API image whenever something it is
            # built from changes: the sources it bundles, the dependency
            # inputs, the files the Dockerfile and the smoke read from the
            # context, and how CI and the release build it.
            case "$file" in
              VERSION|apps/api/*|apps/collab/*|apps/legal-atlas-runner/*|packages/*|patches/*|apps/*/package.json|apps/landing/public/fonts/CabinetGrotesk-Regular.otf|docker/postgres/init.sql|.gitmodules|bun.lock|bunfig.toml|package.json|.npmrc|turbo.json|scripts/smoke-api-image.sh|scripts/pull-base-images.sh|scripts/retry.sh|.dockerignore|.github/workflows/ci.yml|.github/workflows/release.yml)
                api_image_smoke_required=true
                ;;
            esac
            # The upgrade rehearsal: what a promotion of this change would run
            # against production's schema at production's row counts. A
            # release PR always rehearses; so does anything that changes what
            # the migrate entrypoint applies (the migration files, the db and
            # lib/db modules, and the script modules the online repairs
            # reuse) or how the rehearsal seeds and measures.
            case "$file" in
              VERSION|apps/api/drizzle/*|apps/api/src/db/*|apps/api/src/lib/db/*|apps/api/src/lib/decision-date-bounds-sql.ts|apps/api/src/handlers/case-law/citation-resolution.ts|apps/api/src/scripts/*|scripts/rehearse-migration-upgrade.sh|scripts/migration-rehearsal-db.ts|.github/workflows/ci.yml)
                migration_rehearsal_required=true
                ;;
            esac
            case "$file" in
              .github/workflows/agent-sandbox-canary.yml|.github/workflows/ci.yml|packages/agent-engine/*|package.json|bun.lock|scripts/pull-base-images.sh|scripts/retry.sh)
                agent_sandbox_docker_required=true
                ;;
            esac
            case "$file" in
              apps/web/src/lib/analytics/posthog.ts|apps/web/src/lib/analytics/stack-redaction.ts|apps/web/src/lib/analytics/error-diagnostics.ts|apps/web/e2e/stack-redaction/*|apps/web/e2e/playwright.stack-redaction.config.ts|apps/web/e2e/tsconfig.json|apps/web/tsconfig.json|apps/web/package.json|scripts/retry.sh|.github/actions/setup-playwright/*|bunfig.toml|package.json|bun.lock|.npmrc|.github/workflows/ci.yml)
                stack_redaction_browsers_required=true
                ;;
            esac
            case "$file" in
              apps/web/*|packages/*|patches/*|scripts/bundle-baseline.ts|scripts/bundle-baseline.json|VERSION|bun.lock|bunfig.toml|package.json|.npmrc|.github/workflows/ci.yml)
                web_build_required=true
                ;;
            esac
            # The route-tree generator reads the web package script and config
            # as well as the route sources; all must trigger its drift guard.
            case "$file" in
              apps/web/src/routes/*|apps/web/vite.config.ts|apps/web/route-tree.config.ts|apps/web/scripts/generate-route-tree.ts|apps/web/package.json|apps/web/src/routeTree.gen.ts|packages/scripts/src/prepared-generated-sources.ts|packages/scripts/src/generated-files.ts|scripts/generated-files.ts|bun.lock)
                route_tree_required=true
                ;;
            esac
            case "$file" in
              apps/mobile/*|packages/*|patches/*|bun.lock|bunfig.toml|package.json|.npmrc|.github/workflows/ci.yml)
                mobile_build_required=true
                ;;
            esac
            case "$file" in
              apps/landing/*|docs/changelog/*|VERSION|packages/*|patches/*|bun.lock|package.json|.github/workflows/ci.yml)
                if [[ "$EVENT_NAME" != pull_request ]]; then
                  landing_build_required=true
                fi
                ;;
            esac
            case "$file" in
              apps/api/*|apps/collab/*|apps/legal-atlas-runner/*|packages/*|patches/*|bun.lock|bunfig.toml|package.json|.npmrc|turbo.json|.github/workflows/ci.yml)
                api_image_deps_required=true
                ;;
            esac
            case "$file" in
              apps/collab/*|apps/api/src/handlers/folio-collab/*|apps/api/src/handlers/entities/join-folio-collab-room.ts|apps/api/src/lib/folio-collab-*|apps/api/src/lib/configured-bearer-access*|packages/api-contract/package.json|packages/api-contract/src/folio-collab*|bun.lock|.github/workflows/ci.yml)
                collab_redis_required=true
                e2e_core_required=true
                ;;
            esac
            # Pull requests build the images only when their own inputs
            # change: Dockerfiles, manifests, the runner and its packages.
            # The merge queue keeps the broad selection above.
            case "$file" in
              */Dockerfile|*.Dockerfile|*/package.json|package.json|bun.lock|bunfig.toml|.npmrc|patches/*|turbo.json|scripts/pull-base-images.sh|apps/legal-atlas-runner/*|packages/legal-atlas/*|packages/agent-engine/docker/*|.dockerignore)
                image_inputs_changed=true
                ;;
            esac
            case "$file" in
              apps/legal-atlas-runner/*|apps/api/*|packages/legal-atlas/*|packages/typescript-config/*|bun.lock|bunfig.toml|package.json|.npmrc|turbo.json|scripts/pull-base-images.sh|scripts/retry.sh|.dockerignore|.github/workflows/ci.yml)
                legal_atlas_image_required=true
                ;;
            esac
            # New pins in any tracked lockfile, root or standalone, must have
            # cleared the release-age quarantine: a frozen install never
            # checks. Also runs when the check itself changes.
            case "$file" in
              bun.lock|*/bun.lock|scripts/check-lockfile-release-ages.ts|scripts/check-lockfile-release-ages.test.ts|scripts/check-stll-quarantine-excludes.ts|scripts/bun-lock-text.ts)
                lockfile_ages_required=true
                ;;
            esac
            case "$file" in
              packages/scripts/*|scripts/ci-install*.ts|package.json|bun.lock|.github/workflows/ci.yml)
                windows_scripts_required=true
                ;;
            esac
            # The committed rate and capability snapshots are regenerated from
            # models.dev and OpenRouter. Run their network-backed byte
            # comparison only when a PR changes the catalog inputs, either
            # generator, either generated output, or this selector.
            case "$file" in
              .github/workflows/ci.yml|packages/ai-catalog/package.json|packages/ai-catalog/src/capabilities-overrides.ts|packages/ai-catalog/src/capabilities.gen.ts|packages/ai-catalog/src/document-input-overrides.ts|packages/ai-catalog/src/index.ts|packages/ai-catalog/src/model-rate-policy.ts|packages/ai-catalog/src/model-rate.ts|packages/ai-catalog/src/model-rates.gen.ts|packages/scripts/src/model-catalog-capabilities-gen.ts|packages/scripts/src/model-catalog-capabilities.ts|packages/scripts/src/model-catalog-rates-gen.ts)
                model_catalog_drift_required=true
                ;;
            esac
            # The runner-image filesystem boundary: anything that changes what
            # the image ships or how its runtime closure is staged. Workspace
            # manifests shape staging (exports maps, build scripts) and
            # vite.config.ts decides what stays external to the SSR bundle;
            # ordinary app-source changes are covered by web-build's cheaper
            # in-checkout boot smoke instead of a full image build.
            case "$file" in
              VERSION|apps/web/Dockerfile|apps/web/src/runtime.ts|apps/web/vite.config.ts|packages/start-runtime/**|packages/*/package.json|scripts/stage-web-runtime.ts|scripts/publish-manifest.ts|scripts/web-runtime-closure.ts|scripts/pull-base-images.sh|scripts/retry.sh|bun.lock|.dockerignore|.github/workflows/ci.yml)
                web_image_smoke_required=true
                ;;
            esac
            # The web API types determinism guard compiles the API and wire
            # programs; mirror the complete cached generator input contract.
            case "$file" in
              apps/api/*|apps/web/src/*|apps/web/package.json|apps/web/tsconfig*.json|packages/*|scripts/generated-files.ts|patches/*|types/*|tsconfig*.json|bun.lock|bunfig.toml|package.json|.npmrc|turbo.json|.github/workflows/ci.yml)
                web_api_types_required=true
                ;;
            esac
            # The published export map guard builds, prepares and packs
            # workspace packages with the publish scripts it imports.
            case "$file" in
              packages/*|patches/*|scripts/check-published-exports.ts|scripts/prepare-publish.ts|scripts/publish-manifest.ts|scripts/published-export-guards.ts|bun.lock|bunfig.toml|package.json|.npmrc|.github/workflows/ci.yml)
                published_exports_required=true
                ;;
            esac
          done

          # A pull request builds the API image for arm64, the production
          # architecture. Full depth and a version change build every
          # architecture release.yml publishes.
          api_image_platforms='[{"runner":"ubuntu-24.04-arm","platform":"linux/arm64"}]'
          if [[ "$SUITE_DEPTH" == "full" || "$version_changed" == "true" ]]; then
            api_image_platforms='[{"runner":"ubuntu-24.04-arm","platform":"linux/arm64"},{"runner":"ubuntu-latest","platform":"linux/amd64"}]'
          fi

          # Full depth (the merge queue, a manual full run) runs the
          # slow generated-output guards whatever the diff touched.
          if [[ "$SUITE_DEPTH" == "full" ]]; then
            published_exports_required=true
            route_tree_required=true
            web_api_types_required=true
          fi

          # e2e-landing runs the same landing build before it tests the
          # preview, so when it is planned a separate landing build only
          # repeats that work.
          if [[ "$SUITE_DEPTH" == "full" && "$e2e_landing_required" == "true" ]]; then
            landing_build_required=false
          fi

          # Production shards run at full depth for core changes, and on
          # fast PRs only when their spec/fixture/config tree changes.
          e2e_production_required=false
          if [[ "$SUITE_DEPTH" == "full" && "$e2e_core_required" == "true" ]]; then
            e2e_production_required=true
          elif [[ "$EVENT_NAME" == "pull_request" ]]; then
            e2e_production_required=$(bash scripts/detect-e2e-changes.sh pr-core "${changed_files[@]}")
          fi

          docker_checks_required=false
          if [[ "$agent_sandbox_docker_required" == "true" || "$api_image_deps_required" == "true" ]]; then
            docker_checks_required=true
          fi
          docker_checks_pr_required=false
          if [[ "$docker_checks_required" == "true" && "$image_inputs_changed" == "true" ]]; then
            docker_checks_pr_required=true
          fi
          legal_atlas_image_pr_required=false
          if [[ "$legal_atlas_image_required" == "true" && "$image_inputs_changed" == "true" ]]; then
            legal_atlas_image_pr_required=true
          fi

          # Full depth preserves the original broad folded-suite selection.
          if [[ "$SUITE_DEPTH" == full ]]; then
            postgres_suites_required=$package_checks_required
            corpus_suites_required=$package_checks_required
            valkey_suites_required=$package_checks_required
            collaboration_suite_required=$collab_redis_required
          fi

          # The production e2e shards consume web-build's artifact, so any
          # e2e-triggering change must also produce a web build.
          if [[ "$e2e_core_required" == "true" || "$route_smoke_required" == "true" ]]; then
            web_build_required=true
          fi

          printf 'Changed files:\n'
          printf ' - %s\n' "${changed_files[@]}"
          {
            echo "agent_sandbox_docker_required=$agent_sandbox_docker_required"
            echo "api_image_deps_required=$api_image_deps_required"
            echo "docker_checks_required=$docker_checks_required"
            echo "docker_checks_pr_required=$docker_checks_pr_required"
            echo "api_image_platforms=$api_image_platforms"
            echo "api_image_smoke_required=$api_image_smoke_required"
            echo "postgres_suites_required=$postgres_suites_required"
            echo "corpus_suites_required=$corpus_suites_required"
            echo "valkey_suites_required=$valkey_suites_required"
            echo "collaboration_suite_required=$collaboration_suite_required"
            echo "service_suites_pr_required=$service_suites_pr_required"
            echo "collab_redis_required=$collab_redis_required"
            echo "desktop_rust_checks_required=$desktop_rust_checks_required"
            echo "desktop_browser_required=$desktop_browser_required"
            echo "e2e_core_required=$e2e_core_required"
            echo "e2e_production_required=$e2e_production_required"
            echo "e2e_landing_required=$e2e_landing_required"
            echo "fix_tests_on_base_required=$fix_tests_on_base_required"
            echo "landing_build_required=$landing_build_required"
            echo "legal_atlas_image_required=$legal_atlas_image_required"
            echo "legal_atlas_image_pr_required=$legal_atlas_image_pr_required"
            echo "dependency_malware_required=$dependency_malware_required"
            echo "lockfile_ages_required=$lockfile_ages_required"
            echo "migration_rehearsal_required=$migration_rehearsal_required"
            echo "mobile_build_required=$mobile_build_required"
            echo "model_catalog_drift_required=$model_catalog_drift_required"
            echo "package_checks_required=$package_checks_required"
            echo "docs_checks_required=$docs_checks_required"
            echo "docs_changed_files=$docs_changed_files"
            echo "published_exports_required=$published_exports_required"
            echo "release_typecheck_required=$release_typecheck_required"
            echo "route_smoke_required=$route_smoke_required"
            echo "route_tree_required=$route_tree_required"
            echo "stack_redaction_browsers_required=$stack_redaction_browsers_required"
            echo "web_api_types_required=$web_api_types_required"
            echo "web_build_required=$web_build_required"
            echo "web_image_smoke_required=$web_image_smoke_required"
            echo "windows_scripts_required=$windows_scripts_required"
          } >> "$GITHUB_OUTPUT"

          if [[ "$package_checks_required" != "true" ]]; then
            echo "::notice::Only documentation or provenance changed; skipping package CI checks."
          fi

      - name: Install API test planner dependencies
        id: api-test-deps
        # Both planners retain full coverage when installation is unavailable.
        continue-on-error: true
        if: >-
          steps.completed-depth.outputs.run_required != 'false'
          && (
          steps.check.outputs.trusted == 'true'
          && (github.event_name == 'pull_request' || github.event_name == 'merge_group')
          && steps.changed-files.outputs.package_checks_required == 'true'
          && steps.changed-files.outputs.api_scope_unknown != 'true'
          )
        run: bash scripts/retry.sh timeout --kill-after=10s 120s bun ci --ignore-scripts
        env:
          NPM_TOKEN: ""

      - name: Select affected API test files
        id: api-test-selection
        if: steps.completed-depth.outputs.run_required != 'false' && github.event_name == 'pull_request' && steps.api-test-deps.outcome == 'success'
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref || 'main' }}
          API_SCOPE_UNKNOWN: ${{ steps.changed-files.outputs.api_scope_unknown }}
        run: |
          if ! timeout --kill-after=10s 120s bun scripts/ci-api-test-plan.ts; then
            echo 'ci_tests_matrix={"shard":["api-1","api-2","api-3","api-4","rest-web"]}' >> "$GITHUB_OUTPUT"
            echo 'api_test_shards=4' >> "$GITHUB_OUTPUT"
            echo 'api_test_files=' >> "$GITHUB_OUTPUT"
          fi

      - name: Select affected Postgres test files
        id: postgres-test-plan
        if: >-
          steps.completed-depth.outputs.run_required != 'false'
          && steps.api-test-deps.outcome == 'success'
          && (github.event_name == 'merge_group' || github.event_name == 'pull_request')
        env:
          EVENT_NAME: ${{ github.event_name }}
          API_SCOPE_UNKNOWN: ${{ steps.changed-files.outputs.api_scope_unknown }}
        run: |
          # The graph reads ignored runtime aggregates even after --ignore-scripts.
          if ! (
            timeout --kill-after=10s 120s bun --cwd=packages/cli run codegen:runtime &&
            timeout --kill-after=10s 120s bun --cwd=apps/api run generate:capability-runtime &&
            timeout --kill-after=10s 120s bun scripts/ci-postgres-test-plan.ts
          ); then
            echo 'postgres_test_selection={"mode":"all"}' >> "$GITHUB_OUTPUT"
            echo 'postgres_selection_reason=Runtime generation or selection unavailable; full suite retained.' >> "$GITHUB_OUTPUT"
          fi

      - name: Summarize Postgres test selection
        if: steps.completed-depth.outputs.run_required != 'false' && (steps.check.outputs.trusted == 'true' || github.event_name == 'workflow_dispatch')
        env:
          SELECTION: ${{ steps.postgres-test-plan.outputs.postgres_test_selection || '{"mode":"all"}' }}
          REASON: ${{ steps.postgres-test-plan.outputs.postgres_selection_reason || 'Planner unavailable; full suite retained.' }}
        run: |
          {
            printf '### Postgres test selection\n\n'
            printf '%s\n\n' "$REASON"
            jq -r 'if .mode == "selected" then .files[] | "- " + tojson elif .mode == "all" then "full" else .mode end' <<< "$SELECTION"
          } >> "$GITHUB_STEP_SUMMARY"
          printf 'Postgres selection: %s\nReason: %s\n' "$SELECTION" "$REASON"

      - name: Derive deferred queue checks
        id: pilot-queue-plan
        if: steps.completed-depth.outputs.run_required != 'false' && github.event_name == 'merge_group' && steps.depth.outputs.queue_depth == 'thin'
        run: bun scripts/ci-pr-pilot-plan.ts .github/workflows/ci.yml queue >> "$GITHUB_OUTPUT"

      - name: Derive pilot fast prerequisites
        id: pilot-plan
        if: steps.completed-depth.outputs.run_required != 'false' && steps.pilot.outputs.coverage_profile == 'pilot-fast-v1'
        run: bun scripts/ci-pr-pilot-plan.ts .github/workflows/ci.yml >> "$GITHUB_OUTPUT"

      - name: Plan API test files and shards
        if: steps.completed-depth.outputs.run_required != 'false' && (steps.check.outputs.trusted == 'true' || github.event_name == 'workflow_dispatch')
        id: api-tests
        env:
          EVENT_NAME: ${{ github.event_name }}
          API_SCOPE_UNKNOWN: ${{ steps.changed-files.outputs.api_scope_unknown }}
          PACKAGE_CHECKS_REQUIRED: ${{ steps.changed-files.outputs.package_checks_required }}
          SELECTED_MATRIX: ${{ steps.api-test-selection.outputs.ci_tests_matrix }}
          SELECTED_FILES: ${{ steps.api-test-selection.outputs.api_test_files }}
          SELECTED_SHARDS: ${{ steps.api-test-selection.outputs.api_test_shards }}
        run: |
          if [[ -n "$SELECTED_MATRIX" && -n "$SELECTED_SHARDS" ]]; then
            echo "ci_tests_matrix=$SELECTED_MATRIX" >> "$GITHUB_OUTPUT"
            echo "api_test_shards=$SELECTED_SHARDS" >> "$GITHUB_OUTPUT"
            {
              echo 'api_test_files<<API_TEST_FILES_END'
              printf '%s\n' "$SELECTED_FILES"
              echo 'API_TEST_FILES_END'
            } >> "$GITHUB_OUTPUT"
          elif [[ "$EVENT_NAME" == pull_request && "$PACKAGE_CHECKS_REQUIRED" != true && "$API_SCOPE_UNKNOWN" != true ]]; then
            echo 'ci_tests_matrix={"shard":["rest-web"]}' >> "$GITHUB_OUTPUT"
            echo 'api_test_shards=0' >> "$GITHUB_OUTPUT"
            echo 'api_test_files=' >> "$GITHUB_OUTPUT"
          else
            echo 'ci_tests_matrix={"shard":["api-1","api-2","api-3","api-4","rest-web"]}' >> "$GITHUB_OUTPUT"
            echo 'api_test_shards=4' >> "$GITHUB_OUTPUT"
            echo 'api_test_files=' >> "$GITHUB_OUTPUT"
          fi

      - name: Cancel failed merge-group run
        if: failure() && github.event_name == 'merge_group'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          retries: 0
          script: |
            let diagnostic;
            let evidenceTimer;
            try {
              const jobs = await Promise.race([
                github.paginate(
                  "GET /repos/{owner}/{repo}/actions/runs/{run_id}/attempts/{attempt_number}/jobs",
                  {
                    ...context.repo,
                    run_id: context.runId,
                    attempt_number: Number(process.env.GITHUB_RUN_ATTEMPT),
                    per_page: 100,
                    request: { timeout: 10000 },
                  },
                ),
                new Promise((_, reject) => {
                  evidenceTimer = setTimeout(() => reject(new Error("Failed-step lookup timed out")), 10000);
                }),
              ]);
              const failures = jobs.flatMap((job) => (job.steps || [])
                .filter((step) => step.conclusion === "failure")
                .map((step) => `${job.name} / ${step.number}: ${step.name} (${job.html_url})`));
              diagnostic = `${context.job}: cancelling failed merge group; failed steps: ${failures.length ? failures.join("; ") : "not yet available from the jobs API"}`;
            } catch {
              diagnostic = `${context.job}: cancelling failed merge group; failed-step lookup unavailable`;
            } finally {
              clearTimeout(evidenceTimer);
            }
            core.error(diagnostic);
            try {
              core.summary.addRaw(`${diagnostic}\n`);
              await core.summary.write();
            } catch {
              core.error(`${context.job}: cancellation step summary could not be written`);
            }
            await github.rest.actions.cancelWorkflowRun({
              ...context.repo,
              run_id: context.runId,
            });

  # The agent sandbox must be exercised before the standalone protected
  # canary can exist on the default branch. This job is safe for draft PRs: it
  # receives no secrets and runs on an ephemeral
  # hosted runner. Same-repository branches run immediately; forks wait for
  # the repository's Actions approval gate.
  docker-checks:
    name: Sandbox Docker and image dependency checks
    needs: ci-plan
    if: >-
      needs.ci-plan.outputs.run_required != 'false'
      && (
      github.event_name != 'pull_request' && (
      needs.ci-plan.outputs.queue_depth != 'thin'
      && ((needs.ci-plan.outputs.trusted == 'true'
       || github.event_name == 'workflow_dispatch')
      && needs.ci-plan.outputs.docker_checks_required == 'true'
      && (needs.ci-plan.outputs.suite_depth == 'full'
          || (needs.ci-plan.outputs.suite_depth == 'fast'
              && needs.ci-plan.outputs.docker_checks_pr_required == 'true'))
      )
      )
      )
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    permissions:
      contents: read
      actions: write
    env:
      AGENT_ENGINE_DOCKER_IMAGE: stella/agent-sandbox:ci
      AGENT_ENGINE_DOCKER_NETWORK: stella-agent-ci-${{ github.run_id }}-${{ github.run_attempt }}
      AGENT_ENGINE_DOCKER_CANARY_URL: http://stella-agent-network-canary:8787/health
      NETWORK_CANARY_CONTAINER: stella-agent-network-canary-${{ github.run_id }}-${{ github.run_attempt }}
    outputs:
      agent-sandbox-docker: ${{ steps.install.outcome == 'success' && steps.protocol.outcome == 'success' && steps.pull.outcome == 'success' && steps.image.outcome == 'success' && steps.network.outcome == 'success' && steps.canary.outcome == 'success' && steps.isolation.outcome == 'success' && steps.assert-cleanup.outcome == 'success' && steps.cleanup.outcome == 'success' && 'success' || 'failure' }}
      api-image-deps: ${{ steps.api-deps.outcome }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.heavy_only == true && inputs.sha || '' }}

      - name: Setup Bun
        uses: stella/.github/actions/setup-bun-cached@167fb396c6c0f4e07296ad2cd72e6ef15367c776
        with:
          save: ${{ github.ref == 'refs/heads/main' }}
          bun-version-file: "package.json"

      - name: Install dependencies
        id: install
        if: needs.ci-plan.outputs.agent_sandbox_docker_required == 'true'
        run: bash scripts/retry.sh bun ci --ignore-scripts
        env:
          NPM_TOKEN: ""

      - name: Run protocol and malformed-stream tests
        if: needs.ci-plan.outputs.agent_sandbox_docker_required == 'true'
        id: protocol
        run: bun --filter @stll/agent-engine test

      # Pull helpers follow the workflow revision; Dockerfiles follow the tested source.
      - name: Checkout workflow tooling
        if: needs.ci-plan.outputs.agent_sandbox_docker_required == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          path: .workflow-tooling
          persist-credentials: false
          sparse-checkout: |
            scripts/pull-base-images.sh
            scripts/retry.sh
          sparse-checkout-cone-mode: false

      - name: Pull sandbox base images
        if: needs.ci-plan.outputs.agent_sandbox_docker_required == 'true'
        id: pull
        run: |
          bash .workflow-tooling/scripts/pull-base-images.sh packages/agent-engine/docker/sandbox.Dockerfile
          rm -rf .workflow-tooling

      - name: Build pinned sandbox image
        if: needs.ci-plan.outputs.agent_sandbox_docker_required == 'true'
        id: image
        run: >-
          docker build
          --file packages/agent-engine/docker/sandbox.Dockerfile
          --tag "$AGENT_ENGINE_DOCKER_IMAGE"
          packages/agent-engine/docker

      - name: Create internal sandbox network
        if: needs.ci-plan.outputs.agent_sandbox_docker_required == 'true'
        id: network
        run: docker network create --internal "$AGENT_ENGINE_DOCKER_NETWORK"

      - name: Start the only reachable network canary
        if: needs.ci-plan.outputs.agent_sandbox_docker_required == 'true'
        id: canary
        run: |
          bun build packages/agent-engine/scripts/mcp-canary-server.ts \
            --target=node \
            --outfile="$RUNNER_TEMP/mcp-canary-server.mjs"
          docker run --detach \
            --name "$NETWORK_CANARY_CONTAINER" \
            --network "$AGENT_ENGINE_DOCKER_NETWORK" \
            --network-alias stella-agent-network-canary \
            --read-only \
            --cap-drop=ALL \
            --security-opt=no-new-privileges \
            --tmpfs /state:rw,noexec,nosuid,size=1m,mode=1777 \
            --volume "$RUNNER_TEMP/mcp-canary-server.mjs:/workspace/mcp-canary-server.mjs:ro" \
            "$AGENT_ENGINE_DOCKER_IMAGE" \
            node /workspace/mcp-canary-server.mjs
          for _ in {1..40}; do
            if docker exec "$NETWORK_CANARY_CONTAINER" node -e \
              'fetch("http://127.0.0.1:8787/health", { signal: AbortSignal.timeout(1000) }).then(async (response) => process.exit(response.ok && await response.text() === "sandbox-network-canary" ? 0 : 1), () => process.exit(1))'; then
              exit 0
            fi
            sleep 0.1
          done
          docker logs "$NETWORK_CANARY_CONTAINER"
          exit 1

      - name: Exercise Docker provider isolation and cleanup
        if: needs.ci-plan.outputs.agent_sandbox_docker_required == 'true'
        id: isolation
        env:
          AGENT_ENGINE_DOCKER_TEST: "1"
        run: bun test packages/agent-engine/src/bun-docker/provider.integration.test.ts

      - name: Assert provider left no sandbox containers
        if: needs.ci-plan.outputs.agent_sandbox_docker_required == 'true'
        id: assert-cleanup
        run: |
          mapfile -t container_ids < <(
            docker ps --all --no-trunc --quiet --filter "ancestor=$AGENT_ENGINE_DOCKER_IMAGE"
          )
          if [[ "${#container_ids[@]}" -ne 1 || "${container_ids[0]}" != "$(docker inspect --format '{{.Id}}' "$NETWORK_CANARY_CONTAINER")" ]]; then
            echo "::error title=Sandbox cleanup failed::Unexpected sandbox image container survived the integration suite."
            docker ps --all --filter "ancestor=$AGENT_ENGINE_DOCKER_IMAGE"
            exit 1
          fi

      - name: Cleanup Docker resources
        id: cleanup
        if: always() && needs.ci-plan.outputs.agent_sandbox_docker_required == 'true'
        run: |
          docker ps --all --quiet --filter "ancestor=$AGENT_ENGINE_DOCKER_IMAGE" | xargs --no-run-if-empty docker rm --force
          docker network rm "$AGENT_ENGINE_DOCKER_NETWORK" 2>/dev/null || true

      - name: Check image dependency trees and production runner
        id: api-deps
        timeout-minutes: 10
        if: ${{ !cancelled() && needs.ci-plan.outputs.api_image_deps_required == 'true' }}
        env:
          NPM_TOKEN: ""
        run: |
          set -euo pipefail
          echo "::group::Install turbo"
          (
            bun scripts/ci-install.ts "$RUNNER_TEMP/bun-install/turbo.log" -g "turbo@$(bun -p 'require("./package.json").devDependencies.turbo')"
          )
          echo ::endgroup::
          echo "::group::Prepare Docker install inputs"
          (
            set -euo pipefail
            rm -rf install-json
            mkdir -p install-json
            cp bun.lock package.json install-json/
            for input in bunfig.toml .npmrc patches; do
              [ ! -e "$input" ] || cp -a "$input" install-json/
            done
            find apps packages -mindepth 2 -maxdepth 2 -name package.json \
              -not -path '*/node_modules/*' \
              -exec cp --parents -t install-json/ {} +
          )
          echo ::endgroup::
          echo "::group::Install API image deps with frozen root lockfile"
          (
            set -euo pipefail
            rm -rf api-install
            cp -a install-json api-install
            cd api-install
            bun ../scripts/ci-install.ts "$RUNNER_TEMP/bun-install/api-image.log" --filter @stll/api --filter @stll/collab --filter @stll/legal-atlas-runner --frozen-lockfile --ignore-scripts
          )
          echo ::endgroup::
          echo "::group::Prod-deps legal atlas runner smoke"
          (
            set -euo pipefail
            rm -rf out-runner
            turbo prune @stll/legal-atlas-runner --docker --out-dir out-runner
            rm -rf runner-install
            cp -a install-json runner-install
            cd runner-install
            bun ../scripts/ci-install.ts "$RUNNER_TEMP/bun-install/legal-atlas.log" --filter @stll/legal-atlas-runner --production --frozen-lockfile --ignore-scripts
            cp -a ../out-runner/full/. .
            bun --filter @stll/legal-atlas-runner build
            bun apps/legal-atlas-runner/dist/index.js smoke
            set +e
            out=$(DATABASE_URL=postgres://smoke:smoke@localhost:5432/smoke \
                  S3_ENDPOINT=http://localhost \
                  S3_BUCKET=smoke \
                  S3_REGION=eu-central-1 \
                  bun apps/legal-atlas-runner/dist/index.js run case-law-ingest __smoke__ 2>&1)
            status=$?
            set -e
            echo "$out"
            if ! echo "$out" | grep -q 'Unknown adapter: __smoke__'; then
              echo "ERROR: legal-atlas runner smoke failed under --production (exit=$status)" >&2
              exit 1
            fi
          )
          echo ::endgroup::

      - name: Upload failed Bun install logs
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bun-install-${{ github.job }}
          path: ${{ runner.temp }}/bun-install/*.log
          retention-days: 7
          if-no-files-found: ignore

      - name: Cancel failed merge-group run
        if: failure() && github.event_name == 'merge_group'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          retries: 0
          script: |
            let diagnostic;
            let evidenceTimer;
            try {
              const jobs = await Promise.race([
                github.paginate(
                  "GET /repos/{owner}/{repo}/actions/runs/{run_id}/attempts/{attempt_number}/jobs",
                  {
                    ...context.repo,
                    run_id: context.runId,
                    attempt_number: Number(process.env.GITHUB_RUN_ATTEMPT),
                    per_page: 100,
                    request: { timeout: 10000 },
                  },
                ),
                new Promise((_, reject) => {
                  evidenceTimer = setTimeout(() => reject(new Error("Failed-step lookup timed out")), 10000);
                }),
              ]);
              const failures = jobs.flatMap((job) => (job.steps || [])
                .filter((step) => step.conclusion === "failure")
                .map((step) => `${job.name} / ${step.number}: ${step.name} (${job.html_url})`));
              diagnostic = `${context.job}: cancelling failed merge group; failed steps: ${failures.length ? failures.join("; ") : "not yet available from the jobs API"}`;
            } catch {
              diagnostic = `${context.job}: cancelling failed merge group; failed-step lookup unavailable`;
            } finally {
              clearTimeout(evidenceTimer);
            }
            core.error(diagnostic);
            try {
              core.summary.addRaw(`${diagnostic}\n`);
              await core.summary.write();
            } catch {
              core.error(`${context.job}: cancellation step summary could not be written`);
            }
            await github.rest.actions.cancelWorkflowRun({
              ...context.repo,
              run_id: context.runId,
            });

  # Parser versions must advance whenever an adapter's parser inputs change.
  # This guard reads Git history and needs no dependency installation.
  parser-version-guard:
    needs: ci-plan
    if: >-
      (needs.ci-plan.outputs.coverage_profile != 'pilot-fast-v1' || contains(fromJSON(needs.ci-plan.outputs.pilot_fast_jobs || '[]'), 'parser-version-guard')) && (
      needs.ci-plan.outputs.run_required != 'false'
      && (
      inputs.heavy_only != true
      && (
      needs.ci-plan.outputs.trusted == 'true'
      || github.event_name == 'workflow_dispatch'
      )
      )
      && needs.ci-plan.outputs.package_checks_required == 'true'
      )
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false

      - name: Setup Bun
        uses: stella/.github/actions/setup-bun-cached@167fb396c6c0f4e07296ad2cd72e6ef15367c776
        with:
          save: ${{ github.ref == 'refs/heads/main' }}
          bun-version-file: package.json

      - name: Check parser version guard
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || '' }}
          HEAD_SHA: ${{ github.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha || '' }}
        run: |
          bun test scripts/check-parser-versions.test.ts
          bun scripts/check-parser-versions.ts

      - name: Cancel failed merge-group run
        if: failure() && github.event_name == 'merge_group'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          retries: 0
          script: |
            let diagnostic;
            let evidenceTimer;
            try {
              const jobs = await Promise.race([
                github.paginate(
                  "GET /repos/{owner}/{repo}/actions/runs/{run_id}/attempts/{attempt_number}/jobs",
                  {
                    ...context.repo,
                    run_id: context.runId,
                    attempt_number: Number(process.env.GITHUB_RUN_ATTEMPT),
                    per_page: 100,
                    request: { timeout: 10000 },
                  },
                ),
                new Promise((_, reject) => {
