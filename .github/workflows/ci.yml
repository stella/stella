  # The browser-backed suites. They share one Playwright install, so they stay
  # in a single job rather than one per suite.
  ci-browser:
    needs: ci-plan
    if: >-
      (needs.ci-plan.outputs.coverage_profile != 'pilot-fast-v1' || contains(fromJSON(needs.ci-plan.outputs.pilot_fast_jobs || '[]'), 'ci-browser'))
      && needs.ci-plan.outputs.ci_browser_required == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        suite: ${{ github.event_name == 'pull_request' && fromJSON('["desktop"]') || fromJSON('["desktop","ui"]') }}
    container:
      image: ${{ needs.ci-plan.outputs.playwright_image }}
      options: --init --ipc=host
    defaults:
      run:
        shell: bash
    permissions:
      contents: read
      actions: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false
          ref: ${{ inputs.heavy_only == true && inputs.sha || '' }}
          submodules: true

      - name: Check desktop browser test scope
        id: desktop-browser-tests
        env:
          REQUIRED: ${{ needs.ci-plan.outputs.desktop_browser_required }}
        run: echo "required=$REQUIRED" >> "$GITHUB_OUTPUT"

      - name: Check UI browser test scope
        if: github.event_name != 'pull_request' && needs.ci-plan.outputs.package_checks_required == 'true'
        id: ui-browser-tests
        env:
          BASE_REF: ${{ github.base_ref || 'main' }}
          EVENT_NAME: ${{ github.event_name }}
          HEAVY_ONLY: ${{ inputs.heavy_only }}
        run: |
          if [[ "$EVENT_NAME" == "workflow_dispatch" || "${HEAVY_ONLY:-false}" == true ]] || ! git diff --quiet "origin/$BASE_REF"...HEAD -- \
            .github/actions/setup-playwright \
            .github/workflows/ci.yml \
            apps/desktop \
            apps/web/e2e/playwright.ui-playground.config.ts \
            apps/web/e2e/ui-playground \
            apps/web/package.json \
            apps/web/public/prepaint-init.js \
            apps/web/src/app-providers.tsx \
            apps/web/src/components/inspector \
            apps/web/src/components/legal-reader \
            apps/web/src/components/theme-provider.tsx \
            apps/web/src/features/case-law \
            apps/web/src/fonts.css \
            apps/web/src/i18n \
            apps/web/src/routes/__root.tsx \
            apps/web/src/routes/dev.tsx \
            apps/web/src/routes/dev \
            apps/web/src/styles/app.css \
            apps/web/vite.config.ts \
            bun.lock \
            package.json \
            packages/locales \
            packages/ui; then
            echo "required=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "required=false" >> "$GITHUB_OUTPUT"

      - name: Check extension browser test scope
        if: github.event_name != 'pull_request' && needs.ci-plan.outputs.package_checks_required == 'true'
        id: extension-browser-tests
        env:
          BASE_REF: ${{ github.base_ref || 'main' }}
          EVENT_NAME: ${{ github.event_name }}
          HEAVY_ONLY: ${{ inputs.heavy_only }}
        # The extension's Playwright specs load the built extension into a
        # persistent Chromium; they run only when the extension, its protocol
        # contract, or the browser runtime changed.
        run: |
          if [[ "$EVENT_NAME" == "workflow_dispatch" || "${HEAVY_ONLY:-false}" == true ]] || ! git diff --quiet "origin/$BASE_REF"...HEAD -- \
            .github/actions/setup-playwright \
            .github/workflows/ci.yml \
            apps/extension \
            packages/api-contract/src/browser-control.ts \
            bun.lock \
            package.json; then
            echo "required=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "required=false" >> "$GITHUB_OUTPUT"

      - name: Setup Bun
        if: steps.desktop-browser-tests.outputs.required == 'true' || steps.ui-browser-tests.outputs.required == 'true' || steps.extension-browser-tests.outputs.required == 'true'
        env:
          NPM_TOKEN: ""
        # The Playwright image has npm but no unzip. Install Bun's native
        # package without lifecycle scripts or another apt dependency.
        run: |
          version=$(node -p 'require("./package.json").packageManager.split("@")[1]')
          bootstrap="$RUNNER_TEMP/bun-bootstrap"
          bin="$HOME/.bun/bin"
          npm install --prefix "$bootstrap" --ignore-scripts --no-audit --no-fund --no-save "@oven/bun-linux-x64@$version"
          mkdir -p "$bin"
          ln -s "$bootstrap/node_modules/@oven/bun-linux-x64/bin/bun" "$bin/bun"
          ln -s "$bin/bun" "$bin/bunx"
          echo "$bin" >> "$GITHUB_PATH"
          "$bin/bun" --version

      # setup-bun reuses the matching ~/.bun/bin/bun above, avoiding unzip.
      - name: Restore Bun install cache
        if: steps.desktop-browser-tests.outputs.required == 'true' || steps.ui-browser-tests.outputs.required == 'true' || steps.extension-browser-tests.outputs.required == 'true'
        uses: stella/.github/actions/setup-bun-cached@167fb396c6c0f4e07296ad2cd72e6ef15367c776
        with:
          bun-version-file: package.json
          save: ${{ github.ref == 'refs/heads/main' }}

      - name: Turbo remote cache
        if: steps.desktop-browser-tests.outputs.required == 'true' || steps.ui-browser-tests.outputs.required == 'true' || steps.extension-browser-tests.outputs.required == 'true'
        uses: rharkor/caching-for-turbo@2238fae6eb9a9936f92356f54cb3660200d105e7 # v2.5.1
        with:
          server-port: "0"

      - name: Install dependencies
        if: steps.desktop-browser-tests.outputs.required == 'true' || steps.ui-browser-tests.outputs.required == 'true' || steps.extension-browser-tests.outputs.required == 'true'
        run: bash scripts/retry.sh bun ci --ignore-scripts
        env:
          # .npmrc references NPM_TOKEN, but PR installs must not expose
          # the real npm token to dependency lifecycle scripts.
          NPM_TOKEN: ""

      - name: Prepare environment
        if: steps.desktop-browser-tests.outputs.required == 'true' || steps.ui-browser-tests.outputs.required == 'true' || steps.extension-browser-tests.outputs.required == 'true'
        # `cp`, not `mv`: renaming the tracked .env.example would dirty the
        # working tree in apps/api and apps/web. .env is gitignored.
        run: |
          cd ./apps/api
          cp .env.example .env
          cd ../web
          cp .env.example .env

      - name: Install UI browser test runtime
        if: steps.desktop-browser-tests.outputs.required == 'true' || steps.ui-browser-tests.outputs.required == 'true' || steps.extension-browser-tests.outputs.required == 'true'
        uses: ./.github/actions/setup-playwright
        with:
          # The pinned image includes both desktop engines and screenshot fonts.
          # Verify launches without downloading browsers or invoking apt.
          browsers: chromium webkit
          dependency-mode: preinstalled

      - name: Test UI browser interactions
        if: matrix.suite == 'ui' && steps.ui-browser-tests.outputs.required == 'true'
        env:
          PLAYWRIGHT_JSON_OUTPUT_FILE: ${{ github.workspace }}/.cache/playwright-timings/test-ui-browser-interactions.json
        run: bun --filter @stll/ui test:browser

      - name: Test desktop browser interactions
        if: matrix.suite == 'desktop' && steps.desktop-browser-tests.outputs.required == 'true'
        env:
          PLAYWRIGHT_JSON_OUTPUT_FILE: ${{ github.workspace }}/.cache/playwright-timings/test-desktop-browser-interactions.json
        run: |
          cd apps/desktop
          bun run test:browser

      - name: Upload desktop browser failures
        if: matrix.suite == 'desktop' && failure() && steps.desktop-browser-tests.outputs.required == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: desktop-browser-failures
          path: apps/desktop/test-results/
          retention-days: 7
          if-no-files-found: ignore

      - name: Test UI playground visuals
        if: matrix.suite == 'ui' && steps.ui-browser-tests.outputs.required == 'true'
        env:
          PLAYWRIGHT_JSON_OUTPUT_FILE: ${{ github.workspace }}/.cache/playwright-timings/test-ui-playground-visuals.json
        run: bun --filter @stll/web test:e2e:ui-playground

      - name: Test extension browser boundary
        if: matrix.suite == 'ui' && steps.extension-browser-tests.outputs.required == 'true'
        env:
          PLAYWRIGHT_JSON_OUTPUT_FILE: ${{ github.workspace }}/.cache/playwright-timings/test-extension-browser-boundary.json
        run: bun --filter @stll/extension test:e2e

      - name: Upload browser test timings
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ci-browser-timings-${{ matrix.suite }}
          path: .cache/playwright-timings/*.json
          retention-days: 7
          if-no-files-found: ignore

      - name: Cancel failed merge-group run
        if: failure() && github.event_name == 'merge_group'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          retries: 0
          script: |
            let diagnostic;
            let evidenceTimer;
            try {
              const jobs = await Promise.race([
                github.paginate(
                  "GET /repos/{owner}/{repo}/actions/runs/{run_id}/attempts/{attempt_number}/jobs",
                  {
                    ...context.repo,
                    run_id: context.runId,
                    attempt_number: Number(process.env.GITHUB_RUN_ATTEMPT),
                    per_page: 100,
                    request: { timeout: 10000 },
                  },
                ),
                new Promise((_, reject) => {
                  evidenceTimer = setTimeout(() => reject(new Error("Failed-step lookup timed out")), 10000);
                }),
              ]);
              const failures = jobs.flatMap((job) => (job.steps || [])
                .filter((step) => step.conclusion === "failure")
                .map((step) => `${job.name} / ${step.number}: ${step.name} (${job.html_url})`));
              diagnostic = `${context.job}: cancelling failed merge group; failed steps: ${failures.length ? failures.join("; ") : "not yet available from the jobs API"}`;
            } catch {
              diagnostic = `${context.job}: cancelling failed merge group; failed-step lookup unavailable`;
            } finally {
              clearTimeout(evidenceTimer);
            }
            core.error(diagnostic);
            try {
              core.summary.addRaw(`${diagnostic}\n`);
              await core.summary.write();
            } catch {
              core.error(`${context.job}: cancellation step summary could not be written`);
            }
            await github.rest.actions.cancelWorkflowRun({
              ...context.repo,
              run_id: context.runId,
            });

