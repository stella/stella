        run: bun scripts/ci-generated-sources.ts restore "$RUNNER_TEMP/generated-sources"

      - name: Install the docs MCP server
        # tsconfig.tooling.json typechecks .claude/mcp against the packages
        # installed there, which are outside the root lockfile. Install them
        # so this job checks the same graph a checkout with `bun run
        # setup:mcp` has.
        run: bash scripts/retry.sh bun run setup:mcp
        env:
          NPM_TOKEN: ""

      - name: Prepare environment
        run: |
          cd ./apps/api
          cp .env.example .env
          cd ../web
          cp .env.example .env

      - name: Typecheck coverage
        # Loaders can execute a TypeScript file that belongs to no project in
        # the turbo typecheck graph. Compare every repository source with the
        # compiler's own --listFilesOnly output so none bypass typechecking.
        run: |
          bun scripts/typecheck-coverage.ts --self-test
          bun scripts/typecheck-coverage.ts

      - name: Code quality
        env:
          BASE_REF: ${{ github.base_ref || 'main' }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            bun run code-check -- --leg rest
            exit 0
          fi
          bun run code-check:affected -- --leg rest --base "origin/$BASE_REF"

      - name: Query cache types
        if: needs.ci-plan.outputs.package_checks_required == 'true'
        run: bun run check:query-cache-types

      - name: Dead columns
        run: bun run check:dead-columns

      - name: Projection totality
        run: bun run check:projection-totality

      - name: Split-button census
        run: |
          bun run --cwd packages/scripts test ../../scripts/check-split-buttons.test.ts
          bun run check:split-buttons

      - name: Database awaits in loops
        # Type-aware N+1 guard over the API source and scripts: an awaited
        # database call, a call handed a database handle, or a helper that
        # reaches the database, once per loop iteration or per
        # Promise.all(items.map(...)) item. Handles are recognized by type, so
        # renaming one does not hide it. The whole program is checked on every
        # run because an imported helper or handle type can change a site in an
        # untouched file. Fixture programs run first so a broken guard cannot
        # pass silently. Suppress with `// db-await-in-loop: <reason>`.
        run: |
          bun test scripts/db-await-in-loop.test.ts
          bun run check:db-await-in-loop

