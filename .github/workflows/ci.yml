          retries: 0
          script: |
            let diagnostic;
            let evidenceTimer;
            try {
              const jobs = await Promise.race([
                github.paginate(
                  "GET /repos/{owner}/{repo}/actions/runs/{run_id}/attempts/{attempt_number}/jobs",
                  {
                    ...context.repo,
                    run_id: context.runId,
                    attempt_number: Number(process.env.GITHUB_RUN_ATTEMPT),
                    per_page: 100,
                    request: { timeout: 10000 },
                  },
                ),
                new Promise((_, reject) => {
                  evidenceTimer = setTimeout(() => reject(new Error("Failed-step lookup timed out")), 10000);
                }),
              ]);
              const failures = jobs.flatMap((job) => (job.steps || [])
                .filter((step) => step.conclusion === "failure")
                .map((step) => `${job.name} / ${step.number}: ${step.name} (${job.html_url})`));
              diagnostic = `${context.job}: cancelling failed merge group; failed steps: ${failures.length ? failures.join("; ") : "not yet available from the jobs API"}`;
            } catch {
              diagnostic = `${context.job}: cancelling failed merge group; failed-step lookup unavailable`;
            } finally {
              clearTimeout(evidenceTimer);
            }
            core.error(diagnostic);
            try {
              core.summary.addRaw(`${diagnostic}\n`);
              await core.summary.write();
            } catch {
              core.error(`${context.job}: cancellation step summary could not be written`);
            }
            await github.rest.actions.cancelWorkflowRun({
              ...context.repo,
              run_id: context.runId,
            });

  # A fix's tests must fail without the fix. The prove-fix label opts into
  # restoring base source under changed API tests; the verdict stays advisory.
  fix-tests-on-base:
    needs: ci-plan
    if: >-
      (needs.ci-plan.outputs.coverage_profile != 'pilot-fast-v1' || contains(fromJSON(needs.ci-plan.outputs.pilot_fast_jobs || '[]'), 'fix-tests-on-base')) && (
      needs.ci-plan.outputs.run_required != 'false'
      && (
      github.event_name == 'pull_request'
      && contains(github.event.pull_request.labels.*.name, 'prove-fix')
      && needs.ci-plan.outputs.fix_tests_on_base_required == 'true'
      && needs.ci-plan.outputs.trusted == 'true'
      )
      )
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      # Reads the pull request body for the skip line at run time, so an
      # edited body applies on a re-run.
      pull-requests: read

    steps:
      - name: Fetch GitHub API tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.repository }}
          ref: ${{ github.workflow_sha }}
          path: .workflow-tooling
          persist-credentials: false
          sparse-checkout: |
            scripts/gh-retry.sh
            scripts/retry.sh
          sparse-checkout-cone-mode: false

      - name: Preserve GitHub API tooling across source checkouts
        run: |
          cp "$GITHUB_WORKSPACE/.workflow-tooling/scripts/gh-retry.sh" "$RUNNER_TEMP/gh-retry.sh"
          echo "GH_RETRY_SCRIPT=$RUNNER_TEMP/gh-retry.sh" >> "$GITHUB_ENV"

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false
          ref: ${{ inputs.heavy_only == true && inputs.sha || '' }}
          submodules: true

      - name: Setup Bun
        uses: stella/.github/actions/setup-bun-cached@167fb396c6c0f4e07296ad2cd72e6ef15367c776
        with:
          save: ${{ github.ref == 'refs/heads/main' }}

      - name: Install dependencies
        run: bash scripts/retry.sh bun ci --ignore-scripts
        env:
          NPM_TOKEN: ""

      - name: Prepare environment
        run: cp apps/api/.env.example apps/api/.env

      - name: Changed tests fail on the base source
        # Advisory until the verdicts have been reviewed on real pull
        # requests; drop this line to make the check required.
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          REPO: ${{ github.repository }}
        run: |
          body_file="$RUNNER_TEMP/pull-request-body.md"
          bash "$GH_RETRY_SCRIPT" api "repos/$REPO/pulls/$PR_NUMBER" --jq '.body // ""' > "$body_file"
          # The checkout is the test merge: its first parent is the base.
          bun scripts/fix-tests-on-base.ts --base HEAD^1 --title "$PR_TITLE" --body-file "$body_file"

  # Typecheck-cost baseline guard. What silently rots is the compiler's
  # workload: an annotation-heavy or inference-exploding pattern in a hot
  # generic path (Eden surface, route trees, query options) lands as
  # "typecheck got slow" weeks later with no diff to point at. This re-runs
  # tsc per project with --extendedDiagnostics and fails when the
  # deterministic size counters (Types, Instantiations) jump past the merge
  # base's measurement. The committed baseline is checked nightly. Time and
  # memory are printed but never gated (machine noise). A separate job, not a
  # step in typecheck: the guard's full per-project typechecks stacked on the turbo
  # run would blow that job's timeout; here they run in parallel instead.
  # Regenerate the cumulative budget: `bun scripts/typecheck-baseline.ts --write-baseline`.
  typecheck-baseline:
    needs: [ci-plan, ci-generated-sources]
    if: >-
      needs.ci-plan.outputs.run_required != 'false'
      && (
      inputs.heavy_only != true
      && (
        needs.ci-plan.outputs.package_checks_required == 'true'
        && (needs.ci-plan.outputs.trusted == 'true'
        || github.event_name == 'workflow_dispatch')
      )
      )
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      actions: write
    env:
      CI_GENERATED_SOURCES_MANIFEST: ${{ github.workspace }}/.cache/ci-generated-sources/manifest.json
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false
          submodules: true

      - name: Setup Bun
        uses: stella/.github/actions/setup-bun-cached@167fb396c6c0f4e07296ad2cd72e6ef15367c776
        with:
          save: ${{ github.ref == 'refs/heads/main' }}

      - name: Turbo remote cache
        uses: rharkor/caching-for-turbo@2238fae6eb9a9936f92356f54cb3660200d105e7 # v2.5.1
        with:
          server-port: "0"

      - name: Install dependencies
        run: bash scripts/retry.sh bun ci --ignore-scripts
        env:
          # .npmrc references NPM_TOKEN, but PR installs must not expose
          # the real npm token to dependency lifecycle scripts.
          NPM_TOKEN: ""

      - name: Download generated sources
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: generated-sources-${{ needs.ci-generated-sources.outputs.input_hash }}
          path: ${{ runner.temp }}/generated-sources
      - name: Restore generated sources
        run: bun scripts/ci-generated-sources.ts restore "$RUNNER_TEMP/generated-sources"

      - name: Load merge base measurement
        run: bash scripts/prepare-typecheck-base.sh
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          NPM_TOKEN: ""

      - name: Generated API type review diff
        # The main recording includes the generated base files.
        # Both files were generated from their own revision above.
        run: |
          patch="$RUNNER_TEMP/web-api-types.patch"
          base_types="$RUNNER_TEMP/typecheck-base/apps/web/src/generated/api-routes.gen.ts"
          head_types="apps/web/src/generated/api-routes.gen.ts"
          test -f "$base_types"
          test -f "$head_types"
          status=0
          diff -u --label base/api-routes.gen.ts --label head/api-routes.gen.ts \
            "$base_types" "$head_types" > "$patch" || status=$?
          if [[ "$status" -gt 1 ]]; then
            exit "$status"
          fi
          {
            printf '### Generated web API type diff\n\n'
            if [[ -s "$patch" ]]; then
              printf '```diff\n'
              sed -n '1,300p' "$patch" | cut -c 1-1000
              printf '\n```\n\nShowing at most 300 lines (1000 characters per line); the full patch is attached as an artifact.\n'
            else
              printf 'Generated API types are unchanged.\n'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Generated route tree review diff
        run: |
          patch="$RUNNER_TEMP/route-tree.patch"
          base_tree="$RUNNER_TEMP/typecheck-base/apps/web/src/routeTree.gen.ts"
          head_tree="apps/web/src/routeTree.gen.ts"
          test -f "$base_tree"
          test -f "$head_tree"
          status=0
          diff -u --label base/routeTree.gen.ts --label head/routeTree.gen.ts \
            "$base_tree" "$head_tree" > "$patch" || status=$?
          if [[ "$status" -gt 1 ]]; then
            exit "$status"
          fi
          {
            printf '### Generated route tree diff\n\n'
            if [[ -s "$patch" ]]; then
              printf '```diff\n'
              sed -n '1,300p' "$patch" | cut -c 1-1000
              printf '\n```\n\nShowing at most 300 lines (1000 characters per line); the full patch is attached as an artifact.\n'
            else
              printf 'Generated routes are unchanged.\n'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload generated route tree review diff
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: generated-route-tree-diff
          path: ${{ runner.temp }}/route-tree.patch
          retention-days: 14

      - name: Upload generated API type review diff
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: generated-web-api-types-diff
          path: ${{ runner.temp }}/web-api-types.patch
          retention-days: 14

      - name: Typecheck-cost baseline guard
        # The --self-test run first proves the parser and comparison logic,
        # so a broken guard cannot pass silently.
        run: |
          bun scripts/typecheck-baseline.ts --self-test
          bun test scripts/typecheck-baseline.test.ts
          bun scripts/typecheck-baseline.ts --check-delta "$RUNNER_TEMP/typecheck-base.json"

      - name: Cancel failed merge-group run
        if: failure() && github.event_name == 'merge_group'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          retries: 0
          script: |
            let diagnostic;
            let evidenceTimer;
            try {
              const jobs = await Promise.race([
                github.paginate(
                  "GET /repos/{owner}/{repo}/actions/runs/{run_id}/attempts/{attempt_number}/jobs",
                  {
                    ...context.repo,
                    run_id: context.runId,
                    attempt_number: Number(process.env.GITHUB_RUN_ATTEMPT),
                    per_page: 100,
                    request: { timeout: 10000 },
                  },
                ),
                new Promise((_, reject) => {
                  evidenceTimer = setTimeout(() => reject(new Error("Failed-step lookup timed out")), 10000);
                }),
              ]);
              const failures = jobs.flatMap((job) => (job.steps || [])
                .filter((step) => step.conclusion === "failure")
                .map((step) => `${job.name} / ${step.number}: ${step.name} (${job.html_url})`));
              diagnostic = `${context.job}: cancelling failed merge group; failed steps: ${failures.length ? failures.join("; ") : "not yet available from the jobs API"}`;
            } catch {
              diagnostic = `${context.job}: cancelling failed merge group; failed-step lookup unavailable`;
            } finally {
              clearTimeout(evidenceTimer);
            }
            core.error(diagnostic);
            try {
              core.summary.addRaw(`${diagnostic}\n`);
              await core.summary.write();
            } catch {
              core.error(`${context.job}: cancellation step summary could not be written`);
            }
            await github.rest.actions.cancelWorkflowRun({
              ...context.repo,
              run_id: context.runId,
            });

  # Vite web build. Same rationale as landing-build below: the
  # required code-quality and test checks don't exercise the
  # bundler, so worker bundling / wasm-loader / plugin issues
  # surface only at deploy time. Run `vite build` on every PR
  # that could plausibly affect the web output so this class of
  # failure is caught pre-merge.
  web-build:
    needs: ci-plan
    if: >-
      needs.ci-plan.outputs.run_required != 'false'
      && (
      github.event_name != 'pull_request' && (
      inputs.heavy_only != true
      && (
        (needs.ci-plan.outputs.trusted == 'true'
        || github.event_name == 'workflow_dispatch')
        && needs.ci-plan.outputs.web_build_required == 'true'
      )
      )
      )
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.heavy_only == true && inputs.sha || '' }}
          persist-credentials: false

      - name: Setup Bun
        uses: stella/.github/actions/setup-bun-cached@167fb396c6c0f4e07296ad2cd72e6ef15367c776
        with:
          save: ${{ github.ref == 'refs/heads/main' }}

      - name: Install dependencies
        run: bash scripts/retry.sh bun ci --ignore-scripts
        env:
          # .npmrc references NPM_TOKEN, but PR installs must not expose
          # the secret to install-time lifecycle scripts. The token is
          # only required when publishing — never to read from the public
          # npm registry. Match the ci-checks / landing-build pattern.
          NPM_TOKEN: ""

      - name: Prepare environment
        run: |
          cd ./apps/web
          cp .env.example .env

      - name: Build web
        uses: ./.github/actions/build-e2e-web

      - name: Upload production E2E web build
        # The e2e shards and the marketing capture both serve this build.
        if: >-
          needs.ci-plan.outputs.e2e_core_required == 'true'
          || needs.ci-plan.outputs.marketing_screenshots_required == 'true'
          || needs.ci-plan.outputs.route_smoke_required == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-web-build
          path: apps/web/dist/
          if-no-files-found: error
          retention-days: 1

      - name: Bundle size guard
        run: |
          bun scripts/bundle-baseline.ts --self-test
          bun scripts/bundle-baseline.ts --check

      - name: Prod-deps web boot smoke
        timeout-minutes: 3
        # apps/web/Dockerfile's runner installs --production (deps-prod stage).
        # Reproduce that clean production tree and boot dist/runtime.js: a
        # devDependency reached by the SSR server bundle (dist/server/server.js)
        # fails to resolve here rather than at deploy time. dist/runtime.js
        # imports the full server module graph before serving, so a reachable
        # /health proves every chunk's dependencies resolve — but only against
        # this checkout's filesystem; the web-image-smoke job covers the
        # runner image's stricter boundary.
        env:
          NPM_TOKEN: ""
        run: |
          set -euo pipefail
          # Reproduce apps/web/Dockerfile's deps-prod stage exactly. Wipe
          # node_modules first (a plain --production reinstall only skips ADDING
          # devDeps; it does not prune ones the build install already placed),
          # and scope to @stll/web — an unfiltered install pulls other apps' deps
          # and could mask a package the web runtime reaches but @stll/web never
          # declared. dist/ and .env are untouched.
          rm -rf node_modules
          bun scripts/ci-install.ts "$RUNNER_TEMP/bun-install/web-production.log" --filter @stll/web --production --frozen-lockfile --ignore-scripts
          cd apps/web
          PORT=3199 HOST=127.0.0.1 bun dist/runtime.js &
          server_pid=$!
          ready=
          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3199/health >/dev/null 2>&1; then
              ready=1
              break
            fi
            sleep 1
          done
          kill "$server_pid" 2>/dev/null || true
          if [[ "$ready" != "1" ]]; then
            echo "web SSR runtime failed to boot under --production deps" >&2
            exit 1
          fi

      - name: Upload failed Bun install logs
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bun-install-${{ github.job }}
          path: ${{ runner.temp }}/bun-install/*.log
          retention-days: 7
          if-no-files-found: ignore

      - name: Cancel failed merge-group run
        if: failure() && github.event_name == 'merge_group'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          retries: 0
          script: |
            let diagnostic;
            let evidenceTimer;
            try {
              const jobs = await Promise.race([
                github.paginate(
                  "GET /repos/{owner}/{repo}/actions/runs/{run_id}/attempts/{attempt_number}/jobs",
                  {
                    ...context.repo,
                    run_id: context.runId,
                    attempt_number: Number(process.env.GITHUB_RUN_ATTEMPT),
                    per_page: 100,
                    request: { timeout: 10000 },
                  },
                ),
                new Promise((_, reject) => {
                  evidenceTimer = setTimeout(() => reject(new Error("Failed-step lookup timed out")), 10000);
                }),
              ]);
              const failures = jobs.flatMap((job) => (job.steps || [])
                .filter((step) => step.conclusion === "failure")
                .map((step) => `${job.name} / ${step.number}: ${step.name} (${job.html_url})`));
              diagnostic = `${context.job}: cancelling failed merge group; failed steps: ${failures.length ? failures.join("; ") : "not yet available from the jobs API"}`;
            } catch {
              diagnostic = `${context.job}: cancelling failed merge group; failed-step lookup unavailable`;
            } finally {
              clearTimeout(evidenceTimer);
            }
            core.error(diagnostic);
            try {
              core.summary.addRaw(`${diagnostic}\n`);
              await core.summary.write();
            } catch {
              core.error(`${context.job}: cancellation step summary could not be written`);
            }
            await github.rest.actions.cancelWorkflowRun({
              ...context.repo,
              run_id: context.runId,
            });

  # The prod-deps boot smoke above runs inside a full checkout, where
  # workspace sources exist and can mask the runner image's filesystem
  # boundary. Build the real runner
  # image: the Dockerfile stages the runtime workspace closure and proves the
  # full server module graph resolves (`dist/runtime.js --smoke`) against
  # the exact tree that ships, then boot the container across that boundary.
  # Runs at every depth: its scope is the image's staging inputs only, and
  # ci-result requires it whenever that scope is planned.
  web-image-smoke:
    needs: ci-plan
    if: >-
      needs.ci-plan.outputs.run_required != 'false'
      && (
      github.event_name != 'pull_request' && (
      needs.ci-plan.outputs.queue_depth != 'thin'
      && ((needs.ci-plan.outputs.trusted == 'true'
       || github.event_name == 'workflow_dispatch')
      && needs.ci-plan.outputs.web_image_smoke_required == 'true'
      )
      )
      )
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: read
      actions: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.heavy_only == true && inputs.sha || '' }}

      - name: Checkout workflow tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          path: .workflow-tooling
          persist-credentials: false
          sparse-checkout: |
            scripts/pull-base-images.sh
            scripts/retry.sh
          sparse-checkout-cone-mode: false

      - name: Pull web base images
        run: |
          bash .workflow-tooling/scripts/pull-base-images.sh apps/web/Dockerfile
          rm -rf .workflow-tooling

      - name: Build runner image
        run: >-
          docker build
          --file apps/web/Dockerfile
          --build-arg PUBLIC_API_URL=https://api.smoke.invalid
          --build-arg PUBLIC_APP_URL=https://app.smoke.invalid
          --tag stella-web-runner:ci
          .

      - name: Boot runner container
        run: |
          set -euo pipefail
          docker run --detach --name web-runner \
            --publish 127.0.0.1:3199:3002 stella-web-runner:ci
          ready=
          for _ in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:3199/health >/dev/null 2>&1; then
              ready=1
              break
            fi
            sleep 1
          done
          docker logs web-runner
          if [[ "$ready" != "1" ]]; then
            echo "web runner image failed to serve /health" >&2
            exit 1
          fi

      - name: Cleanup runner container
        if: always()
        run: docker rm --force web-runner 2>/dev/null || true

      - name: Cancel failed merge-group run
        if: failure() && github.event_name == 'merge_group'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          retries: 0
          script: |
            let diagnostic;
            let evidenceTimer;
            try {
              const jobs = await Promise.race([
                github.paginate(
                  "GET /repos/{owner}/{repo}/actions/runs/{run_id}/attempts/{attempt_number}/jobs",
                  {
                    ...context.repo,
                    run_id: context.runId,
                    attempt_number: Number(process.env.GITHUB_RUN_ATTEMPT),
                    per_page: 100,
                    request: { timeout: 10000 },
                  },
                ),
                new Promise((_, reject) => {
                  evidenceTimer = setTimeout(() => reject(new Error("Failed-step lookup timed out")), 10000);
                }),
              ]);
              const failures = jobs.flatMap((job) => (job.steps || [])
                .filter((step) => step.conclusion === "failure")
                .map((step) => `${job.name} / ${step.number}: ${step.name} (${job.html_url})`));
              diagnostic = `${context.job}: cancelling failed merge group; failed steps: ${failures.length ? failures.join("; ") : "not yet available from the jobs API"}`;
            } catch {
              diagnostic = `${context.job}: cancelling failed merge group; failed-step lookup unavailable`;
            } finally {
              clearTimeout(evidenceTimer);
            }
            core.error(diagnostic);
            try {
              core.summary.addRaw(`${diagnostic}\n`);
              await core.summary.write();
            } catch {
              core.error(`${context.job}: cancellation step summary could not be written`);
            }
            await github.rest.actions.cancelWorkflowRun({
              ...context.repo,
              run_id: context.runId,
            });

  # Expo/Metro bundle smoke. TypeScript and lint do not exercise Babel,
  # autolinking, or platform-specific module resolution, so keep one path-
  # scoped export covering Android, iOS, and web in the required CI result.
  mobile-build:
    needs: ci-plan
    if: >-
      needs.ci-plan.outputs.run_required != 'false'
      && (
      github.event_name != 'pull_request' && (
      needs.ci-plan.outputs.queue_depth != 'thin'
      && ((needs.ci-plan.outputs.trusted == 'true'
       || github.event_name == 'workflow_dispatch')
      && needs.ci-plan.outputs.mobile_build_required == 'true'
      && needs.ci-plan.outputs.suite_depth == 'full'
      )
      )
      )
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.heavy_only == true && inputs.sha || '' }}

      - name: Setup Bun
        uses: stella/.github/actions/setup-bun-cached@167fb396c6c0f4e07296ad2cd72e6ef15367c776
        with:
          save: ${{ github.ref == 'refs/heads/main' }}

      - name: Install dependencies
        run: bash scripts/retry.sh bun ci --ignore-scripts
        env:
          NPM_TOKEN: ""

      - name: Validate Expo dependency graph
        run: bun --filter @stll/mobile doctor

      - name: Bundle Android, iOS, and web
        run: bun --filter @stll/mobile build

      - name: Cancel failed merge-group run
        if: failure() && github.event_name == 'merge_group'
