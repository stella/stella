          bun apps/api/scripts/export-capability-catalog.ts --check

      - name: Web API types determinism guard
        if: ${{ !cancelled() && steps.install.outcome == 'success' && (needs.ci-plan.outputs.package_checks_required == 'true' && needs.ci-plan.outputs.web_api_types_required == 'true') }}
        # Generate twice without Turbo caching, compare bytes, and retain the
        # compiler identity assertion against the inferred API contract.
        run: bun --filter @stll/api gen:web-api-types --check

      - name: Route tree drift guard
        if: ${{ !cancelled() && steps.install.outcome == 'success' && (needs.ci-plan.outputs.package_checks_required == 'true' && needs.ci-plan.outputs.route_tree_required == 'true') }}
        run: bun --filter @stll/web generate:route-tree --check

