          && matrix.shard != 'network-baseline'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-blob-route-smoke-${{ matrix.shard }}
          path: apps/web/e2e/test-results/route-smoke-${{ matrix.shard }}/blob-report/
          retention-days: 7

      - name: Upload server logs
        if: failure() && steps.e2e-stack.outputs.status == 'ready'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: server-logs-production-${{ matrix.shard }}
          path: |
