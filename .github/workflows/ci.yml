      &&
      needs.ci-plan.outputs.run_required != 'false'
      && (needs.ci-plan.outputs.trusted == 'true'
       || github.event_name == 'workflow_dispatch')
      && needs.ci-plan.outputs.scan_engine_wasm_required == 'true'
    runs-on: ubuntu-24.04
