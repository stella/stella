name: CI Checks

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, labeled]
  # The merge queue builds main plus one pull request and merges only if this
  # workflow reports `ci-result` success on that commit, so every check below
  # also runs on the tree that will actually land.
  merge_group:
    types: [checks_requested]
  workflow_dispatch:

concurrency:
  # Non-run-ci label events intentionally skip below. Keep them out of
  # the main CI concurrency group so an incidental label cannot cancel
  # real checks. The ci-result job also changes its check name for
  # those events so it cannot replace the required status with a pass.
  group: >-
    ${{ github.workflow }}-${{ github.ref }}-${{
      github.event_name == 'pull_request'
      && github.event.action == 'labeled'
      && github.event.label.name != 'run-ci'
      && format('label-{0}-{1}', github.event.label.name, github.run_id)
      || 'checks'
    }}
  cancel-in-progress: true

permissions: {}

jobs:
  ci-plan:
    # Decide trust before checkout, then compute every changed-file scope in
    # the same runner so downstream work starts after one scheduling wave.
    # Skip draft PRs (CI runs when marked ready for review via `reopened`).
    # Also skip irrelevant label events: only the "run-ci" label matters.
    if: >-
      github.event_name == 'workflow_dispatch'
      || (github.event.pull_request.draft != true
          && (github.event.action != 'labeled'
              || github.event.label.name == 'run-ci'))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      # The merge-group trust check reads the queued pull request's head
      # repository.
      pull-requests: read
    outputs:
      trusted: ${{ steps.check.outputs.trusted }}
      agent_sandbox_docker_required: ${{ steps.changed-files.outputs.agent_sandbox_docker_required }}
      api_image_deps_required: ${{ steps.changed-files.outputs.api_image_deps_required }}
      api_image_smoke_required: ${{ steps.changed-files.outputs.api_image_smoke_required }}
      collab_redis_required: ${{ steps.changed-files.outputs.collab_redis_required }}
      desktop_rust_checks_required: ${{ steps.changed-files.outputs.desktop_rust_checks_required }}
      e2e_core_required: ${{ steps.changed-files.outputs.e2e_core_required }}
      e2e_landing_required: ${{ steps.changed-files.outputs.e2e_landing_required }}
      landing_build_required: ${{ steps.changed-files.outputs.landing_build_required }}
      legal_atlas_image_required: ${{ steps.changed-files.outputs.legal_atlas_image_required }}
      marketing_screenshots_required: ${{ steps.changed-files.outputs.marketing_screenshots_required }}
      migration_rehearsal_required: ${{ steps.changed-files.outputs.migration_rehearsal_required }}
      mobile_build_required: ${{ steps.changed-files.outputs.mobile_build_required }}
      model_rates_drift_required: ${{ steps.changed-files.outputs.model_rates_drift_required }}
      package_checks_required: ${{ steps.changed-files.outputs.package_checks_required }}
      release_typecheck_required: ${{ steps.changed-files.outputs.release_typecheck_required }}
      stack_redaction_browsers_required: ${{ steps.changed-files.outputs.stack_redaction_browsers_required }}
      web_build_required: ${{ steps.changed-files.outputs.web_build_required }}
      web_image_smoke_required: ${{ steps.changed-files.outputs.web_image_smoke_required }}
      windows_scripts_required: ${{ steps.changed-files.outputs.windows_scripts_required }}
    steps:
      - name: Check if PR is trusted
        id: check
        env:
          EVENT_NAME: ${{ github.event_name }}
          GH_TOKEN: ${{ github.token }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          BASE_REPO: ${{ github.repository }}
          HAS_RUN_CI_LABEL: ${{ contains(github.event.pull_request.labels.*.name, 'run-ci') }}
          MERGE_GROUP_HEAD_REF: ${{ github.event.merge_group.head_ref }}
        run: |
          # Same-repo PRs are trusted: the author has write access
          # to push branches. Fork PRs need a maintainer to add
          # the "run-ci" label after reviewing the code.
          #
          # A merge group runs with the base repository's secrets, and
          # the "run-ci" label survives pushes made after the reviewed
          # commit, so the label cannot vouch for it. Only a same-repo
          # pull request is trusted there; the group's head ref names
          # it as gh-readonly-queue/<base>/pr-<number>-<sha>.
          if [[ "$EVENT_NAME" == "merge_group" ]]; then
            if [[ "$MERGE_GROUP_HEAD_REF" =~ /pr-([0-9]+)-[0-9a-f]+$ ]]; then
              queued_head_repo=$(gh api "repos/$BASE_REPO/pulls/${BASH_REMATCH[1]}" --jq '.head.repo.full_name')
            else
              queued_head_repo=""
            fi
            if [[ "$queued_head_repo" == "$BASE_REPO" ]]; then
              echo "trusted=true" >> "$GITHUB_OUTPUT"
            else
              echo "trusted=false" >> "$GITHUB_OUTPUT"
              echo "::error::Merge group for a fork pull request (head ${queued_head_repo:-unknown}). Land fork changes from a same-repo branch."
            fi
          elif [[ "$HEAD_REPO" == "$BASE_REPO" ]]; then
            echo "trusted=true" >> "$GITHUB_OUTPUT"
          elif [[ "$HAS_RUN_CI_LABEL" == "true" ]]; then
            echo "trusted=true" >> "$GITHUB_OUTPUT"
          else
            echo "trusted=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Fork PR without 'run-ci' label — CI skipped. A maintainer must review the code and add the 'run-ci' label to run checks."
          fi

      - name: Checkout
        if: >-
          steps.check.outputs.trusted == 'true'
          || github.event_name == 'workflow_dispatch'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check changed file scope
        if: >-
          steps.check.outputs.trusted == 'true'
          || github.event_name == 'workflow_dispatch'
        id: changed-files
        env:
          BASE_REF: ${{ github.base_ref || 'main' }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            {
              echo "agent_sandbox_docker_required=true"
              echo "api_image_deps_required=true"
              echo "api_image_smoke_required=true"
              echo "collab_redis_required=true"
              echo "desktop_rust_checks_required=true"
              echo "e2e_core_required=true"
              echo "e2e_landing_required=true"
              echo "landing_build_required=true"
              echo "legal_atlas_image_required=true"
              echo "marketing_screenshots_required=true"
              echo "migration_rehearsal_required=true"
              echo "mobile_build_required=true"
              echo "model_rates_drift_required=true"
              echo "package_checks_required=true"
              echo "release_typecheck_required=false"
              echo "stack_redaction_browsers_required=true"
              echo "web_build_required=true"
              echo "web_image_smoke_required=true"
              echo "windows_scripts_required=true"
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi

          base_ref="origin/$BASE_REF"
          mapfile -t changed_files < <(git diff --name-only "$base_ref"...HEAD)

          if (( ${#changed_files[@]} == 0 )); then
            {
              echo "agent_sandbox_docker_required=false"
              echo "api_image_deps_required=false"
              echo "api_image_smoke_required=false"
              echo "collab_redis_required=false"
              echo "desktop_rust_checks_required=false"
              echo "e2e_core_required=false"
              echo "e2e_landing_required=false"
              echo "landing_build_required=false"
              echo "legal_atlas_image_required=false"
              echo "marketing_screenshots_required=false"
              echo "migration_rehearsal_required=false"
              echo "mobile_build_required=false"
              echo "model_rates_drift_required=false"
              echo "package_checks_required=true"
              echo "release_typecheck_required=false"
              echo "stack_redaction_browsers_required=false"
              echo "web_build_required=false"
              echo "web_image_smoke_required=false"
              echo "windows_scripts_required=false"
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi

          desktop_rust_checks_required=$(bash scripts/detect-tauri-rust-changes.sh "${changed_files[@]}")
          e2e_core_required=$(bash scripts/detect-e2e-changes.sh core "${changed_files[@]}")
          e2e_landing_required=$(bash scripts/detect-e2e-changes.sh landing "${changed_files[@]}")
          marketing_screenshots_required=$(bash scripts/detect-e2e-changes.sh marketing "${changed_files[@]}")
          package_checks_required=false
          for file in "${changed_files[@]}"; do
            case "$file" in
              .provenance.yml|provenance/*)
                ;;
              *)
                package_checks_required=true
                ;;
            esac
            if [[ "$desktop_rust_checks_required" == "true" && "$package_checks_required" == "true" ]]; then
              break
            fi
          done

          # Path scopes for the build/smoke jobs, computed here so a job whose
          # scope did not change is skipped entirely instead of scheduling a
          # runner just to decide it has nothing to do.
          agent_sandbox_docker_required=false
          api_image_deps_required=false
          api_image_smoke_required=false
          collab_redis_required=false
          landing_build_required=false
          legal_atlas_image_required=false
          migration_rehearsal_required=false
          mobile_build_required=false
          model_rates_drift_required=false
          release_typecheck_required=false
          stack_redaction_browsers_required=false
          web_build_required=false
          web_image_smoke_required=false
          windows_scripts_required=false
          for file in "${changed_files[@]}"; do
            if [[ "$file" == "VERSION" ]]; then
              release_typecheck_required=true
            fi
            # Rehearse the final release artifact before a version can merge.
            case "$file" in
              VERSION|apps/api/Dockerfile|scripts/smoke-api-image.sh|.dockerignore|.github/workflows/ci.yml|.github/workflows/release.yml)
                api_image_smoke_required=true
                ;;
            esac
            # The upgrade rehearsal: what a promotion of this change would run
            # against production's schema at production's row counts. A
            # release PR always rehearses; so does anything that changes what
            # the migrate entrypoint applies (the migration files, the db and
            # lib/db modules, and the script modules the online repairs
            # reuse) or how the rehearsal seeds and measures.
            case "$file" in
              VERSION|apps/api/drizzle/*|apps/api/src/db/*|apps/api/src/lib/db/*|apps/api/src/lib/decision-date-bounds-sql.ts|apps/api/src/handlers/case-law/citation-resolution.ts|apps/api/src/scripts/*|scripts/rehearse-migration-upgrade.sh|scripts/migration-rehearsal-db.ts|.github/workflows/ci.yml)
                migration_rehearsal_required=true
                ;;
            esac
            case "$file" in
              .github/workflows/agent-sandbox-canary.yml|.github/workflows/ci.yml|packages/agent-engine/*|package.json|bun.lock|scripts/bun-ci-retry.sh)
                agent_sandbox_docker_required=true
                ;;
            esac
            case "$file" in
              apps/web/src/lib/analytics/posthog.ts|apps/web/src/lib/analytics/stack-redaction.ts|apps/web/src/lib/analytics/error-diagnostics.ts|apps/web/e2e/stack-redaction/*|apps/web/e2e/playwright.stack-redaction.config.ts|apps/web/e2e/tsconfig.json|apps/web/tsconfig.json|apps/web/package.json|scripts/bun-ci-retry.sh|bunfig.toml|package.json|bun.lock|.npmrc|.github/workflows/ci.yml)
                stack_redaction_browsers_required=true
                ;;
            esac
            case "$file" in
              apps/web/*|packages/*|patches/*|scripts/bundle-baseline.ts|scripts/bundle-baseline.json|VERSION|bun.lock|bunfig.toml|package.json|.npmrc|.github/workflows/ci.yml)
                web_build_required=true
                ;;
            esac
            case "$file" in
              apps/mobile/*|packages/*|patches/*|bun.lock|bunfig.toml|package.json|.npmrc|.github/workflows/ci.yml)
                mobile_build_required=true
                ;;
            esac
            case "$file" in
              apps/landing/*|docs/changelog/*|VERSION|packages/*|patches/*|bun.lock|package.json|.github/workflows/ci.yml)
                landing_build_required=true
                ;;
            esac
            case "$file" in
              apps/api/*|apps/collab/*|apps/legal-atlas-runner/*|packages/*|patches/*|bun.lock|bunfig.toml|package.json|.npmrc|turbo.json|.github/workflows/ci.yml)
                api_image_deps_required=true
                ;;
            esac
            case "$file" in
              apps/collab/*|apps/api/src/handlers/folio-collab/*|apps/api/src/handlers/entities/join-folio-collab-room.ts|apps/api/src/lib/folio-collab-*|apps/api/src/lib/configured-bearer-access*|packages/api-contract/package.json|packages/api-contract/src/folio-collab*|bun.lock|.github/workflows/ci.yml)
                collab_redis_required=true
                e2e_core_required=true
                ;;
            esac
            case "$file" in
              apps/legal-atlas-runner/*|apps/api/*|packages/legal-atlas/*|packages/typescript-config/*|bun.lock|bunfig.toml|package.json|.npmrc|turbo.json|.github/workflows/ci.yml)
                legal_atlas_image_required=true
                ;;
            esac
            case "$file" in
              packages/scripts/*|package.json|bun.lock|.github/workflows/ci.yml)
                windows_scripts_required=true
                ;;
            esac
            # The committed rate snapshot is regenerated from models.dev. Run
            # its network-backed byte comparison only when a PR changes the
            # catalog inputs, generator, generated output, or this selector.
            case "$file" in
              .github/workflows/ci.yml|packages/ai-catalog/package.json|packages/ai-catalog/src/index.ts|packages/ai-catalog/src/model-rate-policy.ts|packages/ai-catalog/src/model-rate.ts|packages/ai-catalog/src/model-rates.gen.ts|packages/scripts/src/model-catalog-rates-gen.ts)
                model_rates_drift_required=true
                ;;
            esac
            # The runner-image filesystem boundary: anything that changes what
            # the image ships or how its runtime closure is staged. Workspace
            # manifests shape staging (exports maps, build scripts) and
            # vite.config.ts decides what stays external to the SSR bundle;
            # ordinary app-source changes are covered by web-build's cheaper
            # in-checkout boot smoke instead of a full image build.
            case "$file" in
              VERSION|apps/web/Dockerfile|apps/web/src/runtime.ts|apps/web/vite.config.ts|packages/start-runtime/**|packages/*/package.json|scripts/stage-web-runtime.ts|scripts/publish-manifest.ts|scripts/web-runtime-closure.ts|bun.lock|.dockerignore|.github/workflows/ci.yml)
                web_image_smoke_required=true
                ;;
            esac
          done

          # The production e2e shards consume web-build's artifact, so any
          # e2e-triggering change must also produce a web build.
          if [[ "$e2e_core_required" == "true" ]]; then
            web_build_required=true
          fi

          printf 'Changed files:\n'
          printf ' - %s\n' "${changed_files[@]}"
          {
            echo "agent_sandbox_docker_required=$agent_sandbox_docker_required"
            echo "api_image_deps_required=$api_image_deps_required"
            echo "api_image_smoke_required=$api_image_smoke_required"
            echo "collab_redis_required=$collab_redis_required"
            echo "desktop_rust_checks_required=$desktop_rust_checks_required"
            echo "e2e_core_required=$e2e_core_required"
            echo "e2e_landing_required=$e2e_landing_required"
            echo "landing_build_required=$landing_build_required"
            echo "legal_atlas_image_required=$legal_atlas_image_required"
            echo "marketing_screenshots_required=$marketing_screenshots_required"
            echo "migration_rehearsal_required=$migration_rehearsal_required"
            echo "mobile_build_required=$mobile_build_required"
            echo "model_rates_drift_required=$model_rates_drift_required"
            echo "package_checks_required=$package_checks_required"
            echo "release_typecheck_required=$release_typecheck_required"
            echo "stack_redaction_browsers_required=$stack_redaction_browsers_required"
            echo "web_build_required=$web_build_required"
            echo "web_image_smoke_required=$web_image_smoke_required"
            echo "windows_scripts_required=$windows_scripts_required"
          } >> "$GITHUB_OUTPUT"

          if [[ "$package_checks_required" != "true" ]]; then
            echo "::notice::Only provenance files changed; skipping package CI checks."
          fi

  changeset:
    name: Changeset present for published package changes
    needs: ci-plan
    if: >-
      github.event_name == 'pull_request'
      && needs.ci-plan.outputs.trusted == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Load release policy
        # scripts/changeset-policy.json is the single source of truth for which
        # paths are release-gated: scripts/changeset-guard.ts matches the same
        # lists at pre-push, so this failure reaches the developer before CI
        # spends a whole run to report it. Inlining the lists here again would
        # let the two sides gate different paths.
        id: policy
        run: |
          {
            echo "release_paths<<POLICY_EOF"
            jq -er '.releasePaths[]' scripts/changeset-policy.json
            echo "POLICY_EOF"
            echo "generated_paths<<POLICY_EOF"
            jq -er '.generatedPaths[]' scripts/changeset-policy.json
            echo "POLICY_EOF"
            echo "package_files<<POLICY_EOF"
            jq -er '.packageFiles[]' scripts/changeset-policy.json
            echo "POLICY_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: "package.json"

      - name: Published package lists match the release policy
        # CONTRIBUTING.md and .changeset/README.md tell contributors which
        # packages need a changeset. Both are rendered from the same policy
        # this job gates on, so neither can name a different set. The script
        # reads only the policy file and needs no dependency install.
        run: bun scripts/check-published-package-lists.ts --check

      - name: Enforce release intent
        # The repository owner publishes this versioned shared contract.
        uses: stella/.github/.github/actions/changeset-policy@5628b97fb3c560c0d961baa60c272c598eddcab5 # v1.7.0
        with:
          release-paths: ${{ steps.policy.outputs.release_paths }}
          generated-paths: ${{ steps.policy.outputs.generated_paths }}
          package-files: ${{ steps.policy.outputs.package_files }}
          version-file: bun.lock

  # The agent sandbox must be exercised before the standalone protected
  # canary can exist on the default branch. This job is safe for draft PRs: it
  # receives no secrets, keeps the token read-only, and runs on an ephemeral
  # hosted runner. Same-repository branches run immediately; forks retain the
  # repository's explicit run-ci approval gate.
  agent-sandbox-docker:
    name: Agent sandbox Docker isolation and lifecycle
    needs: ci-plan
    if: >-
      (needs.ci-plan.outputs.trusted == 'true'
       || github.event_name == 'workflow_dispatch')
      && needs.ci-plan.outputs.agent_sandbox_docker_required == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
    env:
      AGENT_ENGINE_DOCKER_IMAGE: stella/agent-sandbox:ci
      AGENT_ENGINE_DOCKER_NETWORK: stella-agent-ci-${{ github.run_id }}-${{ github.run_attempt }}
      AGENT_ENGINE_DOCKER_CANARY_URL: http://stella-agent-network-canary:8787/health
      NETWORK_CANARY_CONTAINER: stella-agent-network-canary-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: "package.json"

      - name: Install dependencies
        run: bash scripts/bun-ci-retry.sh --ignore-scripts
        env:
          NPM_TOKEN: ""

      - name: Run protocol and malformed-stream tests
        run: bun --filter @stll/agent-engine test

      - name: Build pinned sandbox image
        run: >-
          docker build
          --file packages/agent-engine/docker/sandbox.Dockerfile
          --tag "$AGENT_ENGINE_DOCKER_IMAGE"
          packages/agent-engine/docker

      - name: Create internal sandbox network
        run: docker network create --internal "$AGENT_ENGINE_DOCKER_NETWORK"

      - name: Start the only reachable network canary
        run: |
          bun build packages/agent-engine/scripts/mcp-canary-server.ts \
            --target=node \
            --outfile="$RUNNER_TEMP/mcp-canary-server.mjs"
          docker run --detach \
            --name "$NETWORK_CANARY_CONTAINER" \
            --network "$AGENT_ENGINE_DOCKER_NETWORK" \
            --network-alias stella-agent-network-canary \
            --read-only \
            --cap-drop=ALL \
            --security-opt=no-new-privileges \
            --tmpfs /state:rw,noexec,nosuid,size=1m,mode=1777 \
            --volume "$RUNNER_TEMP/mcp-canary-server.mjs:/workspace/mcp-canary-server.mjs:ro" \
            "$AGENT_ENGINE_DOCKER_IMAGE" \
            node /workspace/mcp-canary-server.mjs
          for _ in {1..40}; do
            if docker exec "$NETWORK_CANARY_CONTAINER" node -e \
              'fetch("http://127.0.0.1:8787/health", { signal: AbortSignal.timeout(1000) }).then(async (response) => process.exit(response.ok && await response.text() === "sandbox-network-canary" ? 0 : 1), () => process.exit(1))'; then
              exit 0
            fi
            sleep 0.1
          done
          docker logs "$NETWORK_CANARY_CONTAINER"
          exit 1

      - name: Exercise Docker provider isolation and cleanup
        env:
          AGENT_ENGINE_DOCKER_TEST: "1"
        run: bun test packages/agent-engine/src/bun-docker/provider.integration.test.ts

      - name: Assert provider left no sandbox containers
        run: |
          mapfile -t container_ids < <(
            docker ps --all --no-trunc --quiet --filter "ancestor=$AGENT_ENGINE_DOCKER_IMAGE"
          )
          if [[ "${#container_ids[@]}" -ne 1 || "${container_ids[0]}" != "$(docker inspect --format '{{.Id}}' "$NETWORK_CANARY_CONTAINER")" ]]; then
            echo "::error title=Sandbox cleanup failed::Unexpected sandbox image container survived the integration suite."
            docker ps --all --filter "ancestor=$AGENT_ENGINE_DOCKER_IMAGE"
            exit 1
          fi

      - name: Cleanup Docker resources
        if: always()
        run: |
          docker ps --all --quiet --filter "ancestor=$AGENT_ENGINE_DOCKER_IMAGE" | xargs --no-run-if-empty docker rm --force
          docker network rm "$AGENT_ENGINE_DOCKER_NETWORK" 2>/dev/null || true

  ci-checks:
    needs: ci-plan
    if: >-
      needs.ci-plan.outputs.trusted == 'true'
      || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    # 25m, matching code-quality/typecheck-baseline: this job's own "Test" step
    # duration scales with however many packages `turbo --affected` marks
    # (any PR touching multiple large packages' test suites at once runs
    # them with --concurrency=2 on a standard runner, not in isolation).
    # Bumped from 20m after a PR whose diff was affected-flagged across
    # apps/api, apps/web, packages/transactional and packages/ui
    # simultaneously hit the old 20m ceiling with the Test step still in
    # progress; a same-day comparable run (apps/api affected alone) needed
    # only ~8m for the whole job, and re-running each affected package's
    # suite locally finished in well under 5m with zero failures — so this
    # is legitimate multi-package work outgrowing the budget, not a hang.
    timeout-minutes: 25
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          submodules: true

      - name: Check AI prompt sync
        if: needs.ci-plan.outputs.package_checks_required == 'true'
        run: bash .ai/shared/scripts/sync-ai-skills.sh --check .

      # Deliberately do not restore the global Bun install cache here. Safe
      # Chain's Bun integration scans registry downloads through a proxy, so
      # cached tarballs would bypass this job's full dependency scan.
      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: "package.json"

      # Must follow Setup Bun so the shims land ahead of the real binary. This
      # job installs the whole workspace from the lockfile, so a malicious
      # package anywhere in the graph is caught here and blocks the PR.
      - name: Install Safe Chain
        if: needs.ci-plan.outputs.package_checks_required == 'true'
        uses: ./.github/actions/safe-chain

      - name: Turbo remote cache
        if: needs.ci-plan.outputs.package_checks_required == 'true'
        uses: rharkor/caching-for-turbo@2238fae6eb9a9936f92356f54cb3660200d105e7 # v2.5.1

      - name: Install dependencies
        if: needs.ci-plan.outputs.package_checks_required == 'true'
        run: bash scripts/bun-ci-retry.sh --ignore-scripts
        env:
          # .npmrc references NPM_TOKEN, but PR installs must not expose
          # the real npm token to dependency lifecycle scripts.
          NPM_TOKEN: ""

      - name: Workspace hygiene
        # Restored from the bun postinstall lifecycle, which is bypassed
        # by `--ignore-scripts` above. sherif catches cross-package
        # dependency drift and workspace-hygiene.ts catches misnamed
        # apps/* and packages/* directories. ci-checks is the only job
        # that needs this — its trigger (any non-workflow file changes)
        # is a superset of web-build, landing-build, db-migrations, and
        # nightly-typecheck, so coverage is identical to running it in
        # each install.
        if: needs.ci-plan.outputs.package_checks_required == 'true'
        run: bun run lint:ws

      - name: Dependabot group guard
        # Related framework and plugin updates must stay in one PR even when
        # upstream moves packages between scopes.
        run: bun test scripts/dependabot-grouping.test.ts

      - name: Lockfile workspace-version guard
        # `bun.lock` caches each workspace's `name`/`version`; `bun install`
        # (frozen or not) never rewrites that cache when only a workspace's
        # own package.json version changes, and `bun pm pack`/`bun publish`
        # read the stale cached version when resolving a dependent's
        # `workspace:^`/`workspace:~` range at publish time. Catches drift
        # before a published @stll/* package ships a wrong dependency range.
        if: needs.ci-plan.outputs.package_checks_required == 'true'
        run: bun scripts/check-lockfile-workspace-versions.ts

      - name: Resolution range guard
        # A root `resolutions`/`overrides` entry force-overrides a package's
        # version everywhere, ignoring the ranges its dependents declare, and
        # bun applies it without erroring even when it pins the package BELOW a
        # dependent's floor. That is silent at install and only surfaces as a
        # MISSING_EXPORT at build/runtime (how a stale folio-core/docx-core pin
        # broke folio). This fails when a resolution holds a dependency below
        # any dependent's required floor; intentional overrides are allowlisted
        # in the guard.
        if: needs.ci-plan.outputs.package_checks_required == 'true'
        run: bun scripts/check-resolution-ranges.ts

      - name: Quarantine-exclude guards
        # The 5-day release-age quarantine is excluded per package for
        # first-party @stll/* code, and bun matches those entries EXACTLY (a
        # `@stll/*` glob is accepted and ignored). List a napi package without
        # its platform subpackages and the parent installs while its binaries
        # stay quarantined — and a quarantined optionalDependency is skipped
        # SILENTLY, so the package imports fine and throws on first use. This
        # fails when the exclude list stops covering everything in the lock.
        # Temporary third-party exemptions carry an exact expiry so the same
        # check also fails once Bun's release-age gate can take over again.
        if: needs.ci-plan.outputs.package_checks_required == 'true'
        run: |
          bun test scripts/check-stll-quarantine-excludes.test.ts
          bun scripts/check-stll-quarantine-excludes.ts

      - name: Policy evidence
        run: bun run policies:check

      - name: Marketing content evidence
        run: bun run marketing:check

      - name: Railway template shape
        if: needs.ci-plan.outputs.package_checks_required == 'true'
        run: bun run check:railway-template

      - name: Prepare environment
        if: needs.ci-plan.outputs.package_checks_required == 'true'
        # `cp`, not `mv`: renaming the tracked .env.example dirties the
        # working tree in apps/api and apps/web, and `turbo --affected`
        # counts working-tree changes — so every PR (even web-only ones)
        # ran the api AND web test suites concurrently and could OOM the
        # runner (exit 137). The copy leaves the tree clean; .env is
        # gitignored and invisible to affected-detection.
        run: |
          cd ./apps/api
          cp .env.example .env
          cd ../web
          cp .env.example .env

      - name: Compute affected flag
        if: needs.ci-plan.outputs.package_checks_required == 'true'
        id: affected
        env:
          BASE_REF: ${{ github.base_ref || 'main' }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            echo "flag=" >> "$GITHUB_OUTPUT"
          else
            echo "flag=--affected" >> "$GITHUB_OUTPUT"
            echo "TURBO_SCM_BASE=origin/$BASE_REF" >> "$GITHUB_ENV"
          fi

      - name: Check UI browser test scope
        if: needs.ci-plan.outputs.package_checks_required == 'true'
        id: ui-browser-tests
        env:
          BASE_REF: ${{ github.base_ref || 'main' }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]] || ! git diff --quiet "origin/$BASE_REF"...HEAD -- \
            .github/actions/setup-playwright/action.yml \
            .github/workflows/ci.yml \
            apps/web/e2e/playwright.ui-playground.config.ts \
            apps/web/e2e/ui-playground \
            apps/web/package.json \
            apps/web/public/prepaint-init.js \
            apps/web/src/app-providers.tsx \
            apps/web/src/components/theme-provider.tsx \
            apps/web/src/fonts.css \
            apps/web/src/i18n \
            apps/web/src/routes/__root.tsx \
            apps/web/src/routes/dev.tsx \
            apps/web/src/routes/dev \
            apps/web/src/styles/app.css \
            apps/web/vite.config.ts \
            bun.lock \
            package.json \
            packages/locales \
            packages/ui; then
            echo "required=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "required=false" >> "$GITHUB_OUTPUT"

      - name: Check i18n sync
        if: needs.ci-plan.outputs.package_checks_required == 'true'
        run: bun run i18n:check

      - name: Release changelog guard
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref || 'main' }}
        run: bash scripts/check-release-changelog.sh --base "origin/$BASE_REF"

      - name: Release marketing freshness warning
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref || 'main' }}
        run: |
          if git diff --quiet "origin/$BASE_REF"...HEAD -- VERSION; then
            echo "VERSION unchanged; fresh release recordings not required."
            exit 0
          fi
          if ! bun run marketing:stale --strict; then
            echo "::warning::Stale marketing recordings for this release (see step log). Re-record with \`bun run marketing:reshoot\`."
          fi

      - name: Format
        if: needs.ci-plan.outputs.package_checks_required == 'true'
        # Call turbo directly: the `format:check` script already
        # contains `-- --check`, so appending `--affected` via
        # `bun run` would land it after turbo's `--` and forward it
        # to oxfmt instead of filtering packages.
        env:
          AFFECTED_FLAG: ${{ steps.affected.outputs.flag }}
        run: |
          bun run format:guard
          args=()
          [[ -z "$AFFECTED_FLAG" ]] || args+=("$AFFECTED_FLAG")
          bun --bun turbo run format "${args[@]}" -- --check

      - name: Rust format
        if: needs.ci-plan.outputs.desktop_rust_checks_required == 'true'
        run: cargo fmt --manifest-path apps/desktop/src-tauri/Cargo.toml -- --check

      - name: React Compiler bailout guard
        if: needs.ci-plan.outputs.package_checks_required == 'true'
        # Components the React Compiler bails out on (refs-in-render,
        # try/finally, an ESLint suppression on the component) are not
        # auto-memoized, so manual useMemo/useCallback there is load-bearing:
        # removing it leaves unstable references that re-fire effects every
        # render — loops that lint and typecheck do not catch. Fails when a
        # baseline bailout file loses memoization or a new bailout component
        # appears untracked. CI-only: it runs the JS compiler, too slow for the
        # normal lint output. Regenerate:
        # `bun scripts/rc-bailouts.ts --write-baseline`.
        run: bun scripts/rc-bailouts.ts --check

      - name: Oxlint override union guard
        if: needs.ci-plan.outputs.package_checks_required == 'true'
        # Oxlint resolves `overrides` by replacement: for a given file the last
        # override that mentions a rule supplies that rule's whole
        # configuration. For a list-of-restrictions rule
        # (`no-restricted-imports` and friends) a scope that adds one ban
        # therefore deletes every ban it inherited, and nothing fails — the
        # forbidden import just stops being reported. This guard resolves the
        # tracked rules against the real repository file list the way oxlint
        # does and fails when a scope's effective restriction set is missing an
        # inherited entry. Deliberate narrowings live in DELIBERATE_NARROWINGS
        # with a reason and are checked in both directions.
        run: bun test scripts/oxlint-override-union.test.ts

      - name: Ratchet guard
        if: needs.ci-plan.outputs.package_checks_required == 'true'
        # Whole-repo convention metrics (see RATCHET_METRICS in
        # scripts/ratchet.ts) that may only ever
        # decrease. Each metric's current count is compared to a committed
        # baseline; a rise fails CI (a new violation), a fall just prompts a
        # `--write` to lock in the improvement. Line-based counters, no AST —
        # fast. The --self-test run first proves each counter counts what it
        # claims and that a rise regresses, so a broken guard cannot pass
        # silently. Regenerate: `bun scripts/ratchet.ts --write`.
        run: |
          bun scripts/ratchet.ts --self-test
          bun scripts/ratchet.ts --check

      - name: Result boundary enrolment
        if: needs.ci-plan.outputs.package_checks_required == 'true'
        # Joining the better-result boundary convention is the default. Every
        # directory under apps/*/src and packages/*/src is either enabled in
        # RESULT_CONVENTION_ENABLED_GLOBS or carries a written reason in
        # RESULT_CONVENTION_OPT_OUTS, so a new app, package, or feature
        # directory cannot skip the convention by being forgotten; an opt-out
        # for a directory that is now enabled or gone fails too, so the table
        # can only shrink. The fixture tests run first so a broken guard cannot
        # pass silently.
        run: |
          bun test scripts/check-result-boundary-enrolment.test.ts
          bun run check:result-boundary-enrolment

      - name: Module ownership
        if: needs.ci-plan.outputs.package_checks_required == 'true'
        # scripts/ownership.ts holds one row per owned capability. The
        # confine-owner lint rule reads the enforced rows, and
        # docs/module-ownership.md is rendered from the same table, so this
        # check fails when the doc is stale, an id repeats, or a path a row
        # names has moved. Regenerate: `bun scripts/ownership.ts --write`.
        run: bun run check:module-ownership

      - name: Suppression waiver ledger
        if: needs.ci-plan.outputs.package_checks_required == 'true'
        # The ratchet budgets cap how many suppressions each lint rule carries.
        # For the security tier — tenancy, authorization, credential and audit
        # rules — a count is not enough, because two waivers of the same rule
        # are not interchangeable. scripts/suppression-waivers.json names each
        # one (rule, file, anchoring symbol, reason, evidence) and this guard
        # mirrors it against the tree in both directions, so adding a
        # suppression is a reviewable ledger edit and a stale entry cannot rot
        # in place. Temporary waivers fail once their expiry passes. The
        # --self-test run first proves the guard still detects each kind of
        # drift. Draft entries: `bun scripts/suppression-waivers.ts --seed`.
        run: |
          bun scripts/suppression-waivers.ts --self-test
          bun scripts/suppression-waivers.ts --check

      - name: Crawl posture guard
        if: needs.ci-plan.outputs.package_checks_required == 'true'
        # Every app under apps/ declares a `crawlPosture` in package.json:
        # "public" (indexable SEO/LLM surface), "private" (authenticated app that
        # must stay invisible to crawlers), "mixed" (an SSR app with both public
        # and private routes), or "unserved" (not an internet-facing HTML
        # surface). This guard verifies the crawl artifacts match the declared
        # posture — a public surface must ship a crawler-inviting robots.txt
        # (Sitemap, no deny-all) plus an llms.txt and carry no `noindex`; a
        # private surface must ship a deny-all robots.txt (no Sitemap), a
        # `noindex` robots meta on every served page, and no llms.txt; a mixed
        # surface must serve a dynamic default-deny robots.txt with an explicit
        # public allowlist (a robots server route, no shadowing static
        # robots.txt, and a crawl-prefix allowlist that maps to real routes,
        # checked in source) instead of static files — so the SEO/LLM surface and
        # the private routes cannot silently drift. The --self-test run first
        # proves each detector still fires, so a broken guard cannot pass
        # silently.
        run: |
          bun scripts/crawl-posture.ts --self-test
          bun scripts/crawl-posture.ts --check

      - name: CLI registry snapshot guard
        if: needs.ci-plan.outputs.package_checks_required == 'true'
        # The stella CLI's committed registry snapshot, generated route map, and
        # the generated TanStack Intent agent skill must match the live MCP
        # registry: regenerate all of them and fail on any diff so a registry
        # change cannot silently ship a stale CLI surface (or stale skill docs).
        # Regenerate: `bun run codegen` in packages/cli.
        run: |
          (cd packages/cli && bun run codegen)
          git diff --exit-code -- packages/cli/src/generated packages/cli/skills

      - name: MCP App bundle guard
        if: needs.ci-plan.outputs.package_checks_required == 'true'
        # The API serves the committed single-file bundle, not the TypeScript
        # source. Regenerate it and fail on any diff so source tests and the
        # production resource cannot silently exercise different app code.
        run: |
          (cd apps/api && bun run build:mcp-apps)
          git diff --exit-code -- apps/api/src/mcp/apps/document-upload/generated/app.html.txt

      - name: Documentation source policy rule
        if: needs.ci-plan.outputs.package_checks_required == 'true'
        # Every direct dependency must have an exact llms.txt source or a
        # time-bounded, explained quarantine.
        run: |
          bun test ./.oxlint-plugins/__tests__/docs-source-policy.test.ts
          bun run check:docs-sources

      - name: Capability catalog drift guard
        if: needs.ci-plan.outputs.package_checks_required == 'true'
        # The committed capability catalog (every `tool`/`covered` safe handler,
        # projected to id + input schema + permissions + scope + access +
        # destructive) must match the live handler graph. `--check` regenerates
        # it in-memory and byte-compares against the committed JSON, so a handler
        # or mapping-table change cannot silently ship a stale catalog.
        # Regenerate: `bun --env-file=apps/api/.env
        # apps/api/scripts/export-capability-catalog.ts`.
        run: |
          bun apps/api/scripts/export-capability-catalog.ts --check

      - name: Model rate snapshot drift guard
        if: needs.ci-plan.outputs.model_rates_drift_required == 'true'
        # This fetches models.dev and byte-compares the deterministic output
        # with the committed snapshot. Keeping it path-scoped avoids adding a
        # network dependency to unrelated pull requests.
        run: bun --filter @stll/ai-catalog gen:rates --check

      - name: Capability description ledger
        if: needs.ci-plan.outputs.package_checks_required == 'true'
        # A capability's `description` is what an MCP client reads before
        # deciding whether to call it, so every capability still missing one is
        # listed by exact id in apps/api/capability-description-ledger.json. A
        # capability missing prose that is not in the ledger fails (no new
        # debt); a ledger entry whose capability now has prose, or no longer
        # exists, fails as stale — so authoring a description means deleting its
        # ledger line in the same change and the list can only shrink. The
        # --self-test run first proves the detectors still fire, so a broken
        # guard cannot pass silently.
        run: |
          bun apps/api/scripts/capability-description-guard.ts --self-test
          bun apps/api/scripts/capability-description-guard.ts

      - name: exactMirror route guard
        if: needs.ci-plan.outputs.package_checks_required == 'true'
        # Elysia builds an "exactMirror" serializer per route schema. Some
        # schemas (recursive ones: t.Recursive, or a Type.Unsafe wrapping a
        # self-referential TypeBox node) cannot be mirrored: Elysia logs the
        # failure and falls back to slow per-request serialization, which has
        # taken the API down at boot. Typecheck and lint do not catch it. The
        # guard builds the real app and forces every route's mirror to compile,
        # failing if any cannot. The --self-test run first proves the detector
        # still catches a known recursive schema, so a broken guard cannot pass
        # silently.
        run: |
          bun apps/api/scripts/exact-mirror-guard.ts --self-test
          bun apps/api/scripts/exact-mirror-guard.ts

      - name: MCP coverage guard
        if: needs.ci-plan.outputs.package_checks_required == 'true'
        # Every safe-handler config must declare an `mcp` disposition (a
        # typecheck-enforced McpExposure). This guard imports every handler
        # module, verifies each disposition is well-formed, that every
        # tool/covered reference names a real static MCP tool, that no registry
        # tool is orphaned, and that the `pending` baseline only ever shrinks
        # (a new pending endpoint fails). The --self-test run first proves the
        # ratchet detectors still fire, so a broken guard cannot pass silently.
        run: |
          bun apps/api/scripts/mcp-coverage-guard.ts --self-test
          bun apps/api/scripts/mcp-coverage-guard.ts

      - name: Knip production dependency checks
        if: needs.ci-plan.outputs.package_checks_required == 'true'
        # Static gate paired with the image compile/boot smokes
        # (api-image-deps): knip --strict verifies production code imports
        # only `dependencies` (never a devDependency) and flags transitively
        # resolved (phantom) packages a `turbo prune` would drop. Scoped to
        # the apps that ship a pruned runtime; each declares its real
        # production entry (a `!` entry, a start script, or the SSR server
        # entry). New runtimes are enrolled here deliberately, alongside a
        # boot/compile smoke.
        run: |
          for workspace in apps/api apps/legal-atlas-runner apps/web; do
            DATABASE_URL=postgresql://invalid bun --no-env-file run knip --production --strict --no-progress --include unlisted,unresolved --workspace "$workspace"
          done

      - name: Knip unused-dependency checks
        if: needs.ci-plan.outputs.package_checks_required == 'true'
        # Complements the production import gate above: flags declared
        # `dependencies`/`devDependencies` that no file in the workspace
        # imports (non-production run so test/e2e/tooling files count as
        # usage). Scoped to the shipping apps, matching the loop above.
        #
        # Only the `dependencies` issue type is enforced here. `exports`
        # and `types` are no longer off: they are budgeted repo-wide by the
        # dead-export step below, which counts them per workspace and lets
        # the count only fall. `files` stays OFF (see the `exclude` in
        # knip.json): the unused-file set is dominated by feature slices
        # whose ship-or-delete call is a product decision (e.g. the
        # flag-gated time-billing components), not mechanical dead code.
        run: |
          for workspace in apps/api apps/legal-atlas-runner apps/web; do
            DATABASE_URL=postgresql://invalid bun --no-env-file run knip --no-progress --include dependencies --workspace "$workspace"
          done

      - name: Knip dead-export check (packages/cli)
        if: needs.ci-plan.outputs.package_checks_required == 'true'
        # The CLI is small enough to enforce the `exports`/`types` issue
        # types today (the apps above are not; see the note in the step
        # before). An exported helper that no runtime or test path calls is
        # how "login never persists the default server" shipped: the
        # persistence function existed, unused. Test files are entries in
        # knip.json so test-only exports count as used; anything else that
        # is exported but unreferenced fails here.
        run: |
          DATABASE_URL=postgresql://invalid bun --no-env-file run knip --no-progress --include exports,types,nsExports --workspace packages/cli

      - name: Knip dead-export budget (all workspaces)
        if: needs.ci-plan.outputs.package_checks_required == 'true'
        # What the packages/cli step enforces at zero, every other workspace
        # carries as a decrease-only budget: one knip run for the whole repo,
        # counted per workspace against scripts/knip-exports-baseline.json. A
        # rise fails here and names the offending symbols; a fall only prompts
        # `bun scripts/knip-exports-ratchet.ts --write` so the improvement can
        # never regress. The parser tests run first, so a broken summary cannot
        # pass silently.
        run: |
          bun test scripts/knip-exports-ratchet.test.ts
          bun run check:knip-exports

      - name: Catalogue pinned-content check
        if: needs.ci-plan.outputs.package_checks_required == 'true'
        timeout-minutes: 5
        env:
          GITHUB_TOKEN: ${{ github.token }}
        # github-sourced catalogue skills pin an upstream commit SHA whose
        # bytes nothing else in CI fetches: the schema/loader validate only
        # the manifest, and the offline `bun run test` path stays offline.
        # This step fetches each pinned SKILL.md and its resource tree and
        # fails if the content would be rejected by the skill install path
        # (missing name/description, name pattern, oversized body, or too
        # many/large resource files), so a broken pin cannot ship green.
        run: bun run --filter @stll/catalogue check-pinned

      - name: Test
        if: needs.ci-plan.outputs.package_checks_required == 'true'
        env:
          AFFECTED_FLAG: ${{ steps.affected.outputs.flag }}
        run: |
          args=()
          [[ -z "$AFFECTED_FLAG" ]] || args+=("$AFFECTED_FLAG")
          bun run test -- --concurrency=2 "${args[@]}"

      - name: Install UI browser test runtime
        if: steps.ui-browser-tests.outputs.required == 'true'
        uses: ./.github/actions/setup-playwright
        with:
          dependency-mode: full

      - name: Test UI browser interactions
        if: steps.ui-browser-tests.outputs.required == 'true'
        run: bun --filter @stll/ui test:browser

      - name: Test UI playground visuals
        if: steps.ui-browser-tests.outputs.required == 'true'
        run: bun --filter @stll/web test:e2e:ui-playground

      - name: Property-test convention guard
        run: |
          bun test packages/property-testing/src/convention.test.ts
          bun test packages/property-testing/src/ci-gate-coverage.test.ts

      - name: Test marketing recording verification guard
        if: needs.ci-plan.outputs.package_checks_required == 'true'
        run: bun test scripts/check-marketing-recordings.test.ts

      # Self-test the bridge-version guard so a regression in the
      # script itself is caught immediately, not on the next desktop
      # bridge change. Always runs (no `if:` gate) — it's seconds
      # and has no deps.
      - name: Test desktop bridge CI guards
        run: |
          bash scripts/check-bridge-version.test.sh
          bash scripts/detect-tauri-rust-changes.test.sh

      # Self-test the release-channel script. The desktop release
      # pipeline relies on three independent steps deriving the
      # same channel from a tag (updater endpoint baked into the
      # binary, S3 manifest mirror path, CloudFront invalidation
      # key). A bug here makes them silently disagree.
      - name: Test release-channel script
        run: bash scripts/release-channel.test.sh

      # The web compiler uses native Rolldown bindings, while the deployed
      # container is ARM64. Keep build and runtime dependency architectures
      # separated in the Docker stage graph.
      - name: Test web container platform boundary
        run: bun test scripts/check-web-docker-platform.test.ts

      # Bun links @stll dependencies to local workspaces only while versions
      # match; a drift silently flips the resolution to the npm registry copy
      # (or back). Needs only bun.lock, so it stays runnable when the
      # dependency install is skipped.
      - name: Test @stll resolution pin
        run: bun test scripts/stll-registry-resolutions.test.ts

      # The runner image stages workspace packages reached by externalized
      # runtime dependencies. Guard the closure derivation and the
      # manifest-only-fails / staged-succeeds property.
      - name: Test web runtime staging
        if: needs.ci-plan.outputs.package_checks_required == 'true'
        run: bun test scripts/stage-web-runtime.test.ts

      # The same transformation decides what every published tarball exports.
      # Its unit coverage is what keeps a malformed source map — a wildcard, a
      # conditions object, a target outside src, a missing root — out of a
      # publishable package.
      - name: Test published export artifact guard
        if: needs.ci-plan.outputs.package_checks_required == 'true'
        run: bun test scripts/published-export-guards.test.ts

      - name: Test publish manifest transformation
        # scripts/publish-manifest.ts imports better-result, so this needs the
        # install above; a workflow-only PR skips both.
        if: needs.ci-plan.outputs.package_checks_required == 'true'
        run: bun test scripts/publish-manifest.test.ts

      # Nothing in ordinary development resolves a package the way an install
      # does: in-repo consumers read `exports` pointing at ./src. This runs the
      # real publish path for each source-exported package — build,
      # prepare-publish, pack — then resolves and imports every declared
      # subpath from the built dist, so a missing build entry or an unshipped
      # file fails here rather than after publication.
      - name: Published export map guard
        if: needs.ci-plan.outputs.package_checks_required == 'true'
        run: |
          bun scripts/check-published-exports.ts packages/auth-model
          bun scripts/check-published-exports.ts packages/ai-catalog
          bun scripts/check-published-exports.ts packages/anonymize-chat
          bun scripts/check-published-exports.ts packages/chat
          bun scripts/check-published-exports.ts packages/ssr-kit
          bun scripts/check-published-exports.ts packages/ssr-testkit
          bun scripts/check-published-exports.ts packages/start-runtime
          bun scripts/check-published-exports.ts packages/ui
          bun scripts/check-published-exports.ts packages/money
          bun scripts/check-published-exports.ts packages/calculations
          bun scripts/check-published-exports.ts packages/workspace-model
          bun scripts/check-published-exports.ts packages/workspace-ui
          bun scripts/check-published-exports.ts packages/stable-stringify

      # Release ordering is a safety property. This test has no workspace
      # dependencies, so it remains runnable when a PR changes only workflows
      # and the dependency install above is intentionally skipped.
      - name: Test release policy scripts
        run: |
          bun test scripts/check-api-deployment.test.ts
          bun test scripts/check-staging-deploy-decision.test.ts
          bash scripts/create-release-manifest.test.sh
          bash scripts/promote-desktop-release.test.sh

      - name: Test release image CI gate
        if: needs.ci-plan.outputs.package_checks_required == 'true'
        run: bun test scripts/ci-plan.test.ts

      - name: Test maintenance release preparation
        if: needs.ci-plan.outputs.package_checks_required == 'true'
        run: bun test scripts/prepare-maintenance-release.property.test.ts

      # The api test runner only globs `src/**`, so the tests beside the api
      # scripts (seed guards, AI provider canary, MCP coverage) need an
      # explicit invocation to run in CI, like the scripts tests above. The
      # glob keeps a new scripts test from landing unrun. Gated on workspace
      # checks so it is skipped on workflow-only PRs where dependencies are
      # not installed.
      - name: Test api scripts
        if: needs.ci-plan.outputs.package_checks_required == 'true'
        run: >-
          bun test --preload ./apps/api/src/tests/setup-env.ts
          apps/api/scripts/*.test.ts

      - name: Test API and CLI contract invariants
        if: needs.ci-plan.outputs.package_checks_required == 'true'
        run: |
          bun test --preload ./apps/api/src/tests/setup-env.ts \
            scripts/check-api-cli-contract.test.ts
          bun test scripts/quickwit-compose-contract.test.ts

      # Self-test the desktop-release skip decision. This script
      # decides whether prod desktop users get an update at all; a
      # regression either ships stale desktop builds or reintroduces
      # pointless ~30 MB redownloads.
      - name: Test detect-desktop-release-changes script
        run: bash scripts/detect-desktop-release-changes.test.sh

      - name: Test CI workflow invariants
        run: >-
          bun test
          scripts/detect-e2e-changes.test.ts
          scripts/autofix-workflow.test.ts
          scripts/dependabot-empty-changeset.test.ts

      - name: Test package scaffolder
        if: needs.ci-plan.outputs.package_checks_required == 'true'
        run: bun test scripts/new-package.test.ts

      - name: Test affected code-check planner
        if: needs.ci-plan.outputs.package_checks_required == 'true'
        run: bun test scripts/code-check-affected.test.ts

      # The pre-push guard and the `changeset` job above must gate the same
      # paths. This fails when they diverge, when a policy pathspec goes stale,
      # and when a newly published package is missing from the policy file.
      - name: Test changeset guard
        if: needs.ci-plan.outputs.package_checks_required == 'true'
        run: bun test scripts/changeset-guard.test.ts

      - name: Test environment tooling
        if: needs.ci-plan.outputs.package_checks_required == 'true'
        run: bun test scripts/env-tool.test.ts

      - name: Test bun ci retry script
        run: bash scripts/bun-ci-retry.test.sh

      # Both guards decide whether a change may reach a live database or the
      # default branch, and both fail open if their comparison logic breaks:
      # a migration ordering check that always returns null passes every PR,
      # and a merge gate that reads an empty check list as green merges
      # unverified code. Neither test ran in CI before.
      # Both scripts import `better-result`, so they need the dependency
      # install above, which is itself conditional.
      - name: Test migration ordering and merge gate logic
        if: needs.ci-plan.outputs.package_checks_required == 'true'
        run: |
          bun test scripts/check-migration-order.test.ts
          bun test scripts/merge-bar.test.ts

      # The live ordering check, against the branch this run merges into. In a
      # merge group that is main as it stands at merge time, so a migration
      # stamped below one that landed after the pull request's own run cannot
      # reach the default branch; a database that already recorded the higher
      # timestamp would skip it silently.
      - name: Check migration ordering against the base branch
        if: needs.ci-plan.outputs.package_checks_required == 'true'
        env:
          BASE_REF: ${{ github.base_ref || 'main' }}
        run: bun scripts/check-migration-order.ts "origin/$BASE_REF"

      # Self-test the dead-columns reference matcher: a regression here
      # would either silently stop flagging genuinely unreferenced columns
      # or start flagging live ones, in both cases undermining the
      # check:dead-columns gate in the code-quality job.
      - name: Test dead-columns reference matching
        if: needs.ci-plan.outputs.package_checks_required == 'true'
        run: bun test scripts/check-dead-columns.test.ts

      # Self-test the projection-totality module classifier: a regression
      # here would either silently stop flagging an unguarded resource
      # projection or start flagging unrelated modules, in both cases
      # undermining the check:projection-totality gate in the code-quality
      # job.
      - name: Test projection-totality classification
        if: needs.ci-plan.outputs.package_checks_required == 'true'
        run: bun test scripts/check-projection-totality.test.ts

      # Fail PRs that change the desktop bridge surface without
      # bumping BRIDGE_VERSION in apps/desktop/src-tauri/src/types.rs.
      # See scripts/check-bridge-version.sh for rationale.
      - name: Bridge-version guard
        if: github.event_name == 'pull_request'
        run: bash scripts/check-bridge-version.sh

  code-quality:
    needs: ci-plan
    if: >-
      needs.ci-plan.outputs.package_checks_required == 'true'
      && (needs.ci-plan.outputs.trusted == 'true'
          || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          submodules: true

      - name: Setup Bun
        uses: stella/.github/actions/setup-bun-cached@2703e4d3ed115089e593e4ca5cc749be4a5d8cee

      - name: Turbo remote cache
        # code-quality runs cacheable workspace and root checks. Restore the
        # same artifact store as ci-checks instead of rebuilding on every
        # ephemeral runner; the job is restricted to trusted code above.
        uses: rharkor/caching-for-turbo@2238fae6eb9a9936f92356f54cb3660200d105e7 # v2.5.1

      - name: Install dependencies
        run: bash scripts/bun-ci-retry.sh --ignore-scripts
        env:
          # .npmrc references NPM_TOKEN, but PR installs must not expose
          # the real npm token to dependency lifecycle scripts.
          NPM_TOKEN: ""

      - name: Prepare environment
        run: |
          cd ./apps/api
          cp .env.example .env
          cd ../web
          cp .env.example .env

      - name: Typecheck coverage
        # Loaders can execute a TypeScript file that belongs to no project in
        # the turbo typecheck graph. Compare every repository source with the
        # compiler's own --listFilesOnly output so none bypass typechecking.
        run: |
          bun scripts/typecheck-coverage.ts --self-test
          bun scripts/typecheck-coverage.ts

      - name: Code quality
        env:
          BASE_REF: ${{ github.base_ref || 'main' }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            bun run code-check
            exit 0
          fi
          bun run code-check:affected -- --base "origin/$BASE_REF"

      - name: Dead columns
        run: bun run check:dead-columns

      - name: Projection totality
        run: bun run check:projection-totality

      - name: Result consumption
        env:
          BASE_REF: ${{ github.base_ref || 'main' }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            bun run check:result-consumption -- --all
          else
            bun run check:result-consumption -- --base "origin/$BASE_REF"
          fi

  collab-redis:
    needs: ci-plan
    if: >-
      needs.ci-plan.outputs.collab_redis_required == 'true'
      && (needs.ci-plan.outputs.trusted == 'true'
          || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    services:
      redis:
        image: redis:8@sha256:298e5b3bc566bade82f46ad5511777a4a07a294097ce16ada2f6a42be5239df5
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: stella/.github/actions/setup-bun-cached@2703e4d3ed115089e593e4ca5cc749be4a5d8cee

      - name: Install dependencies
        run: bash scripts/bun-ci-retry.sh --ignore-scripts
        env:
          NPM_TOKEN: ""

      - name: Run cross-replica collaboration suite
        env:
          STELLA_COLLAB_TEST_REDIS_CONTAINER_ID: ${{ job.services.redis.id }}
          STELLA_COLLAB_TEST_REDIS_URL: redis://127.0.0.1:6379
        run: bun --filter @stll/collab test src/server.test.ts

  # These suites use Postgres behavior that PGlite cannot reproduce (partial
  # indexes, advisory locks, roles, and policies). The runner derives its file
  # set from the gate each suite declares; PR and nightly coverage therefore
  # share one source of truth instead of mirrored YAML manifests.
  postgres-suites:
    needs: ci-plan
    if: >-
      needs.ci-plan.outputs.package_checks_required == 'true'
      && (needs.ci-plan.outputs.trusted == 'true'
          || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read

    services:
      postgres:
        image: postgres:18.6@sha256:4ef4dbc939d61acea57712655ddb4b4ab27419c913f94cca0cd57cb3ea3c2280
        env:
          POSTGRES_USER: stella_owner
          POSTGRES_PASSWORD: stella
          POSTGRES_DB: stella
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U stella_owner -d stella"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: stella/.github/actions/setup-bun-cached@2703e4d3ed115089e593e4ca5cc749be4a5d8cee

      - name: Install dependencies
        run: bash scripts/bun-ci-retry.sh --ignore-scripts
        env:
          NPM_TOKEN: ""

      - name: Apply migrations to service Postgres
        working-directory: apps/api
        env:
          DATABASE_URL: postgres://stella_owner:stella@127.0.0.1:5432/stella
        run: bun run src/db/migrate.ts

      - name: Run Postgres-gated API suites
        working-directory: apps/api
        env:
          DATABASE_URL: postgres://stella_owner:stella@127.0.0.1:5432/stella
        run: bun run test:postgres

  # A VERSION change is the last review boundary before tag creation. Pay the
  # cost of the compiler's complete, uncached project graph there while keeping
  # ordinary pull requests on the fast Oxc diagnostics path.
  migration-upgrade-rehearsal:
    # Promotes this change's migrate entrypoint the way production would:
    # the promoted release's schema (from its published image), the
    # registered high-volume tables at scale, then this checkout's schema
    # migrations and online phase under a budget, a rerun, and schema
    # parity. See scripts/rehearse-migration-upgrade.sh.
    needs: ci-plan
    if: >-
      (needs.ci-plan.outputs.trusted == 'true'
       || github.event_name == 'workflow_dispatch')
      && needs.ci-plan.outputs.migration_rehearsal_required == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
      packages: read # pull the promoted release's API image

    services:
      postgres:
        image: postgres:18.6@sha256:4ef4dbc939d61acea57712655ddb4b4ab27419c913f94cca0cd57cb3ea3c2280
        env:
          POSTGRES_USER: stella_owner
          POSTGRES_PASSWORD: stella
          POSTGRES_DB: stella
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U stella_owner -d stella"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: stella/.github/actions/setup-bun-cached@2703e4d3ed115089e593e4ca5cc749be4a5d8cee

      - name: Install dependencies
        run: bash scripts/bun-ci-retry.sh --ignore-scripts
        env:
          # .npmrc references NPM_TOKEN, but PR installs must not expose
          # the real npm token to dependency lifecycle scripts.
          NPM_TOKEN: ""

      # The base image is pulled here, in workflow-owned steps, and the
      # registry credential is discarded before any checked-out script runs:
      # a pull request must not inherit a token that reads private packages.
      - name: Resolve the promoted release
        id: base
        run: |
          set -euo pipefail
          version="$(curl -fsS --max-time 15 https://api.stll.app/ready | jq -r '.version // empty')"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Production did not report a stable version (got '${version}')."
            exit 1
          fi
          echo "ref=v${version}" >> "$GITHUB_OUTPUT"

      - name: Login to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull the promoted release's API image
        env:
          BASE_IMAGE: ghcr.io/${{ github.repository_owner }}/stella-api:${{ steps.base.outputs.ref }}
        run: docker pull --quiet "$BASE_IMAGE"

      - name: Drop the registry credential
        run: docker logout ghcr.io

      - name: Rehearse the upgrade from the promoted release at scale
        env:
          DATABASE_URL: postgres://stella_owner:stella@127.0.0.1:5432/stella
          REHEARSAL_BASE_IMAGE_REPOSITORY: ghcr.io/${{ github.repository_owner }}/stella-api
          REHEARSAL_BASE_REF: ${{ steps.base.outputs.ref }}
        run: bash scripts/rehearse-migration-upgrade.sh

  release-typecheck:
    needs: ci-plan
    if: >-
      github.event_name == 'pull_request'
      && needs.ci-plan.outputs.release_typecheck_required == 'true'
      && needs.ci-plan.outputs.trusted == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: stella/.github/actions/setup-bun-cached@2703e4d3ed115089e593e4ca5cc749be4a5d8cee

      - name: Install dependencies
        run: bash scripts/bun-ci-retry.sh --ignore-scripts
        env:
          NPM_TOKEN: ""

      - name: Full release typecheck
        run: bun run typecheck && bun run typecheck:repo
        env:
          TURBO_FORCE: "true"

  # Typecheck-cost baseline guard. What silently rots is the compiler's
  # workload: an annotation-heavy or inference-exploding pattern in a hot
  # generic path (Eden surface, route trees, query options) lands as
  # "typecheck got slow" weeks later with no diff to point at. This re-runs
  # tsc per project with --extendedDiagnostics and fails when the
  # deterministic size counters (Types, Instantiations) jump past a committed
  # baseline; an improvement just prompts a re-baseline. Time/memory are
  # printed but never gated (machine noise). A separate job, not a step in
  # typecheck: the guard's full per-project typechecks stacked on the turbo
  # run would blow that job's timeout; here they run in parallel instead.
  # Regenerate: `bun scripts/typecheck-baseline.ts --write-baseline`.
  typecheck-baseline:
    needs: ci-plan
    if: >-
      needs.ci-plan.outputs.package_checks_required == 'true'
      && (needs.ci-plan.outputs.trusted == 'true'
          || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          submodules: true

      - name: Setup Bun
        uses: stella/.github/actions/setup-bun-cached@2703e4d3ed115089e593e4ca5cc749be4a5d8cee

      - name: Install dependencies
        run: bash scripts/bun-ci-retry.sh --ignore-scripts
        env:
          # .npmrc references NPM_TOKEN, but PR installs must not expose
          # the real npm token to dependency lifecycle scripts.
          NPM_TOKEN: ""

      - name: Generate types
        # The guard calls tsc directly (no turbo), so the generated inputs
        # that turbo's typecheck pipeline would produce must exist first.
        run: bun run typegen

      - name: Typecheck-cost baseline guard
        # The --self-test run first proves the parser and comparison logic,
        # so a broken guard cannot pass silently.
        run: |
          bun scripts/typecheck-baseline.ts --self-test
          bun scripts/typecheck-baseline.ts --check

  # Vite web build. Same rationale as landing-build below: the
  # required code-quality and test checks don't exercise the
  # bundler, so worker bundling / wasm-loader / plugin issues
  # surface only at deploy time. Run `vite build` on every PR
  # that could plausibly affect the web output so this class of
  # failure is caught pre-merge.
  web-build:
    needs: ci-plan
    if: >-
      (needs.ci-plan.outputs.trusted == 'true'
       || github.event_name == 'workflow_dispatch')
      && needs.ci-plan.outputs.web_build_required == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: stella/.github/actions/setup-bun-cached@2703e4d3ed115089e593e4ca5cc749be4a5d8cee

      - name: Install dependencies
        run: bash scripts/bun-ci-retry.sh --ignore-scripts
        env:
          # .npmrc references NPM_TOKEN, but PR installs must not expose
          # the secret to install-time lifecycle scripts. The token is
          # only required when publishing — never to read from the public
          # npm registry. Match the ci-checks / landing-build pattern.
          NPM_TOKEN: ""

      - name: Prepare environment
        run: |
          cd ./apps/web
          cp .env.example .env

      - name: Build web
        env:
          # The same artifact serves the feature-complete production E2E suite.
          # These flags preserve the committed bundle baseline.
          VITE_FEATURE_INBOX: "true"
          VITE_FEATURE_TIME_BILLING: "true"
          VITE_PUBLIC_LAW_ENABLED: "true"
          VITE_PUBLIC_TOOLS_ENABLED: "true"
          VITE_WORKFLOWS_ENABLED: "true"
        run: bun --filter @stll/web build

      - name: Upload production E2E web build
        # The e2e shards and the marketing capture both serve this build.
        if: >-
          needs.ci-plan.outputs.e2e_core_required == 'true'
          || needs.ci-plan.outputs.marketing_screenshots_required == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-web-build
          path: apps/web/dist/
          if-no-files-found: error
          retention-days: 1

      - name: Bundle size guard
        run: |
          bun scripts/bundle-baseline.ts --self-test
          bun scripts/bundle-baseline.ts --check

      - name: Prod-deps web boot smoke
        # apps/web/Dockerfile's runner installs --production (deps-prod stage).
        # Reproduce that clean production tree and boot dist/runtime.js: a
        # devDependency reached by the SSR server bundle (dist/server/server.js)
        # fails to resolve here rather than at deploy time. dist/runtime.js
        # imports the full server module graph before serving, so a reachable
        # /health proves every chunk's dependencies resolve — but only against
        # this checkout's filesystem; the web-image-smoke job covers the
        # runner image's stricter boundary.
        env:
          NPM_TOKEN: ""
        run: |
          set -euo pipefail
          # Reproduce apps/web/Dockerfile's deps-prod stage exactly. Wipe
          # node_modules first (a plain --production reinstall only skips ADDING
          # devDeps; it does not prune ones the build install already placed),
          # and scope to @stll/web — an unfiltered install pulls other apps' deps
          # and could mask a package the web runtime reaches but @stll/web never
          # declared. dist/ and .env are untouched.
          rm -rf node_modules
          bun install --filter @stll/web --production --frozen-lockfile --ignore-scripts
          cd apps/web
          PORT=3199 HOST=127.0.0.1 bun dist/runtime.js &
          server_pid=$!
          ready=
          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3199/health >/dev/null 2>&1; then
              ready=1
              break
            fi
            sleep 1
          done
          kill "$server_pid" 2>/dev/null || true
          if [[ "$ready" != "1" ]]; then
            echo "web SSR runtime failed to boot under --production deps" >&2
            exit 1
          fi

  # The prod-deps boot smoke above runs inside a full checkout, where
  # workspace sources exist and can mask the runner image's filesystem
  # boundary. Build the real runner
  # image: the Dockerfile stages the runtime workspace closure and proves the
  # full server module graph resolves (`dist/runtime.js --smoke`) against
  # the exact tree that ships, then boot the container across that boundary.
  web-image-smoke:
    needs: ci-plan
    if: >-
      (needs.ci-plan.outputs.trusted == 'true'
       || github.event_name == 'workflow_dispatch')
      && needs.ci-plan.outputs.web_image_smoke_required == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build runner image
        run: >-
          docker build
          --file apps/web/Dockerfile
          --build-arg PUBLIC_API_URL=https://api.smoke.invalid
          --build-arg PUBLIC_APP_URL=https://app.smoke.invalid
          --tag stella-web-runner:ci
          .

      - name: Boot runner container
        run: |
          set -euo pipefail
          docker run --detach --name web-runner \
            --publish 127.0.0.1:3199:3002 stella-web-runner:ci
          ready=
          for _ in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:3199/health >/dev/null 2>&1; then
              ready=1
              break
            fi
            sleep 1
          done
          docker logs web-runner
          if [[ "$ready" != "1" ]]; then
            echo "web runner image failed to serve /health" >&2
            exit 1
          fi

      - name: Cleanup runner container
        if: always()
        run: docker rm --force web-runner 2>/dev/null || true

  # Expo/Metro bundle smoke. TypeScript and lint do not exercise Babel,
  # autolinking, or platform-specific module resolution, so keep one path-
  # scoped export covering Android, iOS, and web in the required CI result.
  mobile-build:
    needs: ci-plan
    if: >-
      (needs.ci-plan.outputs.trusted == 'true'
       || github.event_name == 'workflow_dispatch')
      && needs.ci-plan.outputs.mobile_build_required == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: stella/.github/actions/setup-bun-cached@2703e4d3ed115089e593e4ca5cc749be4a5d8cee

      - name: Install dependencies
        run: bash scripts/bun-ci-retry.sh --ignore-scripts
        env:
          NPM_TOKEN: ""

      - name: Validate Expo dependency graph
        run: bun --filter @stll/mobile doctor

      - name: Bundle Android, iOS, and web
        run: bun --filter @stll/mobile build

  # Astro landing build. The required checks run code quality and tests,
  # but no `astro build`, so plugin/runtime
  # incompatibilities surface only at deploy time. Catch those
  # here on every PR that could plausibly affect the landing
  # output.
  landing-build:
    needs: ci-plan
    if: >-
      (needs.ci-plan.outputs.trusted == 'true'
       || github.event_name == 'workflow_dispatch')
      && needs.ci-plan.outputs.landing_build_required == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: stella/.github/actions/setup-bun-cached@2703e4d3ed115089e593e4ca5cc749be4a5d8cee

      - name: Install dependencies
        run: bash scripts/bun-ci-retry.sh --ignore-scripts
        env:
          # .npmrc references NPM_TOKEN, but PR installs must not expose
          # the real npm token to dependency lifecycle scripts.
          NPM_TOKEN: ""

      - name: Build landing
        run: bun --filter @stll/landing build

  # Browser checks use isolated parallel runners: broad production shards,
  # a small Vite dependency canary, and the built landing-page suite. The
  # production shards start only after their production build is published.
  # Marketing screenshots remain in the nightly test workflow.
  e2e-production-shard:
    needs: [ci-plan, web-build]
    if: >-
      always()
      && (needs.ci-plan.outputs.trusted == 'true'
          || github.event_name == 'workflow_dispatch')
      && needs.ci-plan.outputs.e2e_core_required == 'true'
      && needs.web-build.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Bun
        uses: stella/.github/actions/setup-bun-cached@2703e4d3ed115089e593e4ca5cc749be4a5d8cee

      - name: Install dependencies
        run: bash scripts/bun-ci-retry.sh --ignore-scripts
        env:
          NPM_TOKEN: ""

      - name: Prepare environment
        run: |
          cd ./apps/api
          cp .env.example .env
          cd ../web
          cp .env.example .env

      - name: Start docker stack and API server
        id: e2e-stack
        # Docker Hub secrets stay confined to the action's credential check
        # and login steps, never the whole job environment where
        # repository-controlled code can read them.
        uses: ./.github/actions/setup-e2e-stack
        with:
          dockerhub-username: ${{ secrets.DOCKERHUB_USERNAME }}
          dockerhub-token: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Install Playwright browsers
        if: steps.e2e-stack.outputs.status == 'ready'
        uses: ./.github/actions/setup-playwright

      - name: Download production web build
        if: steps.e2e-stack.outputs.status == 'ready'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: e2e-web-build
          path: apps/web/dist

      - name: Validate production web build
        if: steps.e2e-stack.outputs.status == 'ready'
        run: |
          for side in client server; do
            manifest="apps/web/dist/$side/version.json"
            commit=$(jq -r '.commit' "$manifest")
            if [[ "$commit" != "$GITHUB_SHA" ]]; then
              echo "::error::$side build is for $commit, expected $GITHUB_SHA"
              exit 1
            fi
          done

      - name: Start production web server
        if: steps.e2e-stack.outputs.status == 'ready'
        run: |
          cd apps/web
          NODE_ENV=production PORT=3000 nohup bun dist/runtime.js > /tmp/web-production.log 2>&1 &
          echo $! > /tmp/web-production.pid

      - name: Wait for production web server
        if: steps.e2e-stack.outputs.status == 'ready'
        run: |
          for i in {1..60}; do
            if curl --connect-timeout 2 --max-time 5 -sf http://localhost:3000/health > /dev/null 2>&1; then
              echo "Production web up after ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "::error::Production web never came up"
          tail -200 /tmp/web-production.log || true
          exit 1

      - name: Run Playwright shard
        if: steps.e2e-stack.outputs.status == 'ready'
        env:
          E2E_EXECUTION_PROFILE: ci-production-parallel
          E2E_EXPECT_DEV_ROUTES: "false"
          PLAYWRIGHT_BLOB_OUTPUT_NAME: report-${{ matrix.shard }}.zip
        run: >-
          bun --filter @stll/web test:e2e --
          --shard=${{ matrix.shard }}/2

      - name: Upload Playwright blob report
        if: always() && steps.e2e-stack.outputs.status == 'ready'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-blob-${{ matrix.shard }}
          path: apps/web/e2e/test-results/blob-report/
          retention-days: 7

      - name: Upload server logs
        if: failure() && steps.e2e-stack.outputs.status == 'ready'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: server-logs-production-${{ matrix.shard }}
          path: |
            /tmp/api.log
            /tmp/web-production.log
          retention-days: 7

  stack-redaction-browsers:
    needs: ci-plan
    if: >-
      (needs.ci-plan.outputs.trusted == 'true'
       || github.event_name == 'workflow_dispatch')
      && needs.ci-plan.outputs.stack_redaction_browsers_required == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: stella/.github/actions/setup-bun-cached@2703e4d3ed115089e593e4ca5cc749be4a5d8cee

      - name: Install dependencies
        run: bash scripts/bun-ci-retry.sh --ignore-scripts
        env:
          NPM_TOKEN: ""

      - name: Install Firefox and WebKit
        run: bunx playwright install --with-deps firefox webkit

      - name: Test browser stack redaction
        run: bun --filter @stll/web test:e2e:stack-redaction

  e2e-vite-canary:
    needs: ci-plan
    if: >-
      (needs.ci-plan.outputs.trusted == 'true'
       || github.event_name == 'workflow_dispatch')
      && needs.ci-plan.outputs.e2e_core_required == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Bun
        uses: stella/.github/actions/setup-bun-cached@2703e4d3ed115089e593e4ca5cc749be4a5d8cee

      - name: Install dependencies
        run: bash scripts/bun-ci-retry.sh --ignore-scripts
        env:
          NPM_TOKEN: ""

      - name: Prepare environment
        run: |
          cd ./apps/api
          cp .env.example .env
          cd ../web
          cp .env.example .env

      - name: Start docker stack and API server
        id: e2e-stack
        # Secrets stay scoped to the action's credential check and login
        # steps; application code runs only after the runner has logged
        # out again.
        uses: ./.github/actions/setup-e2e-stack
        env:
          STELLA_COLLAB_SERVICE_TOKEN: local-collab-service-token-at-least-32-chars
        with:
          dockerhub-username: ${{ secrets.DOCKERHUB_USERNAME }}
          dockerhub-token: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Start web dev server
        if: steps.e2e-stack.outputs.status == 'ready'
        run: |
          STELLA_API_URL=http://localhost:3001 \
          STELLA_COLLAB_MODE=single-process \
          STELLA_COLLAB_PORT=3002 \
          STELLA_COLLAB_SERVICE_TOKEN=local-collab-service-token-at-least-32-chars \
            nohup bun apps/collab/src/index.ts > /tmp/collab.log 2>&1 &
          echo $! > /tmp/collab.pid
          cd apps/web
          VITE_FEATURE_FOLIO_COLLAB=true \
          VITE_COLLAB_URL=ws://localhost:3002 \
            nohup bun --bun vite --port 3000 > /tmp/web.log 2>&1 &
          echo $! > /tmp/web.pid

      - name: Wait for web dev server
        if: steps.e2e-stack.outputs.status == 'ready'
        run: |
          for i in {1..60}; do
            if curl --connect-timeout 2 --max-time 5 -sf http://localhost:3000 > /dev/null 2>&1; then
              echo "Web up after ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "::error::Web never came up"
          tail -200 /tmp/web.log || true
          exit 1

      - name: Wait for collaboration server
        if: steps.e2e-stack.outputs.status == 'ready'
        run: |
          for i in {1..60}; do
            if curl --connect-timeout 2 --max-time 5 -sf http://localhost:3002/readyz > /dev/null 2>&1; then
              echo "Collaboration server up after ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "::error::Collaboration server never came up"
          tail -200 /tmp/collab.log || true
          exit 1

      - name: Install Playwright browsers
        if: steps.e2e-stack.outputs.status == 'ready'
        uses: ./.github/actions/setup-playwright

      - name: Run Vite dependency canary
        if: steps.e2e-stack.outputs.status == 'ready'
        env:
          E2E_EXPECT_DEV_ROUTES: "true"
          PLAYWRIGHT_BLOB_OUTPUT_NAME: report-vite-canary.zip
        run: >-
          bun --filter @stll/web test:e2e --
          e2e/specs/vite-dependency-canary.spec.ts
          --project chromium

      - name: Run lockless collaboration browser suite
        if: steps.e2e-stack.outputs.status == 'ready'
        env:
          E2E_EXPECT_DEV_ROUTES: "true"
        run: bun --filter @stll/web test:e2e:collab -- --project chromium

      # These imports load only through cold lazy routes; a mid-test optimizer
      # restart would make the apparent canary result nondeterministic.
      - name: Guard against mid-test Vite re-optimize
        if: always() && steps.e2e-stack.outputs.status == 'ready'
        run: |
          if grep -q "optimized dependencies changed. reloading" /tmp/web.log; then
            echo "::error::Vite re-optimized dependencies mid-session and forced a reload. Add the lazy/runtime dependency named below to optimizeDeps.include in apps/web/vite.config.ts."
            grep -nE "new dependencies optimized|optimized dependencies changed" /tmp/web.log || true
            exit 1
          fi
          echo "No mid-session dep re-optimize detected."

      - name: Stop web dev server
        if: always() && steps.e2e-stack.outputs.status == 'ready'
        run: |
          if [[ -f /tmp/web.pid ]]; then
            kill "$(cat /tmp/web.pid)" || true
            rm -f /tmp/web.pid
          fi
          if [[ -f /tmp/collab.pid ]]; then
            kill "$(cat /tmp/collab.pid)" || true
            rm -f /tmp/collab.pid
          fi

      - name: Upload Playwright blob report
        if: always() && steps.e2e-stack.outputs.status == 'ready'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-blob-vite-canary
          path: apps/web/e2e/test-results/blob-report/
          retention-days: 7

      - name: Upload server logs
        if: failure() && steps.e2e-stack.outputs.status == 'ready'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: server-logs-vite-canary
          path: |
            /tmp/api.log
            /tmp/collab.log
            /tmp/web.log
          retention-days: 7

  e2e-landing:
    needs: ci-plan
    if: >-
      (needs.ci-plan.outputs.trusted == 'true'
       || github.event_name == 'workflow_dispatch')
      && needs.ci-plan.outputs.e2e_landing_required == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: stella/.github/actions/setup-bun-cached@2703e4d3ed115089e593e4ca5cc749be4a5d8cee

      - name: Install dependencies
        run: bash scripts/bun-ci-retry.sh --ignore-scripts
        env:
          NPM_TOKEN: ""

      - name: Build landing
        # Built preview retains the COOP/COEP and bundler behavior used by the
        # WASM anonymization island; Astro dev cannot prove this path.
        run: bun --filter @stll/landing build

      - name: Start landing preview server
        run: |
          cd apps/landing
          nohup bun --bun astro preview --port 4321 > /tmp/landing.log 2>&1 &
          echo $! > /tmp/landing.pid

      - name: Wait for landing
        run: |
          for i in {1..60}; do
            if curl --connect-timeout 2 --max-time 5 -sf http://localhost:4321 > /dev/null 2>&1; then
              echo "Landing up after ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "::error::Landing preview never came up"
          tail -200 /tmp/landing.log || true
          exit 1

      - name: Install Playwright browsers
        uses: ./.github/actions/setup-playwright

      - name: Check landing islands
        run: E2E_LANDING_URL=http://localhost:4321 bun --filter @stll/web test:e2e:landing

      - name: Stop landing preview server
        if: always()
        run: |
          if [[ -f /tmp/landing.pid ]]; then
            kill "$(cat /tmp/landing.pid)" || true
            rm -f /tmp/landing.pid
          fi

      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: landing-e2e-diagnostics
          path: |
            /tmp/landing.log
            apps/web/test-results/
          if-no-files-found: ignore
          retention-days: 7

  # A UI change must fail the PR that makes it, not the next nightly run: the
  # captured PNGs ship as landing-page assets, so a silent baseline
  # invalidation puts a stale product shot on the marketing site. Regeneration
  # happens on the runner (`marketing-screenshots-update.yml` dispatched on
  # main with `-f branch=<this branch>`), which is also why the comparison
  # tolerance can stay tight:
  # baselines and comparison render on the same image.
  marketing-screenshots:
    # A bounded poll can expire while web-build is still waiting for a runner;
    # declare the producer so artifact consumers start only after it succeeds.
    needs: [ci-plan, web-build]
    if: >-
      always()
      && (needs.ci-plan.outputs.trusted == 'true'
          || github.event_name == 'workflow_dispatch')
      && needs.ci-plan.outputs.marketing_screenshots_required == 'true'
      && (needs.ci-plan.outputs.web_build_required != 'true'
          || needs.web-build.result == 'success')
    uses: ./.github/workflows/marketing-screenshots.yml
    permissions:
      actions: read
      contents: read
    with:
      mode: check
      # Serve the same production build the e2e shards use whenever web-build
      # runs in this workflow; the capture job builds it otherwise.
      web-build-artifact: ${{ needs.ci-plan.outputs.web_build_required == 'true' && 'e2e-web-build' || '' }}
    secrets:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}

  e2e:
    if: always()
    needs: [ci-plan, e2e-production-shard, e2e-vite-canary, e2e-landing]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout
        if: >-
          (needs.e2e-production-shard.result == 'failure'
           || needs.e2e-vite-canary.result == 'failure')
          && needs.ci-plan.outputs.e2e_core_required == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Bun
        if: >-
          (needs.e2e-production-shard.result == 'failure'
           || needs.e2e-vite-canary.result == 'failure')
          && needs.ci-plan.outputs.e2e_core_required == 'true'
        uses: stella/.github/actions/setup-bun-cached@2703e4d3ed115089e593e4ca5cc749be4a5d8cee

      - name: Install dependencies
        if: >-
          (needs.e2e-production-shard.result == 'failure'
           || needs.e2e-vite-canary.result == 'failure')
          && needs.ci-plan.outputs.e2e_core_required == 'true'
        run: bash scripts/bun-ci-retry.sh --ignore-scripts
        env:
          NPM_TOKEN: ""

      - name: Download Playwright blob reports
        if: >-
          (needs.e2e-production-shard.result == 'failure'
           || needs.e2e-vite-canary.result == 'failure')
          && needs.ci-plan.outputs.e2e_core_required == 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: playwright-blob-*
          path: apps/web/all-blob-reports
          merge-multiple: true

      - name: Merge Playwright reports
        if: >-
          (needs.e2e-production-shard.result == 'failure'
           || needs.e2e-vite-canary.result == 'failure')
          && needs.ci-plan.outputs.e2e_core_required == 'true'
        run: cd apps/web && bunx playwright merge-reports --reporter html all-blob-reports

      - name: Upload merged Playwright report
        if: >-
          (needs.e2e-production-shard.result == 'failure'
           || needs.e2e-vite-canary.result == 'failure')
          && needs.ci-plan.outputs.e2e_core_required == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 7

      - name: Evaluate browser checks
        env:
          LANDING_RESULT: ${{ needs.e2e-landing.result }}
          PRODUCTION_RESULT: ${{ needs.e2e-production-shard.result }}
          VITE_CANARY_RESULT: ${{ needs.e2e-vite-canary.result }}
        run: |
          cancelled=false
          for result in "$PRODUCTION_RESULT" "$VITE_CANARY_RESULT" "$LANDING_RESULT"; do
            case "$result" in
              success|skipped)
                ;;
              cancelled)
                cancelled=true
                ;;
              *)
                echo "::error::Browser checks ended with $result"
                exit 1
                ;;
            esac
          done
          if [[ "$cancelled" == "true" ]]; then
            echo "Browser checks were cancelled; a newer run is authoritative."
          fi

  api-image-smoke:
    name: API release image (${{ matrix.platform }})
    needs: ci-plan
    if: >-
      (needs.ci-plan.outputs.trusted == 'true'
       || github.event_name == 'workflow_dispatch')
      && needs.ci-plan.outputs.api_image_smoke_required == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            platform: linux/amd64
          - runner: ubuntu-24.04-arm
            platform: linux/arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: true

      - name: Build final API release image
        run: |
          docker build --file apps/api/Dockerfile \
            --build-arg "STELLA_VERSION=$(tr -d '[:space:]' < VERSION)" \
            --build-arg "STELLA_COMMIT_SHA=$(git rev-parse HEAD)" \
            --tag stella-api-release:ci .

      - name: Rehearse migrations and boot packaged entrypoints
        run: bash scripts/smoke-api-image.sh stella-api-release:ci

  # Image dependency guard. The API image and legal-atlas-runner Dockerfile use
  # Turbo only for pruned source overlays; dependency installs come from the
  # committed root bun.lock plus every workspace package.json so Bun remains
  # the lockfile source of truth. Mirror that install path here so deploy-time
  # lockfile drift fails the PR instead of the deploy.
  #
  # The job then compiles the API and collaboration entrypoints and runs the
  # legal atlas runner production smoke against those dependency trees.
  api-image-deps:
    needs: ci-plan
    if: >-
      (needs.ci-plan.outputs.trusted == 'true'
       || github.event_name == 'workflow_dispatch')
      && needs.ci-plan.outputs.api_image_deps_required == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: stella/.github/actions/setup-bun-cached@2703e4d3ed115089e593e4ca5cc749be4a5d8cee

      - name: Install turbo
        # Turbo is only used for pruned source overlays.
        run: bun install -g "turbo@$(bun -p 'require("./package.json").devDependencies.turbo')"

      - name: Prepare Docker install inputs
        run: |
          set -euo pipefail
          rm -rf install-json
          mkdir -p install-json
          cp bun.lock package.json install-json/
          for input in bunfig.toml .npmrc patches; do
            [ ! -e "$input" ] || cp -a "$input" install-json/
          done
          find apps packages -mindepth 2 -maxdepth 2 -name package.json \
            -not -path '*/node_modules/*' \
            -exec cp --parents -t install-json/ {} +

      - name: Prune monorepo for API image source
        run: turbo prune @stll/api @stll/collab @stll/legal-atlas-runner --docker

      - name: Install API image deps with frozen root lockfile
        run: |
          set -euo pipefail
          rm -rf api-install
          cp -a install-json api-install
          cd api-install
          bun install --filter @stll/api --filter @stll/collab --filter @stll/legal-atlas-runner --frozen-lockfile --ignore-scripts
        env:
          NPM_TOKEN: ""

      - name: API image compile smoke
        # Overlay pruned source the same way apps/api/Dockerfile copies
        # /app/out/full/ onto the dependency layer, then compile the API
        # binary, migration bundle, and runtime workers.
        run: |
          set -euo pipefail
          cd api-install
          cp -a ../out/full/. .
          export NODE_ENV=production
          bun build \
            --compile \
            --no-compile-autoload-dotenv \
            --minify-whitespace \
            --minify-syntax \
            --target bun \
            --outfile /tmp/server \
            apps/api/src/server.ts
          bun build \
            --compile \
            --no-compile-autoload-dotenv \
            --target bun \
            --outfile /tmp/collab \
            apps/collab/src/index.ts
          test -x /tmp/collab
          bun build \
            --target bun \
            --outfile apps/api/src/db/migrate.js \
            apps/api/src/db/migrate.ts
          test -s apps/api/src/db/migrate.js
          bun build \
            --target bun \
            --outfile /tmp/better-auth-migration-audit.js \
            apps/api/src/scripts/better-auth-migration-audit.ts
          test -s /tmp/better-auth-migration-audit.js
          mkdir -p /tmp/runtime-workers
          bun build \
            --target bun \
            --outfile /tmp/runtime-workers/pdf-worker.js \
            apps/api/src/lib/files/pdf-worker.ts
          # `--outdir`, matching apps/api/Dockerfile: the worker pulls in a
          # native addon that the bundler emits as a sidecar `.node` asset,
          # and `--outfile` refuses to write more than one output.
          bun build \
            --target bun \
            --outdir /tmp/runtime-workers \
            apps/api/src/lib/search/extraction-worker.ts
          test -s /tmp/runtime-workers/extraction-worker.js
          bun build \
            --target bun \
            --outfile /tmp/runtime-workers/ocr-local-worker.js \
            apps/api/src/lib/ocr-local/ocr-local-worker.ts
          test -s /tmp/runtime-workers/ocr-local-worker.js
          # Compile (not run) the runtime-asset smoke probe: it executes
          # inside the image build, where the hand-copied assets exist.
          bun build \
            --compile \
            --no-compile-autoload-dotenv \
            --target bun \
            --outfile /tmp/image-smoke \
            apps/api/src/scripts/image-smoke.ts
        env:
          NPM_TOKEN: ""

      - name: Prod-deps legal atlas runner smoke
        run: |
          set -euo pipefail
          rm -rf out-runner
          turbo prune @stll/legal-atlas-runner --docker --out-dir out-runner
          rm -rf runner-install
          cp -a install-json runner-install
          cd runner-install
          bun install --filter @stll/legal-atlas-runner --production --frozen-lockfile --ignore-scripts
          cp -a ../out-runner/full/. .
          bun --filter @stll/legal-atlas-runner build
          bun apps/legal-atlas-runner/dist/index.js smoke
          set +e
          out=$(DATABASE_URL=postgres://smoke:smoke@localhost:5432/smoke \
                S3_ENDPOINT=http://localhost \
                S3_BUCKET=smoke \
                S3_REGION=eu-central-1 \
                bun apps/legal-atlas-runner/dist/index.js run case-law-ingest __smoke__ 2>&1)
          status=$?
          set -e
          echo "$out"
          if ! echo "$out" | grep -q 'Unknown adapter: __smoke__'; then
            echo "ERROR: legal-atlas runner smoke failed under --production (exit=$status)" >&2
            exit 1
          fi
        env:
          NPM_TOKEN: ""

  legal-atlas-image:
    needs: ci-plan
    if: >-
      (needs.ci-plan.outputs.trusted == 'true'
       || github.event_name == 'workflow_dispatch')
      && needs.ci-plan.outputs.legal_atlas_image_required == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Build legal-atlas-runner image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: apps/legal-atlas-runner/Dockerfile
          platforms: linux/amd64
          push: false
          cache-from: type=gha,scope=legal-atlas-runner
          cache-to: type=gha,mode=max,scope=legal-atlas-runner

  # Narrow Windows smoke for the dev runner. Full app CI stays on Linux,
  # but this catches path and shell assumptions in the scripts package
  # before Windows contributors hit them locally.
  windows-scripts:
    needs: ci-plan
    if: >-
      (needs.ci-plan.outputs.trusted == 'true'
       || github.event_name == 'workflow_dispatch')
      && needs.ci-plan.outputs.windows_scripts_required == 'true'
    runs-on: windows-latest
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: stella/.github/actions/setup-bun-cached@2703e4d3ed115089e593e4ca5cc749be4a5d8cee

      - name: Install scripts workspace dependencies
        run: bun install --frozen-lockfile --ignore-scripts --filter @stll/scripts
        env:
          NPM_TOKEN: ""

      - name: Test dev runner
        run: bun test packages/scripts/src/dev-runner.test.ts

  # Rust checks for the Tauri desktop crate. ci-checks only runs
  # `cargo fmt --check` (a parse-only pass that needs no compile);
  # check/clippy/doc must run where the desktop crate actually builds
  # so platform-gated macOS and Windows code is covered.
  #
  # The matrix mirrors the release matrix (macos-14 + windows-latest)
  # rather than Linux: the desktop app ships only those two targets,
  # and clippy analyzes the active `cfg` for its host — so these two
  # runners cover the `#[cfg(target_os = "macos")]` / `"windows"`
  # code that ships, with no need for the Linux webkit2gtk system
  # libraries a Linux clippy run would require. Windows builds the
  # test binaries but does not execute them: hosted Windows currently
  # exits before the Rust test harness starts with a native entrypoint
  # error in the Tauri-linked binary. macOS executes the test suite.
  # Both are standard GitHub-hosted runners, free for public repositories.
  desktop-clippy:
    name: Desktop Rust (${{ matrix.os }})
    needs: ci-plan
    if: >-
      (needs.ci-plan.outputs.trusted == 'true'
       || github.event_name == 'workflow_dispatch')
      && needs.ci-plan.outputs.desktop_rust_checks_required == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos
            runner: macos-14
            target: aarch64-apple-darwin
          - os: windows
            runner: windows-latest
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 35
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
          components: clippy

      # No cargo cache action here: the job is path-filtered to desktop
      # changes, so it runs rarely and a cold compile (well under the
      # timeout) is acceptable. It also keeps the LGPL-3.0 rust-cache
      # action out of the dependency-review-enforced diff.
      - name: Check
        run: cargo check --manifest-path apps/desktop/src-tauri/Cargo.toml --workspace --all-targets --target ${{ matrix.target }} --locked

      - name: Clippy
        run: cargo clippy --manifest-path apps/desktop/src-tauri/Cargo.toml --workspace --all-targets --target ${{ matrix.target }} --locked -- -D warnings

      - name: Test
        if: matrix.os == 'macos'
        run: cargo test --manifest-path apps/desktop/src-tauri/Cargo.toml --workspace --all-targets --target ${{ matrix.target }} --locked

      - name: Build test binaries
        if: matrix.os == 'windows'
        run: cargo test --manifest-path apps/desktop/src-tauri/Cargo.toml --workspace --all-targets --target ${{ matrix.target }} --locked --no-run

      - name: Install cargo-deny
        if: matrix.os == 'macos'
        run: cargo install cargo-deny --version 0.19.0 --locked

      - name: License audit
        if: matrix.os == 'macos'
        run: cargo deny --manifest-path apps/desktop/src-tauri/Cargo.toml check --config apps/desktop/src-tauri/deny.toml --hide-inclusion-graph

      - name: Docs
        run: cargo doc --manifest-path apps/desktop/src-tauri/Cargo.toml --workspace --no-deps --target ${{ matrix.target }} --locked
        env:
          RUSTDOCFLAGS: -D warnings

  # Aggregation job for branch protection. The ruleset requires
  # this check to pass, which ensures untrusted PRs cannot be
  # merged without CI and trusted PRs must pass all checks.
  ci-result:
    name: >-
      ${{
        github.event_name == 'pull_request'
        && github.event.action == 'labeled'
        && github.event.label.name != 'run-ci'
        && format('ci-result-ignored-label-{0}', github.run_id)
        || 'ci-result'
      }}
    if: always()
    needs:
      [
        ci-plan,
        changeset,
        agent-sandbox-docker,
        ci-checks,
        collab-redis,
        code-quality,
        postgres-suites,
        release-typecheck,
        typecheck-baseline,
        web-build,
        web-image-smoke,
        mobile-build,
        landing-build,
        marketing-screenshots,
        migration-upgrade-rehearsal,
        e2e,
        stack-redaction-browsers,
        api-image-deps,
        api-image-smoke,
        legal-atlas-image,
        windows-scripts,
        desktop-clippy,
      ]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Evaluate CI outcome
        env:
          API_IMAGE_DEPS_RESULT: ${{ needs.api-image-deps.result }}
          API_IMAGE_SMOKE_REQUIRED: ${{ needs.ci-plan.outputs.api_image_smoke_required }}
          API_IMAGE_SMOKE_RESULT: ${{ needs.api-image-smoke.result }}
          AGENT_SANDBOX_DOCKER_RESULT: ${{ needs.agent-sandbox-docker.result }}
          CHANGESET_RESULT: ${{ needs.changeset.result }}
          CI_RESULT: ${{ needs.ci-checks.result }}
          COLLAB_REDIS_RESULT: ${{ needs.collab-redis.result }}
          DESKTOP_CLIPPY_RESULT: ${{ needs.desktop-clippy.result }}
          E2E_RESULT: ${{ needs.e2e.result }}
          EVENT: ${{ github.event_name }}
          LANDING_RESULT: ${{ needs.landing-build.result }}
          CODE_QUALITY_RESULT: ${{ needs.code-quality.result }}
          LEGAL_ATLAS_IMAGE_RESULT: ${{ needs.legal-atlas-image.result }}
          MARKETING_SCREENSHOTS_RESULT: ${{ needs.marketing-screenshots.result }}
          MIGRATION_REHEARSAL_RESULT: ${{ needs.migration-upgrade-rehearsal.result }}
          MOBILE_RESULT: ${{ needs.mobile-build.result }}
          TRUSTED: ${{ needs.ci-plan.outputs.trusted }}
          PLAN_RESULT: ${{ needs.ci-plan.result }}
          POSTGRES_SUITES_RESULT: ${{ needs.postgres-suites.result }}
          RELEASE_TYPECHECK_RESULT: ${{ needs.release-typecheck.result }}
          STACK_REDACTION_BROWSERS_RESULT: ${{ needs.stack-redaction-browsers.result }}
          TYPECHECK_BASELINE_RESULT: ${{ needs.typecheck-baseline.result }}
          WEB_RESULT: ${{ needs.web-build.result }}
          WEB_IMAGE_SMOKE_RESULT: ${{ needs.web-image-smoke.result }}
          WEB_IMAGE_SMOKE_REQUIRED: ${{ needs.ci-plan.outputs.web_image_smoke_required }}
          WINDOWS_SCRIPTS_RESULT: ${{ needs.windows-scripts.result }}
        run: |
          # When the CI plan was skipped (draft PR or
          # irrelevant label event), all downstream jobs are also
          # skipped. This is expected and should not block the PR.
          if [[ "$PLAN_RESULT" == "skipped" ]]; then
            echo "CI plan skipped. Passing."
            exit 0
          fi

          # Selected artifact checks must positively succeed. A skipped,
          # cancelled, or missing result cannot certify a release candidate.
          if [[ "$API_IMAGE_SMOKE_REQUIRED" == "true" && "$API_IMAGE_SMOKE_RESULT" != "success" ]] \
            || [[ "$WEB_IMAGE_SMOKE_REQUIRED" == "true" && "$WEB_IMAGE_SMOKE_RESULT" != "success" ]]; then
            echo "::error::Required release image smoke did not succeed."
            exit 1
          fi

          if [[ "$EVENT" == "workflow_dispatch" ]]; then
            if [[ "$CI_RESULT" == "failure" || "$CI_RESULT" == "cancelled" \
                  || "$AGENT_SANDBOX_DOCKER_RESULT" == "failure" || "$AGENT_SANDBOX_DOCKER_RESULT" == "cancelled" \
                  || "$CODE_QUALITY_RESULT" == "failure" || "$CODE_QUALITY_RESULT" == "cancelled" \
                  || "$POSTGRES_SUITES_RESULT" == "failure" || "$POSTGRES_SUITES_RESULT" == "cancelled" \
                  || "$RELEASE_TYPECHECK_RESULT" == "failure" || "$RELEASE_TYPECHECK_RESULT" == "cancelled" \
                  || "$STACK_REDACTION_BROWSERS_RESULT" == "failure" || "$STACK_REDACTION_BROWSERS_RESULT" == "cancelled" \
                  || "$TYPECHECK_BASELINE_RESULT" == "failure" || "$TYPECHECK_BASELINE_RESULT" == "cancelled" \
                  || "$WEB_RESULT" == "failure" || "$WEB_RESULT" == "cancelled" \
                  || "$WEB_IMAGE_SMOKE_RESULT" == "failure" || "$WEB_IMAGE_SMOKE_RESULT" == "cancelled" \
                  || "$MOBILE_RESULT" == "failure" || "$MOBILE_RESULT" == "cancelled" \
                  || "$LANDING_RESULT" == "failure" || "$LANDING_RESULT" == "cancelled" \
                  || "$MARKETING_SCREENSHOTS_RESULT" == "failure" || "$MARKETING_SCREENSHOTS_RESULT" == "cancelled" \
                  || "$MIGRATION_REHEARSAL_RESULT" == "failure" || "$MIGRATION_REHEARSAL_RESULT" == "cancelled" \
                  || "$E2E_RESULT" == "failure" || "$E2E_RESULT" == "cancelled" \
                  || "$API_IMAGE_DEPS_RESULT" == "failure" || "$API_IMAGE_DEPS_RESULT" == "cancelled" \
                  || "$LEGAL_ATLAS_IMAGE_RESULT" == "failure" || "$LEGAL_ATLAS_IMAGE_RESULT" == "cancelled" \
                  || "$WINDOWS_SCRIPTS_RESULT" == "failure" || "$WINDOWS_SCRIPTS_RESULT" == "cancelled" \
                  || "$PLAN_RESULT" == "failure" || "$PLAN_RESULT" == "cancelled" \
                  || "$CHANGESET_RESULT" == "failure" || "$CHANGESET_RESULT" == "cancelled" \
                  || "$COLLAB_REDIS_RESULT" == "failure" || "$COLLAB_REDIS_RESULT" == "cancelled" \
                  || "$DESKTOP_CLIPPY_RESULT" == "failure" || "$DESKTOP_CLIPPY_RESULT" == "cancelled" ]]; then
              echo "::error::CI checks failed."
              exit 1
            fi
            exit 0
          fi

          if [[ "$PLAN_RESULT" == "cancelled" ]]; then
            echo "CI run was superseded by a newer run (cancel-in-progress). Passing."
            exit 0
          fi

          if [[ "$PLAN_RESULT" != "success" ]]; then
            echo "::error::CI planning failed."
            exit 1
          fi

          if [[ "$TRUSTED" != "true" ]]; then
            echo "::error::CI was not run. A maintainer must review the code and add the 'run-ci' label."
            exit 1
          fi

          # "cancelled" means cancel-in-progress replaced this
          # run with a newer one; the newer run is authoritative.
          if [[ "$AGENT_SANDBOX_DOCKER_RESULT" == "cancelled" || "$CI_RESULT" == "cancelled" || "$COLLAB_REDIS_RESULT" == "cancelled" || "$CODE_QUALITY_RESULT" == "cancelled" || "$POSTGRES_SUITES_RESULT" == "cancelled" || "$RELEASE_TYPECHECK_RESULT" == "cancelled" || "$STACK_REDACTION_BROWSERS_RESULT" == "cancelled" || "$TYPECHECK_BASELINE_RESULT" == "cancelled" || "$WEB_RESULT" == "cancelled" || "$WEB_IMAGE_SMOKE_RESULT" == "cancelled" || "$MOBILE_RESULT" == "cancelled" || "$LANDING_RESULT" == "cancelled" || "$MARKETING_SCREENSHOTS_RESULT" == "cancelled" || "$MIGRATION_REHEARSAL_RESULT" == "cancelled" || "$E2E_RESULT" == "cancelled" || "$API_IMAGE_DEPS_RESULT" == "cancelled" || "$LEGAL_ATLAS_IMAGE_RESULT" == "cancelled" || "$WINDOWS_SCRIPTS_RESULT" == "cancelled" || "$CHANGESET_RESULT" == "cancelled" || "$DESKTOP_CLIPPY_RESULT" == "cancelled" ]]; then
            echo "CI run was superseded by a newer run (cancel-in-progress). Passing."
            exit 0
          fi

          if [[ "$AGENT_SANDBOX_DOCKER_RESULT" == "failure" || "$CI_RESULT" == "failure" || "$COLLAB_REDIS_RESULT" == "failure" || "$CODE_QUALITY_RESULT" == "failure" || "$POSTGRES_SUITES_RESULT" == "failure" || "$RELEASE_TYPECHECK_RESULT" == "failure" || "$STACK_REDACTION_BROWSERS_RESULT" == "failure" || "$TYPECHECK_BASELINE_RESULT" == "failure" || "$WEB_RESULT" == "failure" || "$WEB_IMAGE_SMOKE_RESULT" == "failure" || "$MOBILE_RESULT" == "failure" || "$LANDING_RESULT" == "failure" || "$MARKETING_SCREENSHOTS_RESULT" == "failure" || "$MIGRATION_REHEARSAL_RESULT" == "failure" || "$E2E_RESULT" == "failure" || "$API_IMAGE_DEPS_RESULT" == "failure" || "$LEGAL_ATLAS_IMAGE_RESULT" == "failure" || "$WINDOWS_SCRIPTS_RESULT" == "failure" || "$CHANGESET_RESULT" == "failure" || "$DESKTOP_CLIPPY_RESULT" == "failure" ]]; then
            echo "::error::CI checks failed."
            exit 1
          fi
