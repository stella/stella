        if: steps.e2e-stack.outputs.status == 'ready'
        uses: ./.github/actions/setup-playwright

      - name: Run Vite dependency canary
        if: steps.e2e-stack.outputs.status == 'ready'
        env:
          PLAYWRIGHT_JSON_OUTPUT_FILE: ${{ github.workspace }}/.cache/playwright-timings/run-vite-dependency-canary.json
          E2E_EXPECT_DEV_ROUTES: "true"
          PLAYWRIGHT_BLOB_OUTPUT_NAME: report-vite-canary.zip
        run: >-
          bash "$GITHUB_WORKSPACE/.github/actions/setup-playwright/run-in-image.sh" bun --filter @stll/web test:e2e --
          e2e/specs/vite-dependency-canary.spec.ts
          --project chromium

      - name: Test anonymized PDF export
        if: steps.e2e-stack.outputs.status == 'ready'
        env:
          PLAYWRIGHT_JSON_OUTPUT_FILE: ${{ github.workspace }}/.cache/playwright-timings/test-anonymized-pdf-export.json
        run: bash "$GITHUB_WORKSPACE/.github/actions/setup-playwright/run-in-image.sh" bun --filter @stll/web test:e2e:anonymized-export

      # Own output dir: the blob reporter clears its directory
      # per invocation, so sharing it would drop the canary blob, and a collab
      # blob (testDir e2e/collab) breaks the merged specs report. Its failures
      # are uploaded separately with their traces and videos.
      - name: Run lockless collaboration browser suite
        if: steps.e2e-stack.outputs.status == 'ready'
        env:
          PLAYWRIGHT_JSON_OUTPUT_FILE: ${{ github.workspace }}/.cache/playwright-timings/run-lockless-collaboration-browser-suite.json
          E2E_EXPECT_DEV_ROUTES: "true"
          E2E_OUTPUT_DIR: test-results-collab
        run: bash "$GITHUB_WORKSPACE/.github/actions/setup-playwright/run-in-image.sh" bun --filter @stll/web test:e2e:collab -- --project chromium

      - name: Show API errors after a Vite canary failure
        if: failure() && steps.e2e-stack.outputs.status == 'ready'
        run: tail -200 /tmp/api.log

      # These imports load only through cold lazy routes; a mid-test optimizer
      # restart would make the apparent canary result nondeterministic.
      - name: Guard against mid-test Vite re-optimize
        if: always() && steps.e2e-stack.outputs.status == 'ready'
        run: |
          if grep -q "optimized dependencies changed. reloading" /tmp/web.log; then
            echo "::error::Vite re-optimized dependencies mid-session and forced a reload. Add the lazy/runtime dependency named below to optimizeDeps.include in apps/web/vite.config.ts."
            grep -nE "new dependencies optimized|optimized dependencies changed" /tmp/web.log || true
            exit 1
          fi
          echo "No mid-session dep re-optimize detected."

      - name: Stop web dev server
        if: always() && steps.e2e-stack.outputs.status == 'ready'
        run: |
          if [[ -f /tmp/web.pid ]]; then
            kill "$(cat /tmp/web.pid)" || true
            rm -f /tmp/web.pid
          fi
          if [[ -f /tmp/collab.pid ]]; then
            kill "$(cat /tmp/collab.pid)" || true
            rm -f /tmp/collab.pid
          fi

