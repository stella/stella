        env:
          STELLA_COLLAB_TEST_REDIS_CONTAINER_ID: ${{ job.services.redis.id }}
          STELLA_COLLAB_TEST_REDIS_URL: redis://127.0.0.1:6380
        run: bun --filter @stll/collab test src/server.test.ts

      - name: Cancel failed merge-group run
        if: failure() && github.event_name == 'merge_group'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          retries: 0
          script: |
            let diagnostic;
