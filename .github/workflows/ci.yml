          log-file: "${{ runner.temp }}/bun-install/scan-engine-wasm.log"
        env:
          NPM_TOKEN: ""

      - name: Upload failed Bun install logs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bun-install-${{ github.job }}
          path: ${{ runner.temp }}/bun-install/*.log
          retention-days: 7
          if-no-files-found: ignore

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: 1.99.0
