                .filter((step) => step.conclusion === "failure")
                .map((step) => `${job.name} / ${step.number}: ${step.name} (${job.html_url})`));
              diagnostic = `${context.job}: cancelling failed merge group; failed steps: ${failures.length ? failures.join("; ") : "not yet available from the jobs API"}`;
            } catch {
              diagnostic = `${context.job}: cancelling failed merge group; failed-step lookup unavailable`;
            } finally {
              clearTimeout(evidenceTimer);
            }
            core.error(diagnostic);
            try {
              core.summary.addRaw(`${diagnostic}\n`);
              await core.summary.write();
            } catch {
              core.error(`${context.job}: cancellation step summary could not be written`);
            }
            await github.rest.actions.cancelWorkflowRun({
              ...context.repo,
              run_id: context.runId,
            });

  e2e-production-shard:
    needs: [ci-plan, web-build, heavy-web-build]
    # Admitted to thin merge groups like route-smoke (see there).
    if: >-
      needs.ci-plan.outputs.run_required != 'false'
      && (
      github.event_name != 'pull_request' && (
      (needs.ci-plan.outputs.queue_depth != 'thin' || (github.event_name == 'merge_group' && vars.QUEUE_BROWSER_SUITES != 'off'))
      && (always()
      && (github.event_name != 'merge_group' || !cancelled())
      && (needs.ci-plan.outputs.trusted == 'true'
          || github.event_name == 'workflow_dispatch')
      && needs.ci-plan.outputs.e2e_production_required == 'true'
      && (needs.web-build.result == 'success' || needs.heavy-web-build.result == 'success')
      )
      )
      )
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: read
      actions: write
    strategy:
      fail-fast: false
      matrix:
        # The route network baseline runs alone against its stack, so it
        # gets a leg of its own instead of lengthening a Playwright shard.
        shard: [1, 2, network-baseline]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
