        if: ${{ !cancelled() && steps.install.outcome == 'success' && (needs.ci-plan.outputs.package_checks_required == 'true') }}
        # The CLI and shared chat-policy projections must match the live MCP
        # registry: regenerate all of them and fail on any diff so a registry
        # change cannot silently ship stale CLI, web approval, or skill behavior.
        # Regenerate: `bun run codegen` in packages/cli.
        run: |
