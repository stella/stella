          bun scripts/ci-generated-sources.ts prepare
          # Regeneration guards intentionally modify inputs and report their diff.
          # Validate the artifact first, then use ordinary generation in this leg.
          unset CI_GENERATED_SOURCES_MANIFEST
          echo 'CI_GENERATED_SOURCES_MANIFEST=' >> "$GITHUB_ENV"
          (cd packages/cli && bun run codegen)
          (cd packages/cli && bun run codegen:runtime)
          git diff --exit-code -- \
            packages/cli/src/generated/api-contract.ts \
            packages/cli/src/generated/cli-version.ts \
            packages/cli/src/generated/document-version-upload-transport.ts \
            packages/cli/src/generated/mcp-contract.ts \
            packages/cli/src/generated/registry-snapshot.json \
            packages/cli/src/generated/resource-tree.ts \
            packages/cli/src/generated/resources-snapshot.json \
            packages/cli/skills \
            chatgpt-app-submission.json \
            packages/api-contract/src/mcp-chat-tool-policy.gen.ts
          bun scripts/check-cli-runtime-generation.ts

      - name: MCP App bundle and shared assets guard
        if: ${{ !cancelled() && steps.install.outcome == 'success' && (needs.ci-plan.outputs.package_checks_required == 'true') }}
        # The API serves the committed single-file bundle, not the TypeScript
        # source. Regenerate it and fail on any diff so source tests and the
        # production resource cannot silently exercise different app code.
        run: |
          (cd apps/api && bun run build:mcp-apps)
          git diff --exit-code -- "apps/api/src/mcp/apps/*/generated/app.html.txt" "apps/api/src/mcp/apps/shared/generated/*"

      - name: Visual sandbox document tests
        if: ${{ !cancelled() && steps.install.outcome == 'success' && (needs.ci-plan.outputs.package_checks_required == 'true') }}
        run: |
          (cd apps/api && bun run build:visual-sandbox)
          git diff --exit-code -- apps/api/src/handlers/visual-sandbox/generated/runtime.js.txt

      - name: Capability catalog drift guard
        if: ${{ !cancelled() && steps.install.outcome == 'success' && (needs.ci-plan.outputs.package_checks_required == 'true') }}
        # The committed capability catalog (every `tool`/`covered` safe handler,
        # projected to id + input schema + permissions + scope + access +
        # destructive) must match the live handler graph. `--check` regenerates
        # it in-memory and byte-compares against the committed JSON, so a handler
        # or mapping-table change cannot silently ship a stale catalog.
        # Regenerate: `bun --env-file=apps/api/.env
        # apps/api/scripts/export-capability-catalog.ts`.
