      && ((needs.ci-plan.outputs.trusted == 'true'
       || github.event_name == 'workflow_dispatch')
      && needs.ci-plan.outputs.api_image_smoke_required == 'true'
      )
      )
      )
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.ci-plan.outputs.api_image_platforms) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 8
    permissions:
      contents: read
      actions: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.heavy_only == true && inputs.sha || '' }}
          submodules: true

      - name: Checkout workflow tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          path: .workflow-tooling
          persist-credentials: false
          sparse-checkout: |
            scripts/pull-base-images.sh
            scripts/retry.sh
          sparse-checkout-cone-mode: false

      - name: Pull API base images
        run: |
          bash .workflow-tooling/scripts/pull-base-images.sh apps/api/Dockerfile
          rm -rf .workflow-tooling

      - name: Build final API release image
        run: |
          set -euo pipefail
          docker build --progress=plain --file apps/api/Dockerfile \
            --build-arg "STELLA_VERSION=$(tr -d '[:space:]' < VERSION)" \
            --build-arg "STELLA_COMMIT_SHA=$(git rev-parse HEAD)" \
            --tag stella-api-release:ci . 2>&1 | tee "$RUNNER_TEMP/api-image-build.log"

      - name: Rehearse migrations and boot packaged entrypoints
        run: |
          set -euo pipefail
          bash scripts/smoke-api-image.sh stella-api-release:ci 2>&1 | tee "$RUNNER_TEMP/api-image-smoke.log"

      - name: Annotate image failure
        if: failure()
        env:
          PLATFORM: ${{ matrix.platform }}
        run: |
          # Lift the failing lines out of the logs above into annotations.
          # Values are bounded and escaped so a log line cannot end the
          # workflow command or start another one.
          escape() {
            local value=${1:0:500}
            value=${value//'%'/%25}
            value=${value//$'\r'/%0D}
            value=${value//$'\n'/%0A}
            printf '%s' "$value"
          }
          annotate() {
            printf '::error title=%s::%s\n' "$(escape "$1 ($PLATFORM)" | sed 's/:/%3A/g; s/,/%2C/g')" "$(escape "$2")"
          }
          build_log="$RUNNER_TEMP/api-image-build.log"
          smoke_log="$RUNNER_TEMP/api-image-smoke.log"
          if [[ -f "$smoke_log" ]]; then
            failures=$(grep -E '^FAIL' "$smoke_log" | head -n 5 || true)
            if [[ -n "$failures" ]]; then
              while IFS= read -r line; do
                annotate "API image smoke" "$line"
              done <<< "$failures"
            else
              last_pass=$(grep -E '^PASS' "$smoke_log" | tail -n 1 || true)
              annotate "API image smoke" "Failed after: ${last_pass:-no check passed}"
            fi
          elif [[ -f "$build_log" ]]; then
            # BuildKit prefixes each line with its step number; keep the
            # output of the step that failed. Bun prints an uncaught error's
            # headline under a caret line; without one, fall back to error
            # words, then to the step's last line.
            step=$(grep -oE '^#[0-9]+ ERROR' "$build_log" | head -n 1 | grep -oE '[0-9]+' || true)
            if [[ -n "$step" ]]; then
              output=$(grep -E "^#$step [0-9.]+ " "$build_log" | sed -E 's/^#[0-9]+ [0-9.]+ //' || true)
              lines=$(awk 'prev ~ /^[[:space:]]*\^[[:space:]]*$/ || /FAIL|[Ee]rror|Panic/ { print } { prev = $0 }' <<< "$output" | tail -n 5)
              if [[ -z "$lines" ]]; then
                lines=$(grep -vE '^[[:space:]]*$' <<< "$output" | tail -n 1 || true)
              fi
              lines+=${lines:+$'\n'}$(grep -E "^#$step ERROR" "$build_log" | head -n 1 | sed -E 's/^#[0-9]+ //')
            else
              lines=$(grep -E '^ERROR' "$build_log" | tail -n 1 || true)
            fi
            while IFS= read -r line; do
              [[ -z "$line" ]] || annotate "API image build" "$line"
            done <<< "${lines:-docker build failed}"
          fi

      - name: Cancel failed merge-group run
        if: failure() && github.event_name == 'merge_group'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          retries: 0
          script: |
            let diagnostic;
            let evidenceTimer;
            try {
              const jobs = await Promise.race([
                github.paginate(
                  "GET /repos/{owner}/{repo}/actions/runs/{run_id}/attempts/{attempt_number}/jobs",
                  {
                    ...context.repo,
                    run_id: context.runId,
                    attempt_number: Number(process.env.GITHUB_RUN_ATTEMPT),
                    per_page: 100,
                    request: { timeout: 10000 },
                  },
                ),
                new Promise((_, reject) => {
                  evidenceTimer = setTimeout(() => reject(new Error("Failed-step lookup timed out")), 10000);
                }),
              ]);
              const failures = jobs.flatMap((job) => (job.steps || [])
                .filter((step) => step.conclusion === "failure")
                .map((step) => `${job.name} / ${step.number}: ${step.name} (${job.html_url})`));
              diagnostic = `${context.job}: cancelling failed merge group; failed steps: ${failures.length ? failures.join("; ") : "not yet available from the jobs API"}`;
            } catch {
              diagnostic = `${context.job}: cancelling failed merge group; failed-step lookup unavailable`;
            } finally {
              clearTimeout(evidenceTimer);
            }
            core.error(diagnostic);
            try {
              core.summary.addRaw(`${diagnostic}\n`);
              await core.summary.write();
            } catch {
              core.error(`${context.job}: cancellation step summary could not be written`);
            }
            await github.rest.actions.cancelWorkflowRun({
              ...context.repo,
              run_id: context.runId,
            });

