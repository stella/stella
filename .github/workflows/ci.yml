  e2e-vite-canary:
    needs: ci-plan
    if: >-
      needs.ci-plan.outputs.run_required != 'false'
      && (
      github.event_name != 'pull_request' && (
      needs.ci-plan.outputs.queue_depth != 'thin'
      && ((needs.ci-plan.outputs.trusted == 'true'
       || github.event_name == 'workflow_dispatch')
      && needs.ci-plan.outputs.e2e_core_required == 'true'
      && needs.ci-plan.outputs.suite_depth == 'full'
      )
      )
      )
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: read
      actions: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.heavy_only == true && inputs.sha || '' }}

      - name: Setup Bun
        uses: stella/.github/actions/setup-bun-cached@167fb396c6c0f4e07296ad2cd72e6ef15367c776
        with:
          save: ${{ github.ref == 'refs/heads/main' }}

      - name: Install dependencies
        run: bash scripts/retry.sh bun ci --ignore-scripts
        env:
          NPM_TOKEN: ""

      - name: Prepare environment
        run: |
          cd ./apps/api
          cp .env.example .env
          cd ../web
          cp .env.example .env

      - name: Start docker stack and API server
        id: e2e-stack
        # Secrets stay scoped to the action's credential check and login
        # steps; application code runs only after the runner has logged
        # out again.
        uses: ./.github/actions/setup-e2e-stack
        env:
          STELLA_COLLAB_SERVICE_TOKEN: local-collab-service-token-at-least-32-chars
        with:
          dockerhub-username: ${{ secrets.DOCKERHUB_USERNAME }}
          dockerhub-token: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Start web dev server
        if: steps.e2e-stack.outputs.status == 'ready'
        run: |
          NODE_ENV=development \
          STELLA_LOCAL_DEV=1 \
          STELLA_API_URL=http://localhost:3001 \
          STELLA_COLLAB_MODE=single-process \
          STELLA_COLLAB_PORT=3002 \
          STELLA_COLLAB_SERVICE_TOKEN=local-collab-service-token-at-least-32-chars \
            nohup bun apps/collab/src/index.ts > /tmp/collab.log 2>&1 &
          echo $! > /tmp/collab.pid
          cd apps/web
          VITE_FEATURE_FOLIO_COLLAB=true \
          VITE_COLLAB_URL=ws://localhost:3002 \
            nohup bun --bun vite --port 3000 > /tmp/web.log 2>&1 &
          echo $! > /tmp/web.pid

      - name: Wait for web dev server
        if: steps.e2e-stack.outputs.status == 'ready'
        run: |
          for i in {1..60}; do
            if curl --connect-timeout 2 --max-time 5 -sf http://localhost:3000 > /dev/null 2>&1; then
              echo "Web up after ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "::error::Web never came up"
          tail -200 /tmp/web.log || true
          exit 1

      - name: Wait for collaboration server
        if: steps.e2e-stack.outputs.status == 'ready'
        run: |
          for i in {1..60}; do
            if curl --connect-timeout 2 --max-time 5 -sf http://localhost:3002/readyz > /dev/null 2>&1; then
              echo "Collaboration server up after ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "::error::Collaboration server never came up"
          tail -200 /tmp/collab.log || true
          exit 1

