      needs.ci-plan.outputs.run_required != 'false'
      && (
      github.event_name != 'pull_request' && (
      needs.ci-plan.outputs.queue_depth != 'thin'
      && (needs.ci-plan.outputs.trusted == 'true'
      && needs.ci-plan.outputs.heavy_web_build_required == 'true'
      )
      )
      )
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.heavy_only == true && inputs.sha || '' }}
      - name: Setup Bun
        uses: stella/.github/actions/setup-bun-cached@167fb396c6c0f4e07296ad2cd72e6ef15367c776
        with:
          save: ${{ github.ref == 'refs/heads/main' }}
