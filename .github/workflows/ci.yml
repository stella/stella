        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/bin/wasm-bindgen
            ~/.cargo/bin/wasm-bindgen-test-runner
            packages/scan-engine/target
          key: scan-engine-wasm-${{ runner.os }}-${{ hashFiles('packages/scan-engine/Cargo.lock', 'packages/scan-engine/rust-toolchain.toml') }}

      - name: Fetch Rust dependencies and wasm-bindgen
        timeout-minutes: 15
        run: bash scripts/retry.sh bash packages/scan-engine/scripts/wasm-toolchain.sh

      - name: Check generated WebAssembly from a fresh Cargo cache
        id: wasm-check
        env:
          SCAN_ENGINE_WASM_OUT_DIR: ${{ runner.temp }}/scan-engine-wasm
        run: bash packages/scan-engine/scripts/test-wasm-offline.sh

      - name: Record fresh WebAssembly checksums
        if: failure() && steps.wasm-check.outcome == 'failure'
        run: |
          if [[ -d "$RUNNER_TEMP/scan-engine-wasm" ]]; then
            (cd "$RUNNER_TEMP/scan-engine-wasm" && sha256sum ./*) > "$RUNNER_TEMP/scan-engine-wasm.sha256"
            rustc -vV > "$RUNNER_TEMP/scan-engine-wasm.toolchain"
          fi

      - name: Upload fresh WebAssembly on mismatch
        if: failure() && steps.wasm-check.outcome == 'failure'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: scan-engine-wasm
          path: |
            ${{ runner.temp }}/scan-engine-wasm/
            ${{ runner.temp }}/scan-engine-wasm.sha256
            ${{ runner.temp }}/scan-engine-wasm.toolchain
          retention-days: 7
          if-no-files-found: warn

      - name: Save Rust build cache
        if: success()
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/bin/wasm-bindgen
            ~/.cargo/bin/wasm-bindgen-test-runner
            packages/scan-engine/target
          key: scan-engine-wasm-${{ runner.os }}-${{ hashFiles('packages/scan-engine/Cargo.lock', 'packages/scan-engine/rust-toolchain.toml') }}

      - *merge_group_cancel

  # Rust checks for the Tauri desktop crate. ci-checks only runs
  # `cargo fmt --check` (a parse-only pass that needs no compile);
  # check/clippy/doc must run where the desktop crate actually builds
  # so platform-gated macOS and Windows code is covered.
  #
  # The matrix mirrors the release matrix (macos-14 + windows-latest)
  # rather than Linux: the desktop app ships only those two targets,
  # and clippy analyzes the active `cfg` for its host — so these two
  # runners cover the `#[cfg(target_os = "macos")]` / `"windows"`
  # code that ships, with no need for the Linux webkit2gtk system
  # libraries a Linux clippy run would require. Windows builds the
  # test binaries but does not execute them: hosted Windows currently
  # exits before the Rust test harness starts with a native entrypoint
  # error in the Tauri-linked binary. The signer crates link no Tauri,
  # so Windows runs theirs. macOS executes the test suite.
  # Both are standard GitHub-hosted runners, free for public repositories.
  desktop-rust-tests:
    name: Desktop Rust Tests (${{ matrix.os }})
    needs: ci-plan
    if: >-
      inputs.pr_depth_only != true
      && needs.ci-plan.outputs.heavy_proof == 'true'
      && (needs.ci-plan.outputs.trusted == 'true' || github.event_name == 'workflow_dispatch')
      && needs.ci-plan.outputs.desktop_rust_checks_required == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos
            runner: macos-14
            target: aarch64-apple-darwin
          - os: windows
            runner: windows-latest
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 35
    permissions:
      contents: read
      actions: write
    env:
      # Names the signer test certificates, unique per run so a rerun on a
      # reused machine never meets a previous run's.
      STELLA_SIGNING_FIXTURE_PREFIX: stella-ci-${{ github.run_id }}-${{ github.run_attempt }}

    steps:
      - &desktop_rust_checkout
        name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ (inputs.heavy_only == true || inputs.pr_depth_only == true) && inputs.sha || '' }}

      - &desktop_rust_toolchain
        name: Setup Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: 1.99.0
          targets: ${{ matrix.target }}
          components: clippy

      # The locked crates download once, retried as a unit; every later
      # cargo command runs --frozen and never reaches the registry itself.
      - &desktop_rust_fetch
        name: Fetch Rust dependencies
        timeout-minutes: 10
        run: bash scripts/retry.sh cargo fetch --manifest-path apps/desktop/src-tauri/Cargo.toml --locked --target ${{ matrix.target }}

      # No cargo cache action here: the job is path-filtered to desktop
      # changes, so it runs rarely and a cold compile (well under the
      # timeout) is acceptable. It also keeps the LGPL-3.0 rust-cache
      # action out of the dependency-review-enforced diff.
      - name: Check
        shell: pwsh
        run: cargo check --manifest-path apps/desktop/src-tauri/Cargo.toml --workspace --all-targets --target ${{ matrix.target }} --frozen

      - name: Test
        if: matrix.os == 'macos'
        run: cargo test --manifest-path apps/desktop/src-tauri/Cargo.toml --workspace --all-targets --features allocation-tests --target ${{ matrix.target }} --frozen

      - name: Build test binaries
        if: matrix.os == 'windows'
        shell: pwsh
        run: cargo test --manifest-path apps/desktop/src-tauri/Cargo.toml --workspace --all-targets --features allocation-tests --target ${{ matrix.target }} --frozen --no-run

      # The signer crates link no Tauri, so their tests do run here: against
      # throwaway certificates in the runner's own current-user store, one
      # per case the listing must keep or leave out.
      - name: Install signing test certificates
        if: matrix.os == 'windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $prefix = $env:STELLA_SIGNING_FIXTURE_PREFIX
          $store = 'Cert:\CurrentUser\My'
          $documents = '2.5.29.37={text}1.3.6.1.5.5.7.3.4'
          $loginOnly = '2.5.29.37={text}1.3.6.1.5.5.7.3.2'
          $common = @{
            CertStoreLocation = $store
            Type = 'Custom'
            Provider = 'Microsoft Software Key Storage Provider'
            KeyExportPolicy = 'NonExportable'
            NotAfter = (Get-Date).AddDays(2)
          }
          $rsa = @{ KeyAlgorithm = 'RSA'; KeyLength = 2048 }
          New-SelfSignedCertificate @common @rsa -Subject "CN=$prefix-rsa" -KeyUsage DigitalSignature, NonRepudiation -TextExtension @($documents) | Out-Null
          New-SelfSignedCertificate @common -Subject "CN=$prefix-ec" -KeyAlgorithm ECDSA_nistP256 -CurveExport CurveName -KeyUsage DigitalSignature -TextExtension @($documents) | Out-Null
          New-SelfSignedCertificate @common @rsa -Subject "CN=$prefix-client-auth" -KeyUsage DigitalSignature -TextExtension @($loginOnly) | Out-Null
          $expired = $common.Clone()
          $expired.NotBefore = (Get-Date).AddDays(-10)
          $expired.NotAfter = (Get-Date).AddDays(-1)
          New-SelfSignedCertificate @expired @rsa -Subject "CN=$prefix-expired" -KeyUsage DigitalSignature -TextExtension @($documents) | Out-Null
          # Keep only the public half of this one: a certificate whose key is gone.
          $keyed = New-SelfSignedCertificate @common @rsa -Subject "CN=$prefix-no-key" -KeyUsage DigitalSignature -TextExtension @($documents)
          $public = Join-Path $env:RUNNER_TEMP "$prefix-no-key.cer"
          Export-Certificate -Cert $keyed -FilePath $public | Out-Null
          Remove-Item -Path $keyed.PSPath -DeleteKey
          Import-Certificate -FilePath $public -CertStoreLocation $store | Out-Null

      - name: Test signer against the certificate store
        if: matrix.os == 'windows'
        shell: pwsh
        run: cargo test --manifest-path apps/desktop/src-tauri/Cargo.toml -p stella-desktop-windows-signing -p stella-desktop-signing-core --target ${{ matrix.target }} --frozen -- --include-ignored

      - name: Remove signing test certificates
        if: always() && matrix.os == 'windows'
        shell: pwsh
        run: |
          Get-ChildItem Cert:\CurrentUser\My |
            Where-Object Subject -like "CN=$env:STELLA_SIGNING_FIXTURE_PREFIX-*" |
            ForEach-Object {
              if ($_.HasPrivateKey) { Remove-Item -Path $_.PSPath -DeleteKey } else { Remove-Item -Path $_.PSPath }
            }

      - name: Setup Bun for the desktop transport smoke
        if: matrix.os == 'macos'
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: "package.json"

      - name: Install desktop transport smoke dependencies
        if: matrix.os == 'macos'
        uses: $/.github/actions/ci-install
        with:
          cache-write: save
          flags: '["--frozen-lockfile","--ignore-scripts","--filter","@stll/api"]'
        env:
          NPM_TOKEN: ""

      - name: Smoke native desktop transport against the local API contract
        if: matrix.os == 'macos'
        shell: bash
        run: |
          url_file="$RUNNER_TEMP/desktop-smoke-url"
          bun apps/api/scripts/desktop-registry-transport-smoke-server.ts "$url_file" &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for _ in {1..100}; do
            test -s "$url_file" && break
            kill -0 "$server_pid" 2>/dev/null || { wait "$server_pid"; exit 1; }
            sleep 0.1
          done
          test -s "$url_file"
          STELLA_DESKTOP_SMOKE_API_URL="$(cat "$url_file")" cargo test --manifest-path apps/desktop/src-tauri/Cargo.toml --lib --target ${{ matrix.target }} --frozen registry::tests::native_desktop_transport_reaches_api_authentication -- --ignored --exact
          wait "$server_pid"

      - name: Install cargo-deny
        timeout-minutes: 10
        if: matrix.os == 'macos'
        uses: ./.github/actions/cargo-deny

      # Licenses, bans and sources read only the resolved dependency graph.
      # The graph's crates for every target are fetched first with bounded
      # retries; the check then runs once, offline. Advisories need the
      # published advisory database, so they run on the Dependency Audit
      # schedule instead.
      - name: Fetch license audit inputs
        if: matrix.os == 'macos'
        timeout-minutes: 10
        env:
          CARGO_NET_RETRY: "5"
        run: bash .github/actions/cargo-deny/fetch.sh apps/desktop/src-tauri/Cargo.toml

      - name: License audit
        if: matrix.os == 'macos'
        run: cargo deny --offline --manifest-path apps/desktop/src-tauri/Cargo.toml check --config apps/desktop/src-tauri/deny.toml --hide-inclusion-graph bans licenses sources

      - name: Docs
        shell: pwsh
        run: cargo doc --manifest-path apps/desktop/src-tauri/Cargo.toml --workspace --no-deps --target ${{ matrix.target }} --frozen
        env:
          RUSTDOCFLAGS: -D warnings

      - *merge_group_cancel

  desktop-rust-lint:
    name: Desktop Rust Lint (${{ matrix.os }})
    needs: [ci-plan, pr-heavy-gate]
    if: >-
      !cancelled()
      && needs.ci-plan.result == 'success'
      && (github.event_name != 'pull_request' || needs.ci-plan.outputs.pr_heavy_gate_required != 'true' || needs.pr-heavy-gate.result == 'success')
      && inputs.pr_depth_only != true
      && inputs.heavy_only != true
      && (github.event_name == 'merge_group' || needs.ci-plan.outputs.run_required != 'false')
      && (needs.ci-plan.outputs.trusted == 'true' || github.event_name == 'workflow_dispatch')
      && needs.ci-plan.outputs.desktop_rust_checks_required == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos
            runner: macos-14
            target: aarch64-apple-darwin
          - os: windows
            runner: windows-latest
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 35
    permissions:
      contents: read
      actions: write
    steps:
      - *desktop_rust_checkout
      - *desktop_rust_toolchain
      - *desktop_rust_fetch
      - name: Clippy
        shell: pwsh
        run: cargo clippy --manifest-path apps/desktop/src-tauri/Cargo.toml --workspace --all-targets --target ${{ matrix.target }} --frozen -- -D warnings
      - *merge_group_cancel

  dependency-audit:
    name: bun audit (high/critical)
    timeout-minutes: 20
    needs: ci-plan
    if: >-
      !cancelled()
      && needs.ci-plan.result == 'success'
      && inputs.heavy_only != true
      && inputs.pr_depth_only != true
      && (github.event_name == 'pull_request' || github.event_name == 'merge_group')
      && needs.ci-plan.outputs.run_required != 'false'
      && needs.ci-plan.outputs.dependency_changes_required == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Bun
        uses: stella/.github/actions/setup-bun-cached@a6a6cd30646c18321ef71e344bf0af6b8d3634b8
        with:
          save: ${{ github.ref == 'refs/heads/main' }}
          bun-version-file: "package.json"

      - name: Install dependencies
        timeout-minutes: 2
        run: bash scripts/retry.sh bun ci --frozen-lockfile --ignore-scripts --filter stella
        env:
          NPM_TOKEN: ""

      - name: Audit changed dependency resolutions
        env:
          # A merge group audits everything it merges, not only its own entry.
          BASE_SHA: ${{ needs.ci-plan.outputs.target_base_sha }}
        run: bun scripts/dependency-audit.ts --check-diff "$BASE_SHA"

      # A lockfile-only rewrite resolves from bun.lock alone, and an unchanged
      # lockfile proves there is nothing to deduplicate.
      - name: Check lockfile deduplication
        run: |
          bun --no-env-file dedupe --lockfile-only --ignore-scripts
          git diff --exit-code -- bun.lock

      - name: Check trusted lifecycle dependencies
        run: bun --no-env-file scripts/check-trusted-dependencies.ts

  dependency-review:
    needs: ci-plan
    if: >-
      !cancelled()
      && needs.ci-plan.result == 'success'
      && inputs.heavy_only != true
      && inputs.pr_depth_only != true
      && (github.event_name == 'pull_request' || github.event_name == 'merge_group')
      && needs.ci-plan.outputs.run_required != 'false'
      && needs.ci-plan.outputs.dependency_changes_required == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read

    steps:
      # Keep the required check present even for drafts and source-only changes.
      # No checkout or PR code executes while deciding whether review is needed.
      - name: Derive dependency changes
        id: changes
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        env:
          # A merge group reviews everything it merges: compare against the
          # target branch, not the previous queue entry.
          TARGET_BASE_SHA: ${{ needs.ci-plan.outputs.target_base_sha }}
        with:
          retries: 0
          script: |
            const { owner, repo } = context.repo;
            const event = context.payload;
            const base = process.env.TARGET_BASE_SHA;
            const head = event.pull_request?.head.sha || event.merge_group?.head_sha;
            if (!base || !head) throw new Error("Missing dependency comparison refs");
            const { data } = await github.rest.repos.compareCommitsWithBasehead({
              owner, repo, basehead: `${base}...${head}`, per_page: 1,
            });
            const files = data.files;
            if (!files) throw new Error("Missing dependency comparison files");
            // The compare API caps files at 300. Never interpret a capped list
            // as evidence that dependencies did not change.
            const manifest = /(?:^|\/)(?:package\.json|bun\.lock|Cargo\.(?:toml|lock)|pyproject\.toml|uv\.lock|requirements[^/]*\.(?:txt|in))$/u;
            const paths = file => [file.filename, file.previous_filename].filter(Boolean);
            const required = files.length >= 300 || files.some(file => paths(file).some(path => manifest.test(path)));
            core.setOutput("required", String(required));
            if (required) return;
            const actionInput = /(?:^\.github\/workflows\/[^/]+\.ya?ml$|(?:^|\/)action\.ya?ml$)/u;
            const changed = files.filter(file => paths(file).some(path => actionInput.test(path)));
            core.setOutput("workflows", String(changed.length > 0));
            if (changed.length === 0) {
              await core.summary.addRaw("No dependency manifests, lockfiles or workflow actions changed. Review is a no-op.").write();
              return;
            }
            const content = async (path, ref) => {
              const { data: blob } = await github.rest.repos.getContent({ owner, repo, path, ref });
              if (Array.isArray(blob) || blob.type !== "file" || blob.encoding !== "base64") {
                throw new Error("Cannot read dependency review input");
              }
              return Buffer.from(blob.content, "base64").toString("utf8");
            };
            const beforeRef = data.merge_base_commit.sha;
            const snapshots = [];
            for (const file of changed) {
              const beforePath = file.previous_filename || file.filename;
              const before = file.status === "added" || !actionInput.test(beforePath)
                ? "" : await content(beforePath, beforeRef);
              const after = file.status === "removed" || !actionInput.test(file.filename)
                ? "" : await content(file.filename, head);
              snapshots.push({ before, after });
            }
            const fs = require("node:fs");
            const path = require("node:path");
            const directory = fs.mkdtempSync(path.join(process.env.RUNNER_TEMP, "dependency-review-"));
            const input = path.join(directory, "workflows.json");
            const manifestPath = path.join(directory, "package.json");
            fs.writeFileSync(input, JSON.stringify(snapshots));
            fs.writeFileSync(manifestPath, await content("package.json", beforeRef));
            core.setOutput("input", input);
            core.setOutput("manifest", manifestPath);

      - name: Setup workflow YAML parser
        if: steps.changes.outputs.workflows == 'true'
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: ${{ steps.changes.outputs.manifest }}
          # Parses YAML only; nothing is installed, so nothing is cached.
          no-cache: true

      - name: Compare workflow action dependencies
        id: actions
        if: steps.changes.outputs.workflows == 'true'
        env:
          WORKFLOW_INPUT: ${{ steps.changes.outputs.input }}
        run: |
          bun --no-env-file - <<'JS'
          const references = source => {
            if (source === "") return [];
            const definition = Bun.YAML.parse(source);
            const uses = [];
            for (const job of Object.values(definition.jobs ?? {})) {
              if (job.uses !== undefined) uses.push(job.uses);
              for (const step of job.steps ?? []) {
                if (step.uses !== undefined) uses.push(step.uses);
              }
            }
            for (const step of definition.runs?.steps ?? []) {
              if (step.uses !== undefined) uses.push(step.uses);
            }
            if (uses.some(value => typeof value !== "string")) {
              throw new Error("Invalid workflow action reference");
            }
            return [...new Set(uses)].sort();
          };
          const snapshots = await Bun.file(process.env.WORKFLOW_INPUT).json();
          const required = snapshots.some(({ before, after }) =>
            JSON.stringify(references(before)) !== JSON.stringify(references(after)));
          const { appendFileSync } = await import("node:fs");
          appendFileSync(process.env.GITHUB_OUTPUT, `required=${required}\n`);
          appendFileSync(process.env.GITHUB_STEP_SUMMARY, required
            ? "Workflow action dependencies changed; running review.\n"
            : "Workflow action dependencies unchanged; review is a no-op.\n");
          JS

      - name: Checkout
        if: steps.changes.outputs.required == 'true' || steps.actions.outputs.required == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Dependency Review
        if: steps.changes.outputs.required == 'true' || steps.actions.outputs.required == 'true'
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          # The action derives both refs from a pull_request payload on its own;
          # a merge group carries them under its own event key.
          base-ref: ${{ github.event_name == 'merge_group' && needs.ci-plan.outputs.target_base_sha || '' }}
          head-ref: ${{ github.event.merge_group.head_sha || '' }}
          fail-on-severity: high
          allow-licenses: >-
            MIT,
            Apache-2.0,
            BSD-2-Clause,
            BSD-3-Clause,
            ISC,
            0BSD,
            BlueOak-1.0.0,
            Unlicense,
            CC0-1.0,
            CC-BY-4.0,
            MIT-0,
            BSL-1.0,
            MPL-2.0,
            Python-2.0,
            Zlib,
            Unicode-3.0,
            OFL-1.1
          # GitHub's dependency snapshot currently reports some Bun
          # workspace/catalog entries and Bun-locked npm packages as license
          # "Null" in PR summaries even though package manifests declare
          # allowed licenses. It also fails to parse some Cargo crates' dual
          # SPDX license expressions (e.g. brotli-decompressor "BSD-3-Clause OR
          # MIT", filetime "MIT OR Apache-2.0", mac-notification-sys
          # "MIT OR Apache-2.0"), reporting them as an
          # unrecognized LicenseRef even though both halves are allowed above.
          # webpki-root-certs is genuinely CDLA-Permissive-2.0: the permissive
          # data license Mozilla uses for its CA certificate bundle.
          # @silurus/ooxml ships an Apache-2.0 LICENSE in its published package,
          # but its package manifest omits the SPDX license field.
          # Swatinem/rust-cache is a standalone CI action executed on GitHub's
          # runner; stella does not link, bundle, modify, or distribute it in
          # product artifacts. Workflow uses must remain pinned to immutable
          # commit SHAs and receive normal dependency-update review.
          # Keep these exceptions package-scoped; do not add namespace/group
          # exceptions.
          allow-dependencies-licenses: >-
            pkg:githubactions/Swatinem/rust-cache,
            pkg:npm/@ai-sdk/provider,
            pkg:npm/@ai-sdk/provider-utils,
            pkg:npm/@aws-sdk/client-sts,
            pkg:npm/@fontsource-variable/source-serif-4,
            pkg:npm/@hocuspocus/provider,
            pkg:npm/@hocuspocus/server,
            pkg:npm/@stll/ai-catalog,
            pkg:npm/@stll/anonymize-chat,
            pkg:npm/@stll/anonymize-wasm,
            pkg:npm/@stll/conditions,
            pkg:npm/@stll/country-codes,
            pkg:npm/@stll/docx-core,
            pkg:npm/@stll/errors,
            pkg:npm/@stll/ssr-kit,
            pkg:npm/@stll/ssr-testkit,
            pkg:npm/@stll/start-runtime,
            pkg:npm/@stll/time,
            pkg:npm/@t3-oss/env-core,
            pkg:npm/@ai-sdk/azure,
            pkg:npm/@ai-sdk/openai,
            pkg:npm/@aws-sdk/client-s3,
            pkg:npm/@aws-sdk/client-sesv2,
            pkg:npm/@aws-sdk/s3-request-presigner,
            pkg:npm/@pydantic/genai-prices,
            pkg:npm/@silurus/ooxml,
            pkg:npm/@tanstack/react-router,
            pkg:npm/@tanstack/react-start,
            pkg:npm/@tiptap/core,
            pkg:npm/@tiptap/extension-bold,
            pkg:npm/@tiptap/extension-document,
            pkg:npm/@tiptap/extension-hard-break,
            pkg:npm/@tiptap/extension-heading,
            pkg:npm/@tiptap/extension-history,
            pkg:npm/@tiptap/extension-italic,
            pkg:npm/@tiptap/extension-mention,
            pkg:npm/@tiptap/extension-paragraph,
            pkg:npm/@tiptap/extension-placeholder,
            pkg:npm/@tiptap/extension-text,
            pkg:npm/@tiptap/extensions,
            pkg:npm/@tiptap/pm,
            pkg:npm/@tiptap/react,
            pkg:npm/@tiptap/suggestion,
            pkg:npm/ai,
            pkg:npm/better-result,
            pkg:npm/client-zip,
            pkg:npm/crossws,
            pkg:npm/jszip,
            pkg:npm/marked,
            pkg:npm/posthog-js,
            pkg:npm/posthog-node,
            pkg:npm/postal-mime,
            pkg:npm/valibot,
            pkg:npm/y-prosemirror,
            pkg:npm/yjs,
            pkg:cargo/brotli-decompressor,
            pkg:cargo/dbus,
            pkg:cargo/filetime,
            pkg:cargo/mac-notification-sys,
            pkg:cargo/webpki-root-certs
          # A merge group has no pull request to comment on.
          # The verdict is the required check and its job summary; no PR comment,
          # so callers of this workflow need not grant pull request writes.
          comment-summary-in-pr: never

  dependency-malware:
    needs: ci-plan
    if: >-
      inputs.pr_depth_only != true
      &&
      (needs.ci-plan.outputs.coverage_profile != 'pilot-fast-v1' || contains(fromJSON(needs.ci-plan.outputs.pilot_fast_jobs || '[]'), 'dependency-malware')) && (
      needs.ci-plan.outputs.run_required != 'false'
      && (
      (needs.ci-plan.outputs.trusted == 'true' && needs.ci-plan.outputs.dependency_malware_required == 'true')
      )
      )
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      actions: write
    steps:
      - *checkout_input_sha
      # No dependency cache: Safe Chain must inspect every registry download.
      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: "package.json"
      - name: Install Safe Chain
        timeout-minutes: 2
        uses: ./.github/actions/safe-chain
      - name: Install OSV-Scanner
        timeout-minutes: 2
        if: ${{ !cancelled() }}
        uses: ./.github/actions/osv-scanner
      - name: Verify malware scanner fixtures
        timeout-minutes: 2
        if: ${{ !cancelled() }}
        run: bash scripts/test-malware-scanners.sh

      - name: Scan dependency malware
        timeout-minutes: 13
        if: ${{ !cancelled() }}
        run: bash scripts/scan-dependency-malware.sh
        env:
          NPM_TOKEN: ""

      - *merge_group_cancel

  # Short checks share one runner, so each costs a few steps instead of a
  # runner wait. Each part's step condition is its former job condition, and
  # its step names keep the part's name for failure digests. A later part
  # still runs after an earlier one fails, and any failure fails the job.
  #
  # dated-waiver-expiry: expiry is wall-clock state, so path scopes and
  # previously completed runs cannot certify it. It runs for every merge
  # candidate, which is why the job runs whenever the plan was not cancelled,
  # including after a failed plan, completed-depth reuse and PR-depth runs.
  # An enqueued head is the exception: its merge group runs the job on the
  # queued tree.
  ci-quick-checks:
    needs: ci-plan
    if: ${{ !cancelled() && inputs.heavy_only != true && github.event_name != 'pull_request' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      actions: write
    steps: *quick-checks-steps

  # Aggregation job for branch protection. The ruleset requires
  # this check to pass, which ensures untrusted PRs cannot be
  # merged without CI and trusted PRs must pass all checks.
  ci-result:
    # Every completed workflow run reports the required check. Metadata runs
    # mirror the newest code run for this pull request and exact head.
    name: ci-result
    if: always()
    needs:
      [
        ci-plan,
        generated-sources,

        pr-heavy-gate,
        ci-quick-checks,
        dependency-audit,
        dependency-review,
        dependency-malware,
        docker-checks,
        ci-checks-generated,
        ci-checks-policy,
        ci-checks-rest,
        ci-browser,
        ci-tests,
        code-quality-api,
        code-quality-web-rest,
        service-suites,
        postgres-service-suites,
        query-perf,
        release-typecheck,
        fix-tests-on-base,
        web-build,
        heavy-web-build,
        web-image-smoke,
        mobile-build,
        landing-build,
        marketing-screenshots,
        database-migrations-check,
        database-migrations-apply-fresh,
        migration-upgrade-rehearsal,
        route-smoke,
        scan-engine-wasm-drift,
        e2e-production-shard,
        e2e-vite-canary,
        e2e-landing,
        stack-redaction-browsers,
        api-image-smoke,
        legal-atlas-image,
        windows-scripts,
        desktop-windows-dry-run,
        desktop-rust-tests,
        desktop-rust-lint,
      ]
    outputs:
      # This run's own record of which jobs it required; the
      # `ci-required-summary` artifact holds the same record.
      required_summary: ${{ steps.outcome.outputs.required_summary }}
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    permissions:
      contents: read
      actions: write
      checks: read
      # A skipped plan passes only while the pull request is still a draft.
      pull-requests: read
    steps:
      - name: Record the certified comparison base
        env:
          EVENT_NAME: ${{ github.event_name }}
          TARGET_BASE_SHA: ${{ needs.ci-plan.outputs.target_base_sha }}
        # A merge group certifies its changes against the target branch;
        # the summary names the base so a run shows what it covered.
        run: |
          echo "Comparison base for this $EVENT_NAME run: ${TARGET_BASE_SHA:-none (full scope)}" >> "$GITHUB_STEP_SUMMARY"

      - name: Fetch GitHub API tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.repository }}
          ref: ${{ github.workflow_sha }}
          path: .workflow-tooling
          persist-credentials: false
          sparse-checkout: |
            scripts/gh-retry.sh
            scripts/retry.sh
            scripts/ci-failure-digest.ts
            scripts/fetch-failed-job-logs.sh
            /package.json
          sparse-checkout-cone-mode: false

      - name: Preserve GitHub API tooling across source checkouts
        run: |
          cp "$GITHUB_WORKSPACE/.workflow-tooling/scripts/gh-retry.sh" "$RUNNER_TEMP/gh-retry.sh"
          echo "GH_RETRY_SCRIPT=$RUNNER_TEMP/gh-retry.sh" >> "$GITHUB_ENV"

      # Job results and plan outputs reach the outcome step as files. One
      # environment value above Linux's 128 KiB limit stops a step before it
      # starts, and a script that embeds an expression is evaluated as one
      # expression, which GitHub caps at 21,000 characters; the outcome script
      # is longer, so it embeds none.
      - name: Write CI outcome inputs
        run: |
          cat > "$RUNNER_TEMP/ci-result-needs.json" <<'CI_RESULT_NEEDS_JSON'
          ${{ toJSON(needs) }}
          CI_RESULT_NEEDS_JSON
          cat > "$RUNNER_TEMP/ci-result-plan.json" <<'CI_RESULT_PLAN_JSON'
          ${{ toJSON(needs.ci-plan.outputs) }}
          CI_RESULT_PLAN_JSON

      - name: Evaluate CI outcome
        id: outcome
        env:
          EVENT: ${{ github.event_name }}
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
          # The labels the run event carried, read from this step's env block in
          # the job log by merge-bar.
          PR_LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
          RUN_REQUIRED: ${{ needs.ci-plan.outputs.run_required }}
          COMPLETED_RUN_ID: ${{ needs.ci-plan.outputs.completed_run_id }}
          COMPLETION_MARKER: ${{ needs.ci-plan.outputs.completion_marker }}
          PLAN_CONFIG: ${{ needs.ci-plan.outputs.plan_config }}
          # The commit this run tested and, for a pull request or merge group,
          # the base its plan compared against. Completion evidence is
          # recorded for pull requests only.
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha || inputs.sha || github.sha }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || needs.ci-plan.outputs.target_base_sha }}
          HEAD_REPO_ID: ${{ github.event.pull_request.head.repo.id }}
          PATCH_ID: ${{ needs.ci-plan.outputs.patch_id }}
          WORKFLOW_VERSION: ${{ needs.ci-plan.outputs.pr_depth_workflow_version }}
          TESTED_TREE: ${{ needs.ci-plan.outputs.tested_tree }}
          WORKFLOW_TREE: ${{ needs.ci-plan.outputs.workflow_tree }}
          PR_DEPTH_JOBS: ${{ needs.ci-plan.outputs.pr_depth_jobs || '[]' }}
          PR_DEPTH_REUSED: ${{ needs.ci-plan.outputs.pr_depth_reused }}
          PR_DEPTH_ONLY: ${{ inputs.pr_depth_only }}
          PR_DEPTH_SOURCE_RUN_ID: ${{ needs.ci-plan.outputs.pr_depth_source_run_id }}
          PR_HEAVY_SUITES: ${{ needs.ci-plan.outputs.pr_heavy_suites }}
          PR_HEAVY_SOURCE_RUN_ID: ${{ needs.ci-plan.outputs.pr_heavy_source_run_id }}
          PR_HEAVY_SOURCE_SHA: ${{ needs.ci-plan.outputs.pr_heavy_source_sha }}
          PR_HEAVY_JOBS: ${{ needs.ci-plan.outputs.pr_heavy_jobs || '[]' }}
          QUEUE_VALIDATION: ${{ needs.ci-plan.outputs.queue_validation }}
          METADATA_ONLY: ${{ needs.ci-plan.outputs.metadata_only }}
          PR_ACTION: ${{ github.event.action }}
          PLAN_RESULT: ${{ needs.ci-plan.result }}
          SUITE_DEPTH: ${{ needs.ci-plan.outputs.suite_depth }}
          COVERAGE_PROFILE: ${{ needs.ci-plan.outputs.coverage_profile }}
          PILOT_FAST_JOBS: ${{ needs.ci-plan.outputs.pilot_fast_jobs }}
          HEAVY_ONLY: ${{ inputs.heavy_only }}
          HEAVY_JOBS: ${{ needs.ci-plan.outputs.heavy_jobs || '[]' }}
          QUEUE_DEPTH: ${{ needs.ci-plan.outputs.queue_depth || 'full' }}
          THIN_JOBS: ${{ needs.ci-plan.outputs.thin_jobs || '[]' }}
          QUEUE_REQUIRED_JOBS: ${{ needs.ci-plan.outputs.queue_required_jobs || '[]' }}
          TRUSTED: ${{ needs.ci-plan.outputs.trusted }}
          HEAVY_PROOF: ${{ needs.ci-plan.outputs.heavy_proof }}
          ARMED_DELTA: ${{ needs.ci-plan.outputs.armed_delta }}
          NORMAL_SOURCE_RUN_ID: ${{ needs.ci-plan.outputs.normal_source_run_id }}
          ARMED_PROOF_SOURCE_RUN_ID: ${{ needs.ci-plan.outputs.armed_proof_source_run_id }}
          # Queue-only suites (heavy_proof gate); a proven merge group skips all but
          # MERGE_GROUP_HEAVY_KEEP. scripts/ci-plan.test.ts derives both lists.
          HEAVY_PROOF_JOBS: *armed_proof_jobs
          MERGE_GROUP_HEAVY_KEEP: >-
            ["migration-upgrade-rehearsal", "e2e-report"]
          # The ci-plan output each job's `if:` selects it by; null for a job
          # that always runs at full depth. scripts/ci-plan.test.ts binds each
          # entry to its job's `if:`, and a job missing here fails the run.
          JOB_SCOPES: >-
            {
            "ci-quick-checks": null,
            "generated-sources": "package_checks_required",

            "pr-heavy-gate": null,
            "docker-checks": "docker_checks_required",
            "api-image-smoke": "api_image_smoke_required",
            "ci-browser": "ci_browser_required",
            "ci-checks-generated": "package_checks_required",
            "ci-checks-policy": "package_checks_required",
            "ci-checks-rest": "package_checks_required",
            "ci-tests": "ci_tests_required",
            "code-quality-api": "package_checks_required",
            "code-quality-web-rest": "package_checks_required",
            "dependency-audit": "dependency_changes_required",
            "dependency-review": "dependency_changes_required",
            "dependency-malware": "dependency_malware_required",
            "desktop-rust-tests": "desktop_rust_checks_required",
            "desktop-rust-lint": "desktop_rust_checks_required",
            "e2e-landing": "e2e_landing_required",
            "route-smoke": "route_smoke_required",
            "scan-engine-wasm-drift": "scan_engine_wasm_required",
            "e2e-production-shard": "e2e_production_required",
            "e2e-vite-canary": "e2e_core_required",
            "fix-tests-on-base": "fix_tests_on_base_required",
            "landing-build": "landing_build_required",
            "legal-atlas-image": "legal_atlas_image_required",
            "marketing-screenshots": "marketing_screenshots_required",
            "database-migrations-check": "database_migrations_required",
            "database-migrations-apply-fresh": "database_migrations_required",
            "migration-upgrade-rehearsal": "migration_rehearsal_required",
            "mobile-build": "mobile_build_required",
            "release-typecheck": "release_typecheck_required",
            "service-suites": "service_suites_required",
            "postgres-service-suites": "postgres_service_suites_required",
            "query-perf": "query_perf_required",
            "stack-redaction-browsers": "stack_redaction_browsers_required",
            "web-build": "web_build_required",
            "heavy-web-build": "heavy_web_build_required",
            "web-image-smoke": "web_image_smoke_required",
            "windows-scripts": "windows_scripts_required",
            "desktop-windows-dry-run": "desktop_windows_dry_run_required"
            }
          FOLDED_SUITES: >-
            {"docker-checks": {"agent-sandbox-docker": "agent_sandbox_docker_required", "api-image-deps": "api_image_deps_required"}}
          # Jobs a fast-depth run must also see succeed once their scope is
          # planned; any other job may skip there.
          FAST_JOB_SCOPES: >-
            {"postgres-service-suites": "postgres_service_suites_required", "service-suites": "service_suites_pr_required", "docker-checks": "docker_checks_pr_required", "legal-atlas-image": "legal_atlas_image_pr_required", "web-build": "web_build_pr_required"}
          FAST_REQUIRED: >-
            ["generated-sources", "pr-heavy-gate", "desktop-rust-lint", "ci-browser", "ci-checks-generated", "ci-checks-policy", "ci-checks-rest", "code-quality-api", "code-quality-web-rest", "dependency-audit", "dependency-review", "dependency-malware", "ci-tests", "e2e-landing", "e2e-production-shard", "web-build", "scan-engine-wasm-drift", "query-perf", "database-migrations-check", "database-migrations-apply-fresh"]
        run: |
          # Every job in `needs`, so a job added there is evaluated without a
          # hand-kept list; the planner tests require every job to be in
          # `needs`. The previous step wrote job results and plan outputs.
          NEEDS=$(cat "$RUNNER_TEMP/ci-result-needs.json")
          PLAN_FILE="$RUNNER_TEMP/ci-result-plan.json"
          PLAN=$(cat "$PLAN_FILE")
          # The run's own record of which jobs it required. Every job this
          # step waits on except ci-plan is either required, with its
          # conclusion, or not required. `required_jobs` is the set each
          # verdict branch below evaluates; it stays empty when the step
          # decides before any branch requires a job. The record is written on
          # every exit, so its verdict is this step's exit status.
          RECORDED_NEEDS="$NEEDS"
          required_jobs='[]'
          reused_from_run_id=""
          # Set by each exit that passes without evaluating any job.
          pass_through_reason=""
          record_required_jobs() {
            local status=$1 depth=${SUITE_DEPTH:-} record
            if [[ "${PR_DEPTH_ONLY:-false}" == true ]]; then
              depth=pr-depth
            elif [[ "${HEAVY_ONLY:-false}" == true ]]; then
              depth=heavy
            elif [[ "${QUEUE_DEPTH:-full}" == thin ]]; then
              depth=thin
            fi
            record=$(jq -ce --argjson required "$required_jobs" --arg status "$status" \
              --arg event "${EVENT:-}" --arg head "${HEAD_SHA:-}" --arg base "${BASE_SHA:-}" \
              --arg run "${GITHUB_RUN_ID:-}" --arg attempt "${GITHUB_RUN_ATTEMPT:-}" \
              --arg depth "$depth" --arg profile "${COVERAGE_PROFILE:-}" --arg reused "$reused_from_run_id" \
              --arg pass_through "$pass_through_reason" '
              def nonempty: if . == "" then null else . end;
              def count: if test("^[1-9][0-9]*$") then tonumber else null end;
              . as $needs
              # The verdict also evaluates every job that failed, timed out or
              # was cancelled (a verified supersession may accept a cancelled
              # one), whichever branch decided it and whatever it decided.
              | ($required + [to_entries[] | select(.key != "ci-plan")
                  | select(.value.result == "failure" or .value.result == "timed_out" or .value.result == "cancelled")
                  | .key] | unique) as $counted
              | {version: 1, event: $event,
                head_sha: ($head | nonempty), base_sha: ($base | nonempty),
                run_id: ($run | count), run_attempt: ($attempt | count),
                depth: ($depth | nonempty), coverage_profile: ($profile | nonempty),
                reused_from_run_id: ($reused | count),
                basis: (if $pass_through == "" then "evaluated" else "pass_through" end),
                pass_through_reason: ($pass_through | nonempty),
                required: [$counted[] | {job: ., conclusion: ($needs[.].result // "missing")}],
                not_required: ([keys[] | select(. != "ci-plan")] - $counted),
                verdict: (if $status == "0" then "success" else "failure" end)}' <<< "$RECORDED_NEEDS") || return 1
            echo "required_summary=$record" >> "${GITHUB_OUTPUT:-}"
          }
          trap 'record_required_jobs "$?" || echo "::error::The required-jobs record could not be written."' EXIT
          # The required-jobs record a CI run uploaded, checked against its id.
          code_run_record() {
            local run=$1 dir
            dir=$(mktemp -d)
            bash "$GH_RETRY_SCRIPT" run download "$run" -R "$REPO" -n ci-required-summary -D "$dir" > /dev/null || return 1
            jq -ce --argjson run "$run" 'select(.version == 1 and .run_id == $run)' "$dir/ci-required-summary.json"
          }
          # What a code run's record proves about this head: only an evaluated
          # success of every required job is evidence. A pass-through run
          # (superseded, enqueued, draft) evaluated nothing; a reuse points at
          # the run that did.
          record_evidence() {
            jq -r --arg head "$HEAD_SHA" '
              if .head_sha != $head then "invalid head \(.head_sha)"
              elif .basis == "evaluated" then
                (if .verdict == "success" and (.required | length) > 0 and all(.required[]; .conclusion == "success")
                  then "evaluated-success" else "evaluated-failure" end)
              elif .basis == "pass_through" and .pass_through_reason == "reused" and (.reused_from_run_id | type) == "number"
                then "reused \(.reused_from_run_id)"
              elif .basis == "pass_through" then "pass-through \(.pass_through_reason // "unknown")"
              else "invalid basis" end'
          }
          # Only runs older than this one: a newer metadata run of the head waits
          # on this run's concurrency group, and a newer code run reports its
          # own ci-result, so waiting on either would only wait out the deadline.
          mirror_metadata_code_run() {
            local poll_seconds=30 max_wait_seconds=2700 waited=0 runs candidates candidate run_status jobs plan_name result status attempt record evidence evidence_run running passed_through=""
            while true; do
              runs=$(bash "$GH_RETRY_SCRIPT" api --paginate --slurp "repos/$REPO/actions/workflows/ci.yml/runs?event=pull_request&head_sha=$HEAD_SHA&per_page=100") || {
                echo "::error::Metadata mirror could not list CI code runs."
                return 1
              }
              candidates=$(jq -cr --argjson current "$GITHUB_RUN_ID" --argjson pr "$PR_NUMBER" --arg head "$HEAD_SHA" '
                [.[].workflow_runs[]
                  | select(.id < $current and .head_sha == $head)
                  | select(any(.pull_requests[]?; .number == $pr))]
                | sort_by(.run_number, .id) | reverse | .[]
                | select(.status | type == "string")
                | "\(.id) \(.status)"
                ' <<< "$runs") || {
                echo "::error::Metadata mirror received invalid CI run data."
                return 1
              }
              running=false
              while read -r candidate run_status; do
                [[ -n "$candidate" ]] || continue
                jobs=$(bash "$GH_RETRY_SCRIPT" api --paginate --slurp "repos/$REPO/actions/runs/$candidate/jobs?per_page=100") || {
                  echo "::error::Metadata mirror could not inspect code run $candidate."
                  return 1
                }
                plan_name=$(jq -er '[.[].jobs[] | select(.name == "ci-plan" or .name == "ci-metadata-plan") | .name] | first // ""' <<< "$jobs") || return 1
                # Historical metadata runs used a distinct result name; new
                # runs carry the classification on their ci-plan job.
                if [[ "$plan_name" == ci-metadata-plan ]] || jq -e 'any(.[].jobs[]; .name == "ci-metadata-result")' <<< "$jobs" >/dev/null; then
                  continue
                fi
                # GitHub lists a job only once it is queued: a queued run has
                # no ci-plan yet and a running one no ci-result yet. Either may
                # be the code run, so the mirror waits for it to report.
                if [[ "$plan_name" != ci-plan ]]; then
                  if [[ "$run_status" != completed ]]; then
                    running=true
                    break
                  fi
                  continue
                fi
                result=$(jq -cr '[.[].jobs[] | select(.name == "ci-result")] | sort_by(.id) | last' <<< "$jobs") || return 1
                if [[ "$result" == null ]]; then
                  if [[ "$run_status" != completed ]]; then
                    running=true
                    break
                  fi
                  echo "::error::Code run $candidate completed without a ci-result job."
                  return 1
                fi
                status=$(jq -er '.status | select(type == "string")' <<< "$result") || return 1
                if [[ "$status" != completed ]]; then
                  running=true
                  break
                fi
                # The record decides, never the ci-result conclusion: a run
                # that passed through succeeds without evaluating its jobs.
                attempt=$(jq -er '.run_attempt | select(type == "number")' <<< "$result") || return 1
                evidence_run="$candidate"
                for _ in 1 2 3; do
                  # A run a reuse names is held to the same bar: its latest
                  # attempt completed and wrote the record.
                  if [[ "$evidence_run" != "$candidate" ]]; then
                    jobs=$(bash "$GH_RETRY_SCRIPT" api --paginate --slurp "repos/$REPO/actions/runs/$evidence_run/jobs?per_page=100") || return 1
                    result=$(jq -cr '[.[].jobs[] | select(.name == "ci-result")] | sort_by(.id) | last' <<< "$jobs") || return 1
                    if [[ "$result" == null ]] || ! jq -e '.status == "completed"' <<< "$result" > /dev/null; then
                      echo "::error::Metadata mirror: run $evidence_run, which run $candidate reused, has no completed ci-result. Re-run CI run $candidate to evaluate head $HEAD_SHA."
                      return 1
                    fi
                    attempt=$(jq -er '.run_attempt | select(type == "number")' <<< "$result") || return 1
                  fi
                  record=$(code_run_record "$evidence_run") || {
                    echo "::error::Metadata mirror: run $evidence_run has no readable required-jobs record. Re-run CI run $candidate to evaluate head $HEAD_SHA."
                    return 1
                  }
                  if ! jq -e --argjson attempt "$attempt" '.run_attempt == $attempt' <<< "$record" > /dev/null; then
                    echo "::error::Metadata mirror: the record of run $evidence_run is not from its latest attempt ($attempt). Re-run CI run $candidate to evaluate head $HEAD_SHA."
                    return 1
                  fi
                  evidence=$(record_evidence <<< "$record") || return 1
                  [[ "$evidence" == reused\ * ]] || break
                  evidence_run="${evidence#reused }"
                done
                case "$evidence" in
                  evaluated-success)
                    echo "Metadata mirror: run $evidence_run evaluated every required job of head $HEAD_SHA successfully."
                    pass_through_reason=metadata
                    reused_from_run_id="$evidence_run"
                    return 0
                    ;;
                  pass-through\ *)
                    # An older code run of this head may still have evaluated it.
                    echo "Metadata mirror: code run $candidate evaluated nothing (${evidence#pass-through }); checking older code runs."
                    passed_through="${passed_through:-$candidate}"
                    continue
                    ;;
                  *)
                    echo "::error::Metadata mirror: run $evidence_run is no evidence for head $HEAD_SHA (${evidence:-unreadable})."
                    return 1
                    ;;
                esac
              done <<< "$candidates"
              if [[ "$running" == false ]]; then
                if [[ -n "$passed_through" ]]; then
                  echo "::error::Metadata mirror: no code run evaluated head $HEAD_SHA. Re-run CI run $passed_through to evaluate it."
                  return 1
                fi
                # ci-plan runs a head's suites itself when it has no earlier
                # code run, so a mirror starts only after one was created.
                echo "::error::Metadata mirror: no code run exists for pull request $PR_NUMBER at head $HEAD_SHA."
                return 1
              fi
              if ((waited >= max_wait_seconds)); then
                echo "::error::Metadata mirror: timed out after 45 min waiting for a code run of head $HEAD_SHA to report. Re-run that code run, or push."
                return 1
              fi
              sleep "$poll_seconds"
              waited=$((waited + poll_seconds))
            done
          }
          if [[ "$EVENT" == pull_request && "$METADATA_ONLY" == true ]]; then
            mirror_metadata_code_run
            exit $?
          fi
          # Queue-only suites a proven merge group may skip; the rest stay required.
          heavy_skippable='[]'
          if [[ "$EVENT" == merge_group && "${HEAVY_PROOF:-}" == false ]]; then
            heavy_skippable=$(jq -cn --argjson heavy "$HEAVY_PROOF_JOBS" --argjson keep "$MERGE_GROUP_HEAVY_KEEP" '$heavy - $keep') || exit 1
            echo "Queue-only suites proven by armed pull request run ${ARMED_PROOF_SOURCE_RUN_ID:-unknown}; this group skips them." >> "$GITHUB_STEP_SUMMARY"
          fi
          if [[ "$QUEUE_DEPTH" == thin ]]; then
            THIN_JOBS=$(jq -cn --argjson thin "$THIN_JOBS" --argjson required "$QUEUE_REQUIRED_JOBS" '$thin + $required | unique') || exit 1
          fi
          if [[ "$COVERAGE_PROFILE" == pilot-fast-v1 ]]; then
            FAST_REQUIRED="$PILOT_FAST_JOBS"
          fi
          # Select the current carrier after profile overrides: manual fast
          # runs require the standalone job too. The inactive alias contributes
          # neither a result nor reusable completion evidence.
          if [[ "$EVENT" == pull_request ]]; then
            quick_checks_job=pr-heavy-gate
            NEEDS=$(jq -ce 'del(."ci-quick-checks")' <<< "$NEEDS") || exit 1
          else
            quick_checks_job=ci-quick-checks
            NEEDS=$(jq -ce 'del(."pr-heavy-gate")' <<< "$NEEDS") || exit 1
          fi
          FAST_REQUIRED=$(jq -cn --argjson required "$FAST_REQUIRED" --arg active "$quick_checks_job" '$required - ["ci-quick-checks", "pr-heavy-gate"] + [$active] | unique') || exit 1
          # The Postgres opt-in runs the service suites on the pull request once
          # armed, with the other queue-only suites; an unarmed push skips them.
          if [[ "$EVENT" == pull_request && "${HEAVY_PROOF:-}" == true ]] && jq -e '.postgres_pr_required == "true"' <<< "$PLAN" >/dev/null; then
            FAST_REQUIRED=$(jq -cn --argjson required "$FAST_REQUIRED" '$required + ["service-suites", "postgres-service-suites"] | unique') || exit 1
          fi
          # ci-plan proved this head only merges the base into one whose run
          # passed with the same patch id, so the heavy suites skip by design.
          if [[ "$EVENT" == pull_request && "${PR_HEAVY_SUITES:-}" == reused ]]; then
            if [[ ! "${PR_HEAVY_SOURCE_RUN_ID:-}" =~ ^[1-9][0-9]*$ || ! "${PR_HEAVY_SOURCE_SHA:-}" =~ ^[0-9a-f]{40}$ ]] ||
              ! jq -e 'type == "array" and length > 0 and all(.[]; type == "string")' <<< "$PR_HEAVY_JOBS" > /dev/null; then
              echo "::error::Invalid heavy-suite reuse evidence."
              exit 1
            fi
            FAST_REQUIRED=$(jq -cn --argjson required "$FAST_REQUIRED" --argjson heavy "$PR_HEAVY_JOBS" '$required - $heavy') || exit 1
            heavy_reason="Heavy suites skipped: this head only merges the base into $PR_HEAVY_SOURCE_SHA, whose run $PR_HEAVY_SOURCE_RUN_ID passed with the same patch id; the merge queue re-certifies the combination."
            echo "$heavy_reason"
            printf '%s\n' "$heavy_reason" >> "$GITHUB_STEP_SUMMARY"
          fi
          if [[ "$QUEUE_VALIDATION" == true && "$EVENT" == pull_request && "$PR_ACTION" == enqueued ]] &&
            jq -e 'all(.[]; .result == "success" or .result == "skipped")' <<< "$NEEDS" >/dev/null; then
            echo "Queued tree validation belongs to merge_group."
            pass_through_reason=enqueued
            exit 0
          fi
          # Read failure and timeout evidence before any early aggregation exit.
          cancelled_jobs=""
          cancelled_by=""
          superseded_in_group=false
          # The concurrency group a newer code run of this pull request or
          # branch waits on; metadata runs wait on their own group.
          case "$EVENT" in
            pull_request) code_group="${GITHUB_WORKFLOW:-}-pr-${PR_NUMBER:-}" ;;
            workflow_dispatch) code_group="${GITHUB_WORKFLOW:-}-ci-dispatch-${GITHUB_REF:-}" ;;
            *) code_group="" ;;
          esac
          runner_lost_jobs='[]'
          if jq -e 'any(.[]; .result == "cancelled" or .result == "failure" or .result == "timed_out")' <<< "$NEEDS" > /dev/null; then
            cancelled_jobs=$(bash "$GH_RETRY_SCRIPT" api --paginate --slurp "repos/$REPO/actions/runs/$GITHUB_RUN_ID/attempts/$GITHUB_RUN_ATTEMPT/jobs?per_page=100") || {
              echo "::error::Cancelled CI job failed-step lookup was unavailable."
              exit 1
            }
            runner_lost_jobs=$(jq -c '[.[].jobs[]
              | select(.conclusion == "failure"
                  and (any((.steps // [])[]; .conclusion == "failure") | not)
                  and all((.steps // [])[]; (.status // "completed") == "completed")
                  and (((.steps // []) | length) == 0 or any((.steps // [])[]; .conclusion == "cancelled")))
              | .name] | unique' <<< "$cancelled_jobs") || exit 1
            # Job deadlines can appear as cancelled or failure in needs.
            # Inspect runner annotations before a generic cancellation masks them.
            while IFS=$'\t' read -r job_name conclusion url; do
              if [[ "$conclusion" == timed_out ]]; then
                echo "::error::CI job timed out: $job_name"
                exit 1
              fi
              [[ "$url" != missing ]] || continue
              [[ "$url" == "https://api.github.com/repos/$REPO/check-runs/"* ]] || exit 1
              annotations=$(bash "$GH_RETRY_SCRIPT" api --paginate --slurp "$url/annotations?per_page=100") || {
                echo "::error::CI job timeout lookup was unavailable: $job_name"
                exit 1
              }
              timed_out=$(jq -r 'flatten | any(.[]; (.message // "") | (contains("has exceeded the maximum execution time") or test("^The action .* has timed out after [0-9]+ minutes[.]$")))' <<< "$annotations") || {
                echo "::error::CI job timeout annotations were invalid: $job_name"
                exit 1
              }
              if [[ "$timed_out" == true ]]; then
                echo "::error::CI job timed out: $job_name"
                exit 1
              fi
              # A cancel through the API or the UI (a capacity yield, a
              # person) names its actor; cancel-in-progress names the group.
              cancel_actor=$(jq -r 'flatten | [.[] | (.message // "") | (capture("^The run was canceled (forcefully )?by @(?<actor>[^ ]+)[.]$") | .actor)] | first // ""' <<< "$annotations") || {
                echo "::error::CI job cancel annotations were invalid: $job_name"
                exit 1
              }
              if [[ -n "$cancel_actor" ]]; then
                cancelled_by="@$cancel_actor ($job_name)"
              fi
              if [[ -n "$code_group" ]] && jq -e --arg group "$code_group" 'flatten | any(.[]; (.message // "") == "Canceling since a higher priority waiting request for \($group) exists")' <<< "$annotations" > /dev/null; then
                superseded_in_group=true
              fi
            done < <(jq -r '
              .[].jobs[] | select(.conclusion == "cancelled" or .conclusion == "failure" or .conclusion == "timed_out")
              | [.name, .conclusion, (.check_run_url // "missing")] | @tsv
              ' <<< "$cancelled_jobs")
            failed_steps=$(jq -r '
              .[].jobs[] | select(.conclusion == "cancelled") | . as $job
              | (.steps // [])[] | select(.conclusion == "failure")
              | "\($job.name) / \(.number): \(.name) (\($job.html_url))"
              | gsub("%"; "%25") | gsub("\r"; "%0D") | gsub("\n"; "%0A")
              ' <<< "$cancelled_jobs")
            if [[ -n "$failed_steps" ]]; then
              failure_summary="Merge group failed: ${failed_steps//$'\n'/; }. Other jobs were cancelled to free runners."
              echo "$failure_summary"
              printf '%s\n' "$failure_summary" >> "$GITHUB_STEP_SUMMARY"
              while IFS= read -r failed_step; do
                echo "::error::Cancelled CI job contains a failed step: $failed_step"
              done <<< "$failed_steps"
              exit 1
            fi
          fi
          report_required_runner_losses() {
            local names
            names=$(jq -r --argjson required "$required_jobs" --argjson lost "$runner_lost_jobs" '
              . as $needs | $required[] | . as $job
              | select(($lost | index($job)) and $needs[$job].result == "failure")
              ' <<< "$NEEDS") || return 1
            [[ -n "$names" ]] || return 0
            while IFS= read -r job_name; do
              echo "::error::$job_name: the runner was lost before any step failed. A first-attempt pull request run whose only failure is a lost runner re-runs its failed jobs once automatically; otherwise re-run the failed jobs."
            done <<< "$names"
          }
          if [[ "${HEAVY_ONLY:-false}" == true ]]; then
            # No main run may turn a cancellation into successful supersession.
            # Keep only the derived heavy set; thin jobs intentionally skipped,
            # and their folded suites are not expected either.
            NEEDS=$(jq -ce --argjson heavy "$HEAVY_JOBS" '
              with_entries(select(.key as $job | $job == "ci-plan" or ($heavy | index($job))))
              ' <<< "$NEEDS")
            if jq -e 'any(.[]; .result == "cancelled")' <<< "$NEEDS" > /dev/null; then
              echo "::error::Main heavy suites were cancelled."
              exit 1
            fi
          fi
          # A job cancelled by cancel-in-progress names this run's code
          # concurrency group. Queued jobs may have no annotation: then a
          # newer code run proves supersession. Either way no cancelled job
          # may have timed out or been cancelled by an actor. Every API lookup
          # fails closed.
          cancelled_dependencies_were_superseded() {
            local current workflow created runs newer candidate jobs superseder=""
            if [[ -n "$cancelled_by" ]]; then
              echo "::error::CI jobs were cancelled by $cancelled_by, not by a newer run; this run evaluated nothing. Re-run this run to evaluate the head."
              return 1
            fi
            if [[ "$superseded_in_group" == true ]]; then
              jq -e 'any(.[].jobs[]; .conclusion == "cancelled")' <<< "$cancelled_jobs" > /dev/null
              return
            fi
            current=$(bash "$GH_RETRY_SCRIPT" api "repos/$REPO/actions/runs/$GITHUB_RUN_ID") || return 1
            workflow=$(jq -er '.workflow_id | select(type == "number")' <<< "$current") || return 1
            created=$(jq -er '.created_at | select(type == "string" and length > 0) | @uri' <<< "$current") || return 1
            runs=$(bash "$GH_RETRY_SCRIPT" api --paginate --slurp "repos/$REPO/actions/workflows/$workflow/runs?event=$EVENT&created=%3E%3D$created&per_page=100") || return 1
            newer=$(jq -r --argjson current "$current" --arg event "$EVENT" --arg pr "$PR_NUMBER" '
              .[].workflow_runs[]
              | select(.workflow_id == $current.workflow_id and .name == $current.name and .event == $event
                and .id > $current.id and .run_number > $current.run_number
                and .created_at >= $current.created_at
                and (if $event == "workflow_dispatch" then .head_branch == $current.head_branch
                  elif $event == "pull_request" then any(.pull_requests[]; (.number | tostring) == $pr)
                  else false end))
              | .id
              ' <<< "$runs") || return 1
            # A metadata run has its own concurrency group and never cancels
            # a code run, so only a run with a ci-plan job supersedes; a run
            # that lists no job yet proves nothing.
            while read -r candidate; do
              [[ -n "$candidate" ]] || continue
              jobs=$(bash "$GH_RETRY_SCRIPT" api --paginate --slurp "repos/$REPO/actions/runs/$candidate/jobs?per_page=100") || return 1
              if jq -e 'any(.[].jobs[]; .name == "ci-plan")' <<< "$jobs" > /dev/null; then
                superseder="$candidate"
                break
              fi
            done <<< "$newer"
            [[ -n "$superseder" ]] || return 1
            # Timeout annotations were checked before aggregation above.
            jq -e 'any(.[].jobs[]; .conclusion == "cancelled")' <<< "$cancelled_jobs" > /dev/null
          }

          # The plan skips a draft pull request, and every job with it. The
          # event's draft flag can be stale: a push to a draft followed by
          # marking it ready leaves a draft run beside the ready one (draft
          # runs have their own concurrency group, so they never cancel it).
          # So the skip passes only while the pull request is still a draft;
          # a ready one has to run its checks, and re-running this run
          # replays the draft event, so it can never run them.
          if [[ "$PLAN_RESULT" == "skipped" ]]; then
            draft=""
            if [[ "$EVENT" == "pull_request" ]]; then
              draft="$(bash "$GH_RETRY_SCRIPT" api "repos/$REPO/pulls/$PR_NUMBER" --jq .draft)"
            fi
            if [[ "$draft" == "true" ]]; then
              echo "CI plan skipped for a draft pull request. Passing."
              pass_through_reason=draft
              exit 0
            fi
            echo "::error::CI plan was skipped because this run started while the pull request was a draft. Re-running this run cannot start CI: the run started by marking it ready proves this head. If that run is missing or failed, push a commit, or mark the pull request as draft and ready again, to start a fresh run."
            exit 1
          fi

          # Only a pull request or a manual run is ever superseded by a newer
          # run; a cancelled merge group certifies nothing.
          if [[ "$PLAN_RESULT" == "cancelled" && "$EVENT" != "merge_group" ]]; then
            if jq -e 'all(.[]; .result == "success" or .result == "skipped" or .result == "cancelled")' <<< "$NEEDS" > /dev/null && cancelled_dependencies_were_superseded; then
              echo "CI run was superseded by a newer run (cancel-in-progress). Passing."
              pass_through_reason=superseded
              exit 0
            fi
            echo "::error::CI planning was cancelled without verified supersession."
            exit 1
          fi

          if [[ "$PLAN_RESULT" != "success" ]]; then
            echo "::error::CI planning did not succeed ($PLAN_RESULT)."
            exit 1
          fi

          if [[ "$TRUSTED" != "true" ]]; then
            echo "::error::CI did not run: the merge group failed the trust check; see the ci-plan job for the reason."
            exit 1
          fi

          if [[ "${PR_DEPTH_ONLY:-false}" == true ]]; then
            required_jobs=$(jq -c --argjson required "$PR_DEPTH_JOBS" '[keys[] | select(. as $job | $required | index($job))]' <<< "$NEEDS") || exit 1
            violations=$(jq -r --argjson required "$required_jobs" '[to_entries[] | select(.key as $job | $required | index($job)) | select(.value.result != "success") | "\(.key) (\(.value.result))"] | join(", ")' <<< "$NEEDS")
            if [[ -n "$violations" || $(jq 'length' <<< "$PR_DEPTH_JOBS") -eq 0 ]]; then
              echo "::error::Main PR-depth checks did not succeed: $violations"
              exit 1
            fi
            echo "All derived PR-depth checks succeeded."
            exit 0
          fi

          if [[ "$QUEUE_DEPTH" == thin && "$EVENT" != merge_group ]]; then
            echo "::error::Thin queue depth is valid only for merge_group."
            exit 1
          fi
          if [[ "$QUEUE_DEPTH" == thin ]] && ! jq -e 'type == "array" and length > 0 and all(.[]; type == "string")' <<< "$THIN_JOBS" > /dev/null; then
            echo "::error::Thin queue has no derived required job set."
            exit 1
          fi
          armed_delta=false
          if [[ "${ARMED_DELTA:-}" == true ]]; then
            # Only the queue-only suites ran; the reused run passed the rest.
            if [[ "$EVENT" != pull_request || "${HEAVY_PROOF:-}" != true || "$SUITE_DEPTH" != fast || ! "${NORMAL_SOURCE_RUN_ID:-}" =~ ^[1-9][0-9]*$ ]]; then
              echo "::error::Invalid armed delta: no reusable normal evidence."
              exit 1
            fi
            armed_delta=true
            reused_from_run_id="$NORMAL_SOURCE_RUN_ID"
            echo "Normal suites reused from run ${NORMAL_SOURCE_RUN_ID}; this run proves the queue-only suites." >> "$GITHUB_STEP_SUMMARY"
          fi
          if [[ "${RUN_REQUIRED:-true}" == false && "$armed_delta" != true ]]; then
            if [[ "$EVENT" != pull_request || ! "$COMPLETED_RUN_ID" =~ ^[1-9][0-9]*$ ]] || ! jq -e 'all(.[]; .result == "success" or .result == "skipped")' <<< "$NEEDS" > /dev/null; then
              echo "::error::Invalid completed-depth reuse or unexpected dependency outcome."
              exit 1
            fi
            reused_from_run_id="$COMPLETED_RUN_ID"
            reuse_reason="Not re-tested: run $COMPLETED_RUN_ID already passed this head at this depth; the merge queue validates it on the current base."
            echo "$reuse_reason"
            printf '%s\n' "$reuse_reason" >> "$GITHUB_STEP_SUMMARY"
            pass_through_reason=reused
            exit 0
          fi
          if [[ "$EVENT" == merge_group && "${PR_DEPTH_REUSED:-false}" == true ]]; then
            if [[ ! "${PR_DEPTH_SOURCE_RUN_ID:-}" =~ ^[1-9][0-9]*$ ]]; then
              echo "::error::Invalid PR-depth evidence source."
              exit 1
            fi
            echo "PR-depth evidence recorded from run ${PR_DEPTH_SOURCE_RUN_ID}; queued checks remain required." >> "$GITHUB_STEP_SUMMARY"
          fi
          case "$SUITE_DEPTH" in
            full)
              # Planned checks must succeed. The derived queue list includes
              # every code gate; only reasoned non-code exceptions may skip.
              # A thin queue requires only its derived jobs; others may skip.
              required_jobs=$(jq -c --slurpfile plans "$PLAN_FILE" --argjson scopes "$JOB_SCOPES" --arg queue "${QUEUE_DEPTH:-full}" --argjson thin "${THIN_JOBS:-[]}" --argjson skippable "$heavy_skippable" '
                [keys[] | select(. != "ci-plan") | . as $job
                  | select(($skippable | index($job) | not) and ($queue != "thin" or ($thin | index($job))) and ($scopes | has($job))
                    and ($scopes[$job] == null or $plans[0][$scopes[$job]] == "true"))]' <<< "$NEEDS") || exit 1
              report_required_runner_losses || exit 1
              violations=$(jq -r --argjson required "$required_jobs" --argjson scopes "$JOB_SCOPES" --arg queue "${QUEUE_DEPTH:-full}" --argjson thin "${THIN_JOBS:-[]}" '
                [to_entries[] | select(.key != "ci-plan") | .key as $job | .value.result as $result
                  | if ($required | index($job)) then
                      (if $result == "success" then empty else "\($job) (planned, \($result))" end)
                    elif ($queue != "thin" or ($thin | index($job))) and ($scopes | has($job) | not) then "\($job) (no entry in JOB_SCOPES)"
                    elif $result == "success" or $result == "skipped" then empty
                    else "\($job) (\($result))"
                    end]
                | join(", ")' <<< "$NEEDS")
              folded_violations=$(jq -r --slurpfile plans "$PLAN_FILE" --argjson suites "$FOLDED_SUITES" --argjson skippable "$heavy_skippable" '
                . as $needs
                | [$suites | to_entries[] | .key as $job | select($skippable | index($job) | not) | .value | to_entries[]
                  | select(($needs | has($job)) and $plans[0][.value] == "true") | .key as $suite
                  | ($needs[$job].outputs[$suite] // "missing") as $result
                  | select($result != "success") | "\($suite) (planned, \($result))"]
                | join(", ")' <<< "$NEEDS")
              violations="${violations}${violations:+${folded_violations:+, }}${folded_violations}"
              if [[ -n "$violations" ]]; then
                echo "::error::CI checks did not succeed: $violations"
                exit 1
              fi
              ;;
            fast)
              # Only an unlabelled pull request or a manual run plans `fast`:
              # its heavy suites skip by design. A cancelled dependency can
              # also mean a timeout; verify a newer run and reject timeout annotations.
              # Fast-required jobs must run when their scope is planned;
              # scope-less jobs are always planned; arming adds the queue-only ones.
              fast_scopes=$(jq -cn --argjson full "$JOB_SCOPES" --argjson fast "$FAST_JOB_SCOPES" '$full + $fast')
              armed_scopes=""
              if [[ "$EVENT" == pull_request && "${HEAVY_PROOF:-}" == true ]]; then
                # The queue-only suites, at the scope a merge group gives them.
                armed_scopes=$(jq -cn --argjson scopes "$fast_scopes" --argjson full "$JOB_SCOPES" --argjson heavy "$HEAVY_PROOF_JOBS" '
                  $scopes + ($full | with_entries(select(.key as $job | $heavy | index($job))))') || exit 1
                if [[ "$armed_delta" == true ]]; then
                  FAST_REQUIRED="$HEAVY_PROOF_JOBS"
                else
                  FAST_REQUIRED=$(jq -cn --argjson required "$FAST_REQUIRED" --argjson heavy "$HEAVY_PROOF_JOBS" '$required + $heavy | unique') || exit 1
                fi
                fast_scopes="$armed_scopes"
              fi
              # Armed proof reuses normal suites, never the current carrier's
              # time-dependent checks. Keep its heavy-proof scope separate.
              required_jobs=$(jq -c --slurpfile plans "$PLAN_FILE" --argjson scopes "$fast_scopes" --argjson required "$FAST_REQUIRED" --arg current "$quick_checks_job" '
                [keys[] | . as $job | select($job == $current or ($required | index($job)))
                  | select($scopes[$job] == null or $plans[0][$scopes[$job]] == "true")]' <<< "$NEEDS") || exit 1
              report_required_runner_losses || exit 1
              if [[ "$EVENT" == "merge_group" ]]; then
                echo "::error::$EVENT run planned suite depth 'fast'; the heavy suites must run."
                exit 1
              fi
              # A failure stands even when a sibling job was cancelled.
              failed=$(jq -r '[to_entries[] | select(.value.result as $r | ["success", "skipped", "cancelled"] | index($r) | not) | "\(.key) (\(.value.result))"] | join(", ")' <<< "$NEEDS")
              if [[ -n "$failed" ]]; then
                # Plain text: the failure digest below annotates each failed
                # step, and this step's exit is annotated by the runner.
                echo "CI checks failed: $failed"
                exit 1
              fi
              if [[ "$EVENT" == pull_request && "${HEAVY_PROOF:-}" == true ]]; then
                folded_violations=$(jq -r --slurpfile plans "$PLAN_FILE" --argjson suites "$FOLDED_SUITES" '
                  . as $needs
                  | [$suites | to_entries[] | .key as $job | select($needs[$job].result == "success") | .value | to_entries[]
                    | select($plans[0][.value] == "true") | .key as $suite
                    | ($needs[$job].outputs[$suite] // "missing") as $result
                    | select($result != "success") | "\($suite) (planned, \($result))"]
                  | join(", ")' <<< "$NEEDS")
                if [[ -n "$folded_violations" ]]; then
                  echo "::error::CI checks did not succeed: $folded_violations"
                  exit 1
                fi
              fi
              skipped=$(jq -r --argjson required "$required_jobs" '
                [to_entries[] | .key as $job | select($required | index($job))
                  | select(.value.result == "skipped")
                  | "\($job) (planned, skipped)"]
                | join(", ")' <<< "$NEEDS")
              if [[ -n "$skipped" ]]; then
                echo "::error::CI checks did not run: $skipped"
                exit 1
              fi
              cancelled=$(jq -r '[to_entries[] | select(.value.result == "cancelled") | .key] | join(", ")' <<< "$NEEDS")
              if [[ -n "$cancelled" ]]; then
                if ! cancelled_dependencies_were_superseded; then
                  echo "::error::CI jobs were cancelled without verified supersession: $cancelled"
                  exit 1
                fi
                echo "CI run was superseded by a newer run (cancel-in-progress): $cancelled. Passing."
                pass_through_reason=superseded
              fi
              ;;
            *)
              echo "::error::CI plan produced no suite depth ('$SUITE_DEPTH')."
              exit 1
              ;;
          esac
          # Completion evidence lets a later unchanged-head run skip every
          # suite, so only a run that planned and ran them records it: every
          # planned job succeeded and no job was cancelled or failed. A run
          # that passed as superseded never completed its suite.
          if [[ "$EVENT" == pull_request && ("${RUN_REQUIRED:-}" == true || "${ARMED_DELTA:-}" == true) ]]; then
            # This list owns both validation and jq argument construction. An
            # evidence input therefore cannot bypass either side of the boundary.
            evidence_inputs=(
              "PLAN_FILE:plans:json-object-file" "JOB_SCOPES:job_scopes:json-object" "FAST_JOB_SCOPES:fast_scopes:json-object"
              "FAST_REQUIRED:fast_required:json-array" "NEEDS:needs:json-object" "PR_DEPTH_JOBS:pr_depth:json-array"
              "COMPLETION_MARKER:marker:nonempty" "GITHUB_RUN_ID:run:positive-integer" "GITHUB_RUN_ATTEMPT:attempt:positive-integer"
              "PR_NUMBER:pr:positive-integer" "HEAD_REPO_ID:repo:positive-integer" "HEAD_SHA:head:hex40" "BASE_SHA:base:hex40"
              "SUITE_DEPTH:depth:suite-depth" "COVERAGE_PROFILE:profile:nonempty" "PATCH_ID:patch:hex40" "WORKFLOW_VERSION:workflow:hex40"
              "PLAN_CONFIG:plan_config:hex64" "TESTED_TREE:tested_tree:hex40" "WORKFLOW_TREE:workflow_tree:hex40"
              "HEAVY_PROOF:heavy_proof:boolean" "HEAVY_PROOF_JOBS:heavy_jobs:json-array" "ARMED_DELTA:armed_delta:boolean"
              "NORMAL_SOURCE_RUN_ID:normal_source:optional-positive-integer"
            )
            evidence_args=()
            invalid_evidence_input=""
            for evidence_input in "${evidence_inputs[@]}"; do
              IFS=: read -r input_name jq_name input_kind <<< "$evidence_input"
              input_value="${!input_name-}"
              input_valid=true
              case "$input_kind" in
                json-object-file) [[ -r "$input_value" ]] && jq -se 'length == 1 and (.[0] | type == "object")' "$input_value" > /dev/null 2>&1 ;;
                json-array) jq -se 'length == 1 and (.[0] | type == "array")' <<< "$input_value" > /dev/null 2>&1 ;;
                json-object) jq -se 'length == 1 and (.[0] | type == "object")' <<< "$input_value" > /dev/null 2>&1 ;;
                positive-integer) [[ "$input_value" =~ ^[1-9][0-9]*$ ]] ;;
                optional-positive-integer) [[ -z "$input_value" || "$input_value" =~ ^[1-9][0-9]*$ ]] ;;
                boolean) [[ "$input_value" == true || "$input_value" == false ]] ;;
                hex40) [[ "$input_value" =~ ^[0-9a-f]{40}$ ]] ;;
                hex64) [[ "$input_value" =~ ^[0-9a-f]{64}$ ]] ;;
                suite-depth) [[ "$input_value" == fast || "$input_value" == full ]] ;;
                nonempty) [[ -n "$input_value" ]] ;;
                *) false ;;
              esac || input_valid=false
              if [[ "$input_valid" != true ]]; then
                echo "::error::Invalid or missing completion evidence input: $input_name."
                echo "Completion evidence was skipped because $input_name is missing or malformed."
                invalid_evidence_input="$input_name"
                break
              fi
              if [[ "$input_kind" == json-object-file ]]; then
                evidence_args+=(--slurpfile "$jq_name" "$input_value")
              elif [[ "$input_kind" == json-* ]]; then
                evidence_args+=(--argjson "$jq_name" "$input_value")
              else
                evidence_args+=(--arg "$jq_name" "$input_value")
              fi
            done
            if [[ -n "$invalid_evidence_input" ]]; then
              evidence=""
            else
              evidence=$(jq -nce "${evidence_args[@]}" '
              ($needs | with_entries(.value = .value.result)) as $jobs
              | (if $depth == "full" then $job_scopes else ($job_scopes + $fast_scopes)
                  + (if $heavy_proof == "true" then ($job_scopes | with_entries(select(.key as $job | $heavy_jobs | index($job)))) else {} end) end) as $scopes
              | (if $depth == "full" then ($job_scopes | keys)
                  elif $armed_delta == "true" then $heavy_jobs
                  elif $heavy_proof == "true" then ($fast_required + $heavy_jobs | unique)
                  else $fast_required end) as $required
              | ([$required[] | select($scopes[.] == null or $plans[0][$scopes[.]] == "true")] | unique) as $planned
              | select(($jobs | length) > 1 and $jobs["ci-plan"] == "success"
                and all($jobs[]; . == "success" or . == "skipped")
                and ($planned | length) > 0
                and all($planned[]; . as $job | $jobs[$job] == "success")
                and ($head | test("^[0-9a-f]{40}$")) and ($base | test("^[0-9a-f]{40}$")))
              | {version: 7, tested_tree: $tested_tree, workflow_tree: $workflow_tree, marker: $marker, event: "pull_request", plan_config: $plan_config,
                run_id: ($run | tonumber), run_attempt: ($attempt | tonumber),
                pr_number: ($pr | tonumber), head_repo_id: ($repo | tonumber),
                head_sha: $head, base_sha: $base, patch_id: $patch, workflow_version: $workflow, pr_depth_jobs: $pr_depth, suite_depth: $depth,
                heavy_proof: ($heavy_proof == "true"),
                normal_source_run_id: (if $normal_source == "" then null else ($normal_source | tonumber) end),
                coverage_profile: (if $profile == "" then "normal-v1" else $profile end),
                planned: $planned, jobs: $jobs}') || evidence=""
            fi
            if [[ -n "$evidence" ]]; then
              echo "evidence=$evidence" >> "$GITHUB_OUTPUT"
              echo "evidence_sha256=$(printf '%s' "$evidence" | sha256sum | awk '{ print $1 }')" >> "$GITHUB_OUTPUT"
            elif [[ -z "$invalid_evidence_input" ]]; then
              echo "Not every planned CI job succeeded in this run; recording no completion evidence."
            fi
          fi

      # The required-jobs record as a run artifact, whatever the verdict.
      # Reporting only: a failed write or upload is annotated but never turns
      # a passing verdict red (a reader without the record refuses on its own).
      - name: Write required-jobs record
        if: always() && steps.outcome.outcome != 'skipped'
        continue-on-error: true
        env:
          REQUIRED_SUMMARY: ${{ steps.outcome.outputs.required_summary }}
          RECORD_PATH: ${{ runner.temp }}/ci-required-summary/ci-required-summary.json
        run: |
          if [[ -z "$REQUIRED_SUMMARY" ]]; then
            echo "::error::Evaluate CI outcome wrote no required-jobs record."
            exit 1
          fi
          mkdir -p "$(dirname "$RECORD_PATH")"
          printf '%s\n' "$REQUIRED_SUMMARY" > "$RECORD_PATH"

      # A metadata run of an idle pull request mirrors this record, so it is
      # kept as long as the repository allows (a few hundred bytes per run).
      - name: Upload required-jobs record
        if: always() && steps.outcome.outcome != 'skipped'
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ci-required-summary
          overwrite: true
          path: ${{ runner.temp }}/ci-required-summary/ci-required-summary.json
          retention-days: 90
          if-no-files-found: error

      # Failure digest: one record per failed step (job, step, kind, first
      # error lines with file:line) as annotations on this check run, a job
      # summary and the `ci-failures` artifact. Failed steps come from the
      # jobs API, so output a passing step prints on purpose is never listed.
      # Reporting only: the verdict above is unchanged.
      - name: Setup Bun for the failure digest
        if: failure() && steps.outcome.outcome == 'failure'
        uses: stella/.github/actions/setup-bun-cached@a6a6cd30646c18321ef71e344bf0af6b8d3634b8
        with:
          save: ${{ github.ref == 'refs/heads/main' }}
          bun-version-file: .workflow-tooling/package.json

      - name: Digest failed steps
        if: failure() && steps.outcome.outcome == 'failure'
        timeout-minutes: 5
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          dir="$RUNNER_TEMP/ci-failures"
          mkdir -p "$dir/logs"
          if ! bash "$GH_RETRY_SCRIPT" api --paginate --slurp "repos/$REPO/actions/runs/$GITHUB_RUN_ID/attempts/$GITHUB_RUN_ATTEMPT/jobs?per_page=100" > "$dir/jobs.json"; then
            echo "Failure digest unavailable: the jobs lookup failed."
            exit 0
          fi
          bash .workflow-tooling/scripts/fetch-failed-job-logs.sh "$REPO" "$dir/jobs.json" "$dir/logs" || echo "Job log download failed; the digest names each job without a log."
          bun .workflow-tooling/scripts/ci-failure-digest.ts digest --jobs "$dir/jobs.json" --logs "$dir/logs" --json "$dir/ci-failures.json" --summary "$GITHUB_STEP_SUMMARY"

      - name: Upload failure digest
        if: failure() && steps.outcome.outcome == 'failure'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ci-failures
          overwrite: true
          path: ${{ runner.temp }}/ci-failures/ci-failures.json
          retention-days: 7
          if-no-files-found: ignore

      # Evaluate the variable when this final job starts, after the suites.
      - name: Check out the merge hold rule
        if: github.event_name == 'merge_group' && vars.STELLA_MERGE_HOLD != ''
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ (inputs.heavy_only == true || inputs.pr_depth_only == true) && inputs.sha || '' }}
          sparse-checkout: |
            scripts/check-main-merge-hold.sh
            scripts/release-pull-requests.sh
          sparse-checkout-cone-mode: false

      - name: Main merge hold
        if: github.event_name == 'merge_group' && vars.STELLA_MERGE_HOLD != ''
        env:
          EVENT_NAME: ${{ github.event_name }}
          GH_TOKEN: ${{ github.token }}
          MERGE_GROUP_HEAD_REF: ${{ github.event.merge_group.head_ref }}
          REPOSITORY: ${{ github.repository }}
          STELLA_MERGE_HOLD: ${{ vars.STELLA_MERGE_HOLD }}
        run: bash scripts/check-main-merge-hold.sh

      # Only an actual validated PR run publishes evidence; reuse never renews
      # it, and a superseded or cancelled run never completed its suite.
      - name: Record completed suite depth
        if: success() && github.event_name == 'pull_request' && (needs.ci-plan.outputs.run_required == 'true' || needs.ci-plan.outputs.armed_delta == 'true') && needs.ci-plan.outputs.completion_marker != '' && !contains(needs.*.result, 'cancelled') && !contains(needs.*.result, 'failure') && steps.outcome.outputs.evidence != ''
        env:
          EVIDENCE: ${{ steps.outcome.outputs.evidence }}
          MARKER_PATH: ${{ runner.temp }}/ci-completed-depth.json
        run: printf '%s\n' "$EVIDENCE" > "$MARKER_PATH"

      - name: ${{ needs.ci-plan.outputs.heavy_proof == 'true' && format('Publish armed suite depth {0}', steps.outcome.outputs.evidence_sha256) || 'Publish completed suite depth' }}
        id: completion-publisher
        if: success() && github.event_name == 'pull_request' && (needs.ci-plan.outputs.run_required == 'true' || needs.ci-plan.outputs.armed_delta == 'true') && needs.ci-plan.outputs.completion_marker != '' && !contains(needs.*.result, 'cancelled') && !contains(needs.*.result, 'failure') && steps.outcome.outputs.evidence != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ needs.ci-plan.outputs.completion_marker }}
          overwrite: true
          path: ${{ runner.temp }}/ci-completed-depth.json
          retention-days: 7
          if-no-files-found: error

      - *merge_group_cancel
