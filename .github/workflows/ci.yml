  # Release candidates compare the captured PNGs before shipping, on the
  # release pull request itself (fast depth) as well as its merge group. These
  # images ship as landing-page assets, so a silent baseline
  # invalidation puts a stale product shot on the marketing site. Regeneration
  # happens on the runner (`marketing-screenshots-update.yml` dispatched on
  # main with `-f branch=<this branch>`), which is also why the comparison
  # tolerance can stay tight:
  # baselines and comparison render on the same image.

  marketing-screenshots:
    # A bounded poll can expire while web-build is still waiting for a runner;
    # declare the producer so artifact consumers start only after it succeeds.
    needs: [ci-plan, web-build, heavy-web-build]
    if: >-
      needs.ci-plan.outputs.run_required != 'false'
      && (
      github.event_name != 'pull_request' && (
      needs.ci-plan.outputs.queue_depth != 'thin'
      && (always()
      && (github.event_name != 'merge_group' || !cancelled())
      && (needs.ci-plan.outputs.trusted == 'true'
          || github.event_name == 'workflow_dispatch')
      && needs.ci-plan.outputs.marketing_screenshots_required == 'true'
      && (needs.ci-plan.outputs.web_build_required != 'true'
          || (needs.web-build.result == 'success' || needs.heavy-web-build.result == 'success'))
      )
      )
      )
    uses: ./.github/workflows/marketing-screenshots.yml
    permissions:
      actions: read
      contents: read
    with:
      mode: check
      ref: ${{ inputs.heavy_only == true && inputs.sha || '' }}
      # Serve the same production build the e2e shards use whenever web-build
      # runs in this workflow; the capture job builds it otherwise.
      web-build-artifact: ${{ needs.ci-plan.outputs.web_build_required == 'true' && 'e2e-web-build' || '' }}
    secrets:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}

  # Reusable workflow callers cannot have steps. Cancel immediately after
  # this call fails, without a runner waiting or polling for its result.
  marketing-screenshots-cancel:
    needs: marketing-screenshots
    if: failure() && github.event_name == 'merge_group'
    runs-on: ubuntu-latest
    timeout-minutes: 1
    permissions:
      actions: write
    steps:
