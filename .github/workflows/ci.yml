name: CI

env:
  HAWK_RUST_TOOLCHAIN: "1.97.1"
  HAWK_VERSION: "0.1.11"
  HAWK_X86_64_UNKNOWN_LINUX_GNU_SHA256: "8380db63360ae94f9890d7e426cce00e479d884f516614cea998c85d5f30ab6d"
  UV_VERSION: "0.10.1"

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changeset:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Enforce release intent
        uses: stella/.github/.github/actions/changeset-policy@5628b97fb3c560c0d961baa60c272c598eddcab5 # v1.7.0
        with:
          release-paths: |
            Cargo.lock
            Cargo.toml
            crates/anonymize-adapter-contract/**
            crates/anonymize-core/**
            crates/anonymize-docx-core/**
            crates/anonymize-napi/**
            crates/anonymize-pdf-core/**
            crates/anonymize-py/**
            packages/anonymize/package.json
            packages/anonymize/index.cjs
            packages/anonymize/scripts/**
            packages/anonymize/src/**
            packages/anonymize/tsconfig.json
            packages/anonymize/tsconfig.wasm.json
            packages/anonymize/tsdown.config.ts
            packages/anonymize/wasm/package.json
            packages/anonymize-darwin-arm64/package.json
            packages/anonymize-darwin-x64/package.json
            packages/anonymize-linux-arm64-gnu/package.json
            packages/anonymize-linux-x64-gnu/package.json
            packages/anonymize-win32-x64-msvc/package.json
            packages/cli/package.json
            packages/cli/src/**
            packages/cli/tsconfig.json
            packages/cli/tsdown.config.ts
            packages/document-docx/package.json
            packages/document-docx/src/**
            packages/document-docx/tsconfig.json
            packages/document-docx/tsdown.config.ts
            packages/document-pdf/package.json
            packages/document-pdf/src/**
            packages/document-pdf/tsconfig.json
            packages/document-pdf/tsdown.config.ts
            packages/mcp/package.json
            packages/mcp/scripts/**
            packages/mcp/src/**
            packages/mcp/tsconfig.json
            packages/mcp/tsdown.config.ts
          generated-paths: |
            Cargo.lock
            Cargo.toml
            VERSION
            bun.lock
            crates/anonymize-py/pyproject.toml
            packages/anonymize/CHANGELOG.md
            packages/anonymize/package.json
            packages/anonymize/wasm/CHANGELOG.md
            packages/anonymize/wasm/package.json
            packages/anonymize-darwin-arm64/CHANGELOG.md
            packages/anonymize-darwin-arm64/package.json
            packages/anonymize-darwin-x64/CHANGELOG.md
            packages/anonymize-darwin-x64/package.json
            packages/anonymize-linux-arm64-gnu/CHANGELOG.md
            packages/anonymize-linux-arm64-gnu/package.json
            packages/anonymize-linux-x64-gnu/CHANGELOG.md
            packages/anonymize-linux-x64-gnu/package.json
            packages/anonymize-win32-x64-msvc/CHANGELOG.md
            packages/anonymize-win32-x64-msvc/package.json
            packages/cli/CHANGELOG.md
            packages/cli/package.json
            packages/document-docx/CHANGELOG.md
            packages/document-docx/package.json
            packages/document-pdf/CHANGELOG.md
            packages/document-pdf/package.json
            packages/mcp/CHANGELOG.md
            packages/mcp/package.json
          package-files: |
            packages/anonymize/package.json
            packages/anonymize/wasm/package.json
            packages/anonymize-darwin-arm64/package.json
            packages/anonymize-darwin-x64/package.json
            packages/anonymize-linux-arm64-gnu/package.json
            packages/anonymize-linux-x64-gnu/package.json
            packages/anonymize-win32-x64-msvc/package.json
            packages/cli/package.json
            packages/document-docx/package.json
            packages/document-pdf/package.json
            packages/mcp/package.json

  rust-quality:
    name: Rust correctness and supply chain
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust-ci
        with:
          profile: quality
          cache-scope: quality
      - name: Install pinned Hawk
        shell: bash
        run: |
          set -euo pipefail
          expected_hawk_script="cargo +${HAWK_RUST_TOOLCHAIN} hawk check --target-dir target/hawk -D warnings -A hawk::dead_public -A hawk::unnecessary_public"
          jq -e --arg expected "$expected_hawk_script" \
            '.scripts["rust:hawk"] == $expected' package.json >/dev/null
          archive="$RUNNER_TEMP/cargo-hawk.tar.gz"
          install_dir="$RUNNER_TEMP/cargo-hawk"
          curl --proto '=https' --tlsv1.2 --retry 3 -fsSL \
            -o "$archive" \
            "https://github.com/astral-sh/hawk/releases/download/${HAWK_VERSION}/cargo-hawk-x86_64-unknown-linux-gnu.tar.gz"
          echo "${HAWK_X86_64_UNKNOWN_LINUX_GNU_SHA256}  ${archive}" | sha256sum --check
          mkdir -p "$install_dir"
          tar -xzf "$archive" -C "$install_dir" --strip-components=1
          echo "$install_dir" >> "$GITHUB_PATH"
          rustup toolchain install "$HAWK_RUST_TOOLCHAIN" --profile minimal
      - name: Rust checks
        run: bun run rust:check
      - name: Hawk visibility lint
        run: bun run rust:hawk
      - name: Cargo deny (supply chain)
        run: bun run rust:deny
      - name: Snapshot hygiene (insta)
        run: bun run rust:snapshot-check

  detached-rust:
    name: Detached Rust workspaces
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust-ci
        with:
          profile: detached
          cache-scope: detached
      - name: Native Nym cargo deny (supply chain)
        run: >-
          cargo deny --locked
          --manifest-path packages/benchmark/native/nym-adapter/Cargo.toml
          --config packages/benchmark/native/nym-adapter/deny.toml
          check
      - name: Fuzz targets compile (anti-bitrot)
        run: cargo check --manifest-path fuzz/Cargo.toml --bins
      - name: Native Nym benchmark adapter
        run: |
          cargo fmt --check --manifest-path packages/benchmark/native/nym-adapter/Cargo.toml
          cargo clippy --locked --all-targets \
            --manifest-path packages/benchmark/native/nym-adapter/Cargo.toml \
            -- -D warnings
          cargo test --release --locked \
            --manifest-path packages/benchmark/native/nym-adapter/Cargo.toml

  build:
    name: Build verified workspace
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-bun-workspace
        with:
          repository-checks: "true"
      - name: Audit Bun dependencies
        run: bun audit
      - uses: ./.github/actions/setup-rust-ci
        with:
          profile: build
          cache-scope: build
      - name: Check runtime package versions
        run: bun run check:version
      - name: Setup browser WebAssembly tools
        uses: ./.github/actions/setup-browser-wasm
      - name: Build
        run: bun run build
      - name: Stage cache-external build outputs
        shell: bash
        run: |
          set -euo pipefail
          target=crates/anonymize-py/python/stella_anonymize/native_packages
          rm -rf "$target"
          mkdir -p "$target"
          cp packages/anonymize/native-pipeline*.stlanonpkg "$target/"
          cp packages/anonymize/default-pipeline-input.json.gz "$target/"
      - name: Archive build outputs
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          required=(
            packages/anonymize/dist
            packages/anonymize/native-wasm-dist
            packages/anonymize/default-pipeline-input.json.gz
            packages/anonymize/wasm/dist
            packages/cli/dist
            packages/data/dist
            packages/document-docx/dist
            packages/document-pdf/dist
            packages/mcp/dist
          )
          for path in "${required[@]}"; do
            if [[ ! -e "$path" ]]; then
              echo "::error::Build did not produce $path"
              exit 1
            fi
          done

          native_packages=(packages/anonymize/native-pipeline*.stlanonpkg)
          python_packages=(
            crates/anonymize-py/python/stella_anonymize/native_packages/*.stlanonpkg
          )
          python_default_input=crates/anonymize-py/python/stella_anonymize/native_packages/default-pipeline-input.json.gz
          sidecars=(packages/anonymize-*/stella_anonymize_napi.node)
          if [[ "${#native_packages[@]}" -eq 0 ]]; then
            echo "::error::Build did not produce a native pipeline package"
            exit 1
          fi
          if [[ "${#python_packages[@]}" -eq 0 ]]; then
            echo "::error::Build did not stage the Python pipeline package"
            exit 1
          fi
          if [[ ! -f "$python_default_input" ]]; then
            echo "::error::Build did not stage the Python default pipeline input"
            exit 1
          fi
          if [[ "${#sidecars[@]}" -eq 0 ]]; then
            echo "::error::Build did not produce a native platform sidecar"
            exit 1
          fi

          trap 'rm -f .ci-build-sha' EXIT
          printf '%s\n' "$GITHUB_SHA" > .ci-build-sha
          outputs=(
            .ci-build-sha
            packages/*/dist
            packages/anonymize/wasm/dist
            packages/anonymize/native-wasm-dist
            packages/anonymize/default-pipeline-input.json.gz
            packages/anonymize/native-pipeline*.stlanonpkg
            packages/anonymize-*/stella_anonymize_napi.node
            crates/anonymize-py/python/stella_anonymize/native_packages/*.stlanonpkg
            "$python_default_input"
          )
          tar -czf "$RUNNER_TEMP/ci-build.tar.gz" -- "${outputs[@]}"
      - name: Upload build outputs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v5
        with:
          name: ci-build
          path: ${{ runner.temp }}/ci-build.tar.gz
          if-no-files-found: error
          retention-days: 1

  scaling:
    name: Native scaling regression suite
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust-ci
        with:
          profile: scaling
          cache-scope: scaling
      - name: Run every scaling contract
        run: >-
          cargo test --release --locked -p stella-anonymize-core
          -- --ignored --test-threads=1

  static:
    name: Static checks
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-built-workspace
      - name: Lint
        run: bun run lint
      - name: Verify data mirror
        run: bun run --cwd packages/data check:mirror
      - name: Format
        run: bun run format:check
      - name: Typecheck
        run: bun run typecheck:built
      - name: Knip (unused/undeclared deps)
        run: bun run check:knip

  tests:
    name: Tests
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-built-workspace
      - uses: ./.github/actions/setup-rust-ci
        with:
          profile: consumer
          cache-scope: build
      - name: Test
        run: bun run test:built

  python:
    name: Python
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-built-workspace
      - uses: ./.github/actions/setup-rust-ci
        with:
          profile: consumer
          cache-scope: build
      - name: Install uv
        shell: bash
        run: |
          python3 -m pip install --user "uv==${{ env.UV_VERSION }}"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Python typecheck
        run: bun run python:typecheck
      - name: Python wheel
        run: bun run python:wheel

  packages:
    name: Package and browser compatibility
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-built-workspace
      - name: Package exports (publint + attw)
        run: bun run check:exports
      - name: Verify package tarballs
        run: node .github/tools/check-packlist.mjs
      - name: Enforce native install footprint
        run: bun run --cwd packages/anonymize check:native-install-footprint
      - name: Smoke test native addon under Bun
        run: bun run --cwd packages/anonymize smoke:dist
      - name: Smoke test wasm binding + package entry across runtimes
        run: bun run --cwd packages/anonymize smoke:wasm-runtimes
      - name: Smoke test wasm entry inside a compiled single binary
        run: bun run --cwd packages/anonymize smoke:wasm-compiled
      - name: Smoke test wasm browser path
        env:
          CHROME_BIN: /usr/bin/google-chrome-stable
        run: bun run --cwd packages/anonymize smoke:wasm-browser

  parity:
    name: Runtime parity
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-built-workspace
      - uses: ./.github/actions/setup-rust-ci
        with:
          profile: consumer
          cache-scope: build
      - name: Native fixture parity
        run: bun run --cwd packages/anonymize test:native-fixtures
      - name: Native adapter parity and timings
        run: bun run --cwd packages/anonymize perf:native-adapters
      - name: Native default SDK parity and timings
        run: bun run --cwd packages/anonymize perf:native-default

  mcp-node20:
    name: MCP Node 20
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-built-workspace
      - uses: ./.github/actions/setup-rust-ci
        with:
          profile: consumer
          cache-scope: build
      - name: Setup minimum supported Node for MCP
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: "20.20.2"
          registry-url: https://registry.npmjs.org
          scope: "@stll"
      - name: MCP Node 20 native-lock and packed-bin smoke
        run: bun run --cwd packages/mcp test:node-runtime

  validate:
    name: validate
    if: always()
    needs:
      - rust-quality
      - detached-rust
      - build
      - scaling
      - static
      - tests
      - python
      - packages
      - parity
      - mcp-node20
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Require every validation lane
        shell: bash
        env:
          RUST_QUALITY: ${{ needs.rust-quality.result }}
          DETACHED_RUST: ${{ needs.detached-rust.result }}
          BUILD: ${{ needs.build.result }}
          SCALING: ${{ needs.scaling.result }}
          STATIC: ${{ needs.static.result }}
          TESTS: ${{ needs.tests.result }}
          PYTHON: ${{ needs.python.result }}
          PACKAGES: ${{ needs.packages.result }}
          PARITY: ${{ needs.parity.result }}
          MCP_NODE20: ${{ needs.mcp-node20.result }}
        run: |
          set -euo pipefail
          for result in \
            "$RUST_QUALITY" \
            "$DETACHED_RUST" \
            "$BUILD" \
            "$SCALING" \
            "$STATIC" \
            "$TESTS" \
            "$PYTHON" \
            "$PACKAGES" \
            "$PARITY" \
            "$MCP_NODE20"; do
            if [[ "$result" != "success" ]]; then
              echo "::error::Validation lane finished with '$result'"
              exit 1
            fi
          done
