        with:
          retries: 0
          script: |
            let diagnostic;
            let evidenceTimer;
            try {
              const jobs = await Promise.race([
                github.paginate(
                  "GET /repos/{owner}/{repo}/actions/runs/{run_id}/attempts/{attempt_number}/jobs",
                  {
                    ...context.repo,
                    run_id: context.runId,
                    attempt_number: Number(process.env.GITHUB_RUN_ATTEMPT),
                    per_page: 100,
                    request: { timeout: 10000 },
                  },
                ),
                new Promise((_, reject) => {
                  evidenceTimer = setTimeout(() => reject(new Error("Failed-step lookup timed out")), 10000);
                }),
              ]);
              const failures = jobs.flatMap((job) => (job.steps || [])
                .filter((step) => step.conclusion === "failure")
                .map((step) => `${job.name} / ${step.number}: ${step.name} (${job.html_url})`));
              diagnostic = `${context.job}: cancelling failed merge group; failed steps: ${failures.length ? failures.join("; ") : "not yet available from the jobs API"}`;
            } catch {
              diagnostic = `${context.job}: cancelling failed merge group; failed-step lookup unavailable`;
            } finally {
              clearTimeout(evidenceTimer);
            }
            core.error(diagnostic);
            try {
              core.summary.addRaw(`${diagnostic}\n`);
              await core.summary.write();
            } catch {
              core.error(`${context.job}: cancellation step summary could not be written`);
            }
            await github.rest.actions.cancelWorkflowRun({
              ...context.repo,
              run_id: context.runId,
            });

  # API suites that need real services, at full depth or on scoped PRs. The Postgres
  # suites use behavior PGlite cannot reproduce (partial indexes, advisory
  # locks, roles, and policies); the Valkey suites drive real BullMQ queues and
  # workers. Each runner derives its file set from the gate the suites declare,
  # so PR and nightly coverage share one source of truth instead of mirrored
  # YAML manifests. One install serves API and collaboration suites; the
  # latter use a separate Redis container that recovery tests stop.
  service-suites:
    needs: ci-plan
    if: >-
      needs.ci-plan.outputs.run_required != 'false'
      && (
      (github.event_name != 'pull_request' || vars.CI_POSTGRES_PR_SELECTION == 'on') && (
      needs.ci-plan.outputs.queue_depth != 'thin'
      && (needs.ci-plan.outputs.service_suites_required == 'true'
      && (needs.ci-plan.outputs.trusted == 'true'
          || github.event_name == 'workflow_dispatch')
      && (needs.ci-plan.outputs.suite_depth == 'full'
          || (needs.ci-plan.outputs.suite_depth == 'fast'
              && needs.ci-plan.outputs.service_suites_pr_required == 'true'))
      )
      )
      )
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: write
    services:
      redis:
        image: redis:8@sha256:298e5b3bc566bade82f46ad5511777a4a07a294097ce16ada2f6a42be5239df5
        ports:
          - 6380:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 10

