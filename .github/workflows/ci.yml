        # Shared-pool timeout changes must go through the budget-owning setter.
        # Dedicated work and online migrations have their own connection owner.
        run: |
          bun test scripts/check-api-timeout-mutations.test.ts
          bun run check:api-timeout-mutations

      - name: Result consumption
        env:
          BASE_REF: ${{ github.base_ref || 'main' }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            bun run check:result-consumption -- --all --leg rest
          else
            bun run check:result-consumption -- --base "origin/$BASE_REF" --leg rest
