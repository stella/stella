        if: always() && steps.e2e-stack.outputs.status == 'ready'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-blob-vite-canary
          path: apps/web/e2e/test-results/blob-report/
          retention-days: 7

      - name: Upload collaboration failure artifacts
        if: failure() && steps.e2e-stack.outputs.status == 'ready'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-collab-vite-canary
          path: apps/web/e2e/test-results-collab/
          retention-days: 7

      - name: Upload server logs
        if: failure() && steps.e2e-stack.outputs.status == 'ready'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: server-logs-vite-canary
          path: |
            /tmp/api.log
            /tmp/collab.log
            /tmp/web.log
          retention-days: 7

      - name: Upload browser test timings
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-vite-canary-timings
          path: .cache/playwright-timings/*.json
          retention-days: 7
          if-no-files-found: ignore

      - name: Cancel failed merge-group run
