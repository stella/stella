          PLAYWRIGHT_BLOB_OUTPUT_NAME: report-network-baseline.zip
        run: bash "$GITHUB_WORKSPACE/.github/actions/setup-playwright/run-in-image.sh" bun --filter @stll/web test:e2e -- route-smoke.spec.ts

      # Playwright clears its report directory at the next invocation.
      - name: Upload network baseline blob report
        if: >-
          always()
          && steps.e2e-stack.outputs.status == 'ready'
          && matrix.shard == 'network-baseline'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: network-baseline-blob
          path: apps/web/e2e/test-results/blob-report/
          retention-days: 7

      - name: Run Playwright shard
        if: >-
          steps.e2e-stack.outputs.status == 'ready'
          && matrix.shard != 'network-baseline'
        env:
          PLAYWRIGHT_JSON_OUTPUT_FILE: ${{ github.workspace }}/.cache/playwright-timings/run-playwright-shard.json
          E2E_EXECUTION_PROFILE: ci-production-parallel
          E2E_EXPECT_DEV_ROUTES: "false"
        run: >-
          bash "$GITHUB_WORKSPACE/.github/actions/setup-playwright/run-in-image.sh" bun --filter @stll/web test:e2e --
          --grep-invert='route-smoke'
          --shard=${{ matrix.shard }}/2

      # API-owned browser checks (visual sandbox) need the API from this stack
      # but no web app; one shard runs them.
      - name: Run API browser checks
        if: >-
          !cancelled()
          && steps.e2e-stack.outputs.status == 'ready'
          && matrix.shard == 1
        env:
