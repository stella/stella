        if: ${{ !cancelled() && steps.install.outcome == 'success' && (needs.ci-plan.outputs.package_checks_required == 'true') }}
        # Whole-repo metrics compare to a measured export of RATCHET_BASE_REF.
        # A rise fails; decreases require no committed baseline update. Both
        # trees use the current registry, including per-file ceilings.
        # The self-test proves counter and gate behavior before the comparison.
        run: |
          bun test scripts/ratchet-improvements.test.ts scripts/autofix-ratchet-boundary.test.ts scripts/ratchet-derived-totals.test.ts
          bun scripts/ratchet.ts --self-test
          bun scripts/ratchet.ts --check

      - name: Ratchet scanner invariants
        if: ${{ !cancelled() && steps.install.outcome == 'success' && (needs.ci-plan.outputs.package_checks_required == 'true') }}
        run: bun test scripts/ratchet-scan.test.ts

      - name: Deployment feature guard
        if: ${{ !cancelled() && steps.install.outcome == 'success' && (needs.ci-plan.outputs.package_checks_required == 'true') }}
        # Every declared deployment flag has a reader and every flag read is
        # declared; no flag is read off the raw process environment; across the
        # real route tree a capability tagged with a flag is mounted behind a
        # gate on that flag, and every route file is classified. Existing gaps
        # sit in apps/api/deployment-feature-baseline.json, which may only
        # shrink against the measured base. The --self-test run first proves
        # each detector fires on mutated copies of the real tree.
        run: |
          bun apps/api/scripts/deployment-feature-guard.ts --self-test
          bun apps/api/scripts/deployment-feature-guard.ts --base "$RATCHET_BASE_REF"

      - name: GitHub API command ownership
        if: ${{ !cancelled() && steps.install.outcome == 'success' && (needs.ci-plan.outputs.package_checks_required == 'true') }}
        run: |
          bun test scripts/check-gh-retry.test.ts scripts/gh-retry.test.ts scripts/promote-dispatch.test.ts
          bun scripts/check-gh-retry.ts

      - name: SHA-256 migration ledger
        if: ${{ !cancelled() && steps.install.outcome == 'success' && (needs.ci-plan.outputs.package_checks_required == 'true') }}
        run: bun scripts/sha256-migration-ledger.ts --base "$RATCHET_BASE_REF"

      - name: Custom lint rule coverage
        if: ${{ !cancelled() && steps.install.outcome == 'success' && (needs.ci-plan.outputs.package_checks_required == 'true') }}
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || '' }}
        run: |
          bun test scripts/check-oxlint-rule-coverage.test.ts
          bun scripts/check-oxlint-rule-coverage.ts

      - name: Documentation source policy rule
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        # Every direct dependency must have an exact llms.txt source or a
        # time-bounded, explained quarantine.
        run: bun run check:docs-sources

      - name: Instruction references
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        # AGENTS.md and .claude/skills/*/SKILL.md name repository
        # paths, package scripts, module exports and oxlint rule ids that
        # nothing compiles, so a rename leaves the instruction quietly wrong and
        # every agent reading it is misled. This guard resolves each named
        # reference against the tree. Intentional examples live in
        # scripts/instruction-references-allowlist.json, and an entry that
        # suppresses nothing fails as stale. The --self-test run first proves
        # each matcher still fires, so a broken guard cannot pass silently.
        run: |
          bun scripts/check-instruction-references.ts --self-test
          bun run check:instruction-references

      - name: Knip production dependency checks
        if: ${{ !cancelled() && steps.install.outcome == 'success' && (needs.ci-plan.outputs.package_checks_required == 'true') }}
        # Static gate paired with the image boot smokes (api-image-smoke,
        # api-image-deps): knip --strict verifies production code imports
        # only `dependencies` (never a devDependency) and flags transitively
        # resolved (phantom) packages a `turbo prune` would drop. Scoped to
        # the apps that ship a pruned runtime; each declares its real
        # production entry (a `!` entry, a start script, or the SSR server
        # entry). New runtimes are enrolled here deliberately, alongside a
        # boot/compile smoke.
        run: |
          for workspace in apps/api apps/legal-atlas-runner apps/web; do
            DATABASE_URL=postgresql://invalid bun --no-env-file run knip --production --strict --no-progress --include unlisted,unresolved --workspace "$workspace"
          done

      - name: Knip workspace dependency checks
        if: ${{ !cancelled() && steps.install.outcome == 'success' && (needs.ci-plan.outputs.package_checks_required == 'true') }}
        # Include test and tooling imports in every workspace. The production
        # gate above also checks deployment boundaries for the server apps.
        run: bun run dependencies:check

      - name: Knip dead-export check (packages/cli)
        if: ${{ !cancelled() && steps.install.outcome == 'success' && (needs.ci-plan.outputs.package_checks_required == 'true') }}
        # The CLI is small enough to enforce the `exports`/`types` issue
        # types today (the apps above are not; see the note in the step
        # before). An exported helper that no runtime or test path calls is
        # how "login never persists the default server" shipped: the
        # persistence function existed, unused. Test files are entries in
        # knip.json so test-only exports count as used; anything else that
        # is exported but unreferenced fails here.
        run: |
          DATABASE_URL=postgresql://invalid bun --no-env-file run knip --no-progress --include exports,types,nsExports --workspace packages/cli

      - name: Knip dead-export budget (all workspaces)
        if: ${{ !cancelled() && steps.install.outcome == 'success' && (needs.ci-plan.outputs.package_checks_required == 'true') }}
        # What the packages/cli step enforces at zero, every other workspace
        # carries as a decrease-only budget: one knip run for the whole repo,
        # counted per workspace against scripts/knip-exports-baseline.json. A
        # rise fails here and names the offending symbols; a fall only prompts
        # `bun scripts/knip-exports-ratchet.ts --write` so the improvement can
        # never regress. The parser tests run first, so a broken summary cannot
        # pass silently.
        run: |
          bun test scripts/knip-exports-ratchet.test.ts
          bun run check:knip-exports

      - name: Cancel failed merge-group run
        if: failure() && github.event_name == 'merge_group'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          retries: 0
          script: |
            let diagnostic;
            let evidenceTimer;
            try {
              const jobs = await Promise.race([
                github.paginate(
                  "GET /repos/{owner}/{repo}/actions/runs/{run_id}/attempts/{attempt_number}/jobs",
                  {
                    ...context.repo,
                    run_id: context.runId,
                    attempt_number: Number(process.env.GITHUB_RUN_ATTEMPT),
                    per_page: 100,
                    request: { timeout: 10000 },
                  },
                ),
                new Promise((_, reject) => {
                  evidenceTimer = setTimeout(() => reject(new Error("Failed-step lookup timed out")), 10000);
                }),
              ]);
              const failures = jobs.flatMap((job) => (job.steps || [])
                .filter((step) => step.conclusion === "failure")
                .map((step) => `${job.name} / ${step.number}: ${step.name} (${job.html_url})`));
              diagnostic = `${context.job}: cancelling failed merge group; failed steps: ${failures.length ? failures.join("; ") : "not yet available from the jobs API"}`;
            } catch {
              diagnostic = `${context.job}: cancelling failed merge group; failed-step lookup unavailable`;
            } finally {
              clearTimeout(evidenceTimer);
            }
            core.error(diagnostic);
            try {
              core.summary.addRaw(`${diagnostic}\n`);
              await core.summary.write();
            } catch {
              core.error(`${context.job}: cancellation step summary could not be written`);
            }
            await github.rest.actions.cancelWorkflowRun({
              ...context.repo,
              run_id: context.runId,
            });

  ci-checks-rest:
    needs: [ci-plan, ci-generated-sources]
    if: >-
      needs.ci-plan.outputs.run_required != 'false'
      && (
      inputs.heavy_only != true
      && (
        needs.ci-plan.outputs.trusted == 'true'
        || github.event_name == 'workflow_dispatch'
      )
      && needs.ci-plan.outputs.package_checks_required == 'true'
      )
    runs-on: ubuntu-latest
    # 25m, matching code-quality.
    timeout-minutes: 25
    permissions:
      contents: read
      # Release PR state for the release CLI changeset hold.
      pull-requests: read
      actions: write
    env:
      CI_GENERATED_SOURCES_MANIFEST: ${{ github.workspace }}/.cache/ci-generated-sources/manifest.json
    steps:
      - name: Checkout
        id: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false
          submodules: true

      - name: Check AI prompt sync
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' && (needs.ci-plan.outputs.package_checks_required == 'true') }}
        run: bash .ai/shared/scripts/sync-ai-skills.sh --check .

      - name: Check AI verification guards
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' && (needs.ci-plan.outputs.package_checks_required == 'true') }}
        run: |
          bash scripts/check-ai-skill-sync.test.sh
          bash scripts/verify-step.test.sh

      - name: Check local base selection
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' && (needs.ci-plan.outputs.package_checks_required == 'true') }}
        run: bash scripts/canonical-base.test.sh

      - name: Check local skill overrides
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' && (needs.ci-plan.outputs.package_checks_required == 'true') }}
        run: |
          bash scripts/check-local-skill-overrides.sh .
          bash scripts/check-local-skill-overrides.test.sh

      - name: Setup Bun
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        uses: stella/.github/actions/setup-bun-cached@167fb396c6c0f4e07296ad2cd72e6ef15367c776
        with:
          save: ${{ github.ref == 'refs/heads/main' }}
          bun-version-file: "package.json"

      # The changeset gate for pull requests. It reads only the policy file
      # and git history, so it runs here, before any dependency install.
      - name: Load release policy
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' && (github.event_name == 'pull_request') }}
        # scripts/changeset-policy.json is the single source of truth for which
        # paths are release-gated: scripts/changeset-guard.ts matches the same
        # lists at pre-push, so this failure reaches the developer before CI
        # spends a whole run to report it. Inlining the lists here again would
        # let the two sides gate different paths.
        id: policy
        run: |
          {
            echo "release_paths<<POLICY_EOF"
            jq -er '.releasePaths[]' scripts/changeset-policy.json
            echo "POLICY_EOF"
            echo "generated_paths<<POLICY_EOF"
            jq -er '.generatedPaths[]' scripts/changeset-policy.json
            echo "POLICY_EOF"
            echo "package_files<<POLICY_EOF"
            jq -er '.packageFiles[]' scripts/changeset-policy.json
            echo "POLICY_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Published package lists match the release policy
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' && (github.event_name == 'pull_request') }}
        # CONTRIBUTING.md and .changeset/README.md tell contributors which
        # packages need a changeset. Both are rendered from the same policy
        # these steps gate on, so neither can name a different set. The script
        # reads only the policy file and needs no dependency install.
        run: bun scripts/check-published-package-lists.ts --check

      - name: Changeset packages match changed files
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' && (github.event_name == 'pull_request') }}
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: bun scripts/changeset-guard.ts --base "$BASE_SHA" --packages-only

      - name: Changeset present for published package changes
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' && (github.event_name == 'pull_request') && steps.policy.outcome == 'success' }}
        # The repository owner publishes this versioned shared contract.
        uses: stella/.github/.github/actions/changeset-policy@167fb396c6c0f4e07296ad2cd72e6ef15367c776 # v1.8.0
        with:
          release-paths: ${{ steps.policy.outputs.release_paths }}
          generated-paths: ${{ steps.policy.outputs.generated_paths }}
          package-files: ${{ steps.policy.outputs.package_files }}
          version-file: bun.lock

      - name: Validate AI skills
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' && (needs.ci-plan.outputs.package_checks_required == 'true') }}
        run: bun .ai/shared/scripts/validate-skills.ts .agents/skills

      - name: Standalone lockfile guard
        id: standalone_lockfiles
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        # Bun reads only the installing directory's bunfig.toml, so a lockfile
        # outside the root workspace skips the root's release-age quarantine,
        # and an npm, Yarn or pnpm lockfile skips it entirely. Needs no
        # dependency install.
        run: |
          bun test scripts/check-standalone-lockfiles.test.ts
          bun scripts/check-standalone-lockfiles.ts

      - name: Tauri package alignment
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || '' }}
        run: |
          required=true
          if [[ -n "$BASE_SHA" ]]; then
            git diff --name-only "$BASE_SHA" HEAD > "$RUNNER_TEMP/tauri-changed-files"
            mapfile -t files < "$RUNNER_TEMP/tauri-changed-files"
            required=$(bun scripts/check-tauri-package-alignment.ts --requires-check "${files[@]}")
          fi
          if [[ "$required" == true ]]; then
            bun test scripts/check-tauri-package-alignment.test.ts
            bun scripts/check-tauri-package-alignment.ts
          fi

      - name: Tauri counterpart autofix tests
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        run: bun test scripts/fix-tauri-package-alignment.test.ts scripts/tauri-autofix-workflow.test.ts

      - name: Lockfile release-age guard
        id: lockfile_ages
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' && (github.event_name != 'workflow_dispatch' && needs.ci-plan.outputs.lockfile_ages_required == 'true') }}
        # Bun applies the release-age quarantine only while it resolves
        # versions; a frozen install takes whatever bun.lock pins. This looks
        # up the publish time of each pin new against the merge base, in every
        # tracked lockfile, and fails one the governing bunfig.toml would not
        # yet admit (its excludes honoured). A registry failure fails it too.
        # Runs before the install, so a quarantined pin never executes here,
        # and again on the queued tree, whose base may govern it differently.
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
        run: |
          bun test scripts/check-lockfile-release-ages.test.ts
          bun scripts/check-lockfile-release-ages.ts --base "$BASE_SHA"

      - name: Turbo remote cache
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' && (needs.ci-plan.outputs.package_checks_required == 'true') }}
        uses: rharkor/caching-for-turbo@2238fae6eb9a9936f92356f54cb3660200d105e7 # v2.5.1
        with:
          server-port: "0"

      - name: Install dependencies
        id: install
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' && (needs.ci-plan.outputs.package_checks_required == 'true') && steps.standalone_lockfiles.outcome == 'success' && (!(github.event_name != 'workflow_dispatch' && needs.ci-plan.outputs.lockfile_ages_required == 'true') || steps.lockfile_ages.outcome == 'success') }}
        run: bash scripts/retry.sh bun ci --ignore-scripts
        env:
          # .npmrc references NPM_TOKEN, but PR installs must not expose
          # the real npm token to dependency lifecycle scripts.
          NPM_TOKEN: ""

      - name: Download generated sources
        if: ${{ !cancelled() && steps.install.outcome == 'success' && (needs.ci-plan.outputs.package_checks_required == 'true') }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: generated-sources-${{ needs.ci-generated-sources.outputs.input_hash }}
          path: ${{ runner.temp }}/generated-sources
      - name: Restore generated sources
        if: ${{ !cancelled() && steps.install.outcome == 'success' && (needs.ci-plan.outputs.package_checks_required == 'true') }}
        run: bun scripts/ci-generated-sources.ts restore "$RUNNER_TEMP/generated-sources"

      - name: Prepare route network manifest
        id: network_manifest_prepare
        if: ${{ !cancelled() && steps.install.outcome == 'success' && (needs.ci-plan.outputs.package_checks_required == 'true') }}
        timeout-minutes: 1
        uses: ./.github/actions/prepare-network-baseline
        with:
          base-sha: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.sha }}
          token: ${{ github.token }}

      - name: Route network manifest coverage
        if: ${{ !cancelled() && steps.install.outcome == 'success' && (needs.ci-plan.outputs.package_checks_required == 'true' && steps.network_manifest_prepare.outcome == 'success') }}
        timeout-minutes: 1
        run: |
          timeout 30s bash -c '
            bun test scripts/network-baseline-coverage.test.ts &&
            bun scripts/network-baseline-scope.ts validate apps/web/e2e/network-baseline.json --route-tree apps/web/src/routeTree.gen.ts --context apps/web/e2e/.network-baseline-context.json
          '

      - name: Restore route network baseline
        # Continue after a failed prepare/check, only when preparation could run.
        if: ${{ !cancelled() && steps.install.outcome == 'success' && (needs.ci-plan.outputs.package_checks_required == 'true') }}
        run: |
          git checkout -- apps/web/e2e/network-baseline.json
          rm -f apps/web/e2e/.network-baseline-*

      - name: Prepare environment
        if: ${{ !cancelled() && steps.install.outcome == 'success' && (needs.ci-plan.outputs.package_checks_required == 'true') }}
        # `cp`, not `mv`: renaming the tracked .env.example dirties the
        # working tree in apps/api and apps/web, and `turbo --affected`
        # counts working-tree changes — so every PR (even web-only ones)
        # ran the api AND web test suites concurrently and could OOM the
        # runner (exit 137). The copy leaves the tree clean; .env is
        # gitignored and invisible to affected-detection.
        run: |
          cd ./apps/api
          cp .env.example .env
          cd ../web
          cp .env.example .env

      - name: Content delivery declarations
        if: ${{ !cancelled() && steps.install.outcome == 'success' && (needs.ci-plan.outputs.package_checks_required == 'true') }}
        # The guard follows handler imports into the gitignored capability
        # runtime modules, so generate them first instead of skipping them.
        run: |
          bun scripts/ci-generated-sources.ts prepare
          bun apps/api/scripts/content-delivery-guard.ts --self-test
          bun apps/api/scripts/content-delivery-guard.ts

      # Three measured long checks use isolated temporary fixtures. Keep one
      # of the four runner CPUs available for the foreground checks.
      - name: Test capability shard merge and package parity
        id: capability_parity
        background: true
        if: ${{ !cancelled() && steps.install.outcome == 'success' && (needs.ci-plan.outputs.package_checks_required == 'true') }}
        # Worst pilot test 153.3 s; 400 s allows about 2.5x contention headroom.
        run: bun test --timeout 400000 scripts/capability-shard-merge.test.ts scripts/capability-shard-pack.test.ts

      # Root script tests belong to no workspace package, so no scoped test
      # run reaches them. Other steps call some by path; this runs every
      # other one, so a new test cannot miss CI by missing a step.
      - name: Test remaining repository scripts
        id: remaining_scripts
        background: true
        if: ${{ !cancelled() && steps.install.outcome == 'success' && (needs.ci-plan.outputs.package_checks_required == 'true') }}
        # Worst pilot test 13.62 s; 35 s allows about 2.5x contention headroom.
        run: bun scripts/run-unlisted-script-tests.ts --timeout 35000

      - name: Test release image CI gate
        if: ${{ !cancelled() && steps.install.outcome == 'success' && (needs.ci-plan.outputs.package_checks_required == 'true') }}
        # Worst pilot test 18.56 s; 50 s allows about 2.5x contention headroom.
        run: bun test --timeout 50000 scripts/ci-plan.test.ts

      - name: Workspace hygiene
        if: ${{ !cancelled() && steps.install.outcome == 'success' && (needs.ci-plan.outputs.package_checks_required == 'true') }}
        # Restored from the bun postinstall lifecycle, which is bypassed
        # by `--ignore-scripts` above. sherif catches cross-package
        # dependency drift and workspace-hygiene.ts catches misnamed
        # apps/* and packages/* directories. ci-checks is the only job
        # that needs this — its trigger (any non-workflow file changes)
        # is a superset of web-build, landing-build, db-migrations, and
        # nightly-typecheck, so coverage is identical to running it in
        # each install.
        run: bun run lint:ws

      - name: Dependabot group guard
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' && steps.install.outcome != 'failure' && steps.standalone_lockfiles.outcome != 'failure' && steps.lockfile_ages.outcome != 'failure' }}
        # Related framework and plugin updates must stay in one PR even when
        # upstream moves packages between scopes.
        run: bun test scripts/dependabot-grouping.test.ts

      - name: Lockfile workspace-version guard
        if: ${{ !cancelled() && steps.install.outcome == 'success' && (needs.ci-plan.outputs.package_checks_required == 'true') }}
        # `bun.lock` caches each workspace's `name`/`version`; `bun install`
        # (frozen or not) never rewrites that cache when only a workspace's
        # own package.json version changes, and `bun pm pack`/`bun publish`
        # read the stale cached version when resolving a dependent's
        # `workspace:^`/`workspace:~` range at publish time. Catches drift
        # before a published @stll/* package ships a wrong dependency range.
        run: bun scripts/check-lockfile-workspace-versions.ts

      - name: Resolution range guard
        if: ${{ !cancelled() && steps.install.outcome == 'success' && (needs.ci-plan.outputs.package_checks_required == 'true') }}
        # A root `resolutions`/`overrides` entry force-overrides a package's
        # version everywhere, ignoring the ranges its dependents declare, and
        # bun applies it without erroring even when it pins the package BELOW a
        # dependent's floor. That is silent at install and only surfaces as a
        # MISSING_EXPORT at build/runtime (how a stale folio-core/docx-core pin
        # broke folio). This fails when a resolution holds a dependency below
        # any dependent's required floor; intentional overrides are allowlisted
        # in the guard.
        run: bun scripts/check-resolution-ranges.ts

      - name: Quarantine-exclude guards
        if: ${{ !cancelled() && steps.install.outcome == 'success' && (needs.ci-plan.outputs.package_checks_required == 'true') }}
        # The 5-day release-age quarantine is excluded per package for
        # first-party @stll/* code, and bun matches those entries EXACTLY (a
        # `@stll/*` glob is accepted and ignored). List a napi package without
        # its platform subpackages and the parent installs while its binaries
        # stay quarantined — and a quarantined optionalDependency is skipped
        # SILENTLY, so the package imports fine and throws on first use. This
        # fails when the exclude list stops covering everything in the lock.
        # Temporary third-party exemptions carry an exact expiry so the same
        # check also fails once Bun's release-age gate can take over again.
        run: |
          bun test scripts/check-stll-quarantine-excludes.test.ts
          bun scripts/check-stll-quarantine-excludes.ts

      - name: Policy evidence
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' && steps.install.outcome != 'failure' && steps.standalone_lockfiles.outcome != 'failure' && steps.lockfile_ages.outcome != 'failure' }}
        run: bun run policies:check

      - name: Marketing content check
        if: ${{ !cancelled() && steps.install.outcome == 'success' && (needs.ci-plan.outputs.package_checks_required == 'true') }}
        run: bun run marketing:check

      - name: Railway template shape
        if: ${{ !cancelled() && steps.install.outcome == 'success' && (needs.ci-plan.outputs.package_checks_required == 'true') }}
        run: bun run check:railway-template

      - name: Check i18n sync
        if: ${{ !cancelled() && steps.install.outcome == 'success' && (needs.ci-plan.outputs.package_checks_required == 'true') }}
        run: bun run i18n:check

      - name: Release changelog guard
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' && steps.install.outcome != 'failure' && steps.standalone_lockfiles.outcome != 'failure' && steps.lockfile_ages.outcome != 'failure' && (github.event_name == 'pull_request' || github.event_name == 'merge_group') }}
        env:
          BASE_REF: ${{ github.base_ref || 'main' }}
        run: bash scripts/check-release-changelog.sh --base "origin/$BASE_REF"

      # Same verdict the tag workflow gives after merge, delivered while the
      # release pull request can still wait for the Version Packages one.
      - name: Release CLI coupling guard
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' && steps.install.outcome != 'failure' && steps.standalone_lockfiles.outcome != 'failure' && steps.lockfile_ages.outcome != 'failure' && (github.event_name == 'pull_request' || github.event_name == 'merge_group') }}
        env:
          BASE_REF: ${{ github.base_ref || 'main' }}
        run: bun scripts/check-cli-release-coupling.ts --base "origin/$BASE_REF"

      # Hold CLI changesets while a release is open or main's VERSION awaits
      # its tag. Pull request runs warn; merge queue runs enforce the hold.
      - name: Release CLI changeset hold
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' && steps.install.outcome != 'failure' && steps.standalone_lockfiles.outcome != 'failure' && steps.lockfile_ages.outcome != 'failure' && (github.event_name == 'pull_request' || github.event_name == 'merge_group') }}
        env:
          BASE_REF: ${{ github.base_ref || 'main' }}
          EVENT_NAME: ${{ github.event_name }}
          GH_TOKEN: ${{ github.token }}
          MERGE_GROUP_HEAD_REF: ${{ github.event.merge_group.head_ref }}
          PULL_REQUEST_NUMBER: ${{ github.event.pull_request.number }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          # Read the release state here, right before the decision: a release
          # opened while this run was queued must still hold the pull request.
          number="$PULL_REQUEST_NUMBER"
          if [[ "$EVENT_NAME" == "merge_group" ]]; then
            if [[ ! "$MERGE_GROUP_HEAD_REF" =~ /pr-([0-9]+)-[0-9a-f]+$ ]]; then
              echo "::error::Merge group head ref does not name a pull request: $MERGE_GROUP_HEAD_REF"
              exit 1
            fi
            number="${BASH_REMATCH[1]}"
          fi
          state=$(bash scripts/release-pull-requests.sh --repo "$REPOSITORY" --number "$number")
          pending=$(bash scripts/release-pending.sh --repo "$REPOSITORY")
          version_state=$(sed -n 's/^version_state=//p' <<<"$pending")
          open_other=$(sed -n 's/^open_other=//p' <<<"$state")
          current_is_release=$(sed -n 's/^current_is_release=//p' <<<"$state")
          bun scripts/check-release-cli-changeset-hold.ts \
            --base "origin/$BASE_REF" \
            --event "$EVENT_NAME" \
            --open-releases "$open_other" \
            --version-state "$version_state" \
            --is-release "$current_is_release"

      - name: CLI contract changeset guard
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' && steps.install.outcome != 'failure' && steps.standalone_lockfiles.outcome != 'failure' && steps.lockfile_ages.outcome != 'failure' && (github.event_name == 'pull_request' || github.event_name == 'merge_group') }}
        env:
          BASE_REF: ${{ github.base_ref || 'main' }}
        run: bun scripts/check-cli-contract-changeset.ts --base "origin/$BASE_REF"

      - name: SQL performance suppression summary
        if: ${{ !cancelled() && steps.install.outcome == 'success' && (needs.ci-plan.outputs.package_checks_required == 'true' && (github.event_name == 'pull_request' || github.event_name == 'merge_group')) }}
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
        run: bun scripts/sql-perf-suppressions.ts

      - name: Release marketing provenance warning
        if: ${{ !cancelled() && steps.install.outcome == 'success' && (needs.ci-plan.outputs.package_checks_required == 'true' && (github.event_name == 'pull_request' || github.event_name == 'merge_group')) }}
        env:
          BASE_REF: ${{ github.base_ref || 'main' }}
        run: |
          if git diff --quiet "origin/$BASE_REF"...HEAD -- VERSION; then
            echo "VERSION unchanged; fresh release recordings not required."
            exit 0
          fi
          if ! bun run marketing:provenance --strict; then
            echo "::warning::Changed marketing recording provenance for this release (see step log). Re-record with \`bun run marketing:reshoot\`."
          fi

      - name: Rust format
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' && steps.install.outcome != 'failure' && steps.standalone_lockfiles.outcome != 'failure' && steps.lockfile_ages.outcome != 'failure' && (needs.ci-plan.outputs.desktop_rust_checks_required == 'true') }}
        run: cargo fmt --manifest-path apps/desktop/src-tauri/Cargo.toml -- --check

      - name: React Compiler bailout guard
        if: ${{ !cancelled() && steps.install.outcome == 'success' && (needs.ci-plan.outputs.package_checks_required == 'true') }}
        # Components the React Compiler bails out on (refs-in-render,
        # try/finally, an ESLint suppression on the component) are not
        # auto-memoized, so manual useMemo/useCallback there is load-bearing:
        # removing it leaves unstable references that re-fire effects every
        # render — loops that lint and typecheck do not catch. Fails when a
        # baseline bailout file loses memoization or a new bailout component
        # appears untracked. CI-only: it runs the JS compiler, too slow for the
        # normal lint output. Regenerate:
        # `bun scripts/rc-bailouts.ts --write-baseline`.
        run: bun scripts/rc-bailouts.ts --check

      - name: Design-system lint backlog
        if: ${{ !cancelled() && steps.install.outcome == 'success' && (needs.ci-plan.outputs.package_checks_required == 'true') }}
        # The tracked design-system rules are off in the files
        # scripts/design-lint-baseline.json still lists; this holds each
        # file's count at its baseline and fails when a listed file reaches
        # zero, so the list only shrinks. Regenerate:
        # `bun scripts/design-lint-baseline.ts --write`.
        run: |
          bun test scripts/design-lint-baseline.test.ts scripts/oxlint-config-inputs.test.ts
          bun scripts/design-lint-baseline.ts --check

      - name: Query data state baseline
        if: ${{ !cancelled() && steps.install.outcome == 'success' && (needs.ci-plan.outputs.package_checks_required == 'true') }}
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || '' }}
        run: |
          bun test scripts/query-data-state-baseline.test.ts
          bun run check:query-data-state

      - name: SQL performance baseline
        if: ${{ !cancelled() && steps.install.outcome == 'success' && (needs.ci-plan.outputs.package_checks_required == 'true') }}
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || '' }}
        run: |
          bun test scripts/sql-perf-detector.test.ts scripts/sql-perf-baseline.test.ts
          bun scripts/sql-perf-baseline.ts --check

      - name: Failure-as-empty baseline
        if: ${{ !cancelled() && steps.install.outcome == 'success' && (needs.ci-plan.outputs.package_checks_required == 'true') }}
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || '' }}
        run: |
          bun test scripts/failure-as-empty-baseline.test.ts
          bun run check:failure-as-empty

      - name: Oxlint override union guard
        if: ${{ !cancelled() && steps.install.outcome == 'success' && (needs.ci-plan.outputs.package_checks_required == 'true') }}
        # Oxlint resolves `overrides` by replacement: for a given file the last
        # override that mentions a rule supplies that rule's whole
        # configuration. For a list-of-restrictions rule
        # (`no-restricted-imports` and friends) a scope that adds one ban
        # therefore deletes every ban it inherited, and nothing fails — the
        # forbidden import just stops being reported. This guard resolves the
        # tracked rules against the real repository file list the way oxlint
        # does and fails when a scope's effective restriction set is missing an
        # inherited entry. Deliberate narrowings live in DELIBERATE_NARROWINGS
        # with a reason and are checked in both directions. The liveness test
        # fails on a scope glob or option path that matches no file and on an
        # "off" that no earlier scope enabled.
        run: |
          bun test scripts/oxlint-override-union.test.ts \
            scripts/oxlint-config-liveness.test.ts

      - name: Oxlint rule decisions
        if: ${{ !cancelled() && steps.install.outcome == 'success' && (needs.ci-plan.outputs.package_checks_required == 'true') }}
        # Every built-in rule of an enabled plugin is named in the config, on
        # or off, so an oxlint upgrade cannot add rules nobody decided on.
        run: bun scripts/check-oxlint-rule-decisions.ts

      - name: Oxlint effective config
        if: ${{ !cancelled() && steps.install.outcome == 'success' && (needs.ci-plan.outputs.package_checks_required == 'true') }}
        # Every base rule's severity, merged from oxlint.config.ts and its
        # presets by oxlint's documented precedence, must equal the severity
        # `oxlint --print-config` resolves, so a rule the config turns on cannot
        # stay off unnoticed. Known mismatches carry a reason in
        # scripts/oxlint-effective-config-baseline.json, which may only shrink.
        run: |
          bun test scripts/oxlint-effective-config.test.ts
          bun scripts/check-oxlint-effective-config.ts

      - name: Result boundary enrolment
        if: ${{ !cancelled() && steps.install.outcome == 'success' && (needs.ci-plan.outputs.package_checks_required == 'true') }}
        # Joining the better-result boundary convention is the default. Every
        # directory under apps/*/src and packages/*/src is either enabled in
        # RESULT_CONVENTION_ENABLED_GLOBS or carries a written reason in
        # RESULT_CONVENTION_OPT_OUTS, so a new app, package, or feature
        # directory cannot skip the convention by being forgotten; an opt-out
        # for a directory that is now enabled or gone fails too, so the table
        # can only shrink. The fixture tests run first so a broken guard cannot
        # pass silently.
        run: |
          bun test scripts/check-result-boundary-enrolment.test.ts
          bun run check:result-boundary-enrolment

      - name: Generated source artifact contract
        if: ${{ !cancelled() && steps.install.outcome == 'success' && (needs.ci-plan.outputs.package_checks_required == 'true') }}
        run: bun test scripts/ci-generated-sources.test.ts packages/scripts/src/prepared-generated-sources.test.ts

      - name: Test input coverage
        if: ${{ !cancelled() && steps.install.outcome == 'success' && (needs.ci-plan.outputs.package_checks_required == 'true') }}
        # Turbo selects and caches a package's tests on that package's own
        # files, so a suite that reads another package's source runs only when
        # its own package happens to change. turbo.json declares those reads as
        # $TURBO_ROOT$ inputs of the package's test task, which both selects the
        # package (scripts/test-scope.ts) and joins the cache key. An undeclared
        # read fails; so does a declared input no test reads any more, so the
        # lists can only shrink. The fixture tests run first so a broken guard
        # cannot pass silently.
        run: |
          bun test scripts/check-test-input-coverage.test.ts
          bun run check:test-input-coverage

      - name: Chat mutation targets
        if: ${{ !cancelled() && steps.install.outcome == 'success' && (needs.ci-plan.outputs.package_checks_required == 'true') }}
        # Every API/web change validates all active targets; scenarios stay nightly.
        run: |
          bun test apps/api/scripts/chat-mutation-matrix.test.ts
          bun apps/api/scripts/chat-mutation-matrix.ts --check

      - name: API test duration weights
        if: ${{ !cancelled() && steps.install.outcome == 'success' && (needs.ci-plan.outputs.package_checks_required == 'true') }}
        # A test file without a duration weight fails here, on the pull request
        # that adds it and on each merge-queue entry. The API shards run after
        # merge and weight such a file by the median with a warning instead.
        run: bun apps/api/scripts/refresh-test-durations.ts --check

      - name: Desktop Rust inputs
        if: ${{ !cancelled() && steps.install.outcome == 'success' && (needs.ci-plan.outputs.package_checks_required == 'true') }}
        # The desktop native test task's turbo.json inputs, the files Rust
        # embeds with include_str!/include_bytes! from outside the crate, and
        # the CI Rust change detector must name the same files. The fixture
        # tests run first so a broken guard cannot pass silently.
        run: |
          bun test scripts/check-desktop-rust-inputs.test.ts
          bun run check:desktop-rust-inputs

      - name: Test shard partition
        if: ${{ !cancelled() && steps.install.outcome == 'success' && (needs.ci-plan.outputs.package_checks_required == 'true') }}
        # ci-tests runs the `test` task as a matrix of shards, and
        # scripts/test-shards.ts is the only place that names what a shard
        # owns: the workflow reads its filters and the matrix ids are checked
        # against it here, together with the property that the shards still
        # partition every workspace package with a `test` script. A package
        # that joined no shard would leave CI silently.
        run: bun test scripts/test-shards.test.ts

      - name: Landing deploy scope
        if: ${{ !cancelled() && steps.install.outcome == 'success' && (needs.ci-plan.outputs.package_checks_required == 'true') }}
        # deploy-landing.yml deploys only when scripts/landing-deploy-scope.ts
        # finds a change the landing build reads; a wrong answer there leaves
        # the site stale.
        run: bun test scripts/landing-deploy-scope.test.ts

      - name: Workflow cache policy
        if: ${{ !cancelled() && steps.install.outcome == 'success' && (needs.ci-plan.outputs.package_checks_required == 'true') }}
        run: bun test scripts/workflow-cache-policy.test.ts scripts/workflow-run-trust.test.ts scripts/workflow-concurrency.test.ts

      - name: Module ownership
        if: ${{ !cancelled() && steps.install.outcome == 'success' && (needs.ci-plan.outputs.package_checks_required == 'true') }}
        # scripts/ownership.ts holds one row per owned capability. The
        # confine-owner lint rule reads the enforced rows, and
        # docs/module-ownership.md is rendered from the same table, so this
        # check fails when the doc is stale, an id repeats, or a path a row
        # names has moved. Regenerate: `bun scripts/ownership.ts --write`.
        run: bun scripts/ownership.ts --check

      - name: Outbound transport ownership
        if: ${{ !cancelled() && steps.install.outcome == 'success' && (needs.ci-plan.outputs.package_checks_required == 'true') }}
        run: |
          bun scripts/outbound-transport-ownership.ts --check
          bun test scripts/outbound-transport-ownership.test.ts

      - name: Module ownership invariants
        if: ${{ !cancelled() && steps.install.outcome == 'success' && (needs.ci-plan.outputs.package_checks_required == 'true') }}
        # Invariants the ownership table cannot state itself, such as
        # allowlists kept equal to their source lists.
        run: bun test scripts/ownership.test.ts

      - name: Generated artifact formatting invariants
        if: ${{ !cancelled() && steps.install.outcome == 'success' && (needs.ci-plan.outputs.package_checks_required == 'true') }}
        # One formatter batch per check keeps the generated docs in step with
        # their owners without a formatter process per row.
        run: bun test scripts/generated-artifacts.test.ts

      - name: Schema introspection invariants
        if: ${{ !cancelled() && steps.install.outcome == 'success' && (needs.ci-plan.outputs.package_checks_required == 'true') }}
        run: bun test scripts/schema-introspection.test.ts

      - name: Queue authority
        if: ${{ !cancelled() && steps.install.outcome == 'success' && (needs.ci-plan.outputs.package_checks_required == 'true') }}
        # Every BullMQ queue declares whose authority its jobs run under
        # (apps/api/src/lib/member-run-queues.ts), and a member-run queue
        # builds its handles with the run actor; scheduler tasks are held the
        # same way (apps/api/src/lib/scheduler/task-authority.ts). Existing
        # gaps are listed in shrink-only baselines:
        # `bun scripts/queue-authority.ts --write`.
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || '' }}
        run: |
          bun scripts/queue-authority.ts --self-test
          bun scripts/queue-authority.ts --check

      - name: Design token docs
        if: ${{ !cancelled() && steps.install.outcome == 'success' && (needs.ci-plan.outputs.package_checks_required == 'true') }}
        # DESIGN.md's semantic token table and font stack are rendered from
        # packages/ui/src/styles/theme.css, so a token change that skips the
        # doc fails here. Regenerate: `bun scripts/design-tokens-doc.ts --write`.
        run: bun scripts/design-tokens-doc.ts --check

      - name: Suppression waiver ledger
        if: ${{ !cancelled() && steps.install.outcome == 'success' && (needs.ci-plan.outputs.package_checks_required == 'true') }}
        # The ratchet budgets cap how many suppressions each lint rule carries.
        # For the security tier — tenancy, authorization, credential and audit
        # rules — a count is not enough, because two waivers of the same rule
        # are not interchangeable. scripts/suppression-waivers.json names each
        # one (rule, file, anchoring symbol, reason, evidence) and this guard
        # mirrors it against the tree in both directions, so adding a
        # suppression is a reviewable ledger edit and a stale entry cannot rot
        # in place. Temporary waivers fail once their expiry passes. The
        # --self-test run first proves the guard still detects each kind of
        # drift. Draft entries: `bun scripts/suppression-waivers.ts --seed`.
        run: |
          bun scripts/suppression-waivers.ts --self-test
          bun scripts/suppression-waivers.ts --check

      - name: Crawl posture guard
        if: ${{ !cancelled() && steps.install.outcome == 'success' && (needs.ci-plan.outputs.package_checks_required == 'true') }}
        # Every app under apps/ declares a `crawlPosture` in package.json:
        # "public" (indexable SEO/LLM surface), "private" (authenticated app that
        # must stay invisible to crawlers), "mixed" (an SSR app with both public
        # and private routes), or "unserved" (not an internet-facing HTML
        # surface). This guard verifies the crawl artifacts match the declared
        # posture — a public surface must ship a crawler-inviting robots.txt
        # (Sitemap, no deny-all) plus an llms.txt and carry no `noindex`; a
        # private surface must ship a deny-all robots.txt (no Sitemap), a
        # `noindex` robots meta on every served page, and no llms.txt; a mixed
        # surface must serve a dynamic default-deny robots.txt with an explicit
        # public allowlist (a robots server route, no shadowing static
        # robots.txt, and a crawl-prefix allowlist that maps to real routes,
        # checked in source) instead of static files — so the SEO/LLM surface and
        # the private routes cannot silently drift. The --self-test run first
        # proves each detector still fires, so a broken guard cannot pass
        # silently.
        run: |
          bun scripts/crawl-posture.ts --self-test
          bun scripts/crawl-posture.ts --check

      - name: Chat fixture guard
        if: ${{ !cancelled() && steps.install.outcome == 'success' && (needs.ci-plan.outputs.package_checks_required == 'true') }}
        # Valid chat stream fixtures (messages snapshots) come from the
        # builders in apps/api/src/tests/helpers/chat-fixtures.ts, which run
        # TanStack's own converters; a hand-written snapshot only agrees with
        # the engine until it changes. The guard rejects a snapshot literal in
        # a chat test outside that owner and outside `unsafeFixture(reason,
        # ...)`, with a shrink-only ledger of the files that predate the
        # builders. The --self-test run first proves the detector still fires.
        run: |
          bun scripts/chat-fixture-guard.ts --self-test
          bun scripts/chat-fixture-guard.ts

      - name: Transfer timeout and fixed read guard
        if: ${{ !cancelled() && steps.install.outcome == 'success' && (needs.ci-plan.outputs.package_checks_required == 'true') }}
        run: |
          bun run --cwd packages/scripts test ../../scripts/transfer-read-guard.test.ts
          bun scripts/transfer-read-guard.ts

      # Join both long checks before reusing their background slots.
      - name: Wait for capability and repository checks
        wait: [capability_parity, remaining_scripts]

      # The api test runner only globs `src/**`, so the tests beside the api
      # scripts (seed guards, AI provider canary, MCP coverage) need an
      # explicit invocation to run in CI, like the scripts tests above. The
      # glob keeps a new scripts test from landing unrun. Gated on workspace
      # checks so it is skipped on workflow-only PRs where dependencies are
      # not installed.
      - name: Test api scripts
        id: api_scripts
        background: true
        if: ${{ !cancelled() && steps.install.outcome == 'success' && (needs.ci-plan.outputs.package_checks_required == 'true') }}
        # Worst pilot test 4.57 s; 12 s allows about 2.5x contention headroom.
        run: >-
          bun test --timeout 12000 --preload ./apps/api/src/tests/setup-env.ts
          apps/api/scripts/*.test.ts

      - name: Test CLI runtime package parity
        id: cli_runtime_parity
        background: true
        if: ${{ !cancelled() && steps.install.outcome == 'success' && (needs.ci-plan.outputs.package_checks_required == 'true') }}
        # Worst pilot test 31.52 s; 80 s allows about 2.5x contention headroom.
        run: bun test --timeout 80000 scripts/cli-runtime-pack.test.ts scripts/cli-runtime-merge.test.ts

      - name: Offline check transport policy
        if: ${{ !cancelled() && steps.install.outcome == 'success' && (needs.ci-plan.outputs.package_checks_required == 'true') }}
        run: |
          bun test scripts/offline-check-policy.test.ts
          bun scripts/offline-check-policy.ts
          bun --filter @stll/ai-catalog gen:rates --check
          bun --filter @stll/ai-catalog gen:capabilities --check

      - name: Model catalog snapshot drift check
        if: ${{ !cancelled() && steps.install.outcome == 'success' && (needs.ci-plan.outputs.package_checks_required == 'true' && needs.ci-plan.outputs.model_catalog_drift_required == 'true') }}
        # These fetch models.dev and OpenRouter and byte-compare the
        # deterministic output with the committed snapshots, so hand-editing a
        # `.gen.ts` row instead of regenerating it cannot ship: only the
        # nightly catalog job caught that before. Keeping them path-scoped
        # avoids adding a network dependency to unrelated pull requests.
        run: |
          bun --filter @stll/ai-catalog gen:rates --check
          bun --filter @stll/ai-catalog gen:capabilities --check

      - name: Capability description ledger
        if: ${{ !cancelled() && steps.install.outcome == 'success' && (needs.ci-plan.outputs.package_checks_required == 'true') }}
        # A capability's `description` is what an MCP client reads before
        # deciding whether to call it, so every capability still missing one is
        # listed by exact id in apps/api/capability-description-ledger.json. A
        # capability missing prose that is not in the ledger fails (no new
        # debt); a ledger entry whose capability now has prose, or no longer
        # exists, fails as stale — so authoring a description means deleting its
        # ledger line in the same change and the list can only shrink. The
        # --self-test run first proves the detectors still fire, so a broken
        # guard cannot pass silently.
        run: |
          bun apps/api/scripts/capability-description-guard.ts --self-test
          bun apps/api/scripts/capability-description-guard.ts

      - name: exactMirror route guard
        if: ${{ !cancelled() && steps.install.outcome == 'success' && (needs.ci-plan.outputs.package_checks_required == 'true') }}
        # Elysia builds an "exactMirror" serializer per route schema. Some
        # schemas (recursive ones: t.Recursive, or a Type.Unsafe wrapping a
        # self-referential TypeBox node) cannot be mirrored: Elysia logs the
        # failure and falls back to slow per-request serialization, which has
        # taken the API down at boot. Typecheck and lint do not catch it. The
        # guard builds the real app and forces every route's mirror to compile,
        # failing if any cannot. The --self-test run first proves the detector
        # still catches a known recursive schema, so a broken guard cannot pass
        # silently.
        run: |
          bun apps/api/scripts/exact-mirror-guard.ts --self-test
          bun apps/api/scripts/exact-mirror-guard.ts

      - name: MCP coverage guard
        if: ${{ !cancelled() && steps.install.outcome == 'success' && (needs.ci-plan.outputs.package_checks_required == 'true') }}
        # Every safe-handler config must declare an `mcp` disposition (a
        # typecheck-enforced McpExposure). This guard imports every handler
        # module, verifies each disposition is well-formed, that every
        # tool/covered reference names a real static MCP tool, that no registry
        # tool is orphaned, and that the `pending` baseline only ever shrinks
        # (a new pending endpoint fails). The --self-test run first proves the
        # ratchet detectors still fire, so a broken guard cannot pass silently.
        run: |
          bun apps/api/scripts/mcp-coverage-guard.ts --self-test
          bun apps/api/scripts/mcp-coverage-guard.ts

      - name: MCP surface baseline self-test
        if: ${{ !cancelled() && steps.install.outcome == 'success' && (needs.ci-plan.outputs.package_checks_required == 'true') }}
        # registry-quality.test.ts holds every MCP audience to
        # apps/api/mcp-surface-baseline.json. This proves the comparison it
        # uses still reports growth, shrinkage, a changed tool count and a
        # missing audience, so a broken guard cannot pass silently.
        run: bun apps/api/scripts/mcp-surface-baseline.ts --self-test

      - name: Catalogue pinned-content check
        if: ${{ !cancelled() && steps.install.outcome == 'success' && (needs.ci-plan.outputs.package_checks_required == 'true') }}
        timeout-minutes: 5
        env:
          GITHUB_TOKEN: ${{ github.token }}
        # github-sourced catalogue skills pin an upstream commit SHA whose
        # bytes nothing else in CI fetches: the schema/loader validate only
        # the manifest, and the offline `bun run test` path stays offline.
        # This step fetches each pinned SKILL.md and its resource tree and
        # fails if the content would be rejected by the skill install path
        # (missing name/description, name pattern, oversized body, or too
        # many/large resource files), so a broken pin cannot ship green.
        run: bun run --filter @stll/catalogue check-pinned

      - name: Property-test convention guard
        if: ${{ !cancelled() && steps.install.outcome == 'success' && (needs.ci-plan.outputs.package_checks_required == 'true') }}
        run: |
          bun test packages/property-testing/src/convention.test.ts
          bun test packages/property-testing/src/ci-gate-coverage.test.ts

      - name: Test marketing recording verification guard
        if: ${{ !cancelled() && steps.install.outcome == 'success' && (needs.ci-plan.outputs.package_checks_required == 'true') }}
        run: bun test scripts/check-marketing-recordings.test.ts

      # Self-test the bridge-version guard so a regression in the
      # script itself is caught immediately, not on the next desktop
      # bridge change. Always runs (no `if:` gate) — it's seconds
      # and has no deps.
      - name: Test desktop bridge CI guards
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' && steps.install.outcome != 'failure' && steps.standalone_lockfiles.outcome != 'failure' && steps.lockfile_ages.outcome != 'failure' }}
        run: |
          bash scripts/check-bridge-version.test.sh
          bash scripts/detect-tauri-rust-changes.test.sh

      # Self-test the release-channel script. The desktop release
      # pipeline relies on three independent steps deriving the
      # same channel from a tag (updater endpoint baked into the
      # binary, S3 manifest mirror path, CloudFront invalidation
      # key). A bug here makes them silently disagree.
      - name: Test release-channel script
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' && steps.install.outcome != 'failure' && steps.standalone_lockfiles.outcome != 'failure' && steps.lockfile_ages.outcome != 'failure' }}
        run: bash scripts/release-channel.test.sh

      # The web compiler uses native Rolldown bindings, while the deployed
      # container is ARM64. Keep build and runtime dependency architectures
      # separated in the Docker stage graph.
      - name: Test web container platform boundary
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' && steps.install.outcome != 'failure' && steps.standalone_lockfiles.outcome != 'failure' && steps.lockfile_ages.outcome != 'failure' }}
        run: bun test scripts/check-web-docker-platform.test.ts

      # Bun links @stll dependencies to local workspaces only while versions
      # match; a drift silently flips the resolution to the npm registry copy
      # (or back). Needs only bun.lock, so it stays runnable when the
      # dependency install is skipped.
      - name: Test @stll resolution pin
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' && steps.install.outcome != 'failure' && steps.standalone_lockfiles.outcome != 'failure' && steps.lockfile_ages.outcome != 'failure' }}
        run: bun test scripts/stll-registry-resolutions.test.ts

      # The runner image stages workspace packages reached by externalized
      # runtime dependencies. Guard the closure derivation and the
      # manifest-only-fails / staged-succeeds property.
      - name: Test web runtime staging
        if: ${{ !cancelled() && steps.install.outcome == 'success' && (needs.ci-plan.outputs.package_checks_required == 'true') }}
        run: bun test scripts/stage-web-runtime.test.ts

      - name: Check Docker source closure
        if: ${{ !cancelled() && steps.install.outcome == 'success' && (needs.ci-plan.outputs.package_checks_required == 'true') }}
        timeout-minutes: 1
        run: timeout 30s bun test scripts/docker-source-closure.test.ts

      # The same transformation decides what every published tarball exports.
      # Its unit coverage is what keeps a malformed source map — a wildcard, a
      # conditions object, a target outside src, a missing root — out of a
      # publishable package.
      - name: Test published export artifact guard
        if: ${{ !cancelled() && steps.install.outcome == 'success' && (needs.ci-plan.outputs.package_checks_required == 'true') }}
        run: bun test scripts/published-export-guards.test.ts scripts/check-published-exports.test.ts

      - name: Test publish manifest transformation
        if: ${{ !cancelled() && steps.install.outcome == 'success' && (needs.ci-plan.outputs.package_checks_required == 'true') }}
        # scripts/publish-manifest.ts imports better-result, so this needs the
        # install above; a workflow-only PR skips both.
        run: bun test scripts/publish-manifest.test.ts

      - name: Test journey checks
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' && steps.install.outcome != 'failure' && steps.standalone_lockfiles.outcome != 'failure' && steps.lockfile_ages.outcome != 'failure' }}
        run: |
          bun test scripts/check-journeys.test.ts
          bun test scripts/check-published-versions.test.ts

      # Release ordering is a safety property. This test has no workspace
      # dependencies, so it remains runnable when a PR changes only workflows
      # and the dependency install above is intentionally skipped.
      - name: Test release policy scripts
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' && steps.install.outcome != 'failure' && steps.standalone_lockfiles.outcome != 'failure' && steps.lockfile_ages.outcome != 'failure' }}
        run: |
          bun test scripts/check-api-deployment.test.ts
          bun test scripts/check-staging-deploy-decision.test.ts
          bun test scripts/check-release-cli-changeset-hold.test.ts
          bash scripts/check-release-changelog.test.sh
          bash scripts/prepare-release-tag.test.sh
          bash scripts/release-pull-requests.test.sh
          bash scripts/release-pending.test.sh
          bash scripts/check-main-merge-hold.test.sh
          bash scripts/create-release-manifest.test.sh
          bash scripts/promote-desktop-release.test.sh

      # Join this pair before starting the remaining background checks.
      - name: Wait for API scripts and CLI runtime checks
        wait: [api_scripts, cli_runtime_parity]

      - name: Generated files manifest guard
        id: generated_manifest
        background: true
        if: ${{ !cancelled() && steps.install.outcome == 'success' && (needs.ci-plan.outputs.package_checks_required == 'true') }}
        # Guard A registers tracked generated files; Guard B checks the
        # manifest entries with offline checks against committed outputs.
        run: |
          bun scripts/generated-files-guard.ts --guard-a
          bun scripts/generated-files-guard.ts --guard-b

      - name: Playwright config scope
        id: playwright_scope
        background: true
        if: ${{ !cancelled() && steps.install.outcome == 'success' && (needs.ci-plan.outputs.package_checks_required == 'true') }}
        # Lists every Playwright config from its package. A spec that does not
        # load, or a project that collects another package's specs, fails here
        # on the pull request instead of failing every e2e shard in the queue.
        # The fixture tests run first so a broken guard cannot pass silently.
        # Pilot fixture tests stayed below 1 ms; retain the 5 s default explicitly.
        run: |
          bun test --timeout 5000 scripts/check-playwright-config-scope.test.ts
          bun run check:playwright-config-scope

      - name: Test documentation and landing CI scope
        if: ${{ !cancelled() && steps.install.outcome == 'success' && (needs.ci-plan.outputs.package_checks_required == 'true') }}
        run: bun test scripts/ci-package-scope.test.ts

      - name: Test main heavy workflow contracts
        if: ${{ !cancelled() && steps.install.outcome == 'success' && (needs.ci-plan.outputs.package_checks_required == 'true') }}
        run: bun test scripts/main-heavy-plan.test.ts scripts/main-heavy.test.ts scripts/validate-main-heavy-sha.test.ts

      - name: Test cancellation evidence
        if: ${{ !cancelled() && steps.install.outcome == 'success' && (needs.ci-plan.outputs.package_checks_required == 'true') }}
        run: bun test scripts/ci-cancellation-contract.test.ts

      - name: Test thin merge queue contracts
        if: ${{ !cancelled() && steps.install.outcome == 'success' && (needs.ci-plan.outputs.package_checks_required == 'true') }}
        run: bun test scripts/thin-queue.test.ts

      - name: Test service-suite dependency scope
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' && steps.install.outcome != 'failure' && steps.standalone_lockfiles.outcome != 'failure' && steps.lockfile_ages.outcome != 'failure' }}
        run: bun test scripts/detect-service-suite-changes.test.ts

      - name: Test nightly rehearsal and retry guards
        if: ${{ !cancelled() && steps.install.outcome == 'success' && (needs.ci-plan.outputs.package_checks_required == 'true') }}
        run: bun test scripts/nightly-exact-base.test.ts scripts/check-test-retries.test.ts

      - name: Reject automatic test retries
        if: ${{ !cancelled() && steps.install.outcome == 'success' && (needs.ci-plan.outputs.package_checks_required == 'true') }}
        run: bun scripts/check-test-retries.ts

      - name: Keep tests off history walks
        if: ${{ !cancelled() && steps.install.outcome == 'success' && (needs.ci-plan.outputs.package_checks_required == 'true') }}
        run: bun test scripts/check-test-history-walks.test.ts

      - name: Test dependency malware scanners
        if: ${{ !cancelled() && steps.install.outcome == 'success' && (needs.ci-plan.outputs.package_checks_required == 'true') }}
        run: bun test scripts/osv-scanner-install.test.ts scripts/scan-dependency-malware.test.ts scripts/report-dependency-malware-failure.test.ts

      - name: Test maintenance release preparation
        if: ${{ !cancelled() && steps.install.outcome == 'success' && (needs.ci-plan.outputs.package_checks_required == 'true') }}
        run: bun test scripts/prepare-maintenance-release.property.test.ts

      - name: Test API and CLI contract invariants
        if: ${{ !cancelled() && steps.install.outcome == 'success' && (needs.ci-plan.outputs.package_checks_required == 'true') }}
        run: |
          bun test --preload ./apps/api/src/tests/setup-env.ts \
            scripts/check-api-cli-contract.test.ts
          bun test scripts/dev-compose-contract.test.ts

      # Self-test the desktop-release skip decision. This script
      # decides whether prod desktop users get an update at all; a
      # regression either ships stale desktop builds or reintroduces
      # pointless ~30 MB redownloads.
      - name: Test detect-desktop-release-changes script
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' && steps.install.outcome != 'failure' && steps.standalone_lockfiles.outcome != 'failure' && steps.lockfile_ages.outcome != 'failure' }}
        run: bash scripts/detect-desktop-release-changes.test.sh

      - name: Test route smoke change detector
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' && steps.install.outcome != 'failure' && steps.standalone_lockfiles.outcome != 'failure' && steps.lockfile_ages.outcome != 'failure' }}
        run: bun test scripts/detect-route-smoke-changes.test.ts

      - name: Validate CI service image mirror inventory
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' && steps.install.outcome != 'failure' && steps.standalone_lockfiles.outcome != 'failure' && steps.lockfile_ages.outcome != 'failure' }}
        run: |
          set -euo pipefail
          bun test scripts/ci-service-images.test.ts
          bun scripts/ci-service-images.ts

      - name: Test CI workflow invariants
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' && steps.install.outcome != 'failure' && steps.standalone_lockfiles.outcome != 'failure' && steps.lockfile_ages.outcome != 'failure' }}
        run: >-
          bun test
          scripts/detect-e2e-changes.test.ts
          scripts/network-baseline-scope.test.ts
          scripts/autofix-workflow.test.ts
          scripts/check-release-upload-retry.test.ts
          scripts/check-base-image-pulls.test.ts
          scripts/dependabot-changeset.test.ts

      - name: Test main network recording selection
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' && steps.install.outcome != 'failure' && steps.standalone_lockfiles.outcome != 'failure' && steps.lockfile_ages.outcome != 'failure' }}
        run: bun test scripts/network-baseline-selection.test.ts

      - name: Test autofix decision boundaries
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' && steps.install.outcome != 'failure' && steps.standalone_lockfiles.outcome != 'failure' && steps.lockfile_ages.outcome != 'failure' }}
        run: bun test scripts/check-autofix-test-durations.test.ts scripts/autofix-protected-paths.test.ts

      # The fixture executes the installed linter and native compiler.
      - name: Test type-aware autofix
        if: ${{ !cancelled() && steps.install.outcome == 'success' && (needs.ci-plan.outputs.package_checks_required == 'true') }}
        run: bun test scripts/autofix-type-aware.test.ts

      - name: Test install-free CI commands
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' && steps.install.outcome != 'failure' && steps.standalone_lockfiles.outcome != 'failure' && steps.lockfile_ages.outcome != 'failure' }}
        run: bun test scripts/install-free-ci.test.ts

      - name: Test pre-push secret scan ranges
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' && steps.install.outcome != 'failure' && steps.standalone_lockfiles.outcome != 'failure' && steps.lockfile_ages.outcome != 'failure' }}
        run: bun test scripts/check-pushed-secrets.test.ts

      - name: Test merge-base network comparison
        if: ${{ !cancelled() && steps.install.outcome == 'success' && (needs.ci-plan.outputs.package_checks_required == 'true') }}
        run: bun test scripts/network-baseline-comparison.test.ts

      # Needs the installed workspace (fast-check, property-testing), so it
      # cannot join the no-install invariants step above.
      - name: Test CLI release coupling gate
        if: ${{ !cancelled() && steps.install.outcome == 'success' && (needs.ci-plan.outputs.package_checks_required == 'true') }}
        run: bun test scripts/check-cli-release-coupling.test.ts

      - name: Test CLI contract changeset guard
        if: ${{ !cancelled() && steps.install.outcome == 'success' && (needs.ci-plan.outputs.package_checks_required == 'true') }}
        run: bun test scripts/check-cli-contract-changeset.test.ts

      - name: Test package scaffolder
        if: ${{ !cancelled() && steps.install.outcome == 'success' && (needs.ci-plan.outputs.package_checks_required == 'true') }}
        run: bun test scripts/new-package.test.ts

      - name: Test affected code-check planner
        if: ${{ !cancelled() && steps.install.outcome == 'success' && (needs.ci-plan.outputs.package_checks_required == 'true') }}
        run: bun test scripts/code-check-affected.test.ts

      # The pre-push guard and the changeset steps above must gate the same
      # paths. This fails when they diverge, when a policy pathspec goes stale,
      # and when a newly published package is missing from the policy file.
      - name: Test changeset guard
        if: ${{ !cancelled() && steps.install.outcome == 'success' && (needs.ci-plan.outputs.package_checks_required == 'true') }}
        run: bun test scripts/changeset-guard.test.ts

      - name: Test environment tooling
        if: ${{ !cancelled() && steps.install.outcome == 'success' && (needs.ci-plan.outputs.package_checks_required == 'true') }}
        run: bun test scripts/env-tool.test.ts

      - name: Test retry script
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' && steps.install.outcome != 'failure' && steps.standalone_lockfiles.outcome != 'failure' && steps.lockfile_ages.outcome != 'failure' }}
        run: bash scripts/retry.test.sh

      - name: Test base image pull script
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' && steps.install.outcome != 'failure' && steps.standalone_lockfiles.outcome != 'failure' && steps.lockfile_ages.outcome != 'failure' }}
        run: bash scripts/pull-base-images.test.sh

      - name: Verify runner tool availability
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' && steps.install.outcome != 'failure' && steps.standalone_lockfiles.outcome != 'failure' && steps.lockfile_ages.outcome != 'failure' }}
        run: |
          bun scripts/check-ci-runner-tools.ts . stella/stella
          bun test scripts/check-ci-runner-tools.test.ts

      - name: Test preview scope tool availability
        if: ${{ !cancelled() && steps.install.outcome == 'success' && (needs.ci-plan.outputs.package_checks_required == 'true') }}
        run: bun test scripts/visual-preview-scope.test.ts

      # Both guards decide whether a change may reach a live database or the
      # default branch, and both fail open if their comparison logic breaks:
      # a migration identity check that always returns null passes every PR,
      # and a merge gate that reads an empty check list as green merges
      # unverified code. Neither test ran in CI before.
      # Both scripts import `better-result`, so they need the dependency
      # install above, which is itself conditional.
      - name: Verify CI job event policies
        if: ${{ !cancelled() && steps.install.outcome == 'success' && (needs.ci-plan.outputs.package_checks_required == 'true') }}
        run: |
          bun scripts/check-ci-event-policy.ts
          bun test scripts/check-ci-event-policy.test.ts

      - name: Test public document fetch
        if: ${{ !cancelled() && steps.install.outcome == 'success' && (needs.ci-plan.outputs.package_checks_required == 'true') }}
        run: bun test scripts/fetch-public-documents.test.ts

      - name: Test migration identity and merge gate logic
        if: ${{ !cancelled() && steps.install.outcome == 'success' && (needs.ci-plan.outputs.package_checks_required == 'true') }}
        run: |
          bun test scripts/check-migration-order.test.ts
          bun test scripts/merge-bar.test.ts

      - name: Test merge bar freshness, arm guard and disarm
        if: ${{ !cancelled() && steps.install.outcome == 'success' && (needs.ci-plan.outputs.package_checks_required == 'true') }}
        run: |
          bun test scripts/merge-bar-freshness.test.ts \
            scripts/merge-bar-arm-guard.test.ts scripts/merge-bar-disarm.test.ts

      # Check migration identity against the branch this run merges into. In a
      # merge group that is main as it stands at merge time.
      - name: Check migration identity against the base branch
        if: ${{ !cancelled() && steps.install.outcome == 'success' && (needs.ci-plan.outputs.package_checks_required == 'true') }}
        env:
          BASE_REF: ${{ github.base_ref || 'main' }}
        run: bun scripts/check-migration-order.ts "origin/$BASE_REF"

      # Self-test the dead-columns reference matcher: a regression here
      # would either silently stop flagging genuinely unreferenced columns
      # or start flagging live ones, in both cases undermining the
      # check:dead-columns gate in the code-quality job.
      - name: Test dead-columns reference matching
        if: ${{ !cancelled() && steps.install.outcome == 'success' && (needs.ci-plan.outputs.package_checks_required == 'true') }}
        run: bun test scripts/check-dead-columns.test.ts

      # Self-test the projection-totality module classifier: a regression
      # here would either silently stop flagging an unguarded resource
      # projection or start flagging unrelated modules, in both cases
      # undermining the check:projection-totality gate in the code-quality
      # job.
      - name: Test projection-totality classification
        if: ${{ !cancelled() && steps.install.outcome == 'success' && (needs.ci-plan.outputs.package_checks_required == 'true') }}
        run: bun test scripts/check-projection-totality.test.ts

      - name: Office fixture metadata
        if: ${{ !cancelled() && steps.install.outcome == 'success' && (needs.ci-plan.outputs.package_checks_required == 'true') }}
        run: |
          bun run check:office-fixture-metadata
          bun --filter @stll/docx-utils test:office-fixture-metadata

      # Fail PRs that change the desktop bridge surface without
      # bumping BRIDGE_VERSION in apps/desktop/src-tauri/src/types.rs.
      # See scripts/check-bridge-version.sh for rationale.
      - name: Bridge-version guard
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' && steps.install.outcome != 'failure' && steps.standalone_lockfiles.outcome != 'failure' && steps.lockfile_ages.outcome != 'failure' && (github.event_name == 'pull_request') }}
        run: bash scripts/check-bridge-version.sh

      # Surface background failures before failure-triggered cancellation.
      - name: Wait for independent repository checks
        wait-all:

      - name: Cancel failed merge-group run
        if: failure() && github.event_name == 'merge_group'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          retries: 0
          script: |
            let diagnostic;
            let evidenceTimer;
            try {
              const jobs = await Promise.race([
                github.paginate(
                  "GET /repos/{owner}/{repo}/actions/runs/{run_id}/attempts/{attempt_number}/jobs",
                  {
                    ...context.repo,
                    run_id: context.runId,
                    attempt_number: Number(process.env.GITHUB_RUN_ATTEMPT),
                    per_page: 100,
                    request: { timeout: 10000 },
                  },
                ),
                new Promise((_, reject) => {
                  evidenceTimer = setTimeout(() => reject(new Error("Failed-step lookup timed out")), 10000);
                }),
              ]);
              const failures = jobs.flatMap((job) => (job.steps || [])
                .filter((step) => step.conclusion === "failure")
                .map((step) => `${job.name} / ${step.number}: ${step.name} (${job.html_url})`));
              diagnostic = `${context.job}: cancelling failed merge group; failed steps: ${failures.length ? failures.join("; ") : "not yet available from the jobs API"}`;
            } catch {
              diagnostic = `${context.job}: cancelling failed merge group; failed-step lookup unavailable`;
            } finally {
              clearTimeout(evidenceTimer);
            }
            core.error(diagnostic);
            try {
              core.summary.addRaw(`${diagnostic}\n`);
              await core.summary.write();
            } catch {
              core.error(`${context.job}: cancellation step summary could not be written`);
            }
            await github.rest.actions.cancelWorkflowRun({
              ...context.repo,
              run_id: context.runId,
            });

  # The `test` task, split into shards that run in parallel. Each shard filters
  # the same scope the serial run computed (scripts/test-scope.ts) down to the
  # packages it owns; scripts/test-shards.ts owns the mapping.
  ci-tests:
    needs: ci-plan
    if: >-
      needs.ci-plan.outputs.run_required != 'false'
      && (
      (github.event_name != 'merge_group'
       || needs.ci-plan.outputs.queue_depth != 'thin')
      && (
        needs.ci-plan.outputs.trusted == 'true'
        || github.event_name == 'workflow_dispatch'
      )
      && needs.ci-plan.outputs.package_checks_required == 'true'
      )
    runs-on: ubuntu-latest
    # 25m per shard, the budget the serial job carried for the whole suite. It
    # was bumped from 20m after a PR affected-flagged across apps/api,
    # apps/web, packages/transactional and packages/ui at once hit the ceiling
    # with the Test step still in progress — legitimate multi-package work
    # outgrowing the budget, not a hang. Sharding is what actually splits that
    # work up; the headroom stays until the shards prove they need less.
    timeout-minutes: 25
    permissions:
      contents: read
      actions: write
    strategy:
      # Every shard's verdict, not just the first failure's: a cancelled shard
      # reports no result of its own, and one failing suite should not hide
      # another.
      fail-fast: false
      matrix: ${{ fromJSON(needs.ci-plan.outputs.ci_tests_matrix) }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          submodules: true
          ref: ${{ inputs.heavy_only == true && inputs.sha || '' }}

      - name: Setup Bun
        uses: stella/.github/actions/setup-bun-cached@167fb396c6c0f4e07296ad2cd72e6ef15367c776
        with:
          save: ${{ github.ref == 'refs/heads/main' }}
          bun-version-file: "package.json"

      - name: Turbo remote cache
        if: needs.ci-plan.outputs.package_checks_required == 'true'
        uses: rharkor/caching-for-turbo@2238fae6eb9a9936f92356f54cb3660200d105e7 # v2.5.1
        with:
          server-port: "0"

      - name: Install dependencies
        if: needs.ci-plan.outputs.package_checks_required == 'true'
        run: bash scripts/retry.sh bun ci --ignore-scripts
        env:
          # .npmrc references NPM_TOKEN, but PR installs must not expose
          # the real npm token to dependency lifecycle scripts.
          NPM_TOKEN: ""

      - name: Prepare environment
        if: needs.ci-plan.outputs.package_checks_required == 'true'
        # `cp`, not `mv`: renaming the tracked .env.example dirties the
        # working tree in apps/api and apps/web, and `turbo --affected`
        # counts working-tree changes — so every PR (even web-only ones)
        # ran the api AND web test suites concurrently and could OOM the
        # runner (exit 137). The copy leaves the tree clean; .env is
        # gitignored and invisible to affected-detection.
        run: |
          cd ./apps/api
          cp .env.example .env
          cd ../web
          cp .env.example .env

      - name: Compute affected flag
        if: needs.ci-plan.outputs.package_checks_required == 'true'
        id: affected
        # Heavy runs and manual dispatches test the full source tree; other
        # runs widen affected packages through scripts/test-scope.ts.
        env:
          BASE_REF: ${{ github.base_ref || 'main' }}
          EVENT_NAME: ${{ github.event_name }}
          HEAVY_ONLY: ${{ inputs.heavy_only }}
        run: |
          if [[ "$HEAVY_ONLY" == true || "$EVENT_NAME" == "workflow_dispatch" ]]; then
            echo "flag=" >> "$GITHUB_OUTPUT"
          else
            echo "flag=--affected" >> "$GITHUB_OUTPUT"
            echo "TURBO_SCM_BASE=origin/$BASE_REF" >> "$GITHUB_ENV"
          fi

      - name: Test .claude/mcp
        # Outside the workspace, so no shard filter selects it: one shard owns
        # it outright.
        if: >-
          !cancelled()
          && needs.ci-plan.outputs.package_checks_required == 'true'
          && matrix.shard == 'rest-web'
        run: bun --cwd .claude/mcp test

      # The API test runner sizes its parallel lanes from the runner's cores
      # and memory (apps/api/scripts/test-lanes.ts); print what it sees.
      - name: Runner resources
        if: needs.ci-plan.outputs.package_checks_required == 'true'
        run: nproc; free -g

      - name: Test API or rest
        if: >-
          !cancelled()
          && needs.ci-plan.outputs.package_checks_required == 'true'
        env:
          AFFECTED_FLAG: ${{ steps.affected.outputs.flag }}
          BASE_REF: ${{ github.base_ref || 'main' }}
          SHARD: ${{ matrix.shard == 'rest-web' && 'rest' || matrix.shard }}
          API_TEST_TIMINGS_DIR: ${{ runner.temp }}/api-test-timings-${{ matrix.shard }}
          API_TEST_ARTIFACT_DIR: ${{ runner.temp }}/api-test-${{ matrix.shard }}
          API_TEST_FILES: ${{ needs.ci-plan.outputs.api_test_files }}
          API_TEST_SHARD_COUNT: ${{ needs.ci-plan.outputs.api_test_shards }}
        # Not --affected: a suite that reads files outside its own package also
        # needs the packages its turbo.json test inputs name, and
        # `--affected --filter=X` intersects instead of widening.
        # scripts/test-scope.ts prints the affected set and those packages as
        # explicit filters, which union. A workflow_dispatch run still tests
        # everything, exactly as the empty affected flag did.
        #
        # The shard filters are exclusions, which subtract from that union, so
        # sharding narrows the scoped set instead of widening it.
        run: |
          args=()
          if [[ -n "$AFFECTED_FLAG" ]]; then
            scope=$(bun scripts/test-scope.ts --base "origin/$BASE_REF")
            read -r -a args <<<"$scope"
          fi
          read -r -a shard_args <<<"$(bun scripts/test-shards.ts --filters "$SHARD")"
          API_TEST_SHARD=$(bun scripts/test-shards.ts --api-shard "$SHARD")
