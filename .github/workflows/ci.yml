      - name: Run Postgres-gated API suites
        id: postgres-tests
        if: needs.ci-plan.outputs.postgres_suites_required == 'true'
        working-directory: apps/api
        env:
          DATABASE_URL: postgres://stella_owner:stella@127.0.0.1:5432/stella
          CI_POSTGRES_TEST_SELECTION: ${{ (github.event_name == 'merge_group' || (github.event_name == 'pull_request' && needs.ci-plan.outputs.postgres_pr_required == 'true')) && needs.ci-plan.outputs.postgres_test_selection || '{"mode":"all"}' }}
        # The full volume benchmark runs in nightly postgres-suites; this job
        # retains its bounded correctness slice alongside every other suite.
