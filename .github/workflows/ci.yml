      - name: Upload browser test timings
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-production-shard-timings-${{ matrix.shard }}
          path: .cache/playwright-timings/*.json
          retention-days: 7
          if-no-files-found: ignore

      - name: Cancel failed merge-group run
