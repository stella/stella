name: Publish OCR models image

# Packs the pinned local OCR models into a scratch image on GHCR, so image
# builds copy them from a digest instead of downloading them each time.
# Run it when apps/api/src/scripts/fetch-ocr-models.ts pins new models, then
# point apps/api/Dockerfile at the digest it prints.

defaults:
  run:
    shell: bash

on:
  workflow_dispatch:

permissions: {}

concurrency:
  group: publish-ocr-models
  cancel-in-progress: false

env:
  GIT_CONFIG_COUNT: "3"
  GIT_CONFIG_KEY_0: maintenance.auto
  GIT_CONFIG_VALUE_0: "false"
  GIT_CONFIG_KEY_1: gc.auto
  GIT_CONFIG_VALUE_1: "0"
  GIT_CONFIG_KEY_2: gc.autoDetach
  GIT_CONFIG_VALUE_2: "false"

jobs:
  publish:
    if: github.repository == 'stella/stella' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    env:
      MODELS_IMAGE: ghcr.io/stella/ocr-models
      MODELS_TAG: ppocr-v5-mobile-latin
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: package.json
          no-cache: true

      - name: Install API dependencies
        timeout-minutes: 10
        run: bash scripts/retry.sh bun install --frozen-lockfile --ignore-scripts --filter @stll/api

      # The script checks each file against its pinned SHA-256 before
      # writing it.
      - name: Download the pinned models
        timeout-minutes: 15
        working-directory: apps/api
        run: bun src/scripts/fetch-ocr-models.ts "$RUNNER_TEMP/ocr-models"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Login to GitHub Container Registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The image holds only the two model files, so it builds for both
      # platforms without emulation.
      - name: Build and push the models image
        timeout-minutes: 10
        env:
          SOURCE_URL: ${{ github.server_url }}/${{ github.repository }}
        run: |
          set -euo pipefail
          context="$RUNNER_TEMP/ocr-models"
          printf 'FROM scratch\nCOPY *.onnx /\n' > "$context/Dockerfile"
          docker buildx build \
            --platform linux/amd64,linux/arm64 \
            --provenance=false \
            --label "org.opencontainers.image.source=$SOURCE_URL" \
            --annotation "index:org.opencontainers.image.source=$SOURCE_URL" \
            --annotation "index:org.opencontainers.image.description=Pinned PP-OCRv5 models for stella's local OCR" \
            --tag "$MODELS_IMAGE:$MODELS_TAG" \
            --push \
            "$context"
          digest="$(docker buildx imagetools inspect "$MODELS_IMAGE:$MODELS_TAG" --format '{{json .Manifest.Digest}}' | tr -d '"')"
          echo "Published $MODELS_IMAGE:$MODELS_TAG@$digest"
          echo "Published \`$MODELS_IMAGE:$MODELS_TAG@$digest\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Log out of GitHub Container Registry
        if: always()
        run: docker logout ghcr.io
