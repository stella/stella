name: Playbook journey

defaults:
  run:
    shell: bash

# Weekly, with a live model: runs a playbook from the table and from the review
# panel on fixture contracts through the API, and checks how every run ends
# (apps/api/evals/playbook-journey.ts). One run of one model per week; start it
# by hand after a change to the review pipeline. Sonnet by default: Haiku
# returned output the extraction batch schema rejects.
on:
  schedule:
    - cron: "30 4 * * 1"
  workflow_dispatch:
    inputs:
      model:
        description: Model every AI task of the stack uses
        required: true
        default: claude-sonnet-5-5
        type: choice
        options:
          - claude-sonnet-5-5
          - claude-haiku-5-5

permissions: {}

jobs:
  playbook-journey:
    name: Playbook journey
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      packages: read
    concurrency:
      group: playbook-journey
      cancel-in-progress: false
    steps:
      - name: Checkout default branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Setup Bun
        uses: stella/.github/actions/setup-bun-cached@a6a6cd30646c18321ef71e344bf0af6b8d3634b8
        with:
          save: ${{ github.ref == 'refs/heads/main' }}
          bun-version-file: "package.json"

      - name: Install dependencies
        timeout-minutes: 5
        run: bash scripts/retry.sh bun ci --ignore-scripts
        env:
          NPM_TOKEN: ""

      - name: Prepare environment
        run: cp apps/api/.env.example apps/api/.env

      # The stack is the mock-model one the browser journeys use; the journey
      # saves the organization's own Anthropic key, and requests made with an
      # organization's key always reach the real provider.
      - name: Start docker stack and API server
        id: stack
        uses: ./.github/actions/setup-e2e-stack
        with:
          dockerhub-username: ${{ secrets.DOCKERHUB_USERNAME }}
          dockerhub-token: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Run the journey
        timeout-minutes: 30
        working-directory: apps/api
        env:
          NODE_ENV: development
          STELLA_LOCAL_DEV: "1"
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          JOURNEY_MODEL: ${{ inputs.model || 'claude-sonnet-5-5' }}
        run: |
          report="$RUNNER_TEMP/playbook-journey"
          status=0
          bun evals/playbook-journey.ts --model "$JOURNEY_MODEL" --json "$report.json" | tee "$report.md" || status=$?
          {
            cat "$report.md"
            echo
            echo "Model: $JOURNEY_MODEL"
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"

      - name: Upload the journey report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playbook-journey
          path: |
            ${{ runner.temp }}/playbook-journey.*
            /tmp/api.log
          if-no-files-found: ignore
          retention-days: 14
