name: Quarantine Exclude Prune

defaults:
  run:
    shell: bash

# A temporary `minimumReleaseAgeExcludes` entry stops being needed at a
# wall-clock instant, and stops being safe at the same moment: it would let the
# next version of that package publish straight past the release-age gate. So
# the removal is proposed automatically rather than waiting to be noticed.
# While the removal PR is open, the lockfile release-age guard no longer
# exempts new pins of an expired entry's package.

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

concurrency:
  group: quarantine-prune
  cancel-in-progress: false

permissions: {}

env:
  PRUNE_BRANCH: chore/prune-quarantine-excludes

jobs:
  prune:
    name: Propose removing expired excludes
    if: github.repository == 'stella/stella'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
      checks: read

    steps:
      # Pinned to the default branch: without a ref, a manual dispatch from a
      # feature branch would prune that branch's bunfig.toml and force-push its
      # commits into the removal PR along with it.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.repository.default_branch }}

      - name: Setup Bun
        uses: stella/.github/actions/setup-bun-cached@a6a6cd30646c18321ef71e344bf0af6b8d3634b8
        with:
          save: ${{ github.ref == 'refs/heads/main' }}

      # The script only reads bunfig.toml and bun.lock, so no install is needed.
      - name: Prune expired excludes
        id: prune
        run: |
          set -euo pipefail

          bun scripts/check-stll-quarantine-excludes.ts --prune

          if git diff --quiet -- bunfig.toml; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Nothing expired." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          echo "changed=true" >> "$GITHUB_OUTPUT"

          # The pruned file must satisfy the guard, or the PR would land a
          # bunfig.toml that fails CI for a different reason.
          bun scripts/check-stll-quarantine-excludes.ts

      - name: Mint app token
        if: steps.prune.outputs.changed == 'true'
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ secrets.PROVENANCE_APP_ID }}
          private-key: ${{ secrets.PROVENANCE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          permission-pull-requests: write

      - name: Disarm existing removal proposal
        if: steps.prune.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -euo pipefail

          armed_pr="$(gh pr list --repo "$GITHUB_REPOSITORY" \
            --state open --base main --head "$PRUNE_BRANCH" \
            --json number,isCrossRepository,autoMergeRequest \
            --jq 'map(select(.isCrossRepository == false and .autoMergeRequest != null))[0].number // empty')"
          if [[ -z "$armed_pr" ]]; then
            echo "Existing quarantine removal proposal is not armed."
            exit 0
          fi

          # A proposal already in the merge queue leaves it when the refresh
          # pushes a new head, so disarming is what remains to do here.

          gh pr merge "$armed_pr" --repo "$GITHUB_REPOSITORY" --disable-auto

      # The commit is created through the API so GitHub signs it. The branch
      # name is reserved for this job alone: re-running replaces its own
      # proposal with one computed from current main.
      - name: Open or update the removal PR
        id: removal-pr
        if: steps.prune.outputs.changed == 'true'
        uses: stella/.github/.github/actions/signed-commit@a6a6cd30646c18321ef71e344bf0af6b8d3634b8
        with:
          token: ${{ steps.app-token.outputs.token }}
          mode: refresh-pr
          branch: ${{ env.PRUNE_BRANCH }}
          base: main
          paths: bunfig.toml
          commit-message: |
            chore(deps): remove expired quarantine excludes

            The release-age gate admits these packages on its own now, and an
            entry left behind would let their next version skip it.
          pr-title: "chore(deps): remove expired quarantine excludes"
          pr-body: |
            These temporary `minimumReleaseAgeExcludes` entries have passed their annotated expiry, so the release-age gate admits the packages without them.

            Leaving an expired entry in place is not neutral: it would let the next version of that package publish straight past the gate. Merging this restores that check.

            Opened automatically. The removal is what `bun scripts/check-stll-quarantine-excludes.ts --prune` produces.

      - name: Arm automatic removal
        if: steps.prune.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          PR_NUMBER: ${{ steps.removal-pr.outputs.pull-request-number }}
          WRITTEN_HEAD: ${{ steps.removal-pr.outputs.commit-sha }}
        run: |
          set -euo pipefail

          # refresh-pr may report no operation for an unchanged proposal.
          if [[ -z "$PR_NUMBER" ]]; then
            PR_NUMBER="$(gh pr list --repo "$GITHUB_REPOSITORY" \
              --state open --base main --head "$PRUNE_BRANCH" \
              --json number --jq '.[0].number // empty')"
          fi

          if [[ -z "$PR_NUMBER" ]]; then
            echo "::warning::No open quarantine removal PR found; nothing to arm."
            echo "No open quarantine removal PR found; nothing to arm." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          # Queue only the head this job wrote (or, for an unchanged proposal,
          # the head it just compared); a later push must not ride along.
          head="$(gh pr view "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --json headRefOid --jq .headRefOid)"
          if [[ ! "$head" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Could not read the head of removal PR #$PR_NUMBER; not queued."
            exit 1
          fi
          if [[ -n "$WRITTEN_HEAD" && "$head" != "$WRITTEN_HEAD" ]]; then
            echo "::warning::Removal PR #$PR_NUMBER moved past the commit this job wrote; not queued."
            echo "Removal PR #$PR_NUMBER moved past the commit this job wrote; not queued." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if gh pr merge "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --auto --match-head-commit "$head"; then
            echo "Removal PR #$PR_NUMBER entered the merge queue." >> "$GITHUB_STEP_SUMMARY"
          else
            status=$?
            echo "::warning::Could not enqueue removal PR #$PR_NUMBER (exit $status); see the log above."
            echo "Could not enqueue removal PR #$PR_NUMBER (exit $status); see the step log." >> "$GITHUB_STEP_SUMMARY"
          fi
