name: Quarantine Exclude Prune

defaults:
  run:
    shell: bash

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

concurrency:
  group: dated-exception-radar
  cancel-in-progress: false

permissions: {}

jobs:
  prune:
    name: Propose dated exception maintenance
    if: github.repository == 'stella/stella'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
      pull-requests: read
      checks: read
    steps:
      - name: Checkout default branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Setup Bun
        uses: stella/.github/actions/setup-bun-cached@5764ab66e4df84cfd2e642c7d7e4678261e668f8
        with:
          save: ${{ github.ref == 'refs/heads/main' }}
          bun-version-file: package.json

      - name: Install dependencies without write credentials
        timeout-minutes: 20
        run: bun ci --ignore-scripts
        env:
          NPM_TOKEN: ""

      - name: Probe exceptions due within three days
        id: probe
        timeout-minutes: 50
        run: bun scripts/dated-exception-radar.ts --probe --evidence "$RUNNER_TEMP/dated-exception-radar.json"
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Mint app token on write path
        timeout-minutes: 1
        if: steps.probe.outputs.write_needed == 'true'
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.PROVENANCE_APP_ID }}
          private-key: ${{ secrets.PROVENANCE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          permission-pull-requests: write
          permission-actions: write

      - name: Publish proposals and request eligible automatic maintenance
        if: steps.probe.outputs.write_needed == 'true'
        timeout-minutes: 15
        run: bun scripts/dated-exception-radar.ts --publish --evidence "$RUNNER_TEMP/dated-exception-radar.json"
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          MERGE_HOLD: ${{ vars.STELLA_MERGE_HOLD }}

      - name: Check main expiry after publication
        if: always() && steps.probe.outcome == 'success'
        run: |
          bun scripts/dated-waiver-inventory.ts --prepare --tracked-files "$RUNNER_TEMP/dated-exception-files"
          bun --preload ./scripts/offline-network-preload.ts scripts/dated-waivers.ts --check --tracked-files "$RUNNER_TEMP/dated-exception-files"

      - name: Remove runner evidence
        timeout-minutes: 1
        if: always()
        run: rm -f "$RUNNER_TEMP/dated-exception-radar.json"
