name: Scheduled run alerts

defaults:
  run:
    shell: bash

on:
  # Deliberate delivery test after configuring or rotating webhook credentials.
  workflow_dispatch:
  workflow_run:
    workflows:
      - Nightly Full Test
      - Nightly Full Typecheck
      - Nightly Property Tests
      - AI provider canary
      - MCP canary
      - Agent sandbox canary
      - Desktop release canary
      - Landing canary
      - Journey canary
      - User journeys
      - Model Catalog Upstream Check
      # Not scheduled, but unattended: a failed publication leaves the
      # previous build serving, and nobody would learn the new one never
      # landed.
      - Deploy Landing
      # Full audits keep failing without a lockfile fix or a current acceptance;
      # temporary acceptances lapse on expiry or when a fix is published.
      - Dependency Audit
      - Mirror CI service images
      - Publish npm packages
      - Tag verified release
      - Release Artifacts
      - Release rehearsal
      # Fails when a promoted release is not healthy after its window.
      - Release health
      - Release Desktop App
      - Deploy main to staging
      # Every other workflow that runs without a person watching: on a
      # schedule, on main or after another run. These never run on a pull
      # request, so a failure here is the first signal.
      - API test memory measurements
      - Audit Branch Protection
      - Audit image
      - auth.md Spec Drift Check
      - Resolve generated-only conflicts
      - Bundle size nightly
      - Cancel stale merge groups
      - Catalogue Upstream Check
      - Clean queued PR runs
      - CodeQL
      - Dated waiver healing
      - Flaky-test quarantine
      - Dependency Malware Nightly
      - Main heavy suites
      - Main PR-depth checks
      - Mobile Release Plan
      - Record network baseline
      - Provenance Nightly
      - Provider Request Schemas Check
      - Quarantine Exclude Prune
      - Railway Smoke
      - Railway Template Source
      - Version packages PR
      - Warm Safe Chain cache
      - OpenSSF Scorecard
      - security.txt Expiry Guard
      - Sync Branch Protection
      - Publish typecheck base
    # Tag pushes run with the tag as their branch (release.yml on.push.tags).
    branches: [main, "v*"]
    types: [completed]

permissions: {}

jobs:
  notify:
    # A workflow_run trigger is accepted only from the listed workflows of
    # this repository, started by this repository's own events.
    if: >-
      github.event_name == 'workflow_dispatch'
      || ((contains(fromJSON('["failure", "startup_failure", "timed_out"]'), github.event.workflow_run.conclusion)
      || (github.event.workflow_run.conclusion == 'cancelled'
      && contains(fromJSON('[".github/workflows/publish-npm.yml", ".github/workflows/release-tag.yml", ".github/workflows/release.yml", ".github/workflows/release-health.yml", ".github/workflows/release-desktop.yml"]'), github.event.workflow_run.path)))
      && github.event.workflow_run.head_repository.full_name == github.repository
      && contains(fromJSON('[".github/workflows/nightly-test.yml", ".github/workflows/nightly-typecheck.yml", ".github/workflows/nightly-property-test.yml", ".github/workflows/ai-provider-canary.yml", ".github/workflows/mcp-canary.yml", ".github/workflows/agent-sandbox-canary.yml", ".github/workflows/desktop-release-canary.yml", ".github/workflows/landing-canary.yml", ".github/workflows/journey-canary.yml", ".github/workflows/user-journeys.yml", ".github/workflows/model-catalog-check.yml", ".github/workflows/deploy-landing.yml", ".github/workflows/dependency-audit.yml", ".github/workflows/mirror-ci-service-images.yml", ".github/workflows/publish-npm.yml", ".github/workflows/release-tag.yml", ".github/workflows/release.yml", ".github/workflows/release-rehearsal.yml", ".github/workflows/release-health.yml", ".github/workflows/release-desktop.yml", ".github/workflows/deploy-staging.yml", ".github/workflows/api-test-memory.yml", ".github/workflows/audit-branch-protection.yml", ".github/workflows/audit-image.yml", ".github/workflows/auth-md-spec-check.yml", ".github/workflows/autofix-generated-conflicts.yml", ".github/workflows/bundle-size-nightly.yml", ".github/workflows/cancel-stale-merge-groups.yml", ".github/workflows/catalogue-upstream.yml", ".github/workflows/codeql.yml", ".github/workflows/dated-waiver-healing.yml", ".github/workflows/dependency-malware-nightly.yml", ".github/workflows/main-heavy.yml", ".github/workflows/main-pr-depth.yml", ".github/workflows/mobile-release-plan.yml", ".github/workflows/network-baseline-record.yml", ".github/workflows/provenance-nightly.yml", ".github/workflows/provider-request-schemas-check.yml", ".github/workflows/quarantine-prune.yml", ".github/workflows/railway-smoke.yml", ".github/workflows/railway-template-source.yml", ".github/workflows/release-pr.yml", ".github/workflows/safe-chain-cache.yml", ".github/workflows/scorecard.yml", ".github/workflows/security-txt-guard.yml", ".github/workflows/sync-branch-protection.yml", ".github/workflows/typecheck-base.yml", ".github/workflows/flaky-test-quarantine.yml"]'), github.event.workflow_run.path)
      && contains(fromJSON('["push", "schedule", "workflow_dispatch", "workflow_run", "deployment_status", "delete"]'), github.event.workflow_run.event))
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: read
      statuses: read
    steps:
      - name: Checkout GitHub API tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.repository }}
          ref: ${{ github.workflow_sha }}
          path: .gh-retry
          persist-credentials: false
          sparse-checkout: |
            scripts/gh-retry.sh
            scripts/main-heavy-alert-kind.mjs
          sparse-checkout-cone-mode: false

      - name: Preserve GitHub API tooling across source checkouts
        run: |
          cp "$GITHUB_WORKSPACE/.gh-retry/scripts/gh-retry.sh" "$RUNNER_TEMP/gh-retry.sh"
          echo "GH_RETRY_SCRIPT=$RUNNER_TEMP/gh-retry.sh" >> "$GITHUB_ENV"

      # A cancelled release run pages unless another run fully replaces it:
      # GitHub superseded it (a job annotated as cancelled for a newer waiting
      # run of its concurrency group, or a pending run that never started a
      # job) AND a newer run of the same workflow does the same work (same
      # commit, event and run title, for a workflow whose run title names its
      # work). Every unreadable record pages. A recovery resets the outage;
      # cancelled/skipped runs and unfinished newer runs do not reset it, an
      # unreadable history counts as no outage, and manual delivery tests
      # always send. A failure of this step pages as well.
      - name: Detect a continuing outage
        id: outage
        if: github.event_name == 'workflow_run'
        timeout-minutes: 2
        env:
          GH_TOKEN: ${{ github.token }}
          WORKFLOW_ID: ${{ github.event.workflow_run.workflow_id }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          RUN_NUMBER: ${{ github.event.workflow_run.run_number }}
          RUN_BRANCH: ${{ github.event.workflow_run.head_branch }}
          RUN_EVENT: ${{ github.event.workflow_run.event }}
          RUN_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          RUN_PATH: ${{ github.event.workflow_run.path }}
          RUN_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          RUN_TITLE: ${{ github.event.workflow_run.display_title }}
        run: |
          set -euo pipefail
          superseded_by_newer_run() {
            local jobs check_runs check_run annotations newer superseded=false
            jobs=$(bash "$GH_RETRY_SCRIPT" api "repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}/jobs?per_page=100") || {
              echo "::warning::Cancelled run jobs were unavailable; alerting."
              return 1
            }
            if jq -e '.total_count == 0 and .jobs == []' <<< "$jobs" > /dev/null 2>&1; then
              # A pending run replaced in its concurrency group starts no job.
              superseded=true
            else
              check_runs=$(jq -r '.jobs[] | select(.conclusion == "cancelled") | .check_run_url // empty' <<< "$jobs") || {
                echo "::warning::Cancelled run jobs were unreadable; alerting."
                return 1
              }
              while IFS= read -r check_run; do
                [[ "$check_run" == "https://api.github.com/repos/${GITHUB_REPOSITORY}/check-runs/"* ]] || continue
                annotations=$(bash "$GH_RETRY_SCRIPT" api "$check_run/annotations?per_page=100") || {
                  echo "::warning::Cancelled job annotations were unavailable; alerting."
                  return 1
                }
                if jq -e 'any(.[]; (.message // "") | test("^Canceling since a higher priority waiting request for .+ exists$"))' <<< "$annotations" > /dev/null 2>&1; then
                  superseded=true
                  break
                fi
              done <<< "$check_runs"
            fi
            [[ "$superseded" == true ]] || return 1
            # Only these run titles name the release or commit a run works on;
            # release-tag runs and npm dispatch or follow-up runs share one
            # title across candidates, so their cancels always page.
            case "$RUN_PATH:$RUN_EVENT" in
              .github/workflows/release.yml:* | .github/workflows/release-health.yml:* | .github/workflows/release-desktop.yml:* | .github/workflows/publish-npm.yml:push) ;;
              *)
                echo "::warning::Runs of this workflow and event do not name their work; alerting."
                return 1
                ;;
            esac
            newer=$(bash "$GH_RETRY_SCRIPT" api --method GET "repos/${GITHUB_REPOSITORY}/actions/workflows/${WORKFLOW_ID}/runs" \
              -f head_sha="$RUN_HEAD_SHA" -f event="$RUN_EVENT" -f per_page=100 |
              jq -er --argjson number "$RUN_NUMBER" --arg sha "$RUN_HEAD_SHA" --arg event "$RUN_EVENT" --arg title "$RUN_TITLE" '
                [.workflow_runs[]
                  | select(.run_number > $number)
                  | select(.head_sha == $sha and .event == $event and .display_title == $title)]
                | length') || {
              echo "::warning::Newer runs were unavailable; alerting."
              return 1
            }
            [[ "$newer" != 0 ]] || {
              echo "::warning::No newer run does the same work; alerting."
              return 1
            }
          }
          if [[ "$RUN_CONCLUSION" == cancelled ]] && superseded_by_newer_run; then
            echo "send=false" >> "$GITHUB_OUTPUT"
            echo "::notice::A newer run of the same work superseded this cancelled run."
            exit 0
          fi
          previous=$(bash "$GH_RETRY_SCRIPT" api --method GET "repos/${GITHUB_REPOSITORY}/actions/workflows/${WORKFLOW_ID}/runs" \
            -f branch="$RUN_BRANCH" -f event="$RUN_EVENT" -f status=completed -f per_page=100 |
            jq -er --argjson number "$RUN_NUMBER" '
              [.workflow_runs[]
                | select(.run_number < $number)
                | select(.conclusion != "cancelled" and .conclusion != "skipped")]
              | sort_by(.run_number) | last | .conclusion // "none"') || {
            echo "::warning::Earlier runs were unavailable; alerting."
            previous=none
          }
          case "$previous" in
            failure|startup_failure|timed_out)
              echo "send=false" >> "$GITHUB_OUTPUT"
              echo "::notice::Suppressing repeated workflow failure during a continuing outage."
              ;;
            *) echo "send=true" >> "$GITHUB_OUTPUT" ;;
          esac

      - name: Classify main-heavy infrastructure failures
        id: classification
        continue-on-error: true
        if: >-
          github.event_name == 'workflow_run'
          && github.event.workflow_run.path == '.github/workflows/main-heavy.yml'
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          kind=$(bash "$GH_RETRY_SCRIPT" api --paginate --slurp \
            "repos/$GITHUB_REPOSITORY/commits/$HEAD_SHA/statuses?per_page=100" |
            node .gh-retry/scripts/main-heavy-alert-kind.mjs "$RUN_URL" "$RUN_ID")
          echo "kind=$kind" >> "$GITHUB_OUTPUT"

      - name: Send failure alert
        timeout-minutes: 2
        # A failed decision pages instead of staying silent.
        if: >-
          !cancelled()
          && (github.event_name == 'workflow_dispatch'
          || steps.outage.outputs.send == 'true'
          || failure())
        env:
          WEBHOOK_URL: ${{ secrets.SCHEDULED_ALERTS_WEBHOOK_URL }}
          WEBHOOK_TOKEN: ${{ secrets.SCHEDULED_ALERTS_WEBHOOK_TOKEN }}
          WEBHOOK_HEADERS: ${{ secrets.SCHEDULED_ALERTS_WEBHOOK_HEADERS }}
          ALERT_KIND: ${{ github.event_name == 'workflow_dispatch' && 'Alert delivery test' || github.event.workflow_run.conclusion == 'cancelled' && 'Cancelled release run' || steps.classification.outputs.kind || 'Failed workflow' }}
          WORKFLOW_NAME: ${{ github.event.workflow_run.name || github.workflow }}
          RUN_URL: ${{ github.event.workflow_run.html_url || format('{0}/{1}/actions/runs/{2}', github.server_url, github.repository, github.run_id) }}
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch || github.ref_name }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
          RUN_EVENT: ${{ github.event.workflow_run.event || github.event_name }}
        run: |
          if [ -z "$WEBHOOK_URL" ]; then
            echo "::error::scheduled-run alert webhook URL is not configured"
            exit 1
          fi
          header_args=()
          if [ -n "$WEBHOOK_TOKEN" ]; then
            header_args+=(-H "Authorization: Bearer $WEBHOOK_TOKEN")
          fi
          if [ -n "$WEBHOOK_HEADERS" ]; then
            while IFS= read -r header; do
              if [ -n "$header" ]; then
                header_args+=(-H "$header")
              fi
            done <<< "$WEBHOOK_HEADERS"
          fi
          if [ "${#header_args[@]}" -eq 0 ]; then
            echo "::error::scheduled-run alert webhook credentials are not configured"
            exit 1
          fi
          jq -n --arg text "$ALERT_KIND: $WORKFLOW_NAME (event: $RUN_EVENT, branch: $HEAD_BRANCH, head sha: $HEAD_SHA). Run: $RUN_URL" '{text: $text}' |
            curl --fail-with-body -sS -X POST \
              -H "content-type: application/json" \
              "${header_args[@]}" \
              --data-binary @- \
              "$WEBHOOK_URL"
