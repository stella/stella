name: Provenance Nightly

on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

jobs:
  provenance-update:
    permissions:
      contents: write
      pull-requests: write
    uses: stella/.github/.github/workflows/provenance-update.yml@9a6f0b6dd423b9c368c63d9466b1aebbe6984ba3
    secrets:
      app_id: ${{ secrets.PROVENANCE_APP_ID }}
      app_private_key: ${{ secrets.PROVENANCE_APP_PRIVATE_KEY }}
    with:
      install-command: bun install --frozen-lockfile --ignore-scripts
      provenance-version: v0.1.3
