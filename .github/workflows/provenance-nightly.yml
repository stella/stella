name: Provenance Nightly

defaults:
  run:
    shell: bash

on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  provenance-update:
    permissions:
      contents: write
      pull-requests: write
    uses: stella/.github/.github/workflows/provenance-update.yml@2ba6dc5822df5213c500aa6edb7b6c4bdec56804
    secrets:
      app_id: ${{ secrets.PROVENANCE_APP_ID }}
      app_private_key: ${{ secrets.PROVENANCE_APP_PRIVATE_KEY }}
    with:
      install-command: bun install --frozen-lockfile --ignore-scripts
      provenance-version: v0.1.3
