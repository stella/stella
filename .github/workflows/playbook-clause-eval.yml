name: Playbook clause eval

defaults:
  run:
    shell: bash

# Manual only: each run calls live models. Start it from the Actions tab to
# measure a prompt or model change on the playbook path from rules to verdict.
on:
  workflow_dispatch:
    inputs:
      models:
        description: Comma-separated model ids to evaluate
        required: true
        default: gpt-5.6-luna
        type: string
      runs:
        description: Runs per model
        required: true
        default: "1"
        type: choice
        options:
          - "1"
          - "2"
          - "3"

permissions: {}

jobs:
  playbook-clause-eval:
    name: Playbook clause eval
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    concurrency:
      group: playbook-clause-eval
      cancel-in-progress: false
    steps:
      - name: Checkout default branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Setup Bun
        uses: stella/.github/actions/setup-bun-cached@a6a6cd30646c18321ef71e344bf0af6b8d3634b8
        with:
          save: ${{ github.ref == 'refs/heads/main' }}
          bun-version-file: "package.json"

      - name: Install dependencies
        timeout-minutes: 5
        run: bash scripts/retry.sh bun ci --ignore-scripts
        env:
          NPM_TOKEN: ""

      - name: Run the eval
        working-directory: apps/api
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          USE_MOCK_AI: "false"
          NODE_ENV: development
          STELLA_LOCAL_DEV: "1"
          EVAL_MODELS: ${{ inputs.models }}
          EVAL_RUNS: ${{ inputs.runs }}
        run: |
          report="$RUNNER_TEMP/playbook-clause-eval.json"
          status=0
          bun --env-file=.env.example evals/playbook-clause-extraction.ts \
            --models "$EVAL_MODELS" \
            --runs "$EVAL_RUNS" \
            --json "$report" | tee "$RUNNER_TEMP/playbook-clause-eval.md" || status=$?
          cat "$RUNNER_TEMP/playbook-clause-eval.md" >> "$GITHUB_STEP_SUMMARY"
          exit "$status"

      - name: Upload the eval report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playbook-clause-eval
          path: ${{ runner.temp }}/playbook-clause-eval.*
          if-no-files-found: ignore
          retention-days: 14
