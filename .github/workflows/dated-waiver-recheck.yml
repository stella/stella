name: Dated waiver recheck

on:
  schedule:
    - cron: "41 4 * * *"
  workflow_dispatch:

concurrency:
  group: dated-waiver-recheck
  cancel-in-progress: false

permissions: {}

jobs:
  recheck:
    if: github.repository == 'stella/stella'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout default branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Setup Bun
        uses: stella/.github/actions/setup-bun-cached@167fb396c6c0f4e07296ad2cd72e6ef15367c776
        with:
          save: ${{ github.ref == 'refs/heads/main' }}
          bun-version-file: package.json

      - name: Install dependencies
        run: bun ci --ignore-scripts
        env:
          NPM_TOKEN: ""

      - name: Check review window
        id: due
        # A separate assignment keeps an inventory failure fatal; inside echo
        # it would read as "nothing due" and skip publication silently.
        run: |
          due="$(bun scripts/dated-waivers.ts --due)"
          echo "due=$due" >> "$GITHUB_OUTPUT"

      - name: Mint app token
        if: steps.due.outputs.due == 'true'
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.PROVENANCE_APP_ID }}
          private-key: ${{ secrets.PROVENANCE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          permission-pull-requests: write

      - name: Open or update recheck proposal
        if: steps.due.outputs.due == 'true'
        run: bun scripts/dated-waiver-recheck.ts --publish
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
