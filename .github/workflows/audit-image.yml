name: Audit image

defaults:
  run:
    shell: bash

on:
  # A pull request builds the image only when it changes the image definition.
  # Dependency and toolchain drift is caught by the nightly build of main, or
  # on demand: the build takes up to 45 minutes of a shared runner.
  pull_request:
    paths:
      - .github/workflows/audit-image.yml
      - .dockerignore
      - .gitmodules
      - docker/audit/**
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ (github.event_name == 'pull_request') && format('pr-{0}', github.event.pull_request.number || github.ref) || format('run-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build audit image
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Pull base images
        timeout-minutes: 2
        run: bash scripts/pull-base-images.sh docker/audit/Dockerfile
      - name: Build audit image
        run: docker build --progress=plain --file docker/audit/Dockerfile --tag audit-image:test .
