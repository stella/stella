name: Main heavy suites
defaults:
  run:
    shell: bash

run-name: "Main heavy suites ${{ inputs.sha || github.sha }}"

on:
  push:
    branches: [main]
  schedule:
    # UTC. Hourly off peak; every three hours while merge groups are busy,
    # so this full-width run does not compete with them for hosted runners.
    - cron: "17 0-4,7,10,13,16,18-23 * * *"
  workflow_dispatch:
    inputs:
      release_candidate:
        description: "Validate the pending release VERSION before running this pinned gate"
        required: false
        type: boolean
        default: false
      sha:
        description: Full lowercase commit SHA on main or a same-repository release PR head
        required: true
        type: string

concurrency:
  # Release pushes and pinned gates are independent of schedules and ordinary pushes.
  # Same-SHA release runs coalesce: the running run is never cancelled, and at most one run is pending.
  # A newer same-SHA pending run replaces the older pending run.
  group: >-
    ${{ github.workflow }}-${{ github.event_name == 'workflow_dispatch' && inputs.sha && format('release-{0}', inputs.sha) || github.event_name == 'push' && startsWith(github.event.head_commit.message, 'chore: release v') && format('release-{0}', github.sha) || github.event_name == 'push' && github.run_id || github.ref }}
  cancel-in-progress: "${{ (github.event_name != 'workflow_dispatch' || !inputs.sha) && !startsWith(github.event.head_commit.message, 'chore: release v') }}"

permissions: {}

jobs:
  validate:
    # Ordinary changes coalesce into the next scheduled run; releases run immediately.
    if: >-
      github.event_name != 'push' || startsWith(github.event.head_commit.message, 'chore: release v')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      statuses: read
      checks: read
      actions: write
      pull-requests: read
      issues: read
    outputs:
      sha: ${{ steps.ancestor.outputs.sha }}
      task_cache_producer: ${{ steps.ancestor.outputs.task_cache_producer }}
      proof: ${{ steps.reuse.outputs.proof }}
      main-base: ${{ steps.ancestor.outputs.main-base }}
      run: ${{ steps.reuse.outputs.run || steps.selection.outputs.run }}
    steps:
      - name: Check release candidate
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.sha != '' && inputs.release_candidate == true }}
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          SERVER_URL: ${{ github.server_url }}
          REQUESTED_SHA: ${{ inputs.sha }}
          RELEASE_PROOF_REPOSITORY: ${{ github.repository }}
          RELEASE_TREE_PROOF_VERIFIER: ${{ runner.temp }}/verify-release-tree-proof.sh
          GH_RETRY_SCRIPT: ${{ runner.temp }}/gh-retry.sh
        run: |
          set -euo pipefail
          directory="$RUNNER_TEMP/release-candidate-validation"
          mkdir -p "$directory"
          git -C "$directory" init
          git -C "$directory" remote add origin "$SERVER_URL/$REPOSITORY.git"
          auth=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 | tr -d '\n')
          echo "::add-mask::$auth"
          git -C "$directory" -c "http.extraheader=AUTHORIZATION: basic $auth" fetch --tags origin main:refs/remotes/origin/main
          git -C "$directory" show origin/main:scripts/check-release-candidate.sh > "$RUNNER_TEMP/check-release-candidate.sh"
          git -C "$directory" show origin/main:scripts/verify-release-tree-proof.sh > "$RUNNER_TEMP/verify-release-tree-proof.sh"
          git -C "$directory" show origin/main:scripts/verify-release-candidate-tree.mjs > "$RUNNER_TEMP/verify-release-candidate-tree.mjs"
          git -C "$directory" show origin/main:scripts/gh-retry.sh > "$RUNNER_TEMP/gh-retry.sh"
          git -C "$directory" -c "http.extraheader=AUTHORIZATION: basic $auth" fetch --no-tags origin "$REQUESTED_SHA"
          cd "$directory"
          bash "$RUNNER_TEMP/check-release-candidate.sh" "$REQUESTED_SHA"

      - name: Validate merge queue depth
        env:
          MERGE_QUEUE_DEPTH: ${{ vars.MERGE_QUEUE_DEPTH }}
        run: |
          case "${MERGE_QUEUE_DEPTH:-}" in
            ""|full|thin) ;;
            *)
              echo "::error::Unknown MERGE_QUEUE_DEPTH '$MERGE_QUEUE_DEPTH'; choose full or thin (unset means full)."
              exit 1
              ;;
          esac

      - name: Checkout trusted release proof tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          path: .release-proof
          fetch-depth: 0
          persist-credentials: false
          sparse-checkout: scripts

      # Bun runs the release queue history check the health gate needs before
      # a merge-group receipt may stand in for the heavy statuses.
      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: .release-proof/package.json
          no-cache: true

      - name: Reuse completed release proof
        id: reuse
        working-directory: .release-proof
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ inputs.sha || github.sha }}
        run: |
          set -euo pipefail
          if proof=$(bash scripts/verify-release-tree-proof.sh --find-proof "$GITHUB_REPOSITORY" "$SHA") && [[ -n "$proof" ]]; then
            if bash scripts/check-release-main-health.sh "$GITHUB_REPOSITORY" "$SHA" "$proof"; then
              echo "proof=$proof" >> "$GITHUB_OUTPUT"
              echo "run=false" >> "$GITHUB_OUTPUT"
            else
              echo "run=true" >> "$GITHUB_OUTPUT"
            fi
          fi

      - name: Select untested heavy SHA
        if: steps.reuse.outputs.run != 'false'
        id: selection
        env:
          REUSE_RUN: ${{ steps.reuse.outputs.run }}
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          retries: 0
          script: |
            if (process.env.REUSE_RUN === "true") {
              core.setOutput("run", "true");
              return;
            }
            if (context.eventName !== "schedule") {
              core.setOutput("run", "true");
              return;
            }
            const { data } = await github.rest.repos.listCommitStatusesForRef({
              ...context.repo,
              ref: context.sha,
              per_page: 100,
            });
            // Skipped push runs have no main/heavy status and cannot suppress
            // a scheduled test. Only a completed bot-owned test is evidence.
            const tested = data.some(status => status.context === "main/heavy"
              && status.creator?.login === "github-actions[bot]"
              && ["success", "failure"].includes(status.state));
            const lastHeavySha = tested ? context.sha : undefined;
            const required = lastHeavySha !== context.sha;
            core.setOutput("run", String(required));
            await core.summary.addRaw(required
              ? "Main has an untested heavy SHA; running suites."
              : "Main heavy SHA is unchanged; skipping suites.").write();

      # Suite code only executes after the target has been validated.
      - name: Validate SHA format
        if: steps.selection.outputs.run == 'true'
        env:
          SHA: ${{ inputs.sha || github.sha }}
        run: |
          if [[ ! "$SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::SHA must be a full lowercase 40-hex commit."
            exit 1
          fi

      - name: Fetch main history
        if: steps.selection.outputs.run == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          SERVER_URL: ${{ github.server_url }}
        run: |
          mkdir -p "$RUNNER_TEMP/main-heavy-validation"
          git -C "$RUNNER_TEMP/main-heavy-validation" init
          git -C "$RUNNER_TEMP/main-heavy-validation" remote add origin "$SERVER_URL/$REPOSITORY.git"
          auth=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 | tr -d '\n')
          echo "::add-mask::$auth"
          git -C "$RUNNER_TEMP/main-heavy-validation" -c "http.extraheader=AUTHORIZATION: basic $auth" fetch --no-tags origin main:refs/remotes/origin/main
          git -C "$RUNNER_TEMP/main-heavy-validation" show origin/main:scripts/verify-release-tree-proof.sh > "$RUNNER_TEMP/verify-release-tree-proof.sh"
          git -C "$RUNNER_TEMP/main-heavy-validation" show origin/main:scripts/verify-release-candidate-tree.mjs > "$RUNNER_TEMP/verify-release-candidate-tree.mjs"
          git -C "$RUNNER_TEMP/main-heavy-validation" show origin/main:scripts/gh-retry.sh > "$RUNNER_TEMP/gh-retry.sh"

      - name: Verify main ancestry
        if: steps.selection.outputs.run == 'true'
        id: ancestor
        working-directory: ${{ runner.temp }}/main-heavy-validation
        env:
          SHA: ${{ inputs.sha || github.sha }}
          GH_TOKEN: ${{ github.token }}
          GH_RETRY_SCRIPT: ${{ runner.temp }}/gh-retry.sh
        run: |
          {
            bash "$RUNNER_TEMP/verify-release-tree-proof.sh" --allow-pr-head "$GITHUB_REPOSITORY" "$SHA" "$SHA"
            echo "sha=$SHA"
            echo "task_cache_producer=validated-main"
          } >> "$GITHUB_OUTPUT"

  suites:
    if: needs.validate.result == 'success' && needs.validate.outputs.run == 'true'
    needs: validate
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read
      # The reusable definition also contains the merge-group-only watcher.
      # This ceiling permits its declaration; all executed heavy jobs keep
      # their own read-only permissions, and that watcher never runs here.
      actions: write
      checks: read
      pull-requests: read
      packages: read
    with:
      depth: full
      heavy_only: true
      sha: ${{ needs.validate.outputs.sha }}
      task_cache_producer: ${{ needs.validate.outputs.task_cache_producer }}
    secrets:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}

  status:
    if: always() && needs.validate.result != 'skipped' && needs.validate.outputs.run != 'false' && !needs.validate.outputs.proof
    needs: [validate, suites]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
      statuses: write
    steps:
      - name: Checkout GitHub API tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.repository }}
          ref: ${{ github.workflow_sha }}
          path: .gh-retry
          persist-credentials: false
          sparse-checkout: |
            scripts/gh-retry.sh
            scripts/main-heavy-classification.mjs
          sparse-checkout-cone-mode: false

      - name: Preserve GitHub API tooling across source checkouts
        run: |
          cp "$GITHUB_WORKSPACE/.gh-retry/scripts/gh-retry.sh" "$RUNNER_TEMP/gh-retry.sh"
          echo "GH_RETRY_SCRIPT=$RUNNER_TEMP/gh-retry.sh" >> "$GITHUB_ENV"

      - name: Classify failed heavy jobs
        id: classification
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        env:
          SHA: ${{ needs.validate.outputs.sha }}
          RESULTS: ${{ toJSON(needs) }}
        with:
          script: |
            const { pathToFileURL } = require('node:url');
            const { resolve } = require('node:path');
            const { collectMainHeavyFailures } = await import(pathToFileURL(
              resolve('.gh-retry/scripts/main-heavy-classification.mjs')).href);
            const results = JSON.parse(process.env.RESULTS);
            if (Object.values(results).every(({ result }) => result === 'success')) {
              core.setOutput('description', 'Main heavy suites: success');
              return;
            }
            let failures;
            try {
              failures = await collectMainHeavyFailures({ github, context,
                sha: process.env.SHA, results, warn: message => core.warning(message) });
            } catch {
              core.warning('Job evidence is unavailable; failures remain CODE.');
              failures = Object.entries(results).filter(([, { result }]) => result !== 'success')
                .map(([name]) => ({ name, type: 'CODE', reason: 'Job evidence is unavailable.' }));
            }
            const code = failures.filter(({ type }) => type === 'CODE').length;
            const infra = failures.filter(({ type }) => type === 'INFRA').length;
            core.setOutput('description', `Main heavy suites: failure (CODE ${code}, INFRA ${infra})`);
            await core.summary.addHeading('Main heavy failures').addTable([
              [{ data: 'Job', header: true }, { data: 'Classification', header: true },
                { data: 'Evidence', header: true }],
              ...failures.map(({ name, type, reason }) => [name, type, reason]),
            ]).write();

      - name: Publish heavy conclusion
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          SHA: ${{ needs.validate.outputs.sha }}
          RESULTS: ${{ toJSON(needs) }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          DESCRIPTION: ${{ steps.classification.outputs.description }}
          PROOF_MAIN_BASE: ${{ needs.validate.outputs.main-base }}
        run: |
          state=failure
          if jq -e 'all(.[]; .result == "success")' <<< "$RESULTS" > /dev/null; then
            state=success
          fi
          if [[ -n "$PROOF_MAIN_BASE" ]]; then
            DESCRIPTION="${DESCRIPTION:-Main heavy suites: $state}; main=$PROOF_MAIN_BASE"
          fi
          if [[ -n "$SHA" ]]; then
            bash "$GH_RETRY_SCRIPT" api --method POST "repos/$REPOSITORY/statuses/$SHA" \
              -f context=main/heavy -f state="$state" \
              -f description="${DESCRIPTION:-Main heavy suites: $state}" -f target_url="$RUN_URL"
          fi
          [[ "$state" == success ]]
