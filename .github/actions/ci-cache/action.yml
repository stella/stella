name: Non-fatal CI cache transport
description: Treat cache service failures as restore misses or skipped saves.
inputs:
  operation:
    description: Cache operation (restore or save).
    required: true
  path:
    description: Paths to restore or save.
    required: true
  key:
    description: Cache key.
    required: true
  restore-keys:
    description: Ordered restore key prefixes.
    required: false
    default: ""
outputs:
  cache-hit:
    description: Whether the exact key was restored.
    value: ${{ steps.restore.outcome == 'success' && steps.restore.outputs.cache-hit || 'false' }}
  cache-matched-key:
    description: Key matched by the restore.
    value: ${{ steps.restore.outcome == 'success' && steps.restore.outputs.cache-matched-key || '' }}
runs:
  using: composite
  steps:
    - name: Restore cache
      id: restore
      if: inputs.operation == 'restore'
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      continue-on-error: true
      timeout-minutes: 6
      env:
        SEGMENT_DOWNLOAD_TIMEOUT_MINS: "5"
      with:
        path: ${{ inputs.path }}
        key: ${{ inputs.key }}
        restore-keys: ${{ inputs.restore-keys }}

    - name: Discard failed cache restore
      if: inputs.operation == 'restore' && steps.restore.outcome == 'failure'
      shell: bash
      env:
        CACHE_PATHS: ${{ inputs.path }}
      run: |
        echo "::warning title=cache-restore-skipped::kind=infra class=cache-restore outcome=skipped reason=failure"
        while IFS= read -r cache_path; do
          [[ -n "$cache_path" ]] || continue
          if [[ "$cache_path" == '~/'* ]]; then
            cache_path="$HOME/${cache_path#\~/}"
          fi
          rm -rf -- "$cache_path"
        done <<< "$CACHE_PATHS"

    - name: Save cache
      id: save
      if: inputs.operation == 'save'
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      continue-on-error: true
      timeout-minutes: 6
      with:
        path: ${{ inputs.path }}
        key: ${{ inputs.key }}

    - name: Report skipped cache save
      if: inputs.operation == 'save' && steps.save.outcome == 'failure'
      shell: bash
      run: echo "::warning title=cache-save-skipped::kind=infra class=cache-save outcome=skipped reason=failure"
