name: Capture marketing screenshots
description: Seed the app on the CI runner and either compare or rewrite the committed product screenshots

# The one body behind both directions of the baselines. `check` and `update`
# are separate jobs in marketing-screenshots.yml because only `update` may
# declare the release-app environment, so "what CI compares" and "what CI
# regenerates" have to meet here instead of in two drifting job bodies.
#
# The checkout stays with the caller: check captures the triggering ref,
# update captures the branch it was told to regenerate.
#
# The web app is served from a production build, the same way the e2e shards
# serve it, never from the Vite dev server: a cold dev start on a busy runner
# can exceed any fixed wait, and a mid-session dependency re-optimize tears
# frames. PR CI hands over the `web-build` job's artifact; the nightly and
# update callers have no such job and build here.

inputs:
  mode:
    description: check compares committed baselines; update rewrites them in the workspace
    required: true
  web-build-artifact:
    description: Name of a production web build artifact published earlier in this run; empty builds the web app here
    required: false
    default: ""
  dockerhub-username:
    description: Docker Hub username for authenticated infrastructure image pulls
    required: false
    default: ""
  dockerhub-token:
    description: Docker Hub token for authenticated infrastructure image pulls
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Validate mode
      # Both callers gate on the mode, but only one of them can see an
      # unrecognised value: the check job runs on anything that is not
      # `update`, so a typo fails here instead of skipping both jobs green.
      shell: bash
      env:
        MODE: ${{ inputs.mode }}
      run: |
        case "$MODE" in
          check|update) ;;
          *)
            echo "::error::Unknown marketing screenshot mode: $MODE"
            exit 1
            ;;
        esac

    - name: Setup Bun
      uses: stella/.github/actions/setup-bun-cached@2b8697f04b39187c934afc04f7b04ad1a18bd827

    - name: Install dependencies
      shell: bash
      run: bash scripts/bun-ci-retry.sh --ignore-scripts
      env:
        NPM_TOKEN: ""

    - name: Prepare environment
      shell: bash
      run: |
        cd ./apps/api
        cp .env.example .env
        cd ../web
        cp .env.example .env

    - name: Build production web
      # No artifact was handed over (nightly, update): build the same bundle
      # the `web-build` job in ci.yml produces, flags included, so a capture
      # renders the feature-complete surface on every caller.
      if: inputs.web-build-artifact == ''
      shell: bash
      env:
        VITE_FEATURE_TIME_BILLING: "true"
        VITE_PUBLIC_LAW_ENABLED: "true"
        VITE_PUBLIC_TOOLS_ENABLED: "true"
        VITE_WORKFLOWS_ENABLED: "true"
      run: bun --filter @stll/web build

    - name: Start docker stack and API server
      id: e2e-stack
      uses: ./.github/actions/setup-e2e-stack
      with:
        dockerhub-username: ${{ inputs.dockerhub-username }}
        dockerhub-token: ${{ inputs.dockerhub-token }}
        # Document conversion backs the seeded product scenes the captures
        # render.
        extra-services: gotenberg

    - name: Require the stack
      # The action exits 0 with `status=rate-limited` when Docker Hub throttles
      # the image pulls. The e2e suites accept that skip; this capture cannot: it
      # is the only guard on assets that ship on the marketing site, so a skipped
      # run would report success without comparing a single PNG. Every later
      # `status == 'ready'` condition is therefore unreachable-if-false, and only
      # the `always()` cleanup steps still test it.
      if: steps.e2e-stack.outputs.status != 'ready'
      shell: bash
      env:
        STATUS: ${{ steps.e2e-stack.outputs.status }}
      run: |
        echo "::error::E2E stack status is '$STATUS', not 'ready'; marketing screenshots were neither compared nor regenerated"
        exit 1

    - name: Wait for production web build
      # Same bounded poll as the e2e shards: the build job runs concurrently
      # with this one, and once it has ended without publishing the artifact
      # can never appear.
      if: inputs.web-build-artifact != ''
      shell: bash
      env:
        ARTIFACT_NAME: ${{ inputs.web-build-artifact }}
        GH_TOKEN: ${{ github.token }}
      run: |
        for attempt in {1..180}; do
          count=$(gh api --method GET \
            "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts" \
            -f name="$ARTIFACT_NAME" \
            --jq '[.artifacts[] | select(.expired == false)] | length')
          if [[ "$count" -gt 0 ]]; then
            echo "Production web build ready after $((attempt * 2))s"
            exit 0
          fi
          if (( attempt % 5 == 0 )); then
            conclusion=$(gh api --paginate \
              "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/jobs" \
              --jq '.jobs[] | select(.name == "web-build") | .conclusion // "in_progress"' \
              | head -n 1)
            case "$conclusion" in
              failure|cancelled|skipped|timed_out)
                echo "::error::web-build ended with status '$conclusion' without publishing the $ARTIFACT_NAME artifact"
                exit 1
                ;;
            esac
          fi
          sleep 2
        done
        echo "::error::Production web build artifact was not published"
        exit 1

    - name: Download production web build
      if: inputs.web-build-artifact != ''
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        name: ${{ inputs.web-build-artifact }}
        path: apps/web/dist

    - name: Validate production web build
      # An artifact is only handed over by PR CI, which captures the triggering
      # commit, so the build must be for exactly that commit.
      if: inputs.web-build-artifact != ''
      shell: bash
      run: |
        for side in client server; do
          manifest="apps/web/dist/$side/version.json"
          commit=$(jq -r '.commit' "$manifest")
          if [[ "$commit" != "$GITHUB_SHA" ]]; then
            echo "::error::$side build is for $commit, expected $GITHUB_SHA"
            exit 1
          fi
        done

    - name: Start production web server
      shell: bash
      run: |
        cd apps/web
        NODE_ENV=production PORT=3000 nohup bun dist/runtime.js > /tmp/web.log 2>&1 &
        echo $! > /tmp/web.pid

    - name: Wait for production web server
      shell: bash
      run: |
        for i in {1..60}; do
          if curl --connect-timeout 2 --max-time 5 -sf http://localhost:3000/health > /dev/null 2>&1; then
            echo "Production web up after ${i}s"
            exit 0
          fi
          sleep 1
        done
        echo "::error::Production web never came up"
        tail -200 /tmp/web.log || true
        exit 1

    - name: Install Playwright browsers
      uses: ./.github/actions/setup-playwright
      with:
        dependency-mode: full

    - name: Seed deterministic marketing content
      shell: bash
      run: bun --filter @stll/api db:seed-dev

    - name: Capture marketing screenshots
      shell: bash
      env:
        MODE: ${{ inputs.mode }}
      run: |
        # The `--update-snapshots` flag lives in the package script alone, so
        # there is one place that knows how a baseline is rewritten.
        if [[ "$MODE" == "update" ]]; then
          bun --filter @stll/web test:e2e:marketing:update
        else
          bun --filter @stll/web test:e2e:marketing
        fi

    - name: Stop production web server
      if: always() && steps.e2e-stack.outputs.status == 'ready'
      shell: bash
      run: |
        if [[ -f /tmp/web.pid ]]; then
          kill "$(cat /tmp/web.pid)" || true
          rm -f /tmp/web.pid
        fi
