name: Attest build provenance
description: >
  Attest build provenance for release files or an image digest; image
  attestations are also pushed to the registry. A failed attempt is retried once
  before failing the job.

inputs:
  subject-name:
    description: Fully qualified image name (registry/repository)
    required: false
    default: ""
  subject-digest:
    description: Image digest (sha256:...) to attest
    required: false
    default: ""
  subject-path:
    description: Release file paths or glob; mutually exclusive with subject-digest
    required: false
    default: ""
  source-sha:
    description: Exact staging source checkout SHA (paired with main-sha)
    required: false
    default: ""
  main-sha:
    description: Resolved main first-parent history anchor for staging
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Bind staging source checkout
      if: inputs.source-sha != '' || inputs.main-sha != ''
      id: source
      shell: bash
      env:
        SOURCE_SHA: ${{ inputs.source-sha }}
        MAIN_SHA: ${{ inputs.main-sha }}
      run: |
        predicate=$(bash "$GITHUB_ACTION_PATH/../../../scripts/staging-source-predicate.sh" --sha "$SOURCE_SHA" --main-sha "$MAIN_SHA")
        echo "predicate=$predicate" >> "$GITHUB_OUTPUT"

    - name: Attest
      id: attest
      continue-on-error: true
      uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
      with:
        subject-path: ${{ inputs.subject-path }}
        subject-name: ${{ inputs.subject-name }}
        subject-digest: ${{ inputs.subject-digest }}
        push-to-registry: ${{ inputs.subject-path == '' }}

    - name: Wait before retry
      if: steps.attest.outcome == 'failure'
      shell: bash
      run: sleep 10

    - name: Attest (retry)
      if: steps.attest.outcome == 'failure'
      uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
      with:
        subject-path: ${{ inputs.subject-path }}
        subject-name: ${{ inputs.subject-name }}
        subject-digest: ${{ inputs.subject-digest }}
        push-to-registry: ${{ inputs.subject-path == '' }}

    - name: Attest staging source binding
      if: inputs.source-sha != ''
      id: staging-source
      continue-on-error: true
      uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
      with:
        subject-name: ${{ inputs.subject-name }}
        subject-digest: ${{ inputs.subject-digest }}
        predicate-type: https://github.com/stella/stella/attestations/staging-source/v1
        predicate: ${{ steps.source.outputs.predicate }}
        push-to-registry: true

    - name: Wait before staging source retry
      if: steps.staging-source.outcome == 'failure'
      shell: bash
      run: sleep 10

    - name: Attest staging source binding (retry)
      if: steps.staging-source.outcome == 'failure'
      uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
      with:
        subject-name: ${{ inputs.subject-name }}
        subject-digest: ${{ inputs.subject-digest }}
        predicate-type: https://github.com/stella/stella/attestations/staging-source/v1
        predicate: ${{ steps.source.outputs.predicate }}
        push-to-registry: true
