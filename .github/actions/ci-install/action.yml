name: Install scoped Bun dependencies
description: Restore a sealed scope-specific package store and run one frozen install.
inputs:
  flags:
    description: Ordered JSON array of frozen install flags and filters.
    required: true
  log-file:
    description: Complete installer log path.
    required: false
    default: ""
  installer-budget-ms:
    description: Optional installer warning budget in milliseconds.
    required: false
    default: ""
  cache-write:
    description: Designated saver uses save; other callers only restore.
    required: false
    default: restore
outputs:
  cache-hit:
    description: Whether the exact scoped archive was restored.
    value: ${{ steps.cache.outputs.cache-hit }}
  key:
    description: Frozen-input and platform identity of the store.
    value: ${{ steps.identity.outputs.key }}
  restore-ms:
    description: Archive restoration and verification elapsed time in milliseconds.
    value: ${{ steps.restore-time.outputs.milliseconds }}
  install-ms:
    description: Frozen install and sealing elapsed time in milliseconds.
    value: ${{ steps.install-time.outputs.milliseconds }}
runs:
  using: composite
  steps:
    - name: Require zstd for install-store archives
      id: compression
      continue-on-error: true
      shell: bash
      run: |
        if command -v zstd >/dev/null && zstd --version; then
          exit 0
        fi
        # Playwright containers do not include zstd. Failure disables caching,
        # never the frozen install, and cannot fall back to a gzip-only version.
        if [[ "$RUNNER_OS" == Linux ]]; then
          if [[ "$(id -u)" == 0 ]]; then
            apt-get update && apt-get install -y --no-install-recommends zstd
          else
            sudo apt-get update && sudo apt-get install -y --no-install-recommends zstd
          fi
        fi
        if ! command -v zstd >/dev/null || ! zstd --version; then
          echo "::warning title=install-store-compression::zstd unavailable; skipping install-store cache."
          exit 1
        fi
    - name: Derive complete install-store identity
      id: identity
      shell: bash
      env:
        STELLA_CI_INSTALL_FLAGS: ${{ inputs.flags }}
      run: |
        bun scripts/ci-install-store.ts key >> "$GITHUB_OUTPUT"
        key=$(bun scripts/ci-install-store.ts key | sed -n 's/^key=//p')
        if [[ -z "$key" ]]; then
          echo "::error title=install-store-identity::kind=infra class=install-store-identity Missing install-store key"
          exit 1
        fi
        echo "artifact-id=$(bun -e 'console.log(crypto.randomUUID())')" >> "$GITHUB_OUTPUT"
        echo "start=$(bun -e 'console.log(Date.now())')" >> "$GITHUB_OUTPUT"
    - name: Alias the hosted work directory inside job containers
      if: steps.identity.outputs.alias-link != ''
      shell: bash
      env:
        ALIAS_LINK: ${{ steps.identity.outputs.alias-link }}
        ALIAS_TARGET: ${{ steps.identity.outputs.alias-target }}
      run: |
        # The store path and its absolute Bun links name the hosted path.
        sudo_cmd=()
        if [[ "$(id -u)" != 0 ]]; then
          sudo_cmd=(sudo)
        fi
        "${sudo_cmd[@]}" mkdir -p "$(dirname "$ALIAS_LINK")"
        if [[ ! -e "$ALIAS_LINK" ]]; then
          "${sudo_cmd[@]}" ln -s "$ALIAS_TARGET" "$ALIAS_LINK"
        fi
        if [[ "$(realpath "$ALIAS_LINK")" != "$(realpath "$ALIAS_TARGET")" ]]; then
          echo "::error title=install-store-alias::$ALIAS_LINK does not resolve to $ALIAS_TARGET"
          exit 1
        fi
    - name: Restore exact or newest compatible complete install store
      id: cache
      if: steps.compression.outcome == 'success'
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ steps.identity.outputs.store }}
        key: ${{ steps.identity.outputs.key }}
        restore-keys: ${{ steps.identity.outputs.restore-prefix }}
    - name: Record restore time and verify exact store
      id: restore-time
      shell: bash
      env:
        BUN_INSTALL_CACHE_DIR: ${{ steps.identity.outputs.store }}
        CACHE_HIT: ${{ steps.cache.outputs.cache-hit }}
        MATCHED_KEY: ${{ steps.cache.outputs.cache-matched-key }}
        STORE_KEY: ${{ steps.identity.outputs.key }}
        START_MS: ${{ steps.identity.outputs.start }}
      run: |
        # Later host and container steps must resolve the same global-store links.
        echo "BUN_INSTALL_CACHE_DIR=$BUN_INSTALL_CACHE_DIR" >> "$GITHUB_ENV"
        outcome=cold
        if [[ "$CACHE_HIT" == true ]]; then
          # An archive under an immutable key cannot be replaced, so a failed
          # verification falls back to a cold frozen install instead of failing.
          if ! bun scripts/ci-install-store.ts verify "$STORE_KEY"; then
            echo "::warning title=install-store-invalid::Restored install store $STORE_KEY failed verification; installing cold."
            rm -rf "$BUN_INSTALL_CACHE_DIR"
          else
            outcome=hit
          fi
        elif [[ -n "$MATCHED_KEY" ]]; then
          # Prefix restores are useful seeds, but only the exact key is trusted
          # as complete. The frozen install fills the delta before pruning.
          rm -f "$BUN_INSTALL_CACHE_DIR/.stella-install-complete"
          outcome=partial
        fi
        echo "outcome=$outcome" >> "$GITHUB_OUTPUT"
        end=$(bun -e 'console.log(Date.now())')
        echo "milliseconds=$((end - START_MS))" >> "$GITHUB_OUTPUT"
        echo "start=$end" >> "$GITHUB_OUTPUT"
    - name: Run frozen install with progress watchdog
      id: install
      shell: bash
      env:
        BUN_INSTALL_CACHE_DIR: ${{ steps.identity.outputs.store }}
        STELLA_CI_INSTALL_FLAGS: ${{ inputs.flags }}
        INSTALL_LOG: ${{ inputs.log-file }}
        STELLA_CI_INSTALL_BUDGET_MS: ${{ inputs.installer-budget-ms }}
        STELLA_CI_INSTALL_RESTORE: ${{ steps.restore-time.outputs.outcome }}
        STELLA_CI_INSTALL_KEY: ${{ steps.identity.outputs.key }}
        NPM_TOKEN: ""
      run: bun scripts/ci-install.ts "${INSTALL_LOG:-$RUNNER_TEMP/bun-install/$GITHUB_JOB.log}"
    - name: Record install time and seal successful store
      id: install-time
      if: ${{ always() && steps.install.outcome != 'skipped' }}
      continue-on-error: true
      shell: bash
      env:
        INSTALL_OUTCOME: ${{ steps.install.outcome }}
        CACHE_WRITE: ${{ inputs.cache-write }}
        CACHE_HIT: ${{ steps.cache.outputs.cache-hit }}
        BUN_INSTALL_CACHE_DIR: ${{ steps.identity.outputs.store }}
        STORE_KEY: ${{ steps.identity.outputs.key }}
        START_MS: ${{ steps.restore-time.outputs.start }}
      run: |
        if [[ "$INSTALL_OUTCOME" == success && "$CACHE_WRITE" == save && "$CACHE_HIT" != true ]]; then
          bun scripts/ci-install-store.ts prune "$STORE_KEY"
          if ! bun scripts/ci-install-store.ts seal "$STORE_KEY"; then
            echo "::warning title=install-store-save::Store sealing failed; skipping cache save."
            echo '{"event":"install-store-save","outcome":"seal-failed"}'
            exit 1
          fi
        fi
        end=$(bun -e 'console.log(Date.now())')
        echo "milliseconds=$((end - START_MS))" >> "$GITHUB_OUTPUT"
    - name: Save newly sealed install store
      if: ${{ github.ref == 'refs/heads/main' && inputs.cache-write == 'save' && steps.install-time.outcome == 'success' && steps.compression.outcome == 'success' && steps.cache.outputs.cache-hit != 'true' }}
      continue-on-error: true
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ steps.identity.outputs.store }}
        key: ${{ steps.identity.outputs.key }}
    - name: Upload bounded installer failure log
      if: failure()
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: bun-install-${{ github.job }}-${{ steps.identity.outputs.artifact-id }}
        path: ${{ runner.temp }}/bun-install/*.log
        if-no-files-found: ignore
        retention-days: 7
