name: Setup production E2E
description: Start the same seeded production browser stack for network baseline checks and recording

inputs:
  expected-sha:
    description: Commit recorded in the production web build manifest
    required: true
  dockerhub-username:
    description: Optional Docker Hub username for image pulls
    required: false
    default: ""
  dockerhub-token:
    description: Optional Docker Hub token for image pulls
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Prepare environment
      shell: bash
      run: |
        cp apps/api/.env.example apps/api/.env
        # The route baseline measures the enabled usage endpoint's query budget.
        echo 'FEATURE_USAGE=true' >> apps/api/.env
        cp apps/web/.env.example apps/web/.env

    - name: Start docker stack and API server
      id: stack
      uses: ./.github/actions/setup-e2e-stack
      with:
        dockerhub-username: ${{ inputs.dockerhub-username }}
        dockerhub-token: ${{ inputs.dockerhub-token }}

    - name: Install Playwright browsers
      if: steps.stack.outcome == 'success'
      uses: ./.github/actions/setup-playwright

    - name: Download production web build
      if: steps.stack.outcome == 'success'
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        name: e2e-web-build
        path: apps/web/dist

    # The manifest is written by the build, so this only catches a build
    # artifact from another commit; it is not an integrity check.
    - name: Validate production web build
      if: steps.stack.outcome == 'success'
      shell: bash
      env:
        EXPECTED_SHA: ${{ inputs.expected-sha }}
      run: |
        for side in client server; do
          manifest="apps/web/dist/$side/version.json"
          commit=$(jq -r '.commit' "$manifest")
          if [[ "$commit" != "$EXPECTED_SHA" ]]; then
            echo "::error::$side build is for $commit, expected $EXPECTED_SHA"
            exit 1
          fi
        done

    - name: Start production web server
      if: steps.stack.outcome == 'success'
      shell: bash
      run: |
        cd apps/web
        NODE_ENV=production PORT=3000 nohup bun dist/runtime.js > /tmp/web-production.log 2>&1 &
        echo $! > /tmp/web-production.pid

    - name: Wait for production web server
      if: steps.stack.outcome == 'success'
      shell: bash
      run: |
        for i in {1..60}; do
          if curl --connect-timeout 2 --max-time 5 -sf http://localhost:3000/health > /dev/null 2>&1; then
            echo "Production web up after ${i}s"
            exit 0
          fi
          sleep 1
        done
        echo "::error::Production web never came up"
        tail -200 /tmp/web-production.log || true
        exit 1
