name: Retry partial-clone checkout
description: Check out a blobless partial clone and retry one transient lazy blob fetch failure.

inputs:
  repository:
    description: Repository name with owner.
    required: false
    default: ${{ github.repository }}
  ref:
    description: Branch, tag, or SHA to check out.
    required: false
    default: ""
  token:
    description: Token used to fetch the repository.
    required: false
    default: ${{ github.token }}
  ssh-key:
    description: SSH key used to fetch the repository.
    required: false
    default: ""
  ssh-known-hosts:
    description: Additional SSH known hosts.
    required: false
    default: ""
  ssh-strict:
    description: Whether to perform strict host key checking.
    required: false
    default: "true"
  ssh-user:
    description: User for SSH connections.
    required: false
    default: git
  persist-credentials:
    description: Whether to persist credentials in the local Git config.
    required: false
    default: "true"
  path:
    description: Relative path under the workspace for the checkout.
    required: false
    default: ""
  clean:
    description: Whether to clean the repository before fetching.
    required: false
    default: "true"
  sparse-checkout:
    description: Newline-separated sparse-checkout patterns.
    required: false
    default: ""
  sparse-checkout-cone-mode:
    description: Whether sparse checkout uses cone mode.
    required: false
    default: "true"
  fetch-depth:
    description: Number of commits to fetch; zero fetches all history.
    required: false
    default: "1"
  fetch-tags:
    description: Whether to fetch tags when the history is shallow.
    required: false
    default: "false"
  show-progress:
    description: Whether to show fetch progress.
    required: false
    default: "true"
  lfs:
    description: Whether to download Git LFS files.
    required: false
    default: "false"
  submodules:
    description: Whether to check out submodules.
    required: false
    default: "false"
  set-safe-directory:
    description: Whether to add the checkout path as a safe Git directory.
    required: false
    default: "true"
  github-server-url:
    description: Base URL of the GitHub server.
    required: false
    default: ""
  allow-unsafe-pr-checkout:
    description: Whether a privileged event may check out untrusted pull request code.
    required: false
    default: "false"

runs:
  using: composite
  steps:
    - name: Checkout partial clone
      id: checkout
      continue-on-error: true
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        repository: ${{ inputs.repository }}
        ref: ${{ inputs.ref }}
        token: ${{ inputs.token }}
        ssh-key: ${{ inputs.ssh-key }}
        ssh-known-hosts: ${{ inputs.ssh-known-hosts }}
        ssh-strict: ${{ inputs.ssh-strict }}
        ssh-user: ${{ inputs.ssh-user }}
        persist-credentials: ${{ inputs.persist-credentials }}
        path: ${{ inputs.path }}
        clean: ${{ inputs.clean }}
        filter: blob:none
        sparse-checkout: ${{ inputs.sparse-checkout }}
        sparse-checkout-cone-mode: ${{ inputs.sparse-checkout-cone-mode }}
        fetch-depth: ${{ inputs.fetch-depth }}
        fetch-tags: ${{ inputs.fetch-tags }}
        show-progress: ${{ inputs.show-progress }}
        lfs: ${{ inputs.lfs }}
        submodules: ${{ inputs.submodules }}
        set-safe-directory: ${{ inputs.set-safe-directory }}
        github-server-url: ${{ inputs.github-server-url }}
        allow-unsafe-pr-checkout: ${{ inputs.allow-unsafe-pr-checkout }}

    - name: Retry partial-clone checkout
      id: retry
      if: steps.checkout.outcome == 'failure'
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        repository: ${{ inputs.repository }}
        ref: ${{ inputs.ref }}
        token: ${{ inputs.token }}
        ssh-key: ${{ inputs.ssh-key }}
        ssh-known-hosts: ${{ inputs.ssh-known-hosts }}
        ssh-strict: ${{ inputs.ssh-strict }}
        ssh-user: ${{ inputs.ssh-user }}
        persist-credentials: ${{ inputs.persist-credentials }}
        path: ${{ inputs.path }}
        clean: ${{ inputs.clean }}
        filter: blob:none
        sparse-checkout: ${{ inputs.sparse-checkout }}
        sparse-checkout-cone-mode: ${{ inputs.sparse-checkout-cone-mode }}
        fetch-depth: ${{ inputs.fetch-depth }}
        fetch-tags: ${{ inputs.fetch-tags }}
        show-progress: ${{ inputs.show-progress }}
        lfs: ${{ inputs.lfs }}
        submodules: ${{ inputs.submodules }}
        set-safe-directory: ${{ inputs.set-safe-directory }}
        github-server-url: ${{ inputs.github-server-url }}
        allow-unsafe-pr-checkout: ${{ inputs.allow-unsafe-pr-checkout }}

    - name: Verify checked-out commit
      shell: bash
      env:
        CHECKOUT_COMMIT: ${{ steps.retry.outputs.commit || steps.checkout.outputs.commit }}
        CHECKOUT_PATH: ${{ inputs.path }}
      run: |
        set -euo pipefail
        directory="$GITHUB_WORKSPACE"
        if [[ -n "$CHECKOUT_PATH" ]]; then
          directory="$directory/$CHECKOUT_PATH"
        fi
        actual="$(git -C "$directory" rev-parse HEAD)"
        if [[ -z "$CHECKOUT_COMMIT" || "$actual" != "$CHECKOUT_COMMIT" ]]; then
          echo "::error::Partial-clone checkout is at ${actual}, expected ${CHECKOUT_COMMIT:-an actions/checkout commit output}."
          exit 1
        fi
