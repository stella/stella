name: Install pinned harness CLIs
description: >
  Put the agent CLIs apps/desktop/src-tauri/harness/pins.json pins on PATH
  (scripts/ci-harness-clis.ts), so the agent engine's installed-CLI suites
  run instead of being skipped. The binaries are cached under a key of the
  pins file and the installer; only a run on main saves the cache, which the
  warm workflow (harness-clis-cache.yml) keeps current. Bun must be set up
  first, with dependencies installed. Linux runners only.

inputs:
  save:
    description: Save the cache when it missed (main only)
    required: false
    default: "false"

runs:
  using: composite
  steps:
    - name: Restore pinned harness CLIs
      id: cache
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.cache/stella-harness-clis
        key: harness-clis-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('apps/desktop/src-tauri/harness/pins.json', 'scripts/ci-harness-clis.ts') }}

    - name: Install pinned harness CLIs
      shell: bash
      env:
        GITHUB_TOKEN: ${{ github.token }}
      run: bun scripts/ci-harness-clis.ts "$HOME/.cache/stella-harness-clis"

    - name: Save pinned harness CLIs
      if: ${{ inputs.save == 'true' && github.ref == 'refs/heads/main' && steps.cache.outputs.cache-hit != 'true' }}
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.cache/stella-harness-clis
        key: ${{ steps.cache.outputs.cache-primary-key }}
