name: Install cargo-deny
description: Install the pinned upstream cargo-deny release binary, verified by SHA-256 (macOS ARM64 and Linux x64).
inputs:
  version:
    description: cargo-deny release version
    required: false
    default: "0.19.0"
  sha256-macos-arm64:
    description: SHA-256 of cargo-deny-<version>-aarch64-apple-darwin.tar.gz; update together with version
    required: false
    default: a22f2023c06f3eefd099a5d42dd828fd4fa74d1e1c167bd1dbc3cf59ad62ded0
  sha256-linux-x64:
    description: SHA-256 of cargo-deny-<version>-x86_64-unknown-linux-musl.tar.gz; update together with version
    required: false
    default: 0e8c2aa59128612c90d9e09c02204e912f29a5b8d9a64671b94608cbe09e064f
runs:
  using: composite
  steps:
    - name: Install cargo-deny
      shell: bash
      env:
        CARGO_DENY_VERSION: ${{ inputs.version }}
        CARGO_DENY_SHA256_MACOS_ARM64: ${{ inputs.sha256-macos-arm64 }}
        CARGO_DENY_SHA256_LINUX_X64: ${{ inputs.sha256-linux-x64 }}
      run: bash "$GITHUB_ACTION_PATH/install.sh"
