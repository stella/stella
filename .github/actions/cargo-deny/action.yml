name: Install cargo-deny
description: Install the pinned upstream cargo-deny release binary, verified by SHA-256 (macOS ARM64 only).
inputs:
  version:
    description: cargo-deny release version
    required: false
    default: "0.19.0"
  sha256:
    description: SHA-256 of cargo-deny-<version>-aarch64-apple-darwin.tar.gz; update together with version
    required: false
    default: a22f2023c06f3eefd099a5d42dd828fd4fa74d1e1c167bd1dbc3cf59ad62ded0
runs:
  using: composite
  steps:
    - name: Install cargo-deny
      shell: bash
      env:
        CARGO_DENY_VERSION: ${{ inputs.version }}
        CARGO_DENY_SHA256: ${{ inputs.sha256 }}
      run: bash "$GITHUB_ACTION_PATH/install.sh"
