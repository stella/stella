name: Build and publish Stella web image
description: Build Stella's public web source with an allowlisted browser configuration and publish it by digest.

inputs:
  release-ref:
    description: Release tag or synthetic main-<sha> reference embedded in the image.
    required: true
  release-sha:
    description: Full source commit SHA checked out by the caller.
    required: true
  target-environment:
    description: Public browser configuration to compile (production or staging).
    required: true
  posthog-key:
    description: Browser-visible PostHog project key required for official Stella builds; passed separately so it is never committed.
    required: true
  posthog-cli-api-key:
    description: PostHog personal API key with error-tracking write scope. Every official build publishes its client source maps, so an empty value fails the build.
    required: true
  posthog-project-id:
    description: Numeric PostHog project id that receives the source maps.
    required: true
  source-path:
    description: Checkout containing the exact source commit to build.
    required: false
    default: .
  tooling-path:
    description: Checkout containing the current renderer and workflow policy.
    required: false
    default: .
  previous-web-image:
    description: Optional repository@sha256 digest of a previous image whose manifested client assets carry forward.
    required: false
    default: ""

outputs:
  digest:
    description: Immutable GHCR manifest digest.
    value: ${{ steps.build.outputs.digest }}

runs:
  using: composite
  steps:
    - name: Validate web image source and target
      shell: bash
      env:
        RELEASE_REF: ${{ inputs.release-ref }}
        RELEASE_SHA: ${{ inputs.release-sha }}
        POSTHOG_KEY: ${{ inputs.posthog-key }}
        POSTHOG_CLI_API_KEY: ${{ inputs.posthog-cli-api-key }}
        POSTHOG_PROJECT_ID: ${{ inputs.posthog-project-id }}
        SOURCE_PATH: ${{ inputs.source-path }}
        TARGET_ENV: ${{ inputs.target-environment }}
      run: |
        set -euo pipefail
        if [[ ! "$POSTHOG_KEY" =~ ^phc_[A-Za-z0-9_-]{20,}$ ]]; then
          echo "::error::A valid PostHog project key is required for official stella web builds."
          exit 1
        fi
        # Frames from an unpublished build never resolve to source, so an
        # official build without its upload credentials stops here.
        if [[ -z "$POSTHOG_CLI_API_KEY" ]]; then
          echo "::error::posthog-cli-api-key is required for official stella web builds."
          exit 1
        fi
        if [[ ! "$POSTHOG_PROJECT_ID" =~ ^[0-9]+$ ]]; then
          echo "::error::posthog-project-id must be a numeric PostHog project id."
          exit 1
        fi
        if [[ ! "$RELEASE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
          echo "::error::release-sha must be a full lowercase commit SHA."
          exit 1
        fi
        case "$TARGET_ENV" in
          production|staging) ;;
          *)
            echo "::error::target-environment must be production or staging."
            exit 1
            ;;
        esac
        if [[ "$RELEASE_REF" == main-* ]]; then
          ref_sha="${RELEASE_REF#main-}"
          if [[ "$TARGET_ENV" != "staging" || "${RELEASE_SHA:0:${#ref_sha}}" != "$ref_sha" ]]; then
            echo "::error::synthetic release refs must match the source SHA and target staging."
            exit 1
          fi
        elif [[ ! "$RELEASE_REF" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-(rc|beta|alpha)\.[0-9]+)?$ ]]; then
          echo "::error::release-ref must be a release tag or main-<sha>."
          exit 1
        fi
        checked_out_sha="$(git -C "$SOURCE_PATH" rev-parse HEAD)"
        if [[ "$checked_out_sha" != "$RELEASE_SHA" ]]; then
          echo "::error::source-path does not contain release-sha."
          exit 1
        fi
        contract="${SOURCE_PATH}/apps/web/build-env-contract.json"
        config="${SOURCE_PATH}/apps/web/build-env/${TARGET_ENV}.json"
        if [[ ! -f "$contract" || ! -f "$config" ]]; then
          echo "::error::Release source predates the public web build contract; rebuilding legacy release tags is unsupported."
          exit 1
        fi
        if [[ "$(jq -r '.targetEnvironment' "$config")" != "$TARGET_ENV" ]]; then
          echo "::error::web build configuration does not match the target environment."
          exit 1
        fi

    - name: Resolve allowlisted web build arguments
      id: args
      shell: bash
      env:
        RELEASE_REF: ${{ inputs.release-ref }}
        SOURCE_PATH: ${{ inputs.source-path }}
        TARGET_ENV: ${{ inputs.target-environment }}
        TOOLING_PATH: ${{ inputs.tooling-path }}
        PREVIOUS_WEB_IMAGE: ${{ inputs.previous-web-image }}
      run: |
        set -euo pipefail
        previous_image_arg=""
        if [[ -n "$PREVIOUS_WEB_IMAGE" ]]; then
          sh "${TOOLING_PATH}/scripts/validate-previous-web-image.sh" "$PREVIOUS_WEB_IMAGE"
          previous_image_arg="PREVIOUS_WEB_IMAGE=$PREVIOUS_WEB_IMAGE"
        fi
        rendered="$(
          bash "${TOOLING_PATH}/scripts/render-web-build-args.sh" \
            "${SOURCE_PATH}/apps/web/build-env-contract.json" \
            "${SOURCE_PATH}/apps/web/build-env/${TARGET_ENV}.json" \
            VITE_POSTHOG_KEY
        )"
        posthog_arg="$(jq -er '.variables.VITE_POSTHOG_KEY' "${SOURCE_PATH}/apps/web/build-env-contract.json")"
        version="$RELEASE_REF"
        if [[ "$version" == v* ]]; then
          version="${version#v}"
        fi
        {
          echo "values<<STELLA_WEB_BUILD_ARGS"
          printf '%s\n' "$rendered"
          echo "STELLA_WEB_BUILD_ARGS"
          echo "posthog-name=$posthog_arg"
          echo "version=$version"
          echo "previous-image-arg=$previous_image_arg"
        } >>"$GITHUB_OUTPUT"

    - name: Verify native x64 build host
      shell: bash
      run: |
        if [[ "$(uname -m)" != "x86_64" ]]; then
          echo "::error::Web compilation requires a native x64 build host."
          exit 1
        fi

    - name: Setup Bun
      id: setup-bun
      uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      with:
        bun-version-file: ${{ inputs.source-path }}/package.json
        no-cache: true

    - name: Set up ARM64 runtime emulation
      uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      with:
        platforms: arm64

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

    - name: Login to GHCR
      uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ github.token }}

    - name: Resolve web base images
      id: base-contexts
      shell: bash
      env:
        CI_IMAGE_MIRROR_ENABLED: ${{ github.event.pull_request.head.repo.fork != true && github.token != '' }}
        DOCKERFILE: ${{ inputs.source-path }}/apps/web/Dockerfile
        TOOLING_PATH: ${{ inputs.tooling-path }}
      run: |
        echo 'contexts<<CI_IMAGE_CONTEXTS' >> "$GITHUB_OUTPUT"
        bun --no-install "${TOOLING_PATH}/scripts/ci-service-images.ts" --pull "$DOCKERFILE"
        bun --no-install "${TOOLING_PATH}/scripts/ci-service-images.ts" --build-contexts "$DOCKERFILE" >> "$GITHUB_OUTPUT"
        echo 'CI_IMAGE_CONTEXTS' >> "$GITHUB_OUTPUT"

    - name: Build and push web image
      id: build
      uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
      with:
        context: ${{ inputs.source-path }}
        file: ${{ inputs.source-path }}/apps/web/Dockerfile
        build-contexts: ${{ steps.base-contexts.outputs.contexts }}
        platforms: linux/arm64
        push: true
        tags: ghcr.io/${{ github.repository_owner }}/stella-web:candidate-${{ github.run_id }}-${{ github.run_attempt }}-${{ inputs.target-environment }}
        cache-from: type=registry,ref=ghcr.io/${{ github.repository_owner }}/stella-web:buildcache-${{ inputs.target-environment }}
        cache-to: type=registry,ref=ghcr.io/${{ github.repository_owner }}/stella-web:buildcache-${{ inputs.target-environment }},mode=max
        secrets: |
          posthog_cli_api_key=${{ inputs.posthog-cli-api-key }}
        build-args: |
          ${{ steps.args.outputs.previous-image-arg }}
          STELLA_VERSION=${{ steps.args.outputs.version }}
          STELLA_COMMIT_SHA=${{ inputs.release-sha }}
          POSTHOG_SOURCEMAP_PUBLISH=true
          POSTHOG_SOURCEMAP_PROJECT_ID=${{ inputs.posthog-project-id }}
          ${{ steps.args.outputs.values }}
          ${{ steps.args.outputs.posthog-name }}=${{ inputs.posthog-key }}

    - name: Report carried web asset and image sizes
      if: inputs.previous-web-image != ''
      shell: bash
      env:
        NEW_IMAGE: ghcr.io/${{ github.repository_owner }}/stella-web@${{ steps.build.outputs.digest }}
        PREVIOUS_IMAGE: ${{ inputs.previous-web-image }}
        TOOLING_PATH: ${{ inputs.tooling-path }}
      run: |
        set -euo pipefail
        bash "${TOOLING_PATH}/scripts/retry.sh" docker pull --platform linux/arm64 "$PREVIOUS_IMAGE" >/dev/null
        bash "${TOOLING_PATH}/scripts/retry.sh" docker pull --platform linux/arm64 "$NEW_IMAGE" >/dev/null
        container="$(docker create --platform linux/arm64 "$PREVIOUS_IMAGE")"
        trap 'docker rm -f "$container" >/dev/null 2>&1 || true' EXIT
        mkdir -p "$RUNNER_TEMP/previous-web-assets"
        docker cp "$container:/app/apps/web/dist/client/." "$RUNNER_TEMP/previous-web-assets"
        previous_assets_bytes="$(du -sb "$RUNNER_TEMP/previous-web-assets" | cut -f1)"
        previous_image_bytes="$(docker image inspect "$PREVIOUS_IMAGE" --format '{{.Size}}')"
        new_image_bytes="$(docker image inspect "$NEW_IMAGE" --format '{{.Size}}')"
        echo "Previous client assets: ${previous_assets_bytes} bytes"
        echo "Image size difference: $((new_image_bytes - previous_image_bytes)) bytes"
