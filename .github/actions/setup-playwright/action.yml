name: Verify image-provided Playwright browsers
description: Launch the pinned browsers without caches, downloads, or system package installs

inputs:
  browsers:
    description: Space-separated browser engines to verify (chromium, firefox, webkit)
    required: false
    default: chromium
  dependency-mode:
    description: container runs offline verification in the pinned image; preinstalled verifies the current job container
    required: false
    default: container

runs:
  using: composite
  steps:
    - name: Verify image browser executables
      shell: bash
      env:
        BROWSERS: ${{ inputs.browsers }}
        DEPENDENCY_MODE: ${{ inputs.dependency-mode }}
        PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
        PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
      run: |
        case "$DEPENDENCY_MODE" in
          container)
            bash "$GITHUB_WORKSPACE/.github/actions/setup-playwright/run-in-image.sh" --offline \
              bash "$GITHUB_WORKSPACE/.github/actions/setup-playwright/verify-browsers.sh"
            ;;
          preinstalled)
            bash "$GITHUB_WORKSPACE/.github/actions/setup-playwright/verify-browsers.sh"
            ;;
          *)
            echo "::error::Unknown Playwright dependency mode: $DEPENDENCY_MODE"
            exit 1
            ;;
        esac
