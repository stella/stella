name: Dispatch and watch promote-release
description: >
  Dispatch stella-infra's promote-release.yml and block until the run it
  created finishes. A dispatch that is accepted but later fails must fail the
  caller: without the watch, the deploy job goes green on "the request was
  accepted" and the failure only surfaces later as a post-deploy smoke that
  cannot say what broke.

inputs:
  app-client-id:
    description: Client ID for the GitHub App installed on the target repository
    required: true
  app-private-key:
    description: Private key for minting short-lived installation tokens
    required: true
  infra-repo:
    description: owner/name of the repository hosting the promote workflow
    required: true
  workflow-file:
    description: >
      Filename of the promote workflow in the infra repository. Overriding it
      only works for a workflow whose `run-name:` matches the template this
      action correlates on; see expected_title below.
    required: false
    default: promote-release.yml
  release-ref:
    description: Release tag (v1.2.3) or synthetic staging ref (main-<short-sha>)
    required: true
  target-environment:
    description: Environment to promote into (staging or production)
    required: true
  run-migrations:
    description: Run database migrations as part of the promotion
    required: false
    default: "true"
  frontend:
    description: Deploy the prebuilt frontend image as part of the promotion
    required: false
    default: "true"
  image-digest:
    description: >
      Image digest to deploy (sha256:...). Required for synthetic main-<sha>
      refs, which have no GitHub Release manifest to resolve it from.
    required: false
    default: ""
  web-image-digest:
    description: >
      Prebuilt web image digest (sha256:...). Required when the promotion
      includes the frontend.
    required: false
    default: ""
  git-sha:
    description: >
      Full 40-char commit SHA the synthetic ref points at. Only valid with
      main-<sha> refs; for tagged releases the tag is the checkout target.
    required: false
    default: ""

runs:
  using: composite
  steps:
    - id: prepare
      shell: bash
      env:
        RELEASE_REF: ${{ inputs.release-ref }}
        TARGET_ENV: ${{ inputs.target-environment }}
        RUN_MIGRATIONS: ${{ inputs.run-migrations }}
        FRONTEND: ${{ inputs.frontend }}
        IMAGE_DIGEST: ${{ inputs.image-digest }}
        WEB_IMAGE_DIGEST: ${{ inputs.web-image-digest }}
        GIT_SHA: ${{ inputs.git-sha }}
      run: |
        set -euo pipefail
        if [[ -n "$WEB_IMAGE_DIGEST" && ! "$WEB_IMAGE_DIGEST" =~ ^sha256:[a-f0-9]{64}$ ]]; then
          echo "::error::web-image-digest must look like sha256:<64 lowercase hex chars>." >&2
          exit 1
        fi
        if [[ "$FRONTEND" == "true" && -z "$WEB_IMAGE_DIGEST" ]]; then
          echo "::error::Frontend promotions require a prebuilt web image digest." >&2
          exit 1
        fi
        payload=$(jq -cn --arg release_ref "$RELEASE_REF" --arg target_environment "$TARGET_ENV" \
          --arg run_migrations "$RUN_MIGRATIONS" --arg frontend "$FRONTEND" \
          --arg image_digest "$IMAGE_DIGEST" --arg web_image_digest "$WEB_IMAGE_DIGEST" --arg git_sha "$GIT_SHA" \
          '{release_ref:$release_ref,target_environment:$target_environment,run_migrations:$run_migrations,frontend:$frontend} +
          (if $image_digest == "" then {} else {image_digest:$image_digest} end) +
          (if $web_image_digest == "" then {} else {web_image_digest:$web_image_digest} end) +
          (if $git_sha == "" then {} else {git_sha:$git_sha} end)')
        echo "inputs=$payload" >> "$GITHUB_OUTPUT"
    - name: Dispatch and watch promotion
      shell: bash
      env:
        APP_CLIENT_ID: ${{ inputs.app-client-id }}
        APP_PRIVATE_KEY: ${{ inputs.app-private-key }}
        INFRA_REPO: ${{ inputs.infra-repo }}
        WORKFLOW_FILE: ${{ inputs.workflow-file }}
        EXPECTED_TITLE: Promote ${{ inputs.release-ref }} → ${{ inputs.target-environment }}
        DISPATCH_INPUTS: ${{ steps.prepare.outputs.inputs }}
        DISPATCH_REF: main
      run: bash "$GITHUB_ACTION_PATH/../../../scripts/workflow-dispatch-watch.sh"
