name: Dispatch and watch promote-release
description: >
  Dispatch stella-infra's promote-release.yml and block until the run it
  created finishes. A dispatch that is accepted but later fails must fail the
  caller: without the watch, the deploy job goes green on "the request was
  accepted" and the failure only surfaces later as a post-deploy smoke that
  cannot say what broke.

inputs:
  app-client-id:
    description: Client ID for the GitHub App installed on the target repository
    required: true
  app-private-key:
    description: Private key for minting short-lived installation tokens
    required: true
  infra-repo:
    description: owner/name of the repository hosting the promote workflow
    required: true
  workflow-file:
    description: >
      Filename of the promote workflow in the infra repository. Overriding it
      only works for a workflow whose `run-name:` matches the template this
      action correlates on; see expected_title below.
    required: false
    default: promote-release.yml
  release-ref:
    description: Release tag (v1.2.3) or synthetic staging ref (main-<short-sha>)
    required: true
  target-environment:
    description: Environment to promote into (staging or production)
    required: true
  run-migrations:
    description: Run database migrations as part of the promotion
    required: false
    default: "true"
  frontend:
    description: Deploy the prebuilt frontend image as part of the promotion
    required: false
    default: "true"
  image-digest:
    description: >
      Image digest to deploy (sha256:...). Required for synthetic main-<sha>
      refs, which have no GitHub Release manifest to resolve it from.
    required: false
    default: ""
  web-image-digest:
    description: >
      Prebuilt web image digest (sha256:...). Required when the promotion
      includes the frontend.
    required: false
    default: ""
  proof-state-path:
    description: Local proof state path for the deployment ECS receipt
    required: false
    default: ""
  expected-sha:
    description: Expected production commit; permits reusing a completed promotion receipt
    required: false
    default: ""
  git-sha:
    description: >
      Full 40-char commit SHA the synthetic ref points at. Only valid with
      main-<sha> refs; for tagged releases the tag is the checkout target.
    required: false
    default: ""
  staging-lease-before-hours:
    description: Power lease requested before a release-candidate staging promotion
    required: false
    default: ""
  staging-lease-after-hours:
    description: Power lease renewed after a release-candidate staging promotion
    required: false
    default: ""
  staging-lease-sha:
    description: Commit whose staging proof owns the power lease
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Dispatch and watch promote-release.yml
      shell: bash
      env:
        APP_CLIENT_ID: ${{ inputs.app-client-id }}
        APP_PRIVATE_KEY: ${{ inputs.app-private-key }}
        INFRA_REPO: ${{ inputs.infra-repo }}
        WORKFLOW_FILE: ${{ inputs.workflow-file }}
        RELEASE_REF: ${{ inputs.release-ref }}
        TARGET_ENV: ${{ inputs.target-environment }}
        RUN_MIGRATIONS: ${{ inputs.run-migrations }}
        FRONTEND: ${{ inputs.frontend }}
        IMAGE_DIGEST: ${{ inputs.image-digest }}
        WEB_IMAGE_DIGEST: ${{ inputs.web-image-digest }}
        GIT_SHA: ${{ inputs.git-sha }}
        STAGING_PROOF_STATE_PATH: ${{ inputs.proof-state-path }}
        EXPECTED_SHA: ${{ inputs.expected-sha }}
        STAGING_LEASE_BEFORE_HOURS: ${{ inputs.staging-lease-before-hours }}
        STAGING_LEASE_AFTER_HOURS: ${{ inputs.staging-lease-after-hours }}
        STAGING_LEASE_SHA: ${{ inputs.staging-lease-sha }}
      run: |
        set -euo pipefail

        readonly TOKEN_REFRESH_SECONDS=2700
        readonly WATCH_POLL_SECONDS=10

        base64url() {
          openssl base64 -A | tr '/+' '_-' | tr -d '='
        }

        mint_app_token() {
          local now issued_at expires_at header payload unsigned signature jwt
          local installation_id repository_name request_body
          now="$(date +%s)"
          issued_at="$((now - 60))"
          expires_at="$((now + 600))"
          header="$(printf '%s' '{"typ":"JWT","alg":"RS256"}' | base64url)"
          payload="$(
            printf '{"iat":%s,"exp":%s,"iss":"%s"}' \
              "$issued_at" "$expires_at" "$APP_CLIENT_ID" | base64url
          )"
          unsigned="${header}.${payload}"
          signature="$(
            openssl dgst -sha256 -sign <(printf '%s\n' "$APP_PRIVATE_KEY") \
              <(printf '%s' "$unsigned") | base64url
          )"
          jwt="${unsigned}.${signature}"
          echo "::add-mask::${jwt}" >&2

          installation_id="$(
            GH_TOKEN="$jwt" bash "$GITHUB_ACTION_PATH/../../../scripts/gh-retry.sh" api -H "Authorization: Bearer ${jwt}" \
              "/repos/${INFRA_REPO}/installation" --jq '.id'
          )"
          repository_name="${INFRA_REPO#*/}"
          request_body="$(
            jq -cn --arg repository "$repository_name" \
              '{repositories: [$repository], permissions: {actions: "write"}}'
          )"
          GH_TOKEN="$jwt" bash "$GITHUB_ACTION_PATH/../../../scripts/gh-retry.sh" api -H "Authorization: Bearer ${jwt}" \
            --method POST \
            "/app/installations/${installation_id}/access_tokens" \
            --input - --jq '.token' <<<"$request_body"
        }

        refresh_app_token() {
          local token
          # Token creation is a single request; retrying can mint another token.
          if ! token="$(mint_app_token)" || [[ -z "$token" ]]; then
            echo "::error::GitHub App token renewal failed." >&2
            exit 1
          fi
          if [[ -n "${current_app_token:-}" ]]; then
            GH_TOKEN="$current_app_token" bash "$GITHUB_ACTION_PATH/../../../scripts/gh-retry.sh" api --method DELETE \
              "/installation/token" >/dev/null || true
          fi
          echo "::add-mask::${token}"
          current_app_token="$token"
          export GH_TOKEN="$token"
          token_refreshed_at="$(date +%s)"
        }

        revoke_app_token() {
          if [[ -n "${current_app_token:-}" ]]; then
            GH_TOKEN="$current_app_token" bash "$GITHUB_ACTION_PATH/../../../scripts/gh-retry.sh" api --method DELETE \
              "/installation/token" >/dev/null || true
          fi
        }

        if [[ ! "$INFRA_REPO" =~ ^[^/]+/[^/]+$ ]]; then
          echo "::error::infra-repo must be an owner/name pair." >&2
          exit 1
        fi
        if [[ -n "$WEB_IMAGE_DIGEST" && ! "$WEB_IMAGE_DIGEST" =~ ^sha256:[a-f0-9]{64}$ ]]; then
          echo "::error::web-image-digest must look like sha256:<64 lowercase hex chars>." >&2
          exit 1
        fi
        if [[ "$FRONTEND" == "true" && -z "$WEB_IMAGE_DIGEST" ]]; then
          echo "::error::Frontend promotions require a prebuilt web image digest." >&2
          exit 1
        fi
        current_app_token=""
        trap revoke_app_token EXIT
        refresh_app_token

        request_staging_lease() {
          local hours="$1"
          [[ -n "$hours" ]] || return 0
          STAGING_POWER_TOKEN="$current_app_token" \
            STAGING_LEASE_ONLY=true \
            STAGING_LEASE_HOURS="$hours" \
            DEPLOY_SHA="$STAGING_LEASE_SHA" \
            INFRA_REPO="$INFRA_REPO" \
            GH_RETRY_SCRIPT="$GITHUB_ACTION_PATH/../../../scripts/gh-retry.sh" \
            bash "$GITHUB_ACTION_PATH/../../../scripts/staging-wake.sh"
        }

        request_staging_lease "${STAGING_LEASE_BEFORE_HOURS:-}"
        dispatched_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
        # Must match the `run-name:` template in
        # stella-infra/.github/workflows/promote-release.yml. That template is
        # load-bearing for correlation, not decoration: changing either side
        # alone leaves the dispatch unmatched and this step failing.
        expected_title="Promote ${RELEASE_REF} → ${TARGET_ENV}"

        # Production receipts prevent duplicate promotions. Staging dispatches
        # again because another deployment may have replaced the proved image.
        run_id=""
        attempts=0
        if [[ "$TARGET_ENV" == production ]]; then
          if ! existing="$(
            bash "$GITHUB_ACTION_PATH/../../../scripts/gh-retry.sh" api --paginate --slurp \
              "/repos/${INFRA_REPO}/actions/workflows/${WORKFLOW_FILE}/runs?event=workflow_dispatch&per_page=100" \
              | jq -r --arg title "$expected_title" '
                  [.[].workflow_runs[] | select(.display_title == $title)] as $all
                  | ($all | map(select(.status == "queued" or .status == "in_progress" or
                      .status == "waiting" or .status == "pending" or .conclusion == "success"))
                    | first) as $live
                  | [($live.id // ""), ($live.status // ""), ($live.conclusion // ""), ($all | length)]
                  | @tsv
                '
          )"; then
            echo "::error::Existing promote run lookup failed." >&2
            exit 1
          fi
          run_id="$(cut -f1 <<< "$existing")"
          attempts="$(cut -f4 <<< "$existing")"
          [[ "$attempts" =~ ^[0-9]+$ ]] || { echo '::error::Existing promote run lookup failed.' >&2; exit 1; }
          if [[ -n "$run_id" && "$(cut -f3 <<< "$existing")" == success ]]; then
            echo "Promotion already succeeded: ${run_id}"
            exit 0
          fi
        fi
        # Serving the commit proves the promotion only when this workflow never
        # attempted it: an active run may serve it while its infrastructure work
        # continues (watched below), and a failed one may have stopped after the
        # rollout (dispatched again below).
        if [[ "$TARGET_ENV" == production && "$attempts" == 0 && -n "${EXPECTED_SHA:-}" ]]; then
          [[ "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo '::error::Invalid expected-sha'; exit 1; }
          api_commit=$(curl --fail --silent --show-error --max-time 15 --retry 2 --retry-all-errors --retry-delay 1 https://api.stll.app/ready | jq -r 'select(.status == "ok") | .commit // empty') || api_commit=""
          web_commit=$(curl --fail --silent --show-error --max-time 15 --retry 2 --retry-all-errors --retry-delay 1 https://my.stll.app/version.json | jq -r '.commit // empty') || web_commit=""
          if [[ "$api_commit" == "$EXPECTED_SHA" && "$web_commit" == "$EXPECTED_SHA" ]]; then
            echo "Production already serves $EXPECTED_SHA"
            exit 0
          fi
        fi

        dispatch_args=(
          -f "ref=main"
          -f "inputs[release_ref]=${RELEASE_REF}"
          -f "inputs[target_environment]=${TARGET_ENV}"
          -f "inputs[run_migrations]=${RUN_MIGRATIONS}"
          -f "inputs[frontend]=${FRONTEND}"
        )
        # Only sent when set: promote-release.yml rejects git_sha on tagged
        # releases, where a populated value would silently swap the checked-out
        # source for a different commit.
        if [[ -n "$IMAGE_DIGEST" ]]; then
          dispatch_args+=(-f "inputs[image_digest]=${IMAGE_DIGEST}")
        fi
        if [[ -n "$WEB_IMAGE_DIGEST" ]]; then
          dispatch_args+=(-f "inputs[web_image_digest]=${WEB_IMAGE_DIGEST}")
        fi
        if [[ -n "$GIT_SHA" ]]; then
          dispatch_args+=(-f "inputs[git_sha]=${GIT_SHA}")
        fi

        # Call the dispatches endpoint directly. `gh workflow run` first looks
        # up the workflow by filename against the repo's default branch; with
        # the narrowly-scoped App token (permission-actions: write only, no
        # contents/metadata) those implicit lookups can fail silently and kill
        # the step in well under a second with no output. Any failure here
        # surfaces as a real HTTP error in the log.
        if [[ -z "$run_id" ]]; then
          echo "Dispatching ${WORKFLOW_FILE} on ${INFRA_REPO} (target=${TARGET_ENV}, release=${RELEASE_REF})..."
          bash "$GITHUB_ACTION_PATH/../../../scripts/gh-retry.sh" api --method POST \
            "/repos/${INFRA_REPO}/actions/workflows/${WORKFLOW_FILE}/dispatches" \
            "${dispatch_args[@]}"

          # The dispatches endpoint returns 204 with no body, so the run id has
          # to be recovered by listing. Match on exact display_title so
          # concurrent dispatches cannot be confused and prefix-overlapping refs
          # (v1.2.3 vs v1.2.3-rc.1, v1.2.3-rc.1 vs v1.2.3-rc.10) never collide.
          echo "Dispatch accepted. Polling for the new run..."
          run_id=""
          for attempt in {1..30}; do
            # Poll successful reads until the run appears. HTTP recovery belongs
            # to the shared owner; a failed read exhausts that request's budget.
            if ! run_id="$(
              bash "$GITHUB_ACTION_PATH/../../../scripts/gh-retry.sh" api \
                "/repos/${INFRA_REPO}/actions/workflows/${WORKFLOW_FILE}/runs?event=workflow_dispatch&per_page=10" \
                --jq "first(.workflow_runs[] | select(.created_at >= \"${dispatched_at}\") | select(.display_title == \"${expected_title}\") | .id)"
            )"; then
              echo "::error::Dispatched run lookup failed." >&2
              exit 1
            fi
            if [[ -n "$run_id" ]]; then
              echo "Found dispatched run: ${run_id} (attempt ${attempt}/30)"
              break
            fi
            sleep 2
          done

          if [[ -z "$run_id" ]]; then
            echo "::error::Dispatched run did not appear in the workflow run list." >&2
            exit 1
          fi

        else
          echo "Watching existing promotion: $run_id"
        fi

        run_url="https://github.com/${INFRA_REPO}/actions/runs/${run_id}"
        echo "Watching run ${run_id}..."
        while true; do
          now="$(date +%s)"
          if (( now - token_refreshed_at >= TOKEN_REFRESH_SECONDS )); then
            echo "Refreshing promotion watcher credentials..."
            refresh_app_token
          fi

          if ! run_state="$(
            bash "$GITHUB_ACTION_PATH/../../../scripts/gh-retry.sh" api "/repos/${INFRA_REPO}/actions/runs/${run_id}" \
              --jq '[.status, .conclusion, .html_url] | @tsv'
          )"; then
            echo "::error::Promote run status lookup failed. Check ${run_url}" >&2
            exit 1
          fi
          status="$(cut -f1 <<<"$run_state")"
          conclusion="$(cut -f2 <<<"$run_state")"
          run_url="$(cut -f3 <<<"$run_state")"
          if [[ "$status" == "completed" ]]; then
            break
          fi
          sleep "$WATCH_POLL_SECONDS"
        done

        if [[ -n "${STAGING_PROOF_STATE_PATH:-}" ]]; then
          receipt_directory="${STAGING_PROOF_STATE_PATH}.ecs"
          mkdir -p "$receipt_directory"
          rm -f "${STAGING_PROOF_STATE_PATH}.ecs.json" "$receipt_directory/receipt.json"
          if bash "$GITHUB_ACTION_PATH/../../../scripts/gh-retry.sh" run download "$run_id" \
            --repo "$INFRA_REPO" --name staging-ecs-readiness --dir "$receipt_directory" \
            >/dev/null 2>&1 && [[ -f "$receipt_directory/receipt.json" ]]; then
            cp "$receipt_directory/receipt.json" "${STAGING_PROOF_STATE_PATH}.ecs.json"
          else
            echo "::warning::Deployment ECS readiness receipt is unavailable."
          fi
        fi

        if [[ "$conclusion" == "success" ]]; then
          echo "Promote run completed successfully: ${run_url}"
          request_staging_lease "${STAGING_LEASE_AFTER_HOURS:-}"
          exit 0
        fi

        # A cancelled promote stays fatal. When a newer push superseded this
        # one, the caller is being torn down by its own concurrency group
        # anyway, so nobody reads this result. When a human cancelled it, the
        # deploy genuinely did not land, and passing here would hand the
        # post-deploy smoke a commit that will never arrive: it would then
        # block for its full readiness window and report the wrong thing.
        if [[ "$conclusion" == "cancelled" ]]; then
          echo "::error::Promote run was cancelled (superseded by a newer push, or cancelled manually): ${run_url}" >&2
          exit 1
        fi

        echo "::error::Promote run finished with conclusion '${conclusion}': ${run_url}" >&2
        exit 1
