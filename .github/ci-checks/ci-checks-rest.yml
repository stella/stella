  # Self-test the dead-columns reference matcher: a regression here
  # would either silently stop flagging genuinely unreferenced columns
  # or start flagging live ones, in both cases undermining the
  # check:dead-columns gate in the code-quality job.
  - name: Test dead-columns reference matching
    env:
      CI_CHECK_KIND: STATIC
      CI_CHECK_INPUTS: tracked-tree+generated-inputs
    id: static_check_114
    if: ${{ !cancelled() && steps.install.outcome == 'success' && (needs.ci-plan.outputs.package_checks_required == 'true') && (needs.ci-plan.outputs.root_checks == '' || contains(fromJSON(needs.ci-plan.outputs.root_checks || '[]'), 'ci-checks-rest/Test dead-columns reference matching')) && (github.event_name == 'merge_group' || steps.static_receipts.outputs.reuse_static_check_114 != 'true') }}
    run: bun test scripts/check-dead-columns.test.ts

  # Self-test the projection-totality module classifier: a regression
  # here would either silently stop flagging an unguarded resource
  # projection or start flagging unrelated modules, in both cases
  # undermining the check:projection-totality gate in the code-quality
  # job.
  - name: Test projection-totality classification
    env:
      CI_CHECK_KIND: STATIC
      CI_CHECK_INPUTS: tracked-tree+generated-inputs
    id: static_check_115
    if: ${{ !cancelled() && steps.install.outcome == 'success' && (needs.ci-plan.outputs.package_checks_required == 'true') && (needs.ci-plan.outputs.root_checks == '' || contains(fromJSON(needs.ci-plan.outputs.root_checks || '[]'), 'ci-checks-rest/Test projection-totality classification')) && (github.event_name == 'merge_group' || steps.static_receipts.outputs.reuse_static_check_115 != 'true') }}
    run: bun test scripts/check-projection-totality.test.ts

  - name: Test aggregate inventories
    env:
      CI_CHECK_KIND: STATIC
      CI_CHECK_INPUTS: tracked-tree+generated-inputs
    id: static_check_116
    if: ${{ !cancelled() && steps.install.outcome == 'success' && (needs.ci-plan.outputs.package_checks_required == 'true') && (needs.ci-plan.outputs.root_checks == '' || contains(fromJSON(needs.ci-plan.outputs.root_checks || '[]'), 'ci-checks-rest/Test aggregate inventories')) && (github.event_name == 'merge_group' || steps.static_receipts.outputs.reuse_static_check_116 != 'true') }}
    run: bun scripts/run-custom-lint-tests.ts scripts/check-aggregate-locks.test.ts scripts/check-aggregate-mutations.test.ts .oxlint-plugins/__tests__/aggregate-lock-sites.test.ts .oxlint-plugins/__tests__/confine-aggregate-lock.test.ts

  - name: Test write contract inventories
    env:
      CI_CHECK_KIND: STATIC
      CI_CHECK_INPUTS: tracked-tree+generated-inputs
    id: static_check_117
    if: ${{ !cancelled() && steps.install.outcome == 'success' && (needs.ci-plan.outputs.package_checks_required == 'true') && (github.event_name == 'merge_group' || steps.static_receipts.outputs.reuse_static_check_117 != 'true') }}
    run: bun scripts/run-custom-lint-tests.ts scripts/check-write-contracts.test.ts .oxlint-plugins/__tests__/require-write-contract.test.ts

  - name: Office fixture metadata
    env:
      CI_CHECK_KIND: STATIC
      CI_CHECK_INPUTS: tracked-tree+generated-inputs
    id: static_check_118
    if: ${{ !cancelled() && steps.install.outcome == 'success' && (needs.ci-plan.outputs.package_checks_required == 'true') && (github.event_name == 'merge_group' || steps.static_receipts.outputs.reuse_static_check_118 != 'true') }}
    run: |
      bun run check:office-fixture-metadata
      bun --filter @stll/docx-utils test:office-fixture-metadata

  # Fail PRs that change the desktop bridge surface without
  # bumping BRIDGE_VERSION in apps/desktop/src-tauri/src/types.rs.
  # See scripts/check-bridge-version.sh for rationale.
  - name: Bridge-version guard
    env:
      CI_CHECK_KIND: CONTEXTUAL
      CI_CHECK_CONTEXT: "Uses event target or Git base/merge-base rather than only the current input tree."
    if: ${{ !cancelled() && steps.checkout.outcome == 'success' && steps.install.outcome != 'failure' && steps.standalone_lockfiles.outcome != 'failure' && steps.lockfile_ages.outcome != 'failure' && (github.event_name == 'pull_request') && (needs.ci-plan.outputs.root_checks == '' || contains(fromJSON(needs.ci-plan.outputs.root_checks || '[]'), 'ci-checks-rest/Bridge-version guard')) }}
    run: bash scripts/check-bridge-version.sh
