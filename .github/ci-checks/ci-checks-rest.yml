# Checks for the `ci-checks-rest` job in .github/workflows/ci.yml. Its "Run
# repository checks" step runs them with `bun scripts/ci-check-pool.ts`: each
# entry keeps the fields of the workflow step it replaced (condition, env,
# command, timeout), the pool evaluates the condition against the job's
# context, runs the selected checks concurrently (one fewer than the runner
# CPUs) and prints their logs in this order. Workflow guards read these
# entries as steps of the job (scripts/workflow-steps.ts).
checks:
  - name: Content delivery declarations
    env:
      CI_CHECK_KIND: STATIC
      CI_CHECK_INPUTS: tracked-tree+generated-inputs
    id: static_check_013
    if: ${{ !cancelled() && steps.install.outcome == 'success' && (needs.ci-plan.outputs.package_checks_required == 'true') && (needs.ci-plan.outputs.root_checks == '' || contains(fromJSON(needs.ci-plan.outputs.root_checks || '[]'), 'ci-checks-rest/Content delivery declarations')) && (github.event_name == 'merge_group' || steps.static_receipts.outputs.reuse_static_check_013 != 'true') }}
    # The guard follows handler imports into the gitignored capability
    # runtime modules, so generate them first instead of skipping them.
    run: |
      bun scripts/ci-generated-sources.ts prepare
      bun apps/api/scripts/content-delivery-guard.ts --self-test
      bun apps/api/scripts/content-delivery-guard.ts

  - name: Test capability shard merge and package parity
    env:
      CI_CHECK_KIND: CONTEXTUAL
      CI_CHECK_CONTEXT: "Capability shard pack test reads real origin/main catalog and revision."
    id: capability_parity
    if: ${{ !cancelled() && steps.install.outcome == 'success' && (needs.ci-plan.outputs.package_checks_required == 'true') && (needs.ci-plan.outputs.root_checks == '' || contains(fromJSON(needs.ci-plan.outputs.root_checks || '[]'), 'ci-checks-rest/Test capability shard merge and package parity')) }}
    # Worst pilot test 153.3 s; 400 s allows about 2.5x contention headroom.
    run: bun test --timeout 400000 scripts/capability-shard-merge.test.ts scripts/capability-shard-pack.test.ts

  - name: Generated files manifest guard
    env:
      CI_CHECK_KIND: STATIC
      CI_CHECK_INPUTS: tracked-tree+generated-inputs
      # scan-engine-wasm-drift builds the WebAssembly on this commit exactly
      # when its `if:` holds, and code-quality-web-rest runs the full
      # typecheck coverage (api-typecheck-projects' check) exactly when its
      # `if:` holds; scripts/generated-files-guard.test.ts binds each entry to
      # its owning job's condition. An empty entry delegates nothing.
      GENERATED_CHECKS_IN_OTHER_JOBS: ${{ format('["{0}","{1}"]', inputs.pr_depth_only != true && needs.ci-plan.outputs.scan_engine_wasm_required == 'true' && 'scan-engine-wasm' || '', (github.event_name == 'merge_group' || needs.ci-plan.outputs.pr_depth_reused != 'true') && needs.ci-plan.outputs.run_required != 'false' && inputs.heavy_only != true && needs.ci-plan.outputs.package_checks_required == 'true' && (needs.ci-plan.outputs.trusted == 'true' || github.event_name == 'workflow_dispatch') && 'api-typecheck-projects' || '') }}
      # A plan that proves the scan engine's inputs unchanged leaves its
      # committed WebAssembly as scan-engine-wasm-drift last proved it; this
      # job has no Rust cache, so rebuilding it here compiles the toolchain
      # from source. scripts/generated-files-guard.test.ts binds the entry to
      # the plan paths that cover the family.
      GENERATED_CHECKS_UNCHANGED: ${{ format('["{0}"]', needs.ci-plan.outputs.scan_engine_wasm_required == 'false' && 'scan-engine-wasm' || '') }}
    id: generated_manifest
    if: ${{ !cancelled() && steps.install.outcome == 'success' && (needs.ci-plan.outputs.package_checks_required == 'true') && (github.event_name == 'merge_group' || steps.static_receipts.outputs.reuse_generated_manifest != 'true') }}
    # Guard A registers tracked generated files; Guard B checks the
    # manifest entries with offline checks against committed outputs.
    run: |
      bun scripts/generated-files-guard.ts --guard-a
      bun scripts/generated-files-guard.ts --guard-b

  - name: Test oxlint plugins
    env:
      CI_CHECK_KIND: STATIC
      CI_CHECK_INPUTS: tracked-tree+generated-inputs
    id: static_check_012
    if: ${{ !cancelled() && steps.install.outcome == 'success' && (needs.ci-plan.outputs.package_checks_required == 'true') && (needs.ci-plan.outputs.root_checks == '' || contains(fromJSON(needs.ci-plan.outputs.root_checks || '[]'), 'ci-checks-rest/Test oxlint plugins')) && (github.event_name == 'merge_group' || steps.static_receipts.outputs.reuse_static_check_012 != 'true') }}
    run: |
      bun test scripts/oxlint-plugin-test-coverage.test.ts

  - name: Test release image CI gate
    env:
      CI_CHECK_KIND: STATIC
      CI_CHECK_INPUTS: tracked-tree+generated-inputs
    id: static_check_014
    if: ${{ !cancelled() && steps.install.outcome == 'success' && (needs.ci-plan.outputs.package_checks_required == 'true') && (needs.ci-plan.outputs.root_checks == '' || contains(fromJSON(needs.ci-plan.outputs.root_checks || '[]'), 'ci-checks-rest/Test release image CI gate')) && (github.event_name == 'merge_group' || steps.static_receipts.outputs.reuse_static_check_014 != 'true') }}
    # Worst pilot test 18.56 s; 50 s allows about 2.5x contention headroom.
    run: bun test --timeout 50000 scripts/ci-plan.test.ts

  # The api test runner only globs `src/**`, so the tests beside the api
  # scripts (seed guards, AI provider canary, MCP coverage) need an
  # explicit invocation to run in CI, like the scripts tests above. The
  # glob keeps a new scripts test from landing unrun. Gated on workspace
  # checks so it is skipped on workflow-only PRs where dependencies are
  # not installed.
  - name: Test api scripts
    env:
      CI_CHECK_KIND: CONTEXTUAL
      CI_CHECK_CONTEXT: "Aggregate API script tests include deployment-feature-guard.test.ts reading HEAD baseline and environment-selected Postgres tests."
    id: api_scripts
    if: ${{ !cancelled() && steps.install.outcome == 'success' && (needs.ci-plan.outputs.package_checks_required == 'true') && (needs.ci-plan.outputs.root_checks == '' || contains(fromJSON(needs.ci-plan.outputs.root_checks || '[]'), 'ci-checks-rest/Test api scripts')) }}
    # Worst pilot test 4.57 s; 12 s allows about 2.5x contention headroom.
    run: >-
      bun test --timeout 12000 --preload ./apps/api/src/tests/setup-env.ts
      apps/api/scripts/*.test.ts

  - name: API test timeout guard
    env:
      CI_CHECK_KIND: STATIC
      CI_CHECK_INPUTS: tracked-tree+generated-inputs
    id: api_test_timeout_guard
    if: ${{ !cancelled() && steps.install.outcome == 'success' && (needs.ci-plan.outputs.package_checks_required == 'true') && (needs.ci-plan.outputs.root_checks == '' || contains(fromJSON(needs.ci-plan.outputs.root_checks || '[]'), 'ci-checks-rest/API test timeout guard')) && (github.event_name == 'merge_group' || steps.static_receipts.outputs.reuse_api_test_timeout_guard != 'true') }}
    run: |
      bun test scripts/api-test-timeout-guard.test.ts
      bun scripts/api-test-timeout-guard.ts

  - name: Test CLI runtime package parity
    env:
      CI_CHECK_KIND: CONTEXTUAL
      CI_CHECK_CONTEXT: "CLI runtime pack test selects a real merge-base against origin/main."
    id: cli_runtime_parity
    if: ${{ !cancelled() && steps.install.outcome == 'success' && (needs.ci-plan.outputs.package_checks_required == 'true') }}
    # Worst pilot test 31.52 s; 80 s allows about 2.5x contention headroom.
    run: bun test --timeout 80000 scripts/cli-runtime-pack.test.ts scripts/cli-runtime-merge.test.ts

  # Root script tests belong to no workspace package, so no scoped test
  # run reaches them. Other steps call some by path; this runs every
  # other one, so a new test cannot miss CI by missing a step.
  - name: Test remaining repository scripts
    env:
      CI_CHECK_KIND: CONTEXTUAL
      CI_CHECK_CONTEXT: "Aggregate dynamically discovers tests; conservatively retain fresh execution for contextual or undeclared environmental dependencies."
    id: remaining_scripts
    if: ${{ !cancelled() && steps.install.outcome == 'success' && (needs.ci-plan.outputs.package_checks_required == 'true') }}
    # Worst pilot test 13.62 s; 35 s allows about 2.5x contention headroom.
    run: bun scripts/run-unlisted-script-tests.ts --timeout 35000

  - name: Playwright config scope
    env:
      CI_CHECK_KIND: STATIC
      CI_CHECK_INPUTS: tracked-tree+generated-inputs
    id: playwright_scope
    if: ${{ !cancelled() && steps.install.outcome == 'success' && (needs.ci-plan.outputs.package_checks_required == 'true') && (github.event_name == 'merge_group' || steps.static_receipts.outputs.reuse_playwright_scope != 'true') }}
    # Lists every Playwright config from its package. A spec that does not
    # load, or a project that collects another package's specs, fails here
    # on the pull request instead of failing every e2e shard in the queue.
    # The fixture tests run first so a broken guard cannot pass silently.
    # Pilot fixture tests stayed below 1 ms; retain the 5 s default explicitly.
    run: |
      bun test --timeout 5000 scripts/check-playwright-config-scope.test.ts
      bun run check:playwright-config-scope

  - name: Workspace hygiene
    id: static_check_015
    env:
      CI_CHECK_KIND: STATIC
      CI_CHECK_INPUTS: tracked-tree+generated-inputs
      STELLA_VERIFY: check
    if: ${{ !cancelled() && steps.install.outcome == 'success' && (needs.ci-plan.outputs.package_checks_required == 'true') && (github.event_name == 'merge_group' || steps.static_receipts.outputs.reuse_static_check_015 != 'true') }}
    # Restored from the bun postinstall lifecycle, which is bypassed
    # by `--ignore-scripts` above. sherif catches cross-package
    # dependency drift and workspace-hygiene.ts catches misnamed
    # apps/* and packages/* directories. ci-checks is the only job
    # that needs this — its trigger (any non-workflow file changes)
    # is a superset of web-build, landing-build, db-migrations, and
    # nightly-typecheck, so coverage is identical to running it in
    # each install.
    run: bun run lint:ws

  - name: Lockfile workspace-version guard
    id: static_check_017
    env:
      CI_CHECK_KIND: STATIC
      CI_CHECK_INPUTS: tracked-tree+generated-inputs
      STELLA_VERIFY: check
    if: ${{ !cancelled() && steps.install.outcome == 'success' && (needs.ci-plan.outputs.package_checks_required == 'true') && (needs.ci-plan.outputs.root_checks == '' || contains(fromJSON(needs.ci-plan.outputs.root_checks || '[]'), 'ci-checks-rest/Lockfile workspace-version guard')) && (github.event_name == 'merge_group' || steps.static_receipts.outputs.reuse_static_check_017 != 'true') }}
    # `bun.lock` caches each workspace's `name`/`version`; `bun install`
    # (frozen or not) never rewrites that cache when only a workspace's
    # own package.json version changes, and `bun pm pack`/`bun publish`
    # read the stale cached version when resolving a dependent's
    # `workspace:^`/`workspace:~` range at publish time. Catches drift
    # before a published @stll/* package ships a wrong dependency range.
    run: bun scripts/check-lockfile-workspace-versions.ts

  - name: Resolution range guard
    id: static_check_018
    env:
      CI_CHECK_KIND: STATIC
      CI_CHECK_INPUTS: tracked-tree+generated-inputs
      STELLA_VERIFY: check
    if: ${{ !cancelled() && steps.install.outcome == 'success' && (needs.ci-plan.outputs.package_checks_required == 'true') && (needs.ci-plan.outputs.root_checks == '' || contains(fromJSON(needs.ci-plan.outputs.root_checks || '[]'), 'ci-checks-rest/Resolution range guard')) && (github.event_name == 'merge_group' || steps.static_receipts.outputs.reuse_static_check_018 != 'true') }}
    # A root `resolutions`/`overrides` entry force-overrides a package's
    # version everywhere, ignoring the ranges its dependents declare, and
    # bun applies it without erroring even when it pins the package BELOW a
    # dependent's floor. That is silent at install and only surfaces as a
    # missing export at build or run time. This fails when a resolution
    # holds a dependency below
    # any dependent's required floor; intentional overrides are allowlisted
    # in the guard.
    run: bun scripts/check-resolution-ranges.ts

  - name: Quarantine-exclude guards
    env:
      CI_CHECK_KIND: CONTEXTUAL
      CI_CHECK_CONTEXT: "Reads wall clock to reject first-party exclusion dates in the future."
    if: ${{ !cancelled() && steps.install.outcome == 'success' && (needs.ci-plan.outputs.package_checks_required == 'true') && (needs.ci-plan.outputs.root_checks == '' || contains(fromJSON(needs.ci-plan.outputs.root_checks || '[]'), 'ci-checks-rest/Quarantine-exclude guards')) }}
    # The 5-day release-age quarantine is excluded per package for
    # first-party @stll/* code, and bun matches those entries EXACTLY (a
    # `@stll/*` glob is accepted and ignored). List a napi package without
    # its platform subpackages and the parent installs while its binaries
    # stay quarantined — and a quarantined optionalDependency is skipped
    # SILENTLY, so the package imports fine and throws on first use. This
    # fails when the exclude list stops covering everything in the lock.
    # Temporary third-party exemptions must carry an exact expiry;
    # scripts/dated-waivers.ts owns that expiry, and an elapsed one stops
    # exempting new pins in the lockfile release-age guard.
    run: |
      bun test scripts/check-stll-quarantine-excludes.test.ts
      bun scripts/check-stll-quarantine-excludes.ts

  - name: Policy evidence
    env:
      CI_CHECK_KIND: STATIC
      CI_CHECK_INPUTS: tracked-tree+generated-inputs
    id: static_check_019
    if: ${{ !cancelled() && steps.checkout.outcome == 'success' && steps.install.outcome != 'failure' && steps.standalone_lockfiles.outcome != 'failure' && steps.lockfile_ages.outcome != 'failure' && (needs.ci-plan.outputs.root_checks == '' || contains(fromJSON(needs.ci-plan.outputs.root_checks || '[]'), 'ci-checks-rest/Policy evidence')) && (github.event_name == 'merge_group' || steps.static_receipts.outputs.reuse_static_check_019 != 'true') }}
    run: bun run policies:check

  - name: Marketing content check
    env:
      CI_CHECK_KIND: STATIC
      CI_CHECK_INPUTS: tracked-tree+generated-inputs
    id: static_check_020
    if: ${{ !cancelled() && steps.install.outcome == 'success' && (needs.ci-plan.outputs.package_checks_required == 'true') && (needs.ci-plan.outputs.root_checks == '' || contains(fromJSON(needs.ci-plan.outputs.root_checks || '[]'), 'ci-checks-rest/Marketing content check')) && (github.event_name == 'merge_group' || steps.static_receipts.outputs.reuse_static_check_020 != 'true') }}
    run: bun run marketing:check

  - name: Docker host mount guard
    env:
      CI_CHECK_KIND: STATIC
      CI_CHECK_INPUTS: tracked-tree+generated-inputs
    id: static_check_021
    if: ${{ !cancelled() && steps.install.outcome == 'success' && (needs.ci-plan.outputs.package_checks_required == 'true') && (github.event_name == 'merge_group' || steps.static_receipts.outputs.reuse_static_check_021 != 'true') }}
    run: |
      bun test scripts/check-docker-host-mounts.test.ts
      bun run check:docker-host-mounts

  - name: Railway template shape
    env:
      CI_CHECK_KIND: STATIC
      CI_CHECK_INPUTS: tracked-tree+generated-inputs
    id: static_check_022
    if: ${{ !cancelled() && steps.install.outcome == 'success' && (needs.ci-plan.outputs.package_checks_required == 'true') && (needs.ci-plan.outputs.root_checks == '' || contains(fromJSON(needs.ci-plan.outputs.root_checks || '[]'), 'ci-checks-rest/Railway template shape')) && (github.event_name == 'merge_group' || steps.static_receipts.outputs.reuse_static_check_022 != 'true') }}
    run: bun run check:railway-template

  - name: Check i18n sync
    env:
      CI_CHECK_KIND: STATIC
      CI_CHECK_INPUTS: tracked-tree+generated-inputs
    id: static_check_023
    if: ${{ !cancelled() && steps.install.outcome == 'success' && (needs.ci-plan.outputs.package_checks_required == 'true') && (needs.ci-plan.outputs.root_checks == '' || contains(fromJSON(needs.ci-plan.outputs.root_checks || '[]'), 'ci-checks-rest/Check i18n sync')) && (github.event_name == 'merge_group' || steps.static_receipts.outputs.reuse_static_check_023 != 'true') }}
    run: bun run i18n:check

  - name: Release changelog guard
    if: ${{ !cancelled() && steps.checkout.outcome == 'success' && steps.install.outcome != 'failure' && steps.standalone_lockfiles.outcome != 'failure' && steps.lockfile_ages.outcome != 'failure' && (github.event_name == 'pull_request' || github.event_name == 'merge_group') }}
    env:
      CI_CHECK_KIND: CONTEXTUAL
      CI_CHECK_CONTEXT: "Uses event target or Git base/merge-base rather than only the current input tree."
      BASE_REF: ${{ github.base_ref || 'main' }}
    run: bash scripts/check-release-changelog.sh --base "origin/$BASE_REF"

  - name: Release queue history guard
    if: ${{ !cancelled() && steps.checkout.outcome == 'success' && steps.install.outcome != 'failure' && steps.standalone_lockfiles.outcome != 'failure' && steps.lockfile_ages.outcome != 'failure' && (github.event_name == 'pull_request' || github.event_name == 'merge_group') }}
    env:
      CI_CHECK_KIND: CONTEXTUAL
      CI_CHECK_CONTEXT: "Reads base history and current GitHub release state."
      BASE_SHA: ${{ needs.ci-plan.outputs.target_base_sha }}
      GH_TOKEN: ${{ github.token }}
    run: |
      if git diff --quiet "$BASE_SHA"...HEAD -- VERSION; then
        echo "VERSION unchanged; release queue history not required."
        exit 0
      fi
      bun scripts/check-release-queue-history.ts --base "$BASE_SHA"

  # Same verdict the tag workflow gives after merge, delivered while the
  # release pull request can still wait for the Version Packages one.
  - name: Release CLI coupling guard
    if: ${{ !cancelled() && steps.checkout.outcome == 'success' && steps.install.outcome != 'failure' && steps.standalone_lockfiles.outcome != 'failure' && steps.lockfile_ages.outcome != 'failure' && (github.event_name == 'pull_request' || github.event_name == 'merge_group') }}
    env:
      CI_CHECK_KIND: CONTEXTUAL
      CI_CHECK_CONTEXT: "Uses event target or Git base/merge-base rather than only the current input tree."
      BASE_REF: ${{ github.base_ref || 'main' }}
    run: bun scripts/check-cli-release-coupling.ts --base "origin/$BASE_REF"

  - name: CLI contract changeset guard
    if: ${{ !cancelled() && steps.checkout.outcome == 'success' && steps.install.outcome != 'failure' && steps.standalone_lockfiles.outcome != 'failure' && steps.lockfile_ages.outcome != 'failure' && (github.event_name == 'pull_request' || github.event_name == 'merge_group') }}
    env:
      CI_CHECK_KIND: CONTEXTUAL
      CI_CHECK_CONTEXT: "Uses event target or Git base/merge-base rather than only the current input tree."
      STELLA_VERIFY: check
      CHECK_BASE_REF: ${{ format('origin/{0}', github.base_ref || 'main') }}
      BASE_REF: ${{ github.base_ref || 'main' }}
    run: bun scripts/check-cli-contract-changeset.ts --base "$CHECK_BASE_REF"

  - name: SQL performance suppression summary
    if: ${{ !cancelled() && steps.install.outcome == 'success' && (needs.ci-plan.outputs.package_checks_required == 'true' && (github.event_name == 'pull_request' || github.event_name == 'merge_group')) }}
    env:
      CI_CHECK_KIND: CONTEXTUAL
      CI_CHECK_CONTEXT: "Uses event target or Git base/merge-base rather than only the current input tree."
      BASE_SHA: ${{ needs.ci-plan.outputs.target_base_sha }}
    run: bun scripts/sql-perf-suppressions.ts

  - name: Release marketing provenance warning
    if: ${{ !cancelled() && steps.install.outcome == 'success' && (needs.ci-plan.outputs.package_checks_required == 'true' && (github.event_name == 'pull_request' || github.event_name == 'merge_group')) }}
    env:
      CI_CHECK_KIND: CONTEXTUAL
      CI_CHECK_CONTEXT: "Uses event target or Git base/merge-base rather than only the current input tree."
      BASE_REF: ${{ github.base_ref || 'main' }}
    run: |
      if git diff --quiet "origin/$BASE_REF"...HEAD -- VERSION; then
        echo "VERSION unchanged; fresh release recordings not required."
        exit 0
      fi
      if ! bun run marketing:provenance --strict; then
        echo "::warning::Changed marketing recording provenance for this release (see step log). Re-record with \`bun run marketing:reshoot\`."
      fi

  - name: Rust format
    env:
      CI_CHECK_KIND: STATIC
      CI_CHECK_INPUTS: tracked-tree+generated-inputs
    id: static_check_024
    if: ${{ !cancelled() && steps.checkout.outcome == 'success' && steps.install.outcome != 'failure' && steps.standalone_lockfiles.outcome != 'failure' && steps.lockfile_ages.outcome != 'failure' && (needs.ci-plan.outputs.desktop_rust_checks_required == 'true') && (needs.ci-plan.outputs.root_checks == '' || contains(fromJSON(needs.ci-plan.outputs.root_checks || '[]'), 'ci-checks-rest/Rust format')) && (github.event_name == 'merge_group' || steps.static_receipts.outputs.reuse_static_check_024 != 'true') }}
    run: cargo fmt --manifest-path apps/desktop/src-tauri/Cargo.toml -- --check

  - name: React Compiler bailout guard
    env:
      CI_CHECK_KIND: STATIC
      CI_CHECK_INPUTS: tracked-tree+generated-inputs
    id: static_check_025
    if: ${{ !cancelled() && steps.install.outcome == 'success' && (needs.ci-plan.outputs.package_checks_required == 'true') && (needs.ci-plan.outputs.root_checks == '' || contains(fromJSON(needs.ci-plan.outputs.root_checks || '[]'), 'ci-checks-rest/React Compiler bailout guard')) && (github.event_name == 'merge_group' || steps.static_receipts.outputs.reuse_static_check_025 != 'true') }}
    # Components the React Compiler bails out on (refs-in-render,
    # try/finally, an ESLint suppression on the component) are not
    # auto-memoized, so manual useMemo/useCallback there is load-bearing:
    # removing it leaves unstable references that re-fire effects every
    # render — loops that lint and typecheck do not catch. Fails when a
    # baseline bailout file loses memoization or a new bailout component
    # appears untracked. CI-only: it runs the JS compiler, too slow for the
    # normal lint output. Regenerate:
    # `bun scripts/rc-bailouts.ts --write-baseline`.
    run: bun scripts/rc-bailouts.ts --check

  - name: Design-system lint backlog
    id: static_check_026
    env:
      CI_CHECK_KIND: STATIC
      CI_CHECK_INPUTS: tracked-tree+generated-inputs
      STELLA_VERIFY: check
    if: ${{ !cancelled() && steps.install.outcome == 'success' && (needs.ci-plan.outputs.package_checks_required == 'true') && (github.event_name == 'merge_group' || steps.static_receipts.outputs.reuse_static_check_026 != 'true') }}
    # The tracked design-system rules are off in the files
    # scripts/design-lint-baseline.json still lists; this holds each
    # file's count at its baseline and fails when a listed file reaches
    # zero, so the list only shrinks. Regenerate:
    # `bun scripts/design-lint-baseline.ts --write`.
    run: |
      bun test scripts/design-lint-baseline.test.ts scripts/oxlint-config-inputs.test.ts
      bun scripts/design-lint-baseline.ts --check

  - name: Full error toast text census
    env:
      CI_CHECK_KIND: STATIC
      CI_CHECK_INPUTS: tracked-tree+generated-inputs
    id: static_check_027
    if: ${{ !cancelled() && steps.install.outcome == 'success' && (needs.ci-plan.outputs.package_checks_required == 'true') && (needs.ci-plan.outputs.root_checks == '' || contains(fromJSON(needs.ci-plan.outputs.root_checks || '[]'), 'ci-checks-rest/Full error toast text census')) && (github.event_name == 'merge_group' || steps.static_receipts.outputs.reuse_static_check_027 != 'true') }}
    run: bun run check:toast-errors

  - name: Query data state baseline
    continue-on-error: ${{ github.event_name == 'merge_group' }}
    if: ${{ !cancelled() && steps.install.outcome == 'success' && (needs.ci-plan.outputs.package_checks_required == 'true') && (needs.ci-plan.outputs.root_checks == '' || contains(fromJSON(needs.ci-plan.outputs.root_checks || '[]'), 'ci-checks-rest/Query data state baseline')) }}
    env:
      CI_CHECK_KIND: CONTEXTUAL
      CI_CHECK_CONTEXT: "Uses event target or Git base/merge-base rather than only the current input tree."
      STELLA_VERIFY: check
      BASE_SHA: ${{ needs.ci-plan.outputs.target_base_sha }}
    run: |
      bun test scripts/query-data-state-baseline.test.ts
      bun run check:query-data-state

  - name: SQL performance baseline
    continue-on-error: ${{ github.event_name == 'merge_group' }}
    if: ${{ !cancelled() && steps.install.outcome == 'success' && (needs.ci-plan.outputs.package_checks_required == 'true') && (needs.ci-plan.outputs.root_checks == '' || contains(fromJSON(needs.ci-plan.outputs.root_checks || '[]'), 'ci-checks-rest/SQL performance baseline')) }}
    env:
      CI_CHECK_KIND: CONTEXTUAL
      CI_CHECK_CONTEXT: "Uses event target or Git base/merge-base rather than only the current input tree."
      STELLA_VERIFY: check
      BASE_SHA: ${{ needs.ci-plan.outputs.target_base_sha }}
    run: |
      bun test scripts/sql-perf-detector.test.ts scripts/sql-perf-baseline.test.ts
      bun scripts/sql-perf-baseline.ts --check

  - name: Failure-as-empty baseline
    continue-on-error: ${{ github.event_name == 'merge_group' }}
