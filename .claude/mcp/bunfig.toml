[install]
# Bun reads only the bunfig.toml of the directory it installs in, so this
# lockfile does not inherit the root's 5-day release-age quarantine. Keep the
# same value; scripts/check-standalone-lockfiles.ts fails when they differ.
minimumReleaseAge = 432_000
minimumReleaseAgeExcludes = [
  "bun-types", # quarantine-expires: 2026-10-15T05:25:00.000Z
]
# Fail on a missing import instead of installing it at run time.
auto = "disable"
