[package]
name = "stella-anonymize-binding-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Runtime-neutral binding facade for stella anonymization"
license.workspace = true
publish.workspace = true
repository.workspace = true

[features]
default = ["zstd"]
zstd = ["stella-anonymize-adapter-contract/zstd"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
stella-anonymize-adapter-contract = { path = "../anonymize-adapter-contract", default-features = false }
stella-anonymize-core = { path = "../anonymize-core" }
thiserror = "2"

[lints]
workspace = true
