[package]
name = "stella-document-rules-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Incremental structured-document rule execution"
license.workspace = true
publish.workspace = true
repository.workspace = true

[features]
default = ["incremental"]
incremental = ["dep:salsa"]

[dependencies]
salsa = { version = "0.28.1", default-features = false, optional = true, features = [
  "inventory",
  "macros",
  "salsa_unstable",
] }
thiserror = "2"

[lints]
workspace = true
