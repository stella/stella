[package]
name = "stella-anonymize-wasm"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Single-thread browser WebAssembly bindings for stella anonymization"
license.workspace = true
publish.workspace = true
repository.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
js-sys = "0.3.103"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
stella-anonymize-adapter-contract = { path = "../anonymize-adapter-contract", default-features = false }
stella-anonymize-binding-core = { path = "../anonymize-binding-core", default-features = false }
stella-anonymize-core = { path = "../anonymize-core" }
stella-anonymize-docx-core = { path = "../anonymize-docx-core" }
stella-anonymize-pdf-core = { path = "../anonymize-pdf-core" }
wasm-bindgen = "0.2.126"

[lints]
workspace = true
