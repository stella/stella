[package]
name = "stella-anonymize-napi"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Native bindings for stella anonymization core"
license.workspace = true
publish.workspace = true
repository.workspace = true

[lib]
crate-type = ["cdylib"]

[features]
default = ["zstd"]
# Host bindings enable compressed-package support by default; feature
# forwarding keeps the shared facade and adapter contract aligned.
zstd = [
  "stella-anonymize-adapter-contract/zstd",
  "stella-anonymize-binding-core/zstd",
]

[dependencies]
blake3 = "1"
napi = { version = "3", default-features = false, features = [
  "napi9",
  "serde-json",
] }
napi-derive = "3"
serde_json = "1"
stella-anonymize-adapter-contract = { path = "../anonymize-adapter-contract", default-features = false }
stella-anonymize-binding-core = { path = "../anonymize-binding-core", default-features = false }
stella-anonymize-core = { path = "../anonymize-core" }
stella-anonymize-docx-core = { path = "../anonymize-docx-core" }
stella-anonymize-pdf-core = { path = "../anonymize-pdf-core" }

[build-dependencies]
napi-build = "2"

[lints]
workspace = true
