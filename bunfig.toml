[install]
# Bun 1.4 fixed the catalog and stale-entry bugs that blocked isolated installs.
# Share immutable package installations across local checkouts and worktrees.
linker = "isolated"
globalStore = true
# Preserve the monorepo's existing root-level resolution while each workspace
# declares the dependencies that hoisted installs previously supplied.
publicHoistPattern = ["*"]
# 5-day quarantine: reject package versions published
# less than 5 days ago to mitigate supply chain attacks.
minimumReleaseAge = 432_000
minimumReleaseAgeExcludes = [
  # Temporary third-party exceptions must carry the exact instant at which
  # the normal five-day quarantine admits the currently pinned release.
  # TanStack's paired SSR releases stream query arrays, avoiding an undefined
  # whole-state hydration path with Query 5.102.5. Keep the pair coherent.
  # @silurus/ooxml 0.82.1 adds host-controlled XLSX viewer chrome colors.
  # Remove this exception once the normal quarantine admits it.
  # @vscode/markdown-editor ships near-daily pre-release builds; the hybrid
  # markdown editor pins the current one. Remove this exception once the normal
  # quarantine admits it.
  # Keep Astro's framework and Markdown packages on one patch line while
  # verifying their Vite 8.2/Rolldown 1.2 compatibility. Remove these
  # exceptions once the normal quarantine admits them.
  # bun-types 1.4.2 keeps the compiler contract aligned with Bun 1.4.2.
  # Remove this exception once the normal quarantine admits it.
  # TanStack AI 0.48.0 contains the upstream fixes that replace Stella's local
  # package patches. Keep the release family coherent across direct and
  # transitive packages; remove these exceptions after the normal quarantine.
  # anydoc 0.2.3 adds in-house Excel parsing while retaining the bounded PDF
  # parser. Keep every napi binding in the same temporary exception so Bun
  # cannot silently omit the native binary.
  # First-party @stll packages are on public npm (open source). They share a
  # release cadence and would otherwise be blocked on every publish cycle.
  # Permanent exclusions record their original introduction for auditability.
  # @vitejs/plugin-react 6.1.0 is required for the Oxc React Compiler Vite
  # integration. Remove this exception once the normal quarantine admits it.
  # oxc-transform-react 0.145.0 replaces the Babel React Compiler transform.
  # Keep every napi binding in the same temporary exception: Bun otherwise
  # skips quarantined optional bindings and leaves the parent unusable.
  # Upgrading to Oxlint 1.81.0 requires the category-specific React Compiler
  # rules used by Ultracite 7.10.7. Keep every native binding in the same
  # temporary exception so Bun cannot silently omit the executable.
  # Remove these exceptions after 2026-09-06T15:22:06.857Z.
  "bun-types", # quarantine-expires: 2026-09-10T06:00:22.737Z
  "@stll/oxlint-config", # quarantine-excluded-since: 2026-07-08T00:22:40.000Z
  "@stll/typescript-config", # quarantine-excluded-since: 2026-07-08T00:22:40.000Z
  "@stll/aho-corasick-wasm", # quarantine-excluded-since: 2026-07-08T00:22:40.000Z
  "@stll/anonymize", # quarantine-excluded-since: 2026-08-21T20:57:15.731Z
  "@stll/anonymize-darwin-arm64", # quarantine-excluded-since: 2026-08-21T20:53:13.734Z
  "@stll/anonymize-darwin-x64", # quarantine-excluded-since: 2026-08-21T20:53:18.289Z
  "@stll/anonymize-data", # quarantine-excluded-since: 2026-08-21T19:06:57.523Z
  "@stll/anonymize-linux-arm64-gnu", # quarantine-excluded-since: 2026-08-21T20:53:18.996Z
  "@stll/anonymize-linux-x64-gnu", # quarantine-excluded-since: 2026-08-21T20:53:18.531Z
  "@stll/anonymize-wasm", # quarantine-excluded-since: 2026-08-21T20:58:55.229Z
  "@stll/anonymize-win32-x64-msvc", # quarantine-excluded-since: 2026-08-21T20:53:15.999Z
  "@stll/conditions", # quarantine-excluded-since: 2026-08-11T09:34:37.000Z
  "@stll/docx-core", # quarantine-excluded-since: 2026-07-13T12:21:46.000Z
  "@stll/folio-agents", # quarantine-excluded-since: 2026-07-08T00:22:40.000Z
  "@stll/folio-core", # quarantine-excluded-since: 2026-07-08T00:22:40.000Z
  "@stll/folio-react", # quarantine-excluded-since: 2026-07-08T00:22:40.000Z
  "@stll/fuzzy-search-wasm", # quarantine-excluded-since: 2026-07-08T00:22:40.000Z
  "@stll/regex-set-wasm", # quarantine-excluded-since: 2026-07-08T00:22:40.000Z
  "@stll/template-conditions", # quarantine-excluded-since: 2026-08-11T09:34:37.000Z
  # A napi package must be listed WITH its platform subpackages. They publish
  # in the same minute, but they are optionalDependencies: quarantine one and
  # bun skips it silently, leaving the parent installed with no native binding
  # and every call failing at runtime. Bun matches these names exactly — a
  # `@stll/*` glob is accepted and then ignored.
  "@stll/stdnum", # quarantine-excluded-since: 2026-07-08T00:22:40.000Z
  "@stll/stdnum-darwin-arm64", # quarantine-excluded-since: 2026-07-26T19:50:26.000Z
  "@stll/stdnum-darwin-x64", # quarantine-excluded-since: 2026-07-26T19:50:26.000Z
  "@stll/stdnum-linux-arm64-gnu", # quarantine-excluded-since: 2026-07-26T19:50:26.000Z
  "@stll/stdnum-linux-x64-gnu", # quarantine-excluded-since: 2026-07-26T19:50:26.000Z
  "@stll/stdnum-wasm", # quarantine-excluded-since: 2026-07-26T19:50:26.000Z
  "@stll/stdnum-win32-x64-msvc", # quarantine-excluded-since: 2026-07-26T19:50:26.000Z
  "@stll/text-search-wasm", # quarantine-excluded-since: 2026-07-08T00:22:40.000Z
]
