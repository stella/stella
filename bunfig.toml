[install]
linker = "hoisted"
# 5-day quarantine: reject package versions published
# less than 5 days ago to mitigate supply chain attacks.
minimumReleaseAge = 432_000
# First-party @stll packages are on public npm (open source).
# They share a release cadence and would otherwise be blocked
# by the quarantine on every publish cycle.
minimumReleaseAgeExcludes = [
  "@stll/oxlint-config",
  "@stll/typescript-config",
  "@stll/aho-corasick-wasm",
  "@stll/anonymize-data",
  "@stll/anonymize-wasm",
  "@stll/docx-core",
  "@stll/folio-agents",
  "@stll/folio-core",
  "@stll/folio-react",
  "@stll/fuzzy-search-wasm",
  "@stll/regex-set-wasm",
  # A napi package must be listed WITH its platform subpackages. They publish
  # in the same minute, but they are optionalDependencies: quarantine one and
  # bun skips it silently, leaving the parent installed with no native binding
  # and every call failing at runtime. Bun matches these names exactly — a
  # `@stll/*` glob is accepted and then ignored.
  "@stll/stdnum",
  "@stll/stdnum-darwin-arm64",
  "@stll/stdnum-darwin-x64",
  "@stll/stdnum-linux-arm64-gnu",
  "@stll/stdnum-linux-x64-gnu",
  "@stll/stdnum-wasm",
  "@stll/stdnum-win32-x64-msvc",
  "@stll/text-search-wasm",
  # Transitive exact pin from @tanstack/ai-openrouter 0.15.10; it ships
  # in lockstep with the quarantined-exempt TanStack AI provider batch.
  "@openrouter/sdk",
  # TanStack AI beta: opted in ahead of stable for the AI SDK migration.
  "@tanstack/ai",
  "@tanstack/ai-anthropic",
  "@tanstack/ai-code-mode",
  "@tanstack/ai-bedrock",
  "@tanstack/ai-client",
  "@tanstack/ai-event-client",
  "@tanstack/ai-gemini",
  "@tanstack/ai-mcp",
  "@tanstack/ai-mistral",
  "@tanstack/ai-openai",
  "@tanstack/ai-openrouter",
  "@tanstack/ai-react",
  "@tanstack/ai-utils",
  "@tanstack/react-ai-devtools",
  # TanStack Table v9: opted in ahead of stable for the tree-shakable
  # feature/plugin model, granular re-render control, and table devtools.
  # 9.0.0 shipped stable, so the release-age gate covers this now; annotated
  # for automatic removal by quarantine-prune.yml.
  "@tanstack/react-table", # quarantine-expires: 2026-08-04T19:00:00.000Z
  "@tanstack/table-core", # quarantine-expires: 2026-08-04T19:00:00.000Z
  "@tanstack/react-table-devtools", # quarantine-expires: 2026-08-04T19:00:00.000Z
  "@tanstack/table-devtools", # quarantine-expires: 2026-08-04T19:00:00.000Z
  "@tanstack/openai-base",
  # TypeScript 7 stable: opted in immediately for the native compiler
  # migration. 7.0.2 has long since cleared the window, so the release-age
  # gate covers this now; annotated for automatic removal by
  # quarantine-prune.yml.
  "typescript", # quarantine-expires: 2026-08-04T19:00:00.000Z
  "@typescript/native", # quarantine-expires: 2026-08-04T19:00:00.000Z
  "@typescript/typescript-aix-ppc64", # quarantine-expires: 2026-08-04T19:00:00.000Z
  "@typescript/typescript-darwin-arm64", # quarantine-expires: 2026-08-04T19:00:00.000Z
  "@typescript/typescript-darwin-x64", # quarantine-expires: 2026-08-04T19:00:00.000Z
  "@typescript/typescript-freebsd-arm64", # quarantine-expires: 2026-08-04T19:00:00.000Z
  "@typescript/typescript-freebsd-x64", # quarantine-expires: 2026-08-04T19:00:00.000Z
  "@typescript/typescript-linux-arm", # quarantine-expires: 2026-08-04T19:00:00.000Z
  "@typescript/typescript-linux-arm64", # quarantine-expires: 2026-08-04T19:00:00.000Z
  "@typescript/typescript-linux-loong64", # quarantine-expires: 2026-08-04T19:00:00.000Z
  "@typescript/typescript-linux-mips64el", # quarantine-expires: 2026-08-04T19:00:00.000Z
  "@typescript/typescript-linux-ppc64", # quarantine-expires: 2026-08-04T19:00:00.000Z
  "@typescript/typescript-linux-riscv64", # quarantine-expires: 2026-08-04T19:00:00.000Z
  "@typescript/typescript-linux-s390x", # quarantine-expires: 2026-08-04T19:00:00.000Z
  "@typescript/typescript-linux-x64", # quarantine-expires: 2026-08-04T19:00:00.000Z
  "@typescript/typescript-netbsd-arm64", # quarantine-expires: 2026-08-04T19:00:00.000Z
  "@typescript/typescript-netbsd-x64", # quarantine-expires: 2026-08-04T19:00:00.000Z
  "@typescript/typescript-openbsd-arm64", # quarantine-expires: 2026-08-04T19:00:00.000Z
  "@typescript/typescript-openbsd-x64", # quarantine-expires: 2026-08-04T19:00:00.000Z
  "@typescript/typescript-sunos-x64", # quarantine-expires: 2026-08-04T19:00:00.000Z
  "@typescript/typescript-win32-arm64", # quarantine-expires: 2026-08-04T19:00:00.000Z
  "@typescript/typescript-win32-x64", # quarantine-expires: 2026-08-04T19:00:00.000Z
  # Security patches for dependency-audit findings. Publisher and repository
  # ownership match the preceding releases; remove after quarantine expiry.
  # better-result 3: opted in immediately for migration evaluation.
  # 3.0.0 was published at 2026-08-01T21:35:30.036Z.
  "better-result", # quarantine-expires: 2026-08-06T21:35:30.036Z
  # Drizzle 1.0 release candidates, opted in ahead of stable. The pinned rc
  # cleared the window weeks ago; annotated for automatic removal.
  "drizzle-kit", # quarantine-expires: 2026-08-04T19:00:00.000Z
  "drizzle-orm", # quarantine-expires: 2026-08-04T19:00:00.000Z
]
