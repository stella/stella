[install]
# Fail on a missing import instead of installing it at run time.
auto = "disable"
# Bun 1.4 fixed the catalog and stale-entry bugs that blocked isolated installs.
# Share immutable package installations across local checkouts and worktrees.
linker = "isolated"
globalStore = true
# Preserve the monorepo's existing root-level resolution while each workspace
# declares the dependencies that hoisted installs previously supplied.
publicHoistPattern = ["*"]
# 5-day quarantine: reject package versions published
# less than 5 days ago to mitigate supply chain attacks.
# Bun reads only the installing directory's bunfig.toml: a standalone lockfile
# outside the workspaces carries its own copy of this value, which
# scripts/check-standalone-lockfiles.ts enforces.
minimumReleaseAge = 432_000
minimumReleaseAgeExcludes = [
  # Temporary third-party exceptions must carry the exact instant at which
  # the normal five-day quarantine admits the currently pinned release.
  # A "cargo:<crate>" entry exempts a crates.io crate in a tracked Cargo.lock
  # from scripts/check-lockfile-release-ages.ts on the same terms; Bun never
  # matches it, as npm names cannot contain a colon.
  # First-party @stll packages are on public npm (open source). They share a
  # release cadence and would otherwise be blocked on every publish cycle.
  # Permanent exclusions record their original introduction for auditability.
  "cargo:ammonia", # quarantine-expires: 2026-11-18T05:25:55.933Z
  "@stll/oxlint-config", # quarantine-excluded-since: 2026-07-08T00:22:40.000Z
  "@stll/typescript-config", # quarantine-excluded-since: 2026-07-08T00:22:40.000Z
  "@stll/aho-corasick", # quarantine-excluded-since: 2026-10-17T16:30:00.000Z
  "@stll/aho-corasick-darwin-arm64", # quarantine-excluded-since: 2026-10-17T16:30:00.000Z
  "@stll/aho-corasick-darwin-x64", # quarantine-excluded-since: 2026-10-17T16:30:00.000Z
  "@stll/aho-corasick-linux-arm64-gnu", # quarantine-excluded-since: 2026-10-17T16:30:00.000Z
  "@stll/aho-corasick-linux-x64-gnu", # quarantine-excluded-since: 2026-10-17T16:30:00.000Z
  "@stll/aho-corasick-wasm", # quarantine-excluded-since: 2026-07-08T00:22:40.000Z
  "@stll/aho-corasick-wasm32-wasi", # quarantine-excluded-since: 2026-10-17T16:30:00.000Z
  "@stll/aho-corasick-win32-x64-msvc", # quarantine-excluded-since: 2026-10-17T16:30:00.000Z
  "@stll/anonymize", # quarantine-excluded-since: 2026-08-21T20:57:15.731Z
  "@stll/anonymize-darwin-arm64", # quarantine-excluded-since: 2026-08-21T20:53:13.734Z
  "@stll/anonymize-darwin-x64", # quarantine-excluded-since: 2026-08-21T20:53:18.289Z
  "@stll/anonymize-data", # quarantine-excluded-since: 2026-08-21T19:06:57.523Z
  "@stll/anonymize-linux-arm64-gnu", # quarantine-excluded-since: 2026-08-21T20:53:18.996Z
  "@stll/anonymize-linux-x64-gnu", # quarantine-excluded-since: 2026-08-21T20:53:18.531Z
  "@stll/anonymize-wasm", # quarantine-excluded-since: 2026-08-21T20:58:55.229Z
  "@stll/anonymize-win32-x64-msvc", # quarantine-excluded-since: 2026-08-21T20:53:15.999Z
  "@stll/conditions", # quarantine-excluded-since: 2026-08-11T09:34:37.000Z
  "@stll/docx-core", # quarantine-excluded-since: 2026-07-13T12:21:46.000Z
  "@stll/folio-agents", # quarantine-excluded-since: 2026-07-08T00:22:40.000Z
  "@stll/mcp-kit", # quarantine-excluded-since: 2026-09-30T00:00:00.000Z
  "@stll/folio-core", # quarantine-excluded-since: 2026-07-08T00:22:40.000Z
  "@stll/folio-fonts", # quarantine-excluded-since: 2026-10-30T04:55:17.971Z
  "@stll/folio-react", # quarantine-excluded-since: 2026-07-08T00:22:40.000Z
  "@stll/fuzzy-search", # quarantine-excluded-since: 2026-09-27T00:00:00.000Z
  "@stll/fuzzy-search-darwin-arm64", # quarantine-excluded-since: 2026-09-27T00:00:00.000Z
  "@stll/fuzzy-search-darwin-x64", # quarantine-excluded-since: 2026-09-27T00:00:00.000Z
  "@stll/fuzzy-search-linux-arm64-gnu", # quarantine-excluded-since: 2026-09-27T00:00:00.000Z
  "@stll/fuzzy-search-linux-x64-gnu", # quarantine-excluded-since: 2026-09-27T00:00:00.000Z
  "@stll/fuzzy-search-wasm", # quarantine-excluded-since: 2026-07-08T00:22:40.000Z
  "@stll/fuzzy-search-wasm32-wasi", # quarantine-excluded-since: 2026-09-27T00:00:00.000Z
  "@stll/fuzzy-search-win32-x64-msvc", # quarantine-excluded-since: 2026-09-27T00:00:00.000Z
  "@stll/regex-set", # quarantine-excluded-since: 2026-10-17T16:30:00.000Z
  "@stll/regex-set-darwin-arm64", # quarantine-excluded-since: 2026-10-17T16:30:00.000Z
  "@stll/regex-set-darwin-x64", # quarantine-excluded-since: 2026-10-17T16:30:00.000Z
  "@stll/regex-set-linux-arm64-gnu", # quarantine-excluded-since: 2026-10-17T16:30:00.000Z
  "@stll/regex-set-linux-x64-gnu", # quarantine-excluded-since: 2026-10-17T16:30:00.000Z
  "@stll/regex-set-wasm", # quarantine-excluded-since: 2026-07-08T00:22:40.000Z
  "@stll/regex-set-wasm32-wasi", # quarantine-excluded-since: 2026-10-17T16:30:00.000Z
  "@stll/regex-set-win32-x64-msvc", # quarantine-excluded-since: 2026-10-17T16:30:00.000Z
  "@stll/template-conditions", # quarantine-excluded-since: 2026-08-11T09:34:37.000Z
  "@stll/test-kit", # quarantine-excluded-since: 2026-10-19T19:04:38.541Z
  "@stll/time", # quarantine-excluded-since: 2026-10-18T16:27:42.715Z
  "@stll/utf8-boundaries", # quarantine-excluded-since: 2026-10-25T18:26:59.000Z
  # A napi package must be listed WITH its platform subpackages. They publish
  # in the same minute, but they are optionalDependencies: quarantine one and
  # bun skips it silently, leaving the parent installed with no native binding
  # and every call failing at runtime. Bun matches these names exactly — a
  # `@stll/*` glob is accepted and then ignored.
  "@stll/stdnum", # quarantine-excluded-since: 2026-07-08T00:22:40.000Z
  "@stll/stdnum-darwin-arm64", # quarantine-excluded-since: 2026-07-26T19:50:26.000Z
  "@stll/stdnum-darwin-x64", # quarantine-excluded-since: 2026-07-26T19:50:26.000Z
  "@stll/stdnum-linux-arm64-gnu", # quarantine-excluded-since: 2026-07-26T19:50:26.000Z
  "@stll/stdnum-linux-x64-gnu", # quarantine-excluded-since: 2026-07-26T19:50:26.000Z
  "@stll/stdnum-wasm", # quarantine-excluded-since: 2026-07-26T19:50:26.000Z
  "@stll/stdnum-win32-x64-msvc", # quarantine-excluded-since: 2026-07-26T19:50:26.000Z
  "@stll/text-search", # quarantine-excluded-since: 2026-10-14T16:29:50.763Z
  "@stll/text-search-wasm", # quarantine-excluded-since: 2026-07-08T00:22:40.000Z
]

[fmt]
# These options apply on top of Prettier's defaults because the root
# .prettierrc.yml ends the formatter's config lookup at this repository root
# (scripts/formatter-config-root.test.ts).
printWidth = 80
ignorePatterns = [
  # Shared generated files (stll-toolchain formatter policy).
  ".ai/shared/**",
  ".agents/skills/**",
  ".claude/skills/**",
  "**/AGENTS.md",
  "**/GEMINI.md",
  "**/CLAUDE.md",
  ".github/dependabot.yml",
  "**/fixtures/**",
  "**/__fixtures__/**",
  "**/testdata/**",
  "**/__snapshots__/**",
  "**/*.gen.*",
  "**/*.min.*",
  "sbom.cdx.json",
  "**/.cache/**",
  ".tailwind-cache/**",
  "**/.oxlintrc.json",
  "**/dist/**",
  "apps/api/src/db/schema.ts",
  "packages/template-packs/content/**",
  "apps/api/src/lib/legal-search/morphology/snowball/base-stemmer.ts",
  "apps/api/src/handlers/visual-sandbox/generated/**",
  "apps/api/src/mcp/generated/capability-dispatch/*.ts",
  "packages/cli/capabilities/*.json",
  "packages/cli/src/generated/route-map.ts",
  "packages/cli/src/generated/tool-annotations.ts",
  "packages/cli/skills/stella-cli/SKILL.md",
  "docs/capability-coverage.md",
  "**/i18n-check-baseline.json",
  "**/i18n-lint-baseline.json",
  "apps/api/mcp-surface-baseline.json",
  "apps/api/src/mcp/generated/capability-feature-bindings.ts",
  "apps/api/src/mcp/generated/capability-catalog.ts",
  "apps/api/src/mcp/generated/capability-dispatch.ts",
]

[fmt.sortImports]
customGroups = [
  { groupName = "react", elementNamePattern = [
    "react",
    "react-dom",
    "react-dom/**",
  ] },
  { groupName = "stella", elementNamePattern = ["@stll/**"] },
  { groupName = "aliases", elementNamePattern = ["@/**"] },
]
groups = [
  "react",
  ["builtin", "external", "type-builtin", "type-external"],
  "stella",
  "aliases",
  ["parent", "sibling", "index", "type-parent", "type-sibling", "type-index"],
]
newlinesBetween = true

[fmt.sortTailwindcss]
functions = ["cn", "cva"]
stylesheet = "node_modules/tailwindcss/theme.css"

[test]
# Custom lint rule tests spend their time awaiting oxlint. Running each file's
# tests concurrently lets .oxlint-plugins/__tests__/lint-single-rule.ts lint
# every waiting case of one rule configuration in a single oxlint run.
concurrentTestGlob = "**/.oxlint-plugins/__tests__/*.test.ts"

# Test-file rules for `bun lint`, which applies this section on top of
# oxlint.config.ts. Stable `bun test` and `bun install` ignore it, and oxlint
# cannot run these checks: its jest and vitest rules skip every file that
# imports from bun:test, which every test here does.
# Not enabled: no-disabled-tests (database suites skip on purpose without a
# database), the no-conditional-* rules, the prefer-* style rules, and
# expect-expect (many tests still assert through helpers it cannot see).
[[lint.overrides]]
files = ["**/*.{test,spec}.{ts,tsx}", "**/__tests__/**/*.{ts,tsx}"]
# Lint-rule fixtures break these rules on purpose.
excludeFiles = [".oxlint-plugins/__fixtures__/**"]

[lint.overrides.rules]
"bun:test/no-commented-out-tests" = "error"
"bun:test/no-done-callback" = "error"
"bun:test/no-duplicate-hooks" = "error"
"bun:test/no-export" = "error"
"bun:test/no-focused-tests" = "error"
"bun:test/no-identical-title" = "error"
"bun:test/no-standalone-expect" = ["error", { additionalTestBlockFunctions = [
  # Hooks may assert on their setup and teardown.
  "beforeAll",
  "beforeEach",
  "afterAll",
  "afterEach",
  # Platform-gated aliases of test.
  "posixTest",
  "posixTest.each",
  "windowsTest",
  "windowsTest.each",
] }]
"bun:test/no-test-prefixes" = "error"
"bun:test/no-test-return-statement" = "error"
"bun:test/no-unneeded-async-expect-function" = "error"
"bun:test/require-to-throw-message" = "error"
"bun:test/valid-describe-callback" = "error"
"bun:test/valid-expect" = "error"
"bun:test/valid-expect-in-promise" = "error"
# TypeScript already requires a test title to be a string, so titles built
# from variables and expressions are allowed.
"bun:test/valid-title" = ["error", { ignoreTypeOfTestName = true }]

# A file-level declaration that scripts/ci-package-scope.ts reads, not a
# shared helper.
[[lint.overrides]]
files = [
  "scripts/cli-runtime-pack.test.ts",
  "scripts/download-run-artifact.test.ts",
  "scripts/flake-gate.test.ts",
  "scripts/generated-conflicts.test.ts",
  "scripts/precommit-i18n.test.ts",
  "scripts/release-health.test.ts",
]
rules = { "bun:test/no-export" = "off" }
