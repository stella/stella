[install]
linker = "hoisted"
# 5-day quarantine: reject package versions published
# less than 5 days ago to mitigate supply chain attacks.
minimumReleaseAge = 432_000
# First-party @stll packages are on public npm (open source).
# They share a release cadence and would otherwise be blocked
# by the quarantine on every publish cycle.
minimumReleaseAgeExcludes = [
  # Office-format text extraction for search indexing. Opted in ahead
  # of the quarantine window; runs only inside the isolated extraction
  # subprocess, never in the API process. Listed with its platform
  # subpackages per the napi note below.
  "@firecrawl/anydoc", # quarantine-expires: 2026-08-09T15:24:34.170Z
  "@firecrawl/anydoc-darwin-arm64",
  "@firecrawl/anydoc-darwin-x64",
  "@firecrawl/anydoc-linux-arm64-gnu",
  "@firecrawl/anydoc-linux-arm64-musl",
  "@firecrawl/anydoc-linux-x64-gnu",
  "@firecrawl/anydoc-linux-x64-musl",
  "@firecrawl/anydoc-win32-x64-msvc",
  "@stll/oxlint-config",
  "@stll/typescript-config",
  "@stll/aho-corasick-wasm",
  "@stll/anonymize-data",
  "@stll/anonymize-wasm",
  "@stll/docx-core",
  "@stll/folio-agents",
  "@stll/folio-core",
  "@stll/folio-react",
  "@stll/fuzzy-search-wasm",
  "@stll/regex-set-wasm",
  # A napi package must be listed WITH its platform subpackages. They publish
  # in the same minute, but they are optionalDependencies: quarantine one and
  # bun skips it silently, leaving the parent installed with no native binding
  # and every call failing at runtime. Bun matches these names exactly — a
  # `@stll/*` glob is accepted and then ignored.
  "@stll/stdnum",
  "@stll/stdnum-darwin-arm64",
  "@stll/stdnum-darwin-x64",
  "@stll/stdnum-linux-arm64-gnu",
  "@stll/stdnum-linux-x64-gnu",
  "@stll/stdnum-wasm",
  "@stll/stdnum-win32-x64-msvc",
  "@stll/text-search-wasm",
  # Transitive exact pin from @tanstack/ai-openrouter 0.15.10; it ships
  # in lockstep with the quarantined-exempt TanStack AI provider batch.
  "@openrouter/sdk",
  # TanStack AI beta: opted in ahead of stable for the AI SDK migration.
  "@tanstack/ai",
  "@tanstack/ai-anthropic",
  "@tanstack/ai-code-mode",
  "@tanstack/ai-bedrock",
  "@tanstack/ai-client",
  "@tanstack/ai-event-client",
  "@tanstack/ai-gemini",
  "@tanstack/ai-mcp",
  "@tanstack/ai-mistral",
  "@tanstack/ai-openai",
  "@tanstack/ai-openrouter",
  "@tanstack/ai-react",
  "@tanstack/ai-utils",
  "@tanstack/react-ai-devtools",
  # TanStack Table 9 stable was adopted before its release-age window. These
  # exact times are publication time plus the five-day quarantine.
  "@tanstack/react-table", # quarantine-expires: 2026-08-09T06:29:16.564Z
  "@tanstack/table-core", # quarantine-expires: 2026-08-09T06:25:20.965Z
  "@tanstack/react-table-devtools", # quarantine-expires: 2026-08-09T06:22:11.882Z
  "@tanstack/table-devtools", # quarantine-expires: 2026-08-09T06:22:12.725Z
  "@tanstack/openai-base",
  # First patched nanoid 3.x release for GHSA-2v37-7h3g-55p8. Remove after
  # the normal release-age quarantine admits it.
]
